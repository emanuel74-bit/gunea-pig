version: '1.0'
file:
  name: conventions.dependency-taxonomy.yaml
  path: dependencies/conventions.dependency-taxonomy.yaml
  role: dependency_taxonomy_contract
  executability: vocabulary
purpose: Define dependency types, scopes, direction vocabulary, relationship schema, and classification output.
ownership:
  owns:
  - dependency_type_enum
  - dependency_scope_enum
  - dependency_direction_vocabulary
  - dependency_relationship_schema
  - dependency_classification_schema
  - dependency_risk_signals
  does_not_own:
  - import_validation_rules
  - architecture_layer_definitions
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - dependency_taxonomy_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  dependency_type_enum:
    allowed:
    - static_import
    - dynamic_import
    - constructor_injection
    - provider_binding
    - runtime_registration
    - event_publication
    - message_subscription
    - callback_registration
    - configuration_reference
    - test_only_dependency
  dependency_type_definitions:
    static_import:
      definition: Compile-time import/reference between files or modules that affects dependency direction and bundling.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - static_import_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as static import
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the static import case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
    dynamic_import:
      definition: Runtime-loaded import/reference where dependency may be conditional, lazy, or harder to discover statically.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - dynamic_import_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as dynamic import
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the dynamic import case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
    constructor_injection:
      definition: Dependency supplied through constructor parameters, usually DI-managed and explicit at object creation.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - constructor_injection_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as constructor injection
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the constructor injection case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
    provider_binding:
      definition: DI/container binding that maps abstractions/tokens to implementations.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - provider_binding_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as provider binding
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the provider binding case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
    runtime_registration:
      definition: Runtime module/plugin/provider registration that changes behavior without direct import at call site.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - runtime_registration_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as runtime registration
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the runtime registration case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
    event_publication:
      definition: Dependency from publisher to event contract and downstream event consumers.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - event_publication_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as event publication
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the event publication case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
    message_subscription:
      definition: Dependency from consumer to queue/topic/event contract and delivery semantics.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - message_subscription_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as message subscription
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the message subscription case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
    callback_registration:
      definition: Dependency created when code registers callbacks/hooks/listeners into another component or framework.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - callback_registration_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as callback registration
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the callback registration case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
    configuration_reference:
      definition: Dependency on config/env/feature flags/runtime settings.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - configuration_reference_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as configuration reference
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the configuration reference case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
    test_only_dependency:
      definition: Dependency valid only in test scope and forbidden from production paths.
      validation_focus:
      - dependency_direction
      - boundary_legality
      common_risks:
      - invalid_dependency
      detection_signals:
      - test_only_dependency_detected
      - depends_on_external_symbol_or_runtime_binding
      validation_questions:
      - Does this dependency obey layer direction?
      - Does it cross a boundary?
      - Is an abstraction/adapter required?
      choose_when:
      - the dependency relationship is best represented as test only dependency
      reject_when:
      - no actual dependency exists
      - relationship belongs to another dependency type
      validation_rules:
      - must obey dependency direction rules
      - must not introduce forbidden coupling
      meaning: Represents the test only dependency case within the dependency type taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
  dependency_scope_enum:
    allowed:
    - same_artifact
    - same_flow
    - same_module
    - cross_module
    - shared_kernel
    - external_package
    - external_system
    - test_scope
  dependency_direction_vocabulary:
    layer_directions:
    - transport_to_application
    - application_to_domain
    - application_to_port
    - domain_to_domain
    - domain_to_infrastructure
    - domain_to_transport
    - infrastructure_to_port
    - infrastructure_to_external_system
    - test_to_artifact_under_test
    - production_to_test_support
    module_directions:
    - same_module_internal
    - module_to_public_export
    - module_to_private_internal
    - shared_to_feature_specific
    - feature_to_shared
    - cross_module_public_api
  dependency_relationship_schema:
    required_fields:
    - dependency_id
    - dependency_type
    - source_artifact
    - target_artifact
    - source_role
    - target_role
    - source_layer
    - target_layer
    - dependency_scope
    - boundary_crossed
    - direction
  dependency_risk_signals:
    static_import:
      minimum_risk_hint: low
      emits_contexts:
      - implementation_risk
      emits_concerns: []
    dynamic_import:
      minimum_risk_hint: medium
      emits_contexts:
      - implementation_risk
      emits_concerns: []
    constructor_injection:
      minimum_risk_hint: medium
      emits_contexts:
      - implementation_risk
      emits_concerns: []
    provider_binding:
      minimum_risk_hint: medium
      emits_contexts:
      - implementation_risk
      emits_concerns:
      - runtime_wiring
    runtime_registration:
      minimum_risk_hint: medium
      emits_contexts:
      - implementation_risk
      emits_concerns:
      - runtime_wiring
    event_publication:
      minimum_risk_hint: high
      emits_contexts:
      - implementation_risk
      emits_concerns: []
    message_subscription:
      minimum_risk_hint: high
      emits_contexts:
      - implementation_risk
      emits_concerns: []
    callback_registration:
      minimum_risk_hint: medium
      emits_contexts:
      - implementation_risk
      emits_concerns: []
    configuration_reference:
      minimum_risk_hint: medium
      emits_contexts:
      - implementation_risk
      emits_concerns:
      - runtime_wiring
    test_only_dependency:
      minimum_risk_hint: medium
      emits_contexts:
      - implementation_risk
      emits_concerns: []
  semantic_depth_restoration:
    enriched_generic_dependency_definitions: true
  dependency_scope_definitions:
    same_artifact:
      definition: Dependency stays inside a single file/artifact boundary.
      meaning: Represents the same artifact case within the dependency scope taxonomy.
      detection_signals:
      - same artifact signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches same artifact
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - scope must be supported by import/dependency evidence
      - scope determines allowed direction and gate strictness
    same_flow:
      definition: Dependency crosses artifacts within one use-case or execution flow.
      meaning: Represents the same flow case within the dependency scope taxonomy.
      detection_signals:
      - same flow signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches same flow
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - scope must be supported by import/dependency evidence
      - scope determines allowed direction and gate strictness
    same_module:
      definition: Dependency stays inside one feature/module boundary.
      meaning: Represents the same module case within the dependency scope taxonomy.
      detection_signals:
      - same module signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches same module
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - scope must be supported by import/dependency evidence
      - scope determines allowed direction and gate strictness
    cross_module:
      definition: Dependency crosses module boundaries and must obey public API/import rules.
      meaning: Represents the cross module case within the dependency scope taxonomy.
      detection_signals:
      - cross module signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches cross module
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - scope must be supported by import/dependency evidence
      - scope determines allowed direction and gate strictness
    shared_kernel:
      definition: Dependency touches shared kernel/common code and affects multiple consumers.
      meaning: Represents the shared kernel case within the dependency scope taxonomy.
      detection_signals:
      - shared kernel signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches shared kernel
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - scope must be supported by import/dependency evidence
      - scope determines allowed direction and gate strictness
    external_package:
      definition: Dependency on third-party package, SDK, or library.
      meaning: Represents the external package case within the dependency scope taxonomy.
      detection_signals:
      - external package signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches external package
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - scope must be supported by import/dependency evidence
      - scope determines allowed direction and gate strictness
    external_system:
      definition: Dependency on external service, queue, API, database, or infrastructure system.
      meaning: Represents the external system case within the dependency scope taxonomy.
      detection_signals:
      - external system signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches external system
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - scope must be supported by import/dependency evidence
      - scope determines allowed direction and gate strictness
    test_scope:
      definition: Dependency exists only in tests, fixtures, or validation support.
      meaning: Represents the test scope case within the dependency scope taxonomy.
      detection_signals:
      - test scope signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches test scope
      - no more specific vocabulary value applies
      reject_when:
