version: '1.0'
file:
  name: conventions.file-contract.yaml
  path: core/conventions.file-contract.yaml
  role: universal_convention_file_contract
  executability: schema
purpose: Define the normalized mandatory structure, internal section standards, rule object shapes, and deterministic quality
  expectations for every convention YAML file.
ownership:
  owns:
  - universal_file_schema
  - required_top_level_sections
  - executability_levels
  - shared_section_schemas
  - rule_object_standard
  - decision_object_standard
  - validation_section_standard
  - recurring_section_family_schemas
  does_not_own:
  - subsystem_specific_content
  - subsystem_local_vocabulary
  - runtime_execution
  - agent_prompt_text
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - universal_file_contract
dependencies:
  required_files: []
  optional_files: []
sections:
  universal_file_schema:
    required_top_level_sections:
    - version
    - file
    - purpose
    - ownership
    - activation
    - inputs
    - outputs
    - dependencies
    - sections
    - validation
    file_required_fields:
    - name
    - path
    - role
    - executability
    ownership_required_fields:
    - owns
    - does_not_own
    activation_required_fields:
    - mode
    - activates_when
    - skips_when
    inputs_required_fields:
    - required
    - optional
    outputs_required_fields:
    - produces
    dependencies_required_fields:
    - required_files
    - optional_files
    validation_required_fields:
    - required_checks
    - fail_conditions
  executability_levels:
  - vocabulary
  - schema
  - policy
  - rulebook
  - decision_engine
  - validator
  - template_registry
  - runtime_contract
  - runtime_controller
  - advisory_entrypoint
  - advisory_contract
  - artifact_registry
  - contract_registry
  - decision_matrix
  - decision_support
  - detector
  - execution_policy
  - generator_contract
  - graph_contract
  - mapping
  - orchestrator
  - oversight_policy
  - permission_registry
  - placement_affinity_registry
  - prompt_registry
  - registry
  - router
  - runtime_policy
  - schema_and_policy
  - state_builder
  - state_machine
  - state_schema
  standard_decision_object_schema:
    required_fields:
    - id
    - applies_when
    - choose_when
    - reject_when
    - pass_when
    - fail_when
    - fail_condition
    optional_fields:
    - priority
    - severity
    - blocks_before
    - required_evidence
    - emits_triggers
    - required_reports
    - required_phases
    - remediation
    - tie_breakers
  standard_algorithm_step_schema:
    required_fields:
    - step_id
    - action
    optional_fields:
    - input
    - target
    - decision_rules
    - assertion
    - pass_when
    - fail_when
    - output
    - branch
    - emits
  standard_validation_fail_condition_schema:
    required_fields:
    - id
    - condition
    - message
    - severity
    optional_fields:
    - blocks_before
    - remediation
    - owner_subsystem
  forbidden_contract_patterns:
  - side_by_side_restored_source_sections
  - source_only_placeholders
  - undefined_step_references
  - vague_executable_rules_without_conditions
validation:
  required_checks:
  - id: FILE-CONTRACT-CHECK-001
    check: required_top_level_sections_present
    applies_when:
      any_convention_file_loaded: true
  fail_conditions:
  - id: FILE-CONTRACT-001
    condition: required_top_level_section_missing
    message: Convention file is missing a required top-level section.
    severity: error
  - id: FILE-CONTRACT-002
    condition: side_by_side_restored_source_section_present
    message: Restored/canonical source sections must not live beside active sections.
    severity: error
  - id: FILE-CONTRACT-003
    condition: source_only_placeholder_present
    message: Executable sections must contain expanded content, not source-only placeholders.
    severity: error
