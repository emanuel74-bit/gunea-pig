version: '1.0'
file:
  name: conventions.semantic-completeness.yaml
  path: core/conventions.semantic-completeness.yaml
  role: semantic_completeness_quality_contract
  executability: validator
purpose: Define route-enforced semantic completeness rules so convention files, phase bundles, and phase outputs cannot pass
  with placeholders, vague executable content, missing evidence, or shallow completion claims.
ownership:
  owns:
  - semantic_completeness_tiers
  - vague_content_policy
  - decision_rule_completeness_rules
  - algorithm_completeness_rules
  - semantic_failure_conditions
  does_not_own:
  - subsystem_specific_decision_values
  - local_validation_algorithms
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - semantic_completeness_contract
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files:
  - executors/conventions.executor-routes.yaml
sections:
  semantic_completeness_tiers:
    enum_value:
      required:
      - definition_or_pointer_to_active_definition
      fail_when:
      - enum_value_undefined
      - definition_repeats_enum_name_only
    taxonomy_object:
      required:
      - definition
      - positive_signals
      - negative_signals_or_reject_when
      recommended:
      - examples
      - non_examples
      - risk_signals
    decision_object:
      required:
      - applies_when_or_match
      - choose_when_or_pass_when
      - reject_when_or_fail_when
      - fail_condition
      recommended:
      - priority
      - tie_breakers
      - required_evidence
      - blocks_before
    validation_check:
      required:
      - id
      - check_or_rule
      - pass_when
      - fail_when_or_fail_condition
      - severity
      recommended:
      - remediation
      - blocks_before
    algorithm:
      required:
      - ordered_steps
      - explicit_inputs
      - explicit_outputs
      step_required:
      - step_id
      - action
      step_recommended:
      - pass_when
      - fail_when
      - decision_rules
      - output
    schema:
      required:
      - required_fields
      recommended:
      - optional_fields
      - record_shape
      - field_semantics
  vague_content_policy:
    forbidden_in_executable_sections:
    - as appropriate
    - when needed
    - where relevant
    - use best practices
    - handle logic
    - manage things
    - defined elsewhere
    - defined in step
    - 'source: Step'
    - TBD
    - TODO
    - placeholder
    allowed_only_when: backed by structured applies_when/pass_when/fail_when/choose_when/reject_when fields
  semantic_quality_invariants:
  - id: SEMANTIC-INV-001
    rule: Every active vocabulary value must be defined in the active section that owns it.
    fail_condition: active_vocabulary_value_undefined
  - id: SEMANTIC-INV-002
    rule: Every decision engine must contain explicit selection and rejection logic.
    fail_condition: decision_engine_missing_reject_logic
  - id: SEMANTIC-INV-003
    rule: Every validator must define fail conditions and severity.
    fail_condition: validator_missing_fail_conditions
  - id: SEMANTIC-INV-004
    rule: No restored/canonical side sections may coexist with active sections.
    fail_condition: side_by_side_restored_content_detected
  semantic_completeness_enforcement_model:
    runtime_model: executor_route_backed_validation
    required_route: validate_semantic_completeness
    script: scripts/validate-semantic-completeness.ts
    agents_must_not_self_certify_semantic_completeness: true
    phase_bundles_must_surface_completion_contract: true
    phase_outputs_must_provide_evidence_for_completion_claims: true
    topologies_remain_script_facing_not_agent_context: true
  semantic_completion_claim_contract:
    required_when:
    - phase_output_created
    - handoff_prepared
    - mission_completion_requested
    minimum_evidence_fields:
    - completed_requirements
    - evidence_refs
    - validation_refs
    - known_gaps
    fail_when:
    - completion_claim_without_evidence
    - required_output_missing
    - validation_reference_missing
    - known_gap_hidden_or_omitted
    - placeholder_or_todo_content_present
validation:
  required_checks:
  - id: SEMANTIC-CHECK-001
    check: semantic_completeness_tiers_satisfied
    applies_when:
      convention_package_validated: true
  - id: SEMANTIC-CHECK-002
    check: semantic_completeness_executor_route_present
    applies_when:
      executor_routing_enabled: true
  fail_conditions:
  - id: SEMANTIC-001
    condition: active_vocabulary_value_undefined
    message: Active vocabulary value is missing a usable definition.
    severity: error
  - id: SEMANTIC-002
    condition: decision_engine_missing_reject_logic
    message: Decision engine must include rejection/failure logic, not only positive guidance.
    severity: error
  - id: SEMANTIC-003
    condition: vague_executable_wording_without_conditions
    message: Executable rule contains vague wording without structured conditions.
    severity: error
  - id: SEMANTIC-004
    condition: semantic_completeness_route_missing
    message: Semantic completeness must be enforced by the validate_semantic_completeness executor route.
    severity: error
  - id: SEMANTIC-005
    condition: completion_claim_without_evidence
    message: Phase or mission completion claims require evidence, validation references, and explicit known-gap disclosure.
    severity: error
