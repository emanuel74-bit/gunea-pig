version: '1.0'
file:
  name: conventions.core.yaml
  path: core/conventions.core.yaml
  role: core_subsystem_entrypoint
  executability: advisory_entrypoint
purpose: 'Provide the authoritative entrypoint for the convention system core: file contracts, lookup index, authority boundaries,
  pipeline laws, output schemas, semantic completeness, validation, integration, and script-delegation policy.'
ownership:
  owns:
  - core_subsystem_metadata
  - core_file_index
  - core_local_execution_order
  - core_authority_boundary_summary
  - system_integration_contract
  does_not_own:
  - subsystem_local_rules
  - phase_agent_work
  - runtime_phase_execution
  - technology_specific_adapter_content
  - implementation_content
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - core_subsystem_contract
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files:
  - core/conventions.file-contract.yaml
  - core/conventions.index.yaml
  - core/conventions.authority-boundaries.yaml
  - core/conventions.integration-contract.yaml
  - core/conventions.pipeline-contract.yaml
  - core/conventions.output-schema.yaml
  - core/conventions.semantic-completeness.yaml
  - core/conventions.validation.yaml
  - core/conventions.script-delegation-policy.yaml
sections:
  core_file_index:
    conventions.core.yaml: core/conventions.core.yaml
    conventions.file-contract.yaml: core/conventions.file-contract.yaml
    conventions.index.yaml: core/conventions.index.yaml
    conventions.authority-boundaries.yaml: core/conventions.authority-boundaries.yaml
    conventions.integration-contract.yaml: core/conventions.integration-contract.yaml
    conventions.pipeline-contract.yaml: core/conventions.pipeline-contract.yaml
    conventions.output-schema.yaml: core/conventions.output-schema.yaml
    conventions.semantic-completeness.yaml: core/conventions.semantic-completeness.yaml
    conventions.validation.yaml: core/conventions.validation.yaml
    conventions.script-delegation-policy.yaml: core/conventions.script-delegation-policy.yaml
  core_local_execution_order:
  - load_file_contract
  - load_index
  - load_authority_boundaries
  - load_integration_contract
  - load_pipeline_contract
  - load_output_schema
  - load_semantic_completeness
  - load_validation
  - load_script_delegation_policy
  core_authority_boundary_summary:
    core_owns: global contracts, source lookup, cross-subsystem invariants, semantic quality standard, validation aggregation
    subsystems_own: their local vocabularies, decisions, algorithms, schemas, and validators
    alpha_owns: runtime scheduling, phase activation, prompt injection, mission-state mutation, and gate/handoff/trigger/revision
      orchestration
    phase_agents_own: phase-specific reasoning and required report production only
  system_integration_contract:
    all_subsystems_must:
    - follow core file contract
    - declare ownership boundaries
    - consume other subsystems by reference
    - not duplicate external authority
    - emit outputs through report registry when phase-facing
    core_must_not:
    - perform local subsystem decisions
    - override specialized validators
    - act as Alpha runtime
validation:
  required_checks:
  - id: CORE-ENTRY-CHECK-001
    check: all_core_files_exist
    applies_when:
      core_loaded: true
  fail_conditions:
  - id: CORE-ENTRY-001
    condition: core_required_file_missing
    message: Every core file referenced by the core entrypoint must exist.
    severity: error
