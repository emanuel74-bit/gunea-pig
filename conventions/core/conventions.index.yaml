  lookup_rules:
    match_decision_rules:
    - id: LOOKUP-BY-CONCEPT
      match:
        request_type: concept_lookup
      decision:
        return_entries_where: provides.concepts contains requested concept
        fail_when:
        - no_index_entry_provides_concept
    - id: LOOKUP-BY-SUBSYSTEM
      match:
        request_type: subsystem_lookup
      decision:
        return_entries_where: subsystem equals requested subsystem
        fail_when:
        - no_index_entry_for_subsystem
validation:
  required_checks: []
  fail_conditions: []
