version: '1.0'
file:
  name: conventions.index.yaml
  path: core/conventions.index.yaml
  role: convention_source_lookup_index
  executability: router
purpose: Provide the deterministic source-of-truth lookup index for every subsystem file, major concept, validator, schema,
  and runtime integration point.
ownership:
  owns:
  - subsystem_file_index
  - concept_to_source_file_lookup
  - canonical_source_lookup
  - validator_lookup
  - schema_lookup
  - runtime_lookup
  - index_validation_rules
  does_not_own:
  - runtime_scheduling
  - phase_activation
  - local_subsystem_decisions
  - file_content_definitions
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - file_index
  - concept_lookup
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
  file_index_schema:
    required_fields:
    - file_id
    - file_path
    - subsystem
    - file_role
    - executability
    - provides
  subsystem_file_index:
