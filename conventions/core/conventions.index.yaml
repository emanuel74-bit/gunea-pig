version: '2.0'
file:
  name: conventions.index.yaml
  path: core/conventions.index.yaml
  role: lightweight_convention_routing_index
  executability: router
purpose: Provide lightweight discovery, routing, and loading metadata for the convention package without duplicating concept ownership or semantic
  authority.
ownership:
  owns:
  - convention_routing_index
  - subsystem_entrypoint_map
  - loading_group_map
  - dependency_route_hints
  - index_scope_rules
  does_not_own:
  - concept_authority_index
  - concept_definitions
  - schema_definitions
  - runtime_artifact_identity
  - subsystem_local_rules
  - validation_catalogs
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional:
  - parsed_convention_file_list
outputs:
  produces:
  - subsystem_entrypoint_map
  - loading_group_map
  - dependency_route_hints
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files:
  - reports/conventions.runtime-artifacts.yaml
  - executors/conventions.executors.yaml
  - scripts/conventions.scripts.yaml
sections:
  index_scope:
    primary_question: where_should_the_agent_or_loader_go_next
    allowed_content:
    - subsystem paths
    - entrypoints
    - file counts
    - loading groups
    - dependency route hints
    forbidden_content:
    - concept ownership
    - full concept lookup tables
    - schema bodies
    - validator catalogs
    - runtime artifact identity records
    - subsystem rule definitions
  subsystem_entrypoint_map:
  - subsystem_id: actions
    path: actions/
    entrypoint: actions/conventions.actions.yaml
    file_count: 5
    load_priority: on_demand
  - subsystem_id: agents
    path: agents/
    entrypoint: agents/conventions.agents.yaml
    file_count: 9
    load_priority: on_demand
  - subsystem_id: architecture
    path: architecture/
    entrypoint: architecture/conventions.architecture.yaml
    file_count: 3
    load_priority: on_demand
  - subsystem_id: boundaries
    path: boundaries/
    entrypoint: boundaries/conventions.boundaries.yaml
    file_count: 6
    load_priority: on_demand
  - subsystem_id: contracts
    path: contracts/
    entrypoint: contracts/conventions.contracts.yaml
    file_count: 5
    load_priority: on_demand
  - subsystem_id: core
    path: core/
    entrypoint: core/conventions.core.yaml
    file_count: 9
    load_priority: always
  - subsystem_id: dependencies
    path: dependencies/
    entrypoint: dependencies/conventions.dependencies.yaml
    file_count: 7
    load_priority: on_demand
  - subsystem_id: execution
    path: execution/
    entrypoint: execution/conventions.execution.yaml
    file_count: 8
    load_priority: on_demand
  - subsystem_id: executors
    path: executors/
    entrypoint: executors/conventions.executors.yaml
    file_count: 5
    load_priority: on_demand
  - subsystem_id: gates
    path: gates/
    entrypoint: gates/conventions.gates.yaml
    file_count: 4
    load_priority: on_demand
  - subsystem_id: handoffs
    path: handoffs/
    entrypoint: handoffs/conventions.handoffs.yaml
    file_count: 4
    load_priority: on_demand
  - subsystem_id: missions
    path: missions/
    entrypoint: missions/conventions.missions.yaml
    file_count: 7
    load_priority: on_demand
  - subsystem_id: multi-agent
    path: multi-agent/
    entrypoint: multi-agent/conventions.multi-agent.yaml
    file_count: 8
    load_priority: on_demand
  - subsystem_id: package
    path: ''
    entrypoint: PACKAGE_MANIFEST.yaml
    file_count: 2
    load_priority: on_demand
  - subsystem_id: patterns
    path: patterns/
    entrypoint: patterns/conventions.patterns.yaml
    file_count: 5
    load_priority: on_demand
  - subsystem_id: phases
    path: phases/
    entrypoint: phases/conventions.phases.yaml
    file_count: 6
    load_priority: on_demand
  - subsystem_id: planning
    path: planning/
    entrypoint: planning/conventions.planning.yaml
    file_count: 8
    load_priority: on_demand
  - subsystem_id: refactoring
    path: refactoring/
    entrypoint: refactoring/conventions.refactoring.yaml
    file_count: 7
    load_priority: on_demand
  - subsystem_id: reports
    path: reports/
    entrypoint: reports/conventions.reports.yaml
    file_count: 10
    load_priority: on_demand
  - subsystem_id: revisions
    path: revisions/
    entrypoint: revisions/conventions.revisions.yaml
    file_count: 6
    load_priority: on_demand
  - subsystem_id: risk
    path: risk/
    entrypoint: risk/conventions.risk.yaml
    file_count: 7
    load_priority: on_demand
  - subsystem_id: roles
    path: roles/
    entrypoint: roles/conventions.roles.yaml
    file_count: 5
    load_priority: on_demand
  - subsystem_id: scripts
    path: scripts/
    entrypoint: scripts/conventions.scripts.yaml
    file_count: 1
    load_priority: on_demand
  - subsystem_id: testing
    path: testing/
    entrypoint: testing/conventions.testing.yaml
    file_count: 7
    load_priority: on_demand
  - subsystem_id: triggers
    path: triggers/
    entrypoint: triggers/conventions.triggers.yaml
    file_count: 6
    load_priority: on_demand
  loading_groups:
    bootstrap_minimal:
    - core/conventions.file-contract.yaml
    - core/conventions.core.yaml
    - core/conventions.index.yaml
    validation_minimal:
    - core/conventions.file-contract.yaml
    - core/conventions.validation.yaml
    - reports/conventions.runtime-artifacts.yaml
    mission_runtime:
    - missions/conventions.missions.yaml
    - multi-agent/conventions.multi-agent.yaml
    - execution/conventions.execution.yaml
    - reports/conventions.reports.yaml
    executor_runtime_minimal:
    - executors/conventions.executors.yaml
    - executors/conventions.executor-contract.yaml
    - executors/conventions.executor-routes.yaml
    - executors/conventions.executor-lifecycle.yaml
    - executors/conventions.executor-failures.yaml
    - scripts/conventions.scripts.yaml
  dependency_route_hints:
    required_dependency_edges_count: 533
    rule: Dependency edges are discovered from each file dependencies.required_files and should not be expanded into a full semantic graph inside
      the index.
  authority_boundary:
    concept_ownership_source: distributed ownership.owns declarations inside individual convention files
    compiled_authority_registry: generated by executor routes/scripts from distributed ownership declarations
    index_relationship: index may point to the authority registry contract but must not duplicate authority entries
validation:
  must_pass:
  - all_entrypoints_exist
  - loading_group_files_exist
  - no_concept_ownership_entries_in_index
  - no_full_schema_or_validator_catalogs_in_index
  fail_conditions:
  - index_declares_concept_owner
  - index_duplicates_authority_registry
  - index_embeds_runtime_artifact_registry
  - entrypoint_missing
