version: '1.0'
file:
  name: conventions.index.yaml
  path: core/conventions.index.yaml
  role: convention_source_lookup_index
  executability: router
purpose: Provide a deterministic lookup index for source-of-truth vocabulary, validators, schemas, phases, agents, mission
  profiles, and reports.
ownership:
  owns:
  - concept_to_source_file_lookup
  - subsystem_file_index
  - output_schema_lookup
  - validator_lookup
  - phase_to_contract_lookup
  - agent_to_contract_lookup
  does_not_own:
  - runtime_phase_activation
  - active_phase_plan
  - phase_scheduling
  - agent_activation
activation:
  mode: reference_only
  activates_when:
  - agent_needs_vocabulary_source
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - convention_lookup_result
  - file_index
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
