  index_usage_policy:
    agents_use_index_to: locate vocabulary or validator sources before loading large context
    alpha_uses_index_to: resolve required subsystem validators and phase bundle convention paths
    index_must_not: decide phase order or override subsystem authority
validation:
  required_checks:
  - id: INDEX-CHECK-001
    check: indexed_files_exist
    applies_when:
      index_loaded: true
  fail_conditions:
  - id: INDEX-001
    condition: indexed_file_missing
    message: Every file listed in the core index must exist.
    severity: error
  - id: INDEX-002
    condition: canonical_concept_has_multiple_authorities
    message: A canonical concept must resolve to one source-of-truth file unless explicitly marked composite.
    severity: error
