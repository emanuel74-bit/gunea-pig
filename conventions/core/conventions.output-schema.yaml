version: '1.0'
file:
  name: conventions.output-schema.yaml
  path: core/conventions.output-schema.yaml
  role: shared_output_schema_contract
  executability: schema
purpose: Define shared primitive schemas and cross-subsystem output record shapes used by reports, phase bundles, validation
  results, decisions, evidence, gates, triggers, handoffs, revisions, and mission state.
ownership:
  owns:
  - shared_primitives
  - evidence_reference_schema
  - validation_result_schema
  - phase_bundle_schema_reference
  - runtime_result_schemas
  - schema_reference_policy
  - validation_output_schema
  does_not_own:
  - local_report_registry
  - local_subsystem_vocabularies
  - template_content
  - agent_prompt_content
  consumes:
  - decision_record_schema
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - shared_output_schema_registry
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
  shared_primitives:
    id: non_empty_string_stable_within_file
    file_path: relative_path_from_convention_or_workspace_root
    phase_id: must_exist_in_phase_taxonomy_when phase-facing
    agent_id: must_exist_in_agent_taxonomy_when agent-facing
    report_id: must_exist_in_report_registry_when report-facing
    evidence_refs: array_of_evidence_reference_records_or_no_evidence_marker
  decision_record_schema:
    required_fields:
    - decision_id
    - decision_type
    - selected_value
    - reason_summary
    - evidence_refs
    optional_fields:
    - rejected_values
    - confidence
    - invalidates
    - emits_triggers
    - required_followups
  evidence_reference_schema:
    required_fields:
    - evidence_ref_id
    - source_file
    - supports
    optional_fields:
    - source_record_id
    - source_path
    - source_lines
    - confidence
    - notes
  validation_result_schema: &id001
    required_fields:
    - validator_id
    - status
    - checked_items
    - failures
    optional_fields:
    - warnings
    - remediation
    - blocks_before
    - evidence_refs
  gate_result_schema_reference: gates/conventions.gate-taxonomy.yaml#gate_result_schema
  trigger_record_schema_reference: triggers/conventions.trigger-taxonomy.yaml#trigger_record_schema
  handoff_record_schema_reference: handoffs/conventions.handoff-schema.yaml#handoff_record_schema
  revision_request_schema_reference: revisions/conventions.revision-taxonomy.yaml#revision_request_schema
  phase_bundle_schema_reference: multi-agent/conventions.phase-bundle-policy.yaml#phase_bundle_schema
  schema_reference_policy:
  - id: SCHEMA-REF-001
    rule: Core may reference specialized schemas but must not duplicate their full local authority.
    fail_condition: core_redefines_specialized_schema
  - id: SCHEMA-REF-002
    rule: Cross-subsystem outputs must include stable ids, owner, lifecycle/status when relevant, and evidence or explicit
      no-evidence marker.
    fail_condition: output_record_missing_traceability
  validation_output_schema: *id001
validation:
  required_checks:
  - id: OUTPUT-SCHEMA-CHECK-001
    check: shared_output_records_have_traceability
    applies_when:
      outputs_produced: true
  fail_conditions:
  - id: OUTPUT-SCHEMA-001
    condition: output_record_missing_traceability
    message: Shared output record lacks stable id, owner/status/lifecycle, or evidence marker.
    severity: error
