version: '1.0'
file:
  name: conventions.validation.yaml
  path: core/conventions.validation.yaml
  role: global_validation_aggregation_contract
  executability: validator
purpose: Aggregate global validation expectations and delegate mechanical validation to executor routes/scripts instead of
  manual authority registries.
ownership:
  owns:
  - validation_taxonomy
  - validation_routing_matrix
  - global_validation_algorithm
  - package_validation_policy
  - runtime_validation_policy
  - failure_severity_semantics
  - remediation_routing
  does_not_own:
  - specialized_local_validation_logic
  - runtime_state_mutation
  - report_content_generation
  - executor_route_implementation
  - manual_authority_registry
  - manual_authority_boundary_files
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - global_validation_contract
  - validation_routing_matrix
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - core/conventions.index.yaml
  - core/conventions.semantic-completeness.yaml
  - executors/conventions.executor-routes.yaml
  - executors/conventions.executor-contract.yaml
  optional_files: []
sections:
  validation_status_enum:
  - pending
  - passed
  - passed_with_warnings
  - failed
  - blocked
  - not_applicable
  severity_semantics:
    info: record_only
    warning: record_and_continue_unless_policy_blocks
    error: block_current_gate_or_validation_scope
    blocking: block_runtime_progress_until_resolved
  validation_routing_matrix:
    PACKAGE_MANIFEST_CORE.yaml:
      validator_source: null
      entrypoint: PACKAGE_MANIFEST_CORE.yaml
    VALIDATION_REPORT_CORE.yaml:
      validator_source: null
      entrypoint: VALIDATION_REPORT_CORE.yaml
    actions:
      validator_source: null
      entrypoint: actions/conventions.actions.yaml
    agents:
      validator_source: agents/conventions.agent-validation.yaml
      entrypoint: agents/conventions.agents.yaml
    architecture:
      validator_source: null
      entrypoint: architecture/conventions.architecture.yaml
    boundaries:
      validator_source: boundaries/conventions.boundary-validation.yaml
      entrypoint: boundaries/conventions.boundaries.yaml
    contracts:
      validator_source: null
      entrypoint: contracts/conventions.contracts.yaml
    dependencies:
      validator_source: dependencies/conventions.dependency-validation.yaml
      entrypoint: dependencies/conventions.dependencies.yaml
    execution:
      validator_source: execution/conventions.execution-validation.yaml
      entrypoint: execution/conventions.execution.yaml
    gates:
      validator_source: gates/conventions.gate-validation.yaml
      entrypoint: gates/conventions.gates.yaml
    handoffs:
      validator_source: handoffs/conventions.handoff-validation.yaml
      entrypoint: handoffs/conventions.handoffs.yaml
    missions:
      validator_source: missions/conventions.mission-validation.yaml
      entrypoint: missions/conventions.missions.yaml
    multi-agent:
      validator_source: multi-agent/conventions.multi-agent-validation.yaml
      entrypoint: multi-agent/conventions.multi-agent.yaml
    patterns:
      validator_source: null
      entrypoint: patterns/conventions.patterns.yaml
    phases:
      validator_source: phases/conventions.phase-validation.yaml
      entrypoint: phases/conventions.phases.yaml
    planning:
      validator_source: null
      entrypoint: planning/conventions.planning.yaml
    refactoring:
      validator_source: refactoring/conventions.refactor-validation.yaml
      entrypoint: refactoring/conventions.refactoring.yaml
    reports:
      validator_source: reports/conventions.report-validation.yaml
      entrypoint: reports/conventions.reports.yaml
    revisions:
      validator_source: revisions/conventions.invalidation-policy.yaml
      entrypoint: revisions/conventions.revisions.yaml
    risk:
      validator_source: risk/conventions.risk-validation.yaml
      entrypoint: risk/conventions.risk.yaml
    roles:
      validator_source: null
      entrypoint: roles/conventions.roles.yaml
    testing:
      validator_source: testing/conventions.test-validation.yaml
      entrypoint: testing/conventions.testing.yaml
    triggers:
      validator_source: triggers/conventions.trigger-validation.yaml
      entrypoint: triggers/conventions.triggers.yaml
  global_validation_algorithm:
  - step_id: LOAD_CORE_CONTRACTS
    action: read
    input:
    - file_contract
    - index
    - semantic_completeness
    - executor_routes
  - step_id: VALIDATE_EXECUTOR_ROUTES
    action: execute_route
    input: validate_executor_routes
    fail_when:
    - executor_route_validation_failed
  - step_id: COMPILE_AUTHORITY_TOPOLOGY
    action: execute_route
    input: compile_authority_topology
    fail_when:
    - authority_topology_compilation_failed
  - step_id: VALIDATE_AUTHORITY_TOPOLOGY
    action: execute_route
    input: validate_authority_topology
    fail_when:
    - authority_topology_validation_failed
  - step_id: VALIDATE_REFERENCES
    action: execute_route
    input: validate_references
    fail_when:
    - reference_validation_failed
  - step_id: COMPILE_RUNTIME_ARTIFACT_TOPOLOGY
    action: execute_route
    input: compile_runtime_artifact_topology
    fail_when:
    - runtime_artifact_topology_compilation_failed
  - step_id: VALIDATE_RUNTIME_ARTIFACTS
    action: execute_route
    input: validate_runtime_artifacts
    fail_when:
    - runtime_artifact_validation_failed
  - step_id: VALIDATE_FILE_CONTRACTS
    action: for_each
    target: all_convention_files
    decision_rules:
    - file_contract_required_sections
  - step_id: RUN_SPECIALIZED_VALIDATORS
    action: route
    input: validation_routing_matrix
    output: subsystem_validation_results
  - step_id: VALIDATE_SEMANTIC_COMPLETENESS
    action: execute_route
    input: validate_semantic_completeness
    fail_when:
    - semantic_completeness_validation_failed
  - step_id: AGGREGATE_RESULTS
    action: calculate
    fail_when:
    - any_error_or_blocking_failure
  package_validation_policy:
    must_pass:
    - yaml_parse
    - file_contract
    - executor_routes
    - authority_topology
    - references
    - runtime_artifacts
    - semantic_completeness
    - subsystem_validation_routing
    fail_closed: true
  runtime_validation_policy:
    alpha_must_consume:
    - gates
    - triggers
    - handoffs
    - revisions
    - reports
    - missions
    - agents
    - phases
    - risk
    final_validation_requires: no_errors_no_blocking_failures_no_unresolved_state
  executor_route_validation_policy:
    mechanical_validation_must_use_executor_routes: true
    forbidden:
    - manual_authority_registry_validation
    - manual_authority_boundary_validation
    - direct_script_selection_by_agents
    required_routes:
    - validate_executor_routes
    - compile_authority_topology
    - validate_authority_topology
    - validate_references
    - compile_runtime_artifact_topology
    - validate_runtime_artifacts
    - validate_changed_files
    - validate_semantic_completeness
  required_executor_routes:
    before_mission_complete:
    - collect_evidence
    - validate_report_evidence
    - generate_final_mission_report
validation:
  required_checks:
  - id: GLOBAL-VALIDATION-CHECK-001
    check: validation_routing_targets_exist
    applies_when:
      validation_run: true
  - report_generation_routes_are_present
  - final_report_is_evidence_backed
  fail_conditions:
  - id: GLOBAL-VALIDATION-001
    condition: validation_route_missing_validator
    message: Validation routing points to a missing validator file.
    severity: error
  - id: GLOBAL-VALIDATION-002
    condition: global_validation_passed_with_blocking_failure
    message: Global validation cannot pass with any blocking failure.
    severity: error
  - id: GLOBAL-VALIDATION-003
    condition: required_executor_route_missing
    message: Global validation requires all foundational executor routes to exist and resolve centrally.
    severity: error
