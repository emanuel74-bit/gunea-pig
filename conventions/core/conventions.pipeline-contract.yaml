version: '1.0'
file:
  name: conventions.pipeline-contract.yaml
  path: core/conventions.pipeline-contract.yaml
  role: global_pipeline_law_contract
  executability: policy
purpose: Define global pipeline laws, invariant ordering constraints, fail-closed execution rules, and cross-phase lifecycle
  constraints without owning phase contracts or Alpha scheduling internals.
ownership:
  owns:
  - global_pipeline_laws
  - pipeline_invariants
  - phase_dependency_edge_policy
  - implementation_barrier_policy
  - final_validation_barrier_policy
  - pipeline_violation_policy
  does_not_own:
  - mission_profile_phase_selection
  - alpha_next_phase_scheduling
  - local_phase_contracts
  - gate_check_catalog
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - global_pipeline_contract
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - core/conventions.authority-boundaries.yaml
  optional_files: []
sections:
  global_pipeline_laws:
  - id: PIPELINE-LAW-001
    law: Decomposition precedes structure.
    fail_condition: structure_rendered_before_architecture_decomposition
  - id: PIPELINE-LAW-002
    law: Draft roles precede action resolution and final roles follow action resolution.
    fail_condition: final_roles_assigned_before_actions
  - id: PIPELINE-LAW-003
    law: Pattern pressure precedes pattern selection; NoPattern remains valid default.
    fail_condition: pattern_selected_without_pressure_or_justification
  - id: PIPELINE-LAW-004
    law: Implementation cannot begin before required planning reports, tests, sequence, checkpoints, triggers, and pre-implementation
      gate are resolved.
    fail_condition: implementation_started_before_pre_implementation_gate
  - id: PIPELINE-LAW-005
    law: Final validation cannot pass with missing reports, unresolved triggers, open revisions, consumed invalidated outputs,
      or failed required gates.
    fail_condition: final_validation_passed_with_unresolved_runtime_state
  - id: PIPELINE-LAW-006
    law: Every phase output must be persisted to declared report files; chat output cannot satisfy required reports.
    fail_condition: phase_output_only_in_chat
  pipeline_invariants:
    fail_closed_default: true
    single_runtime_authority: multi-agent Alpha controller
    single_phase_owner_required: true
    required_reports_are_durable_files: true
    invalidated_outputs_not_consumable: true
    scriptable_mechanical_checks_prefer_scripts_when_available: true
  phase_dependency_edge_policy:
    source_of_truth: phases/conventions.phase-dependencies.yaml
    core_enforces: global invariant that active phase plans must not violate dependency edges
    core_does_not_own: the detailed edge list
  implementation_barrier_policy:
    requires:
    - pre_implementation_gate_passed
    - no_active_blocking_triggers
    - no_open_blocking_revisions
    - required_reports_valid
    - test_plan_valid
    - implementation_sequence_valid
    - checkpoint_plan_valid
  final_validation_barrier_policy:
    requires:
    - report_artifact_validation_passed
    - mission_state_valid
    - all_required_phases_accounted_for
    - all_required_gates_passed_or_validly_skipped
    - no_unresolved_blockers
validation:
  required_checks:
  - id: PIPELINE-CHECK-001
    check: global_pipeline_invariants_hold
    applies_when:
      mission_active: true
  fail_conditions:
  - id: PIPELINE-001
    condition: implementation_started_before_pre_implementation_gate
    message: Implementation cannot start before pre-implementation gate passes.
    severity: error
  - id: PIPELINE-002
    condition: final_validation_passed_with_unresolved_runtime_state
    message: Final validation cannot pass with unresolved reports, triggers, revisions, invalidations, blockers, or failed
      gates.
    severity: error
