version: '1.0'
file:
  name: conventions.pipeline-contract.yaml
  path: core/conventions.pipeline-contract.yaml
  role: canonical_pipeline_semantics_contract
  executability: orchestrator
purpose: Define global pipeline laws, phase dependency constraints, cross-phase invariants, and pipeline validation algorithm.
ownership:
  owns:
  - global_pipeline_laws
  - phase_dependency_constraints
  - pipeline_validation_algorithm
  does_not_own:
  - runtime_phase_scheduling
  - agent_permissions
  - implementation_content
activation:
  mode: always
  activates_when:
  - code_design_or_execution_request_received
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - pipeline_contract_constraints
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - core/conventions.output-schema.yaml
  - phases/conventions.phase-taxonomy.yaml
  optional_files: []
sections:
  global_pipeline_laws:
    absolute_rules:
    - id: PIPELINE-ABS-001
      rule: Behavior must be understood before design or implementation decisions.
      fail_condition: design_started_without_behavior_contract
    - id: PIPELINE-ABS-002
      rule: Implementation cannot start before pre_implementation_gate passes.
      fail_condition: implementation_started_before_pre_implementation_gate
    - id: PIPELINE-ABS-003
      rule: Mission profiles may configure phases but must not define new phases.
      fail_condition: mission_profile_defines_unknown_phase
  phase_dependency_constraints:
    dependency_edges:
    - edge_id: EDGE-MISSION-PROFILE-SELECTION-BEFORE-MISSION-INITIALIZATION
      source_phase: mission_profile_selection
      target_phase: mission_initialization
      constraint_type: requires_before
      applies_when:
        source_phase_active: true
        target_phase_active: true
      required_output_from_source: mission_profile_selection_output
      target_required_input: mission_profile_selection_output
      fail_condition: mission_initialization_started_without_mission_profile_selection
      severity: error
    - edge_id: EDGE-MISSION-INITIALIZATION-BEFORE-ACTIVE-CONTEXT-MANIFEST
      source_phase: mission_initialization
      target_phase: active_context_manifest
      constraint_type: requires_before
      applies_when:
        source_phase_active: true
        target_phase_active: true
      required_output_from_source: mission_initialization_output
      target_required_input: mission_initialization_output
      fail_condition: active_context_manifest_started_without_mission_initialization
      severity: error
    - edge_id: EDGE-ACTIVE-CONTEXT-MANIFEST-BEFORE-BEHAVIOR-CONTRACT
      source_phase: active_context_manifest
      target_phase: behavior_contract
      constraint_type: requires_before
      applies_when:
        source_phase_active: true
        target_phase_active: true
      required_output_from_source: active_context_manifest_output
      target_required_input: active_context_manifest_output
      fail_condition: behavior_contract_started_without_active_context_manifest
      severity: error
    - edge_id: EDGE-BEHAVIOR-CONTRACT-BEFORE-CODEBASE-RECONNAISSANCE
      source_phase: behavior_contract
      target_phase: codebase_reconnaissance
      constraint_type: requires_before
      applies_when:
        source_phase_active: true
        target_phase_active: true
      required_output_from_source: behavior_contract_output
      target_required_input: behavior_contract_output
      fail_condition: codebase_reconnaissance_started_without_behavior_contract
      severity: error
    - edge_id: EDGE-CODEBASE-RECONNAISSANCE-BEFORE-LOCAL-ALIGNMENT
      source_phase: codebase_reconnaissance
      target_phase: local_alignment
      constraint_type: requires_before
      applies_when:
        source_phase_active: true
        target_phase_active: true
      required_output_from_source: codebase_reconnaissance_output
      target_required_input: codebase_reconnaissance_output
      fail_condition: local_alignment_started_without_codebase_reconnaissance
