      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - public_type_contract_shape_changed
      - public_type_contract_consumer_visible_semantics_changed
      compatibility_questions:
