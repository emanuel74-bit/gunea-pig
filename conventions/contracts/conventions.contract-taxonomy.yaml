version: '1.0'
file:
  name: conventions.contract-taxonomy.yaml
  path: contracts/conventions.contract-taxonomy.yaml
  role: contract_taxonomy_contract
  executability: vocabulary
purpose: Define contract types, stability levels, consumer types, consumer knowledge, and contract classification outputs.
ownership:
  owns:
  - contract_type_enum
  - contract_definitions
  - contract_stability_levels
  - contract_consumer_types
  - consumer_knowledge_enum
  - contract_risk_signals
  does_not_own:
  - compatibility_strategy_selection
  - breaking_change_detection
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - contract_taxonomy_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  contract_type_enum:
    allowed:
    - request_contract
    - response_contract
    - api_contract
    - event_contract
    - port_contract
    - module_contract
    - public_type_contract
    - persistence_contract
    - configuration_contract
  contract_definitions:
    request_contract:
      definition: Consumer-visible input shape and semantics required by an operation, API, handler, command, or message consumer.
      owner: request_contract_owner
      consumer_types:
      - internal_module
      boundary_types:
      - module
      stability_default: internal_stable
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - request_contract_shape_changed
      - request_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
    response_contract:
      definition: Consumer-visible output shape and semantics returned by an operation, API, handler, query, or message producer.
      owner: response_contract_owner
      consumer_types:
      - internal_module
      boundary_types:
      - module
      stability_default: internal_stable
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - response_contract_shape_changed
      - response_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
    api_contract:
      definition: Stable agreement exposed by an HTTP/RPC/GraphQL/SDK/module API, including methods, paths, params, auth and
        error semantics.
      owner: api_contract_owner
      consumer_types:
      - external_consumer
      - frontend_consumer
      - sdk_consumer
      boundary_types:
      - public_api
      - transport
      stability_default: external_public
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - api_contract_shape_changed
      - api_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
    event_contract:
      definition: Stable agreement for emitted or consumed events/messages, including payload, version, ordering, idempotency
        and compatibility.
      owner: event_contract_owner
      consumer_types:
      - worker
      - downstream_service
      boundary_types:
      - integration_event
      - message_queue
      stability_default: durable_versioned
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - event_contract_shape_changed
      - event_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
    port_contract:
      definition: Interface/port that defines how application/domain code depends on infrastructure or external capabilities.
      owner: port_contract_owner
      consumer_types:
      - internal_module
      boundary_types:
      - module
      stability_default: internal_stable
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - port_contract_shape_changed
      - port_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
    module_contract:
      definition: Public exports and allowed imports for a module; internal files are not part of the contract.
      owner: module_contract_owner
      consumer_types:
      - internal_module
      boundary_types:
      - module
      stability_default: internal_stable
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - module_contract_shape_changed
      - module_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
    public_type_contract:
      definition: Type/interface/class exported for consumers where field/name/semantics changes may be breaking.
      owner: public_type_contract_owner
      consumer_types:
      - internal_module
      boundary_types:
      - module
      stability_default: internal_stable
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - public_type_contract_shape_changed
      - public_type_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
    persistence_contract:
      definition: Stored data shape, repository semantics, migration compatibility, and read/write invariants.
      owner: persistence_contract_owner
      consumer_types:
      - internal_module
      boundary_types:
      - module
      stability_default: internal_stable
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - persistence_contract_shape_changed
      - persistence_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
    configuration_contract:
      definition: Environment/configuration keys, defaults, validation rules, and runtime wiring assumptions.
      owner: configuration_contract_owner
      consumer_types:
      - internal_module
      boundary_types:
      - module
      stability_default: internal_stable
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - configuration_contract_shape_changed
      - configuration_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
  contract_stability_levels:
    internal_unstable:
      definition: internal_unstable
      compatibility_required: false
    internal_stable:
      definition: internal_stable
      compatibility_required: true
    module_public:
      definition: module_public
      compatibility_required: true
    external_public:
      definition: external_public
      compatibility_required: true
    durable_versioned:
      definition: durable_versioned
      compatibility_required: true
  contract_consumer_types:
    internal_artifact:
      definition: internal_artifact is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    internal_module:
      definition: internal_module is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    shared_module:
      definition: shared_module is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    frontend_consumer:
      definition: frontend_consumer is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    external_consumer:
      definition: external_consumer is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    sdk_consumer:
      definition: sdk_consumer is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    downstream_service:
      definition: downstream_service is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    worker:
      definition: worker is a consumer category that may depend on a contract and therefore may require compatibility review
        when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    repository:
      definition: repository is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    migration:
      definition: migration is a consumer category that may depend on a contract and therefore may require compatibility review
        when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    projection:
      definition: projection is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    read_model:
      definition: read_model is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    runtime_system:
      definition: runtime_system is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    operations:
      definition: operations is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
    test_consumer:
      definition: test_consumer is a consumer category that may depend on a contract and therefore may require compatibility
        review when that contract changes.
      must_record:
      - knowledge_level
      - affected_contracts
      - migration_need
  consumer_knowledge_enum:
    allowed:
    - none
    - all_known
    - partially_known
    - unknown
  contract_change_type_enum:
    allowed:
    - none
    - additive
    - behavioral
    - breaking
    - unknown
  contract_risk_signals:
    request_contract:
      minimum_risk_hint: medium
      emits_concerns:
      - behavior
      emits_contexts:
      - change_risk
    response_contract:
      minimum_risk_hint: medium
      emits_concerns:
      - behavior
      emits_contexts:
      - change_risk
    api_contract:
      minimum_risk_hint: high
      emits_concerns:
      - public_contract
      emits_contexts:
      - change_risk
    event_contract:
      minimum_risk_hint: high
      emits_concerns:
      - public_contract
      emits_contexts:
      - change_risk
    port_contract:
      minimum_risk_hint: medium
      emits_concerns:
      - behavior
      emits_contexts:
      - change_risk
    module_contract:
      minimum_risk_hint: medium
      emits_concerns:
      - behavior
      emits_contexts:
      - change_risk
    public_type_contract:
      minimum_risk_hint: medium
      emits_concerns:
      - public_contract
      emits_contexts:
      - change_risk
    persistence_contract:
      minimum_risk_hint: medium
      emits_concerns:
      - behavior
      emits_contexts:
      - change_risk
    configuration_contract:
      minimum_risk_hint: medium
      emits_concerns:
      - behavior
      emits_contexts:
      - change_risk
  semantic_depth_restoration:
    enriched_generic_contract_definitions: true
validation:
  fail_conditions:
  - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-FC-001
    condition: unknown_contract_type
    message: Unknown contract type.
    severity: error
    owner: contracts/conventions.contract-taxonomy.yaml
  - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-FC-002
    condition: consumer_knowledge_missing_for_public_contract
    message: Consumer knowledge missing for public contract.
    severity: error
    owner: contracts/conventions.contract-taxonomy.yaml
  required_checks: []
