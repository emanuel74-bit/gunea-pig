  consumer_knowledge_definitions:
    none:
      definition: No consumers are known or relevant after reconnaissance.
      meaning: Represents the none case within the consumer knowledge taxonomy.
      detection_signals:
      - none signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches none
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - consumer knowledge decisions using none must include reason and evidence
    all_known:
      definition: All consumers are identified and can be reviewed or updated.
