version: '1.0'
file:
  name: conventions.contract-taxonomy.yaml
  path: contracts/conventions.contract-taxonomy.yaml
  role: contract_taxonomy_contract
  executability: vocabulary
purpose: Define contract types, stability levels, consumer types, consumer knowledge, and contract classification outputs.
ownership:
  owns:
  - contract_type_enum
  - contract_definitions
  - contract_stability_levels
  - contract_consumer_types
  - consumer_knowledge_enum
  - contract_risk_signals
  does_not_own:
  - compatibility_strategy_selection
  - breaking_change_detection
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - contract_taxonomy_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  contract_type_enum:
    allowed:
    - request_contract
    - response_contract
    - api_contract
    - event_contract
    - port_contract
    - module_contract
    - public_type_contract
    - persistence_contract
    - configuration_contract
  contract_definitions:
    request_contract:
      definition: Consumer-visible input shape and semantics required by an operation, API, handler, command, or message consumer.
      owner: request_contract_owner
      consumer_types:
      - internal_module
      boundary_types:
      - module
      stability_default: internal_stable
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - request_contract_shape_changed
      - request_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
      choose_when:
      - the artifact defines or changes a request contract
      reject_when:
      - pure internal implementation detail
      - no consumer-visible obligation
      compatibility_rules:
      - record consumers
      - classify change type
      - emit compatibility_decision_required when unknown or breaking
    response_contract:
      definition: Consumer-visible output shape and semantics returned by an operation, API, handler, query, or message producer.
      owner: response_contract_owner
      consumer_types:
      - internal_module
      boundary_types:
      - module
      stability_default: internal_stable
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - response_contract_shape_changed
      - response_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
      choose_when:
      - the artifact defines or changes a response contract
      reject_when:
      - pure internal implementation detail
      - no consumer-visible obligation
      compatibility_rules:
      - record consumers
      - classify change type
      - emit compatibility_decision_required when unknown or breaking
    api_contract:
      definition: Stable agreement exposed by an HTTP/RPC/GraphQL/SDK/module API, including methods, paths, params, auth and
        error semantics.
      owner: api_contract_owner
      consumer_types:
      - external_consumer
      - frontend_consumer
      - sdk_consumer
      boundary_types:
      - public_api
      - transport
      stability_default: external_public
      breaking_change_examples:
      - remove_or_rename_required_shape
      non_breaking_change_examples:
      - add_optional_ignorable_shape
      required_checks:
      - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-RC-001
        check: compatibility_review_if_public_or_module_shared
      detection_signals:
      - api_contract_shape_changed
      - api_contract_consumer_visible_semantics_changed
      compatibility_questions:
      - Is a required field removed or renamed?
      - Can old consumers keep working?
      - Is versioning or adapter/migration required?
      choose_when:
      - the artifact defines or changes a api contract
      reject_when:
      - pure internal implementation detail
      - no consumer-visible obligation
      compatibility_rules:
      - record consumers
      - classify change type
      - emit compatibility_decision_required when unknown or breaking
    event_contract:
      definition: Stable agreement for emitted or consumed events/messages, including payload, version, ordering, idempotency
