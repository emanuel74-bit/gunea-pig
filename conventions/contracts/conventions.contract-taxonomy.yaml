      - the active evidence best matches configuration contract
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - contract_type decisions using configuration_contract must include reason and evidence
validation:
  fail_conditions:
  - id: CONTRACTS-CONVENTIONS-CONTRACT-TAXONOMY-YAML-FC-001
    condition: unknown_contract_type
    message: Unknown contract type.
