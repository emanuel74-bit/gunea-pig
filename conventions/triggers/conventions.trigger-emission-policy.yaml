version: '1.0'
file:
  name: conventions.trigger-emission-policy.yaml
  path: triggers/conventions.trigger-emission-policy.yaml
  role: trigger_emission_contract
  executability: policy
purpose: Define which subsystems may emit triggers, required payloads, dedupe behavior, and evidence requirements before Alpha registers triggers.
ownership:
  owns:
  - trigger_emission_policy
  - trigger_emission_rules
  - trigger_payload_schema
  - emission_algorithm
  does_not_own:
  - trigger_resolution_matrix
  - mission_state_storage
  - phase_contracts
activation:
  mode: conditional
  activates_when:
  - phase_output_contains_triggers
  - gate_or_report_validation_emits_trigger
  skips_when: []
inputs:
  required:
  - trigger_taxonomy
  - phase_output
  optional:
  - mission_state
  - report_validation_result
  - gate_validation_result
outputs:
  produces:
  - validated_trigger_candidates
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - triggers/conventions.trigger-taxonomy.yaml
  optional_files:
  - reports/conventions.report-validation.yaml
  - gates/conventions.gate-validation.yaml
sections:
  trigger_emission_policy:
    absolute_rules:
    - id: TRIGGER-EMIT-ABS-001
      rule: Only phase outputs, gate validation, report validation, or Alpha runtime checks may emit triggers.
      fail_condition: trigger_emitted_from_unowned_context
    - id: TRIGGER-EMIT-ABS-002
      rule: Every emitted trigger must include evidence_refs and a reason.
      fail_condition: trigger_missing_reason_or_evidence
    - id: TRIGGER-EMIT-ABS-003
      rule: A trigger must not be used as a substitute for a required report or failed gate result.
      fail_condition: trigger_used_to_bypass_report_or_gate
    - id: TRIGGER-EMIT-ABS-004
      rule: Equivalent active triggers must be merged instead of duplicated.
      fail_condition: duplicate_active_trigger_not_merged
  trigger_emission_rules:
  - trigger_type: behavior_change_requested
    may_be_emitted_by:
    - behavior_agent
    - validation_agent
    - failure_analysis_agent
    emit_when:
    - changed acceptance criterion
    - new expected behavior
    - preserved behavior no longer preserved
    do_not_emit_when:
    - required action already completed after the evidence timestamp
    - trigger would duplicate an unresolved equivalent trigger without adding new evidence
    - trigger type is being used to bypass a failed gate or required report
    required_payload_fields:
    - trigger_type
    - reason
    - evidence_refs
    - required_phase_or_action
    evidence_requirement:
      min_evidence_refs: 1
      allow_no_evidence_marker: false
      evidence_must_identify_source_phase: true
    dedupe_policy: merge_with_equivalent_active_trigger_or_emit_superseding_trigger_when_target_differs
    fail_condition: behavior_change_requested_emitted_without_required_evidence_or_allowed_emitter
  - trigger_type: public_contract_change_possible
