  trigger_status_definitions:
    active:
      definition: active trigger_status vocabulary value.
      meaning: Represents the active case within the trigger_status taxonomy.
      detection_signals:
      - active signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches active
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - trigger_status decisions using active must include reason and evidence
