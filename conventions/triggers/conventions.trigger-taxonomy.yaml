  trigger_record_schema:
    required_fields:
    - trigger_id
    - trigger_type
    - category
    - emitted_by_phase
    - emitted_by_agent
    - status
    - reason
    - evidence_refs
    - required_phase_or_action
    - blocking_before
    - created_sequence
    optional_fields:
    - scheduled_phase
    - required_report
    - target_gate
    - target_approval
    - resolved_by_phase
    - blocked_reason
    - revision_request_ref
    - superseded_by_trigger
    - invalidated_by_revision
  trigger_record_shape:
    trigger_id: ''
    trigger_type: ''
    category: ''
    emitted_by_phase: ''
    emitted_by_agent: ''
    status: active
    reason: ''
    evidence_refs: []
    required_phase_or_action: ''
    blocking_before: []
    created_sequence: 0
    scheduled_phase: ''
    required_report: ''
    target_gate: ''
    target_approval: ''
    resolved_by_phase: ''
    blocked_reason: ''
    revision_request_ref: ''
    superseded_by_trigger: ''
    invalidated_by_revision: ''
  trigger_identity_rules:
    dedupe_key_fields:
    - trigger_type
    - required_phase_or_action
    - required_report
    - target_gate
    - target_approval
    duplicate_policy: merge_evidence_when_equivalent_active_trigger_exists
    supersession_policy: newer_trigger_may_supersede_older_trigger_only_when resolution_target_changes_or_prior_trigger_invalidated
validation:
  required_checks:
  - id: TRIGGER-TAXONOMY-CHECK-001
    check: every_trigger_type_has_definition
    applies_when:
      trigger_taxonomy_loaded: true
  - id: TRIGGER-TAXONOMY-CHECK-002
    check: every_trigger_status_has_terminal_and_blocking_semantics
    applies_when:
      trigger_status_referenced: true
  fail_conditions:
  - id: TRIGGER-TAXONOMY-001
    condition: unknown_trigger_type
    message: Trigger type must be defined in trigger_type_enum.allowed.
    severity: error
  - id: TRIGGER-TAXONOMY-002
    condition: trigger_type_missing_definition
    message: Every trigger type must have a definition, category, evidence requirement, allowed emitters, and default resolution action.
    severity: error
