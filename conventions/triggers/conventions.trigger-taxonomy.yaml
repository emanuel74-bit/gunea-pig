version: '1.0'
file:
  name: conventions.trigger-taxonomy.yaml
  path: triggers/conventions.trigger-taxonomy.yaml
  role: trigger_vocabulary_contract
  executability: vocabulary
purpose: Define trigger categories, statuses, trigger types, status semantics, trigger record schema, and per-trigger emission meaning.
ownership:
  owns:
  - trigger_category_enum
  - trigger_status_enum
  - trigger_status_definitions
  - trigger_type_enum
  - trigger_type_definitions
  - trigger_record_schema
  - trigger_identity_rules
  does_not_own:
  - trigger_resolution_matrix
  - trigger_emission_policy
  - trigger_validation_algorithm
  - mission_state_storage
activation:
  mode: reference_only
  activates_when:
  - trigger_values_are_referenced
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - trigger_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
  trigger_category_enum:
    allowed:
    - action
    - approval
    - behavior_scope
    - boundary
    - contract
    - dependency
    - execution
    - failure
    - impact
    - implementation
    - mission
    - pattern
    - reconnaissance
    - refactor
    - repair
    - report
    - revision
    - risk
    - role
    - validation
  trigger_status_enum:
    allowed:
    - active
    - scheduled
    - resolved
    - blocked
    - invalidated
  trigger_status_definitions:
    active:
      definition: A trigger has been emitted but has not yet been routed to a required action, blocking decision, scheduled phase, required report, or explicit block
        record.
      terminal: false
      blocks_downstream: true
    scheduled:
      definition: The trigger has an assigned resolution path and the required phase, report, approval, or action has been added to the active execution plan.
      terminal: false
      blocks_downstream: false
    resolved:
      definition: The required trigger action has completed and the trigger no longer blocks downstream execution.
      terminal: true
      blocks_downstream: false
    blocked:
      definition: The trigger cannot be resolved under the current mission state and must block the target phase or mission completion with an explicit reason.
      terminal: true
      blocks_downstream: true
    invalidated:
      definition: The trigger was superseded by a revision, rerun, replacement report, or newer trigger record and must not drive new scheduling.
      terminal: true
      blocks_downstream: false
  trigger_type_enum:
    allowed:
    - behavior_change_requested
    - public_contract_change_possible
    - public_contract_change_confirmed
    - security_sensitive_behavior_possible
    - existing_artifact_found
    - dependency_wiring_changed
    - mixed_responsibility_possible
    - mixed_responsibility_detected
    - likely_extract_target_detected
    - likely_split_target_detected
    - role_collision_possible
    - pattern_pressure_possible
    - pattern_pressure_detected
    - pattern_selection_required
    - refactor_like_action_selected
    - behavior_lock_required
    - checkpointed_sequence_required
    - compatibility_decision_required
    - boundary_validation_required
    - dependency_validation_required
    - high_risk_detected
    - dynamic_reference_risk_detected
    - consumer_impact_detected
    - call_site_update_required
    - additional_contract_review_required
    - risk_reclassification_required
    - phase_revision_required
    - approval_before_implementation_required
    - implementation_blocked
    - implementation_allowed
    - implementation_failure_detected
    - validation_required
    - unexpected_file_changed
    - post_validation_failed
    - repair_required
    - final_validation_ready
    - required_report_missing
    - report_schema_invalid
    - mission_complete
    - mission_blocked
    - rerun_required
  trigger_type_definitions:
    behavior_change_requested:
      definition: A requested or discovered change alters observable behavior and therefore requires behavior contract review before implementation.
      category: behavior_scope
      allowed_emitters:
      - behavior_agent
      - validation_agent
      - failure_analysis_agent
      positive_signals:
      - changed acceptance criterion
      - new expected behavior
      - preserved behavior no longer preserved
      negative_signals:
      - same condition already resolved by newer trigger record
      - evidence belongs only to informational note and does not require runtime followup
      - evidence contradicts trigger category or target action
      required_evidence:
        min_evidence_refs: 1
        allow_no_evidence_marker: false
        evidence_must_identify_source_phase: true
      default_resolution_action: schedule_phase
      default_blocking_before:
      - architecture_decomposition
      - test_derivation
      - pre_implementation_gate
      status_on_emit: active
      must_not_emit_when:
      - required action already completed after the evidence timestamp
      - trigger would duplicate an unresolved equivalent trigger without adding new evidence
      - trigger type is being used to bypass a failed gate or required report
    public_contract_change_possible:
      definition: Evidence suggests a public contract may change, but compatibility has not yet been classified.
