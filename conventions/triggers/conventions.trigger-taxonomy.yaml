version: '1.0'
file:
  name: conventions.trigger-taxonomy.yaml
  path: triggers/conventions.trigger-taxonomy.yaml
  role: trigger_vocabulary_contract
  executability: vocabulary
purpose: Define trigger types, statuses, and trigger record schema.
ownership:
  owns:
  - trigger_type_enum
  - trigger_status_enum
  - trigger_record_schema
  does_not_own:
  - trigger_resolution_matrix
  - mission_state_storage
activation:
  mode: reference_only
  activates_when:
  - trigger_values_are_referenced
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - trigger_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
  trigger_status_enum:
    allowed:
    - active
    - scheduled
    - resolved
    - blocked
    - invalidated
