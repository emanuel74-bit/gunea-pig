version: '1.0'
file:
  name: conventions.testing-taxonomy.yaml
  path: testing/conventions.testing-taxonomy.yaml
  role: testing_taxonomy_contract
  executability: vocabulary
purpose: Define test role vocabulary and test types.
ownership:
  owns:
  - test_type_enum
  - test_role_definitions
  does_not_own:
  - test_derivation_matrix
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - testing_taxonomy_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  test_type_enum:
    allowed:
    - unit
    - integration
    - contract
    - e2e
    - regression
    - characterization
    - migration
    - security
    - performance
    - snapshot
  test_role_definitions:
    unit: &id001
      definition: Validates one isolated unit of logic with dependencies mocked or avoided; required for branching or pure
        domain/application logic.
      meaning: Represents the unit case within the test type taxonomy.
      detection_signals:
      - unit signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches unit
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - test type decisions using unit must include reason and evidence
      creation_triggers:
      - unit coverage is required by behavior, risk, impact, contract, bugfix, or refactor evidence
      validates:
      - unit obligations
      does_not_validate:
      - unrelated behavior
      - implementation details outside test intent
    integration: &id002
      definition: Validates collaboration between multiple internal components, modules, repositories, or external adapters
        under controlled conditions.
      meaning: Represents the integration case within the test type taxonomy.
      detection_signals:
      - integration signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches integration
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
