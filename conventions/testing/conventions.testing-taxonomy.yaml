version: '1.0'
file:
  name: conventions.testing-taxonomy.yaml
  path: testing/conventions.testing-taxonomy.yaml
  role: testing_vocabulary_contract
  executability: vocabulary
purpose: Define test type vocabulary, test obligation statuses, scopes, and schemas used by derivation, regression, characterization, validation,
  reports, gates, and implementation planning.
ownership:
  owns:
  - test_type_enum
  - test_type_definitions
  - test_obligation_status_enum
  - test_scope_enum
  - test_obligation_record_schema
  - test_case_record_schema
  does_not_own:
  - test_derivation_rules
  - role_to_test_matrix
  - regression_policy
  - characterization_policy
  - test_validation_algorithm
activation:
  mode: reference_only
  activates_when:
  - testing_values_are_referenced
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - testing_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
  test_type_enum:
    allowed:
    - unit
    - integration
    - contract
    - e2e
    - regression
    - characterization
    - migration
    - security
    - performance
    - snapshot
  test_type_definitions:
    unit:
      definition: Validates a single isolated unit of logic with dependencies replaced, avoided, or controlled. Used for deterministic domain,
        policy, rule, mapper, selector, and small application behaviors.
      positive_signals:
      - pure function or deterministic branch exists
      - domain rule or invariant is changed
      - mapper/selector/transformation behavior changed
      - logic can be exercised without real external IO
      negative_signals:
      - requires real database/message broker/network to observe behavior
      - behavior is primarily cross-component wiring
      - behavior only observable through public API contract
      choose_when:
      - the behavior under test is owned by one artifact or one coherent unit
      - dependency behavior can be mocked without hiding the behavior being verified
      reject_when:
      - the test would mostly validate mocks rather than production behavior
      - integration boundary behavior is the primary risk
      required_evidence:
      - artifact role assignment
      - behavior or acceptance criterion reference
      validates:
      - branching logic
      - invariants
      - mapping/transformation
      - policy/rule outcomes
      does_not_validate:
      - module wiring
      - database mapping
      - external API behavior
      - end-to-end user flow
    integration:
      definition: Validates collaboration between multiple internal components, repositories, adapters, queues, clients, or modules under controlled
        but realistic conditions.
      positive_signals:
      - repository, adapter, client, queue, event, or module wiring changed
      - behavior crosses module/layer boundary
      - dependency classification reports runtime or external dependency risk
      negative_signals:
      - all behavior is pure isolated logic
      - public API compatibility is the primary concern
      - full user workflow is required
      choose_when:
      - failure could occur from collaboration between components
      - the correctness risk is wiring, persistence, adapter behavior, or multi-component sequencing
      reject_when:
      - a smaller unit test fully verifies the behavior with no integration risk
      - the test requires full deployed system behavior and belongs to e2e
      required_evidence:
      - dependency or boundary evidence
      - affected collaborating artifacts
      validates:
      - component collaboration
      - repository/adapters
      - module wiring
      - message or event integration
      does_not_validate:
      - complete user journey
      - long-running performance guarantees
    contract:
      definition: Validates that a public or shared contract remains compatible for known or unknown consumers, including API shapes, events,
        DTOs, exports, schemas, or message payloads.
      positive_signals:
      - boundary_contract_classification reports public surface
      - compatibility decision is required
      - DTO/event/request/response/export/schema changed
      - consumer impact exists or is unknown
      negative_signals:
      - changed artifact has no consumer-visible surface
      - behavior is internal and consumers cannot observe it
      choose_when:
      - a consumer-visible contract exists or may exist
      - compatibility or breaking-change risk must be controlled
      reject_when:
      - there is no public/shared surface and no consumer obligation
      required_evidence:
      - contract classification or compatibility report
      - consumer knowledge state
      validates:
      - schema compatibility
      - request/response shape
      - event payload
      - public exports
      - consumer obligations
      does_not_validate:
      - private implementation detail
      - performance under load
    e2e:
      definition: Validates a full user/system workflow through realistic entry points and integrations, usually with minimal mocking and production-like
        wiring.
      positive_signals:
      - behavior spans multiple layers or services
      - user-visible workflow changed
      - critical business path affected
      - integration risk cannot be isolated safely
      negative_signals:
      - behavior is localized and covered by unit/integration/contract tests
      - e2e would be slow without adding unique confidence
      choose_when:
      - only a full flow validates the acceptance criterion
      - regression risk is in orchestration across boundaries
      reject_when:
      - lower-level tests provide sufficient coverage and faster feedback
      - the workflow cannot be made deterministic enough for reliable validation
      required_evidence:
      - acceptance criteria mapping
      - workflow or entrypoint evidence
      validates:
      - complete workflow
      - system-level integration
      - user-visible result
      does_not_validate:
      - all edge cases inside individual components
    regression:
      definition: Locks a previously broken behavior so the same failure cannot reappear after a bugfix or repair.
      positive_signals:
      - bugfix mission profile selected
      - failure reproduction exists
      - post-validation or user report describes incorrect behavior
      negative_signals:
      - no previous incorrect behavior is identified
      - change is new feature without defect evidence
      choose_when:
      - a specific failure mode must be prevented from recurring
      - expected behavior can be asserted against prior bug evidence
      reject_when:
      - there is no reproduction, failure evidence, or defect scenario
      required_evidence:
      - bug reproduction or failure report
      - expected corrected behavior
      validates:
      - fixed behavior
      - failure mode no longer present
      does_not_validate:
      - unrelated feature expansion
    characterization:
      definition: Captures current externally observable behavior before or during refactoring to prove behavior preservation when existing tests
        are insufficient.
      positive_signals:
      - refactor_like_action_selected
      - behavior_preservation_required
      - large_refactor or cleanup_only profile
      - existing tests are missing or insufficient
      negative_signals:
      - feature intentionally changes behavior
      - full existing tests already cover preserved behavior
      choose_when:
      - behavior must be preserved but implementation structure changes
      - the system lacks sufficient existing tests for preserved behavior
      reject_when:
      - behavior change is intentional and should be described by new acceptance criteria
      - preservation can be proven by existing tests and contract tests
      required_evidence:
      - behavior preservation requirements
      - refactor strategy
      validates:
      - observable pre-refactor behavior
      - no-behavior-change promise
      does_not_validate:
      - new behavior not present before refactor
    migration:
      definition: Validates schema, data, contract, or persistence migrations, including forward/backward behavior, rollback assumptions, and
        data preservation.
      positive_signals:
      - migration_required trigger exists
      - persistence change or data shape change
      - backfill, projection, schema, or stored document change
      negative_signals:
      - no persisted data or external schema is affected
      choose_when:
      - data compatibility, backfill, or rollback risk exists
      - stored state or schema transition must be proven
      reject_when:
      - change is purely in-memory and no durable state changes
      required_evidence:
      - persistence or compatibility report
      - migration/backfill requirement
      validates:
      - migration path
      - data preservation
      - rollback or compatibility assumptions
      does_not_validate:
      - business logic unrelated to persisted state
    security:
      definition: Validates authentication, authorization, input handling, secret handling, data exposure, injection resistance, and security-sensitive
        behavior.
      positive_signals:
      - security_sensitive_behavior_possible trigger
      - auth/authz boundary changed
      - external input handling changed
      - secret, token, permission, or data exposure path changed
      negative_signals:
      - change has no security-sensitive surface or input boundary
      choose_when:
      - risk classification includes security concern
      - boundary or contract change could expose protected data or permissions
      reject_when:
      - no security-sensitive behavior is affected and risk remains low
      required_evidence:
      - risk classification
      - boundary/contract evidence
      validates:
      - authorization rules
      - input validation
      - data exposure controls
      - secret handling
      does_not_validate:
      - general functional correctness by itself
    performance:
      definition: Validates latency, throughput, memory, concurrency, batching, or scalability behavior when performance risk is introduced or
        changed.
      positive_signals:
      - hot path changed
      - batching/concurrency/cache behavior changed
      - performance concern classified
      - large data path affected
      negative_signals:
      - change has no meaningful runtime performance surface
      - performance claim is not part of acceptance criteria or risk
      choose_when:
      - performance behavior is an explicit requirement or risk
      - implementation could degrade critical runtime path
      reject_when:
      - performance is not observable or not relevant to the change
      required_evidence:
      - risk/impact evidence
      - performance expectation or threshold
      validates:
      - latency
      - throughput
      - memory
      - concurrency
      - scalability constraint
      does_not_validate:
      - functional correctness without assertions
    snapshot:
      definition: Captures stable serialized output shape when the exact output structure is the behavior, usually for generated structures, serialized
        view models, or public payload samples.
      positive_signals:
      - stable serialization output changed
      - public payload example must remain stable
      - generated structure or rendered output is important
      negative_signals:
      - output is unstable, order-dependent, or implementation-detail noise
      - semantic assertion would be clearer than full snapshot
      choose_when:
      - snapshot is the clearest guard for stable output shape
      - the output surface is intentionally stable and meaningful
      reject_when:
      - snapshot would be brittle or hide intent
      - small semantic assertions would provide better signal
      required_evidence:
      - stable output contract or rendering expectation
      validates:
      - serialized output shape
      - stable generated output
      - public example payload
      does_not_validate:
      - deep behavior not visible in snapshot
  test_obligation_status_enum:
    allowed:
    - required
    - conditional
    - optional
    - not_required
    - blocked
    - gap_recorded
    - satisfied_by_existing_coverage
  test_obligation_status_definitions:
    required:
      definition: The test obligation must be satisfied or explicitly blocked before implementation/final validation can pass.
    conditional:
      definition: The obligation becomes required when its condition or trigger is present.
    optional:
      definition: The obligation may improve confidence but does not block by default.
    not_required:
      definition: Evidence shows this test type is not needed for the current change.
    blocked:
      definition: The obligation is required but cannot currently be satisfied; a blocker and remediation must be recorded.
    gap_recorded:
      definition: A coverage gap is recorded with reason, risk impact, and required followup.
    satisfied_by_existing_coverage:
      definition: Existing tests are sufficient and evidence references identify them.
  test_scope_enum:
    allowed:
    - artifact
    - role
    - module
    - boundary
    - contract
    - workflow
    - system
    - migration
    - security_surface
    - performance_surface
  test_scope_definitions:
    artifact:
      definition: Test scope focused on artifact.
    role:
      definition: Test scope focused on role.
    module:
      definition: Test scope focused on module.
    boundary:
      definition: Test scope focused on boundary.
    contract:
      definition: Test scope focused on contract.
    workflow:
      definition: Test scope focused on workflow.
    system:
      definition: Test scope focused on system.
    migration:
      definition: Test scope focused on migration.
    security_surface:
      definition: Test scope focused on security surface.
    performance_surface:
      definition: Test scope focused on performance surface.
  test_obligation_record_schema:
    required_fields:
    - obligation_id
    - test_type
    - scope
    - status
    - reason
    - evidence_refs
    - acceptance_criteria_refs
    - blocking
    optional_fields:
    - satisfied_by_existing_tests
    - required_commands
    - gap_reason
    - followup_trigger
    - owner_phase
  test_case_record_schema:
    required_fields:
    - test_case_id
    - test_type
    - purpose
    - covers
    - setup
    - assertions
    - evidence_refs
    optional_fields:
    - target_files
    - command
    - fixture_requirements
    - mocking_policy
    - risk_refs
validation:
  required_checks:
  - id: TEST-TAX-CHECK-001
    check: every_test_type_has_definition_and_signals
    applies_when:
      testing_taxonomy_loaded: true
  fail_conditions:
  - unknown_test_type
  - test_type_missing_definition
  - test_type_missing_choose_or_reject_rules
