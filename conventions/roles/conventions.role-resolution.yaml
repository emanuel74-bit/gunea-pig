version: '1.0'
file:
  name: conventions.role-resolution.yaml
  path: roles/conventions.role-resolution.yaml
  role: role_resolution_engine
  executability: decision_engine
purpose: Resolve draft role signals and final authoritative roles using strict priority, specific-before-generic rules, and
  fail-closed ambiguity handling.
ownership:
  owns:
  - role_decision_process
  - role_assignment_table_schema
  - specific_before_generic_rules
  - draft_role_pass
  - draft_role_signals_schema
  - final_role_assignment
  does_not_own:
  - role_definitions
  - action_resolution
  - pattern_selection
  - physical_structure
activation:
  mode: always
  activates_when:
  - artifact candidates exist
  - post-action artifacts exist
  skips_when: []
inputs:
  required:
  - artifact_candidates
  - role_taxonomy
  optional:
  - draft_role_signals
  - post_action_artifact_candidates
  - collision_resolution_reason
outputs:
  produces:
  - draft_role_signals
  - role_assignment_table
  - unresolved_role_matches
  - role_resolution_confidence
dependencies:
  required_files:
  - roles/conventions.role-taxonomy.yaml
  optional_files:
  - roles/conventions.role-collisions.yaml
  - actions/conventions.action-taxonomy.yaml
sections:
  resolution_policy:
    mode: strict
    default_behavior: fail_closed
  role_priority_model:
    principle: specific_role_before_generic_role
    priority_order:
    - structural_framework
    - transport_entry
    - application_execution
    - domain_model
    - domain_constraint
    - decision
    - transformation
    - transport_contract
    - architectural_boundary
    - integration_boundary
    - integration_async
    - persistence_data
    - construction_resolution
    - error_result
    - type_static
    - testing_verification
    - fallback
  role_resolution_algorithm:
  - detect_test_artifact
  - detect_transport_entry
  - detect_application_execution
  - detect_domain_or_decision
  - detect_transformation_or_boundary
  - detect_integration_async
  - detect_persistence
  - detect_construction_resolution
  - detect_error_result_static
  - fallback
  role_assignment_passes:
    draft_role_pass:
      authority: advisory
      runs_after:
      - generate_artifact_candidates
      - codebase_reconnaissance_if_active
      runs_before:
      - resolve_artifact_actions_if_active
      - select_refactor_strategy_if_active
      produces:
      - draft_role_signals
      may:
      - detect_role_signals
      - identify_mixed_responsibilities
      - identify_role_collision_risk
      - suggest_likely_target_roles_for_extraction_or_split
      - inform_artifact_action_selection
      - inform_refactor_strategy_selection
      must_not:
      - finalize_file_names
      - finalize_folder_placement
      - bind_suffixes_as_authoritative
      - override_artifact_action_decision
      - replace_final_role_assignment
    final_role_assignment:
      authority: binding
      runs_after:
      - resolve_artifact_actions_if_active
      - select_refactor_strategy_if_active
      - validate_post_action_artifacts_if_active
      produces:
      - role_assignment_table
  draft_role_signal_rules:
    match_decision_rules:
    - id: DRAFT-ROLE-MIXED-RESPONSIBILITY
      match:
        artifact_candidate_contains_multiple_role_signals: true
      decision:
        emit_mixed_responsibility_signal: true
        required_followups:
        - action_resolution_review
        - refactor_strategy_review
    - id: DRAFT-ROLE-EXTRACTION-TARGET
      match:
        behavior_has_specific_role_signal: true
        source_artifact_has_unrelated_dependencies: true
      decision:
        suggest_likely_extraction_target: true
        required_followups:
        - artifact_action_resolution
  specific_before_generic_rules:
    absolute_rules:
    - Never choose service when use_case, command, query, handler, workflow, job, task, or processor applies.
    - Never choose util when any specific role applies.
    - Never choose domain or event as final file roles.
    - Never choose adapter when client or mapper is the more precise responsibility.
    - Never choose repository for domain behavior or application orchestration.
    - Never choose dto for request/response when transport direction is known.
  resolution_decision_rules:
    match_decision_rules:
    - id: ROLE-RESOLVE-TEST-FIRST
      priority: 1
      match:
        artifact_path_or_name_indicates_test: true
      decision: select_testing_verification_role_from_test_signals
    - id: ROLE-RESOLVE-TRANSPORT-ENTRY
      priority: 2
      match:
        interacts_with_any:
        - http
        - websocket
        - webhook
        - framework_middleware
      decision: select_transport_entry_role
    - id: ROLE-RESOLVE-APPLICATION-EXECUTION
      priority: 3
      match:
        executes_application_action_or_workflow: true
      decision: select_specific_application_execution_role
    - id: ROLE-RESOLVE-DOMAIN
      priority: 4
      match:
        contains_domain_rules_or_model: true
      decision: select_domain_model_or_constraint_role
    - id: ROLE-RESOLVE-TRANSFORMATION
      priority: 5
      match:
        transforms_representation_without_side_effects: true
      decision: select_transformation_role
    - id: ROLE-RESOLVE-BOUNDARY
      priority: 6
      match:
        crosses_architectural_or_integration_boundary: true
      decision: select_port_adapter_client_or_contract_role
    - id: ROLE-RESOLVE-PERSISTENCE
      priority: 7
      match:
        owns_persistence_or_query_shape: true
      decision: select_persistence_data_role
    - id: ROLE-RESOLVE-CONSTRUCTION
      priority: 8
      match:
        constructs_or_resolves_objects: true
      decision: select_construction_resolution_role
    - id: ROLE-RESOLVE-STATIC
      priority: 9
      match:
        type_or_static_value_only: true
      decision: select_type_static_or_error_result_role
    - id: ROLE-RESOLVE-FALLBACK
      priority: 99
      match:
        no_specific_role_matches: true
      decision: fail_closed_or_select_util_with_explicit_justification
  role_assignment_table_schema:
    required_fields:
    - artifact_id
    - artifact_path
    - assigned_role
    - role_family
    - confidence
    - decision_rule_id
    - evidence_refs
    - rejected_roles
    optional_fields:
    - suffix
    - split_required
    - collision_ref
    - notes
  canonical_role_evaluation_order:
  - detect_transport_layer
  - detect_execution_layer
  - detect_decision_layer
  - detect_transformation_layer
  - detect_domain_layer
  - detect_data_layer
  - detect_integration_layer
  - detect_construction_layer
  - detect_validation_layer
  - detect_resolution_layer
  - detect_structure_layer
  - detect_config_layer
  - detect_error_layer
  - detect_type_layer
  - detect_constants_layer
  - fallback
  canonical_role_input_contract:
    class_description:
      responsibilities: []
      has_side_effects: boolean
      mutates_state: boolean
      depends_on_external_systems: boolean
      contains_business_rules: boolean
      is_pure_functional: boolean
      scope: single_action | multi_step | utility | structural | data | decision
      input_output_shape: none | transforms | validates | constructs
      interacts_with:
      - http
      - websocket
      - database
      - external_api
      - event_system
      - none
  failure_policy:
    fail_when:
    - no_role_matches
    - multiple_primary_roles_remain
    - deprecated_alias_selected_as_final_role
    - generic_role_selected_without_justification
    - assigned_role_missing_required_evidence
    on_failure: emit_unresolved_role_matches_and_request_decomposition_or_revision
validation:
  required_checks:
  - assigned_role_exists
  - specific_role_preferred_before_generic
  - deprecated_alias_not_final
  - role_assignment_has_evidence
  fail_conditions:
  - unknown_role_selected
  - service_selected_when_specific_execution_role_applies
  - util_selected_without_justification
  - multi_role_artifact_not_decomposed
  - role_assignment_missing_evidence
