version: '1.0'
file:
  name: conventions.role-resolution.yaml
  path: roles/conventions.role-resolution.yaml
  role: role_resolution_engine
  executability: decision_engine
purpose: Resolve draft role signals before action/refactor decisions and final authoritative roles for post-action artifacts.
ownership:
  owns:
  - role_decision_process
  - role_assignment_table_schema
  - specific_before_generic_rules
  - draft_role_pass
  - draft_role_signals_schema
  - final_role_assignment
  does_not_own:
  - role_definitions
  - action_resolution
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - draft_role_signals
  - role_assignment_table
  - role_resolution_decision_report
dependencies:
  required_files:
  - roles/conventions.role-taxonomy.yaml
  - actions/conventions.action-taxonomy.yaml
  optional_files: []
sections:
  role_resolution_pipeline:
  - load_role_taxonomy
  - read_post_action_artifact_candidates
  - detect_responsibility_signals
  - choose_specific_role_before_generic
  - reject_multi_role_artifacts
  - produce_role_assignment_table
  role_assignment_passes:
    draft_role_pass:
      authority: advisory
      runs_after:
      - generate_artifact_candidates
      - codebase_reconnaissance_if_active
      runs_before:
      - resolve_artifact_actions_if_active
      - select_refactor_strategy_if_active
      produces:
      - draft_role_signals
      may:
      - detect_role_signals
      - identify_mixed_responsibilities
      - identify_role_collision_risk
      - suggest_likely_target_roles_for_extraction_or_split
      - inform_artifact_action_selection
      - inform_refactor_strategy_selection
      must_not:
      - finalize_file_names
      - finalize_folder_placement
      - bind_suffixes_as_authoritative
      - override_artifact_action_decision
      - replace_final_role_assignment
    final_role_assignment:
      authority: binding
      runs_after:
      - resolve_artifact_actions_if_active
      - select_refactor_strategy_if_active
      - validate_post_action_artifacts_if_active
      produces:
      - role_assignment_table
  draft_role_signal_rules:
    match_decision_rules:
    - id: DRAFT-ROLE-MIXED-RESPONSIBILITY
      match:
        artifact_candidate_contains_multiple_role_signals: true
      decision:
        emit_mixed_responsibility_signal: true
        required_followups:
        - action_resolution_review
        - refactor_strategy_review
    - id: DRAFT-ROLE-EXTRACTION-TARGET
      match:
        behavior_has_specific_role_signal: true
        source_artifact_has_unrelated_dependencies: true
      decision:
        suggest_likely_extraction_target: true
        required_followups:
        - artifact_action_resolution
  rule_sets:
    absolute_rules:
    - id: ROLE-RESOLUTION-ABS-001
      rule: Service is not the default role.
      fail_condition: service_selected_as_default_without_specific_rejection
    - id: ROLE-RESOLUTION-ABS-002
      rule: Specific roles must be considered before generic roles.
      fail_condition: generic_role_selected_before_specific_role_review
    priority_rules:
    - id: ROLE-RESOLUTION-PRIORITY-001
      priority_order:
      - specific_role
      - service
      applies_when:
        role_candidates_include_specific_role: true
      tie_breakers:
      - choose the most specific valid role with matching responsibility evidence
    - id: ROLE-RESOLUTION-PRIORITY-002
      priority_order:
      - policy
      - rule
      - specification
      - invariant
      - service
      applies_when:
        artifact_contains_business_rule: true
      tie_breakers:
      - choose service only when orchestration or side-effect coordination is the primary responsibility
    - id: ROLE-RESOLUTION-PRIORITY-003
      priority_order:
      - adapter
      - client
      - repository
      - port
      - service
      applies_when:
        artifact_crosses_io_boundary: true
      tie_breakers:
      - choose service only when no boundary-specific role applies
  canonical_role_evaluation_order:
  - detect_transport_layer
  - detect_execution_layer
  - detect_decision_layer
  - detect_transformation_layer
  - detect_domain_layer
  - detect_data_layer
  - detect_integration_layer
  - detect_construction_layer
  - detect_validation_layer
  - detect_resolution_layer
  - detect_structure_layer
  - detect_config_layer
  - detect_error_layer
  - detect_type_layer
  - detect_constants_layer
  - fallback
  canonical_role_input_contract:
    class_description:
      responsibilities: []
      has_side_effects: boolean
      mutates_state: boolean
      depends_on_external_systems: boolean
      contains_business_rules: boolean
      is_pure_functional: boolean
      scope: single_action | multi_step | utility | structural | data | decision
      input_output_shape: none | transforms | validates | constructs
      interacts_with:
      - http
      - websocket
      - database
      - external_api
      - event_system
      - none
  canonical_role_classifier_system:
    name: class-role-classifier
    purpose: 'Determine the correct architectural role (file suffix) for a class based on its responsibilities, behavior,
      and constraints.

      '
    philosophy:
    - Every class has exactly one role
    - Roles are defined by responsibility, not naming
    - If multiple roles apply → decomposition required
    - If unclear → fail_closed
    - Behavior defines placement, not intention
    enforcement:
      mode: strict
      ambiguity_policy: fail_closed
      multi_role_policy: reject_and_decompose
  semantic_depth_restoration:
    restored_from: conventions.roles.yaml
    restoration_scope:
    - system
    - input
    - evaluation_order
    restoration_policy: canonical_source_preserved_under_standard_file_contract
    do_not_replace_with_summary: true
  canonical_restored_source:
    system:
      name: class-role-classifier
      purpose: 'Determine the correct architectural role (file suffix) for a class based on its responsibilities, behavior,
        and constraints.

        '
      philosophy:
      - Every class has exactly one role
      - Roles are defined by responsibility, not naming
      - If multiple roles apply → decomposition required
      - If unclear → fail_closed
      - Behavior defines placement, not intention
      enforcement:
        mode: strict
        ambiguity_policy: fail_closed
        multi_role_policy: reject_and_decompose
    input:
      class_description:
        responsibilities: []
        has_side_effects: boolean
        mutates_state: boolean
        depends_on_external_systems: boolean
        contains_business_rules: boolean
        is_pure_functional: boolean
        scope: single_action | multi_step | utility | structural | data | decision
        input_output_shape: none | transforms | validates | constructs
        interacts_with:
        - http
        - websocket
        - database
        - external_api
        - event_system
        - none
    evaluation_order:
    - detect_transport_layer
    - detect_execution_layer
    - detect_decision_layer
    - detect_transformation_layer
    - detect_domain_layer
    - detect_data_layer
    - detect_integration_layer
    - detect_construction_layer
    - detect_validation_layer
    - detect_resolution_layer
    - detect_structure_layer
    - detect_config_layer
    - detect_error_layer
    - detect_type_layer
    - detect_constants_layer
    - fallback
  canonical_source_full:
    version: '1.0'
    system:
      name: class-role-classifier
      purpose: 'Determine the correct architectural role (file suffix) for a class based on its responsibilities, behavior,
        and constraints.

        '
      philosophy:
      - Every class has exactly one role
      - Roles are defined by responsibility, not naming
      - If multiple roles apply → decomposition required
      - If unclear → fail_closed
      - Behavior defines placement, not intention
      enforcement:
        mode: strict
        ambiguity_policy: fail_closed
        multi_role_policy: reject_and_decompose
    input:
      class_description:
        responsibilities: []
        has_side_effects: boolean
        mutates_state: boolean
        depends_on_external_systems: boolean
        contains_business_rules: boolean
        is_pure_functional: boolean
        scope: single_action | multi_step | utility | structural | data | decision
        input_output_shape: none | transforms | validates | constructs
        interacts_with:
        - http
        - websocket
        - database
        - external_api
        - event_system
        - none
    evaluation_order:
    - detect_transport_layer
    - detect_execution_layer
    - detect_decision_layer
    - detect_transformation_layer
    - detect_domain_layer
    - detect_data_layer
    - detect_integration_layer
    - detect_construction_layer
    - detect_validation_layer
    - detect_resolution_layer
    - detect_structure_layer
    - detect_config_layer
    - detect_error_layer
    - detect_type_layer
    - detect_constants_layer
    - fallback
    roles:
      controller:
        suffix: .controller.ts
        match:
          interacts_with:
          - http
        rules:
        - handles incoming requests
        - delegates logic outward
        forbidden:
        - contains_business_rules
        - has_side_effects
        output: controller
      gateway:
        suffix: .gateway.ts
        match:
          interacts_with:
          - websocket
        rules:
        - manages connections
        - handles real-time messaging
        forbidden:
        - contains_business_rules
        output: gateway
      use_case:
        suffix: .use-case.ts
        match:
          scope: single_action
          contains_business_rules: true
        rules:
        - one input → one outcome
        - encapsulates full action
        output: use_case
      service:
        suffix: .service.ts
        match:
          has_side_effects: true
          scope: multi_step
        rules:
        - coordinates dependencies
        - owns side effects
        output: service
      orchestrator:
        suffix: .orchestrator.ts
        match:
          scope: multi_step
          contains_business_rules: false
        rules:
        - controls execution flow
        forbidden:
        - contains_business_rules
        output: orchestrator
      policy:
        suffix: .policy.ts
        match:
          contains_business_rules: true
          mutates_state: false
          has_side_effects: false
        rules:
        - returns decision
        output: policy
      specification:
        suffix: .specification.ts
        match:
          contains_business_rules: true
          is_composable: true
        rules:
        - composable logic
        output: specification
      selector:
        suffix: .selector.ts
        match:
          scope: decision
        rules:
        - chooses one option
        output: selector
      guard:
        suffix: .guard.ts
        match:
          scope: decision
          context_based: true
        rules:
        - authorization logic
        output: guard
      mapper:
        suffix: .mapper.ts
        match:
          input_output_shape: transforms
          is_pure_functional: true
        rules:
        - shape transformation
        output: mapper
      normalizer:
        suffix: .normalizer.ts
        match:
          scope: utility
        rules:
        - standardizes values
        output: normalizer
      formatter:
        suffix: .formatter.ts
        match:
          scope: utility
          output_formatting: true
        rules:
        - presentation transformation
        output: formatter
      domain:
        suffix: .domain.ts
        match:
          contains_business_rules: true
          mutates_state: true
          depends_on_external_systems: false
        rules:
        - encapsulates core business logic
        output: domain
      event:
        suffix: .event.ts
        match:
          is_immutable: true
        rules:
        - represents something that happened
        output: event
      listener:
        suffix: .listener.ts
        match:
          interacts_with:
          - event_system
        rules:
        - reacts to events
        output: listener
      publisher:
        suffix: .publisher.ts
        match:
          interacts_with:
          - event_system
          has_side_effects: true
        rules:
        - emits events
        output: publisher
      repository:
        suffix: .repository.ts
        match:
          interacts_with:
          - database
        rules:
        - data access abstraction
        forbidden:
        - contains_business_rules
        output: repository
      schema:
        suffix: .schema.ts
        match:
          scope: data
        rules:
        - defines structure only
        output: schema
      client:
        suffix: .client.ts
        match:
          interacts_with:
          - external_api
        rules:
        - external communication
        output: client
      adapter:
        suffix: .adapter.ts
        match:
          transforms_interfaces: true
        rules:
        - bridges systems
        output: adapter
      factory:
        suffix: .factory.ts
        match:
          input_output_shape: constructs
        rules:
        - creates objects
        output: factory
      builder:
        suffix: .builder.ts
        match:
          step_by_step_construction: true
        rules:
        - incremental build
        output: builder
      validator:
        suffix: .validator.ts
        match:
          input_output_shape: validates
        rules:
        - validation only
        output: validator
      resolver:
        suffix: .resolver.ts
        match:
          dynamic_resolution: true
        rules:
        - resolves implementation
        output: resolver
      strategy:
        suffix: .strategy.ts
        match:
          interchangeable_algorithms: true
        rules:
        - multiple implementations
        output: strategy
      module:
        suffix: .module.ts
        match:
          scope: structural
        rules:
        - wires dependencies
        forbidden:
        - contains_business_rules
        output: module
      dto:
        suffix: .dto.ts
        match:
          scope: data
          transport_related: true
        rules:
        - transport shape
        output: dto
      config:
        suffix: .config.ts
        match:
          scope: configuration
        rules:
        - static values
        output: config
      error:
        suffix: .error.ts
        match:
          represents_error: true
        rules:
        - error definition
        output: error
      types:
        suffix: .types.ts
        match:
          type_only: true
        rules:
        - no runtime code
        output: types
      constants:
        suffix: .const.ts
        match:
          scope: constants
        rules:
        - static values
        output: constants
      enum:
        suffix: .enum.ts
        match:
          finite_set: true
        rules:
        - controlled values
        output: enum
      util:
        suffix: .util.ts
        match:
          scope: utility
        rules:
        - stateless helper
        warning: last resort role
        output: util
validation:
  fail_conditions:
  - id: ROLES-CONVENTIONS-ROLE-RESOLUTION-YAML-FC-001
    condition: role_assignment_missing
    message: Role assignment missing.
    severity: error
    owner: roles/conventions.role-resolution.yaml
  - id: ROLES-CONVENTIONS-ROLE-RESOLUTION-YAML-FC-002
    condition: generic_role_selected_without_justification
    message: Generic role selected without justification.
    severity: error
    owner: roles/conventions.role-resolution.yaml
  - id: ROLES-CONVENTIONS-ROLE-RESOLUTION-YAML-FC-003
    condition: role_assignment_used_initial_candidates_instead_of_post_action_artifacts
    message: Role assignment used initial candidates instead of post action artifacts.
    severity: error
    owner: roles/conventions.role-resolution.yaml
  - id: ROLE-DRAFT-001
    condition: draft_role_pass_treated_as_authoritative
    message: Draft role pass is advisory and must not finalize roles, names, or placement.
    severity: error
    owner: roles/conventions.role-resolution.yaml
  - id: ROLE-FINAL-001
    condition: final_role_assignment_missing_after_action_resolution
    message: Final role assignment must run after action/refactor decisions.
    severity: error
    owner: roles/conventions.role-resolution.yaml
  required_checks: []
