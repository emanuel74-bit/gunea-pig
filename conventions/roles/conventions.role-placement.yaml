version: '1.0'
file:
  name: conventions.role-placement.yaml
  path: roles/conventions.role-placement.yaml
  role: role_layer_and_placement_affinity_contract
purpose: Provide advisory layer, suffix, and placement affinities without forcing folders.
ownership:
  owns:
  - layer_affinity_by_role_family
  - placement_affinity_by_role
  - suffix_lookup
  - placement_authority_rules
  does_not_own:
  - final_folder_structure
  - structure_density_modes
  - architecture_layer_assignment
  - dependency_direction_rules
activation:
  mode: always
  activates_when:
  - roles are assigned
  skips_when: []
inputs:
  required:
  - role_assignment_table
  - role_taxonomy
  optional: []
outputs:
  produces:
  - role_layer_affinity_table
  - role_placement_affinity_table
  - suffix_lookup_table
dependencies:
  required_files:
  - roles/conventions.role-taxonomy.yaml
  optional_files: []
sections:
  placement_policy:
    authority: advisory_default
    rules:
    - Role placement suggests; structure strategy decides.
    - A role does not automatically create a folder.
    - Architecture remains source of truth for layer assignment.
  layer_affinity_by_role_family:
    transport:
    - controller
    - gateway
    - webhook
    application:
    - use_case
    - command
    - query
    - handler
    - service
    - orchestrator
    - workflow
    - job
    - task
    - processor
    - selector
    - strategy
    - listener
    - publisher
    - projection
    - read_model
    domain:
    - entity
    - value_object
    - aggregate
    - domain_service
    - domain_event
    - rule
    - invariant
    - policy
    - specification
    infrastructure:
    - repository
    - query_builder
    - schema
    - model
    - record
    - migration
    - seed
    - read_model
    - projection
    - transaction
    - unit_of_work
    - client
    - adapter
    - consumer
    - producer
    - subscriber
    - scheduler
    boundary_or_shared:
    - mapper
    - normalizer
    - formatter
    - serializer
    - parser
    - dto
    - request
    - response
    - interface
    - port
    - contract
    - error
    - exception
    - error_code
    - result
    - types
    - enum
    - constants
    - config
  placement_affinity_by_role: {}
  suffix_lookup:
    module: .module.ts
    controller: .controller.ts
    gateway: .gateway.ts
    webhook: .webhook.ts
    use_case: .use-case.ts
    command: .command.ts
    query: .query.ts
    handler: .handler.ts
    service: .service.ts
    orchestrator: .orchestrator.ts
    workflow: .workflow.ts
    job: .job.ts
    task: .task.ts
    processor: .processor.ts
    entity: .entity.ts
    value_object: .value-object.ts
    aggregate: .aggregate.ts
    domain_service: .domain-service.ts
    domain_event: .domain-event.ts
    rule: .rule.ts
    invariant: .invariant.ts
    policy: .policy.ts
    specification: .specification.ts
    guard: .guard.ts
    selector: .selector.ts
    strategy: .strategy.ts
    mapper: .mapper.ts
    normalizer: .normalizer.ts
    formatter: .formatter.ts
    serializer: .serializer.ts
    parser: .parser.ts
    dto: .dto.ts
    request: .request.ts
    response: .response.ts
    interface: .interface.ts
    port: .port.ts
    contract: .contract.ts
    client: .client.ts
    adapter: .adapter.ts
    integration_event: .integration-event.ts
    listener: .listener.ts
    subscriber: .subscriber.ts
    consumer: .consumer.ts
    producer: .producer.ts
    publisher: .publisher.ts
    scheduler: .scheduler.ts
    repository: .repository.ts
    query_builder: .query-builder.ts
    schema: .schema.ts
    model: .model.ts
    record: .record.ts
    migration: .migration.ts
    seed: .seed.ts
    read_model: .read-model.ts
    projection: .projection.ts
    transaction: .transaction.ts
    unit_of_work: .unit-of-work.ts
    factory: .factory.ts
    builder: .builder.ts
    provider: .provider.ts
    registry: .registry.ts
    resolver: .resolver.ts
    error: .error.ts
    exception: .exception.ts
    error_code: .error-code.ts
    result: .result.ts
    types: .types.ts
    enum: .enum.ts
    constants: .const.ts
    config: .config.ts
    util: .util.ts
    unit_test:
    - .unit-test.ts
    - .unit.spec.ts
    integration_test:
    - .integration-test.ts
    - .integration.spec.ts
    e2e_test:
    - .e2e-test.ts
    - .e2e.spec.ts
    contract_test: .contract-test.ts
    api_contract_test: .api-contract-test.ts
    event_contract_test: .event-contract-test.ts
    architecture_test: .architecture-test.ts
    boundary_test: .boundary-test.ts
    mock: .mock.ts
    stub: .stub.ts
    fake: .fake.ts
    spy: .spy.ts
    fixture: .fixture.ts
    test_factory: .test-factory.ts
    test_builder: .test-builder.ts
    assertion: .assertion.ts
    matcher: .matcher.ts
  canonical_source_full:
    version: '1.0'
    system:
      name: class-role-classifier
      purpose: 'Determine the correct architectural role (file suffix) for a class based on its responsibilities, behavior,
        and constraints.

        '
      philosophy:
      - Every class has exactly one role
      - Roles are defined by responsibility, not naming
      - If multiple roles apply → decomposition required
      - If unclear → fail_closed
      - Behavior defines placement, not intention
      enforcement:
        mode: strict
        ambiguity_policy: fail_closed
        multi_role_policy: reject_and_decompose
    input:
      class_description:
        responsibilities: []
        has_side_effects: boolean
        mutates_state: boolean
        depends_on_external_systems: boolean
        contains_business_rules: boolean
        is_pure_functional: boolean
        scope: single_action | multi_step | utility | structural | data | decision
        input_output_shape: none | transforms | validates | constructs
        interacts_with:
        - http
        - websocket
        - database
        - external_api
        - event_system
        - none
    evaluation_order:
    - detect_transport_layer
    - detect_execution_layer
    - detect_decision_layer
    - detect_transformation_layer
    - detect_domain_layer
    - detect_data_layer
    - detect_integration_layer
    - detect_construction_layer
    - detect_validation_layer
    - detect_resolution_layer
    - detect_structure_layer
    - detect_config_layer
    - detect_error_layer
    - detect_type_layer
    - detect_constants_layer
    - fallback
    roles:
      controller:
        suffix: .controller.ts
        match:
          interacts_with:
          - http
        rules:
        - handles incoming requests
        - delegates logic outward
        forbidden:
        - contains_business_rules
        - has_side_effects
        output: controller
      gateway:
        suffix: .gateway.ts
        match:
          interacts_with:
          - websocket
        rules:
        - manages connections
        - handles real-time messaging
        forbidden:
        - contains_business_rules
        output: gateway
      use_case:
        suffix: .use-case.ts
        match:
          scope: single_action
          contains_business_rules: true
        rules:
        - one input → one outcome
        - encapsulates full action
        output: use_case
      service:
        suffix: .service.ts
        match:
          has_side_effects: true
          scope: multi_step
        rules:
        - coordinates dependencies
        - owns side effects
        output: service
      orchestrator:
        suffix: .orchestrator.ts
        match:
          scope: multi_step
          contains_business_rules: false
        rules:
        - controls execution flow
        forbidden:
        - contains_business_rules
        output: orchestrator
      policy:
        suffix: .policy.ts
        match:
          contains_business_rules: true
          mutates_state: false
          has_side_effects: false
        rules:
        - returns decision
        output: policy
      specification:
        suffix: .specification.ts
        match:
          contains_business_rules: true
          is_composable: true
        rules:
        - composable logic
        output: specification
      selector:
        suffix: .selector.ts
        match:
          scope: decision
        rules:
        - chooses one option
        output: selector
      guard:
        suffix: .guard.ts
        match:
          scope: decision
          context_based: true
        rules:
        - authorization logic
        output: guard
      mapper:
        suffix: .mapper.ts
        match:
          input_output_shape: transforms
          is_pure_functional: true
        rules:
        - shape transformation
        output: mapper
      normalizer:
        suffix: .normalizer.ts
        match:
          scope: utility
        rules:
        - standardizes values
        output: normalizer
      formatter:
        suffix: .formatter.ts
        match:
          scope: utility
          output_formatting: true
        rules:
        - presentation transformation
        output: formatter
      domain:
        suffix: .domain.ts
        match:
          contains_business_rules: true
          mutates_state: true
          depends_on_external_systems: false
        rules:
        - encapsulates core business logic
        output: domain
      event:
        suffix: .event.ts
        match:
          is_immutable: true
        rules:
        - represents something that happened
        output: event
      listener:
        suffix: .listener.ts
        match:
          interacts_with:
          - event_system
        rules:
        - reacts to events
        output: listener
      publisher:
        suffix: .publisher.ts
        match:
          interacts_with:
          - event_system
          has_side_effects: true
        rules:
        - emits events
        output: publisher
      repository:
        suffix: .repository.ts
        match:
          interacts_with:
          - database
        rules:
        - data access abstraction
        forbidden:
        - contains_business_rules
        output: repository
      schema:
        suffix: .schema.ts
        match:
          scope: data
        rules:
        - defines structure only
        output: schema
      client:
        suffix: .client.ts
        match:
          interacts_with:
          - external_api
        rules:
        - external communication
        output: client
      adapter:
        suffix: .adapter.ts
        match:
          transforms_interfaces: true
        rules:
        - bridges systems
        output: adapter
      factory:
        suffix: .factory.ts
        match:
          input_output_shape: constructs
        rules:
        - creates objects
        output: factory
      builder:
        suffix: .builder.ts
        match:
          step_by_step_construction: true
        rules:
        - incremental build
        output: builder
      validator:
        suffix: .validator.ts
        match:
          input_output_shape: validates
        rules:
        - validation only
        output: validator
      resolver:
        suffix: .resolver.ts
        match:
          dynamic_resolution: true
        rules:
        - resolves implementation
        output: resolver
      strategy:
        suffix: .strategy.ts
        match:
          interchangeable_algorithms: true
        rules:
        - multiple implementations
        output: strategy
      module:
        suffix: .module.ts
        match:
          scope: structural
        rules:
        - wires dependencies
        forbidden:
        - contains_business_rules
        output: module
      dto:
        suffix: .dto.ts
        match:
          scope: data
          transport_related: true
        rules:
        - transport shape
        output: dto
      config:
        suffix: .config.ts
        match:
          scope: configuration
        rules:
        - static values
        output: config
      error:
        suffix: .error.ts
        match:
          represents_error: true
        rules:
        - error definition
        output: error
      types:
        suffix: .types.ts
        match:
          type_only: true
        rules:
        - no runtime code
        output: types
      constants:
        suffix: .const.ts
        match:
          scope: constants
        rules:
        - static values
        output: constants
      enum:
        suffix: .enum.ts
        match:
          finite_set: true
        rules:
        - controlled values
        output: enum
      util:
        suffix: .util.ts
        match:
          scope: utility
        rules:
        - stateless helper
        warning: last resort role
        output: util
validation:
  fail_conditions:
  - placement_rule_forces_folder_creation
  - placement_overrides_architecture_layer
  - suffix_mismatch_with_role_taxonomy
