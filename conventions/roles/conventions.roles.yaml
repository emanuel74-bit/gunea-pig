version: '1.0'
file:
  name: conventions.roles.yaml
  path: roles/conventions.roles.yaml
  role: role_system_entrypoint
  executability: advisory_entrypoint
purpose: Entrypoint and execution order for role taxonomy, resolution, collision, and placement.
ownership:
  owns:
  - role_system_metadata
  - role_file_index
  - role_system_execution_order
  does_not_own:
  - role_definitions
  - role_resolution_details
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - roles_result
dependencies:
  required_files: []
  optional_files: []
sections:
  role_file_index:
    taxonomy: roles/conventions.role-taxonomy.yaml
    resolution: roles/conventions.role-resolution.yaml
    collisions: roles/conventions.role-collisions.yaml
    placement: roles/conventions.role-placement.yaml
  role_system_execution_order:
  - load_role_taxonomy
  - resolve_roles
  - resolve_collisions
  - apply_placement_affinity
  - produce_role_system_result
  canonical_role_classifier_system: &id001
    name: class-role-classifier
    purpose: 'Determine the correct architectural role (file suffix) for a class based on its responsibilities, behavior,
      and constraints.

      '
    philosophy:
    - Every class has exactly one role
    - Roles are defined by responsibility, not naming
    - If multiple roles apply → decomposition required
    - If unclear → fail_closed
    - Behavior defines placement, not intention
    enforcement:
      mode: strict
      ambiguity_policy: fail_closed
      multi_role_policy: reject_and_decompose
  canonical_role_count: 33
  semantic_depth_restoration:
    restored_from: conventions.roles.yaml
    restoration_scope:
    - system
    - roles
    restoration_policy: canonical_source_preserved_under_standard_file_contract
    do_not_replace_with_summary: true
  canonical_restored_source:
    system: *id001
    roles:
      controller:
        suffix: .controller.ts
        match:
          interacts_with:
          - http
        rules:
        - handles incoming requests
        - delegates logic outward
        forbidden:
        - contains_business_rules
        - has_side_effects
        output: controller
      gateway:
        suffix: .gateway.ts
        match:
          interacts_with:
          - websocket
        rules:
        - manages connections
        - handles real-time messaging
        forbidden:
        - contains_business_rules
        output: gateway
      use_case:
        suffix: .use-case.ts
        match:
          scope: single_action
          contains_business_rules: true
        rules:
        - one input → one outcome
        - encapsulates full action
        output: use_case
      service:
        suffix: .service.ts
        match:
          has_side_effects: true
          scope: multi_step
        rules:
        - coordinates dependencies
        - owns side effects
        output: service
      orchestrator:
        suffix: .orchestrator.ts
        match:
          scope: multi_step
          contains_business_rules: false
        rules:
        - controls execution flow
        forbidden:
        - contains_business_rules
        output: orchestrator
      policy:
        suffix: .policy.ts
        match:
          contains_business_rules: true
          mutates_state: false
          has_side_effects: false
        rules:
        - returns decision
        output: policy
      specification:
        suffix: .specification.ts
        match:
          contains_business_rules: true
          is_composable: true
        rules:
        - composable logic
        output: specification
      selector:
        suffix: .selector.ts
        match:
          scope: decision
        rules:
        - chooses one option
        output: selector
      guard:
        suffix: .guard.ts
        match:
          scope: decision
          context_based: true
        rules:
        - authorization logic
        output: guard
      mapper:
        suffix: .mapper.ts
        match:
          input_output_shape: transforms
          is_pure_functional: true
        rules:
        - shape transformation
        output: mapper
      normalizer:
        suffix: .normalizer.ts
        match:
          scope: utility
        rules:
        - standardizes values
        output: normalizer
      formatter:
        suffix: .formatter.ts
        match:
          scope: utility
          output_formatting: true
        rules:
        - presentation transformation
        output: formatter
      domain:
        suffix: .domain.ts
        match:
          contains_business_rules: true
          mutates_state: true
          depends_on_external_systems: false
        rules:
        - encapsulates core business logic
        output: domain
      event:
        suffix: .event.ts
        match:
          is_immutable: true
        rules:
        - represents something that happened
        output: event
      listener:
        suffix: .listener.ts
        match:
          interacts_with:
          - event_system
        rules:
        - reacts to events
        output: listener
      publisher:
        suffix: .publisher.ts
        match:
          interacts_with:
          - event_system
          has_side_effects: true
        rules:
        - emits events
        output: publisher
      repository:
        suffix: .repository.ts
        match:
          interacts_with:
          - database
        rules:
        - data access abstraction
        forbidden:
        - contains_business_rules
        output: repository
      schema:
        suffix: .schema.ts
        match:
          scope: data
        rules:
        - defines structure only
        output: schema
      client:
        suffix: .client.ts
        match:
          interacts_with:
          - external_api
        rules:
        - external communication
        output: client
      adapter:
        suffix: .adapter.ts
        match:
          transforms_interfaces: true
        rules:
        - bridges systems
        output: adapter
      factory:
        suffix: .factory.ts
        match:
          input_output_shape: constructs
        rules:
        - creates objects
        output: factory
      builder:
        suffix: .builder.ts
        match:
          step_by_step_construction: true
        rules:
        - incremental build
        output: builder
      validator:
        suffix: .validator.ts
        match:
          input_output_shape: validates
        rules:
        - validation only
        output: validator
      resolver:
        suffix: .resolver.ts
        match:
          dynamic_resolution: true
        rules:
        - resolves implementation
        output: resolver
      strategy:
        suffix: .strategy.ts
        match:
          interchangeable_algorithms: true
        rules:
        - multiple implementations
        output: strategy
      module:
        suffix: .module.ts
        match:
          scope: structural
        rules:
        - wires dependencies
        forbidden:
        - contains_business_rules
        output: module
      dto:
        suffix: .dto.ts
        match:
          scope: data
          transport_related: true
        rules:
        - transport shape
        output: dto
      config:
        suffix: .config.ts
        match:
          scope: configuration
        rules:
        - static values
        output: config
      error:
        suffix: .error.ts
        match:
          represents_error: true
        rules:
        - error definition
        output: error
      types:
        suffix: .types.ts
        match:
          type_only: true
        rules:
        - no runtime code
        output: types
      constants:
        suffix: .const.ts
        match:
          scope: constants
        rules:
        - static values
        output: constants
      enum:
        suffix: .enum.ts
        match:
          finite_set: true
        rules:
        - controlled values
        output: enum
      util:
        suffix: .util.ts
        match:
          scope: utility
        rules:
        - stateless helper
        warning: last resort role
        output: util
validation:
  required_checks: []
  fail_conditions: []
