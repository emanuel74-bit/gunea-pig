version: '1.0'
file:
  name: conventions.roles.yaml
  path: roles/conventions.roles.yaml
  role: role_system_entrypoint
  executability: advisory_entrypoint
purpose: Entrypoint and execution order for role taxonomy, role resolution, collision handling, and role placement affinity.
ownership:
  owns:
  - role_system_metadata
  - role_file_index
  - role_system_execution_order
  - role_system_contract
  does_not_own:
  - detailed_role_definitions
  - detailed_collision_rules
  - pattern_catalog
  - structure_strategy
activation:
  mode: entrypoint
  activates_when:
  - role system is needed
  skips_when: []
inputs:
  required:
  - artifact_candidates
  optional:
  - post_action_artifact_candidates
outputs:
  produces:
  - role_system_result
  - role_assignment_table
dependencies:
  required_files:
  - roles/conventions.role-taxonomy.yaml
  - roles/conventions.role-resolution.yaml
  - roles/conventions.role-collisions.yaml
  - roles/conventions.role-placement.yaml
  optional_files: []
sections:
  role_system_metadata:
    mode: strict
    ambiguity_policy: fail_closed
    multi_role_policy: reject_and_decompose
    default_behavior: no_role_without_evidence
  role_file_index:
    taxonomy: roles/conventions.role-taxonomy.yaml
    resolution: roles/conventions.role-resolution.yaml
    collisions: roles/conventions.role-collisions.yaml
    placement: roles/conventions.role-placement.yaml
  role_system_execution_order:
  - load_role_taxonomy
  - detect_role_signals
  - resolve_roles
  - resolve_collisions_if_needed
  - reject_or_decompose_multi_role_artifacts
  - apply_role_placement_affinity
  - produce_role_assignment_table
  role_system_contract:
    must_output: role_assignment_table
    must_not_output:
    - final_folder_structure
    - pattern_decision
    - artifact_action_decision
    authority: roles classify artifact responsibility only
validation:
  required_checks:
  - role_subfiles_exist
  - role_assignment_table_produced
  - no_deprecated_alias_as_final_role
  fail_conditions:
  - role_subfile_missing
  - role_system_output_missing_role_assignment_table
  - role_system_selected_deprecated_alias
  - role_system_bypassed_collision_resolution
