version: '1.0'
file:
  name: conventions.role-taxonomy.yaml
  path: roles/conventions.role-taxonomy.yaml
  role: role_taxonomy_contract
  executability: vocabulary
purpose: Define artifact roles, suffixes, and responsibility signals.
ownership:
  owns:
  - role_enum
  - role_definitions
  - suffix_policy
  - role_detection_signals
  does_not_own:
  - role_resolution_process
  - role_collision_resolution
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - role_taxonomy_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  role_enum:
    allowed:
    - module
    - controller
    - gateway
    - webhook
    - consumer
    - producer
    - service
    - use_case
    - handler
    - command
    - query
    - orchestrator
    - workflow
    - policy
    - rule
    - specification
    - invariant
    - entity
    - aggregate
    - value_object
    - domain_service
    - domain_event
    - repository
    - port
    - adapter
    - client
    - mapper
    - normalizer
    - formatter
    - parser
    - serializer
    - factory
    - builder
    - strategy
    - validator
    - guard
    - interceptor
    - middleware
    - schema
    - model
    - record
    - migration
    - projection
    - read_model
    - resolver
    - presenter
    - config
    - provider
    - scheduler
    - job
    - fixture
    - fake
    - mock
    - stub
    - spy
    - test_factory
    - selector
    - domain
    - event
    - listener
    - publisher
    - dto
    - error
    - types
    - constants
    - enum
    - util
    - structural_framework
    - transport_entry
    - application_execution
    - domain_model
    - domain_constraint
    - decision
    - transformation
    - transport_contract
    - architectural_boundary
    - integration_boundary
    - integration_async
    - persistence_data
    - construction_resolution
    - error_result
    - type_static
    - testing_verification
    - fallback
  role_definitions:
    module:
      suffix: .module.ts
      match:
        scope: structural
      rules:
      - wires dependencies
      forbidden:
      - contains_business_rules
      output: module
      canonical_source: conventions.roles.yaml#roles
      definition: module role. wires dependencies
      family: supporting_component
      purpose: module role. wires dependencies
      detection_signals:
      - scope: structural
      choose_when:
      - the artifact has exactly one primary module responsibility
      - the responsibility matches this role better than any more specific role
      reject_when:
      - artifact has multiple unrelated responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer
      must:
      - wires dependencies
      owns:
      - module responsibility
      - role-local invariants and outputs
      does_not_own:
      - unrelated business rules
      - unrelated persistence or transport concerns
      - pipeline orchestration unless this role explicitly is an orchestrator/controller
      validation_rules:
      - file using .module.ts must satisfy module role boundaries
      - must not match forbidden responsibilities
      - must be split when mixed responsibilities are detected
      status: active
      meaning: Represents the module case within the role taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
