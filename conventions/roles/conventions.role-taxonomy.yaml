      - role-local invariants, inputs, outputs, and public surface
      does_not_own:
      - unrelated responsibilities
      - responsibilities assigned to a more specific role
      - runtime orchestration outside the role boundary
      allowed_dependencies:
      - same or inward layer dependencies permitted by architecture rules
      - declared ports/contracts
      - pure helpers when role-appropriate
      forbidden_dependencies:
      - forbidden cross-layer imports
      - direct dependency on infrastructure when role is inner-layer
      - cyclic dependencies
      validation_rules:
      - artifact assigned gateway must satisfy gateway choose_when conditions
      - artifact assigned gateway must not satisfy reject_when conditions
      - artifact must be split when multiple primary roles remain after collision resolution
      status: active
    webhook:
      family: transport_entry
      suffix: .webhook.ts
      definition: Inbound external callback entry role that authenticates or validates callback payloads, normalizes transport
        concerns, and delegates processing outward.
      positive_signals:
      - receives third-party or external callbacks
      - validates callback transport payloads
      - delegates to application processing
      negative_signals:
      - multiple primary responsibilities detected
      - the artifact has multiple unrelated primary responsibilities
      - a more specific role applies
      choose_when:
      - artifact responsibility matches webhook
      - the artifact's primary responsibility is webhook
      - the artifact matches webhook signals more strongly than competing roles
      reject_when:
      - multiple primary responsibilities detected
      - the artifact has multiple unrelated primary responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer or boundary
      must:
      - own exactly one responsibility
      - keep dependencies consistent with its layer
      - expose a clear public surface appropriate to the role
      - own exactly one primary responsibility
      - keep dependencies consistent with the assigned layer and boundary
      - expose only the surface implied by the role
      forbidden:
      - general HTTP routes are better modeled as controller
      - queue messages are better modeled as consumer
      - mixed responsibilities
      - hidden cross-layer behavior
      - owning side effects outside the role boundary
      - side effects outside the role boundary unless explicitly owned by the role
      owns:
      - webhook responsibility
      - role-local invariants, inputs, outputs, and public surface
      does_not_own:
      - unrelated responsibilities
      - responsibilities assigned to a more specific role
      - runtime orchestration outside the role boundary
      allowed_dependencies:
      - same or inward layer dependencies permitted by architecture rules
      - declared ports/contracts
      - pure helpers when role-appropriate
      forbidden_dependencies:
