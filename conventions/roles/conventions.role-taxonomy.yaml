    handler:
      family: application_execution
      suffix: .handler.ts
      definition: Execution role that handles a command, query, event, or framework-dispatched message by delegating or coordinating
        the appropriate application action.
      positive_signals:
      - method/class is invoked by dispatcher
      - handles command/query/event envelope
