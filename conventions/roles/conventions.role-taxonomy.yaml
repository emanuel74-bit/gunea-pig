      negative_signals:
      - multiple primary responsibilities detected
      - the artifact has multiple unrelated primary responsibilities
      - a more specific role applies
      choose_when:
      - artifact responsibility matches handler
      - the artifact's primary responsibility is handler
      - the artifact matches handler signals more strongly than competing roles
      reject_when:
