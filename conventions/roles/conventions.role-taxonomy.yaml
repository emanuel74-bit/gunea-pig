      - used by command handler or use case
      negative_signals:
      - multiple primary responsibilities detected
      - the artifact has multiple unrelated primary responsibilities
      - a more specific role applies
      choose_when:
      - artifact responsibility matches command
      - the artifact's primary responsibility is command
      - the artifact matches command signals more strongly than competing roles
      reject_when:
