      - expose a clear public surface appropriate to the role
      - own exactly one primary responsibility
      - keep dependencies consistent with the assigned layer and boundary
      - expose only the surface implied by the role
      forbidden:
      - a single business action with direct application API is use_case
      - multi-step workflow control is orchestrator/workflow
      - mixed responsibilities
      - hidden cross-layer behavior
      - owning side effects outside the role boundary
