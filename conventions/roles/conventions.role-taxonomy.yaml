      - the artifact would own behavior from another layer
      choose_when:
      - the artifact has exactly one primary use case responsibility
      - the responsibility matches this role better than any more specific role
      - the artifact's primary responsibility is use case
      - the artifact matches use case signals more strongly than competing roles
      reject_when:
