      - the responsibility matches this role better than any more specific role
      - the artifact's primary responsibility is gateway
      - the artifact matches gateway signals more strongly than competing roles
      reject_when:
      - artifact has multiple unrelated responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer
      - the artifact has multiple unrelated primary responsibilities
      - the artifact would own behavior from another layer or boundary
      must:
