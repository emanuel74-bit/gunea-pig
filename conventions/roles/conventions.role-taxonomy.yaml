      - artifact must be split when multiple primary roles remain after collision resolution
      status: active
    interceptor:
      family: transport_entry
      suffix: .interceptor.ts
      definition: Transport/framework boundary role that wraps request/response execution for cross-cutting framework concerns.
      positive_signals:
      - framework interception point
      - wraps transport execution
      - handles logging/metrics/serialization/cross-cutting concerns
      negative_signals:
      - multiple primary responsibilities detected
      - the artifact has multiple unrelated primary responsibilities
      - a more specific role applies
      choose_when:
      - artifact responsibility matches interceptor
      - the artifact's primary responsibility is interceptor
      - the artifact matches interceptor signals more strongly than competing roles
      reject_when:
      - multiple primary responsibilities detected
      - the artifact has multiple unrelated primary responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer or boundary
      must:
      - own exactly one responsibility
      - keep dependencies consistent with its layer
      - expose a clear public surface appropriate to the role
      - own exactly one primary responsibility
      - keep dependencies consistent with the assigned layer and boundary
      - expose only the surface implied by the role
      forbidden:
      - business authorization is guard/policy
      - middleware is lower-level request pipeline
      - mixed responsibilities
      - hidden cross-layer behavior
      - owning side effects outside the role boundary
      - side effects outside the role boundary unless explicitly owned by the role
      owns:
      - interceptor responsibility
      - role-local invariants, inputs, outputs, and public surface
      does_not_own:
      - unrelated responsibilities
      - responsibilities assigned to a more specific role
      - runtime orchestration outside the role boundary
      allowed_dependencies:
