      definition: fallback role responsible for one explicit system responsibility; it must be selected only when its detection
        signals match and no more specific role applies.
      purpose: fallback role responsible for one explicit system responsibility; it must be selected only when its detection
        signals match and no more specific role applies.
      detection_signals:
      - artifact primary responsibility is fallback
      - file suffix or behavior indicates fallback responsibility
      choose_when:
      - the artifact has exactly one primary fallback responsibility
      - the responsibility matches this role better than any more specific role
      reject_when:
      - artifact has multiple unrelated responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer
      must:
      - own exactly one responsibility
      - keep dependencies consistent with its layer
      - expose a clear public surface appropriate to the role
      forbidden:
      - mixed responsibilities
      - hidden cross-layer behavior
      - owning side effects outside the role boundary
      owns:
      - fallback responsibility
      - role-local invariants and outputs
      does_not_own:
      - unrelated business rules
      - unrelated persistence or transport concerns
      - pipeline orchestration unless this role explicitly is an orchestrator/controller
      validation_rules:
      - file using .fallback.ts must satisfy fallback role boundaries
      - must not match forbidden responsibilities
      - must be split when mixed responsibilities are detected
      status: active
      meaning: Represents the fallback case within the role taxonomy.
      required_evidence:
      - source report reference or explicit no_evidence_available marker
