version: '1.0'
file:
  name: conventions.role-taxonomy.yaml
  path: roles/conventions.role-taxonomy.yaml
  role: role_taxonomy_contract
  executability: vocabulary
purpose: Define artifact roles, role families, suffixes, and machine-detectable responsibility signals.
ownership:
  owns:
  - role_enum
  - role_family_enum
  - role_definitions
  - role_aliases
  - suffix_policy
  - role_detection_signals
  does_not_own:
  - role_resolution_process
  - role_collision_resolution
  - pattern_selection
  - physical_folder_strategy
activation:
  mode: always
  activates_when:
  - artifact roles must be classified
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - role_taxonomy_registry
  - role_definition_registry
  - suffix_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  taxonomy_policy:
    principles:
    - specific_role_before_generic_role
    - service_is_not_default
    - util_is_last_resort
    - domain_is_category_not_file_role
    - event_must_resolve_to_domain_event_or_integration_event
    - one_artifact_one_primary_role
    ambiguity_policy: fail_closed
    multi_role_policy: reject_and_decompose
  role_definition_schema:
    required_fields:
    - family
    - suffix
    - definition
    - positive_signals
    - negative_signals
    - choose_when
    - reject_when
    - must
    - forbidden
    - owns
    - does_not_own
    - validation_rules
    - status
  role_family_enum:
    allowed:
    - structural_framework
    - transport_entry
    - application_execution
    - domain_model
    - domain_constraint
    - decision
    - transformation
    - transport_contract
    - architectural_boundary
    - integration_boundary
    - integration_async
    - persistence_data
    - construction_resolution
    - error_result
    - type_static
    - testing_verification
    - fallback
  role_family_definitions:
    structural_framework:
      definition: Framework wiring and dependency composition roles.
      roles:
      - module
    transport_entry:
      definition: Inbound transport and framework entrypoint roles.
      roles:
      - controller
      - gateway
      - webhook
      - interceptor
      - middleware
    application_execution:
      definition: Application-level execution and coordination roles.
      roles:
      - use_case
      - command
      - query
      - handler
      - service
      - orchestrator
      - workflow
      - job
      - task
      - processor
    domain_model:
      definition: Domain state, identity, and core model roles.
      roles:
      - entity
      - value_object
      - aggregate
      - domain_service
      - domain_event
    domain_constraint:
      definition: Domain constraint, rule, validation, and decision roles.
      roles:
      - rule
      - invariant
      - validator
    decision:
      definition: Runtime selection and interchangeable behavior roles.
      roles:
      - policy
      - specification
      - guard
      - selector
      - strategy
    transformation:
      definition: Pure transformation and representation conversion roles.
      roles:
      - mapper
      - normalizer
      - formatter
      - serializer
      - parser
      - presenter
    transport_contract:
      definition: Transport and public data contract roles.
      roles:
      - dto
      - request
      - response
    architectural_boundary:
      definition: Dependency inversion and cross-boundary roles.
      roles:
      - interface
      - port
      - contract
    integration_boundary:
      definition: External system, adapter, and client roles.
      roles:
      - client
      - adapter
    integration_async:
      definition: Asynchronous event/message roles.
      roles:
      - integration_event
      - listener
      - subscriber
      - consumer
      - producer
      - publisher
      - scheduler
    persistence_data:
      definition: Persistence, query, model, and data consistency roles.
      roles:
      - repository
      - query_builder
      - schema
      - model
      - record
      - migration
      - seed
      - read_model
      - projection
      - transaction
      - unit_of_work
    construction_resolution:
      definition: Object creation, registration, provider, and resolution roles.
      roles:
      - factory
      - builder
      - provider
      - registry
      - resolver
    error_result:
      definition: Error, exception, result, and failure representation roles.
      roles:
      - error
      - exception
      - error_code
      - result
    type_static:
      definition: Static type, enum, constant, and configuration roles.
      roles:
      - types
      - enum
      - constants
      - config
    testing_verification:
      definition: Testing, test double, and test helper roles.
      roles:
      - unit_test
      - integration_test
      - e2e_test
      - contract_test
      - api_contract_test
      - event_contract_test
      - architecture_test
      - boundary_test
      - mock
      - stub
      - fake
      - spy
      - fixture
      - test_factory
      - test_builder
      - assertion
      - matcher
    fallback:
      definition: Last-resort roles that require explicit justification.
      roles:
      - util
