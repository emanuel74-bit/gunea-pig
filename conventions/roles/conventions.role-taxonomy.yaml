  role_definitions:
    module:
      family: structural_framework
      suffix: .module.ts
      definition: module role that wires dependencies.
      positive_signals:
      - scope matches structural
      - wires dependencies
      negative_signals:
      - artifact has multiple unrelated responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer
      choose_when:
      - the artifact has exactly one primary module responsibility
      - the responsibility matches this role better than any more specific role
      - the artifact's primary responsibility is module
      - the artifact matches module signals more strongly than competing roles
      reject_when:
      - artifact has multiple unrelated responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer
      - the artifact has multiple unrelated primary responsibilities
      - the artifact would own behavior from another layer or boundary
      must:
      - wires dependencies
      - own exactly one primary responsibility
      - keep dependencies consistent with the assigned layer and boundary
      - expose only the surface implied by the role
      forbidden:
      - contains_business_rules
      - mixed responsibilities
      - hidden cross-layer behavior
      - side effects outside the role boundary unless explicitly owned by the role
      owns:
      - module responsibility
      - role-local invariants, inputs, outputs, and public surface
      does_not_own:
      - unrelated responsibilities
      - responsibilities assigned to a more specific role
      - runtime orchestration outside the role boundary
      allowed_dependencies:
      - same or inward layer dependencies permitted by architecture rules
      - declared ports/contracts
      - pure helpers when role-appropriate
      forbidden_dependencies:
      - forbidden cross-layer imports
      - direct dependency on infrastructure when role is inner-layer
      - cyclic dependencies
      validation_rules:
      - artifact assigned module must satisfy module choose_when conditions
      - artifact assigned module must not satisfy reject_when conditions
      - artifact must be split when multiple primary roles remain after collision resolution
      status: active
    controller:
      family: transport_entry
      suffix: .controller.ts
      definition: controller role that handles incoming requests, delegates logic outward.
      positive_signals:
      - interacts_with matches ['http']
      - handles incoming requests
      - delegates logic outward
      negative_signals:
      - artifact has multiple unrelated responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer
      choose_when:
      - the artifact has exactly one primary controller responsibility
      - the responsibility matches this role better than any more specific role
      - the artifact's primary responsibility is controller
      - the artifact matches controller signals more strongly than competing roles
      reject_when:
      - artifact has multiple unrelated responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer
      - the artifact has multiple unrelated primary responsibilities
      - the artifact would own behavior from another layer or boundary
      must:
      - handles incoming requests
      - delegates logic outward
      - own exactly one primary responsibility
      - keep dependencies consistent with the assigned layer and boundary
      - expose only the surface implied by the role
      forbidden:
      - contains_business_rules
      - has_side_effects
      - mixed responsibilities
      - hidden cross-layer behavior
      - side effects outside the role boundary unless explicitly owned by the role
      owns:
      - controller responsibility
      - role-local invariants, inputs, outputs, and public surface
      does_not_own:
      - unrelated responsibilities
      - responsibilities assigned to a more specific role
      - runtime orchestration outside the role boundary
      allowed_dependencies:
      - same or inward layer dependencies permitted by architecture rules
      - declared ports/contracts
      - pure helpers when role-appropriate
      forbidden_dependencies:
      - forbidden cross-layer imports
      - direct dependency on infrastructure when role is inner-layer
      - cyclic dependencies
      validation_rules:
      - artifact assigned controller must satisfy controller choose_when conditions
      - artifact assigned controller must not satisfy reject_when conditions
      - artifact must be split when multiple primary roles remain after collision resolution
      status: active
    gateway:
      family: transport_entry
      suffix: .gateway.ts
      definition: gateway role that manages connections, handles real-time messaging.
      positive_signals:
      - interacts_with matches ['websocket']
      - manages connections
      - handles real-time messaging
      negative_signals:
      - artifact has multiple unrelated responsibilities
      - a more specific role applies
      - the artifact would own behavior from another layer
      choose_when:
