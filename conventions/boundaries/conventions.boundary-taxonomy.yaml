version: '1.0'
file:
  name: conventions.boundary-taxonomy.yaml
  path: boundaries/conventions.boundary-taxonomy.yaml
  role: boundary_taxonomy_contract
  executability: vocabulary
purpose: 'Define pure boundary vocabulary: boundary types, surfaces, visibility, ownership, relationships, and risk signal vocabulary.'
ownership:
  owns:
  - boundary_type_enum
  - boundary_type_definitions
  - boundary_surface_enum
  - boundary_surface_definitions
  - boundary_visibility_enum
  - boundary_visibility_definitions
  - boundary_ownership_enum
  - boundary_ownership_definitions
  - boundary_relationship_schema
  - boundary_risk_signal_vocabulary
  does_not_own:
  - boundary_classification_rules
  - boundary_validation_algorithm
  - contract_compatibility_strategy
  - dependency_direction_policy
  - boundary_crossing_rules
  - allowed_crossing_mechanisms
  - boundary_leak_detection_rules
activation:
  mode: reference_only
  activates_when:
  - boundary_values_are_referenced
  - boundary_contract_classification_phase_active
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - boundary_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
  boundary_type_enum:
    allowed:
    - transport_boundary
    - public_api_boundary
    - internal_api_boundary
    - module_boundary
    - domain_boundary
    - application_boundary
    - persistence_boundary
    - external_system_boundary
    - event_boundary
    - message_queue_boundary
    - realtime_boundary
    - file_storage_boundary
    - configuration_boundary
    - security_boundary
    - transaction_boundary
    - process_boundary
    - test_boundary
  boundary_surface_enum:
    allowed:
    - inbound
    - outbound
    - bidirectional
    - internal
    - public
    - private
  boundary_visibility_enum:
    allowed:
    - private
    - module_public
    - workspace_public
    - external_public
    - unknown
  boundary_ownership_enum:
    allowed:
    - single_artifact
    - single_module
    - shared_kernel
    - external_consumer
    - third_party
  boundary_type_definitions:
    transport_boundary:
      definition: Boundary where external transport protocols enter or leave the system, such as HTTP, WebSocket, RPC, queue consumers, cron triggers, or CLI commands.
      positive_signals:
      - artifact receives external request or message
      - artifact translates transport payload into application input
      - artifact owns decorators/routes/message handlers/listeners
      - artifact is called by framework/runtime rather than domain code
      negative_signals:
      - artifact is only called by internal services
      - artifact only models business concepts
      - artifact only reads/writes persistence without accepting external input
      risk_signals:
      - raw payload passed into domain
      - transport response shape reused as domain model
      - controller imports repository or ORM model
      examples:
      - HTTP controller
      - WebSocket gateway
      - queue consumer
      - CLI command handler
    public_api_boundary:
      definition: Consumer-visible contract boundary for APIs, exported modules, events, DTOs, SDK surfaces, or package/public exports.
      positive_signals:
      - external or cross-module consumers depend on shape or name
      - artifact is exported from public index/module
      - request/response/event schema is part of contract
      - change can break callers outside current unit
      negative_signals:
      - private helper not exported
      - internal class only used inside one module
      - implementation detail hidden behind stable interface
      risk_signals:
      - unknown consumers
      - breaking field removal
      - semantic behavior change under same contract name
      examples:
      - REST API DTO
      - published event payload
      - package export
      - SDK method signature
    internal_api_boundary:
      definition: Stable internal module or service-facing API used inside the codebase but not exposed to external consumers.
      positive_signals:
      - multiple internal modules call the interface
      - method/input/output shape is shared across features
      - change requires coordinated call-site updates
      negative_signals:
      - private method used by one class
      - pure implementation detail inside one artifact
      risk_signals:
      - shared service signature changes
      - internal DTO reused as persistence model
      - cyclic module dependency
      examples:
      - shared application service
      - module exported provider
      - internal command interface
    module_boundary:
      definition: Boundary around a cohesive feature/module that controls what artifacts are imported, exported, and visible to other modules.
      positive_signals:
      - folder/module represents business capability
      - explicit module exports/imports exist
      - other modules should depend only on public surface
      - private internals should not be imported directly
      negative_signals:
      - flat utility folder without business ownership
      - single file grouping with no dependency boundary
      risk_signals:
      - deep imports across module folders
      - module exports too many artifacts
      - bidirectional imports
      examples:
      - NestJS feature module
      - domain capability module
      - bounded feature folder
    domain_boundary:
      definition: Boundary around core business concepts, invariants, and policies that should remain independent of transport, persistence, and framework details.
      positive_signals:
      - business invariant or policy is expressed
      - entity/value object/domain service is involved
      - logic should be testable without infrastructure
      - names come from business language
      negative_signals:
      - framework decorator is required
      - logic only maps transport/persistence shapes
      - artifact only performs IO
      risk_signals:
      - domain imports NestJS/Express/ORM packages
      - domain object accepts raw DTO/entity
      - business rule placed in controller or repository
      examples:
      - policy
      - domain service
      - entity behavior
      - value object validation
    application_boundary:
      definition: Boundary where use cases/workflows orchestrate domain behavior and side effects without owning transport or persistence details.
      positive_signals:
      - coordinates multiple dependencies
      - executes one business action
      - handles workflow order
      - calls repositories/clients through abstractions
      negative_signals:
      - pure domain invariant without dependencies
      - transport-specific handler
      - raw database operation without use-case meaning
      risk_signals:
      - application service becomes god service
      - workflow mutates unrelated aggregates without policy
      - use case depends on controller
      examples:
      - create order use case
      - sync source orchestrator
      - assignment application service
    persistence_boundary:
      definition: Boundary between application/domain logic and durable storage, database entities, ORM/ODM models, migrations, or persistence projections.
      positive_signals:
      - database model/entity/schema is used
      - repository reads/writes durable state
      - migration/backfill/projection is involved
      - persistence-specific query is required
      negative_signals:
      - in-memory domain object without storage concern
      - transport-only DTO
      risk_signals:
      - Mongoose document used as domain type
      - repository called from controller
      - migration changes data semantics without compatibility review
      examples:
      - repository
      - Mongoose schema/model
      - SQL entity
      - migration
      - projection store
    external_system_boundary:
      definition: Boundary between the system and a third-party service, remote API, external database, external queue, storage service, or external runtime dependency.
      positive_signals:
      - HTTP/gRPC/SDK call to outside system
      - external credentials/configuration are required
      - remote failure/latency/retry behavior matters
      - external contract can change independently
      negative_signals:
      - internal module call
      - local pure function
      - in-process repository to owned database
      risk_signals:
      - no timeout/retry strategy
      - external response returned directly
      - credentials used outside integration layer
      examples:
      - payment API client
      - S3 adapter
      - third-party SDK client
      - webhook sender
    event_boundary:
      definition: Boundary crossed through published or consumed events, domain events, integration events, pub/sub messages, or event-driven workflow notifications.
      positive_signals:
      - payload is published/subscribed
      - event name/type has consumers
      - ordering/idempotency/retry can matter
      - event schema is a contract
      negative_signals:
      - simple synchronous method call
      - private in-memory callback with no external consumers
      risk_signals:
      - unknown event consumers
      - event schema change
      - non-idempotent consumer with retrying broker
      examples:
      - domain event
      - integration event
      - pub/sub message
      - webhook event payload
    message_queue_boundary:
      definition: Boundary crossed through queues, jobs, task messages, command messages, or delayed/asynchronous processing infrastructure.
      positive_signals:
      - queue producer/consumer is present
      - message acknowledgment/retry/dead-letter behavior matters
      - payload must survive serialization
      - processing is asynchronous
      negative_signals:
      - synchronous in-process method call
      - event without queue semantics
      risk_signals:
      - no dead-letter handling
      - consumer has side effects without idempotency
      - message contract changed without migration
      examples:
      - RabbitMQ consumer
      - job queue worker
      - command message producer
    realtime_boundary:
      definition: Boundary used for persistent or bidirectional communication such as WebSockets, sockets, streaming channels, subscriptions, or live gateway events.
      positive_signals:
      - connection/session state exists
      - messages are bidirectional or streaming
      - client presence/subscription matters
      - backpressure or lifecycle events matter
      negative_signals:
      - single request/response call
      - pure event publication without live connection
      risk_signals:
      - connection state mixed with domain aggregate
      - unvalidated inbound messages
      - unbounded broadcast payloads
      examples:
      - WebSocket gateway
      - socket stream handler
      - subscription server
    file_storage_boundary:
      definition: Boundary between system logic and file/blob/object storage, mounted volumes, presigned URLs, binary streams, or media storage.
      positive_signals:
      - binary/blob/file path/presigned URL is handled
      - storage provider API is used
      - streaming upload/download lifecycle matters
      - metadata points to external object
      negative_signals:
      - plain in-memory data object
      - database row without binary/file semantics
      risk_signals:
      - temporary URL persisted as canonical source
      - file path trusted from user input
      - storage errors not translated
      examples:
      - S3 adapter
      - mounted file reader
      - presigned URL downloader
      - blob metadata repository
    configuration_boundary:
      definition: Boundary between runtime configuration/secrets/environment values and application behavior.
      positive_signals:
      - environment variables/secrets/config files are read
      - feature flag or runtime setting changes behavior
      - configuration is injected into providers/clients
      negative_signals:
      - constant business enum
      - compile-time type only
      risk_signals:
      - secret appears in report/log
      - runtime behavior depends on unvalidated string
      - config read in multiple unrelated files
      examples:
      - config service
      - environment schema
      - feature flag provider
    security_boundary:
      definition: Boundary where authentication, authorization, identity, secrets, permissions, tenant isolation, or trust transitions are enforced.
      positive_signals:
      - user/system identity changes trust level
      - authorization decision is made
      - secret/token/credential is handled
      - tenant/project/resource access is checked
      negative_signals:
      - pure data transformation without trust decision
      - internal helper with no sensitive input
      risk_signals:
      - missing authorization before data access
      - tenant id accepted from user without verification
      - token stored in plain report
      examples:
      - auth guard
      - authorization policy
      - tenant boundary
      - secret manager client
    transaction_boundary:
      definition: Boundary around a unit of work requiring atomicity, consistency, rollback, compensation, or coordinated durable state change.
      positive_signals:
      - multiple writes must commit or rollback together
      - compensation may be required
      - transaction/session object is used
      - consistency boundary is explicit
      negative_signals:
      - single idempotent read
      - pure calculation
      - eventual consistency accepted without transaction need
      risk_signals:
      - multiple repositories mutate without unit of work
      - remote side effect inside DB transaction
      - transaction boundary unclear
      examples:
      - database transaction
      - unit of work
      - outbox write
      - distributed saga step
    process_boundary:
      definition: Boundary between processes, services, workers, containers, threads, or independently deployed runtime units.
      positive_signals:
      - another process/service is called
      - worker consumes work independently
      - deployment/runtime ownership differs
      - failure/retry/lifecycle differs from caller
      negative_signals:
      - in-process synchronous function
      - same runtime object call
      risk_signals:
      - worker and API share hidden mutable files
      - cross-process call has no timeout
      - message order assumed but not guaranteed
      examples:
      - microservice call
      - background worker
      - separate pod/container
      - child process
    test_boundary:
      definition: Boundary between production code and test-only artifacts, test doubles, fixtures, mocks, and test helpers.
      positive_signals:
      - test-only file/helper/mock is involved
      - dependency exists only for verification
      - fixture data simulates external behavior
      negative_signals:
      - production artifact imported by production code
      - domain code used normally in tests
      risk_signals:
      - src imports test helper
      - fixture used in production code
      - test exception applied to production dependency
      examples:
      - mock repository
      - fixture builder
      - test utility
      - e2e test module
  boundary_surface_definitions:
    inbound: A boundary surface where data/control enters the system or module from outside its owner.
    outbound: A boundary surface where data/control leaves the system or module toward another owner or external system.
    bidirectional: A boundary surface with both inbound and outbound interactions under one connection or contract.
    internal: A surface used inside the codebase but crossing module/layer ownership.
    public: A surface visible to external or unknown consumers.
    private: A surface intended to remain inside a single artifact/module owner.
  boundary_visibility_definitions:
    private: Visible only inside the owning artifact or module; consumers must not depend on it.
    module_public: Visible as the intentional public surface of one module/capability.
    workspace_public: Visible to multiple modules inside the repository/workspace.
    external_public: Visible to consumers outside the repository/runtime boundary.
    unknown: Consumer visibility cannot be established from available evidence and must be treated conservatively.
  boundary_ownership_definitions:
    single_artifact: Boundary owned and changed by one file/class/function.
    single_module: Boundary owned by one feature/module.
    shared_kernel: Boundary shared by multiple internal modules and requiring compatibility discipline.
    external_consumer: Boundary has external or unknown consumers.
    third_party: Boundary owned by a third-party dependency or service.
  boundary_relationship_schema:
    required_fields:
    - boundary_id
    - boundary_type
    - surface
    - visibility
    - owner
    - crossing_mechanism
    - source_artifact
    - target_artifact
    - evidence_refs
    optional_fields:
    - contract_ref
    - dependency_ref
    - risk_signals
    - validation_requirements
    - notes
  boundary_risk_signal_vocabulary:
    leakage: A lower-level or private representation crosses a boundary where it should be mapped or hidden.
    bypass: A consumer crosses around the intended boundary and depends on internal implementation details.
    unknown_consumer: The boundary may be used by consumers that are not enumerated in the current codebase.
    direction_violation: Dependency direction crosses from a higher layer to an implementation detail or creates a cycle.
    trust_violation: Untrusted input, credentials, or identity context crosses without validation/authorization.
    transaction_leak: Transaction/session/unit-of-work details escape their owner boundary.
    test_leak: Test-only artifacts become reachable from production code.
validation:
  required_checks:
  - id: BOUNDARY-TAXONOMY-CHECK-001
    check: every_boundary_type_has_definition_and_signals
    applies_when:
      boundary_taxonomy_loaded: true
  fail_conditions:
  - id: BOUNDARY-TAXONOMY-001
    condition: boundary_type_missing_definition
    message: Every boundary type must have an active definition.
    severity: error
  - id: BOUNDARY-TAXONOMY-002
    condition: unknown_boundary_type
    message: Boundary type must be defined in boundary_type_enum.
    severity: error
