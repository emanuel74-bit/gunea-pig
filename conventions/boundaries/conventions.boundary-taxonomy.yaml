    - transport
    - public_api
    - module
    - domain
    - application
    - infrastructure
    - persistence
    - external_system
    - integration_event
    - message_queue
    - webhook
    - security
    - tenant
    - runtime_wiring
  boundary_definitions:
    transport:
      definition: Boundary where external transport protocol/data enters or leaves the system, such as HTTP, GraphQL, WebSocket,
        CLI, or message handlers.
      owner: transport_owner
      crossing_signals:
      - transport
      allowed_crossing_direction:
      - explicit_allowed_direction_required
      forbidden_crossing:
      - forbidden_crossing_without_validation
      translation_required: conditional
      contract_required: conditional
      default_risk_concerns:
      - behavior
      required_checks:
      - id: BOUNDARIES-CONVENTIONS-BOUNDARY-TAXONOMY-YAML-RC-001
        check: boundary_validation
      detection_signals:
      - transport_entry_or_exit_point
      - ownership_or_trust_changes
      must_define:
      - owner
      - allowed_crossing_direction
      - translation_required
      - contract_required
      must_not:
      - cross_without_validation
      - leak_internal_model_across_boundary
    public_api:
      definition: Boundary exposed to external or cross-module consumers with compatibility obligations.
      owner: public_api_owner
      crossing_signals:
      - public_api
      allowed_crossing_direction:
