version: '1.0'
file:
  name: conventions.boundary-taxonomy.yaml
  path: boundaries/conventions.boundary-taxonomy.yaml
  role: boundary_taxonomy_contract
  executability: vocabulary
purpose: Define boundary vocabulary, ownership, crossing, translation, and sensitivity defaults.
ownership:
  owns:
  - boundary_type_enum
  - boundary_definitions
  - boundary_ownership_rules
  - boundary_crossing_rules
  - boundary_translation_rules
  - boundary_risk_signals
  does_not_own:
  - dependency_import_rules
  - contract_compatibility_rules
  - risk_resolution_process
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - boundary_taxonomy_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  boundary_type_enum:
