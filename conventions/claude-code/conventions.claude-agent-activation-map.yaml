version: '1.0'
file:
  name: conventions.claude-agent-activation-map.yaml
  path: claude-code/conventions.claude-agent-activation-map.yaml
  role: claude_native_agent_activation_map
  executability: mapping
purpose: Map every Autonomous Agent Activator convention agent to a native Claude Code subagent file and declare direct activation
  rules.
ownership:
  owns:
  - claude_native_agent_activation_map
  does_not_own:
  - agent_taxonomy
  - agent_permissions
  - agent_phase_ownership
activation:
  mode: conditional
  activates_when:
  - native_agent_activation_required
  skips_when: []
inputs:
  required:
  - agent_taxonomy
  - phase_bundle
  optional: []
outputs:
  produces:
  - native_agent_activation_records
dependencies:
  required_files:
  - agents/conventions.agent-taxonomy.yaml
  - agents/conventions.agent-phase-ownership.yaml
  optional_files: []
sections:
  activation_algorithm:
  - read_owner_agent_from_validated_phase_bundle
  - resolve_owner_agent_to_claude_subagent
  - activate_matching_subagent
  - stop_if_no_matching_subagent
  native_agents:
    alpha_controller:
      claude_agent_file: .claude/agents/alpha-controller.md
      claude_agent_name: alpha-controller
      owned_phases:
      - mission_profile_selection
      - mission_initialization
      - active_context_manifest
      - phase_accounting
      - trigger_review
      - report_artifact_validation
      integration_subsystems:
      - core
      - missions
      - phases
      - agents
      - gates
      - triggers
      - handoffs
      - revisions
      - reports
    behavior_agent:
      claude_agent_file: .claude/agents/behavior-agent.md
      claude_agent_name: behavior-agent
      owned_phases:
      - behavior_contract
      integration_subsystems:
      - planning
      - reports
      - risk
      - triggers
      - testing
    reconnaissance_agent:
      claude_agent_file: .claude/agents/reconnaissance-agent.md
      claude_agent_name: reconnaissance-agent
      owned_phases:
      - codebase_reconnaissance
      - local_alignment
      integration_subsystems:
      - planning
      - reports
      - dependencies
      - boundaries
      - risk
    classification_agent:
      claude_agent_file: .claude/agents/classification-agent.md
      claude_agent_name: classification-agent
      owned_phases:
      - risk_classification
      - boundary_contract_classification
      - dependency_classification
      integration_subsystems:
      - risk
      - boundaries
      - contracts
      - dependencies
      - triggers
      - reports
    architecture_agent:
      claude_agent_file: .claude/agents/architecture-agent.md
      claude_agent_name: architecture-agent
      owned_phases:
      - architecture_decomposition
      integration_subsystems:
      - architecture
      - planning
      - risk
      - boundaries
      - dependencies
      - reports
    role_agent:
      claude_agent_file: .claude/agents/role-agent.md
      claude_agent_name: role-agent
      owned_phases:
      - draft_role_pass
      - final_role_assignment
      integration_subsystems:
      - roles
      - architecture
      - actions
      - patterns
      - reports
    pattern_agent:
      claude_agent_file: .claude/agents/pattern-agent.md
      claude_agent_name: pattern-agent
      owned_phases:
      - pattern_pressure_detection
      - pattern_selection
      integration_subsystems:
      - patterns
      - roles
