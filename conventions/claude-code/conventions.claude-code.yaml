version: '1.0'
file:
  name: conventions.claude-code.yaml
  path: claude-code/conventions.claude-code.yaml
  role: claude_code_harness_entrypoint
  executability: advisory_entrypoint
purpose: Define the Claude Code execution harness entrypoint that adapts the Autonomous Agent Activator runtime to deterministic
  Claude Code mission execution.
ownership:
  owns:
  - claude_code_harness_metadata
  - claude_code_harness_file_index
  - claude_code_execution_model
  does_not_own:
  - executor_route_definitions
  - script_implementation_code
  - phase_contracts
  - mission_state_authority
  - gate_handoff_revision_decisions
activation:
  mode: conditional
  activates_when:
  - claude_code_execution_requested
  - mission_execution_requested_from_claude_code
  skips_when:
  - non_claude_runtime
inputs:
  required:
  - mission_request
  - executor_route_map
  - mission_bundle
  - phase_bundle
  optional:
  - runtime_topologies
  - prior_validation_results
outputs:
  produces:
  - claude_code_execution_harness_contract
  - claude_code_execution_plan_requirement
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - executors/conventions.executor-routes.yaml
  - executors/conventions.executor-lifecycle.yaml
  - multi-agent/conventions.alpha-controller.yaml
  - multi-agent/conventions.phase-bundle-policy.yaml
  - claude-code/conventions.claude-execution-harness.yaml
  - claude-code/conventions.claude-route-invocation.yaml
  - claude-code/conventions.claude-stop-conditions.yaml
  - claude-code/conventions.claude-native-integration.yaml
  - claude-code/conventions.claude-project-files.yaml
  - claude-code/conventions.claude-native-workflow-engine.yaml
  - claude-code/conventions.claude-agent-activation-map.yaml
  - claude-code/conventions.claude-subsystem-engagement.yaml
  optional_files: []
sections:
  claude_code_file_index:
    execution_harness: claude-code/conventions.claude-execution-harness.yaml
    route_invocation: claude-code/conventions.claude-route-invocation.yaml
    stop_conditions: claude-code/conventions.claude-stop-conditions.yaml
    native_workflow_engine: claude-code/conventions.claude-native-workflow-engine.yaml
    agent_activation_map: claude-code/conventions.claude-agent-activation-map.yaml
    subsystem_engagement_map: claude-code/conventions.claude-subsystem-engagement.yaml
  harness_model:
    primary_rule: Claude Code executes missions only from validated bundles and executor routes.
    script_selection_rule: Claude Code MUST NOT select scripts by memory or ad hoc path. It resolves route IDs through executors/conventions.executor-routes.yaml
      before script invocation.
    bundle_rule: Claude Code consumes mission and phase bundles as agent-facing context; full topologies remain script-facing
      compiled truth.
    transition_rule: Claude Code consumes script-produced gate, handoff, revision, validation, and report artifacts; it does
      not author transition decisions.
  required_executor_routes:
    before_mission_start:
    - initialize_mission
    - inspect_mission_state
    - generate_claude_execution_plan
    - validate_claude_execution_plan
    - generate_mission_bundle
  native_integration_summary:
    project_memory: CLAUDE.md
    project_settings: .claude/settings.json
    skills:
    - start-mission
    - run-alpha-cycle
    - activate-agent
    - run-phase
    - validate-phase
    - run-gate
    - prepare-handoff
    - transition-phase
    - revision-loop
    - generate-artifact
    - collect-report-evidence
    - complete-mission
    subagents:
    - alpha-controller
    - behavior-agent
    - reconnaissance-agent
    - classification-agent
    - architecture-agent
    - role-agent
    - pattern-agent
    - artifact-action-agent
    - refactor-strategy-agent
    - impact-agent
    - structure-agent
    - testing-agent
    - execution-planning-agent
    - pre-implementation-gate-agent
    - implementation-agent
    - validation-agent
    - failure-analysis-agent
    - repair-agent
    normal_route_command: npm --prefix conventions/scripts run invoke:route -- --route <route_id>
validation:
  required_checks:
  - mission_controller_initialized_before_mission_execution
  - claude_execution_plan_generated_before_mission_execution
  - claude_execution_plan_validated_before_phase_execution
  - claude_uses_executor_routes_not_direct_scripts
  fail_conditions:
  - claude_execution_without_validated_plan
  - claude_direct_script_invocation_detected
  - claude_continued_after_blocking_route_failure
