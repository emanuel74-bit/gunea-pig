      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - handoff_lifecycle_state decisions using blocked must include reason and evidence
    invalidated:
      definition: invalidated handoff_lifecycle_state vocabulary value.
      meaning: Represents the invalidated case within the handoff_lifecycle_state taxonomy.
      detection_signals:
      - invalidated signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches invalidated
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
