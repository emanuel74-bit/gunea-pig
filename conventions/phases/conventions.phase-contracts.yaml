version: '1.0'
file:
  name: conventions.phase-contracts.yaml
  path: phases/conventions.phase-contracts.yaml
  role: phase_contract_registry
  executability: contract_registry
purpose: Define strict per-phase input, output, owner, convention, gate reference, handoff, scope, and blocking contracts.
ownership:
  owns:
  - phase_contract_schema
  - phase_contract_registry
  - phase_contract_invariants
  - phase_contract_output_schema
  does_not_own:
  - phase_taxonomy_values
  - agent_contracts
  - gate_template_definitions
  - report_artifact_schemas
  - mission_profile_selection
activation:
  mode: conditional
  activates_when:
  - phase_contracts_loaded
  - phase_execution_requested
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - phase_contract_registry
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - phases/conventions.phase-taxonomy.yaml
  - phases/conventions.phase-lifecycle.yaml
  optional_files:
  - agents/conventions.agent-taxonomy.yaml
  - reports/conventions.report-artifacts.yaml
  - gates/conventions.gate-taxonomy.yaml
  - handoffs/conventions.handoff-schema.yaml
sections:
  phase_contract_schema:
    required_fields:
    - phase_id
    - category
    - owner_agent
    - purpose
    - required_inputs
    - required_outputs
    - allowed_conventions
    - must_do
    - must_not_do
    - entry_conditions
    - exit_conditions
    - gate_refs
    - handoff
    - allowed_write_scope
    - forbidden_write_scope
    - blocking_fail_conditions
    - integration_contract
    optional_fields:
    - optional_inputs
    - optional_outputs
    - phase_specific_triggers
    - repair_policy
    - approval_policy
  phase_contract_registry:
  - phase_id: mission_profile_selection
    category: mission_control
    owner_agent: alpha_controller
    purpose: Select the mission profile that governs required phases, strictness, edit scope, and reports.
    required_inputs:
    - mission_request
    optional_inputs: []
    required_outputs:
    - .ai/reports/00-mission-profile.yaml
    optional_outputs: []
    allowed_conventions:
      required_files:
      - core/conventions.file-contract.yaml
      - core/conventions.pipeline-contract.yaml
      - missions/conventions.mission-profiles.yaml
      optional_files:
      - core/conventions.index.yaml
      - reports/conventions.report-artifacts.yaml
    must_do:
    - execute_only_mission_profile_selection_scope
    - consume_declared_inputs_only
    - write_all_required_outputs_as_files
    - record_decisions_with_evidence_or_no_evidence_marker
    - emit_declared_triggers_when_conditions_match
    - request_revision_when_required_input_is_invalid_or_insufficient
    must_not_do:
    - perform_out_of_phase_work
    - bypass_or_mark_own_gate_passed
    - write_forbidden_files
    - modify_prior_phase_reports_unless_phase_contract_explicitly_allows_revision
    - invent_unknown_phase_or_agent
    - weaken_gate_or_handoff_requirements
    - edit_source_code
    entry_conditions:
    - phase appears in active_phase_plan
    - owner_agent contract/prompt/permissions exist
    - required inputs exist and are not invalidated
    - entry gate passes
    exit_conditions:
    - required outputs exist at declared paths
    - output gate passes
    - emitted triggers and revisions are registered
    - handoff gate passes before downstream consumption
    gate_refs:
      entry_gate: gate.mission_profile_selection.entry
      output_gate: gate.mission_profile_selection.output
      handoff_gate: gate.mission_profile_selection.handoff
    handoff:
      consumed_by_phases:
      - mission_initialization
      may_emit_triggers:
      - phase_revision_required
      - required_report_missing
      - report_schema_invalid
    allowed_write_scope:
    - .ai/reports/00-mission-profile.yaml
    - .ai/mission-state.yaml
    forbidden_write_scope:
    - src/**
    - test/**
    - package.json
    - tsconfig*.json
    blocking_fail_conditions:
    - missing_required_input
    - required_output_missing
    - output_schema_invalid
    - unauthorized_write
    - active_unresolved_trigger_blocks_next_phase
    - handoff_not_consumable
    integration_contract:
      consumes:
      - agent_contract
      - agent_permission_profile
      - report_registry
      - gate_template
      - handoff_policy
      produces:
      - phase_status_update
      - report_outputs
      - trigger_candidates
      - handoff_candidates
