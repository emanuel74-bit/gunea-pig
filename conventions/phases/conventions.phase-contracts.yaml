version: '1.0'
file:
  name: conventions.phase-contracts.yaml
  path: phases/conventions.phase-contracts.yaml
  role: phase_contract_definition_and_validation_contract
  executability: validator
purpose: Define strict contract records for every global phase.
ownership:
  owns:
  - phase_contract_schema
  - phase_contract_registry
  - phase_contract_validation
  does_not_own:
  - phase_vocabulary
  - agent_vocabulary
  - gate_logic
activation:
  mode: conditional
  activates_when:
  - phase_contracts_are_evaluated
  skips_when: []
inputs:
  required:
  - phase_taxonomy
  - agent_taxonomy
  optional: []
outputs:
  produces:
  - phase_contract_registry
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - phases/conventions.phase-taxonomy.yaml
  - agents/conventions.agent-taxonomy.yaml
  - gates/conventions.gate-taxonomy.yaml
  optional_files: []
