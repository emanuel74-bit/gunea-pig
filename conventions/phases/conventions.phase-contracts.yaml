  phase_contract_invariants:
    absolute_rules:
    - id: PHASE-CONTRACT-ABS-001
      rule: Every phase taxonomy value must have exactly one contract.
      fail_condition: phase_missing_or_duplicate_contract
    - id: PHASE-CONTRACT-ABS-002
      rule: Every contract owner_agent must exist in the agent taxonomy and match phase ownership mapping.
      fail_condition: phase_contract_unknown_or_mismatched_owner_agent
    - id: PHASE-CONTRACT-ABS-003
      rule: Every required output must be a durable file or explicit mission-state update declared in the report/state registry.
      fail_condition: phase_required_output_not_registered
    - id: PHASE-CONTRACT-ABS-004
      rule: A phase may not write outside allowed_write_scope or read outside declared input/permission scope.
      fail_condition: phase_scope_violation
    - id: PHASE-CONTRACT-ABS-005
      rule: Phase contracts must reference gate IDs but must not define gate checks or pass/fail logic.
      fail_condition: phase_contract_defined_gate_logic
  phase_contract_output_schema:
    required_fields:
    - phase_id
    - contract_status
    - owner_agent
    - required_inputs
    - required_outputs
    - gate_refs
    - blocking_fail_conditions
validation:
  required_checks:
  - id: PHASE-CONTRACT-CHECK-001
    check: one_contract_per_phase
    applies_when:
      phase_contract_registry_loaded: true
  - id: PHASE-CONTRACT-CHECK-002
    check: contract_io_scope_and_gate_refs_valid
    applies_when:
      phase_contract_registry_loaded: true
  fail_conditions:
  - id: PHASE-CONTRACT-001
    condition: phase_missing_or_duplicate_contract
    message: Every phase must have exactly one contract.
    severity: error
  - id: PHASE-CONTRACT-002
    condition: phase_contract_redefines_external_subsystem_authority
    message: Phase contracts may reference external subsystems but not redefine them.
    severity: error
