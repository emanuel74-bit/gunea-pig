    mission_profile_selection:
      definition: mission profile selection phase vocabulary value.
      meaning: Represents the mission profile selection case within the phase taxonomy.
      detection_signals:
      - mission profile selection signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches mission profile selection
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - phase decisions using mission_profile_selection must include reason and evidence
