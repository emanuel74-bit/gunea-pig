version: '1.0'
file:
  name: conventions.phase-taxonomy.yaml
  path: phases/conventions.phase-taxonomy.yaml
  role: phase_vocabulary_contract
  executability: vocabulary
purpose: Define the canonical phase catalog, phase categories, phase definitions, and strict phase addition policy.
ownership:
  owns:
  - phase_category_enum
  - phase_enum
  - phase_category_mapping
  - phase_definitions
  - phase_category_definitions
  - phase_taxonomy_schema
  - phase_addition_policy
  does_not_own:
  - phase_lifecycle_transitions
  - phase_contract_registry
  - mission_profile_phase_selection
  - runtime_phase_scheduling
activation:
  mode: conditional
  activates_when:
  - phase_values_are_referenced
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - phase_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
  phase_category_enum:
    allowed:
    - mission_control
    - understanding
    - classification
    - design
    - verification_planning
    - execution_planning
    - execution
    - repair
    - validation
    - reporting
  phase_enum:
    allowed:
    - mission_profile_selection
    - mission_initialization
    - active_context_manifest
    - phase_accounting
    - behavior_contract
    - codebase_reconnaissance
    - local_alignment
    - risk_classification
    - boundary_contract_classification
    - dependency_classification
    - architecture_decomposition
    - draft_role_pass
    - pattern_pressure_detection
    - artifact_reuse_analysis
    - artifact_action_resolution
    - refactor_strategy_selection
    - call_site_impact_analysis
    - change_impact_analysis
    - final_role_assignment
    - pattern_selection
    - structure_rendering
    - test_derivation
    - implementation_sequence
    - checkpoint_validation_plan
    - pre_implementation_gate
    - implementation
    - failure_classification
    - feedback_repair
    - post_implementation_validation
    - trigger_review
    - report_artifact_validation
    - final_validation
  phase_category_mapping:
    mission_profile_selection: mission_control
    mission_initialization: mission_control
    active_context_manifest: mission_control
    phase_accounting: mission_control
    behavior_contract: understanding
    codebase_reconnaissance: understanding
    local_alignment: understanding
    risk_classification: classification
    boundary_contract_classification: classification
    dependency_classification: classification
    architecture_decomposition: design
    draft_role_pass: design
    pattern_pressure_detection: design
    artifact_reuse_analysis: design
    artifact_action_resolution: design
    refactor_strategy_selection: design
    call_site_impact_analysis: design
    change_impact_analysis: design
    final_role_assignment: design
    pattern_selection: design
    structure_rendering: design
    test_derivation: verification_planning
    implementation_sequence: execution_planning
    checkpoint_validation_plan: execution_planning
    pre_implementation_gate: validation
    implementation: execution
    failure_classification: repair
    feedback_repair: repair
    post_implementation_validation: validation
    trigger_review: validation
    report_artifact_validation: reporting
    final_validation: validation
  phase_definitions:
    mission_profile_selection:
      definition: Select the mission profile that governs required phases, strictness, edit scope, and reports.
      category: mission_control
      owner_agent: alpha_controller
      primary_output_contract: .ai/reports/00-mission-profile.yaml
      positive_signals:
      - mission_profile_selection is required by the selected mission profile
      - a trigger or dependency requires mission_profile_selection
      - downstream phases require outputs produced by mission_profile_selection
      negative_signals:
      - mission_profile_selection is forbidden by the selected mission profile
      - mission_profile_selection has no required inputs available and no valid external source
      - mission_profile_selection would duplicate authority owned by another subsystem
      entry_requirement:
      - entry gate must pass
      - owner agent must exist
      - phase contract must exist
      - required inputs must exist unless declared external
      exit_requirement:
      - required outputs must be written to declared files
      - output gate must pass
      - triggers and revision requests must be registered
      - handoff records must be valid before downstream consumption
      bounded_authority:
      - owned by alpha_controller
      - may perform only work declared by its phase contract
      - must not redefine agents, gates, reports, mission profiles, or runtime vocabulary
      integration_points:
      - agent contract
      - report artifact registry
      - gate refs
      - handoff policy
      - trigger resolution
      - mission state accounting
