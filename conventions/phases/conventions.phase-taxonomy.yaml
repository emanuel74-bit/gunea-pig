  phase_category_definitions:
    mission_control:
      definition: Phases that initialize, schedule, account for, or finalize the mission runtime rather than produce domain
        design work.
      positive_signals:
      - phase updates mission state, active plan, report registry, trigger review, or accounting
      negative_signals:
      - phase primarily classifies code, renders design, edits source, or validates implementation
      authority: Owned by Alpha except final validation-specific checks owned by validation_agent when assigned.
    understanding:
      definition: Phases that convert the request and existing workspace evidence into explicit facts before design decisions.
      positive_signals:
      - behavior needs clarification
      - codebase/local convention evidence must be gathered
      negative_signals:
      - phase makes final action, pattern, role, or implementation decisions
      authority: May record evidence and assumptions but must not select implementation actions.
    classification:
      definition: Phases that classify risk, boundaries, contracts, dependencies, or compatibility needs using global vocabularies.
      positive_signals:
      - evidence must be mapped into risk, boundary, contract, or dependency categories
      negative_signals:
      - phase renders architecture or edits code
      authority: May emit followup triggers but must not change structure or implementation.
    design:
      definition: Phases that transform behavior and evidence into architecture, roles, actions, impacts, patterns, and structure.
      positive_signals:
      - artifact candidates, roles, actions, patterns, impacts, or file tree decisions are required
      negative_signals:
      - phase directly edits source or validates runtime reports
      authority: May decide design outputs but must not bypass gates or implementation approval.
    verification_planning:
      definition: Phases that derive validation obligations before implementation.
      positive_signals:
      - acceptance criteria or behavior preservation must map to tests
      negative_signals:
      - phase executes tests or marks final validation passed
      authority: Defines expected validation; does not validate results.
    execution_planning:
      definition: Phases that convert approved design into deterministic implementation order and checkpoints.
      positive_signals:
      - ordered implementation steps or checkpoints are needed
      negative_signals:
      - phase edits code or approves implementation itself
      authority: Plans execution; pre_implementation_gate approves it.
    execution:
      definition: The phase that applies approved source/test/config changes.
      positive_signals:
      - pre-implementation gate passed and implementation sequence exists
      negative_signals:
      - planning, classification, or validation-only work
      authority: Only implementation_agent may edit source by default.
    repair:
      definition: Phases that classify failures and apply bounded repair after validation or implementation failure.
      positive_signals:
      - validation failure, test failure, or implementation deviation exists
      negative_signals:
      - normal implementation with no classified failure
      authority: Repair must be authorized by failure classification and permissions.
    validation:
      definition: Phases that decide whether runtime transitions or implementation results may pass.
      positive_signals:
      - gate, trigger, implementation, or final status must be checked
      negative_signals:
      - phase is producing design content or editing unapproved code
      authority: May block progress; cannot rewrite prior reports to force pass.
    reporting:
      definition: Phases that validate durable report artifacts and report lifecycle state.
      positive_signals:
      - required report existence, schema, lifecycle, or console-only failures must be checked
      negative_signals:
      - phase performs design or implementation work
      authority: May block final validation when reports are missing or invalid.
  phase_taxonomy_schema:
    required_fields:
    - definition
    - category
    - owner_agent
    - primary_output_contract
    - positive_signals
    - negative_signals
    - entry_requirement
    - exit_requirement
    - bounded_authority
    - integration_points
  phase_addition_policy:
    absolute_rules:
    - id: PHASE-TAXONOMY-ABS-001
      rule: Mission profiles, agents, adapters, and local project rules must not define new phases.
      fail_condition: unknown_phase_declared_outside_phase_taxonomy
    - id: PHASE-TAXONOMY-ABS-002
      rule: New phases require updating taxonomy, lifecycle, contract, dependency, validation, agent ownership, report registry,
        and mission profile references together.
      fail_condition: phase_added_without_complete_subsystem_update
validation:
  required_checks:
  - id: PHASE-TAXONOMY-CHECK-001
    check: every_phase_has_definition_category_owner_and_output_contract
    applies_when:
      phase_taxonomy_loaded: true
  fail_conditions:
  - id: PHASE-TAXONOMY-001
    condition: unknown_phase_id
    message: Phase ID must be defined in phase taxonomy.
    severity: error
  - id: PHASE-TAXONOMY-002
    condition: phase_definition_missing_required_semantics
    message: Phase definitions must contain meaning, authority, inputs/outputs, and integration points.
    severity: error
