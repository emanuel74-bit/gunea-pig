version: '1.0'
file:
  name: conventions.agent-contracts.yaml
  path: agents/conventions.agent-contracts.yaml
  role: agent_responsibility_contract
  executability: validator
purpose: Define responsibility boundaries and phase ownership for every fixed agent.
ownership:
  owns:
  - agent_contract_schema
  - agent_contract_registry
  - phase_ownership_mapping
  does_not_own:
  - agent_vocabulary
  - permission_profiles
activation:
  mode: conditional
  activates_when:
  - agent_contract_validation_required
  skips_when: []
inputs:
  required:
  - agent_taxonomy
  - phase_catalog
  optional: []
outputs:
  produces:
  - agent_contract_registry
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - agents/conventions.agent-taxonomy.yaml
  - phases/conventions.phase-taxonomy.yaml
  optional_files: []
sections:
  agent_contract_schema:
    required_fields:
    - agent_id
    - category
    - responsibility
    - owned_phases
    - allowed_decisions
    - forbidden_decisions
    - must_do
    - must_not_do
    - escalation_rules
  agent_contract_registry:
  - agent_id: alpha_controller
    category: controller
    responsibility: 'Own and execute phases: mission_profile_selection, mission_initialization, active_context_manifest, phase_accounting,
      trigger_review, report_artifact_validation.'
    owned_phases: &id001
    - mission_profile_selection
    - mission_initialization
    - active_context_manifest
    - phase_accounting
    - trigger_review
    - report_artifact_validation
    allowed_decisions:
    - produce_outputs_for_mission_profile_selection
    - produce_outputs_for_mission_initialization
    - produce_outputs_for_active_context_manifest
    - produce_outputs_for_phase_accounting
    - produce_outputs_for_trigger_review
    - produce_outputs_for_report_artifact_validation
    forbidden_decisions:
    - perform_unowned_phase_work
    - bypass_gates
    - weaken_contracts
    must_do:
    - follow_phase_contract
    - write_required_reports
    - record_evidence
    must_not_do:
    - silently_skip_required_work
    - write_unallowed_files
    escalation_rules:
      escalate_when:
      - required_input_missing
      - output_gate_failed
      - permission_violation_detected
      escalation_target: alpha_controller
  - agent_id: behavior_agent
    category: understanding
    responsibility: 'Own and execute phases: behavior_contract.'
