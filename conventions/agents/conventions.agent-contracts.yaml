    - bypass_gates
    - weaken_contracts
    - mark_unvalidated_output_valid
    - consume_invalidated_input
    - update_mission_state
    - schedule_phase_directly
    - resolve_trigger_directly
    - approve_revision_directly
    must_do:
    - classify request intent
    - extract behavior and non-goals
    - define acceptance criteria
    - record blocking ambiguities
    - emit behavior/scope triggers
    - read generated phase bundle
    - write required reports
    - record evidence refs
    - respect allowed write scope
    - emit blockers instead of guessing
    must_not_do:
    - design structure
    - select roles/patterns/actions
    - inspect broad codebase without phase bundle
    - edit code
    - ignore missing required inputs
    - satisfy required outputs in chat only
    - invent unknown enum values
    - override script/validator/gate results
