version: '1.0'
file:
  name: conventions.agent-contracts.yaml
  path: agents/conventions.agent-contracts.yaml
  role: agent_responsibility_contract
  executability: contract_registry
purpose: Define strict responsibility boundaries, allowed decisions, forbidden decisions, must-do/must-not-do rules, and subsystem usage for every
  fixed agent.
ownership:
  owns:
  - agent_contract_schema
  - agent_contract_registry
  - agent_responsibility_invariants
  does_not_own:
  - agent_vocabulary
  - permission_profiles
  - prompt_text
  - phase_contract_definitions
activation:
  mode: conditional
  activates_when:
  - agent_contract_validation_required
  skips_when: []
inputs:
  required:
  - agent_taxonomy
  - phase_catalog
  optional: []
outputs:
  produces:
  - agent_contract_registry
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - agents/conventions.agent-taxonomy.yaml
  - agents/conventions.agent-capabilities.yaml
  - phases/conventions.phase-taxonomy.yaml
  optional_files: []
sections:
  agent_contract_schema:
    required_fields:
    - agent_id
    - category
    - responsibility
    - owned_phases
    - allowed_decisions
    - forbidden_decisions
    - must_do
    - must_not_do
    - escalation_rules
    - subsystems_may_consume
    - report_outputs
  agent_responsibility_invariants:
    absolute_rules:
    - id: AGENT-CONTRACT-ABS-001
      rule: Agent may not perform unowned phase work even if it detects the work is needed.
      fail_condition: agent_performed_unowned_phase_work
    - id: AGENT-CONTRACT-ABS-002
      rule: Agent must emit trigger, blocker, or revision request for work outside its authority.
      fail_condition: agent_silently_absorbed_external_work
  agent_contract_registry:
  - agent_id: alpha_controller
    category: runtime_controller
    responsibility: Runtime controller that drives the mission through validated phase execution without performing phase-agent work itself.
    owned_phases:
    - mission_profile_selection
    - mission_initialization
    - active_context_manifest
    - phase_accounting
    - trigger_review
    - report_artifact_validation
    allowed_decisions:
    - produce_phase_outputs_for_mission_profile_selection
    - produce_phase_outputs_for_mission_initialization
    - produce_phase_outputs_for_active_context_manifest
    - produce_phase_outputs_for_phase_accounting
    - produce_phase_outputs_for_trigger_review
    - produce_phase_outputs_for_report_artifact_validation
    - update_mission_state
    - invoke_phase_agents
    - run_gates_through_gate_subsystem
    - register_triggers
    - process_revision_requests
    forbidden_decisions:
    - perform_unowned_phase_work
    - bypass_gates
    - weaken_contracts
    - mark_unvalidated_output_valid
    - consume_invalidated_input
    must_do:
    - select next phase from active plan
    - build phase execution bundle
    - invoke the owning phase agent
    - run/record gates through gate subsystem
    - register triggers and revision requests
    - update mission state
    - read generated phase bundle
    - write required reports
    - record evidence refs
    - respect allowed write scope
    - emit blockers instead of guessing
    must_not_do:
    - produce design/code work for phase agents
    - bypass gates
    - weaken phase contracts
    - edit source code
    - ignore missing required inputs
    - satisfy required outputs in chat only
    - invent unknown enum values
    - override script/validator/gate results
    escalation_rules:
    - condition: required_input_missing_or_invalid
      action: request_revision_or_block_phase
      emit_trigger: phase_revision_required
    - condition: detected_unowned_work_needed
      action: emit_trigger_or_revision_request
      must_not: perform_work_directly
    - condition: mechanical_validation_failure
      action: defer_to_validator_result
      must_not: override_pass_fail_in_chat
    subsystems_may_consume:
    - core
    - missions
    - phases
    - agents
    - gates
    - triggers
    - handoffs
    - revisions
    - reports
    report_outputs:
    - .ai/reports/00-mission-profile.yaml
    - .ai/reports/report-registry.yaml
    - .ai/reports/01-active-context-manifest.yaml
    - .ai/reports/phase-accounting.yaml
    - .ai/reports/trigger-review.yaml
    - .ai/reports/report-artifact-validation.yaml
