version: '1.0'
file:
  name: conventions.agent-phase-ownership.yaml
  path: agents/conventions.agent-phase-ownership.yaml
  role: agent_phase_ownership_contract
  executability: mapping
purpose: Map each canonical phase to exactly one owner agent and declare runtime authority boundaries for phase execution.
ownership:
  owns:
  - phase_ownership_schema
  - phase_ownership_records
  - ownership_consistency_rules
  does_not_own:
  - phase_taxonomy
  - phase_contracts
  - mission_profiles
  - runtime_scheduling
activation:
  mode: conditional
  activates_when:
  - phase_owner_resolution_required
  skips_when: []
inputs:
  required:
  - phase_taxonomy
  - agent_taxonomy
  optional: []
outputs:
  produces:
  - phase_ownership_map
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - agents/conventions.agent-taxonomy.yaml
  - phases/conventions.phase-taxonomy.yaml
  - phases/conventions.phase-contracts.yaml
  optional_files: []
sections:
  phase_ownership_schema:
    required_fields:
    - phase_id
    - owner_agent
    - ownership_type
    - required_outputs
    - handoff_authority
    - gate_authority
    - runtime_authority
    - agent_may_schedule_followup_phases
    - agent_may_emit_triggers
  ownership_consistency_rules:
    absolute_rules:
    - id: AGENT-PHASE-OWNERSHIP-ABS-001
      rule: Every phase must have exactly one exclusive owner agent.
      fail_condition: phase_owner_count_not_one
    - id: AGENT-PHASE-OWNERSHIP-ABS-002
      rule: Owner agent may produce phase reports but may not update mission state.
      fail_condition: phase_agent_updated_mission_state
