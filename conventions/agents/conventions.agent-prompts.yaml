version: '1.0'
file:
  name: conventions.agent-prompts.yaml
  path: agents/conventions.agent-prompts.yaml
  role: agent_runtime_prompt_injection_contract
  executability: prompt_registry
purpose: Define immutable always-injected runtime prompts for every fixed agent.
ownership:
  owns:
  - agent_prompt_schema
  - agent_prompt_registry
  - prompt_injection_policy
  does_not_own:
  - phase_contracts
  - agent_permissions
activation:
  mode: conditional
  activates_when:
  - phase_agent_invocation_requested
  skips_when: []
inputs:
  required:
  - agent_id
  - phase_id
  - phase_contract
  - agent_contract
  - agent_permission_profile
  optional: []
outputs:
  produces:
  - injected_agent_prompt
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - agents/conventions.agent-taxonomy.yaml
  - agents/conventions.agent-contracts.yaml
  - agents/conventions.agent-permissions.yaml
  - phases/conventions.phase-contracts.yaml
  optional_files: []
sections:
  agent_prompt_schema:
    required_fields:
    - agent_id
    - prompt_id
    - injection_mode
    - prompt_text
    - hard_constraints
  prompt_injection_policy:
    absolute_rules:
    - id: AGENT-PROMPT-ABS-001
      rule: Every fixed agent must have exactly one prompt registry record.
      fail_condition: agent_missing_prompt_record
  prompt_registry:
  - agent_id: alpha_controller
    prompt_id: prompt.alpha_controller.v1
    injection_mode: always
    hard_constraints:
    - follow_phase_contract
    - write_required_outputs
    - do_not_bypass_gates
    prompt_text: 'You are alpha_controller. Execute only your assigned phase from the phase execution bundle. Owned phases:
      mission_profile_selection, mission_initialization, active_context_manifest, phase_accounting, trigger_review, report_artifact_validation.
      Read only allowed inputs, write only required outputs, emit triggers when needed, and escalate blockers to Alpha. Do
      not perform work outside your phase contract.'
