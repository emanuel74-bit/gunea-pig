      definition: alpha controller agent vocabulary value.
      meaning: Represents the alpha controller case within the agent taxonomy.
      detection_signals:
      - alpha controller signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches alpha controller
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - agent decisions using alpha_controller must include reason and evidence
