version: '1.0'
file:
  name: conventions.agent-taxonomy.yaml
  path: agents/conventions.agent-taxonomy.yaml
  role: fixed_agent_vocabulary_contract
  executability: vocabulary
purpose: Define the fixed 18-agent roster, categories, authority levels, and full agent definitions used by every phase execution.
ownership:
  owns:
  - agent_enum
  - agent_category_enum
  - agent_category_definitions
  - agent_authority_level_enum
  - agent_definitions
  does_not_own:
  - agent_permissions
  - agent_prompts
  - phase_contracts
  - runtime_activation
activation:
  mode: reference_only
  activates_when:
  - agent_values_are_referenced
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - agent_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
  agent_category_enum:
    allowed:
    - classification
    - design
    - execution_planning
    - failure_analysis
    - gatekeeper
    - impact_analysis
    - implementation
    - planning_evidence
    - planning_understanding
    - refactoring
    - repair
    - runtime_controller
    - structure_design
    - validation
    - verification_planning
  agent_category_definitions:
    runtime_controller:
      definition: Owns mission runtime control and phase-agent invocation without performing phase-agent work.
    planning_understanding:
      definition: Turns user request and local evidence into behavior/scope planning outputs.
    planning_evidence:
      definition: Finds and records evidence from the codebase and local conventions.
    classification:
      definition: Classifies risk, boundary, contract, dependency, and related concerns using global vocabularies.
    design:
      definition: Produces design decisions before implementation without editing code.
    refactoring:
      definition: Controls behavior-preserving refactor strategy and safety constraints.
    impact_analysis:
      definition: Determines call-site, consumer, and change impacts.
    structure_design:
      definition: Renders final structure and placement decisions.
    verification_planning:
      definition: Derives test obligations and validation plans before implementation.
    execution_planning:
      definition: Creates implementation sequence and gate readiness without editing code.
    gatekeeper:
      definition: Evaluates whether implementation may begin.
    implementation:
      definition: Applies approved code changes within strict scope.
    validation:
      definition: Validates outputs and final state without repair.
    failure_analysis:
      definition: Classifies failures and selects repair/rerun/revision/block path.
    repair:
      definition: Applies bounded repairs only when authorized.
  agent_authority_level_enum:
    allowed:
    - runtime_authority
    - phase_output_authority
    - source_edit_authority
    - conditional_repair_authority
  agent_enum:
    allowed:
    - alpha_controller
    - behavior_agent
    - reconnaissance_agent
    - classification_agent
    - architecture_agent
    - role_agent
    - pattern_agent
    - artifact_action_agent
    - refactor_strategy_agent
    - impact_agent
    - structure_agent
    - testing_agent
    - execution_planning_agent
    - pre_implementation_gate_agent
    - implementation_agent
    - validation_agent
    - failure_analysis_agent
    - repair_agent
  agent_category_mapping:
    alpha_controller: runtime_controller
    behavior_agent: planning_understanding
    reconnaissance_agent: planning_evidence
    classification_agent: classification
    architecture_agent: design
    role_agent: design
    pattern_agent: design
    artifact_action_agent: design
    refactor_strategy_agent: refactoring
    impact_agent: impact_analysis
    structure_agent: structure_design
    testing_agent: verification_planning
    execution_planning_agent: execution_planning
    pre_implementation_gate_agent: gatekeeper
    implementation_agent: implementation
    validation_agent: validation
    failure_analysis_agent: failure_analysis
    repair_agent: repair
  agent_definition_schema:
    required_fields:
    - definition
    - category
    - owned_phases
    - positive_signals
    - negative_signals
    - must
    - must_not
    - authority_level
    - required_runtime_inputs
    - required_runtime_outputs
    - integration_subsystems
  agent_definitions:
    alpha_controller:
      definition: Runtime controller that drives the mission through validated phase execution without performing phase-agent work itself.
      category: runtime_controller
      owned_phases:
      - mission_profile_selection
      - mission_initialization
      - active_context_manifest
      - phase_accounting
      - trigger_review
      - report_artifact_validation
      positive_signals:
      - active phase owner is alpha_controller
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - select next phase from active plan
      - build phase execution bundle
      - invoke the owning phase agent
      - run/record gates through gate subsystem
      - register triggers and revision requests
      - update mission state
      must_not:
      - produce design/code work for phase agents
      - bypass gates
      - weaken phase contracts
      - edit source code
      authority_level: runtime_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - mission_state_updates
      - alpha_owned_reports
      integration_subsystems:
      - core
      - missions
      - phases
      - agents
      - gates
      - triggers
      - handoffs
      - revisions
      - reports
    behavior_agent:
      definition: Planning agent that turns the user request into a strict behavior contract, scope basis, acceptance criteria, ambiguities, and
        preservation expectations.
      category: planning_understanding
      owned_phases:
      - behavior_contract
      positive_signals:
      - active phase owner is behavior_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - classify request intent
      - extract behavior and non-goals
      - define acceptance criteria
      - record blocking ambiguities
      - emit behavior/scope triggers
      must_not:
      - design structure
      - select roles/patterns/actions
      - inspect broad codebase without phase bundle
      - edit code
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - planning
      - reports
      - risk
      - triggers
      - testing
    reconnaissance_agent:
      definition: Evidence agent that discovers relevant existing code, local conventions, call sites, unknowns, and alignment constraints.
      category: planning_evidence
      owned_phases:
      - codebase_reconnaissance
      - local_alignment
      positive_signals:
      - active phase owner is reconnaissance_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - inspect allowed source scope
      - record found/not_found/unknown evidence
      - identify local convention candidates
      - classify global/local alignment
      must_not:
      - make architecture decisions
      - select artifact actions
      - edit code
      - mark validation passed
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - planning
      - reports
      - dependencies
      - boundaries
      - risk
    classification_agent:
      definition: Classification agent that assigns risk, boundary, contract, and dependency classifications using global vocabularies.
      category: classification
      owned_phases:
      - risk_classification
      - boundary_contract_classification
      - dependency_classification
      positive_signals:
      - active phase owner is classification_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - classify risk using risk subsystem
      - classify boundaries/contracts/dependencies
      - emit required followup triggers
      - record uncertainty fail-closed
      must_not:
      - invent local vocabulary
      - select design structure
      - implement code
      - weaken classification because of convenience
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - risk
      - boundaries
      - contracts
      - dependencies
      - triggers
      - reports
    architecture_agent:
      definition: Design agent that decomposes behavior into capabilities, intents, layers, atomic units, and artifact candidates.
      category: design
      owned_phases:
      - architecture_decomposition
      positive_signals:
      - active phase owner is architecture_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - decompose before structure
      - produce architecture blueprint
      - generate artifact candidates
      - enforce dependency/boundary intent
      must_not:
      - render final file tree
      - assign final roles
      - select final patterns
      - edit code
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - architecture
      - planning
      - risk
      - boundaries
      - dependencies
      - reports
    role_agent:
      definition: Role agent that assigns draft and final artifact responsibilities using the role taxonomy and collision rules.
      category: design
      owned_phases:
      - draft_role_pass
      - final_role_assignment
      positive_signals:
      - active phase owner is role_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - classify artifact roles
      - detect mixed responsibilities
      - resolve role collisions
      - produce final role assignment
      must_not:
      - select artifact actions
      - select patterns
      - render final structure
      - edit code
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - roles
      - architecture
      - actions
      - patterns
      - reports
    pattern_agent:
      definition: Pattern agent that detects pattern pressure and chooses or rejects patterns with evidence, defaulting to no_pattern.
      category: design
      owned_phases:
      - pattern_pressure_detection
      - pattern_selection
      positive_signals:
      - active phase owner is pattern_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - detect pattern pressure
      - evaluate NoPattern first
      - select/reject patterns through restrictions and compatibility
      - write pattern decision log
      must_not:
      - force patterns from preference
      - define role taxonomy
      - render structure
      - edit code
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - patterns
      - roles
      - architecture
      - actions
      - reports
    artifact_action_agent:
      definition: Action agent that determines whether artifacts should be reused, modified, split, extracted, moved, renamed, deprecated, deleted,
        or created.
      category: design
      owned_phases:
      - artifact_reuse_analysis
      - artifact_action_resolution
      positive_signals:
      - active phase owner is artifact_action_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - analyze reuse before create_new
      - select artifact actions
      - resolve action collisions
      - emit action followups
      must_not:
      - assign final roles
      - select final patterns
      - implement changes
      - ignore existing artifacts
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - actions
      - roles
      - patterns
      - architecture
      - risk
      - triggers
      - reports
    refactor_strategy_agent:
      definition: Refactoring agent that selects behavior-preserving refactor strategy and locks required behavior before implementation.
      category: refactoring
      owned_phases:
      - refactor_strategy_selection
      positive_signals:
      - active phase owner is refactor_strategy_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - classify refactor need
      - select strategy
      - define preservation locks
      - block unsafe refactors
      must_not:
      - change requested behavior
      - implement refactor
      - approve unsafe strategy
      - skip characterization needs
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - refactoring
      - actions
      - planning
      - testing
      - risk
      - triggers
      - reports
    impact_agent:
      definition: Impact agent that finds call-site, consumer, contract, dependency, test, and change impacts before sequencing.
      category: impact_analysis
      owned_phases:
      - call_site_impact_analysis
      - change_impact_analysis
      positive_signals:
      - active phase owner is impact_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - identify call sites
      - classify direct/indirect impact
      - map consumers and tests
      - emit impact followups
      must_not:
      - edit code
      - change selected actions
      - approve implementation
      - ignore unknown dynamic references
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - planning
      - contracts
      - dependencies
      - boundaries
      - risk
      - testing
      - reports
    structure_agent:
      definition: Structure agent that renders final folder/file structure from architecture, roles, actions, patterns, boundaries, and local
        alignment.
      category: structure_design
      owned_phases:
      - structure_rendering
      positive_signals:
      - active phase owner is structure_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - select structure density
      - place files with evidence
      - avoid bloat
      - produce final file tree
      must_not:
      - decompose behavior anew
      - change actions/roles/patterns
      - implement files
      - create speculative shared code
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - architecture
      - roles
      - patterns
      - actions
      - boundaries
      - dependencies
      - reports
    testing_agent:
      definition: Verification planning agent that derives test obligations, gaps, regression, and characterization needs.
      category: verification_planning
      owned_phases:
      - test_derivation
      positive_signals:
      - active phase owner is testing_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - map acceptance criteria to tests
      - derive obligations from risk/contracts/boundaries/dependencies/actions
      - record blocking gaps
      - write test plans
      must_not:
      - pretend tests passed
      - edit production code
      - weaken high-risk test obligations
      - skip preservation tests
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - testing
      - planning
      - risk
      - contracts
      - boundaries
      - dependencies
      - actions
      - refactoring
      - reports
    execution_planning_agent:
      definition: Execution planning agent that creates implementation sequence and checkpoint validation plan without editing code.
      category: execution_planning
      owned_phases:
      - implementation_sequence
      - checkpoint_validation_plan
      positive_signals:
      - active phase owner is execution_planning_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - order implementation steps
      - group checkpoints
      - declare temporary failures
      - define validation cadence
      must_not:
      - edit code
      - approve implementation
      - ignore blockers
      - change upstream decisions
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - execution
      - testing
      - risk
      - reports
      - gates
    pre_implementation_gate_agent:
      definition: Gatekeeper agent that decides whether implementation may begin based on required reports, triggers, blockers, sequence, and
        scope.
      category: gatekeeper
      owned_phases:
      - pre_implementation_gate
      positive_signals:
      - active phase owner is pre_implementation_gate_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - validate preconditions
      - block missing/invalid prerequisites
      - write pre-implementation gate result
      - require unresolved trigger resolution
      must_not:
      - create sequence
      - edit code
      - override validators
      - approve with active blockers
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - gates
      - missions
      - reports
      - triggers
      - handoffs
      - revisions
      - execution
    implementation_agent:
      definition: Implementation agent that performs only approved code changes within allowed scope after pre-implementation gate passes.
      category: implementation
      owned_phases:
      - implementation
      positive_signals:
      - active phase owner is implementation_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - follow sequence
      - edit allowed files only
      - record changed-file manifest
      - record validation commands run
      must_not:
      - change scope
      - rewrite prior reports
      - edit forbidden files
      - mark final validation passed
      authority_level: source_edit_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - execution
      - reports
      - testing
    validation_agent:
      definition: Validation agent that verifies implementation, reports, gates, state, triggers, and final mission completion without repairing.
      category: validation
      owned_phases:
      - post_implementation_validation
      - final_validation
      positive_signals:
      - active phase owner is validation_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - validate changed scope
      - validate reports/gates/triggers
      - produce post/final validation
      - fail honestly
      must_not:
      - repair code
      - hide failures
      - change mission profile
      - approve unresolved blockers
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - execution
      - reports
      - gates
      - triggers
      - handoffs
      - revisions
      - missions
      - testing
    failure_analysis_agent:
      definition: Failure analysis agent that classifies failures and decides repair/rerun/revision/block path before any repair.
      category: failure_analysis
      owned_phases:
      - failure_classification
      positive_signals:
      - active phase owner is failure_analysis_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - classify failure type
      - assign owner phase
      - select next action
      - request revision when needed
      must_not:
      - repair code
      - override validation
      - ignore evidence
      - mark mission passed
      authority_level: phase_output_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - execution
      - reports
      - revisions
      - triggers
      - risk
    repair_agent:
      definition: Repair agent that applies bounded repairs only when failure classification authorizes repair and scope permits it.
      category: repair
      owned_phases:
      - feedback_repair
      positive_signals:
      - active phase owner is repair_agent
      - phase bundle explicitly names this agent
      negative_signals:
      - phase bundle names another owner agent
      - required output belongs to an unowned phase
      must:
      - produce repair plan
      - repair only allowed failures
      - write repair result
      - request revalidation
      must_not:
      - repair without classification
      - expand scope
      - change design decisions silently
      - mark final validation passed
      authority_level: conditional_repair_authority
      required_runtime_inputs:
      - phase_execution_bundle
      - agent_prompt
      - agent_contract
      - permission_profile
      required_runtime_outputs:
      - declared_phase_reports
      integration_subsystems:
      - execution
      - revisions
      - reports
      - testing
validation:
  required_checks:
  - id: AGENT-TAXONOMY-CHECK-001
    check: every_agent_has_definition
    applies_when:
      agent_taxonomy_loaded: true
  fail_conditions:
  - id: AGENT-TAXONOMY-001
    condition: agent_missing_definition
    message: Every fixed agent must have an active definition with responsibilities and restrictions.
    severity: error
