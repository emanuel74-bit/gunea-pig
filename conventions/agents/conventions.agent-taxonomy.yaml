  path: agents/conventions.agent-taxonomy.yaml
  role: fixed_agent_vocabulary_contract
  executability: vocabulary
purpose: Define the fixed 18-agent roster.
ownership:
  owns:
  - agent_enum
  - agent_category_enum
  - agent_definitions
  does_not_own:
  - agent_permissions
  - phase_contracts
activation:
  mode: reference_only
  activates_when:
  - agent_values_are_referenced
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - agent_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
