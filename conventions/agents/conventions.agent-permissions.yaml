      definition: read mission request agent_tool vocabulary value.
      meaning: Represents the read mission request case within the agent_tool taxonomy.
      detection_signals:
      - read mission request signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches read mission request
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - agent_tool decisions using read_mission_request must include reason and evidence
