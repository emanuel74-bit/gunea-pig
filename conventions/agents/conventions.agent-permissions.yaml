validation:
  required_checks:
  - id: AGENT-PERMISSION-CHECK-001
    check: permission_profiles_cover_all_agents
    applies_when:
      permissions_loaded: true
  fail_conditions:
  - id: AGENT-PERMISSION-001
    condition: permission_profile_missing
    message: Every fixed agent must have one permission profile.
    severity: error
  - id: AGENT-PERMISSION-002
    condition: agent_source_edit_scope_invalid
    message: Only implementation and authorized repair may edit source code.
    severity: error
