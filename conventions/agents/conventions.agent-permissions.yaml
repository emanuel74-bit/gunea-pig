version: '1.0'
file:
  name: conventions.agent-permissions.yaml
  path: agents/conventions.agent-permissions.yaml
  role: agent_tool_and_file_permission_contract
  executability: permission_registry
purpose: Define strict read, write, tool, and source-edit permissions for every fixed agent.
ownership:
  owns:
  - agent_permission_schema
  - agent_tool_enum
  - agent_permission_profiles
  - permission_invariants
  does_not_own:
  - agent_contracts
  - phase_contracts
  - tool_runtime_implementation
activation:
  mode: conditional
  activates_when:
  - agent_permissions_are_evaluated
  skips_when: []
inputs:
  required:
  - agent_taxonomy
  - agent_contract_registry
  - report_registry
  optional: []
outputs:
  produces:
  - agent_permission_profiles
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - agents/conventions.agent-taxonomy.yaml
  - agents/conventions.agent-contracts.yaml
  - reports/conventions.report-registry.yaml
  optional_files: []
sections:
  agent_permission_schema:
    required_fields:
    - agent_id
    - may_read
    - may_write
    - may_edit_code
    - allowed_tools
    - forbidden_tools
    - forbidden_actions
    - requires_before_run
    - requires_after_run
  agent_tool_enum:
    allowed:
    - read_mission_request
    - read_phase_bundle
    - build_phase_bundle
    - read_runtime_pack
    - read_report
    - write_report
    - emit_trigger
    - request_revision
    - update_mission_state
    - invoke_phase_agent
    - run_gate_validator
    - resolve_triggers
    - process_revisions
    - validate_reports
    - read_source
    - edit_source
    - inspect_git_diff
    - run_tests
    - run_lint
    - run_build
    - run_validation_command
    - validate_gate
  permission_invariants:
    absolute_rules:
    - id: AGENT-PERMISSION-ABS-001
      rule: Only implementation_agent may edit source during implementation phase after pre-implementation gate passes.
      fail_condition: implementation_edit_permission_violation
    - id: AGENT-PERMISSION-ABS-002
      rule: repair_agent may edit source only after failure classification authorizes repair.
      fail_condition: unauthorized_repair_edit
    - id: AGENT-PERMISSION-ABS-003
      rule: Only alpha_controller may update mission state or invoke phase agents.
      fail_condition: non_alpha_runtime_tool_used
  agent_permission_profiles:
    alpha_controller:
      agent_id: alpha_controller
      may_read:
      - .ai/mission-state.yaml
      - .ai/phase-bundles/**
      - .ai/reports/**
      - .ai/runtime-packs/**
      - conventions/**
      may_write:
      - .ai/logs/**
      - .ai/mission-state.yaml
      - .ai/phase-bundles/**
      - .ai/reports/00-mission-profile.yaml
      - .ai/reports/01-active-context-manifest.yaml
      - .ai/reports/phase-accounting.yaml
      - .ai/reports/report-artifact-validation.yaml
      - .ai/reports/report-registry.yaml
      - .ai/reports/trigger-review.yaml
      may_edit_code: false
      allowed_tools:
      - build_phase_bundle
      - invoke_phase_agent
      - process_revisions
      - read_mission_request
      - read_report
      - resolve_triggers
      - run_gate_validator
      - update_mission_state
      - validate_reports
      - write_report
      forbidden_tools: []
      forbidden_actions:
      - write_unowned_report
      - modify_prior_phase_report
      - consume_invalidated_report
      - skip_required_output
      - change_phase_contract
      - weaken_gate
      - invent_enum_value
      requires_before_run:
      - entry_gate_passed
      - phase_bundle_exists
      - agent_prompt_injected
      - permission_profile_valid
      requires_after_run:
      - required_reports_written
      - output_gate_validation_requested
      - triggers_registered_by_alpha
    behavior_agent:
