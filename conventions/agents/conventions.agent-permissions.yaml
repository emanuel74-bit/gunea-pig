version: '1.0'
file:
  name: conventions.agent-permissions.yaml
  path: agents/conventions.agent-permissions.yaml
  role: agent_tool_and_file_permission_contract
  executability: validator
purpose: Define tool, read, write, and code-edit permissions for every fixed agent.
ownership:
  owns:
  - agent_permission_schema
  - agent_tool_enum
  - agent_permission_profiles
  does_not_own:
  - agent_contracts
  - phase_contracts
activation:
  mode: conditional
  activates_when:
  - agent_permissions_are_evaluated
  skips_when: []
inputs:
  required:
  - agent_taxonomy
  - agent_contract_registry
  optional: []
outputs:
  produces:
  - agent_permission_profiles
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - agents/conventions.agent-taxonomy.yaml
  - agents/conventions.agent-contracts.yaml
  optional_files: []
sections:
  agent_permission_schema:
    required_fields:
    - agent_id
    - may_read
    - may_write
    - may_edit_code
    - allowed_tools
    - forbidden_tools
    - forbidden_actions
  agent_tool_enum:
    allowed:
    - read_mission_request
    - read_report
    - write_report
    - read_source
    - edit_source
    - run_tests
    - run_lint
    - run_build
    - inspect_git_diff
    - update_mission_state
    - validate_schema
    - validate_gate
    - invoke_phase_agent
  agent_permission_profiles:
    alpha_controller:
      may_read:
      - .ai/reports/**
      - core/**
      may_write:
      - .ai/reports/00-mission-profile.yaml
