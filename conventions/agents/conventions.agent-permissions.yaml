      - .ai/reports/report-artifact-validation.yaml
      - .ai/reports/report-registry.yaml
      - .ai/reports/trigger-review.yaml
      may_edit_code: false
      allowed_tools:
      - invoke_phase_agent
      - read_mission_request
      - read_report
      - update_mission_state
      - validate_gate
      - validate_schema
      - write_report
      forbidden_tools:
      - read_source
      - edit_source
      - run_tests
      - run_lint
      - run_build
      - inspect_git_diff
      forbidden_actions:
      - violate_phase_contract
      - write_outside_scope
      - bypass_gate
    behavior_agent:
