artifact: phase_context_bundle
generated_by: generate-phase-bundle
mission_id: mission
phase_id: phase_accounting
owner_agent: alpha_controller
scope: single_phase_agent_invocation
agent_consumption_model:
  agent_reads_this_bundle: true
  agent_reads_full_topologies: false
  agent_scans_full_convention_system: false
  topology_outputs_are_script_facing: true
source_refs:
  phase_contract_ref: phases/conventions.phase-contracts.yaml#sections.phase_contract_registry
  phase_ownership_ref: agents/conventions.agent-phase-ownership.yaml#sections.phase_ownership_records
  executor_routes_ref: executors/conventions.executor-routes.yaml#sections.executor_routes
  bundle_policy_ref: multi-agent/conventions.phase-bundle-policy.yaml
required_executor_routes:
  - collect_phase_report
  - generate_phase_bundle
  - prepare_agent_handoff
  - run_gate_check
  - validate_phase_bundle
  - validate_phase_output
  - validate_semantic_completeness
route_contracts:
  collect_phase_report:
    executor_type: report
    script: scripts/collect-phase-report.ts
    lifecycle_hooks:
      - after_phase_output
    required_inputs:
      - phase_output
      - validation_results
      - gate_results
    produced_outputs:
      - phase_report
    required_artifacts:
      - phase_output
    allowed_write_paths:
      - .ai/reports/**
    failure_behavior: warn
  generate_phase_bundle:
    executor_type: generator
    script: scripts/generate-phase-bundle.ts
    lifecycle_hooks:
      - before_phase_start
    required_inputs:
      - mission_context
      - active_phase
      - active_phase_plan
      - phase_contract
      - owner_agent_contract
      - central_executor_route_map
      - loading_group_map
      - required_output_templates
    produced_outputs:
      - phase_context_bundle
      - phase_bundle_manifest
    required_artifacts:
      - active_phase_plan
      - phase_contract
    allowed_write_paths:
      - .ai/bundles/**
    failure_behavior: block
  prepare_agent_handoff:
    executor_type: handoff
    script: scripts/prepare-agent-handoff.ts
    lifecycle_hooks:
      - before_handoff
    required_inputs:
      - source_phase_output
      - target_agent_requirements
    produced_outputs:
      - agent_handoff_packet
    required_artifacts:
      - source_phase_output
    allowed_write_paths:
      - .ai/handoffs/**
    failure_behavior: block
  run_gate_check:
    executor_type: gate
    script: scripts/run-gate-check.ts
    lifecycle_hooks:
      - on_gate_check
    required_inputs:
      - gate_id
      - gate_inputs
      - validation_results
    produced_outputs:
      - gate_result
    required_artifacts:
      - validation_result
    allowed_write_paths:
      - .ai/gates/**
      - .ai/reports/**
    failure_behavior: block
  validate_phase_bundle:
    executor_type: validation
    script: scripts/validate-phase-bundle.ts
    lifecycle_hooks:
      - before_phase_start
    required_inputs:
      - phase_context_bundle
      - phase_bundle_schema
      - active_phase_plan
    produced_outputs:
      - phase_bundle_validation_result
    required_artifacts:
      - phase_context_bundle
    allowed_write_paths:
      - .ai/validation/**
      - .ai/reports/**
    failure_behavior: block
  validate_phase_output:
    executor_type: validation
    script: scripts/validate-phase-output.ts
    lifecycle_hooks:
      - after_phase_output
    required_inputs:
      - phase_output
      - phase_contract
    produced_outputs:
      - phase_validation_result
    required_artifacts:
      - phase_output
    allowed_write_paths:
      - .ai/validation/**
    failure_behavior: block
  validate_semantic_completeness:
    executor_type: validation
    script: scripts/validate-semantic-completeness.ts
    lifecycle_hooks:
      - before_mission_start
      - after_phase_output
      - before_mission_complete
    required_inputs:
      - semantic_completeness_contract
      - parsed_convention_files
    produced_outputs:
      - semantic_completeness_validation_result
      - semantic_completeness_report
    required_artifacts: []
    allowed_write_paths:
      - .ai/validation/**
      - .ai/reports/**
    failure_behavior: block
selected_records:
  phase_contract:
    phase_id: phase_accounting
    category: mission_control
    owner_agent: alpha_controller
    purpose: Account for every active, skipped, blocked, invalidated, rerun, or
      completed phase.
    required_inputs: []
    optional_inputs: []
    required_outputs:
      - .ai/reports/phase-accounting.yaml
    optional_outputs: []
    allowed_conventions:
      required_files:
        - core/conventions.file-contract.yaml
        - core/conventions.pipeline-contract.yaml
        - missions/conventions.mission-profiles.yaml
      optional_files:
        - core/conventions.index.yaml
        - reports/conventions.report-artifacts.yaml
    must_do:
      - execute_only_phase_accounting_scope
      - consume_declared_inputs_only
      - write_all_required_outputs_as_files
      - record_decisions_with_evidence_or_no_evidence_marker
      - emit_declared_triggers_when_conditions_match
      - request_revision_when_required_input_is_invalid_or_insufficient
    must_not_do:
      - perform_out_of_phase_work
      - bypass_or_mark_own_gate_passed
      - write_forbidden_files
      - modify_prior_phase_reports_unless_phase_contract_explicitly_allows_revision
      - invent_unknown_phase_or_agent
      - weaken_gate_or_handoff_requirements
      - edit_source_code
    entry_conditions:
      - phase appears in active_phase_plan
      - owner_agent contract/prompt/permissions exist
      - required inputs exist and are not invalidated
      - entry gate passes
    exit_conditions:
      - required outputs exist at declared paths
      - output gate passes
      - emitted triggers and revisions are registered
      - handoff gate passes before downstream consumption
    gate_refs: &a1
      entry_gate: gate.phase_accounting.entry
      output_gate: gate.phase_accounting.output
      handoff_gate: gate.phase_accounting.handoff
    handoff: &a2
      consumed_by_phases:
        - pre_implementation_gate
        - final_validation
      may_emit_triggers:
        - phase_revision_required
        - required_report_missing
        - report_schema_invalid
    allowed_write_scope:
      - .ai/reports/phase-accounting.yaml
      - .ai/mission-state.yaml
    forbidden_write_scope:
      - src/**
      - test/**
      - package.json
      - tsconfig*.json
    blocking_fail_conditions:
      - missing_required_input
      - required_output_missing
      - output_schema_invalid
      - unauthorized_write
      - active_unresolved_trigger_blocks_next_phase
      - handoff_not_consumable
    integration_contract:
      consumes:
        - agent_contract
        - agent_permission_profile
        - report_registry
        - gate_template
        - handoff_policy
      produces:
        - phase_status_update
        - report_outputs
        - trigger_candidates
        - handoff_candidates
  phase_ownership:
    phase_id: phase_accounting
    owner_agent: alpha_controller
    ownership_type: exclusive
    required_outputs:
      - .ai/reports/phase-accounting.yaml
    handoff_authority: handoff_subsystem_validates_consumption
    gate_authority: gates_subsystem_validates_entry_output_handoff
    runtime_authority: alpha_controller
    agent_may_schedule_followup_phases: false
    agent_may_emit_triggers: false
required_inputs: []
optional_inputs: []
required_outputs:
  - .ai/reports/phase-accounting.yaml
optional_outputs: []
allowed_convention_refs:
  - agents/conventions.agent-contracts.yaml
  - agents/conventions.agent-permissions.yaml
  - agents/conventions.agent-phase-ownership.yaml
  - agents/conventions.agent-prompts.yaml
  - core/conventions.file-contract.yaml
  - core/conventions.index.yaml
  - core/conventions.pipeline-contract.yaml
  - executors/conventions.executor-routes.yaml
  - missions/conventions.mission-profiles.yaml
  - multi-agent/conventions.phase-bundle-policy.yaml
  - phases/conventions.phase-contracts.yaml
  - phases/conventions.phase-lifecycle.yaml
  - reports/conventions.report-artifacts.yaml
  - reports/conventions.report-registry.yaml
  - reports/conventions.report-templates.yaml
allowed_write_scope:
  - .ai/reports/phase-accounting.yaml
  - .ai/mission-state.yaml
forbidden_write_scope:
  - src/**
  - test/**
  - package.json
  - tsconfig*.json
gates: *a1
handoff_requirements: *a2
must_do:
  - execute_only_phase_accounting_scope
  - consume_declared_inputs_only
  - write_all_required_outputs_as_files
  - record_decisions_with_evidence_or_no_evidence_marker
  - emit_declared_triggers_when_conditions_match
  - request_revision_when_required_input_is_invalid_or_insufficient
must_not_do:
  - perform_out_of_phase_work
  - bypass_or_mark_own_gate_passed
  - write_forbidden_files
  - modify_prior_phase_reports_unless_phase_contract_explicitly_allows_revision
  - invent_unknown_phase_or_agent
  - weaken_gate_or_handoff_requirements
  - edit_source_code
completion_contract:
  agent_must_write_all_required_outputs: true
  chat_response_is_summary_only: true
  missing_required_output_status: phase_failure
  agent_must_return_written_file_paths: true
minimization:
  contains_full_convention_package: false
  contains_full_topology_outputs: false
  includes_selected_records_only: true
  max_context_policy: include selected phase, owner, route, artifact, gate,
    handoff, and output requirements only
