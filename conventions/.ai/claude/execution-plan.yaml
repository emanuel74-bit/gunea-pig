artifact: claude_code_execution_plan
generated_by: generate-claude-execution-plan
status: generated
source_contract: claude-code/conventions.claude-execution-harness.yaml
route_resolution_authority: executors/conventions.executor-routes.yaml
script_selection_rule: scripts_may_only_be_invoked_after_executor_route_resolution
agent_context_rule: consume_validated_phase_bundles_not_full_conventions_or_full_topologies
mission_start_routes:
  - generate_claude_execution_plan
  - validate_claude_execution_plan
  - generate_mission_bundle
  - validate_executor_routes
  - compile_authority_topology
  - validate_authority_topology
  - validate_references
  - compile_runtime_artifact_topology
  - validate_runtime_artifacts
  - validate_script_execution
  - validate_semantic_completeness
phase_execution_routes:
  - generate_phase_bundle
  - validate_phase_bundle
  - run_gate_check
  - validate_gate_result
  - validate_phase_output
  - validate_semantic_completeness
  - collect_phase_report
  - collect_evidence
  - validate_report_evidence
  - prepare_agent_handoff
  - validate_handoff
completion_routes:
  - collect_evidence
  - validate_report_evidence
  - generate_final_mission_report
route_contract_slices:
  generate_claude_execution_plan:
    executor_type: generator
    required_inputs:
      - claude_code_harness_contract
      - central_executor_route_map
      - mission_context
    produced_outputs:
      - claude_execution_plan
    required_artifacts: []
    lifecycle_hooks:
      - before_mission_start
    failure_behavior: block
    script: scripts/generate-claude-execution-plan.ts
  validate_claude_execution_plan:
    executor_type: validation
    required_inputs:
      - claude_execution_plan
      - central_executor_route_map
      - claude_stop_conditions
    produced_outputs:
      - claude_execution_plan_validation_result
    required_artifacts:
      - claude_execution_plan
    lifecycle_hooks:
      - before_mission_start
      - before_phase_start
    failure_behavior: block
    script: scripts/validate-claude-execution-plan.ts
  generate_mission_bundle:
    executor_type: bundle
    required_inputs:
      - mission_type
      - mission_context
      - subsystem_entrypoint_map
    produced_outputs:
      - mission_context_bundle
    required_artifacts:
      - mission_definition
    lifecycle_hooks:
      - before_mission_start
    failure_behavior: block
    script: scripts/generate-mission-bundle.ts
  validate_executor_routes:
    executor_type: validation
    required_inputs:
      - executor_routes
      - local_required_executor_routes
    produced_outputs:
      - executor_route_validation_result
    required_artifacts: []
    lifecycle_hooks:
      - before_mission_start
      - after_file_change
    failure_behavior: block
    script: scripts/validate-executor-routes.ts
  compile_authority_topology:
    executor_type: compiler
    required_inputs:
      - parsed_convention_files
      - ownership_declarations
    produced_outputs:
      - authority_topology
      - authority_conflict_report
    required_artifacts: []
    lifecycle_hooks:
      - before_mission_start
      - after_file_change
    failure_behavior: block
    script: scripts/compile-authority-topology.ts
  validate_authority_topology:
    executor_type: validation
    required_inputs:
      - authority_topology
      - ownership_declarations
    produced_outputs:
      - authority_topology_validation_result
    required_artifacts:
      - authority_topology
    lifecycle_hooks:
      - before_mission_start
      - after_file_change
    failure_behavior: block
    script: scripts/validate-authority-topology.ts
  validate_references:
    executor_type: validation
    required_inputs:
      - parsed_convention_files
    produced_outputs:
      - reference_validation_result
      - reference_topology
    required_artifacts: []
    lifecycle_hooks:
      - before_mission_start
      - after_file_change
    failure_behavior: block
    script: scripts/validate-references.ts
  compile_runtime_artifact_topology:
    executor_type: compiler
    required_inputs:
      - runtime_artifact_declarations
      - runtime_artifact_references
    produced_outputs:
      - runtime_artifact_topology
      - artifact_conflict_report
      - runtime_artifact_reference_map
    required_artifacts: []
    lifecycle_hooks:
      - before_mission_start
      - after_file_change
    failure_behavior: block
    script: scripts/compile-runtime-artifact-topology.ts
  validate_runtime_artifacts:
    executor_type: validation
    required_inputs:
      - runtime_artifact_topology
      - runtime_artifact_declarations
      - runtime_artifact_references
      - central_executor_route_map
    produced_outputs:
      - runtime_artifact_validation_result
      - runtime_artifact_enforcement_report
    required_artifacts:
      - runtime_artifact_topology
    lifecycle_hooks:
      - before_mission_start
      - after_file_change
    failure_behavior: block
    script: scripts/validate-runtime-artifacts.ts
  validate_script_execution:
    executor_type: validation
    required_inputs:
      - central_executor_route_map
      - script_implementations
      - script_test_fixtures
    produced_outputs:
      - script_verification_result
      - script_verification_report
    required_artifacts: []
    lifecycle_hooks:
      - before_mission_start
      - after_file_change
    failure_behavior: block
    script: scripts/verify-scripts.ts
  validate_semantic_completeness:
    executor_type: validation
    required_inputs:
      - semantic_completeness_contract
      - parsed_convention_files
    produced_outputs:
      - semantic_completeness_validation_result
      - semantic_completeness_report
    required_artifacts: []
    lifecycle_hooks:
      - before_mission_start
      - after_phase_output
      - before_mission_complete
    failure_behavior: block
    script: scripts/validate-semantic-completeness.ts
  generate_phase_bundle:
    executor_type: generator
    required_inputs:
      - mission_context
      - active_phase
      - active_phase_plan
      - phase_contract
      - owner_agent_contract
      - central_executor_route_map
      - loading_group_map
      - required_output_templates
    produced_outputs:
      - phase_context_bundle
      - phase_bundle_manifest
    required_artifacts:
      - active_phase_plan
      - phase_contract
    lifecycle_hooks:
      - before_phase_start
    failure_behavior: block
    script: scripts/generate-phase-bundle.ts
  validate_phase_bundle:
    executor_type: validation
    required_inputs:
      - phase_context_bundle
      - phase_bundle_schema
      - active_phase_plan
    produced_outputs:
      - phase_bundle_validation_result
    required_artifacts:
      - phase_context_bundle
    lifecycle_hooks:
      - before_phase_start
    failure_behavior: block
    script: scripts/validate-phase-bundle.ts
  run_gate_check:
    executor_type: gate
    required_inputs:
      - gate_id
      - gate_inputs
      - validation_results
    produced_outputs:
      - gate_result
    required_artifacts:
      - validation_result
    lifecycle_hooks:
      - on_gate_check
    failure_behavior: block
    script: scripts/run-gate-check.ts
  validate_gate_result:
    executor_type: validation
    required_inputs:
      - gate_result
      - gate_contract
      - validation_results
    produced_outputs:
      - gate_result_validation_result
    required_artifacts:
      - gate_result
    lifecycle_hooks:
      - on_gate_check
    failure_behavior: block
    script: scripts/validate-gate-result.ts
  validate_phase_output:
    executor_type: validation
    required_inputs:
      - phase_output
      - phase_contract
    produced_outputs:
      - phase_validation_result
    required_artifacts:
      - phase_output
    lifecycle_hooks:
      - after_phase_output
    failure_behavior: block
    script: scripts/validate-phase-output.ts
  collect_phase_report:
    executor_type: report
    required_inputs:
      - phase_output
      - validation_results
      - gate_results
    produced_outputs:
      - phase_report
    required_artifacts:
      - phase_output
    lifecycle_hooks:
      - after_phase_output
    failure_behavior: warn
    script: scripts/collect-phase-report.ts
  collect_evidence:
    executor_type: report
    required_inputs:
      - validation_results
      - changed_file_results
      - gate_results
      - handoff_packets
      - revision_tasks
      - phase_reports
      - runtime_artifact_topology
    produced_outputs:
      - evidence_index
      - evidence_collection_report
    required_artifacts: []
    lifecycle_hooks:
      - after_phase_output
      - before_mission_complete
    failure_behavior: block
    script: scripts/collect-evidence.ts
  validate_report_evidence:
    executor_type: validation
    required_inputs:
      - evidence_index
      - report_outputs
      - runtime_artifact_topology
    produced_outputs:
      - report_evidence_validation_result
      - report_evidence_validation_report
    required_artifacts:
      - evidence_index
    lifecycle_hooks:
      - after_phase_output
      - before_mission_complete
    failure_behavior: block
    script: scripts/validate-report-evidence.ts
  prepare_agent_handoff:
    executor_type: handoff
    required_inputs:
      - source_phase_output
      - target_agent_requirements
    produced_outputs:
      - agent_handoff_packet
    required_artifacts:
      - source_phase_output
    lifecycle_hooks:
      - before_handoff
    failure_behavior: block
    script: scripts/prepare-agent-handoff.ts
  validate_handoff:
    executor_type: validation
    required_inputs:
      - agent_handoff_packet
      - target_agent_requirements
      - source_phase_output
    produced_outputs:
      - handoff_validation_result
    required_artifacts:
      - agent_handoff_packet
    lifecycle_hooks:
      - before_handoff
      - after_handoff
    failure_behavior: block
    script: scripts/validate-handoff.ts
  generate_final_mission_report:
    executor_type: report
    required_inputs:
      - evidence_index
      - phase_reports
      - validation_results
      - gate_results
      - handoff_packets
      - revision_tasks
      - unresolved_issues
    produced_outputs:
      - final_mission_report
      - mission_evidence_summary
    required_artifacts:
      - evidence_index
    lifecycle_hooks:
      - before_mission_complete
    failure_behavior: block
    script: scripts/generate-final-mission-report.ts
stop_conditions:
  - id: CLAUDE-STOP-001
    stop_when:
      - unknown_executor_route
      - route_script_missing
      - script_result_missing
    required_response: stop_and_report_runtime_configuration_failure
  - id: CLAUDE-STOP-002
    stop_when:
      - route_failure_behavior_block
      - route_result_status_fail
    required_response: stop_before_downstream_consumption
  - id: CLAUDE-STOP-003
    stop_when:
      - gate_result_status_blocked
      - gate_result_not_script_produced
    required_response: do_not_invoke_downstream_phase
  - id: CLAUDE-STOP-004
    stop_when:
      - handoff_invalid
      - handoff_not_script_produced
    required_response: do_not_allow_target_agent_consumption
  - id: CLAUDE-STOP-005
    stop_when:
      - revision_task_created
      - blocking_revision_open
    required_response: execute_revision_flow_before_continuation
  - id: CLAUDE-STOP-006
    stop_when:
      - final_report_missing
      - final_report_not_script_generated
      - evidence_invalid
    required_response: do_not_mark_mission_complete
completion_requires:
  - valid_report_evidence
  - script_generated_final_mission_report
  - no_blocking_revision_open
  - valid_gate_and_handoff_artifacts
