report_id: role-collision-resolution
phase_id: final_role_assignment
schema_version: "1.0"
status: complete

summary: >
  Role collision resolution for VDF pipeline. One role collision risk was identified
  in draft_role_pass (ROLE-COLLISION-SCAN-STATE-REPO) and resolved here. No split
  required. Resolution: separate repository instances are correct by design; shared
  schema definition consolidated in shared-types.

inputs_consumed:
  - source: .ai/reports/04-draft-role-signals.yaml
    type: draft_role_signals
  - source: .ai/reports/05-artifact-actions.yaml
    type: artifact_action_table

collisions_resolved:

  - collision_id: RCR-001
    original_collision_ref: ROLE-COLLISION-SCAN-STATE-REPO
    affected_artifacts: [AC-VSS-007, AC-VBS-013, AC-VSS-013]
    collision_description: >
      ScanStateRepository role claimed by both VSS (AC-VSS-007) and VBS (AC-VBS-013),
      both targeting the same MongoDB collection (scan_states). ScanStateSchema (AC-VSS-013)
      had unclear placement.
    resolution: >
      Separate repository instances are the CORRECT design. Each service owns the transitions
      for its state machine slice:
      - VSS ScanStateRepository owns: awaiting_staging → staged
      - VBS ScanStateRepository owns: staged → claimed → scanning → scan_complete →
        grouping_complete → pending_cleanup → cleanup_allowed → cleaned / failed
      Both repositories use the same shared-types ScanStateSchema (AC-SHARED-SCHEMA-001).
      No role collision exists — same role, different instance scope, same collection.
      Schema definition consolidated in shared-types (ACT-SCHEMA-001).
    resolution_type: separate_instances_by_design
    split_required: false
    final_artifacts:
      - artifact_id: AC-VSS-007
        path: packages/vss-service/src/infrastructure/scan-state.repository.ts
        scope: VSS state transitions (awaiting_staging → staged)
      - artifact_id: AC-VBS-013
        path: packages/vbs-service/src/infrastructure/scan-state.repository.ts
        scope: VBS state transitions (staged → ... → cleaned/failed)
      - artifact_id: AC-SHARED-SCHEMA-001
        path: packages/shared-types/src/schemas/scan-state.schema.ts
        scope: Shared Mongoose schema definition imported by both

collisions_not_found:
  - topic: Module role vs provider role (AC-VSS-012)
    outcome: Not a collision — single artifact, module role confirmed over provider in final assignment

no_split_required: true

triggers_emitted: []

produced_outputs:
  - .ai/reports/08-final-role-assignment.yaml
  - .ai/reports/role-collision-resolution.yaml
