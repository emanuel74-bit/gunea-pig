report_id: "role-collision-resolution"
phase_id: final_role_assignment
status: complete
summary: >
  5 role collisions detected and resolved using conventions role-collision rules.
  2 collisions involve post-action candidates whose draft intended_role was overridden
  (PAC-027 ScanResultClient: adapter -> client; PAC-039 RabbitMQPublisher: adapter -> publisher).
  3 collisions involve role disambiguation for split/service/orchestrator boundaries.
  0 collisions remain unresolved.

collisions_resolved:

  - collision_id: RC-001
    artifact_id: PAC-027
    source_candidate_id: AC-027
    artifact_name: ScanResultClient
    artifact_path: "packages/pipeline-service/src/grouping/infrastructure/scan-result.client.ts"
    collision_type: client_vs_adapter
    matched_roles: [client, adapter]
    selected_role: client
    rejected_role: adapter
    reason: >
      Client responsibility is primary. ScanResultClient's primary responsibility is retrieving
      external VDF scan result data from S3 (S3 JSON retrieval and NormalizedScanResult
      deserialization). The artifact name (ScanResultClient) reinforces client semantics.
      Adapter would be selected only when interface translation or boundary shaping is the
      primary concern — here the concern is data retrieval from an external store.
      The post-action candidate file assigned intended_role: adapter as a draft; this collision
      resolution overrides that assignment to client per final_role_assignment authority.
    evidence_refs:
      - ref: conventions/.ai/reports/05-artifact-actions.yaml
        section: "artifact_action_table[AC-027].desired_responsibility"
        observation: "S3 JSON retrieval and NormalizedScanResult deserialization — retrieval is primary"
      - ref: conventions/.ai/reports/post-action-artifact-candidates.yaml
        section: "post_action_candidates[PAC-027].intended_role"
        observation: "Draft intended_role: adapter — overridden by this collision resolution"
    decision_ref: DECISION-FR-001

  - collision_id: RC-002
    artifact_id: PAC-039
    source_candidate_id: AC-039
    artifact_name: RabbitMQPublisher
    artifact_path: "packages/pipeline-service/src/shared/infrastructure/rabbitmq.publisher.ts"
    collision_type: publisher_vs_producer
    matched_roles: [publisher, producer]
    selected_role: publisher
    rejected_role: producer
    reason: >
      Publisher responsibility is primary. RabbitMQPublisher publishes named domain-level
      integration messages to named exchanges using semantic routing keys. The responsibility
      involves domain event semantics (ScanCompletedEvent, VideoStagedEvent) with structured
      exchange/routing-key topology sourced from QUEUE_EXCHANGES/ROUTING_KEYS constants.
      Publisher role is more specific than producer — it emits domain events with named
      semantic intent, not raw message production.
      The post-action candidate file assigned intended_role: adapter as a draft; this collision
      resolution overrides that assignment to publisher per final_role_assignment authority.
    evidence_refs:
      - ref: conventions/.ai/reports/05-artifact-actions.yaml
        section: "artifact_action_table[AC-039].desired_responsibility"
        observation: "amqplib channel.publish() wrapper with topology from QUEUE_EXCHANGES/ROUTING_KEYS constants — publisher semantics primary"
      - ref: conventions/.ai/reports/post-action-artifact-candidates.yaml
        section: "post_action_candidates[PAC-039].intended_role"
        observation: "Draft intended_role: adapter — overridden by this collision resolution"
    decision_ref: DECISION-FR-002

  - collision_id: RC-003
    artifact_id: PAC-010
    source_candidate_id: AC-010
    artifact_name: ScanOrchestrator (post-split)
    artifact_path: "packages/pipeline-service/src/scanning/application/scan.orchestrator.ts"
    collision_type: service_vs_orchestrator
    matched_roles: [service, orchestrator]
    selected_role: orchestrator
    rejected_role: service
    reason: >
      Orchestrator responsibility is primary. The post-split ScanOrchestrator's sole remaining
      responsibility is coordinating a multi-step scan pipeline across multiple port-backed
      collaborators (claim batch via IBatchClaimerPort, dispatch VDF scan via IVdfRunnerPort,
      load results via IScanResultLoader, upload S3 via IStoragePort, emit event via
      IEventPublisher, cleanup via IVideoScanRepository). This is the canonical orchestrator
      pattern: coordinating a sequence of discrete steps across multiple downstream collaborators
      to achieve a single pipeline outcome. Service role would apply for single-operation or
      narrowly-scoped infrastructure coordination — this is a multi-step flow, making orchestrator
      the correct and more specific role.
    evidence_refs:
      - ref: conventions/.ai/reports/05-artifact-actions.yaml
        section: "artifact_action_table[AC-010].desired_responsibility"
        observation: "Multi-step scan flow coordinator: claim batch, dispatch VDF scan, load results, upload S3, emit event, cleanup"
      - ref: conventions/.ai/reports/05-artifact-actions.yaml
        section: "decisions[DECISION-AA-002]"
        observation: "ScanOrchestrator has 7 co-located responsibilities — post-split primary role is orchestration"
    decision_ref: DECISION-FR-003

  - collision_id: RC-004
    artifact_id: PAC-023
    source_candidate_id: AC-023
    artifact_name: ProcessScanHandler (post-split)
    artifact_path: "packages/pipeline-service/src/grouping/application/process-scan.handler.ts"
    collision_type: handler_vs_use_case
    matched_roles: [handler, use_case]
    selected_role: handler
    rejected_role: use_case
    reason: >
      Handler responsibility is primary. Post-split ProcessScanHandler is directly dispatched
      by ScanCompletedConsumer via consumer delegation — it is the receiving end of an async
      message dispatch chain. Handler role is more specific than use_case because the artifact
      is triggered by a message consumer delegation (not by an explicit command boundary or
      domain service invocation). The handler receives a dispatched scan processing task and
      executes the application flow end-to-end (load, filter, persist-edges, merge-groups,
      update-batch, publish).
    evidence_refs:
      - ref: conventions/.ai/reports/05-artifact-actions.yaml
        section: "artifact_action_table[AC-023].desired_responsibility"
        observation: "Application handler: load scan results, filter by threshold, persist edges/groups, update batch, publish event"
      - ref: conventions/.ai/reports/05-artifact-actions.yaml
        section: "artifact_action_table[AC-021].desired_responsibility"
        observation: "AMQP consumer delegates to ProcessScanHandler — direct consumer delegation confirms handler role"
    decision_ref: DECISION-FR-004

  - collision_id: RC-005
    artifact_id: PAC-014
    source_candidate_id: AC-014
    artifact_name: BatchClaimerService
    artifact_path: "packages/pipeline-service/src/scanning/infrastructure/batch-claimer.service.ts"
    collision_type: service_vs_orchestrator
    matched_roles: [service, orchestrator]
    selected_role: service
    rejected_role: orchestrator
    reason: >
      Service responsibility is primary. BatchClaimerService implements IBatchClaimerPort and
      performs atomic MongoDB batch claim coordination — a single-operation infrastructure
      service. It does not coordinate a multi-step workflow across multiple port-backed
      collaborators. The distinction from ScanOrchestrator (RC-003) is key: BatchClaimerService
      has one primary operation (atomic claim with recovery delegation), while ScanOrchestrator
      has a six-step pipeline. Service role correctly captures single-operation coordination;
      orchestrator is reserved for multi-step pipeline coordination.
    evidence_refs:
      - ref: conventions/.ai/reports/05-artifact-actions.yaml
        section: "artifact_action_table[AC-014].desired_responsibility"
        observation: "Service implementing IBatchClaimerPort: atomic MongoDB batch claim coordination — single operation"
      - ref: conventions/.ai/reports/05-artifact-actions.yaml
        section: "artifact_action_table[AC-014].reason_summary"
        observation: "artifact is modify_existing not split_existing because only one responsibility survives"
    decision_ref: DECISION-FR-005

collisions_unresolved: []

