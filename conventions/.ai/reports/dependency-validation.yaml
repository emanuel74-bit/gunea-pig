report_id: "dependency-validation"
phase_id: dependency_classification
status: complete
summary: >
  Dependency validation against direction rules, inversion rules, module rules,
  and import hygiene rules. Fourteen dependency direction violations found across
  all five packages — all are DIP violations at the application-to-infrastructure
  boundary (no port abstraction). No circular dependencies detected. No test
  dependency leaks (no test files exist). Two additional violations: @Interval
  decorator places application_to_transport coupling on ScanOrchestrator, and the
  shared kernel barrel exports concrete infrastructure classes violating shared
  kernel purity (IMPORT-MODULE-003). All violations require remediation in the
  architecture_decomposition phase. The validation_status is violations_found —
  all violations are pre-existing and must be resolved by the SOLID refactor, not
  by this phase.

inputs_consumed:
  - source: conventions/.ai/reports/dependency-classification.yaml
    artifact: dependency_classification
    fields_used:
      - static_dependencies
      - runtime_dependencies
      - dependency_direction_risks
      - external_integrations
      - validation_needs
  - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
    artifact: codebase_reconnaissance
    fields_used:
      - decisions
      - call_sites
      - relevant_artifacts
      - boundary_signals

decisions:
  - id: DECISION-DEPVAL-001
    decision: >
      All 14 application-to-infrastructure violations are classified as severity: error
      under DEP-VALID-003 (allowed_direction) because they match the forbidden direction
      application_to_infrastructure without satisfying the conditional requirement
      (target must be abstract port/interface owned by application/domain boundary).
    rationale: >
      Reconnaissance confirmed no TypeScript interface/port file exists for any
      repository, adapter, or infrastructure client in any service package. Every
      application handler uses the concrete class as both the import and the NestJS
      injection token. The conditional_dependency_directions rule
      (application_to_infrastructure.allowed_only_when) requires the target to be
      an abstract port — this condition is unmet in all 14 cases.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-006
        value: "No TypeScript interface exists between any application handler and its dependencies"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: boundary_signals
        value: "No formal ports/interfaces directory exists anywhere"

  - id: DECISION-DEPVAL-002
    decision: >
      No circular dependencies are present. The dependency validation check
      DEP-VALID-004 (no_cycles) passes. The dependency graph is strictly
      acyclic at both the package level and within each service.
    rationale: >
      The 18 enumerated call_site relationships in the reconnaissance report form
      a directed acyclic graph. The shared package has no imports from service packages.
      Domain policy classes have no inbound infrastructure imports. No service imports
      from another service at compile time.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: call_sites
        value: "All 18 relationships are strictly unidirectional"

  - id: DECISION-DEPVAL-003
    decision: >
      The DEP-VALID-006 (no_test_leak) check is vacuously passing — no test files
      exist in the monorepo so there are no test dependencies to validate for leakage.
      This is documented as a structural gap (DECISION-RECON-001): no test suite exists,
      so the behavioral safety net for the SOLID refactor must be established
      as a prerequisite or accepted risk.
    rationale: >
      Reconnaissance confirmed zero *.spec.ts or *.test.ts files. The test dependency
      validation check passes by absence but the absence itself is an architectural risk
      for the refactor.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-001
        value: "No test files found — ASSUMP-003 is FALSE"

  - id: DECISION-DEPVAL-004
    decision: >
      The shared barrel (packages/shared/src/index.ts) violates IMPORT-MODULE-003
      (shared/common modules must not import feature-specific modules) in spirit:
      the shared package exports concrete framework-coupled infrastructure classes
      that belong in an infrastructure layer, not a domain shared kernel. This is
      classified as severity: warning (shared_kernel_instability_signal) rather than
      error because the import direction (service -> shared) is technically allowed;
      the problem is the purity of the shared surface, not a forbidden direction.
    rationale: >
      IMPORT-MODULE-003 targets shared modules importing feature-specific code.
      The shared package does not import from services — services import from it.
      The violation is that the shared barrel collapses domain types and infrastructure
      classes into one surface (IMPORT-BARREL-002: barrel must not flatten unrelated
      boundaries). This is a warning-severity purity concern, not a forbidden direction.
    evidence:
      - source: packages/shared/src/index.ts
        field: exports
        value: "Exports both clean domain types and concrete NestJS Mongoose schema classes, RabbitMQPublisher, S3Adapter"

  - id: DECISION-DEPVAL-005
    decision: >
      The @Interval decorator violation (RD-005 in dependency-classification) is
      classified as severity: error (application_to_transport per IMPORT-LAYER-002).
      The ScanOrchestrator's @Interval coupling makes the application class non-portable
      across transport changes and forces a framework dependency into the application layer.
    rationale: >
      IMPORT-LAYER-002 forbids application_to_transport. The @Interval decorator is a
      NestJS scheduling transport registration applied to an application-layer class.
      The application layer should expose a plain method that a transport adapter calls;
      it must not own the transport registration decorator.
    evidence:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: method decorator
        value: "@Interval(30_000) processPendingBatch() — NestJS scheduling framework in application layer"

dependency_rule_checks:
  - check_id: DEP-VALID-001
    name: known_dependency_type
    result: pass
    notes: >
      All dependency_type values in dependency-classification.yaml use known taxonomy
      values: static_import, constructor_injection, message_subscription, event_publication,
      runtime_registration, provider_binding. No unknown types used.

  - check_id: DEP-VALID-002
    name: known_dependency_scope
    result: pass
    notes: >
      All dependency_scope values are from the known taxonomy: same_module, cross_module,
      shared_kernel, external_package, external_system, same_artifact.

  - check_id: DEP-VALID-003
    name: allowed_direction
    result: fail
    violation_count: 15
    notes: >
      14 application-to-infrastructure violations (no port abstraction) + 1
      application-to-transport violation (@Interval on application class).
      All match forbidden or conditional-unmet direction rules.

  - check_id: DEP-VALID-004
    name: no_cycles
    result: pass
    notes: >
      No circular dependencies detected in the static import graph or DI registration
      graph. All dependency flows are unidirectional.

  - check_id: DEP-VALID-005
    name: public_api_cross_module
    result: pass_with_warning
    notes: >
      All cross-module imports target @gunea-pig/shared's public barrel index (pass).
      Warning: the barrel surface exposes concrete infrastructure classes mixed with
      domain types — barrel purity should be validated post-refactor (IMPORT-BARREL-002).

  - check_id: DEP-VALID-006
    name: no_test_leak
    result: pass_vacuous
    notes: >
      No test files exist in the monorepo. No test dependency leakage possible.
      This is a structural gap — no behavioral safety net exists for the refactor.

  - check_id: DEP-VALID-007
    name: runtime_registration_valid
    result: fail_warning
    notes: >
      Mongoose model registrations (MongooseModule.forFeature) are valid and correctly
      placed in module providers. RabbitMQ topology assertion is embedded inside
      RabbitMQPublisher.connect() — topology setup is a separate concern from message
      publishing (SRP violation, not a registration failure). SharedInfraModule @Global
      creates hidden implicit registrations (runtime_hidden_dependency risk).

  - check_id: DEP-VALID-008
    name: provider_binding_valid
    result: fail
    notes: >
      No port/interface bindings exist. Provider bindings in all app.module.ts files
      bind concrete classes to themselves (class token -> concrete class factory).
      No abstraction/port is bound — violates the intent of provider_binding pattern
      which requires "implementation satisfies expected abstraction/port" (none exist).

  - check_id: DEP-VALID-009
    name: external_dependency_reviewed
    result: pass_with_notes
    notes: >
      Three external system integrations identified: MongoDB/Mongoose, RabbitMQ/amqplib,
      AWS S3/AWS SDK v3. All are intentional and previously reviewed (behavior contract
      02 confirms RabbitMQ and S3/MinIO as the sole external systems). No new or
      unreviewed external dependencies found.

  - check_id: DEP-VALID-010
    name: configuration_dependency_safe
    result: pass
    notes: >
      All configuration references use the plainToInstance + validateSync pattern
      declared as local convention LC-004. Environment variables are validated at
      startup. Symbol injection tokens are declared for config values in most services.
      No undocumented configuration dependencies found.

violations:
  - violation_id: VIOL-001
    dependency_id: SD-001
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      StageVideoHandler injects VideoRepository (concrete class) with no IVideoRepository
      port interface. Application handler must depend on abstraction, not concretion.
    required_followup: >
      Create IVideoRepository port interface in staging-service application/ports/ or
      domain/. Update StageVideoHandler constructor to use port token. Bind
      VideoRepository as the implementation in staging-service AppModule.
    evidence_refs:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: constructor
        value: "VideoRepository — concrete class, no interface"

  - violation_id: VIOL-002
    dependency_id: SD-002
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      StageVideoHandler injects FileStagingAdapter (concrete class) with no IFileStagingPort
      interface. Application handler must depend on abstraction, not concretion.
    required_followup: >
      Create IFileStagingPort interface. Update StageVideoHandler constructor to inject
      the port token. Bind FileStagingAdapter to the port in AppModule.
    evidence_refs:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: constructor
        value: "FileStagingAdapter — concrete class"

  - violation_id: VIOL-003
    dependency_id: SD-003
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      ProcessScanHandler injects five concrete infrastructure classes (ScanResultClient,
      SimilarityEdgeRepository, SimilarityGroupRepository, VideoSimilarityRepository,
      ScanBatchRepository) with no port interfaces. All five must be abstracted.
    required_followup: >
      Create port interfaces for all five infrastructure classes injected by ProcessScanHandler.
      Update handler constructor. Bind concrete implementations in grouping-service AppModule.
    evidence_refs:
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: constructor parameters
        value: "ScanResultClient, SimilarityEdgeRepository, SimilarityGroupRepository, VideoSimilarityRepository, ScanBatchRepository — all concrete"

  - violation_id: VIOL-004
    dependency_id: SD-004
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      ProcessScanHandler injects RabbitMQPublisher (concrete shared-package class) with
      no IEventPublisher or IQueuePublisher port interface. Application handler must
      publish events through an abstraction.
    required_followup: >
      Create IEventPublisher port interface (or IQueuePublisher). Declare it in the
      grouping-service ports/ layer or shared types. Update ProcessScanHandler to inject
      the port token. Bind RabbitMQPublisher in grouping-service AppModule.
    evidence_refs:
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: constructor
        value: "private readonly publisher: RabbitMQPublisher"

  - violation_id: VIOL-005
    dependency_id: SD-005
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      ScanOrchestrator injects S3Adapter (concrete shared-package AWS SDK wrapper) with
      no IStoragePort or IS3Client interface. Application orchestrator must not directly
      depend on an external cloud storage client.
    required_followup: >
      Create IStoragePort interface. Update ScanOrchestrator to inject the port token.
      Bind S3Adapter as the implementation in vdf-scan-service AppModule (or via
      SharedInfraModule in pipeline-service).
    evidence_refs:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: constructor
        value: "injects S3Adapter directly"

  - violation_id: VIOL-006
    dependency_id: SD-006
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      ScanOrchestrator injects RabbitMQPublisher (concrete shared-package class) with
      no IEventPublisher port interface. Same violation as VIOL-004 in a different service.
    required_followup: >
      Same as VIOL-004 — define shared IEventPublisher port and apply consistently
      across both vdf-scan-service and grouping-service.
    evidence_refs:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: constructor
        value: "injects RabbitMQPublisher directly"

  - violation_id: VIOL-007
    dependency_id: SD-007
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      ScanOrchestrator injects five concrete vdf-scan-service infrastructure classes
      (BatchClaimerService, VdfRunnerAdapter, ScanPurgerService, VdfManifestNormalizer,
      VideoScanRepository) with no port interfaces. This makes the orchestrator the most
      severely coupled application class in the codebase.
    required_followup: >
      Create port interfaces for IBatchClaimerPort, IVdfRunnerPort, IScanPurgerPort,
      IManifestNormalizerPort, IVideoScanRepository. Update ScanOrchestrator to inject
      all port tokens. Bind concrete implementations in vdf-scan-service AppModule.
    evidence_refs:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: constructor parameters
        value: "BatchClaimerService, VdfRunnerAdapter, ScanPurgerService, VdfManifestNormalizer, VideoScanRepository — all concrete"

  - violation_id: VIOL-008
    dependency_id: RD-003
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      ScanOrchestrator publishes ScanCompletedEvent via direct RabbitMQPublisher injection
      (no event publisher port). This is the runtime manifestation of VIOL-006.
    required_followup: >
      Resolved by VIOL-006 remediation — introducing IEventPublisher port.
    evidence_refs:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: publisher call
        value: "calls RabbitMQPublisher.publish() for ScanCompletedEvent"

  - violation_id: VIOL-009
    dependency_id: RD-004
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      ProcessScanHandler publishes ScanPersistedEvent via direct RabbitMQPublisher injection.
      Runtime manifestation of VIOL-004.
    required_followup: >
      Resolved by VIOL-004 remediation — introducing IEventPublisher port.
    evidence_refs:
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: publisher call
        value: "calls RabbitMQPublisher.publish() for ScanPersistedEvent"

  - violation_id: VIOL-010
    dependency_id: RD-005
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: IMPORT-LAYER-002
    direction: application_to_transport
    message: >
      @Interval(30_000) decorator from @nestjs/schedule is applied to
      ScanOrchestrator.processPendingBatch() — an application-layer method.
      Application layer must not own scheduling transport registration.
    required_followup: >
      Create a SchedulerAdapter or ScanTriggerAdapter in vdf-scan-service
      infrastructure/ or transport/ layer. That adapter registers the @Interval
      and calls the plain application-layer method (without decorator). The
      ScanOrchestrator method should be a plain async function with no framework
      annotations.
    evidence_refs:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: method decorator
        value: "@Interval(30_000) processPendingBatch()"

  - violation_id: VIOL-011
    dependency_id: SD-008
    fail_condition: barrel_export_collapses_unrelated_boundaries
    severity: warning
    rule_violated: IMPORT-BARREL-002
    direction: shared_kernel_instability
    message: >
      packages/shared/src/index.ts collapses clean domain types (types/) and concrete
      NestJS/Mongoose infrastructure classes (db/, queue/, storage/) into one barrel export.
      Consumers importing domain types receive transitive framework dependencies.
    required_followup: >
      Introduce a sub-surface separation in the shared barrel: export domain types under
      one explicit path and infrastructure classes under another. Run IMPORT-BARREL-002
      check after refactor to confirm barrel boundary preservation.
    evidence_refs:
      - source: packages/shared/src/index.ts
        field: exports
        value: "export * from './types'; export * from './db'; export * from './queue'; export * from './storage'"

  - violation_id: VIOL-012
    dependency_id: RD-007
    fail_condition: runtime_registration_invalid
    severity: warning
    rule_violated: DEP-VALID-007
    direction: runtime_hidden_dependency
    message: >
      pipeline-service SharedInfraModule @Global pattern creates hidden implicit
      registrations. Three submodules depend on S3Adapter and RabbitMQPublisher
      without declaring them in their own imports arrays.
    required_followup: >
      After port interfaces are introduced (VIOL-005, VIOL-006), replace @Global
      concrete class providers with explicit port token providers per submodule,
      or retain @Global but bind to port tokens to make hidden coupling visible.
    evidence_refs:
      - source: packages/pipeline-service/src/shared-infra.module.ts
        field: decorator
        value: "@Global() — implicit provider injection to all submodules"

  - violation_id: VIOL-013
    dependency_id: DEP-VALID-008
    fail_condition: provider_binding_incompatible_with_port
    severity: error
    rule_violated: IMPORT-RUNTIME-001
    message: >
      All provider bindings in all service app.module.ts files bind concrete class
      tokens to concrete class factories — no abstraction/port token exists anywhere.
      The NestJS DI container resolves concretions to concretions, not interfaces to
      implementations.
    required_followup: >
      After port interfaces and Symbol injection tokens are introduced (per VN-001,
      DECISION-LCC-003), update all provider arrays to bind port tokens to concrete
      adapter implementations. Example:
      { provide: VIDEO_REPOSITORY_PORT, useClass: VideoRepository }
    evidence_refs:
      - source: packages/grouping-service/src/app.module.ts
        field: providers
        value: "{ provide: RabbitMQPublisher, useFactory: async () => new RabbitMQPublisher(...) }"
      - source: packages/staging-service/src/app.module.ts
        field: providers
        value: "{ provide: S3Adapter, useFactory: () => new S3Adapter(...) }"

  - violation_id: VIOL-014
    dependency_id: SD-003
    fail_condition: forbidden_dependency_direction
    severity: error
    rule_violated: DEPENDENCY-INVERSION-001
    direction: application_to_infrastructure
    message: >
      pipeline-service duplicates all application-to-infrastructure violations from
      the standalone services verbatim. All violations (VIOL-001 through VIOL-013)
      have identical counterparts in the pipeline-service submodules.
    required_followup: >
      The port interface introduction work must be applied to pipeline-service
      submodules as well. Since pipeline-service is the consolidation target
      (per DECISION-RECON-004), the canonical port/implementation pattern should
      be established there first.
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-004
        value: "pipeline-service is a near-verbatim code duplication of the three standalone services"

required_followups:
  - followup_id: RF-001
    priority: critical
    category: port_interface_creation
    description: >
      Create port interfaces for all concrete infrastructure dependencies injected
      by application-layer handlers. Minimum required ports:
      IVideoRepository, IFileStagingPort (staging-service);
      IScanResultLoader, ISimilarityEdgeRepository, ISimilarityGroupRepository,
      IVideoSimilarityRepository, IScanBatchRepository, IEventPublisher (grouping-service);
      IBatchClaimerPort, IVdfRunnerPort, IScanPurgerPort, IManifestNormalizerPort,
      IVideoScanRepository, IStoragePort, IEventPublisher (vdf-scan-service).
      IEventPublisher and IStoragePort should be declared in the shared package types
      surface and reused across services.
    resolves_violations:
      - VIOL-001
      - VIOL-002
      - VIOL-003
      - VIOL-004
      - VIOL-005
      - VIOL-006
      - VIOL-007
      - VIOL-008
      - VIOL-009
      - VIOL-013
      - VIOL-014

  - followup_id: RF-002
    priority: critical
    category: injection_token_updates
    description: >
      After port interfaces are defined, declare Symbol injection tokens for each
      port (extending local convention CONV-003/DECISION-LCC-003). Update all
      application handler constructors to use port token injection. Update all
      app.module.ts provider arrays to bind port tokens to concrete implementations.
      staging-service requires a new injection-tokens.ts file (currently missing —
      identified in CONV-003 as package violating the convention).
    resolves_violations:
      - VIOL-013
    depends_on:
      - RF-001

  - followup_id: RF-003
    priority: high
    category: scheduler_transport_separation
    description: >
      Move the @Interval scheduling registration from ScanOrchestrator (application layer)
      to a new transport/scheduling adapter class. The adapter owns the @Interval decorator
      and calls the application-layer method as a plain dependency invocation.
      ScanOrchestrator.processPendingBatch() becomes a plain public async method
      with no NestJS framework annotations.
    resolves_violations:
      - VIOL-010

  - followup_id: RF-004
    priority: high
    category: shared_kernel_purity
    description: >
      Refactor the shared package barrel to separate domain types from infrastructure
      exports. Options: (a) add a types-only barrel entry point
      (e.g., @gunea-pig/shared/types) that exports only clean interfaces/enums;
      (b) split the shared package into two packages (shared-types, shared-infra).
      Either approach must preserve the barrel convention (DECISION-LCC-010) and
      must not break existing imports without a migration plan.
    resolves_violations:
      - VIOL-011

  - followup_id: RF-005
    priority: medium
    category: global_module_coupling
    description: >
      After port interfaces are introduced in pipeline-service, update SharedInfraModule
      to provide port tokens rather than concrete class tokens, or replace @Global with
      explicit per-submodule port token binding. This makes hidden implicit dependencies
      explicit and compatible with port-based DI.
    resolves_violations:
      - VIOL-012
    depends_on:
      - RF-001
      - RF-002

  - followup_id: RF-006
    priority: medium
    category: isp_interface_segregation
    description: >
      When creating port interfaces for ISP-violating repositories (VideoRepository,
      VideoSimilarityRepository, VideoScanRepository), define segregated read and write
      port interfaces rather than one wide interface. Example: split VideoRepository into
      IVideoReadPort and IVideoWritePort so handlers can declare only the operations
      they actually need (per DECISION-RECON-007).
    resolves_violations: []
    notes: >
      Not a DIP violation but an ISP improvement opportunity during port introduction.
      Address in architecture_decomposition phase when defining port contracts.

evidence_refs:
  - ref: conventions/.ai/reports/dependency-classification.yaml
    section: static_dependencies, runtime_dependencies, dependency_direction_risks, validation_needs
    consumed_by: full_dependency_validation
  - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
    section: decisions, call_sites, boundary_signals
    consumed_by: violation_evidence_grounding
  - ref: conventions/dependencies/conventions.dependency-direction-rules.yaml
    section: dependency_inversion_rules, layer_dependency_rules, forbidden_dependency_directions
    consumed_by: violation_classification_and_severity
  - ref: conventions/dependencies/conventions.dependency-validation.yaml
    section: validation_check_registry, violation_severity_rules, required_followup_mapping
    consumed_by: check_registry_execution
  - ref: conventions/dependencies/conventions.import-rules.yaml
    section: barrel_export_rules, runtime_import_hygiene_rules
    consumed_by: VIOL-011, VIOL-013 classification

triggers_emitted: []

gate_result:
  gate_id: gate.dependency_classification.output
  status: pending
  note: Gate result is produced by the gate subsystem via run_gate_check route — not authored here.
