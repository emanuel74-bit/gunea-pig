report_id: dependency-validation
phase_id: dependency_classification
schema_version: "1.0"
status: complete

summary: >
  Dependency validation plan for all 15 classified dependencies. No forbidden
  direction violations detected in planned architecture. Three high-priority
  validation requirements: (1) VDF CLI adapter isolation must be validated at
  architecture review; (2) Mongoose document boundary must not leak into
  application/domain layers; (3) shared-types package boundary must be stable
  before implementation begins. All external_system dependencies require
  timeout/retry/error handling validation during implementation phase.

inputs_consumed:
  - source: .ai/reports/dependency-classification.yaml
    type: dependency_classification

validation_checks:

  - check_id: DV-001
    dependency_ids: [DEP-011]
    check_type: boundary_isolation
    description: >
      VDF CLI adapter (VdfScannerPort) must be the sole boundary between application
      and child_process. No application or domain artifact may import child_process
      directly. VDF output normalization must be behind ScanResultNormalizerPort.
    validation_method: architecture review + import graph scan (grep for child_process in non-adapter files)
    severity: blocking
    validation_phase: architecture_decomposition + post_implementation_validation

  - check_id: DV-002
    dependency_ids: [DEP-006, DEP-007]
    check_type: boundary_isolation
    description: >
      Mongoose Document types must not appear in application service signatures or
      domain models. Repository adapters must map Mongoose documents to plain
      domain DTOs before returning to application layer.
    validation_method: TypeScript type check — application/domain must not import from @nestjs/mongoose or mongoose directly
    severity: blocking
    validation_phase: post_implementation_validation

  - check_id: DV-003
    dependency_ids: [DEP-015, DEP-007]
    check_type: shared_kernel_stability
    description: >
      shared-types package contents must be limited to: event DTO interfaces,
      scan state enum, similarity threshold config interface. No implementation
      code. No service-internal types. Changes to shared-types require review
      of all consuming services.
    validation_method: PR review gate — shared-types changes trigger mandatory cross-service review
    severity: blocking
    validation_phase: pre_implementation_gate + post_implementation_validation

  - check_id: DV-004
    dependency_ids: [DEP-001, DEP-002]
    check_type: idempotency_discipline
    description: >
      VSS and SGS RabbitMQ consumers must acknowledge messages only after all
      state-changing operations complete and idempotency is confirmed. Consumer
      must read MongoDB state BEFORE processing to detect and skip already-processed
      messages.
    validation_method: integration test — deliver duplicate message, verify no duplicate side effects
    severity: blocking
    validation_phase: test_derivation + post_implementation_validation

  - check_id: DV-005
    dependency_ids: [DEP-003]
    check_type: ordering_discipline
    description: >
      VBS must write scan result to S3 and confirm write success before publishing
      scan-completed to RabbitMQ. No transactional guarantee exists — this ordering
      must be enforced procedurally in the VBS publication flow.
    validation_method: unit test of VBS publication flow — mock S3 write failure, verify no publish occurs
    severity: blocking
    validation_phase: test_derivation + post_implementation_validation

  - check_id: DV-006
    dependency_ids: [DEP-005, DEP-008, DEP-009, DEP-010]
    check_type: adapter_isolation
    description: >
      amqplib and @aws-sdk/client-s3 must only be imported by their dedicated
      adapter modules. Application service imports must target abstract port interfaces
      only. Grep check: no application/domain file may contain 'amqplib' or '@aws-sdk/client-s3'.
    validation_method: grep scan on post-implementation source tree
    severity: blocking
    validation_phase: post_implementation_validation

  - check_id: DV-007
    dependency_ids: [DEP-012]
    check_type: config_validation
    description: >
      All required environment variables must be validated at service startup via
      class-validator on config DTO. Missing or invalid config must fail fast (service
      does not start) rather than silently using defaults that cause runtime failure.
    validation_method: unit test — start service with missing env var, expect startup exception
    severity: blocking
    validation_phase: test_derivation + post_implementation_validation

  - check_id: DV-008
    dependency_ids: [DEP-011]
    check_type: error_handling
    description: >
      VDF CLI invocation failures must be caught and classified as retryable vs
      permanent. Child process exit code != 0 and spawn errors must be handled
      and mapped to VBS-F-007 retry logic without crashing the VBS service.
    validation_method: unit test — mock VDF binary to exit non-zero, verify retry/failure handling
    severity: blocking
    validation_phase: test_derivation

  - check_id: DV-009
    dependency_ids: [DEP-001, DEP-002, DEP-003, DEP-004, DEP-005]
    check_type: connection_resilience
    description: >
      RabbitMQ connection must use amqp-connection-manager's auto-reconnect behavior.
      Services must not crash on temporary RabbitMQ unavailability (NFR-006).
    validation_method: integration test — bring RabbitMQ down/up, verify service reconnects and resumes processing
    severity: standard
    validation_phase: post_implementation_validation

  - check_id: DV-010
    dependency_ids: [DEP-006]
    check_type: connection_resilience
    description: >
      MongoDB connection must tolerate temporary unavailability. @nestjs/mongoose
      built-in retry handles this, but write concern majority requires MongoDB
      replica set or explicit degradation handling.
    validation_method: review MongoDB write concern configuration; verify retry behavior in staging environment
    severity: standard
    validation_phase: post_implementation_validation

forbidden_direction_validation:
  checked: true
  violations_found: []
  method: >
    Reviewed planned dependency directions against dependency_direction_definitions.
    All infrastructure→port, transport→application, and infrastructure→external_system
    directions are in the allowed list. No domain→infrastructure or
    transport→persistence_directly patterns planned.

validation_summary:
  total_checks: 10
  blocking_checks: 8
  standard_checks: 2
  violations_found: 0
  deferred_to_phase:
    architecture_decomposition: [DV-001]
    test_derivation: [DV-004, DV-005, DV-007, DV-008]
    pre_implementation_gate: [DV-003]
    post_implementation_validation: [DV-001, DV-002, DV-003, DV-004, DV-005, DV-006, DV-009, DV-010]

triggers_emitted: []

gate_result:
  gate_id: gate.dependency_classification.output
  status: pass
  failures: []

produced_outputs:
  - .ai/reports/dependency-classification.yaml
  - .ai/reports/dependency-validation.yaml
