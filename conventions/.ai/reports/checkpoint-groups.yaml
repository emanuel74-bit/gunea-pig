report_id: "checkpoint-groups"
phase_id: implementation_sequence
schema_version: "1.0"
status: complete

summary: >
  5 checkpoint groups aligned to the 5 implementation waves. Each checkpoint
  validates wave outputs before the next wave begins. CG-001 (scaffolding) and
  CG-002 (shared-types) are sequential gates. CG-003 through CG-005 may be
  validated per-service or as a wave. CG-005 is the final pre-integration
  checkpoint before test-suite validation.

checkpoint_groups:

  - checkpoint_id: CG-001
    name: Project Scaffolding
    wave: 1
    validates: wave_1
    blocking: true
    artifacts:
      - path: package.json
        check: npm workspaces array includes all 4 packages
      - path: .nvmrc
        check: contains "18.8.0"
      - path: tsconfig.base.json
        check: strict=true, experimentalDecorators=true, emitDecoratorMetadata=true
      - path: .eslintrc.js
        check: "@typescript-eslint/recommended present"
      - path: .prettierrc
        check: valid JSON/YAML with singleQuote and trailingComma
      - path: jest.config.js
        check: projects array references each package jest config
      - path: packages/shared-types/package.json
        check: name="@vdf/shared-types"; main points to built output
      - path: packages/vss-service/package.json
        check: name="@vdf/vss-service"
      - path: packages/vbs-service/package.json
        check: name="@vdf/vbs-service"; @nestjs/schedule present in deps
      - path: packages/sgs-service/package.json
        check: name="@vdf/sgs-service"
    pass_criteria: All 10 files present and structurally valid

  - checkpoint_id: CG-002
    name: shared-types Package Complete
    wave: 2
    validates: wave_2
    blocking: true
    artifacts:
      - path: packages/shared-types/src/enums/scan-state.enum.ts
        check: exports ScanState enum with all 10 states
      - path: packages/shared-types/src/interfaces/similarity-threshold-config.interface.ts
        check: exports SimilarityThresholdConfig interface with 4 threshold fields
      - path: packages/shared-types/src/interfaces/normalized-scan-result.interface.ts
        check: exports NormalizedScanResult with scan_id, scanner_version, video_pairs
      - path: packages/shared-types/src/events/new-video-ready-for-scan.event.ts
        check: class with event_id, schema_version, video_id, s3_reference, timestamp
      - path: packages/shared-types/src/events/scan-completed.event.ts
        check: class with scan_id, result_location, scanned_video_ids, scanner_profile, scanner_version, timestamp
      - path: packages/shared-types/src/schemas/scan-state.schema.ts
        check: uses @nestjs/mongoose decorators; exports ScanStateSchema and ScanStateDocument
      - path: packages/shared-types/src/index.ts
        check: barrel exports all public shared-types artifacts
    pass_criteria: All 7 files present; tsc --noEmit passes on shared-types package
    special_note: >
      CG-002 must pass before wave_3 begins. Run `npx tsc --noEmit` inside
      packages/shared-types to verify no type errors before proceeding.

  - checkpoint_id: CG-003
    name: Infrastructure Layer Complete (all 3 services)
    wave: 3
    validates: wave_3
    blocking: true
    artifacts:
      vss_infrastructure:
        - path: packages/vss-service/src/config/vss.config.ts
          check: class-validator @IsString, @IsNotEmpty decorators; RABBITMQ_URL, MONGODB_URI, S3 fields
        - path: packages/vss-service/src/infrastructure/rabbitmq/rabbitmq.module.ts
          check: amqp-connection-manager connection; exchange/queue declarations
        - path: packages/vss-service/src/infrastructure/scan-state.repository.ts
          check: findOneAndUpdate CAS from awaiting_staging to staged
        - path: packages/vss-service/src/infrastructure/video-metadata.repository.ts
          check: implements video metadata read
        - path: packages/vss-service/src/infrastructure/s3-video-downloader.adapter.ts
          check: implements StoragePort; uses @aws-sdk/client-s3 GetObject
        - path: packages/vss-service/src/infrastructure/filesystem-staging-writer.adapter.ts
          check: writes file to VDF_SCAN_PATH directory
      vbs_infrastructure:
        - path: packages/vbs-service/src/config/vbs.config.ts
          check: BATCH_SIZE and BATCH_CLAIM_TTL present; VDF_CLI_PATH validated
        - path: packages/vbs-service/src/infrastructure/rabbitmq/rabbitmq.module.ts
          check: scan exchange declarations
        - path: packages/vbs-service/src/infrastructure/vdf/vdf-cli.adapter.ts
          check: no imports of child_process in any other file; spawns with correct args
        - path: packages/vbs-service/src/infrastructure/vdf/vdf-output-normalizer.adapter.ts
          check: maps VDF JSON to NormalizedScanResult; throws NormalizationError on bad input
        - path: packages/vbs-service/src/infrastructure/s3-scan-result-writer.adapter.ts
          check: PutObject with JSON body
        - path: packages/vbs-service/src/infrastructure/rabbitmq/scan-completed.publisher.ts
          check: publishes ScanCompletedEvent
        - path: packages/vbs-service/src/infrastructure/scan-state.repository.ts
          check: CAS transitions for VBS states (claimed→scanning→scan_complete)
        - path: packages/vbs-service/src/infrastructure/batch-claim.repository.ts
          check: atomic claim write with expiry; query for claimable batches
      sgs_infrastructure:
        - path: packages/sgs-service/src/config/sgs.config.ts
          check: all 4 similarity thresholds validated; RABBITMQ_URL, MONGODB_URI present
        - path: packages/sgs-service/src/infrastructure/rabbitmq/rabbitmq.module.ts
          check: binds to vdf.pipeline.scan exchange
        - path: packages/sgs-service/src/infrastructure/s3-scan-result-loader.adapter.ts
          check: GetObject + JSON parse to NormalizedScanResult
        - path: packages/sgs-service/src/infrastructure/similarity-edge.repository.ts
          check: idempotent upsert with unique index
        - path: packages/sgs-service/src/infrastructure/similarity-group.repository.ts
          check: create or update group documents
        - path: packages/sgs-service/src/infrastructure/grouping-completion-writer.adapter.ts
          check: atomic write of grouping_complete to scan_states
    pass_criteria: >
      All infrastructure files present. TO-001 (VdfCliAdapter unit), TO-007 (VssConfig unit),
      TO-008 (VbsConfig/SgsConfig unit) pass.

  - checkpoint_id: CG-004
    name: Domain and Application Layers Complete
    wave: 4
    validates: wave_4
    blocking: true
    artifacts:
      vss:
        - path: packages/vss-service/src/staging/staging-idempotency.policy.ts
          check: pure function; no NestJS side effects
        - path: packages/vss-service/src/staging/staging.service.ts
          check: idempotency check before S3 + filesystem ops
      vbs:
        - path: packages/vbs-service/src/batch-claim/claim-ownership.policy.ts
          check: pure; no external I/O
        - path: packages/vbs-service/src/batch-claim/batch-claim.service.ts
          check: uses ClaimOwnershipPolicy + BatchClaimRepository
        - path: packages/vbs-service/src/scan-execution/scan-execution.service.ts
          check: invokes VdfCliAdapter then VdfOutputNormalizerAdapter
        - path: packages/vbs-service/src/result-publication/result-publication.service.ts
          check: S3 write before RabbitMQ publish (call order enforced by await chain)
        - path: packages/vbs-service/src/cleanup/cleanup.service.ts
          check: only processes cleanup_allowed state
      sgs:
        - path: packages/sgs-service/src/grouping/scan-result-schema.validator.ts
          check: rejects unsupported schema_version
        - path: packages/sgs-service/src/grouping/similarity-edge.factory.ts
          check: applies storeEdgeScore filter before emitting edges
        - path: packages/sgs-service/src/grouping/group-merge.policy.ts
          check: returns GroupAction from 4-level decision table
        - path: packages/sgs-service/src/grouping/scan-result-ingestion.service.ts
          check: idempotency guard prevents re-processing grouping_complete scans
    pass_criteria: >
      All 11 domain/application files present. TO-003 (StagingService idempotency unit),
      TO-004 (ScanResultIngestion idempotency unit), TO-006 (S3-before-RabbitMQ unit),
      TO-010 (StagingIdempotencyPolicy), TO-011 (ClaimOwnershipPolicy),
      TO-012 (GroupMergePolicy), TO-013 (ScanResultSchemaValidator),
      TO-014 (VdfOutputNormalizer) all pass.

  - checkpoint_id: CG-005
    name: Transport, Module Wiring, Entry Points Complete
    wave: 5
    validates: wave_5
    blocking: true
    artifacts:
      vss:
        - path: packages/vss-service/src/staging/new-video.consumer.ts
          check: acks on success; nacks with requeue=false on permanent error
        - path: packages/vss-service/src/staging/staging.module.ts
          check: all providers registered; MongooseModule.forFeature for ScanStateSchema
        - path: packages/vss-service/src/health/vss-health.module.ts
          check: "@nestjs/terminus HealthController; /health GET"
        - path: packages/vss-service/src/app.module.ts
          check: ConfigModule.forRoot({validate}); StagingModule; HealthModule
        - path: packages/vss-service/src/main.ts
          check: NestFactory.create(VssAppModule); listen on process.env.PORT
      vbs:
        - path: packages/vbs-service/src/batch-claim/batch-claim.scheduler.ts
          check: "@Cron with configurable BATCH_CLAIM_INTERVAL"
        - path: packages/vbs-service/src/batch-claim/batch-claim.module.ts
          check: all providers; ScheduleModule.forRoot()
        - path: packages/vbs-service/src/scan-execution/scan-execution.module.ts
          check: VdfCliAdapter + VdfOutputNormalizerAdapter providers
        - path: packages/vbs-service/src/result-publication/result-publication.module.ts
          check: S3 writer + RabbitMQ publisher providers
        - path: packages/vbs-service/src/cleanup/cleanup.module.ts
          check: CleanupService + ScanStateRepository
        - path: packages/vbs-service/src/health/vbs-health.module.ts
          check: terminus health
        - path: packages/vbs-service/src/app.module.ts
          check: all feature modules composed
        - path: packages/vbs-service/src/main.ts
          check: bootstrap
      sgs:
        - path: packages/sgs-service/src/grouping/scan-completed.consumer.ts
          check: amqplib message handler; delegates to ScanResultIngestionService
        - path: packages/sgs-service/src/grouping/grouping.module.ts
          check: all grouping providers
        - path: packages/sgs-service/src/health/sgs-health.module.ts
          check: terminus health
        - path: packages/sgs-service/src/app.module.ts
          check: GroupingModule + ConfigModule
        - path: packages/sgs-service/src/main.ts
          check: bootstrap
    pass_criteria: >
      All 18 transport/wiring/entry files present. tsc --noEmit passes on all 3 service
      packages. TO-005 (staging idempotency integration) and TO-015 (health endpoints
      integration) pass. TO-002 (VDF isolation arch test) passes.

gate_pass_criteria:
  description: All 5 checkpoint groups must pass before pre_implementation_gate
  blocking_checkpoint: CG-002
  final_checkpoint: CG-005

produced_outputs:
  - .ai/reports/checkpoint-groups.yaml
