report_id: "call-site-impact"
phase_id: call_site_impact_analysis
status: complete
summary: >
  Call site analysis for all 51 post-action candidates across the pipeline-service NestJS
  monorepo. The two split targets (ScanOrchestrator AC-010, ProcessScanHandler AC-023) each
  have a single provider-registration call site in their respective NestJS modules plus
  zero external constructor-injection consumers — their blast radius is therefore self-contained
  to their own module file. The extract target (ScanSchedulerTrigger AC-009) has no existing
  call sites because it does not yet exist as a file. The 25 modify_existing artifacts
  (repositories, adapters, consumers, handlers, validators, schema modules, NestJS modules,
  and the SharedInfraModule) have call sites exclusively within pipeline-service/src.
  Cross-package impact is limited to the shared/ barrel exports — four Mongoose schema files
  currently live in shared/src/db/ and are imported directly by scanning.module.ts and
  grouping.module.ts via the @gunea-pig/shared barrel; those import sites must be updated
  when the schema modules move into pipeline-service capability directories.
  The 12 create_new port interfaces (AC-005, AC-007, AC-013, AC-015, AC-018, AC-026, AC-028,
  AC-030, AC-032, AC-034, AC-036, AC-038) have no existing call sites — they are new artifacts.
  The 5 reuse_existing policy/domain-service artifacts (AC-004, AC-011, AC-012, AC-024, AC-025)
  have confirmed consumers within pipeline-service but require no structural change themselves.
  S3Adapter (shared/src/storage/s3.client.ts) and RabbitMQPublisher (shared/src/queue/rabbitmq.client.ts)
  are the concrete implementations currently exported from @gunea-pig/shared and imported
  as concrete class tokens in SharedInfraModule, ScanOrchestrator, ProcessScanHandler,
  ScanResultClient, FileStagingAdapter, and staging.module.ts — all these sites must be
  updated to consume IStoragePort and IEventPublisher respectively.

inputs_consumed:
  - source: conventions/.ai/reports/05-artifact-actions.yaml
    artifact: artifact_action_table
  - source: conventions/.ai/reports/post-action-artifact-candidates.yaml
    artifact: post_action_candidates

decisions:
  - id: DECISION-CSI-001
    decision: >
      ScanOrchestrator (AC-010) has exactly one provider registration call site in
      scanning.module.ts (line 24) and zero external constructor-injection consumers.
      Its split blast radius is therefore scoped to scanning.module.ts alone.
    rationale: >
      Grep across pipeline-service/src confirms ScanOrchestrator is imported only in
      scanning/application/scan.orchestrator.ts (declaration) and scanning/scanning.module.ts
      (provider registration). No other file imports or injects ScanOrchestrator.
      The @Interval tick is defined inside ScanOrchestrator itself — no external caller
      invokes runScanCycle() directly. The split produces ScanSchedulerTrigger (new file) and
      a trimmed ScanOrchestrator; scanning.module.ts must register both.
    evidence:
      - source: packages/pipeline-service/src/scanning/scanning.module.ts
        observation: "ScanOrchestrator listed in providers array at line 24; no other import of ScanOrchestrator found in codebase"

  - id: DECISION-CSI-002
    decision: >
      ProcessScanHandler (AC-023) has two call sites: provider registration in
      grouping.module.ts (line 32) and constructor injection in ScanCompletedConsumer
      (grouping/transport/scan-completed.consumer.ts line 14). Post-split the trimmed
      ProcessScanHandler retains the same class name and file path so both call sites
      survive without path changes — only the injected token types change inside the handler.
    rationale: >
      ScanCompletedConsumer injects ProcessScanHandler via its constructor and delegates to
      handler.handle(event). GroupingModule registers ProcessScanHandler as a provider.
      The split converts 6 concrete constructor params to port tokens but the class export
      name and file path remain identical, so these two call sites are not broken by the split
      action itself. However, GroupingModule must also register the new port implementations
      under their respective tokens after the split.
    evidence:
      - source: packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
        observation: "constructor(private readonly handler: ProcessScanHandler) at line 14"
      - source: packages/pipeline-service/src/grouping/grouping.module.ts
        observation: "ProcessScanHandler listed in providers array at line 32"

  - id: DECISION-CSI-003
    decision: >
      S3Adapter from @gunea-pig/shared is consumed as a concrete class token in four
      pipeline-service files: shared-infra.module.ts (provider registration and export),
      staging/staging.module.ts (inject into FileStagingAdapter factory), and implicitly
      by FileStagingAdapter and ScanResultClient constructors which inject S3Adapter directly.
      All four sites must migrate to IStoragePort after the S3StorageAdapter modify action.
    rationale: >
      shared-infra.module.ts provides S3Adapter under the S3Adapter token and exports it.
      staging.module.ts injects S3Adapter from SharedInfraModule into the FileStagingAdapter
      factory (line 21). FileStagingAdapter.constructor takes s3: S3Adapter (line 22).
      ScanResultClient.constructor takes s3: S3Adapter (line 9). All concrete-token usages
      must become IStoragePort token usages post-refactor.
    evidence:
      - source: packages/pipeline-service/src/shared-infra.module.ts
        observation: "provide: S3Adapter at line 18; exports: [..., S3Adapter] at line 36"
      - source: packages/pipeline-service/src/staging/staging.module.ts
        observation: "inject: [S3Adapter, PIPELINE_CONFIG] in FileStagingAdapter factory at line 21"
      - source: packages/pipeline-service/src/staging/infrastructure/file-staging.adapter.ts
        observation: "constructor(private readonly s3: S3Adapter, ...) at line 22"
      - source: packages/pipeline-service/src/grouping/infrastructure/scan-result.client.ts
        observation: "constructor(private readonly s3: S3Adapter) at line 9"

  - id: DECISION-CSI-004
    decision: >
      RabbitMQPublisher from @gunea-pig/shared is consumed as a concrete class token in three
      pipeline-service files: shared-infra.module.ts (provider and export), ScanOrchestrator
      constructor (line 34), and ProcessScanHandler constructor (line 41). All three sites
      must migrate to IEventPublisher token after the RabbitMQPublisher modify action.
    rationale: >
      SharedInfraModule provides RabbitMQPublisher under the RabbitMQPublisher token and
      exports it globally. ScanOrchestrator injects RabbitMQPublisher directly via its
      constructor (private readonly publisher: RabbitMQPublisher). ProcessScanHandler
      injects RabbitMQPublisher directly (private readonly publisher: RabbitMQPublisher).
      All three sites must use @Inject(IEventPublisher) post-refactor.
    evidence:
      - source: packages/pipeline-service/src/shared-infra.module.ts
        observation: "provide: RabbitMQPublisher at line 29; exports: [..., RabbitMQPublisher] at line 36"
      - source: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
        observation: "private readonly publisher: RabbitMQPublisher at line 34"
      - source: packages/pipeline-service/src/grouping/application/process-scan.handler.ts
        observation: "private readonly publisher: RabbitMQPublisher at line 41"

  - id: DECISION-CSI-005
    decision: >
      All four Mongoose schema classes (VideoDocument/VideoSchema, ScanBatchDocument/ScanBatchSchema,
      SimilarityEdgeDocument/SimilarityEdgeSchema, SimilarityGroupDocument/SimilarityGroupSchema)
      are currently imported from @gunea-pig/shared in three pipeline-service module files.
      When schema modules move into pipeline-service capability directories these three module
      files must update their import sources from @gunea-pig/shared to local paths.
    rationale: >
      scanning.module.ts imports VideoDocument, VideoSchema, ScanBatchDocument, ScanBatchSchema
      from @gunea-pig/shared (line 3). grouping.module.ts imports all four schema pairs from
      @gunea-pig/shared (lines 4-12). staging.module.ts imports VideoDocument, VideoSchema
      from @gunea-pig/shared (line 3). BatchClaimerService, VideoScanRepository, ScanPurgerService,
      and the grouping repositories also import schema types via @gunea-pig/shared but those
      are type-only imports that remain valid as long as shared continues to export them.
      The critical change is the MongooseModule.forFeature() registration lines in each module.
    evidence:
      - source: packages/pipeline-service/src/scanning/scanning.module.ts
        observation: "import { VideoDocument, VideoSchema, ScanBatchDocument, ScanBatchSchema } from '@gunea-pig/shared' at line 3"
      - source: packages/pipeline-service/src/grouping/grouping.module.ts
        observation: "import { VideoDocument, VideoSchema, ScanBatchDocument, ScanBatchSchema, SimilarityEdgeDocument, SimilarityEdgeSchema, SimilarityGroupDocument, SimilarityGroupSchema } from '@gunea-pig/shared' at lines 4-12"
      - source: packages/pipeline-service/src/staging/staging.module.ts
        observation: "import { VideoDocument, VideoSchema, S3Adapter } from '@gunea-pig/shared' at line 3"

  - id: DECISION-CSI-006
    decision: >
      ScanCompletedConsumer has an inline validateEvent() method (lines 59-74) that duplicates
      ScanResultValidator logic. It also imports ScanResultValidationError from scan-result.validator
      (line 4) for error-type matching in the catch block. Post-refactor the inline validateEvent()
      must be removed and the consumer must delegate to ScanResultValidator.
    rationale: >
      ScanCompletedConsumer.handle() calls this.validateEvent(rawPayload) but the method body
      is an inline re-implementation rather than a delegation to ScanResultValidator. The consumer
      does correctly import ScanResultValidationError from scan-result.validator for the catch
      block — that import should remain. The validateEvent() method itself must be removed.
    evidence:
      - source: packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
        observation: "private validateEvent() at lines 59-74 — inline duplicate of ScanResultValidator logic"
      - source: packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
        observation: "import { ScanResultValidationError } from '../infrastructure/scan-result.validator' at line 4"

  - id: DECISION-CSI-007
    decision: >
      BatchClaimerService currently holds both batch claiming logic AND expired-claim recovery
      (recoverExpiredClaims() private method). ScanOrchestrator injects BatchClaimerService
      directly (concrete class, no port). Post-refactor ScanOrchestrator must inject IBatchClaimerPort
      token. BatchClaimerService must implement IBatchClaimerPort. Recovery logic scope is noted
      as outside the 48-candidate set but the interface method set must be clarified.
    rationale: >
      scan.orchestrator.ts injects BatchClaimerService at constructor line 28 and calls
      claimNextBatch() and transitionBatchStatus() methods. scanning.module.ts registers
      BatchClaimerService as a provider. The IBatchClaimerPort interface must expose at minimum
      claimNextBatch() and transitionBatchStatus(). The recoverExpiredClaims() private method
      is internal to the service and need not appear on the port interface.
    evidence:
      - source: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
        observation: "private readonly batchClaimer: BatchClaimerService at line 28; calls claimNextBatch() and transitionBatchStatus()"
      - source: packages/pipeline-service/src/scanning/scanning.module.ts
        observation: "BatchClaimerService listed in providers at line 20"

  - id: DECISION-CSI-008
    decision: >
      VdfManifestNormalizer mixes file I/O (readRawOutput, calls fs.readFileSync) with
      normalization logic. ScanOrchestrator injects VdfManifestNormalizer directly (line 31)
      and calls normalize(). Post-refactor the readRawOutput concern moves to VdfRunnerAdapter;
      VdfManifestNormalizer becomes a pure normalizer. ScanOrchestrator call site changes from
      passing outputPath string to passing already-read raw content.
    rationale: >
      scan.orchestrator.ts injects VdfManifestNormalizer (line 31) and calls
      this.manifestNormalizer.normalize(scanId, vdfOutputPath, videoIdMap, ...). The outputPath
      argument currently triggers a file read inside VdfManifestNormalizer.normalize() via
      readRawOutput(). After the SRP fix, VdfRunnerAdapter.run() provides the raw content and
      VdfManifestNormalizer.normalize() accepts raw content (string or object) instead of a path.
      The ScanOrchestrator call site at line 101-107 must be updated accordingly.
    evidence:
      - source: packages/pipeline-service/src/scanning/infrastructure/vdf-manifest.normalizer.ts
        observation: "private readRawOutput(outputPath) calls fs.readFileSync at line 83"
      - source: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
        observation: "this.manifestNormalizer.normalize(scanId, vdfOutputPath, ...) at line 101"

  - id: DECISION-CSI-009
    decision: >
      ScanBatchRepository in grouping/infrastructure/scan-batch.repository.ts is a separate
      concrete class from BatchClaimerService in scanning/infrastructure/batch-claimer.service.ts.
      Both deal with ScanBatch persistence. ProcessScanHandler injects ScanBatchRepository
      (grouping copy) directly. The canonical consolidation target (AC-035/PAC-035) is
      pipeline-service/src/shared/infrastructure/scan-batch.repository.ts. The grouping copy
      must be removed after consolidation; ProcessScanHandler must inject IScanBatchRepository token.
    rationale: >
      grouping.module.ts registers ScanBatchRepository (grouping/infrastructure copy) as a provider
      and ProcessScanHandler injects it directly. After consolidation to shared/infrastructure,
      GroupingModule must import SharedInfraModule (or shared scan-batch registration) and
      ProcessScanHandler must use @Inject(IScanBatchRepository). The current grouping copy
      (ScanBatchRepository at grouping/infrastructure/scan-batch.repository.ts) is a separate
      pre-consolidation artifact.
    evidence:
      - source: packages/pipeline-service/src/grouping/application/process-scan.handler.ts
        observation: "private readonly scanBatchRepository: ScanBatchRepository at line 40; import from ../infrastructure/scan-batch.repository at line 17"
      - source: packages/pipeline-service/src/grouping/grouping.module.ts
        observation: "ScanBatchRepository listed in providers at line 37"

  - id: DECISION-CSI-010
    decision: >
      ProcessScanHandler instantiates UnionFindDomainService via new keyword (line 33)
      rather than NestJS DI. This is a confirmed OCP violation. Post-refactor UnionFindDomainService
      must be registered as a provider in GroupingModule and injected into ProcessScanHandler
      via constructor. UnionFindDomainService itself requires no code change (reuse_existing).
    rationale: >
      private readonly unionFind = new UnionFindDomainService() at class field line 33 bypasses
      NestJS DI container. GroupingModule does not currently register UnionFindDomainService
      as a provider. Post-split, GroupingModule must add UnionFindDomainService to providers
      and ProcessScanHandler must receive it via constructor injection.
    evidence:
      - source: packages/pipeline-service/src/grouping/application/process-scan.handler.ts
        observation: "private readonly unionFind = new UnionFindDomainService() at line 33 — bypasses DI container"
      - source: packages/pipeline-service/src/grouping/grouping.module.ts
        observation: "UnionFindDomainService absent from providers array"

