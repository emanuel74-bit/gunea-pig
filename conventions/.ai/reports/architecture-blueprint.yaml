# ═══════════════════════════════════════════════════════════════════════════════
# LAYER ASSIGNMENTS
# ═══════════════════════════════════════════════════════════════════════════════

layer_assignments:
  transport:
    units: [AU-VSS-001, AU-VBS-001, AU-SGS-001]
    notes: RabbitMQ consumer handlers only; delegate immediately to application service
  application:
    units: [AU-VSS-002, AU-VBS-002, AU-VBS-004, AU-VBS-007, AU-VBS-011, AU-SGS-002]
    notes: Orchestration services coordinate domain policies and infrastructure ports
  domain:
    units: [AU-VSS-003, AU-VBS-003, AU-SGS-003, AU-SGS-005, AU-SGS-006, AU-SGS-010]
    notes: Pure business rules — no NestJS decorators, no MongoDB/S3/RabbitMQ imports
  infrastructure:
    units: [AU-VSS-004, AU-VSS-005, AU-VSS-006, AU-VSS-007, AU-VBS-005, AU-VBS-006, AU-VBS-008-s3, AU-VBS-008-pub, AU-VBS-009, AU-VBS-010, AU-SGS-004, AU-SGS-007, AU-SGS-008, AU-SGS-009]
    notes: Adapters, repositories, clients — implement ports defined at application/domain boundary

# ═══════════════════════════════════════════════════════════════════════════════
# BOUNDARY REFS
# ═══════════════════════════════════════════════════════════════════════════════

boundary_refs:
  - boundary_id: PORT-MESSAGING
    boundary_type: message_queue_boundary
    description: Abstract messaging port for RabbitMQ consumers and producers
    required_by: [AU-VSS-001, AU-VBS-008-pub, AU-SGS-001]
    implemented_by: RabbitMqMessagingAdapter (infrastructure layer, each service)
    evidence_ref: .ai/reports/boundary-contract-classification.yaml#BND-VSS-001,BND-VBS-004,BND-SGS-001

  - boundary_id: PORT-STORAGE
    boundary_type: file_storage_boundary
    description: Abstract storage port for S3 read/write operations
    required_by: [AU-VSS-004, AU-VBS-008-s3, AU-SGS-004]
    implemented_by: S3StorageAdapter (infrastructure layer, each service)
    evidence_ref: .ai/reports/boundary-contract-classification.yaml#BND-VSS-003,BND-VBS-003,BND-SGS-002

  - boundary_id: PORT-VDF-SCANNER
    boundary_type: external_system_boundary
    description: Abstract port for VDF CLI invocation and output retrieval
    required_by: [AU-VBS-004]
    implemented_by: VdfCliAdapter (infrastructure layer, VBS only)
    evidence_ref: .ai/reports/risk-classification.yaml#RF-001

  - boundary_id: PORT-VDF-NORMALIZER
    boundary_type: external_system_boundary
    description: Abstract port for VDF output normalization (isolates format changes)
    required_by: [AU-VBS-004]
    implemented_by: VdfOutputNormalizerAdapter (infrastructure layer, VBS only)
    evidence_ref: .ai/reports/assumptions.yaml#A-005

  - boundary_id: REPO-SCAN-STATE
    boundary_type: persistence_boundary
    description: Repository abstraction for scan state machine document
    required_by: [AU-VSS-002, AU-VBS-002, AU-VBS-004, AU-VBS-007, AU-VBS-011, AU-SGS-002]
    implemented_by: ScanStateRepository (MongoDB + Mongoose, shared collection schema from shared-types)
    evidence_ref: .ai/reports/boundary-contract-classification.yaml#CNT-004

  - boundary_id: REPO-BATCH-CLAIM
    boundary_type: persistence_boundary
    description: Repository abstraction for VBS batch claim records
    required_by: [AU-VBS-002]
    implemented_by: BatchClaimRepository (MongoDB + Mongoose, VBS-owned)
    evidence_ref: .ai/reports/boundary-contract-classification.yaml#CNT-005

  - boundary_id: REPO-SIMILARITY-DATA
    boundary_type: persistence_boundary
    description: Repository abstractions for similarity edges, groups, video documents
    required_by: [AU-SGS-002]
    implemented_by: SimilarityEdgeRepository + SimilarityGroupRepository (MongoDB, SGS-owned)
    evidence_ref: .ai/reports/boundary-contract-classification.yaml#CNT-006

# ═══════════════════════════════════════════════════════════════════════════════
# DEPENDENCY CONSTRAINTS
# ═══════════════════════════════════════════════════════════════════════════════

dependency_constraints:
  required_edges:
    - source: transport_layer
      target: application_layer
      mechanism: constructor_injection via NestJS DI
    - source: application_layer
      target: domain_layer
      mechanism: direct call (pure functions / class methods)
    - source: application_layer
      target: declared_ports
      mechanism: constructor_injection (interface token, not concrete class)
    - source: infrastructure_layer
      target: declared_ports
      mechanism: implements port interface
    - source: infrastructure_layer
      target: external_systems
      mechanism: SDK clients (@aws-sdk/client-s3, amqplib, Mongoose)

  forbidden_edges:
    - source: domain_layer
      target: infrastructure_layer
      reason: domain must be framework-independent
    - source: domain_layer
      target: transport_layer
      reason: domain must be callable by any transport
    - source: application_layer
      target: raw_mongodb_models
      reason: application must depend on port interfaces, not Mongoose documents
    - source: transport_layer
      target: infrastructure_layer
      reason: consumers must not call repositories or clients directly
    - source: vss_service
      target: vbs_service
      reason: services must not import each other; communicate only via RabbitMQ/MongoDB
    - source: vbs_service
      target: sgs_service
      reason: same — no direct cross-service import
    - source: sgs_service
      target: vss_service
      reason: same — no direct cross-service import

  required_ports:
    - PORT-MESSAGING (all three services)
    - PORT-STORAGE (VSS, VBS, SGS)
    - PORT-VDF-SCANNER (VBS only)
    - PORT-VDF-NORMALIZER (VBS only)
    - REPO-SCAN-STATE (all three services — shared collection)
    - REPO-BATCH-CLAIM (VBS only)
    - REPO-SIMILARITY-DATA (SGS only)

# ═══════════════════════════════════════════════════════════════════════════════
# KEY ARCHITECTURAL DECISIONS
# ═══════════════════════════════════════════════════════════════════════════════

assumptions:
  - id: ARCH-ASMP-001
    statement: >
      Monorepo with npm workspaces: packages/vss-service, packages/vbs-service,
      packages/sgs-service, packages/shared-types. shared-types holds message DTOs,
      scan state enum, and threshold config interface only.
    evidence: .ai/reports/local-alignment.yaml#CC-001

  - id: ARCH-ASMP-002
    statement: >
      Cleanup authorization mechanism: SGS writes grouping_complete state to MongoDB
      scan_states collection. VBS cleanup worker polls for scans in grouping_complete
      state and transitions to cleanup_allowed, then performs cleanup. No separate
      RabbitMQ event needed — MongoDB state is the signal.
    evidence: .ai/reports/02-behavior-contract.yaml#SGS-F-010,VBS-P-002

  - id: ARCH-ASMP-003
    statement: >
      RabbitMQ exchange topology: Two direct exchanges (vdf.pipeline.ingest and
      vdf.pipeline.scan). Exchange vdf.pipeline.ingest routes new-video-ready-for-scan
      to VSS queue. Exchange vdf.pipeline.scan routes scan-completed to SGS queue.
      Dead-letter exchange: vdf.pipeline.dlx with per-queue DLQ binding.
    evidence: .ai/reports/02-behavior-contract.yaml#UA-002

  - id: ARCH-ASMP-004
    statement: >
      VDF CLI output format: Assumed to be a JSON file written to a configurable
      output directory with pairwise similarity records. Normalizer adapter parses
      this file. If format changes, only VdfOutputNormalizerAdapter changes.
    evidence: .ai/reports/assumptions.yaml#A-005

  - id: ARCH-ASMP-005
    statement: >
      MongoDB collection names: scan_states, scan_batch_claims, similarity_edges,
      similarity_groups. All write operations on scan_states use write concern majority.
      Indexes: scan_states on (video_id, status), (status, updated_at);
      scan_batch_claims on (status, claim_expiration_timestamp);
      similarity_edges on (scan_id, video_pair_key) unique;
      similarity_groups on (group_id) unique.
    evidence: .ai/reports/02-behavior-contract.yaml#UA-003

  - id: ARCH-ASMP-006
    statement: >
      S3 result key schema: scan-results/{scan_id}/normalized-result.json.
      Bucket name configurable via SCAN_RESULT_S3_BUCKET env var.
    evidence: .ai/reports/02-behavior-contract.yaml#UA-004

rejected_alternatives:
  - alternative: Use @nestjs/microservices RMQ transport instead of amqplib
    reason: >
      @nestjs/microservices RMQ transport abstracts manual ack/nack, preventing
      the precise ack discipline required for idempotency (VSS-I-001, SGS-I-001).
      amqplib via amqp-connection-manager provides explicit ack control.
    evidence: .ai/reports/local-alignment.yaml#CC-007

  - alternative: Use a separate RabbitMQ event for cleanup authorization instead of MongoDB state
    reason: >
      MongoDB state transition (grouping_complete) is already authoritative for
      scan lifecycle. Adding a separate RabbitMQ event creates dual-mechanism complexity
      and a potential ordering race between the state write and the event publish.
      MongoDB-based polling by VBS cleanup worker is simpler and auditable.
    evidence: .ai/reports/boundary-contract-classification.yaml#CNT-003

  - alternative: Polyrepo structure (three separate git repositories)
    reason: >
      Shared message DTOs, scan state enums, and threshold config interfaces would
      require package publication for cross-repo sharing. Monorepo with npm workspaces
      provides these benefits without the overhead.
    evidence: .ai/reports/local-alignment.yaml#CC-001

  - alternative: Place VDF output normalization inside the scan execution service
    reason: >
      Mixing integration_intent (child_process invocation) with transformation_intent
      (output normalization) violates single-intent rule. Separating them allows
      independent testing of normalization without invoking VDF CLI.
    evidence: conventions.architecture.yaml#ATOMIC-UNIT-003

