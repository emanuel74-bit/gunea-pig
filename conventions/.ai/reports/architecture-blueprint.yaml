artifact: architecture_blueprint
phase_id: architecture_decomposition
blueprint_id: "blueprint.large_refactor.solid"
source_behavior_ref: ".ai/reports/02-behavior-contract.yaml"

# ─────────────────────────────────────────────
# CAPABILITIES
# ─────────────────────────────────────────────
capabilities:
  - capability_id: CAP-001
    name: video_staging
    business_purpose: >
      Consume a NewVideoReadyEvent from RabbitMQ, perform an idempotency check,
      verify the asset exists in S3, download it to a local scan path, and mark
      the video as staged so the VDF scan pipeline can proceed.
    source_requirements:
      - AC-001
      - AC-002
    included_behaviors:
      - consume_new_video_ready_event
      - idempotency_guard
      - s3_asset_verification
      - file_download_to_scan_path
      - mark_video_staged
    excluded_behaviors:
      - vdf_scanning
      - similarity_grouping
      - event_publishing_beyond_state_update
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#staging-service"
      - "02-behavior-contract.yaml#staging_capability"

  - capability_id: CAP-002
    name: vdf_scanning
    business_purpose: >
      On a 30-second scheduler interval, claim a batch of staged videos, invoke
      the VDF CLI tool, normalize the manifest output, upload the result to S3,
      emit a ScanCompletedEvent, and run a cleanup pass to remove expired
      scan artifacts.
    source_requirements:
      - AC-003
      - AC-004
    included_behaviors:
      - scheduled_batch_claim
      - vdf_cli_invocation
      - manifest_normalization
      - s3_result_upload
      - emit_scan_completed_event
      - scan_cleanup_pass
    excluded_behaviors:
      - video_staging
      - similarity_grouping
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#vdf-scan-service"
      - "02-behavior-contract.yaml#scanning_capability"

  - capability_id: CAP-003
    name: video_similarity_grouping
    business_purpose: >
      Consume a ScanCompletedEvent, load the S3 scan result, apply similarity
      threshold filtering, persist similarity edges, run a union-find group
      merge, and emit a ScanPersistedEvent so downstream consumers can act on
      updated video groups.
    source_requirements:
      - AC-005
      - AC-006
    included_behaviors:
      - consume_scan_completed_event
      - load_s3_scan_result
      - threshold_filter_application
      - persist_similarity_edges
      - union_find_group_merge
      - emit_scan_persisted_event
    excluded_behaviors:
      - video_staging
      - vdf_scanning
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#grouping-service"
      - "02-behavior-contract.yaml#grouping_capability"

# ─────────────────────────────────────────────
# ATOMIC UNITS
# ─────────────────────────────────────────────
atomic_units:
  # ── CAP-001: Video Staging ─────────────────

  - unit_id: AU-001
    intent: entry_intent
    capability_ref: CAP-001
    name: VideoReadyConsumer
    description: >
      Receives NewVideoReadyEvent from RabbitMQ transport, validates message
      shape, maps to a StageVideoCommand, and delegates to the application
      handler. No business logic permitted.
    input_contract: NewVideoReadyEvent (RabbitMQ message)
    output_contract: StageVideoCommand dispatched to handler
    side_effects: []
    layer_candidate: transport
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#staging-service/transport/video-ready.consumer.ts"

  - unit_id: AU-002
    intent: transformation_intent
    capability_ref: CAP-001
    name: StagingMessageValidator
    description: >
      Validates and parses the raw RabbitMQ payload for the staging event.
      Pure transformation — no I/O, no side effects.
    input_contract: raw RabbitMQ message payload (unknown)
    output_contract: validated StagingMessageDto
    side_effects: []
    layer_candidate: transport
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#staging-service/validators/staging-message.validator.ts"

  - unit_id: AU-003
    intent: orchestration_intent
    capability_ref: CAP-001
    name: StageVideoHandler
    description: >
      Orchestrates the staging use-case workflow: resolve idempotency via
      IVideoRepository, verify asset via IFileStagingPort, download file,
      update state. Depends on declared ports only — never on concrete classes.
      Error classes must be extracted to a shared errors module.
    input_contract: StageVideoCommand
    output_contract: void (state mutation via ports)
    side_effects:
      - video record state updated to staged
      - file written to scan path
    layer_candidate: application
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#staging-service/application/stage-video.handler.ts"
      - "risk-classification.yaml#SRP_violation"
      - "risk-classification.yaml#DIP_violation"

  - unit_id: AU-004
    intent: decision_intent
    capability_ref: CAP-001
    name: VideoStagingPolicy
    description: >
      Pure domain policy: determines whether a video is eligible for staging
      based on current state. Zero framework imports.
    input_contract: IStagingEligibilityContext
    output_contract: boolean eligibility decision
    side_effects: []
    layer_candidate: decision
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#staging-service/domain/video-staging.policy.ts"

  - unit_id: AU-005
    intent: persistence_intent
    capability_ref: CAP-001
    name: IVideoRepository
    description: >
      Port interface for video record persistence. Declares find-by-id and
