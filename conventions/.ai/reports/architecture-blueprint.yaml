# ─────────────────────────────────────────────
# RF-002: CONSOLIDATION DECISION
# ─────────────────────────────────────────────
consolidation_decision:
  followup_ref: RF-002
  canonical_target: pipeline-service
  disposition_of_standalone_services: deprecated
  rationale: >
    Pipeline-service already composes all three business capabilities via NestJS
    submodules (staging/, scanning/, grouping/) and provides a SharedInfraModule
    with @Global providers for S3 and RabbitMQ. This is architecturally ahead of
    the standalone services, which remain as isolated single-capability services.
    The refactor will bring pipeline-service's submodules to SOLID compliance;
    the standalone services' source files are then superseded. Standalone services
    (staging-service, grouping-service, vdf-scan-service) remain in the monorepo
    during the implementation window to serve as reference implementations and
    are marked DEPRECATED in their package.json descriptions and module-level
    comments at the end of the implementation phase. Reversing the consolidation
    (splitting pipeline-service) is rejected per REJ-001 and REJ-002.
  standalone_service_handling:
    - service: staging-service
      status: deprecated_after_implementation
      reference_role: canonical source for staging business logic during refactor
    - service: grouping-service
      status: deprecated_after_implementation
      reference_role: canonical source for grouping business logic during refactor
    - service: vdf-scan-service
      status: deprecated_after_implementation
      reference_role: canonical source for scanning business logic during refactor

