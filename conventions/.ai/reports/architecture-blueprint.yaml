# ─────────────────────────────────────────────
# ASSUMPTIONS
# ─────────────────────────────────────────────
assumptions:
  - id: ASSUMP-001
    statement: >
      Mongoose with @Schema/@Prop decorators is the ORM in use. Drizzle
      references in the original behavior contract were inaccurate and are
      disregarded. All schema-related decisions use Mongoose semantics.

  - id: ASSUMP-002
    statement: >
      RabbitMQ topic names, routing keys, exchange names, and payload schemas
      in shared/types/queue.types.ts are LOCKED external contracts. No
      refactoring will alter these values.

  - id: ASSUMP-003
    statement: >
      Mongoose collection names (defined by schema decorators) are LOCKED
      external contracts. Schema files may move to new paths but the
      @Schema({ collection: '...' }) values must not change.

  - id: ASSUMP-004
    statement: >
      S3 key patterns used across all three capabilities are LOCKED. Only
      the code that constructs or interprets them may be refactored, not
      the key pattern strings themselves.

  - id: ASSUMP-005
    statement: >
      UnionFindDomainService is correctly implemented in grouping-service/domain.
      The only required change is replacing `new UnionFindDomainService()` with
      NestJS DI injection in ProcessScanHandler.

  - id: ASSUMP-006
    statement: >
      ScanResultValidator and staging-message.validator.ts are correctly
      implemented. Refactoring scope is limited to removing inline duplicates
      in consumers and ensuring these validators are the single canonical
      transformation units.

  - id: ASSUMP-007
    statement: >
      The VDF CLI binary interface (stdin/stdout/exit code contract) is an
      external system boundary. IVdfRunnerPort abstracts it; the port interface
      shape is determined by what VdfRunnerAdapter currently does.

# ─────────────────────────────────────────────
# REJECTED ALTERNATIVES
# ─────────────────────────────────────────────
rejected_alternatives:
  - id: REJ-001
    alternative: "Keep pipeline-service as a thin orchestrator that delegates to standalone services via network calls"
    rejection_reason: >
      Standalone services (staging, grouping, vdf-scan) are already being refactored
      in-place. Adding network indirection would introduce distributed system complexity,
      latency, and failure modes with no architectural benefit. Pipeline-service already
      composes all three subdomains at the module level — this is the correct pattern
      for a monorepo with a single deployable pipeline unit.

  - id: REJ-002
    alternative: "Reverse consolidation — split pipeline-service back into three packages and deprecate pipeline-service"
    rejection_reason: >
      Contradicts the user's stated goal of a single high-production-grade pipeline.
      Pipeline-service has the more advanced module composition (SharedInfraModule,
      @Global providers). Splitting would increase operational overhead (3 deployments,
      3 RabbitMQ consumer groups, 3 MongoDB connection pools) with no SOLID benefit.

  - id: REJ-003
    alternative: "Keep IVideoSimilarityRepository as a single combined read/write interface"
    rejection_reason: >
      ISP requires that consumers only depend on operations they use. If ProcessScanHandler
      only writes and a hypothetical query handler only reads, a combined interface
      forces both to depend on operations they do not use. Splitting or focusing the
      interface is architecturally required. Final split vs. focused-interface decision
      deferred to artifact_action_analysis phase per ARCH-AUTH-003.

  - id: REJ-004
    alternative: "Leave Mongoose schema definitions in the shared package"
    rejection_reason: >
      Shared package coupling to NestJS @Schema decorator violates SRP — shared should
      provide only pure TypeScript types and constants. Infrastructure-specific framework
      decorators belong in the infrastructure layer of the consuming service, not in a
      cross-cutting shared package. Collection name values (external contracts) are
      preserved by carrying them forward to the moved schema files.

  - id: REJ-005
    alternative: "Define a single IRepository<T> generic interface for all persistence"
    rejection_reason: >
      A generic repository interface would satisfy LSP on paper but violate ISP in
      practice — each aggregate has distinct query shapes (e.g., findEligibleBatches
      is not a generic find). Capability-specific interfaces result in clearer
      application-layer dependencies and more precise mock surfaces for testing.

  - id: REJ-006
    alternative: "Combine BatchClaimerService and ScanBatchRepository into a single unit"
    rejection_reason: >
      BatchClaimerService has claim orchestration logic (timing, locking) while
      ScanBatchRepository is pure persistence. Combining them would merge two distinct
      reasons to change (claim algorithm vs. persistence technology) — SRP violation.

