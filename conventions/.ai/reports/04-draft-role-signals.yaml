report_id: "04-draft-role-signals"
phase_id: draft_role_pass
status: complete
summary: >
  Draft role signal pass completed for all 48 artifact candidates across 3 capabilities
  (CAP-001 video_staging, CAP-002 vdf_scanning, CAP-003 video_similarity_grouping).
  12 port interfaces assigned role 'port' (architectural_boundary family).
  7 repository implementations assigned role 'repository' (persistence_data family).
  4 adapter/client implementations assigned role 'adapter' (integration_boundary family).
  4 RabbitMQ/transport consumers assigned role 'consumer' (integration_async family).
  2 application handlers assigned role 'handler' (application_execution family).
  1 application orchestrator assigned role 'orchestrator' (application_execution family).
  1 scheduler trigger assigned role 'scheduler' (integration_async family).
  4 domain policies assigned role 'policy' (decision family).
  1 pure domain service assigned role 'domain_service' (domain_model family).
  2 transport-layer validators assigned role 'validator' (domain_constraint family).
  1 pure transformation normalizer assigned role 'normalizer' (transformation family).
  4 Mongoose schema modules assigned role 'schema' (persistence_data family).
  5 NestJS module compositions assigned role 'module' (structural_framework family).
  2 artifacts flagged mixed_responsibility (AC-010 ScanOrchestrator, AC-023 ProcessScanHandler).
  2 artifacts flagged extraction_target (AC-010, AC-023).
  1 service implementation (AC-014 BatchClaimerService) assigned role 'service' — no more specific
  infrastructure execution role applies because it owns atomic MongoDB claim logic.
  1 purger implementation (AC-020 ScanPurgerService) assigned role 'service' — bounded deletion
  executor with no more specific infrastructure execution role available.

inputs_consumed:
  - source: conventions/.ai/reports/architecture-blueprint.yaml
    artifact: architecture_blueprint
  - source: conventions/.ai/reports/artifact-candidates.yaml
    artifact: artifact_candidates

decisions:
  - id: DECISION-DR-001
    decision: >
      All 12 new port interfaces (I-prefixed TypeScript interfaces) are assigned role 'port'
      under the architectural_boundary family, not 'interface' or 'contract'.
    rationale: >
      The role-taxonomy defines 'port' as the specific role for dependency-inversion boundary
      contracts consumed by application-layer handlers via DI tokens. The 'interface' role is
      a more generic TypeScript construct role; 'port' is specific to the hexagonal-architecture
      boundary pattern that all 12 artifacts represent. Rule ROLE-RESOLVE-BOUNDARY applies.
      All 12 port artifacts have candidate_role_pressure: port_interface in the blueprint.
    evidence:
      - source: architecture-blueprint.yaml
        field: boundary_refs[repository_abstraction].artifacts_affected
        value: AU-005, AU-013, AU-018, AU-028, AU-030, AU-032, AU-034
      - source: architecture-blueprint.yaml
        field: boundary_refs[external_system_port].artifacts_affected
        value: AU-036, AU-038, AU-015, AU-007, AU-026
      - source: conventions.role-taxonomy.yaml
        field: role_definitions.port
        value: "architectural_boundary family — DIP contract role"

  - id: DECISION-DR-002
    decision: >
      ScanOrchestrator (AC-010) is assigned draft role 'orchestrator' but flagged
      mixed_responsibility and extraction_target due to 7 co-located responsibilities.
    rationale: >
      Architecture blueprint AU-009 explicitly documents 7 responsibilities mixed in the
      current ScanOrchestrator monolith: orchestration, batch claiming, result loading, error
      handling, scheduling, scan dispatch, progress tracking. The taxonomy rule DRAFT-ROLE-MIXED-RESPONSIBILITY
      fires. After decomposition (extraction of ScanSchedulerTrigger to AC-009 is already planned),
      the post-extraction ScanOrchestrator will own only multi-step flow coordination — matching
      the 'orchestrator' role cleanly. The draft signal is 'orchestrator' because that is the
      primary surviving role after decomposition.
    evidence:
      - source: architecture-blueprint.yaml
        field: atomic_units[AU-009].evidence_refs
        value: "risk-classification.yaml#SRP_violation_7_responsibilities"
      - source: artifact-candidates.yaml
        field: candidates[AC-010].reason
        value: "Current monolith has 7 mixed responsibilities"

  - id: DECISION-DR-003
    decision: >
      ProcessScanHandler (AC-023) is assigned draft role 'handler' but flagged
      mixed_responsibility and extraction_target due to 6 co-located responsibilities.
    rationale: >
      Architecture blueprint AU-023 documents DIP violations and SRP violations: 6 concrete
      dependencies injected directly, UnionFindDomainService instantiated with 'new'. The handler
      also mixes message-consume concerns (now extracted to ScanCompletedConsumer AC-021).
      After refactor, the surviving artifact orchestrates the grouping use-case through port
      interfaces — that maps to 'handler' (handles ProcessScanCommand, delegates via ports).
      Rule DRAFT-ROLE-MIXED-RESPONSIBILITY fires due to residual multi-responsibility signals.
    evidence:
      - source: architecture-blueprint.yaml
        field: atomic_units[AU-023].evidence_refs
        value: "risk-classification.yaml#SRP_violation, risk-classification.yaml#DIP_violation_new_keyword"
      - source: artifact-candidates.yaml
        field: candidates[AC-023].reason
        value: "Current implementation has 6 concrete dependencies and instantiates UnionFindDomainService with new keyword"

  - id: DECISION-DR-004
    decision: >
      BatchClaimerService (AC-014) is assigned role 'service' rather than 'repository' or 'adapter'.
    rationale: >
      BatchClaimerService implements IBatchClaimerPort and performs atomic MongoDB batch-claim
      coordination (timing, locking, atomicity). This is infrastructure execution behavior, not
      pure persistence (repository would be purely CRUD-shaped). The taxonomy 'service' role is
      appropriate when the artifact coordinates dependencies and owns side effects at the
      infrastructure layer with no more specific role available. 'repository' is rejected because
      the artifact has claim-orchestration logic beyond persistence. 'adapter' is rejected because
      it wraps MongoDB, not an external system boundary that requires port abstraction.
    evidence:
      - source: artifact-candidates.yaml
        field: candidates[AC-014].candidate_role_pressure
        value: service
      - source: architecture-blueprint.yaml
        field: atomic_units[AU-014].candidate_role_pressure
        value: service
      - source: conventions.role-taxonomy.yaml
        field: specific_before_generic_rules
        value: "Never choose repository for domain behavior or application orchestration"

  - id: DECISION-DR-005
    decision: >
      ScanPurgerService (AC-020) is assigned role 'service' rather than 'adapter' or 'repository'.
    rationale: >
      ScanPurgerService executes deletion of expired scan artifacts (local filesystem + S3 via
      IStoragePort). It coordinates multi-step deletion but does not implement a port interface,
      nor is it a pure persistence repository. The 'service' role (infrastructure execution,
      coordinates dependencies, owns side effects) is the most precise available. 'adapter' is
      rejected because it does not wrap a single external system through a port contract.
    evidence:
      - source: artifact-candidates.yaml
        field: candidates[AC-020].candidate_role_pressure
        value: service
      - source: architecture-blueprint.yaml
        field: atomic_units[AU-020].evidence_refs
        value: "risk-classification.yaml#SRP_violation_cleanup_expiry"

  - id: DECISION-DR-006
    decision: >
      NestJS feature modules (AC-044, AC-045, AC-046, AC-047, AC-048) are all assigned role
      'module' under structural_framework family, not 'orchestrator' or 'service'.
    rationale: >
      These artifacts have orchestration_intent or integration_intent in the blueprint, but their
      primary responsibility is NestJS DI wiring — providers, imports, exports. The taxonomy
      'module' role covers framework wiring and dependency composition. The 'orchestrator' role
      is application execution, not module composition. Rule ROLE-RESOLVE-APPLICATION-EXECUTION
      does not fire because these artifacts contain no executable business logic — they are pure
      DI configuration. SharedInfraModule (AC-047) is assigned 'module' for the same reason
      even though it lives in the infrastructure layer.
    evidence:
      - source: artifact-candidates.yaml
        field: candidates[AC-044..AC-048].candidate_role_pressure
        value: nestjs_feature_module, nestjs_global_module, nestjs_root_module
      - source: conventions.role-taxonomy.yaml
        field: role_definitions.module.positive_signals
        value: "wires dependencies"

  - id: DECISION-DR-007
    decision: >
      StagingMessageValidator (AC-002) and ScanResultValidator (AC-022) are assigned role
      'validator' under domain_constraint family rather than 'normalizer' or 'mapper'.
    rationale: >
      Both artifacts have transformation_intent in the blueprint but their primary operation
      is payload validation and parsing — confirming the shape is correct before passing on.
      The taxonomy 'validator' role applies when the artifact's responsibility is validation
      only. The 'normalizer' role standardizes values (not validates). These validators
      confirm payload correctness and produce a validated DTO — validation is the primary signal.
    evidence:
      - source: artifact-candidates.yaml
        field: candidates[AC-002, AC-022].candidate_role_pressure
        value: validator
      - source: conventions.role-taxonomy.yaml
        field: role_definitions.validator.positive_signals
        value: "validation only"

  - id: DECISION-DR-008
    decision: >
      VdfManifestNormalizer (AC-017) is assigned role 'normalizer' under transformation family.
    rationale: >
      After SRP fix (file I/O extracted to VdfRunnerAdapter), VdfManifestNormalizer is a pure
      transformation: raw string in, NormalizedScanResult out, zero side effects. The taxonomy
      'normalizer' role matches exactly — standardizes/normalizes values. Rule ROLE-RESOLVE-TRANSFORMATION
      fires. 'mapper' is rejected because the artifact standardizes format (not shapes between layers).
    evidence:
      - source: artifact-candidates.yaml
        field: candidates[AC-017].candidate_role_pressure
        value: normalizer
      - source: architecture-blueprint.yaml
        field: atomic_units[AU-017].intent
        value: transformation_intent

  - id: DECISION-DR-009
    decision: >
      ScanSchedulerTrigger (AC-009) is assigned role 'scheduler' under integration_async family,
      not 'consumer' or 'handler'.
    rationale: >
      ScanSchedulerTrigger uses NestJS @Interval decorator — it is a time-driven entry point, not
      a message consumer. The taxonomy 'scheduler' role covers time-triggered execution entry points.
      'consumer' is rejected because there is no message queue involved. 'handler' is rejected
      because the artifact has no command/query envelope — it fires on tick.
    evidence:
      - source: artifact-candidates.yaml
        field: candidates[AC-009].candidate_role_pressure
        value: scheduler_entry
      - source: architecture-blueprint.yaml
        field: atomic_units[AU-010].description
        value: "@Interval(30000) NestJS scheduler entry point"

  - id: DECISION-DR-010
    decision: >
      ScanResultClient (AC-027) is assigned role 'adapter' under integration_boundary family,
      not 'client' or 'repository'.
    rationale: >
      ScanResultClient implements IScanResultLoader (a port interface) and wraps S3 access via
      IStoragePort. It is a concrete implementation of a port contract — the taxonomy 'adapter'
      role applies to concrete external-boundary implementations. 'client' would apply if it
      directly wrapped an external SDK without a port interface. 'repository' is rejected because
      the artifact does not own persistence — it loads and deserializes from S3 (integration boundary).
    evidence:
      - source: artifact-candidates.yaml
        field: candidates[AC-027].candidate_role_pressure
        value: adapter
      - source: architecture-blueprint.yaml
        field: atomic_units[AU-027].candidate_role_pressure
        value: adapter

