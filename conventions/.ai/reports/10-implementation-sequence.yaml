report_id: "10-implementation-sequence"
phase_id: implementation_sequence
status: complete
risk_level: high
summary: >
  17 ordered implementation steps across 10 groups. Risk level HIGH requires checkpoint
  after each group. Step 0 (characterization tests — 29 spec files, 37 test cases) is
  BLOCKING per BLOCK-RS-001 and SEQ-006: no production code may change until all 37
  characterization test cases pass against the pre-refactor codebase.
  Groups 1-10 cover: port interface creation (12 new), repository/adapter/schema
  modifications (implement port interfaces), SharedInfraModule wiring (critical SEQ-002
  dependency), split/extract operations, consumer/handler/service updates, pipeline
  submodule wiring, PipelineAppModule wiring, shared barrel update, and final validation.
  Total: 13 new files created, 38 modified/split/extracted files touched.
  Cross-package moves: 4 schema files (shared/src/db/ -> capability schemas/),
  2 adapter files (shared/src/ -> shared-infra/adapters/).

inputs_consumed:
  - source: conventions/.ai/reports/structure-plan.yaml
    artifact: structure_plan
    fields_used: [density_mode_selection, layer_placement_rules, path_normalization_decisions, folders_to_create, boundary_crossing_compliance]
  - source: conventions/.ai/reports/final-file-tree.yaml
    artifact: final_file_tree
    fields_used: [files_to_create, files_to_modify, rendered_file_tree, artifact_count_validation]
  - source: conventions/.ai/reports/09-test-plan.yaml
    artifact: test_plan
    fields_used: [test_obligations, zero_tests_confirmation, risk_signal, blocking_gaps, role_to_obligation_matrix]
  - source: conventions/.ai/reports/regression-test-plan.yaml
    artifact: regression_test_plan
    fields_used: [regression_obligations, pre_refactor_ground_truth, test_case_stubs]
  - source: conventions/.ai/reports/characterization-test-plan.yaml
    artifact: characterization_test_plan
    fields_used: [preserved_behavior_coverage, additional_characterization_tests, implementation_instructions, test_file_summary]

blocked_items:
  - id: BLOCK-IMPL-001
    source_constraint: BLOCK-RS-001
    description: >
      Characterization tests (37 test cases across 29 spec files) must exist AND pass
      against the pre-refactor codebase before any production code modification begins.
      This lifts BLOCK-RS-001 from 06-refactor-strategy.yaml.
    lifted_by: "Completion of STEP-000: all 29 characterization test files authored and all 37 test cases pass via npx jest --testPathPattern=characterization/"
    blocks: [STEP-001 through STEP-016, GROUP-1 through GROUP-10]

  - id: BLOCK-IMPL-002
    source_constraint: SEQ-001
    description: >
      Port interfaces (12 new .port.ts files) must exist before any repository, adapter,
      service, consumer, or handler that implements or injects them is modified.
    lifted_by: "Completion of STEP-001: all 12 port interface files created and tsc --noEmit passes"
    blocks: [STEP-002 through STEP-013]

  - id: BLOCK-IMPL-003
    source_constraint: SEQ-002
    description: >
      SharedInfraModule must be modified BEFORE pipeline submodules (staging, scanning,
      grouping) because it provides the global port tokens (IStoragePort, IEventPublisher,
      IScanBatchRepository) that submodule providers depend on at DI resolution time.
    lifted_by: "Completion of STEP-005: SharedInfraModule compiled and exports global port tokens"
    blocks: [STEP-006 through STEP-011]

