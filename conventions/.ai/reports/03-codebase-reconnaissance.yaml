report_id: "03-codebase-reconnaissance"
phase_id: codebase_reconnaissance
status: complete
summary: >
  Full inspection of a TypeScript NestJS monorepo comprising five packages: shared,
  staging-service, grouping-service, vdf-scan-service, and pipeline-service.
  The pipeline-service is a near-verbatim copy of the three standalone services
  composed into one NestJS application — the duplication is confirmed and is the
  largest structural violation in the codebase. No test files exist anywhere in
  the monorepo (ASSUMP-003 is false). No REST or gRPC API surface was found;
  only RabbitMQ consumers and a scheduled timer (ASSUMP-004 confirmed). Drizzle
  ORM is NOT used — the DB layer uses Mongoose/NestJS Mongoose with @Schema
  decorators (the behavior-contract references to Drizzle are inaccurate; the
  actual ORM is Mongoose). No pending migration files were found. The shared
  package exports Mongoose schema classes, which carry @nestjs/mongoose decorator
  dependencies — this is an SRP violation at the shared layer. Application-layer
  handlers depend directly on concrete infrastructure classes (no interfaces/ports),
  which is a DIP and ISP violation throughout all services. Domain policy classes
  are clean (no framework imports). The codebase has a layered folder structure
  (domain, application, infrastructure, transport) but lacks interface abstractions
  at layer boundaries.

inputs_consumed:
  - source: conventions/.ai/reports/02-behavior-contract.yaml
    artifact: behavior_contract
    fields_used:
      - scope
      - acceptance_criteria
      - preserved_behaviors
      - assumptions
  - source: conventions/.ai/reports/assumptions.yaml
    artifact: assumptions
    fields_used:
      - assumptions
      - non_blocking_assumptions

decisions:
  - id: DECISION-RECON-001
    decision: >
      Confirm that no test files exist anywhere in the monorepo. ASSUMP-003
      (existing test suite provides behavioral baseline) is FALSE.
    rationale: >
      A complete recursive search of all packages excluding node_modules produced
      zero *.spec.ts or *.test.ts files. No jest.config or vitest.config file was
      found. No package.json contains a test script beyond the root workspace
      passthrough that itself calls sub-package scripts — none of which define
      a test command.
    evidence:
      - source: bash_find
        field: find packages -name "*.spec.ts" -o -name "*.test.ts" (excluding node_modules)
        value: "No test files found"

  - id: DECISION-RECON-002
    decision: >
      Correct the ORM reference in the behavior contract: the codebase uses
      Mongoose with NestJS @Schema/@Prop decorators, NOT Drizzle ORM. The
      behavior contract's references to "Drizzle ORM" are inaccurate but the
      protection intent (preserve table/collection schemas) remains valid —
      apply it to Mongoose collection definitions instead.
    rationale: >
      All four database schema files (video.schema.ts, scan-batch.schema.ts,
      similarity-edge.schema.ts, similarity-group.schema.ts) use @nestjs/mongoose
      SchemaFactory.createForClass. No drizzle-orm imports exist anywhere in the
      source tree.
    evidence:
      - source: packages/shared/src/db/video.schema.ts
        field: imports
        value: "import { Prop, Schema, SchemaFactory } from '@nestjs/mongoose'"
      - source: packages/shared/src/db/scan-batch.schema.ts
        field: imports
        value: "import { Prop, Schema, SchemaFactory } from '@nestjs/mongoose'"

  - id: DECISION-RECON-003
    decision: >
      Confirm ASSUMP-004 (RabbitMQ is the only external contract; no REST/gRPC).
      No HTTP controllers, no gRPC transport, no Swagger decorators found.
    rationale: >
      All four package main.ts files initialize NestJS either as a microservice
      (Transport.RMQ) or a standalone application with scheduled timers
      (vdf-scan-service). No app.listen() on an HTTP port, no @Get/@Post
      decorators, no gRPC transport options found in any file.
    evidence:
      - source: packages/staging-service/src/main.ts
        field: transport
        value: "Transport.RMQ — NestFactory.createMicroservice"
      - source: packages/vdf-scan-service/src/main.ts
        field: transport
        value: "NestFactory.create standalone, no HTTP listen"
      - source: packages/pipeline-service/src/main.ts
        field: transport
        value: "connectMicroservice x2 (RMQ), startAllMicroservices"

  - id: DECISION-RECON-004
    decision: >
      Confirm pipeline-service is a near-verbatim code duplication of the three
      standalone services. The duplication is pervasive and is the primary
      consolidation target for the SOLID refactor.
    rationale: >
      Line-by-line comparison of key files confirms identical logic:
      staging-service StageVideoHandler == pipeline-service staging StageVideoHandler,
      grouping-service ProcessScanHandler == pipeline-service grouping ProcessScanHandler,
      vdf-scan-service ScanOrchestrator == pipeline-service scanning ScanOrchestrator.
      The only structural difference is pipeline-service adds a SharedInfraModule
      (@Global) that provides S3Adapter and RabbitMQPublisher to all submodules,
      and uses a unified PipelineConfig instead of per-service config interfaces.
    evidence:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: handle() method body
        value: "identical to packages/pipeline-service/src/staging/application/stage-video.handler.ts"
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: handle() and applyGroupMerge() method bodies
        value: "identical to packages/pipeline-service/src/grouping/application/process-scan.handler.ts"
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: processPendingBatch() method body
        value: "identical to packages/pipeline-service/src/scanning/application/scan.orchestrator.ts"

  - id: DECISION-RECON-005
    decision: >
      Classify the shared package's Mongoose schema classes as an SRP violation.
      The @Schema/@Prop decorators tie the shared data contract to the NestJS
      framework, which means domain consumers must have NestJS/Mongoose as a
      dependency to use them.
    rationale: >
      The shared package exports VideoDocument, ScanBatchDocument,
      SimilarityEdgeDocument, and SimilarityGroupDocument — all decorated with
      NestJS Mongoose decorators. Service packages use @InjectModel(VideoDocument.name)
      directly against these classes. This means the shared package exports are
      infrastructure-coupled, not plain data contracts.
    evidence:
      - source: packages/shared/src/db/video.schema.ts
        field: class declaration
        value: "@Schema({ collection: 'videos' }) export class VideoDocument"
      - source: packages/staging-service/src/infrastructure/video.repository.ts
        field: constructor injection
        value: "@InjectModel(VideoDocument.name) private readonly videoModel: Model<VideoDocument>"

  - id: DECISION-RECON-006
    decision: >
      Identify DIP violation in all application-layer handlers: they depend on
      concrete infrastructure classes directly, with no interface/port abstraction
      between layers.
    rationale: >
      StageVideoHandler directly imports and injects VideoRepository and
      FileStagingAdapter (both concrete classes). ProcessScanHandler directly
      injects ScanResultClient, SimilarityEdgeRepository, SimilarityGroupRepository,
      VideoSimilarityRepository, ScanBatchRepository, and RabbitMQPublisher — all
      concrete. ScanOrchestrator directly injects BatchClaimerService, VdfRunnerAdapter,
      ScanPurgerService, VdfManifestNormalizer, VideoScanRepository, S3Adapter, and
      RabbitMQPublisher — all concrete. No TypeScript interface exists between any
      application handler and its dependencies.
    evidence:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: constructor parameters
        value: "VideoRepository, FileStagingAdapter — both concrete classes, no interface"
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: constructor parameters
        value: "ScanResultClient, SimilarityEdgeRepository, SimilarityGroupRepository, VideoSimilarityRepository, ScanBatchRepository, RabbitMQPublisher — all concrete"

  - id: DECISION-RECON-007
    decision: >
      Identify ISP violation: repository classes expose wide, mixed-concern
      interfaces. No read/write/query separation exists.
    rationale: >
      VideoRepository in staging-service mixes staging-specific writes
      (upsertPendingStaging, markStaged, markStagingFailed) with a read query
      (isAlreadyStaged, findByVideoId). VideoSimilarityRepository mixes
      group membership reads (findGroupMemberships) with multiple write operations
      (reassignGroup, markInGroup, markHasMatches, markNoMatches). The application
      handlers import the full repository class when they only need a subset of
      operations.
    evidence:
      - source: packages/staging-service/src/infrastructure/video.repository.ts
        field: exported methods
        value: "findByVideoId, upsertPendingStaging, markStaged, markStagingFailed, isAlreadyStaged — mixed concerns in one class"
      - source: packages/grouping-service/src/infrastructure/video-similarity.repository.ts
        field: exported methods
        value: "findGroupMemberships, reassignGroup, markInGroup, markHasMatches, markNoMatches"

  - id: DECISION-RECON-008
    decision: >
      Identify SRP violation in ScanOrchestrator and ProcessScanHandler:
      both orchestrate multiple concerns that could be separated.
    rationale: >
      ScanOrchestrator handles batch claiming, VDF execution, manifest normalization,
      S3 upload, batch status transitions, and event publication — at least six
      distinct responsibilities. ProcessScanHandler handles scan result loading,
      threshold filtering, edge persistence, group merge orchestration, batch status
      update, and event publication — six responsibilities. Neither class has
      a single reason to change.
    evidence:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: processPendingBatch() method
        value: "claims batch, runs VDF, normalizes, uploads to S3, transitions status x3, publishes event"
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: handle() method
        value: "loads scan result, filters thresholds, persists edges, applies group merge, updates batch, publishes event"

  - id: DECISION-RECON-009
    decision: >
      Classify RabbitMQPublisher as a concrete infrastructure class with no port
      interface, directly injected into application-layer classes — a DIP violation.
    rationale: >
      RabbitMQPublisher is defined in packages/shared/src/queue/rabbitmq.client.ts
      as a concrete class with amqplib implementation details. It is injected
      directly into ProcessScanHandler and ScanOrchestrator via NestJS DI using
      the class itself as the token. No IEventPublisher or IQueuePublisher interface
      exists to abstract the publishing behavior.
    evidence:
      - source: packages/grouping-service/src/app.module.ts
        field: providers
        value: "{ provide: RabbitMQPublisher, useFactory: async () => new RabbitMQPublisher(...) }"
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: constructor
        value: "private readonly publisher: RabbitMQPublisher"

  - id: DECISION-RECON-010
    decision: >
      Classify S3Adapter as a concrete infrastructure class with no port interface,
      directly injected — a DIP violation.
    rationale: >
      S3Adapter is defined in packages/shared/src/storage/s3.client.ts as a
      concrete class wrapping AWS SDK v3. It is injected by class token into
      FileStagingAdapter, ScanResultClient, and ScanOrchestrator. No IS3Client
      or IStorageAdapter interface exists.
    evidence:
      - source: packages/staging-service/src/app.module.ts
        field: providers
        value: "{ provide: S3Adapter, useFactory: () => new S3Adapter(...) }"
      - source: packages/staging-service/src/infrastructure/file-staging.adapter.ts
        field: constructor
        value: "constructor(private readonly s3: S3Adapter, private readonly scanPath: string)"

  - id: DECISION-RECON-011
    decision: >
      Confirm no pending Mongoose migrations exist. ASSUMP-006 is validated.
    rationale: >
      No migration files, drizzle config, or pending-schema files found in the
      repository. The shared/src/db directory contains only four schema files
      and an index barrel. Collection schemas are stable.
    evidence:
      - source: bash_find
        field: find root for drizzle.config, *.migration* (excluding node_modules)
        value: "no files found"
      - source: packages/shared/src/db/
        field: directory listing
        value: "index.ts, video.schema.ts, scan-batch.schema.ts, similarity-edge.schema.ts, similarity-group.schema.ts"

  - id: DECISION-RECON-012
    decision: >
      Confirm that the shared package is a soft internal contract (ASSUMP-005
      validated). No evidence of the shared package being published to npm or
      consumed by external systems. All consumers are workspace-local via wildcard
      version "*".
    rationale: >
      All service package.json files reference "@gunea-pig/shared": "*" (workspace
      wildcard). The shared package.json is marked "private": true. No publishConfig
      or npm registry references found.
    evidence:
      - source: packages/staging-service/package.json
        field: dependencies
        value: '"@gunea-pig/shared": "*"'
      - source: packages/shared/package.json
        field: private
        value: '"private": true'

  - id: DECISION-RECON-013
    decision: >
      Identify inline event validation in ScanCompletedConsumer as a duplication
      and misplacement. The consumer inlines its own validation rather than
      delegating to a dedicated validator module, and the logic is duplicated
      identically in both grouping-service and pipeline-service grouping submodule.
    rationale: >
      grouping-service/src/consumers/scan-completed.consumer.ts contains a private
      validateEvent() method that duplicates the logic in the standalone
      scan-result.validator.ts in the validators folder. In pipeline-service,
      the same consumer pattern is repeated. No reuse occurs.
    evidence:
      - source: packages/grouping-service/src/consumers/scan-completed.consumer.ts
        field: validateEvent() private method
        value: "inline field validation for ScanCompletedEvent, not reusing scan-result.validator"
      - source: packages/grouping-service/src/validators/scan-result.validator.ts
        field: validateScanResult() function
        value: "separate validator for NormalizedScanResult; no shared boundary validator for the queue event itself"

evidence_refs:
  - ref: packages/shared/src/index.ts
