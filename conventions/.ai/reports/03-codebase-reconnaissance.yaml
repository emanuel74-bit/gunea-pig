  - ref: packages/grouping-service/src/application/process-scan.handler.ts
    section: handle() and applyGroupMerge()
    consumed_by: srp_and_dip_violation_analysis
  - ref: packages/vdf-scan-service/src/application/scan.orchestrator.ts
