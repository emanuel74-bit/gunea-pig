report_id: "dependency-classification"
phase_id: dependency_classification
status: complete
summary: >
  Full dependency classification of the five-package NestJS monorepo (shared,
  staging-service, grouping-service, vdf-scan-service, pipeline-service).
  Static imports from application handlers to concrete infrastructure classes
  are the dominant violation type — no port/interface abstractions exist at
  any layer boundary. The shared package carries @nestjs/mongoose framework
  decorators, coupling all consumers to NestJS at compile time. Three critical
  dependency direction risks are identified: (1) application-to-concrete-infrastructure
  (DIP violation in all services), (2) shared-package-to-NestJS-framework (SRP/DIP
  violation in the shared layer), and (3) vdf-scan-service application layer directly
  importing shared infrastructure classes (S3Adapter, RabbitMQPublisher) bypassing
  any port abstraction. No test dependencies exist (no test files in repo).
  No circular dependencies detected. No dynamic imports found.

inputs_consumed:
  - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
    artifact: codebase_reconnaissance
    fields_used:
      - call_sites
      - dependency_signals
      - boundary_signals
      - relevant_artifacts
      - decisions
  - source: conventions/.ai/reports/local-convention-candidates.yaml
    artifact: local_convention_candidates
    fields_used:
      - detected_conventions
      - decisions

decisions:
  - id: DECISION-DEP-001
    decision: >
      Classify all application-handler-to-infrastructure-class relationships as
      static_import + constructor_injection with direction application_to_concrete_infrastructure
      (forbidden — should be application_to_port). Each handler uses the concrete class
      both as a TypeScript import and as the NestJS injection token.
    rationale: >
      StageVideoHandler, ProcessScanHandler, and ScanOrchestrator all import concrete
      classes (VideoRepository, FileStagingAdapter, RabbitMQPublisher, S3Adapter, etc.)
      directly with no interface in between. The dependency_direction_rules require
      application_to_port; these are application_to_infrastructure — a DIP violation.
    evidence:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: constructor parameters
        value: "VideoRepository, FileStagingAdapter — concrete classes, no interface"
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: constructor parameters
        value: "ScanResultClient, SimilarityEdgeRepository, SimilarityGroupRepository, VideoSimilarityRepository, ScanBatchRepository, RabbitMQPublisher — all concrete"
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: constructor parameters
        value: "BatchClaimerService, VdfRunnerAdapter, ScanPurgerService, VdfManifestNormalizer, VideoScanRepository, S3Adapter, RabbitMQPublisher — all concrete"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-006
        value: "DIP violation in all application-layer handlers"

  - id: DECISION-DEP-002
    decision: >
      Classify packages/shared as a shared_kernel scope with a mixed purity problem:
      the types/ and queue.types.ts sub-paths are clean stable contracts; the db/ and
      queue/ and storage/ sub-paths carry NestJS/Mongoose/amqplib/AWS SDK concrete
      infrastructure classes that should not be in a shared kernel.
    rationale: >
      All four service packages import '@gunea-pig/shared' via the barrel. The barrel
      re-exports both pure domain types and concrete infrastructure classes in one
      surface. Consumers that only need domain types (interfaces, enums) are forced to
      compile against @nestjs/mongoose and mongoose as transitive dependencies of the
      shared package.
    evidence:
      - source: packages/shared/src/index.ts
        field: exports
        value: "export * from './types'; export * from './db'; export * from './queue'; export * from './storage'; export * from './logger'"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-005
        value: "shared package exports are infrastructure-coupled, not plain data contracts"

  - id: DECISION-DEP-003
    decision: >
      Classify the vdf-scan-service ScanOrchestrator's direct import of S3Adapter and
      RabbitMQPublisher from @gunea-pig/shared as a cross_module + application_to_infrastructure
      dependency. This is the most severe single violation because the application orchestrator
      bypasses both the infrastructure layer of its own module AND any port abstraction, and
      reaches directly to the shared infrastructure clients.
    rationale: >
      ScanOrchestrator resides in application/ but injects shared-package infrastructure
      classes as direct constructor parameters. This couples the orchestrator to two external
      infrastructure systems (S3 and AMQP) with no abstraction layer, and makes the
      orchestrator untestable without real S3 and RabbitMQ connections.
    evidence:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: constructor
        value: "injects S3Adapter and RabbitMQPublisher from @gunea-pig/shared directly"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: call_sites (vdf-scan-service/src/application/scan.orchestrator.ts)
        value: "orchestrator injects S3Adapter directly and calls putJson(); orchestrator injects RabbitMQPublisher directly and calls publish()"

  - id: DECISION-DEP-004
    decision: >
      Classify @nestjs/schedule @Interval(30_000) decorator on ScanOrchestrator as a
      runtime_registration dependency from application layer to the NestJS scheduler
      framework. This is a conditional violation: it places a framework decorator on
      an application-layer class, creating a framework coupling in the application layer.
    rationale: >
      The @Interval decorator from @nestjs/schedule is applied directly to the
      processPendingBatch() method in the application-layer ScanOrchestrator. Application
      layer should not own transport/scheduling registration; this belongs in a transport
      or infrastructure adapter.
    evidence:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: method decorator
        value: "@Interval(30_000) processPendingBatch()"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-003
        value: "vdf-scan-service uses NestFactory.create standalone, no HTTP listen — scheduler drives it"

  - id: DECISION-DEP-005
    decision: >
      Classify the pipeline-service SharedInfraModule @Global pattern as a
      runtime_hidden_dependency risk. All three submodules (StagingModule, ScanningModule,
      GroupingModule) implicitly depend on S3Adapter and RabbitMQPublisher through the
      global provider registry without explicit import declarations in their own module files.
    rationale: >
      NestJS @Global modules inject providers into every module's DI scope without
      explicit imports. This hides the true dependency graph from static analysis and
      from module-level isolation. If SharedInfraModule is removed or changed, submodule
      failures will not be caught at compile time.
    evidence:
      - source: packages/pipeline-service/src/shared-infra.module.ts
        field: decorator
        value: "@Global() — provides S3Adapter, RabbitMQPublisher, PIPELINE_CONFIG, SCAN_OUTPUT_DIR globally"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: boundary_signals (pipeline-service SharedInfraModule)
        value: "all submodules implicitly depend on this module's exported concretions"

  - id: DECISION-DEP-006
    decision: >
      No circular dependencies exist in the monorepo. Dependency flow is consistently
      unidirectional: services -> shared (at the package level); transport -> application
      -> infrastructure -> domain (within each service). Domain policy classes are clean
      with zero inbound infrastructure imports.
    rationale: >
      The reconnaissance call_sites graph shows no cycles. The shared package has no
      imports from service packages. Domain policy classes (video-staging.policy.ts,
      similarity-threshold.policy.ts, union-find.domain-service.ts, batch-claim.policy.ts,
      scan-cleanup.policy.ts) import only from shared types or nothing external.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: call_sites
        value: "No cycle detected in the 18 enumerated call relationships"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: boundary_signals
        value: "Domain policy classes are the only truly clean, isolated units"

static_dependencies:
  - dep_id: SD-001
    description: >
      staging-service application layer imports shared package infrastructure
    source_artifact: packages/staging-service/src/application/stage-video.handler.ts
    target_artifact: packages/staging-service/src/infrastructure/video.repository.ts
    dependency_type: static_import
    dependency_scope: same_module
    direction: application_to_infrastructure
    is_allowed: false
    risk_signals:
      - forbidden_direction
    notes: >
      Handler imports VideoRepository concrete class; no IVideoRepository port exists.
      Direction should be application_to_port per DEPENDENCY-INVERSION-001.
    evidence_refs:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: constructor parameters
        value: "VideoRepository — concrete class, no interface"

  - dep_id: SD-002
    description: >
      staging-service application layer imports concrete file staging adapter
    source_artifact: packages/staging-service/src/application/stage-video.handler.ts
    target_artifact: packages/staging-service/src/infrastructure/file-staging.adapter.ts
    dependency_type: static_import
    dependency_scope: same_module
    direction: application_to_infrastructure
    is_allowed: false
    risk_signals:
      - forbidden_direction
    notes: >
      Handler imports FileStagingAdapter concrete class; no IFileStagingPort exists.
    evidence_refs:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: constructor
        value: "FileStagingAdapter — concrete class"

  - dep_id: SD-003
    description: >
      grouping-service application handler imports six concrete infrastructure classes
    source_artifact: packages/grouping-service/src/application/process-scan.handler.ts
    target_artifact: packages/grouping-service/src/infrastructure/
    dependency_type: static_import
    dependency_scope: same_module
    direction: application_to_infrastructure
    is_allowed: false
    risk_signals:
      - forbidden_direction
    notes: >
      ProcessScanHandler imports ScanResultClient, SimilarityEdgeRepository,
      SimilarityGroupRepository, VideoSimilarityRepository, ScanBatchRepository —
      all concrete. No interfaces defined for any.
    evidence_refs:
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: constructor parameters
        value: "ScanResultClient, SimilarityEdgeRepository, SimilarityGroupRepository, VideoSimilarityRepository, ScanBatchRepository — all concrete"

  - dep_id: SD-004
    description: >
      grouping-service application handler imports RabbitMQPublisher from shared package
    source_artifact: packages/grouping-service/src/application/process-scan.handler.ts
    target_artifact: packages/shared/src/queue/rabbitmq.client.ts
    dependency_type: static_import
    dependency_scope: cross_module
    direction: application_to_infrastructure
    is_allowed: false
    risk_signals:
      - forbidden_direction
    notes: >
      Application handler injects RabbitMQPublisher directly from shared infra.
      No IQueuePublisher/IEventPublisher port exists.
    evidence_refs:
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: constructor
        value: "private readonly publisher: RabbitMQPublisher"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-009
        value: "RabbitMQPublisher — concrete class, no IQueuePublisher interface"

  - dep_id: SD-005
    description: >
      vdf-scan-service application orchestrator imports S3Adapter from shared package
    source_artifact: packages/vdf-scan-service/src/application/scan.orchestrator.ts
    target_artifact: packages/shared/src/storage/s3.client.ts
    dependency_type: static_import
    dependency_scope: cross_module
    direction: application_to_infrastructure
    is_allowed: false
    risk_signals:
      - forbidden_direction
    notes: >
      ScanOrchestrator directly uses S3Adapter (AWS SDK v3 wrapper) with no IS3Client
      or IStorageAdapter port. Application layer now has a hard dependency on AWS SDK.
    evidence_refs:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: constructor
        value: "injects S3Adapter directly"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-010
        value: "S3Adapter — no IS3Client interface; application-layer classes depend on concrete class"

  - dep_id: SD-006
    description: >
      vdf-scan-service application orchestrator imports RabbitMQPublisher from shared package
    source_artifact: packages/vdf-scan-service/src/application/scan.orchestrator.ts
    target_artifact: packages/shared/src/queue/rabbitmq.client.ts
    dependency_type: static_import
    dependency_scope: cross_module
    direction: application_to_infrastructure
    is_allowed: false
    risk_signals:
      - forbidden_direction
    notes: >
      Same DIP violation as SD-004. The orchestrator publishes ScanCompletedEvent
