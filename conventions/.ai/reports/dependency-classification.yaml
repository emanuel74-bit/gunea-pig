external_integrations:
  - integration_id: EI-001
    name: MongoDB via Mongoose
    integration_type: database
    client_library: "@nestjs/mongoose, mongoose"
    connection_surface: MongooseModule.forRoot(MONGODB_URI)
    collections:
      - videos
      - scan_batches
      - similarity_edges
      - similarity_groups
    consuming_packages:
      - staging-service
      - grouping-service
      - vdf-scan-service
      - pipeline-service
    schema_location: packages/shared/src/db/
    notes: >
      Mongoose schemas are shared via the shared package — coupling all consumers
      to @nestjs/mongoose at compile time. Schema classes are the DI injection
      tokens for repository model injection.
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-002
        value: "Mongoose with NestJS @Schema/@Prop decorators, NOT Drizzle ORM"

  - integration_id: EI-002
    name: RabbitMQ via amqplib
    integration_type: message_broker
    client_library: amqplib
    connection_surface: RabbitMQPublisher (custom wrapper in packages/shared/src/queue/rabbitmq.client.ts)
    exchanges:
      - video.exchange (type: direct)
      - scan.exchange (type: direct)
    queues:
      - video.ready
      - scan.completed
      - scan.persisted
    routing_keys:
      - video.ready-for-scan
      - scan.completed
      - scan.persisted
    consuming_packages:
      - staging-service (subscriber)
      - grouping-service (subscriber and publisher)
      - vdf-scan-service (publisher only)
      - pipeline-service (all roles)
    contract_location: packages/shared/src/types/queue.types.ts
    notes: >
      RabbitMQ topology (exchange assertions, queue bindings) is hardcoded inside
      RabbitMQPublisher.connect(). The QUEUE_EXCHANGES, ROUTING_KEYS, and QUEUE_NAMES
      constants in shared/types/queue.types.ts form the immutable external contract.
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-003
        value: "RabbitMQ is the only external contract; no REST/gRPC"

  - integration_id: EI-003
    name: AWS S3 / S3-compatible storage (MinIO)
    integration_type: object_storage
    client_library: "@aws-sdk/client-s3 (AWS SDK v3)"
    connection_surface: S3Adapter (custom wrapper in packages/shared/src/storage/s3.client.ts)
    operations:
      - headObject (object existence check)
      - downloadToFile (staged file download)
      - putJson (scan result upload)
      - getJson (scan result download)
      - uploadFile (file upload)
    consuming_packages:
      - staging-service (via FileStagingAdapter -> S3Adapter)
      - grouping-service (via ScanResultClient -> S3Adapter)
      - vdf-scan-service (ScanOrchestrator directly -> S3Adapter)
      - pipeline-service (all three submodules via SharedInfraModule)
    notes: >
      S3Adapter is a concrete class with no IS3Client interface. It is injected
      directly into application-layer and infrastructure-layer classes. The integration
      is compatible with MinIO (S3-compatible endpoint) via endpoint override config.
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-010
        value: "S3Adapter — no IS3Client or IStorageAdapter interface"

  - integration_id: EI-004
    name: VDF CLI (external binary)
    integration_type: process_execution
    client_library: Node.js child_process
    connection_surface: VdfRunnerAdapter (packages/vdf-scan-service/src/infrastructure/vdf-runner.adapter.ts)
    operations:
      - spawn VDF CLI process with video batch paths
      - capture stdout/stderr
      - validate JSON output
    consuming_packages:
      - vdf-scan-service
      - pipeline-service (scanning submodule)
    notes: >
      The VDF CLI is the core scanning binary. VdfRunnerAdapter wraps the process
      invocation with timeout, output capture, and validation. No IVdfRunnerPort
      interface exists.
    evidence_refs:
