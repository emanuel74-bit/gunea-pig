        field: relevant_artifacts (vdf-runner.adapter.ts)
        value: "Wraps the VDF CLI process invocation with timeout, stdout/stderr capture, and output validation"

dependency_direction_risks:
  - risk_id: DDR-001
    severity: critical
    title: Application layer directly imports and injects concrete infrastructure classes across all services
    description: >
      All three application-layer handlers (StageVideoHandler, ProcessScanHandler,
      ScanOrchestrator) depend on concrete infrastructure class tokens with no
      interface/port abstraction at any layer boundary. This violates DIP
      (DEPENDENCY-INVERSION-001) and makes application logic untestable without
      real infrastructure. The fix requires introducing port interfaces in each
      service and binding concrete implementations at module composition time.
    affected_artifacts:
      - packages/staging-service/src/application/stage-video.handler.ts
      - packages/grouping-service/src/application/process-scan.handler.ts
      - packages/vdf-scan-service/src/application/scan.orchestrator.ts
      - packages/pipeline-service/src/*/application/
    violation_count: 14
    required_port_interfaces:
      - IVideoRepository (staging-service)
      - IFileStagingPort (staging-service)
      - IScanResultLoader (grouping-service)
      - ISimilarityEdgeRepository (grouping-service)
      - ISimilarityGroupRepository (grouping-service)
      - IVideoSimilarityRepository (grouping-service)
      - IScanBatchRepository (grouping-service)
      - IEventPublisher (grouping-service, vdf-scan-service)
      - IStoragePort (vdf-scan-service, grouping-service)
      - IBatchClaimerPort (vdf-scan-service)
      - IVdfRunnerPort (vdf-scan-service)
      - IVideoScanRepository (vdf-scan-service)
    direction_rule_violated: DEPENDENCY-INVERSION-001, IMPORT-LAYER-002
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-006
        value: "DIP violation in all application-layer handlers — no TypeScript interface between any application handler and its dependencies"

  - risk_id: DDR-002
    severity: high
    title: Shared package exports concrete infrastructure classes, polluting the shared kernel with framework coupling
    description: >
      The @gunea-pig/shared package is consumed by all four service packages but
      its barrel (index.ts) exports both clean domain types and concrete infrastructure
      classes (Mongoose schema classes decorated with @nestjs/mongoose, RabbitMQPublisher
      wrapping amqplib, S3Adapter wrapping AWS SDK v3). This means any consumer that
      imports from @gunea-pig/shared must carry @nestjs/mongoose, amqplib, and @aws-sdk/client-s3
      as transitive dependencies regardless of which exports they use. This violates
      the shared kernel purity rule (IMPORT-MODULE-003: shared must not be feature-specific
      or framework-coupled) and makes the shared kernel unstable for domain-only consumers.
    affected_artifacts:
      - packages/shared/src/index.ts
      - packages/shared/src/db/*.schema.ts
      - packages/shared/src/queue/rabbitmq.client.ts
      - packages/shared/src/storage/s3.client.ts
    direction_rule_violated: IMPORT-MODULE-003 (shared_imports_feature_specific pattern — infra classes in shared kernel)
    required_followup: >
      Split shared package into two sub-surfaces: (a) pure domain/types barrel
      (types/, enums, plain interfaces, queue.types.ts constants) and (b) shared
      infrastructure barrel (db schemas, clients). Services that need only domain types
      should import from the domain-only surface to avoid @nestjs/mongoose transitive dep.
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-005
        value: "shared package exports are infrastructure-coupled, not plain data contracts"
      - source: packages/shared/src/index.ts
        field: exports
        value: "export * from './db'; export * from './queue'; export * from './storage'"

  - risk_id: DDR-003
    severity: high
    title: vdf-scan-service application orchestrator directly imports shared infrastructure classes, bypassing own infrastructure layer
    description: >
      ScanOrchestrator (an application-layer class) imports and injects S3Adapter
      and RabbitMQPublisher directly from @gunea-pig/shared, bypassing vdf-scan-service's
      own infrastructure layer entirely for these two dependencies. This means the
      application orchestrator is simultaneously: (a) coupling to concrete infrastructure
      with no port abstraction (DIP violation), and (b) reaching across the module
      boundary into the shared package's infrastructure tier directly. The combined
      effect creates an application class with seven direct infrastructure dependencies,
      making it the most tightly coupled class in the entire codebase and completely
      untestable without real S3 and RabbitMQ connections.
    affected_artifacts:
      - packages/vdf-scan-service/src/application/scan.orchestrator.ts
      - packages/shared/src/storage/s3.client.ts
      - packages/shared/src/queue/rabbitmq.client.ts
    direction_rule_violated: DEPENDENCY-INVERSION-001, IMPORT-LAYER-002
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: call_sites
        value: "orchestrator injects S3Adapter directly; orchestrator injects RabbitMQPublisher directly"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-008
        value: "ScanOrchestrator handles at least six distinct responsibilities"

  - risk_id: DDR-004
    severity: medium
    title: NestJS @Interval decorator on application-layer class creates application_to_transport direction violation
    description: >
      The @Interval(30_000) decorator from @nestjs/schedule is applied to
      ScanOrchestrator.processPendingBatch(), an application-layer method.
      This couples the application layer to the NestJS scheduling transport,
      which violates IMPORT-LAYER-002 (application may not depend on transport).
      The scheduling trigger should be owned by a transport adapter that calls
      the application-layer method, preserving layer independence.
    affected_artifacts:
      - packages/vdf-scan-service/src/application/scan.orchestrator.ts
    direction_rule_violated: IMPORT-LAYER-002 (application_to_transport)
    evidence_refs:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: method decorator
        value: "@Interval(30_000) processPendingBatch()"

  - risk_id: DDR-005
    severity: medium
    title: pipeline-service @Global SharedInfraModule creates hidden runtime coupling
    description: >
      The @Global NestJS module pattern makes provider resolution invisible to
      static analysis and module-boundary inspection. The three submodules
      (StagingModule, ScanningModule, GroupingModule) have hidden runtime dependencies
      on S3Adapter and RabbitMQPublisher that are not declared in their own imports
      arrays. This is a runtime_hidden_dependency risk that will manifest as difficult-to-
      trace injection failures if SharedInfraModule is refactored without updating
      all implicit consumers.
    affected_artifacts:
      - packages/pipeline-service/src/shared-infra.module.ts
      - packages/pipeline-service/src/staging/staging.module.ts
      - packages/pipeline-service/src/scanning/scanning.module.ts
      - packages/pipeline-service/src/grouping/grouping.module.ts
    risk_signals:
      - runtime_hidden_dependency
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: boundary_signals (pipeline-service)
        value: "@Global pattern means all submodules implicitly depend on this module's exported concretions"

