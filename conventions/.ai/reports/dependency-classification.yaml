    dependency_scope: external_system
    direction: transport_to_application
    is_allowed: true
    risk_signals:
      - external_contract_drift
    notes: >
      Consumer is bound to RMQ via NestJS @EventPattern. The exchange/queue/routing-key
      constants are defined in packages/shared/src/types/queue.types.ts (stable contract).
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-003
        value: "staging-service: Transport.RMQ — NestFactory.createMicroservice"

  - dep_id: RD-002
