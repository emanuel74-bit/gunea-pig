report_id: dependency-classification
phase_id: dependency_classification
schema_version: "1.0"
status: complete

summary: >
  Classified all significant dependencies for VSS, VBS, and SGS. Greenfield:
  no existing dependency violations to remediate. All dependencies are new.
  Primary dependency concerns: VDF CLI external_system dependency requires
  adapter isolation (forbidden_direction risk if domain imports child_process
  directly); MongoDB shared persistence schema crosses all three services
  (shared_kernel scope); RabbitMQ message subscriptions and event publications
  require idempotency discipline. No forbidden direction violations identified
  in planned architecture. All external_system and external_package dependencies
  are routed through infrastructure adapters behind application-level ports.

inputs_consumed:
  - source: .ai/reports/03-codebase-reconnaissance.yaml
    type: codebase_reconnaissance
  - source: .ai/reports/local-convention-candidates.yaml
    type: local_convention_candidates

dependency_records:

  # ── RabbitMQ Consumer Dependencies ──────────────────────────────────────────

  - dependency_id: DEP-001
    dependency_type: message_subscription
    dependency_scope: external_system
    source_artifact: VSS RabbitMQ consumer module
    target_artifact: RabbitMQ broker / new-video-ready-for-scan queue
    direction: transport_to_application
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VSS-F-001
      - .ai/reports/local-alignment.yaml#CC-007
    is_allowed: true
    risk_signals:
      - non_idempotent_consumer (risk if ack issued before state transition confirms idempotency)
    required_followups:
      - Idempotency check (MongoDB state read) must occur BEFORE ack in VSS consumer
      - Dead-letter queue must be configured for failed/unparseable messages

  - dependency_id: DEP-002
    dependency_type: message_subscription
    dependency_scope: external_system
    source_artifact: SGS RabbitMQ consumer module
    target_artifact: RabbitMQ broker / scan-completed queue
    direction: transport_to_application
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#SGS-F-001,SGS-I-001
      - .ai/reports/local-alignment.yaml#CC-007
    is_allowed: true
    risk_signals:
      - non_idempotent_consumer (duplicate delivery must not create duplicate edges)
    required_followups:
      - Idempotency key strategy for SGS (scan_id-based dedup) must be locked in architecture
      - Dead-letter queue required for schema-invalid or permanently failed messages

  # ── RabbitMQ Publisher Dependencies ─────────────────────────────────────────

  - dependency_id: DEP-003
    dependency_type: event_publication
    dependency_scope: external_system
    source_artifact: VBS scan result publisher module
    target_artifact: RabbitMQ broker / scan-completed exchange
    direction: infrastructure_to_external_system
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VBS-F-005,VBS-H-001
    is_allowed: true
    risk_signals:
      - lost_delivery_assumption (publish after S3 write; no two-phase commit)
    required_followups:
      - VBS must write to S3 before publish; ordering must be enforced in implementation sequence

  - dependency_id: DEP-004
    dependency_type: event_publication
    dependency_scope: external_system
    source_artifact: SGS cleanup confirmation module
    target_artifact: RabbitMQ broker (or MongoDB state) / scan-persisted-grouping-completed
    direction: infrastructure_to_external_system
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#SGS-F-010
    is_allowed: true
    risk_signals: []
    notes: Mechanism (RabbitMQ vs MongoDB state) deferred to architecture_decomposition

  # ── amqplib / amqp-connection-manager Package Dependencies ──────────────────

  - dependency_id: DEP-005
    dependency_type: provider_binding
    dependency_scope: external_package
    source_artifact: All three services — RabbitMQ connection module
    target_artifact: amqplib + amqp-connection-manager npm packages
    direction: infrastructure_to_port
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-007
    is_allowed: true
    risk_signals:
      - external_contract_drift (amqplib API stability)
    required_followups:
      - Wrap amqplib in a thin adapter so consumers/producers depend on internal port, not raw amqplib

  # ── MongoDB (@nestjs/mongoose) Dependencies ──────────────────────────────────

  - dependency_id: DEP-006
    dependency_type: provider_binding
    dependency_scope: external_package
    source_artifact: All three services — Mongoose module registration
    target_artifact: "@nestjs/mongoose + mongoose npm packages"
    direction: infrastructure_to_port
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-008
    is_allowed: true
    risk_signals:
      - provider_binding_mismatch (Mongoose schema used as domain type — must prevent)
    required_followups:
      - Mongoose documents must not leak into application/domain layers; map to domain DTOs at repository boundary

  - dependency_id: DEP-007
    dependency_type: static_import
    dependency_scope: shared_kernel
    source_artifact: "VSS, VBS, SGS — scan state transition code"
    target_artifact: MongoDB scan_states collection schema (shared)
    direction: infrastructure_to_port
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#shared_requirements.scan_state_machine
      - .ai/reports/boundary-contract-classification.yaml#CNT-004
    is_allowed: true
    risk_signals:
      - shared_kernel_instability (schema change requires coordinated deploy of all 3 services)
    required_followups:
      - Shared scan state enum and schema must be defined in packages/shared-types (monorepo shared package)
      - Each service imports state constants from shared-types, not from each other

  # ── S3 Client Dependencies ───────────────────────────────────────────────────

  - dependency_id: DEP-008
    dependency_type: provider_binding
    dependency_scope: external_package
    source_artifact: VSS — S3 video downloader module
    target_artifact: "@aws-sdk/client-s3 npm package"
    direction: infrastructure_to_external_system
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-009
      - .ai/reports/02-behavior-contract.yaml#VSS-F-003,VSS-F-004
    is_allowed: true
    risk_signals:
      - external_contract_drift (AWS SDK v3 API changes)
    required_followups:
      - S3 client must be wrapped in an adapter; domain/application must not import @aws-sdk/client-s3 directly

  - dependency_id: DEP-009
    dependency_type: provider_binding
    dependency_scope: external_package
    source_artifact: VBS — S3 scan result writer module
    target_artifact: "@aws-sdk/client-s3 npm package"
    direction: infrastructure_to_external_system
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-009
      - .ai/reports/02-behavior-contract.yaml#VBS-F-004,VBS-H-001
    is_allowed: true
    risk_signals:
      - external_contract_drift
    notes: Same S3 adapter pattern as DEP-008

  - dependency_id: DEP-010
    dependency_type: provider_binding
    dependency_scope: external_package
    source_artifact: SGS — S3 scan result reader module
    target_artifact: "@aws-sdk/client-s3 npm package"
    direction: infrastructure_to_external_system
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-009
      - .ai/reports/02-behavior-contract.yaml#SGS-F-002
    is_allowed: true
    risk_signals:
      - external_contract_drift
    notes: Same S3 adapter pattern as DEP-008

  # ── VDF CLI Dependency ───────────────────────────────────────────────────────

  - dependency_id: DEP-011
    dependency_type: runtime_registration
    dependency_scope: external_system
    source_artifact: VBS — VDF runner/adapter module
    target_artifact: VDF CLI binary (child_process.spawn)
    direction: infrastructure_to_external_system
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VBS-F-002,VBS-F-003
      - .ai/reports/assumptions.yaml#A-001,A-005
      - .ai/reports/risk-classification.yaml#RS-001
    is_allowed: true
    risk_signals:
      - external_contract_drift (VDF output format unknown — highest risk dependency)
      - runtime_hidden_dependency (VDF binary must be present on host/container)
    required_followups:
      - VDF invocation MUST be isolated behind VdfScannerPort interface
      - VDF output parser MUST be a dedicated adapter implementing ScanResultNormalizer port
      - Application/domain must never import child_process or VDF binary path directly
      - Unit tests must mock VdfScannerPort; VDF CLI integration tests are separate

  # ── Configuration Dependencies ───────────────────────────────────────────────

  - dependency_id: DEP-012
    dependency_type: configuration_reference
    dependency_scope: external_package
    source_artifact: All three services — config module bootstrap
    target_artifact: "@nestjs/config + class-validator (config DTO validation)"
    direction: infrastructure_to_port
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-006
      - .ai/reports/02-behavior-contract.yaml#shared_requirements.similarity_threshold_policy
    is_allowed: true
    risk_signals:
      - configuration_risk (missing required env var crashes service at startup — intended behavior)
    required_followups:
      - Config DTO must validate all required env vars at startup with class-validator
      - All four similarity thresholds must be typed as numbers with range validation

  # ── Logging Dependency ───────────────────────────────────────────────────────

  - dependency_id: DEP-013
    dependency_type: provider_binding
    dependency_scope: external_package
    source_artifact: All three services — logger module
    target_artifact: "nestjs-pino (@nestjs/pino) npm package"
    direction: infrastructure_to_port
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-010
    is_allowed: true
    risk_signals: []
    notes: Logger is a cross-cutting infrastructure concern; must not be imported by domain layer directly

  # ── Health Check Dependency ──────────────────────────────────────────────────

  - dependency_id: DEP-014
    dependency_type: provider_binding
    dependency_scope: external_package
    source_artifact: All three services — health module
    target_artifact: "@nestjs/terminus npm package"
    direction: infrastructure_to_port
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-011
    is_allowed: true
    risk_signals: []

  # ── Shared Types Cross-Service Dependency ────────────────────────────────────

  - dependency_id: DEP-015
    dependency_type: static_import
    dependency_scope: shared_kernel
    source_artifact: "VSS, VBS, SGS — event DTO modules"
    target_artifact: packages/shared-types (RabbitMQ message schema DTOs, scan state enums)
    direction: application_to_domain
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-001
      - .ai/reports/boundary-contract-classification.yaml#CNT-001,CNT-002,CNT-003,CNT-004
    is_allowed: true
    risk_signals:
      - shared_kernel_instability (shared-types changes affect all 3 services)
    required_followups:
      - shared-types package must contain only stable contracts (event DTOs, state enums, threshold config interface)
      - No service-internal implementation details may be placed in shared-types

forbidden_direction_violations: []

triggers_emitted: []

