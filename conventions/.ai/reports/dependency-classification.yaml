    evidence_refs:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: constructor
        value: "injects RabbitMQPublisher directly"

  - dep_id: SD-007
    description: >
      vdf-scan-service ScanOrchestrator imports five concrete infrastructure services
    source_artifact: packages/vdf-scan-service/src/application/scan.orchestrator.ts
    target_artifact: packages/vdf-scan-service/src/infrastructure/
    dependency_type: static_import
    dependency_scope: same_module
    direction: application_to_infrastructure
    is_allowed: false
    risk_signals:
      - forbidden_direction
    notes: >
      Imports BatchClaimerService, VdfRunnerAdapter, ScanPurgerService,
      VdfManifestNormalizer, VideoScanRepository — all concrete, no ports.
    evidence_refs:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: constructor parameters
        value: "BatchClaimerService, VdfRunnerAdapter, ScanPurgerService, VdfManifestNormalizer, VideoScanRepository, S3Adapter, RabbitMQPublisher — all concrete"

  - dep_id: SD-008
    description: >
      All services import from @gunea-pig/shared barrel (shared_kernel dependency)
    source_artifact: packages/*/src/**/*.ts
    target_artifact: packages/shared/src/index.ts
    dependency_type: static_import
    dependency_scope: shared_kernel
    direction: feature_to_shared_kernel
    is_allowed: true
    risk_signals:
      - shared_kernel_instability
    notes: >
      The direction (service -> shared) is correct. However, the shared barrel
      exposes both clean domain types (allowed) and concrete infrastructure classes
      (NestJS schemas, RabbitMQPublisher, S3Adapter) — the shared kernel is impure.
      This requires a shared_kernel_purity_review.
    evidence_refs:
      - source: packages/staging-service/package.json
        field: dependencies
        value: '"@gunea-pig/shared": "*"'
      - source: packages/shared/src/index.ts
        field: exports
        value: "exports both ./types (clean) and ./db, ./queue, ./storage (infra-coupled)"

  - dep_id: SD-009
    description: >
      Shared package imports @nestjs/mongoose and mongoose (framework dep in shared kernel)
    source_artifact: packages/shared/src/db/video.schema.ts
    target_artifact: "@nestjs/mongoose, mongoose"
    dependency_type: static_import
    dependency_scope: external_package
    direction: infrastructure_to_external_system
    is_allowed: true
    risk_signals:
      - shared_kernel_instability
    notes: >
      The import itself (infrastructure file -> external ORM) is an allowed direction.
      The problem is that these infrastructure files live in the shared kernel package,
      which forces all consumers to carry the @nestjs/mongoose transitive dependency
      even when they only need domain types. Purity violation at the package boundary.
    evidence_refs:
      - source: packages/shared/src/db/video.schema.ts
        field: imports
        value: "import { Prop, Schema, SchemaFactory } from '@nestjs/mongoose'"

  - dep_id: SD-010
    description: >
      Infrastructure repositories in all services import shared Mongoose schema classes
      as injection tokens via @InjectModel
    source_artifact: packages/*/src/infrastructure/*.repository.ts
    target_artifact: packages/shared/src/db/*.schema.ts
    dependency_type: static_import
    dependency_scope: shared_kernel
    direction: infrastructure_to_external_system
    is_allowed: true
    risk_signals:
      - shared_kernel_instability
    notes: >
      Using the concrete Mongoose schema class as the injection token is the standard
      NestJS Mongoose pattern. Direction (infra -> shared infra schema) is allowed.
      Risk is the coupling to concrete schema class rather than an interface.
    evidence_refs:
      - source: packages/staging-service/src/infrastructure/video.repository.ts
        field: constructor injection
        value: "@InjectModel(VideoDocument.name) private readonly videoModel: Model<VideoDocument>"

  - dep_id: SD-011
    description: >
      Domain policies in all services import ONLY from @gunea-pig/shared types
      sub-path or have zero external imports
    source_artifact: packages/*/src/domain/*.policy.ts
    target_artifact: packages/shared/src/types/
    dependency_type: static_import
    dependency_scope: shared_kernel
    direction: domain_to_domain
    is_allowed: true
    risk_signals: []
    notes: >
      Domain policy classes (VideoStagingPolicy, SimilarityThreshold, BatchClaimPolicy,
      ScanCleanupPolicy) import only clean types (enums, interfaces) from shared types.
      No framework imports. These are the only fully clean dependencies in the codebase.
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: boundary_signals
        value: "Domain policy classes are the only truly clean, isolated units in the codebase"

  - dep_id: SD-012
    description: >
      Transport consumers import application handlers (allowed direction)
    source_artifact: packages/*/src/transport/*.consumer.ts
    target_artifact: packages/*/src/application/*.handler.ts
    dependency_type: static_import
    dependency_scope: same_module
    direction: transport_to_application
    is_allowed: true
    risk_signals: []
    notes: >
      VideoReadyConsumer -> StageVideoHandler, ScanCompletedConsumer -> ProcessScanHandler.
      This is the correct layered direction.
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: call_sites
        value: "consumer delegates to handler via constructor-injected *.handle(event)"

  - dep_id: SD-013
    description: >
      grouping-service ProcessScanHandler constructs UnionFindDomainService via 'new'
    source_artifact: packages/grouping-service/src/application/process-scan.handler.ts
    target_artifact: packages/grouping-service/src/domain/union-find.domain-service.ts
    dependency_type: static_import
    dependency_scope: same_module
    direction: application_to_domain
    is_allowed: true
    risk_signals: []
    notes: >
      Direction is allowed (application -> domain). However, the domain service is
      instantiated directly with 'new' in the handler's field initializer rather than
      being injected — this makes it non-substitutable and prevents port abstraction.
      OCP concern; no DIP violation since domain is the inner layer.
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: call_sites
        value: "handler instantiates UnionFindDomainService via 'new' in field initializer — not injected"

  - dep_id: SD-014
    description: >
      pipeline-service duplicates all three standalone service module structures
    source_artifact: packages/pipeline-service/src/*/
    target_artifact: packages/staging-service/src/, packages/grouping-service/src/, packages/vdf-scan-service/src/
    dependency_type: static_import
    dependency_scope: same_module
    direction: application_to_domain
    is_allowed: true
    risk_signals:
      - shared_kernel_instability
    notes: >
      pipeline-service contains verbatim copies of staging, grouping, and scanning
      logic. No runtime import dependency between standalone services and pipeline-service
      exists — they are code-level duplicates compiled independently. This is a
      structural duplication risk, not a dependency direction violation.
    evidence_refs:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions.DECISION-RECON-004
        value: "pipeline-service is a near-verbatim code duplication of the three standalone services"

