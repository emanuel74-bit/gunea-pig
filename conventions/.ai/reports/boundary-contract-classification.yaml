report_id: "boundary-contract-classification"
phase_id: boundary_contract_classification
status: complete

summary: >
  Six boundaries and nine contracts classified for the gunea-pig NestJS monorepo SOLID
  refactor mission. The single most significant finding is that the RabbitMQ message
  boundary (queue topic names and event payload schemas) is the only external_public
  boundary in the system and must not be changed during the refactor. All MongoDB
  collection schemas are persistence contracts that are equally inviolable because they
  represent durable stored data — changing collection names or required fields without
  a migration would corrupt live data. The S3 key pattern is a cross-service file-storage
  contract: the scan-service writes keys that the grouping-service must read by the same
  pattern. The shared package API boundary is workspace_public and is the primary surface
  through which the refactor will introduce new port interfaces. The application-layer
  port boundary is currently implicit (concrete injection) and must become explicit during
  the refactor without changing any external observable behavior. The NestJS module
  boundaries within pipeline-service are internal and structurally safe to reorganize.
  No consumer-visible contract changes are required for SOLID compliance — the refactor
  is purely structural.

inputs_consumed:
  - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
    artifact: codebase_reconnaissance
    fields_used:
      - relevant_artifacts
      - boundary_signals
      - dependency_signals
      - decisions
      - call_sites
  - source: conventions/.ai/reports/local-convention-candidates.yaml
    artifact: local_convention_candidates
    fields_used:
      - detected_conventions
      - decisions

decisions:
  - id: DECISION-BCC-001
    decision: >
      Classify the RabbitMQ message boundary as external_public with stability class
      locked. The three event interfaces (NewVideoReadyEvent, ScanCompletedEvent,
      ScanPersistedEvent) and the exchange/routing-key/queue-name constants defined in
      packages/shared/src/types/queue.types.ts are the most critical external contract
      in the system. Any change to these would break cross-service message routing.
    rationale: >
      DECISION-RECON-003 confirmed no REST/gRPC surface exists; RabbitMQ is the only
      external interface. All services depend on the queue constants and event schemas
      from queue.types.ts. The RabbitMQ broker itself enforces exchange/queue topology
      at runtime — a name change would silently drop messages.
    evidence:
      - source: packages/shared/src/types/queue.types.ts
        field: QUEUE_EXCHANGES, ROUTING_KEYS, QUEUE_NAMES, NewVideoReadyEvent, ScanCompletedEvent, ScanPersistedEvent
        value: "Consumed by all four service packages; enforced by live RabbitMQ broker topology"

  - id: DECISION-BCC-002
    decision: >
      Classify all four Mongoose collection schemas as persistence contracts with
      stability class locked. Collection names (videos, scan_batches, similarity_edges,
      similarity_groups) and all required field definitions must not change during the
      refactor. The SRP violation (NestJS decorator coupling in the shared package) is
      noted but is not a blocking concern for this structural refactor — it is a
      technical debt item, not a contract break.
    rationale: >
      DECISION-RECON-002 corrected the ORM reference from Drizzle to Mongoose. The four
      schema files define the live MongoDB collection structure. DECISION-RECON-011
      confirmed no pending migrations exist, so the schemas are stable at their current
      definition. Changing a collection name or removing a field would lose live data.
    evidence:
      - source: packages/shared/src/db/video.schema.ts
        field: "@Schema({ collection: 'videos' })"
        value: "Collection name 'videos' is the external persistence contract"
      - source: packages/shared/src/db/scan-batch.schema.ts
        field: "@Schema({ collection: 'scan_batches' })"
        value: "Collection name 'scan_batches' is the external persistence contract"
      - source: packages/shared/src/db/similarity-edge.schema.ts
        field: "@Schema({ collection: 'similarity_edges' })"
        value: "Collection name 'similarity_edges' is the external persistence contract"
      - source: packages/shared/src/db/similarity-group.schema.ts
        field: "@Schema({ collection: 'similarity_groups' })"
        value: "Collection name 'similarity_groups' is the external persistence contract"

  - id: DECISION-BCC-003
    decision: >
      Classify the S3 key pattern as a file_storage boundary with stability class
      locked. The scan orchestrator writes scan result JSON to S3 using a key derived
      from the scanBatchId; the grouping-service reads it using the same key pattern
      carried in the ScanCompletedEvent payload. The S3 bucket name and key format are
      effectively a cross-service storage contract.
    rationale: >
      DECISION-RECON-010 identified that S3Adapter.putJson() is called by ScanOrchestrator
      to store NormalizedScanResult, and ScanResultClient.load() reads it. The key is
      passed through the ScanCompletedEvent. If the key format changes in the writer
      but not in the reader (or vice versa), grouping will fail to load scan results.
    evidence:
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: putJson call with scanBatch key
        value: "Writes NormalizedScanResult to S3 using scanBatchId-derived key"
      - source: packages/grouping-service/src/infrastructure/scan-result.client.ts
        field: load(bucket, key) called with key from ScanCompletedEvent
        value: "Reads NormalizedScanResult from S3 using key received in event payload"

  - id: DECISION-BCC-004
    decision: >
      Classify the shared package API boundary (packages/shared/src/index.ts exports)
      as workspace_public with stability class stable. All four service packages import
      from '@gunea-pig/shared'. The current exports include both safe domain types and
      infrastructure-coupled schema classes. The refactor may ADD new port interfaces
      to shared but must not REMOVE or RENAME existing exports without updating all
      known consumers atomically.
    rationale: >
      DECISION-RECON-012 confirmed the shared package is workspace-only (private: true,
      workspace wildcard version). All consumers are known. This is an internal_stable
      boundary with all_known consumers — the synchronized_breaking_change strategy is
      available if any export must change, but the refactor intent is additive only
      (add port interfaces without removing concrete exports).
    evidence:
      - source: packages/shared/src/index.ts
        field: exports
        value: "Re-exports types, db schemas, queue client, s3 client, logger"
      - source: packages/staging-service/package.json
        field: '"@gunea-pig/shared": "*"'
        value: "Workspace wildcard — consumer is fully controlled"
      - source: packages/shared/package.json
        field: '"private": true'
        value: "Not published to npm — no external package consumers"

  - id: DECISION-BCC-005
    decision: >
      Classify the NestJS module boundaries within pipeline-service (StagingModule,
      ScanningModule, GroupingModule, SharedInfraModule) as module_public with
      stability class module_internal. These are structurally safe to reorganize
      during the refactor provided the behavior (handler wiring, provider registration)
      is preserved.
    rationale: >
      DECISION-RECON-004 confirmed pipeline-service is the consolidation target.
      BOUNDARY-SIGNAL confirmed that SharedInfraModule creates hidden coupling via
      @Global. The module boundary is entirely internal — no external consumer
      depends on the NestJS module structure.
    evidence:
      - source: packages/pipeline-service/src/app.module.ts
        field: imports
        value: "SharedInfraModule, StagingModule, ScanningModule, GroupingModule"
      - source: packages/pipeline-service/src/shared-infra.module.ts
        field: "@Global() module with S3Adapter and RabbitMQPublisher exports"
        value: "All consumers are within pipeline-service only"

  - id: DECISION-BCC-006
    decision: >
      Classify the application-layer port boundary as an application_boundary that
      is currently implicit (no TypeScript interfaces exist between application handlers
      and their infrastructure dependencies). The refactor must make this boundary
      explicit by introducing port interfaces. This is a structural change only — the
      DI wiring changes but no external behavior changes.
    rationale: >
      DECISION-RECON-006 identified that all application handlers (StageVideoHandler,
      ProcessScanHandler, ScanOrchestrator) inject concrete infrastructure classes.
      DECISION-RECON-009 and DECISION-RECON-010 confirmed RabbitMQPublisher and
      S3Adapter are injected as concrete classes with no port interface. Introducing
      interfaces at the application boundary is the core SOLID fix — it is an
      internal-only structural change.
    evidence:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: constructor parameters
        value: "VideoRepository, FileStagingAdapter — both concrete, no interface abstraction"
      - source: packages/grouping-service/src/application/process-scan.handler.ts
        field: constructor parameters
        value: "ScanResultClient, SimilarityEdgeRepository, SimilarityGroupRepository, VideoSimilarityRepository, ScanBatchRepository, RabbitMQPublisher — all concrete"
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: constructor parameters
        value: "BatchClaimerService, VdfRunnerAdapter, ScanPurgerService, VdfManifestNormalizer, VideoScanRepository, S3Adapter, RabbitMQPublisher — all concrete"

