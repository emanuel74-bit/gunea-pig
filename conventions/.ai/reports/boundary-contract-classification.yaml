consumer_obligations:
  - obligation_id: OBL-001
    description: >
      Preserve all RabbitMQ event payload field names and types across the refactor.
      Any new fields must be optional (backward_compatible_addition strategy). Removing
      or renaming fields is forbidden without a synchronized_breaking_change that
      includes all known consumers.
    contract_refs: [CON-001, CON-002, CON-003]
    affected_consumers:
      - staging-service (consumer of NewVideoReadyEvent)
      - grouping-service (consumer of ScanCompletedEvent)
      - external upstream producer of NewVideoReadyEvent (outside this repo)
      - external consumer of ScanPersistedEvent (outside this repo)

  - obligation_id: OBL-002
    description: >
      Preserve all MongoDB collection names and required field definitions. Any schema
      additions must be nullable or have default values to be backward compatible with
      existing stored documents. Field removals require a data migration plan.
    contract_refs: [CON-004, CON-005, CON-006, CON-007]
    affected_consumers:
      - All four service packages (staging-service, grouping-service, vdf-scan-service, pipeline-service)

  - obligation_id: OBL-003
    description: >
      Preserve the S3 key pattern for scan result JSON objects. Both the writer
      (ScanOrchestrator) and reader (ScanResultClient) must use the same key derivation
      logic. The NormalizedScanResult JSON structure must remain compatible.
    contract_refs: [CON-008]
    affected_consumers:
      - grouping-service ScanResultClient
      - pipeline-service grouping ScanResultClient

  - obligation_id: OBL-004
    description: >
      Preserve all existing exports of packages/shared/src/index.ts during the refactor.
      New exports (port interfaces) may be added. Removal or rename of any existing
      export requires an atomic synchronized update of all four consumer packages.
