boundaries:
  - boundary_id: BND-001
    type: message_queue_boundary
    description: >
      RabbitMQ message boundary: queue exchange names, routing keys, queue names, and
      the three event payload schemas (NewVideoReadyEvent, ScanCompletedEvent,
      ScanPersistedEvent). This is the primary external contract for the entire pipeline.
      Services communicate exclusively through this boundary.
    affected_packages:
      - shared
      - staging-service
      - grouping-service
      - vdf-scan-service
      - pipeline-service
    is_external: true
    stability_class: locked
    surface: bidirectional
    visibility: external_public
    ownership: shared_kernel
    source_artifacts:
      - packages/shared/src/types/queue.types.ts
      - packages/staging-service/src/transport/video-ready.consumer.ts
      - packages/grouping-service/src/consumers/scan-completed.consumer.ts
      - packages/vdf-scan-service/src/application/scan.orchestrator.ts
      - packages/pipeline-service/src/staging/transport/video-ready.consumer.ts
      - packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
    risk_signals:
      - message_contract_change_possible
    confidence: high

  - boundary_id: BND-002
    type: persistence_boundary
    description: >
      MongoDB persistence boundary: four Mongoose collection schemas defining collection
      names (videos, scan_batches, similarity_edges, similarity_groups) and all field
      definitions. These represent durable external data contracts. Changing collection
      names or removing fields would corrupt live data without a migration.
    affected_packages:
      - shared
      - staging-service
      - grouping-service
      - vdf-scan-service
      - pipeline-service
    is_external: true
    stability_class: locked
    surface: outbound
    visibility: workspace_public
    ownership: shared_kernel
    source_artifacts:
      - packages/shared/src/db/video.schema.ts
      - packages/shared/src/db/scan-batch.schema.ts
      - packages/shared/src/db/similarity-edge.schema.ts
      - packages/shared/src/db/similarity-group.schema.ts
    risk_signals:
      - persistence_entity_leak_possible
      - data_loss_possible
    confidence: high

  - boundary_id: BND-003
    type: file_storage_boundary
    description: >
      S3 object storage boundary: the key pattern used to store and retrieve the
      NormalizedScanResult JSON produced by vdf-scan-service and consumed by
      grouping-service. The key is derived from scanBatchId and carried in
      ScanCompletedEvent. The bucket name is provided via environment configuration.
    affected_packages:
      - shared
      - vdf-scan-service
      - grouping-service
      - pipeline-service
    is_external: true
    stability_class: locked
    surface: outbound
    visibility: workspace_public
    ownership: shared_kernel
    source_artifacts:
      - packages/shared/src/storage/s3.client.ts
      - packages/vdf-scan-service/src/application/scan.orchestrator.ts
      - packages/grouping-service/src/infrastructure/scan-result.client.ts
    risk_signals:
      - storage_contract_change_possible
    confidence: high

  - boundary_id: BND-004
    type: public_api_boundary
    description: >
      Shared package API boundary: the public exports of packages/shared/src/index.ts
      consumed by all four service packages. Includes domain types (queue.types.ts,
      video.types.ts, scan.types.ts), Mongoose schema classes, RabbitMQPublisher,
      S3Adapter, and logger. This is a workspace_public surface with all consumers
      fully enumerated.
    affected_packages:
      - staging-service
      - grouping-service
      - vdf-scan-service
      - pipeline-service
    is_external: false
    stability_class: stable
    surface: public
    visibility: workspace_public
    ownership: single_module
    source_artifacts:
      - packages/shared/src/index.ts
      - packages/shared/src/types/index.ts
      - packages/shared/src/db/index.ts
      - packages/shared/src/queue/index.ts
      - packages/shared/src/storage/index.ts
    risk_signals:
      - consumer_impact_detected
    confidence: high

  - boundary_id: BND-005
    type: module_boundary
    description: >
      NestJS module boundaries within pipeline-service: StagingModule, ScanningModule,
      GroupingModule, and SharedInfraModule. These are internal NestJS feature module
      boundaries that control provider registration and export wiring within the
      consolidated pipeline-service application. No external consumer depends on this
      module structure.
    affected_packages:
      - pipeline-service
    is_external: false
    stability_class: internal_mutable
    surface: internal
    visibility: module_public
    ownership: single_module
    source_artifacts:
      - packages/pipeline-service/src/app.module.ts
      - packages/pipeline-service/src/shared-infra.module.ts
      - packages/pipeline-service/src/staging/staging.module.ts
      - packages/pipeline-service/src/scanning/scanning.module.ts
      - packages/pipeline-service/src/grouping/grouping.module.ts
    risk_signals:
      - dependency_wiring_changed
    confidence: high

  - boundary_id: BND-006
    type: application_boundary
    description: >
      Application-layer port boundary: the currently-implicit interface between
      application handlers (StageVideoHandler, ProcessScanHandler, ScanOrchestrator)
      and their infrastructure dependencies (repositories, adapters, publishers, clients).
      Currently crossed via direct concrete class injection. The refactor must introduce
      explicit TypeScript interface ports at this boundary without changing any external
      observable behavior.
    affected_packages:
      - staging-service
      - grouping-service
      - vdf-scan-service
      - pipeline-service
    is_external: false
    stability_class: internal_mutable
    surface: internal
    visibility: module_public
    ownership: single_module
    source_artifacts:
      - packages/staging-service/src/application/stage-video.handler.ts
      - packages/grouping-service/src/application/process-scan.handler.ts
      - packages/vdf-scan-service/src/application/scan.orchestrator.ts
      - packages/pipeline-service/src/staging/application/stage-video.handler.ts
      - packages/pipeline-service/src/grouping/application/process-scan.handler.ts
      - packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
    risk_signals:
      - orchestration_boundary_leak_possible
      - direction_violation
    confidence: high

