report_id: boundary-contract-classification
phase_id: boundary_contract_classification
schema_version: "1.0"
status: complete

summary: >
  Classified boundaries and contracts for all three VDF pipeline services.
  Greenfield: no existing contracts are being changed. All contracts are new
  (additive). Seven boundary clusters identified across VSS, VBS, and SGS.
  Six contract surfaces established: two RabbitMQ event contracts
  (new-video-ready-for-scan, scan-completed), one cleanup signal contract
  (scan-persisted-grouping-completed), three persistence contracts (scan state,
  batch claim, similarity data), and one configuration contract (thresholds +
  connection config). No compatibility obligations for existing consumers.
  Forward-facing stability levels assigned for each new contract.

inputs_consumed:
  - source: .ai/reports/03-codebase-reconnaissance.yaml
    type: codebase_reconnaissance
  - source: .ai/reports/local-convention-candidates.yaml
    type: local_convention_candidates

boundary_records:

  # ── VSS Boundaries ──────────────────────────────────────────────────────────

  - boundary_id: BND-VSS-001
    boundary_type: message_queue_boundary
    surface: inbound
    visibility: external_public
    owner: VideoScanStagingService
    crossing_mechanism: RabbitMQ consumer (amqplib, manual ack)
    source_artifact: upstream ingest pipeline (external, out of scope)
    target_artifact: VSS RabbitMQ consumer module
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VSS-F-001
    risk_signals:
      - no dead-letter handling defined yet (must be addressed in architecture)
      - consumer must be idempotent (VSS-I-001) — side effects without idempotency risk
    notes: >
      VSS is the inbound entry point for the entire pipeline. The
      new-video-ready-for-scan event schema is the contract surface.

  - boundary_id: BND-VSS-002
    boundary_type: external_system_boundary
    surface: inbound
    visibility: module_public
    owner: VideoScanStagingService
    crossing_mechanism: Mongoose (MongoDB) read via repository
    source_artifact: MongoDB video metadata collection
    target_artifact: VSS video metadata repository
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VSS-F-002
    risk_signals:
      - video metadata missing → structured failure required (VSS-E-001)
    notes: >
      VSS reads video metadata from MongoDB but does not own the metadata
      collection; it is populated by the upstream ingest pipeline (out of scope).

  - boundary_id: BND-VSS-003
    boundary_type: file_storage_boundary
    surface: bidirectional
    visibility: external_public
    owner: VideoScanStagingService
    crossing_mechanism: "@aws-sdk/client-s3 read + mounted filesystem write"
    source_artifact: S3 video storage bucket
    target_artifact: VDF scan path (shared mounted filesystem)
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VSS-F-003,VSS-F-004
    risk_signals:
      - S3 object missing → structured failure required (VSS-E-002)
      - filesystem write failure → structured failure required (VSS-E-003)
      - VDF scan path is a shared volume (shared between VSS write and VBS read)
    notes: >
      VSS downloads from S3 and copies to the VDF shared mounted filesystem.
      The VDF scan path boundary is shared with VBS (process_boundary coordination).

  - boundary_id: BND-VSS-004
    boundary_type: persistence_boundary
    surface: outbound
    visibility: workspace_public
    owner: VideoScanStagingService
    crossing_mechanism: Mongoose (MongoDB) findOneAndUpdate (write-state transition)
    source_artifact: VSS staging logic
    target_artifact: MongoDB scan_states collection
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VSS-F-005,VSS-F-006,VSS-I-002
    risk_signals:
      - state machine transition must be atomic and idempotent
      - awaiting_staging → staged transition must not repeat on duplicate message
    notes: >
      VSS owns the awaiting_staging → staged state transition. Shared with VBS
      (claimed, scanning, scan_complete), SGS (grouping_complete, pending_cleanup,
      cleanup_allowed, cleaned).

  - boundary_id: BND-VSS-005
    boundary_type: process_boundary
    surface: outbound
    visibility: external_public
    owner: VideoScanStagingService
    crossing_mechanism: RabbitMQ event (implicit — scan state marks video as staged, VBS polls)
    source_artifact: VSS (staged state write)
    target_artifact: VDFBatchScannerService (MongoDB polling)
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VBS-F-001
    risk_signals: []
    notes: >
      No direct RabbitMQ event from VSS to VBS. VBS discovers staged videos by
      polling MongoDB. Process boundary is indirect through shared MongoDB state.

  # ── VBS Boundaries ──────────────────────────────────────────────────────────

  - boundary_id: BND-VBS-001
    boundary_type: persistence_boundary
    surface: bidirectional
    visibility: workspace_public
    owner: VDFBatchScannerService
    crossing_mechanism: Mongoose (MongoDB) findOneAndUpdate with CAS conditions
    source_artifact: VBS batch claim logic
    target_artifact: MongoDB scan_batch_claims collection + scan_states collection
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VBS-C-001,VBS-C-002,VBS-C-003,VBS-C-004,VBS-F-006
    risk_signals:
      - concurrent workers must not claim same batch (requires atomic CAS)
      - expired claim recovery must prevent double-processing
      - state transitions: staged → claimed → scanning → scan_complete
    notes: >
      VBS owns the claimed, scanning, scan_complete, pending_cleanup state
      transitions. Batch claim document is a separate collection from scan_states.

  - boundary_id: BND-VBS-002
    boundary_type: external_system_boundary
    surface: outbound
    visibility: private
    owner: VDFBatchScannerService
    crossing_mechanism: child_process.spawn or exec (VDF CLI invocation)
    source_artifact: VBS VDF runner module
    target_artifact: VDF CLI binary (external tool)
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VBS-F-002,VBS-F-003
      - .ai/reports/assumptions.yaml#A-001,A-005
    risk_signals:
      - VDF output format unknown (high risk per RS-001 in risk-classification)
      - VDF must be isolated behind adapter interface (RF-001)
      - VDF invocation failure must be retryable (VBS-F-007)
    notes: >
      VDF CLI is an external process boundary. Output format is the primary
      unresolved risk. Normalization adapter must isolate parsing from the rest
      of VBS logic.

  - boundary_id: BND-VBS-003
    boundary_type: file_storage_boundary
    surface: outbound
    visibility: workspace_public
    owner: VDFBatchScannerService
    crossing_mechanism: "@aws-sdk/client-s3 write (PutObject)"
    source_artifact: VBS scan result writer
    target_artifact: S3 scan results bucket
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VBS-F-004,VBS-H-001,VBS-H-002,VBS-H-003
    risk_signals:
      - S3 write must complete before scan-completed event is published (ordering constraint)
      - result must be reloadable on SGS retry (VBS-H-004)
    notes: >
      VBS writes normalized scan result JSON to S3 with a stable key based on
      scan_id. Key schema and bucket name are configurable.

  - boundary_id: BND-VBS-004
    boundary_type: message_queue_boundary
    surface: outbound
    visibility: external_public
    owner: VDFBatchScannerService
    crossing_mechanism: RabbitMQ producer (amqplib publish)
    source_artifact: VBS scan result publisher
    target_artifact: SGS RabbitMQ consumer
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VBS-F-005,VBS-H-002
    risk_signals:
      - publish AFTER S3 write completes (durable handoff ordering)
      - message must not contain large inline payload
    notes: >
      VBS publishes scan-completed event containing scan_id and S3 result location.
      Payload is lightweight — no inline scan data.

  - boundary_id: BND-VBS-005
    boundary_type: process_boundary
    surface: outbound
    visibility: external_public
    owner: VDFBatchScannerService
    crossing_mechanism: MongoDB state transition (pending_cleanup → cleanup_allowed) or RabbitMQ event
    source_artifact: VBS cleanup state manager
    target_artifact: VBS cleanup worker (internal) + SGS confirmation signal
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VBS-P-001,VBS-P-002,VBS-P-003,VBS-P-004
    risk_signals:
      - cleanup authorization must not be self-issued
      - cleanup state machine: pending_cleanup → cleanup_allowed → cleaned
    notes: >
      VBS must not purge scan artifacts until authorized. Authorization arrives
      from SGS via MongoDB state transition (grouping_complete) or RabbitMQ
      scan-persisted-grouping-completed event.

  # ── SGS Boundaries ──────────────────────────────────────────────────────────

  - boundary_id: BND-SGS-001
    boundary_type: message_queue_boundary
    surface: inbound
    visibility: external_public
    owner: SimilarityGroupingService
    crossing_mechanism: RabbitMQ consumer (amqplib, manual ack)
    source_artifact: VDFBatchScannerService (scan-completed publisher)
    target_artifact: SGS RabbitMQ consumer module
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#SGS-F-001,SGS-I-001
    risk_signals:
      - consumer must be idempotent (SGS-I-001) — duplicate events must not corrupt group state
      - manual ack required: ack only after successful persistence
    notes: >
      SGS is the downstream consumer of VBS scan results. Idempotency is
      required because RabbitMQ delivers at-least-once.

  - boundary_id: BND-SGS-002
    boundary_type: file_storage_boundary
    surface: inbound
    visibility: workspace_public
    owner: SimilarityGroupingService
    crossing_mechanism: "@aws-sdk/client-s3 read (GetObject)"
    source_artifact: S3 scan results bucket
    target_artifact: SGS scan result loader
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#SGS-F-002,SGS-F-003
    risk_signals:
      - must validate schema/version before processing (SGS-F-003)
      - must be reloadable on retry (VBS-H-004)
    notes: >
      SGS loads normalized scan result from S3 using the result_location
      field from the scan-completed event.

  - boundary_id: BND-SGS-003
    boundary_type: persistence_boundary
    surface: outbound
    visibility: workspace_public
    owner: SimilarityGroupingService
    crossing_mechanism: Mongoose (MongoDB) writes with write concern majority
    source_artifact: SGS grouping logic
    target_artifact: MongoDB similarity_edges + similarity_groups + video_documents collections
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#SGS-F-004,SGS-F-005,SGS-F-006,SGS-F-007,SGS-F-008,SGS-F-009
    risk_signals:
      - idempotency: duplicate edges must not be created on retry
      - merge/create group logic must be consistent under concurrent grouping
      - state: grouping_complete transition owned by SGS
    notes: >
      SGS owns the grouping_complete state transition and all similarity data.

  - boundary_id: BND-SGS-004
    boundary_type: event_boundary
    surface: outbound
    visibility: workspace_public
    owner: SimilarityGroupingService
    crossing_mechanism: "MongoDB state transition (grouping_complete) OR RabbitMQ event (scan-persisted-grouping-completed)"
    source_artifact: SGS post-persistence confirmation
    target_artifact: VBS cleanup state manager
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#SGS-F-010
    risk_signals:
      - cleanup authorization signal must not be sent before persistence is confirmed
      - dual mechanism (MongoDB or RabbitMQ) must be decided in architecture
    notes: >
      SGS emits cleanup authorization to allow VBS to proceed with safe cleanup.
      Mechanism (state transition vs. event) deferred to architecture_decomposition.

contract_records:

  - contract_id: CNT-001
    contract_type: event_contract
    surface: new-video-ready-for-scan (RabbitMQ message schema)
    stability_level: external_public
    consumer_types: [single_module]
    consumer_knowledge: external_consumer
    change_type: additive
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#shared_requirements.messaging.new_video_ready_for_scan
    compatibility_required: false
    required_followups:
      - Define exact schema in architecture_decomposition (field types, validation)
    notes: >
      New contract. Schema fields: event_id, schema_version, video_id, s3_reference,
      timestamp, correlation_id. Published by upstream ingest pipeline (out of scope).
      Consumed by VSS. Greenfield: no existing consumers to break.

  - contract_id: CNT-002
    contract_type: event_contract
    surface: scan-completed (RabbitMQ message schema)
    stability_level: external_public
    consumer_types: [single_module]
    consumer_knowledge: external_consumer
    change_type: additive
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#shared_requirements.messaging.scan_completed
    compatibility_required: false
    required_followups:
      - Define exact schema in architecture_decomposition
      - Enforce payload constraint: no large inline result data
    notes: >
      New contract. Published by VBS, consumed by SGS. Schema fields: event_id,
      schema_version, scan_id, result_location, scanned_video_ids, scanner_profile,
      scanner_version, timestamp, correlation_id.

  - contract_id: CNT-003
    contract_type: event_contract
    surface: scan-persisted-grouping-completed (cleanup signal)
    stability_level: workspace_public
    consumer_types: [single_module]
    consumer_knowledge: external_consumer
    change_type: additive
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#shared_requirements.messaging.scan_persisted_grouping_completed
    compatibility_required: false
    required_followups:
      - Decide mechanism (MongoDB state vs. RabbitMQ event) in architecture_decomposition
    notes: >
      New contract. Emitted by SGS, consumed by VBS cleanup worker. Mechanism TBD.
      Schema fields: event_id, scan_id, timestamp, correlation_id.

  - contract_id: CNT-004
    contract_type: persistence_contract
    surface: MongoDB scan_states collection (10-state machine document schema)
    stability_level: workspace_public
    consumer_types: [shared_kernel]
    consumer_knowledge: external_consumer
    change_type: additive
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#shared_requirements.scan_state_machine
    compatibility_required: false
    required_followups:
      - Define full document schema in architecture_decomposition (field names, indexes, write concerns)
    notes: >
      New contract. Shared across all three services. State machine enforces forward-only
      transitions. Multiple services own specific transition slices (VSS, VBS, SGS).

  - contract_id: CNT-005
    contract_type: persistence_contract
    surface: MongoDB scan_batch_claims collection (VBS batch claim document)
    stability_level: module_public
    consumer_types: [single_module]
    consumer_knowledge: external_consumer
    change_type: additive
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#VBS-C-003
    compatibility_required: false
    required_followups:
      - Define document schema, indexes, and CAS condition patterns in architecture_decomposition
    notes: >
      New contract owned exclusively by VBS. Fields: scan_id, claimed_video_ids,
      owner_id, claim_timestamp, claim_expiration_timestamp, status.

  - contract_id: CNT-006
    contract_type: persistence_contract
    surface: "MongoDB similarity_edges, similarity_groups, video_documents (SGS owned)"
    stability_level: module_public
    consumer_types: [single_module]
    consumer_knowledge: external_consumer
    change_type: additive
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#SGS-F-004,SGS-F-005,SGS-F-006,SGS-F-007,SGS-F-008
    compatibility_required: false
    required_followups:
      - Define schema, indexes, and idempotency key strategy in architecture_decomposition
    notes: >
      New contracts owned by SGS. Similarity edge schema must include pairwise score
      and threshold-derived classification. Group membership must be idempotent.

  - contract_id: CNT-007
    contract_type: configuration_contract
    surface: Environment variable configuration (all three services)
    stability_level: workspace_public
    consumer_types: [single_module]
    consumer_knowledge: external_consumer
    change_type: additive
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#shared_requirements.similarity_threshold_policy
      - .ai/reports/local-alignment.yaml#CC-006
    compatibility_required: false
    required_followups:
      - Define full env var names and validation schema in architecture_decomposition
    notes: >
      All four similarity thresholds (storeEdgeScore, autoMergeGroupScore,
      strongDuplicateScore, requireManualReviewBelow) + RabbitMQ/MongoDB/S3
      connection config must be configurable via environment variables.

triggers_emitted: []

gate_result:
  gate_id: gate.boundary_contract_classification.output
  status: pass
  failures: []

produced_outputs:
  - .ai/reports/boundary-contract-classification.yaml
  - .ai/reports/compatibility-decision.yaml
