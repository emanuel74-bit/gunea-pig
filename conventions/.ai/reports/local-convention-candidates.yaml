report_id: "local-convention-candidates"
phase_id: codebase_reconnaissance
status: complete
summary: >
  Ten local conventions detected across the monorepo. These are patterns already
  consistently followed by the codebase that should be preserved, formalized, or
  elevated to explicit convention rules during the SOLID refactor. Five are naming/structure
  conventions that can be enforced as-is. Two are injection patterns that need elevation
  (Symbol tokens for value providers is correct; class token for concrete classes is the
  DIP violation to fix). One is the EnvironmentVariables config pattern which is sound
  and should be preserved. One is the layered folder structure which is the scaffold for
  the refactor. One is the Mongoose .lean() discipline which is a good production practice
  that must be maintained.

inputs_consumed:
  - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
    artifact: codebase_reconnaissance
    fields_used:
      - local_conventions
      - relevant_artifacts
      - boundary_signals
      - dependency_signals
  - source: conventions/.ai/reports/02-behavior-contract.yaml
    artifact: behavior_contract
    fields_used:
      - scope.in_scope
      - allowed_behavior_changes

decisions:
  - id: DECISION-LCC-001
    decision: >
      Elevate the layer folder structure (domain/, application/, infrastructure/, transport/)
      to a formalized monorepo convention. All service packages and all future submodules
      must use this exact folder hierarchy.
    rationale: >
      All five packages consistently use this structure, even when the number of files
      in a layer is small (e.g., staging-service domain/ has one file). The structure
      maps directly to Clean Architecture layer boundaries and will be the scaffold for
      DIP port/interface placement during the refactor.
    evidence:
      - source: packages/staging-service/src/
        field: folder structure
        value: "domain/, application/, infrastructure/, transport/"
      - source: packages/pipeline-service/src/
        field: folder structure
        value: "grouping/domain/, grouping/application/, grouping/infrastructure/, grouping/transport/"

  - id: DECISION-LCC-002
    decision: >
      Preserve and formalize the kebab-case file naming with role suffix convention.
      The refactor must NOT change existing file naming semantics; new files introduced
      for ports/interfaces should follow the pattern *.port.ts or *.interface.ts.
    rationale: >
      100% of source files follow this convention. It is readable, searchable, and
      unambiguous. Introducing interfaces as *.port.ts or *.interface.ts files will
      integrate naturally without conflicting with existing naming.
    evidence:
      - source: packages/staging-service/src/
        field: all filenames
        value: "video-staging.policy.ts, stage-video.handler.ts, video.repository.ts, file-staging.adapter.ts, video-ready.consumer.ts, staging-message.validator.ts"

  - id: DECISION-LCC-003
    decision: >
      Preserve the Symbol-based injection token convention for value providers.
      Extend it to interface/port injection during the refactor — each port should
      have a matching Symbol token declared in an injection-tokens.ts file.
    rationale: >
      vdf-scan-service and pipeline-service already use VDF_SCAN_CONFIG, PIPELINE_CONFIG,
      SCAN_OUTPUT_DIR as Symbol tokens. grouping-service uses GROUPING_CONFIG. This is the
      correct NestJS pattern for injecting non-class values. Extending this to port tokens
      (e.g., VIDEO_REPOSITORY_PORT = Symbol('IVideoRepository')) is the natural evolution
      for DIP compliance.
    evidence:
      - source: packages/vdf-scan-service/src/injection-tokens.ts
        field: exports
        value: "export const VDF_SCAN_CONFIG = Symbol('VDF_SCAN_CONFIG'); export const SCAN_OUTPUT_DIR = Symbol('SCAN_OUTPUT_DIR')"
      - source: packages/pipeline-service/src/injection-tokens.ts
        field: exports
        value: "export const PIPELINE_CONFIG = Symbol('PIPELINE_CONFIG'); export const SCAN_OUTPUT_DIR = Symbol('SCAN_OUTPUT_DIR')"

  - id: DECISION-LCC-004
    decision: >
      Preserve the typed custom error class convention (extend Error, set this.name,
      optionally set this.cause) and keep error classes co-located with the code
      that throws them. Do not create a top-level errors/ directory.
    rationale: >
      The pattern is consistent and the co-location makes it easy to find the error
      class relative to its throw site. The refactor must not relocate error classes
      or rename them — the behavior contract prohibits changing observable error types
      at consumer-facing boundaries.
    evidence:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: error classes
        value: "VideoAlreadyStagedError, StagingPermanentFailureError — defined in same file as handler"
      - source: packages/staging-service/src/infrastructure/file-staging.adapter.ts
        field: error classes
        value: "S3ObjectNotFoundError — defined in same file as adapter"

  - id: DECISION-LCC-005
    decision: >
      Preserve the plainToInstance + class-validator + buildConfig() config pattern.
      The refactor must not change config loading semantics. Each service retains its
      own config module; the pipeline-service uses a unified PipelineConfig.
    rationale: >
      The pattern is identical across all four service packages. It provides runtime
      validation of environment variables at startup, which is a production-grade practice
      that must be retained. It is allowed to change internal interface field names during
      refactor.
    evidence:
      - source: packages/staging-service/src/config.ts
        field: pattern
        value: "plainToInstance(EnvironmentVariables, process.env, { enableImplicitConversion: true }); validateSync()"
      - source: packages/grouping-service/src/config.ts
        field: pattern
        value: "identical to staging-service pattern"

  - id: DECISION-LCC-006
    decision: >
      Preserve the per-class NestJS Logger instantiation convention.
      All classes that need logging must declare private readonly logger = new Logger(ClassName.name).
    rationale: >
      100% adoption across all services. The pattern scopes log output to the class name,
      which is essential for production log filtering. It is cheap to maintain and must
      not be replaced with a custom logger injection pattern during this refactor.
    evidence:
      - source: packages/staging-service/src/application/stage-video.handler.ts
        field: field declaration
        value: "private readonly logger = new Logger(StageVideoHandler.name)"
      - source: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        field: field declaration
        value: "private readonly logger = new Logger(ScanOrchestrator.name)"

  - id: DECISION-LCC-007
    decision: >
      Preserve the Mongoose .lean<T>().exec() pattern on all read operations.
      No repository method should return a hydrated Mongoose document — all reads
      must return plain typed objects.
    rationale: >
      The pattern is consistently applied across all repositories and prevents
      accidental reliance on Mongoose document methods in application/domain code.
      It is a production-grade practice that improves performance and prevents
      framework leakage into application logic.
    evidence:
      - source: packages/staging-service/src/infrastructure/video.repository.ts
        field: findByVideoId
        value: ".lean<VideoDocument>().exec()"
      - source: packages/vdf-scan-service/src/infrastructure/batch-claimer.service.ts
        field: candidates query
        value: ".lean<{ videoId: string }[]>().exec()"

  - id: DECISION-LCC-008
    decision: >
      Preserve the SIGTERM/SIGINT graceful shutdown pattern in all service main.ts files.
      The refactor must not remove or restructure these handlers.
    evidence:
      - source: packages/staging-service/src/main.ts
        field: process.on handlers
        value: "process.on('SIGTERM', ...) and process.on('SIGINT', ...) calling app.close()"

  - id: DECISION-LCC-009
    decision: >
      Preserve the ack/nack error classification pattern in transport consumers as a
      formalized convention. All new consumers introduced during refactor must follow:
      AlreadyDone error -> ack (idempotent), PermanentFailure error -> nack(false, false),
      transient error -> nack(false, false) (let RMQ dead-letter routing handle retry).
    rationale: >
      The pattern is consistent in VideoReadyConsumer and ScanCompletedConsumer across
      both standalone services and pipeline-service submodules. It correctly handles
      idempotency, permanent failures, and transient errors without requeue loops.
    evidence:
      - source: packages/staging-service/src/transport/video-ready.consumer.ts
        field: handle() error handling
        value: "VideoAlreadyStagedError -> ack, StagingPermanentFailureError -> nack(false,false), other -> nack(false,false)"
      - source: packages/grouping-service/src/consumers/scan-completed.consumer.ts
        field: handle() error handling
        value: "ScanAlreadyGroupedError -> ack, ScanResultValidationError -> nack(false,false), other -> nack(false,false)"

  - id: DECISION-LCC-010
    decision: >
      The shared package barrel export pattern (nested index.ts per sub-module, re-exported
      from root index.ts) should be preserved. If new sub-modules are added during refactor
      (e.g., a ports/ sub-folder in shared), they must follow the same barrel pattern.
    rationale: >
      The pattern keeps import paths clean (@gunea-pig/shared for all shared types)
      and prevents consumers from importing from deep internal paths.
    evidence:
      - source: packages/shared/src/index.ts
        field: exports
        value: "export * from './types'; export * from './db'; export * from './queue'; export * from './storage'; export * from './logger'"

evidence_refs:
  - ref: packages/staging-service/src/
    section: complete folder and file listing
    consumed_by: layer_naming_and_file_naming_convention_identification
  - ref: packages/grouping-service/src/
    section: complete folder and file listing
    consumed_by: layer_naming_and_file_naming_convention_identification
  - ref: packages/vdf-scan-service/src/injection-tokens.ts
    section: Symbol token declarations
    consumed_by: injection_token_convention
  - ref: packages/pipeline-service/src/injection-tokens.ts
    section: Symbol token declarations
    consumed_by: injection_token_convention
  - ref: packages/staging-service/src/config.ts
    section: buildConfig pattern
    consumed_by: config_convention
  - ref: packages/shared/src/index.ts
    section: barrel export structure
    consumed_by: shared_package_barrel_convention

triggers_emitted: []

gate_result:
  gate_id: gate.codebase_reconnaissance.output
  status: pending
  note: Gate result is produced by the gate subsystem via run_gate_check route — not authored here.

detected_conventions:
  - id: CONV-001
    name: Layered folder structure (domain/application/infrastructure/transport)
    category: file_structure
    status: formalize
    description: >
      All services use domain/, application/, infrastructure/, and transport/ (or consumers/)
      folders. This is the primary scaffold for DIP port placement during refactor.
    recommendation: >
      Formalize as required structure. Add ports/ sub-folder within application/ or
      at the service root for interface declarations during refactor.
    packages_following: [staging-service, grouping-service, vdf-scan-service, pipeline-service]
    packages_violating: []

  - id: CONV-002
    name: Kebab-case file naming with role suffix
    category: naming
    status: preserve
    description: >
      Files are named {domain-term}.{role}.ts — e.g., video-staging.policy.ts,
      stage-video.handler.ts, video.repository.ts, file-staging.adapter.ts.
    recommendation: >
      Preserve. New interface/port files should follow *.port.ts or use the existing
      *.ts naming with an I-prefix on the interface name inside the file.
    packages_following: [all]
    packages_violating: []

  - id: CONV-003
    name: Symbol injection tokens for value providers
    category: dependency_injection
    status: elevate
    description: >
      Config objects and string values use Symbol-based injection tokens declared
      in injection-tokens.ts. Class-based injection uses the class constructor as token.
    recommendation: >
      Elevate: extend Symbol token pattern to interface/port injection. Declare port
      tokens alongside interface declarations. Example:
      export const VIDEO_REPOSITORY_PORT = Symbol('IVideoRepository').
    packages_following: [vdf-scan-service, grouping-service, pipeline-service]
    packages_violating: [staging-service — no injection-tokens.ts file; providers use class tokens only]

  - id: CONV-004
    name: Typed custom error classes with co-location
    category: error_handling
    status: preserve
    description: >
      Error classes extend Error, set this.name = ClassName, optionally set this.cause.
      Defined in the same file as the code that throws them.
    recommendation: >
      Preserve. Do not relocate error classes to a top-level errors/ directory.
    packages_following: [all]
    packages_violating: []

  - id: CONV-005
    name: EnvironmentVariables + class-validator + buildConfig() config pattern
    category: configuration
    status: preserve
    description: >
      Each service declares an EnvironmentVariables class with @IsString/@IsInt decorators,
      validates via plainToInstance + validateSync, and returns a typed config interface.
    recommendation: >
      Preserve. May introduce a shared base for common env vars (MONGODB_URI, RABBITMQ_URL,
      S3_* cluster) if the consolidation phase determines it reduces repetition safely.
    packages_following: [staging-service, grouping-service, vdf-scan-service, pipeline-service]
    packages_violating: []

  - id: CONV-006
    name: Per-class NestJS Logger instantiation
    category: logging
    status: preserve
    description: >
      private readonly logger = new Logger(ClassName.name) declared in every class that logs.
    recommendation: >
      Preserve. Do not inject logger via constructor or abstract it away — it would
      require modifying all classes and adds no SOLID value.
    packages_following: [all]
    packages_violating: []

  - id: CONV-007
    name: Mongoose .lean<T>().exec() on all reads
    category: database_access
    status: preserve_and_enforce
    description: >
      All repository read operations use .lean<T>().exec() to return plain typed objects
      rather than Mongoose hydrated documents.
    recommendation: >
      Preserve and enforce. The refactor must not introduce any code that returns
      hydrated Mongoose documents to the application or domain layer.
    packages_following: [staging-service, grouping-service, vdf-scan-service, pipeline-service]
    packages_violating: []

  - id: CONV-008
    name: Graceful shutdown (SIGTERM/SIGINT) in main.ts
    category: lifecycle
    status: preserve
    description: >
      All main.ts files register SIGTERM and SIGINT handlers that call app.close()
      before process.exit(0).
    recommendation: >
      Preserve. Do not alter this pattern during the refactor.
    packages_following: [all]
    packages_violating: []

  - id: CONV-009
    name: Ack/Nack error classification in transport consumers
    category: transport_error_handling
    status: formalize
    description: >
      Transport consumers classify errors into: idempotent (ack), permanent failure
      (nack no-requeue), transient (nack no-requeue, rely on DLX). Pattern is consistent
      but not formally documented.
    recommendation: >
      Formalize. Any new consumer introduced during refactor must follow this exact
      classification. Consider extracting a ConsumerAckStrategy utility or base class.
    packages_following: [staging-service, grouping-service, pipeline-service-staging, pipeline-service-grouping]
    packages_violating: []

  - id: CONV-010
    name: Shared package barrel export (nested index.ts per sub-module)
    category: module_organization
    status: preserve
    description: >
      packages/shared/src/index.ts re-exports all sub-modules via export * from './subfolder'.
      Each sub-folder has its own index.ts barrel.
    recommendation: >
      Preserve. If a ports/ or interfaces/ sub-folder is added to shared during refactor,
      it must follow the same barrel pattern.
    packages_following: [shared]
    packages_violating: []
