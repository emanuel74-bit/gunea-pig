report_id: 01-active-context-manifest
phase_id: active_context_manifest
schema_version: "1.0"
status: complete

summary: >
  Active context manifest for mission vdf-video-similarity-pipeline using
  profile medium_feature. Captures the active convention files, phase plan,
  allowed agents, required reports, and lookup sources that downstream agents
  must reference throughout the mission.

inputs_consumed:
  - source: .ai/reports/report-registry.yaml
    type: report_registry
    notes: >
      18 required reports registered for medium_feature profile. Report
      directory is .ai/reports/.

decisions:
  - decision_id: ACM-001
    decision_type: active_context_initialization
    selected_value: medium_feature_context_set
    reason_summary: >
      Active conventions, agent roster, and phase plan derived from
      medium_feature profile and the report registry. All agents that own
      required phases are included. Conditional agents (failure_analysis_agent,
      repair_agent) included because their phases are in the conditional_phases
      list and may activate during execution.
    evidence: .ai/reports/report-registry.yaml, .ai/reports/00-mission-profile.yaml

evidence_refs:
  - .ai/reports/report-registry.yaml
  - .ai/reports/00-mission-profile.yaml
  - conventions/agents/conventions.agent-phase-ownership.yaml

triggers_emitted: []

gate_result:
  gate_id: gate.active_context_manifest.output
  status: pass
  failures: []

active_conventions:
  core:
    - core/conventions.file-contract.yaml
    - core/conventions.pipeline-contract.yaml
    - core/conventions.index.yaml
    - core/conventions.validation.yaml
  missions:
    - missions/conventions.mission-profiles.yaml
  phases:
    - phases/conventions.phase-contracts.yaml
    - phases/conventions.phase-taxonomy.yaml
    - phases/conventions.phase-lifecycle.yaml
  agents:
    - agents/conventions.agent-contracts.yaml
    - agents/conventions.agent-permissions.yaml
    - agents/conventions.agent-phase-ownership.yaml
    - agents/conventions.agent-prompts.yaml
    - agents/conventions.agent-activation-policy.yaml
  executors:
    - executors/conventions.executor-routes.yaml
    - executors/conventions.executor-contract.yaml
    - executors/conventions.executor-lifecycle.yaml
  reports:
    - reports/conventions.report-registry.yaml
    - reports/conventions.report-artifacts.yaml
    - reports/conventions.report-schemas.yaml
    - reports/conventions.report-templates.yaml
    - reports/conventions.report-taxonomy.yaml
    - reports/conventions.runtime-artifacts.yaml
  multi_agent:
    - multi-agent/conventions.phase-bundle-policy.yaml
  gates:
    - gates/conventions.gate-taxonomy.yaml
  triggers:
    - triggers/conventions.trigger-taxonomy.yaml
  claude_code:
    - claude-code/conventions.claude-code.yaml
    - claude-code/conventions.claude-execution-harness.yaml
    - claude-code/conventions.claude-route-invocation.yaml
    - claude-code/conventions.claude-native-integration.yaml

active_phase_plan:
  profile: medium_feature
  gate_strictness: strict
  ordered_phases:
    - mission_profile_selection
    - mission_initialization
    - active_context_manifest
    - phase_accounting
    - local_alignment
    - boundary_contract_classification
    - dependency_classification
    - call_site_impact_analysis
    - change_impact_analysis
    - behavior_contract
    - codebase_reconnaissance
    - architecture_decomposition
    - draft_role_pass
    - pattern_pressure_detection
    - artifact_reuse_analysis
    - artifact_action_resolution
    - final_role_assignment
    - pattern_selection
    - structure_rendering
    - test_derivation
    - implementation_sequence
    - checkpoint_validation_plan
    - pre_implementation_gate
    - implementation
    - post_implementation_validation
    - trigger_review
    - report_artifact_validation
    - final_validation
  conditional_phases:
    - refactor_strategy_selection
    - failure_classification
    - feedback_repair
  forbidden_phases: []

allowed_agents:
  - agent_id: alpha_controller
    phases:
      - mission_profile_selection
      - mission_initialization
      - active_context_manifest
      - phase_accounting
      - trigger_review
      - report_artifact_validation
  - agent_id: behavior_agent
    phases:
      - behavior_contract
  - agent_id: reconnaissance_agent
    phases:
      - codebase_reconnaissance
      - local_alignment
  - agent_id: classification_agent
    phases:
      - risk_classification
      - boundary_contract_classification
      - dependency_classification
  - agent_id: architecture_agent
    phases:
      - architecture_decomposition
  - agent_id: role_agent
    phases:
      - draft_role_pass
      - final_role_assignment
  - agent_id: pattern_agent
    phases:
      - pattern_pressure_detection
      - pattern_selection
  - agent_id: artifact_action_agent
    phases:
      - artifact_reuse_analysis
      - artifact_action_resolution
  - agent_id: impact_agent
    phases:
      - call_site_impact_analysis
      - change_impact_analysis
  - agent_id: structure_agent
    phases:
      - structure_rendering
  - agent_id: testing_agent
    phases:
      - test_derivation
  - agent_id: execution_planning_agent
    phases:
      - implementation_sequence
      - checkpoint_validation_plan
  - agent_id: pre_implementation_gate_agent
    phases:
      - pre_implementation_gate
  - agent_id: implementation_agent
    phases:
      - implementation
  - agent_id: validation_agent
    phases:
      - post_implementation_validation
      - final_validation
  - agent_id: failure_analysis_agent
    phases:
      - failure_classification
    activation: conditional
  - agent_id: repair_agent
    phases:
      - feedback_repair
    activation: conditional

required_reports:
  - report_id: mission-profile
    path: .ai/reports/00-mission-profile.yaml
    status: produced
  - report_id: report-registry
    path: .ai/reports/report-registry.yaml
    status: produced
  - report_id: active-context-manifest
    path: .ai/reports/01-active-context-manifest.yaml
    status: in_progress
  - report_id: behavior-contract
    path: .ai/reports/02-behavior-contract.yaml
    status: pending
  - report_id: codebase-reconnaissance
    path: .ai/reports/03-codebase-reconnaissance.yaml
    status: pending
  - report_id: risk-classification
    path: .ai/reports/risk-classification.yaml
    status: pending
  - report_id: architecture-blueprint
    path: .ai/reports/architecture-blueprint.yaml
    status: pending
  - report_id: artifact-candidates
    path: .ai/reports/artifact-candidates.yaml
    status: pending
  - report_id: artifact-actions
    path: .ai/reports/05-artifact-actions.yaml
    status: pending
  - report_id: test-plan
    path: .ai/reports/09-test-plan.yaml
    status: pending
  - report_id: implementation-sequence
    path: .ai/reports/10-implementation-sequence.yaml
    status: pending
  - report_id: checkpoint-validation-plan
    path: .ai/reports/checkpoint-validation-plan.yaml
    status: pending
  - report_id: pre-implementation-gate
    path: .ai/reports/pre-implementation-gate.yaml
    status: pending
  - report_id: changed-file-manifest
    path: .ai/reports/changed-file-manifest.yaml
    status: pending
  - report_id: implementation-result
    path: .ai/reports/implementation-result.yaml
    status: pending
  - report_id: post-implementation-validation
    path: .ai/reports/post-implementation-validation.yaml
    status: pending
  - report_id: report-artifact-validation
    path: .ai/reports/report-artifact-validation.yaml
    status: pending
  - report_id: validation-summary
    path: .ai/reports/99-validation-summary.yaml
    status: pending

lookup_sources:
  - id: system_requirements
    path: docs/system-requirements.md
    purpose: Primary mission request — VDF-Based Video Similarity Pipeline spec
  - id: mission_profile
    path: .ai/reports/00-mission-profile.yaml
    purpose: Selected profile, gate strictness, phase plan seed
  - id: report_registry
    path: .ai/reports/report-registry.yaml
    purpose: Report paths, owners, lifecycle states
  - id: phase_contracts
    path: conventions/phases/conventions.phase-contracts.yaml
    purpose: Per-phase input/output/gate/handoff requirements
  - id: agent_phase_ownership
    path: conventions/agents/conventions.agent-phase-ownership.yaml
    purpose: Authoritative agent-to-phase assignments
  - id: executor_routes
    path: conventions/executors/conventions.executor-routes.yaml
    purpose: Route IDs and script contracts for all executor calls
  - id: mission_profiles
    path: conventions/missions/conventions.mission-profiles.yaml
    purpose: Profile definitions including required phases and reports

runtime_packs:
  - pack_id: mission_control
    agents: [alpha_controller]
    conventions:
      - core/conventions.pipeline-contract.yaml
      - missions/conventions.mission-profiles.yaml
      - phases/conventions.phase-contracts.yaml
      - reports/conventions.report-registry.yaml
  - pack_id: planning_design
    agents: [behavior_agent, reconnaissance_agent, classification_agent, architecture_agent, role_agent, pattern_agent, artifact_action_agent, impact_agent]
    conventions:
      - phases/conventions.phase-contracts.yaml
      - reports/conventions.report-schemas.yaml
      - reports/conventions.report-templates.yaml
  - pack_id: implementation_execution
    agents: [structure_agent, testing_agent, execution_planning_agent, pre_implementation_gate_agent, implementation_agent]
    conventions:
      - phases/conventions.phase-contracts.yaml
      - reports/conventions.report-schemas.yaml
  - pack_id: validation_repair
    agents: [validation_agent, failure_analysis_agent, repair_agent]
    conventions:
      - phases/conventions.phase-contracts.yaml
      - reports/conventions.report-schemas.yaml

produced_outputs:
  - .ai/reports/01-active-context-manifest.yaml
