lookup_sources:
  - source_type: validated_phase_bundle
    description: >
      The primary context source for any phase agent. Alpha generates and validates
      the phase bundle before activating the owning agent. The bundle contains only
      selected records relevant to the active phase — phase contract, ownership, gate
      refs, handoff requirements, executor routes, and output templates. Agents must
      not load full convention packages or full topology outputs.
    path_pattern: conventions/.ai/bundles/phases/**/*.bundle.yaml
    resolution_rule: consume the bundle named for the active phase_id and owner_agent only

  - source_type: executor_route_result
    description: >
      Script-produced outputs from executor route invocations. These are the
      authoritative artifacts for gate results, handoff packets, validation results,
      phase reports, and evidence indexes. Agents consume route results — they do not
      author these artifacts directly.
    path_pattern: conventions/.ai/validation/**/*.yaml
    resolution_rule: read route result written by the executor after route invocation

  - source_type: specific_convention_slice
    description: >
      When a phase bundle explicitly references a convention file section, the agent
      may read only that named section. Full convention package scanning is prohibited.
      Convention files are located under conventions/ and identified by the
      allowed_convention_refs field in the phase bundle.
    path_pattern: conventions/**/*.yaml
    resolution_rule: read only sections listed in the phase bundle allowed_convention_refs field

  - source_type: prior_phase_report
    description: >
      Reports produced by prior phases and registered in the report registry. Agents
      may consume prior reports when declared as required_inputs in their phase contract.
      Reports live under conventions/.ai/reports/ and are indexed in report-registry.yaml.
    path_pattern: conventions/.ai/reports/**/*.yaml
    resolution_rule: consume only reports declared as required_inputs in the active phase bundle

runtime_packs:
  - pack_id: executor_routes
    description: Active executor routes available for route-backed artifact production
    convention_ref: executors/conventions.executor-routes.yaml
    active_routes:
      - route_id: collect_phase_report
        executor_type: report
        script: scripts/collect-phase-report.ts
        lifecycle_hook: after_phase_output
      - route_id: generate_phase_bundle
        executor_type: generator
        script: scripts/generate-phase-bundle.ts
        lifecycle_hook: before_phase_start
      - route_id: prepare_agent_handoff
        executor_type: handoff
        script: scripts/prepare-agent-handoff.ts
        lifecycle_hook: before_handoff
      - route_id: run_gate_check
        executor_type: gate
        script: scripts/run-gate-check.ts
        lifecycle_hook: on_gate_check
      - route_id: validate_phase_bundle
        executor_type: validation
        script: scripts/validate-phase-bundle.ts
        lifecycle_hook: before_phase_start
      - route_id: validate_phase_output
        executor_type: validation
        script: scripts/validate-phase-output.ts
        lifecycle_hook: after_phase_output
      - route_id: validate_semantic_completeness
        executor_type: validation
        script: scripts/validate-semantic-completeness.ts
        lifecycle_hook: after_phase_output
      - route_id: validate_changed_files
        executor_type: validation
        script: scripts/validate-changed-files.ts
        lifecycle_hook: after_phase_output
      - route_id: collect_evidence
        executor_type: evidence
        script: scripts/collect-evidence.ts
        lifecycle_hook: after_phase_output
      - route_id: validate_report_evidence
        executor_type: validation
        script: scripts/validate-report-evidence.ts
        lifecycle_hook: after_evidence_collection

  - pack_id: report_templates
    description: Active report templates for phase output authoring
    convention_ref: reports/conventions.report-templates.yaml
    active_templates:
      - template_id: phase_report_template
        applies_to: all_phase_reports
      - template_id: gate_result_template
        applies_to: gate_results
      - template_id: evidence_index_template
        applies_to: evidence_indexes
      - template_id: handoff_packet_template
        applies_to: handoff_packets
      - template_id: revision_task_template
        applies_to: revision_tasks
