report_id: "01-active-context-manifest"
phase_id: active_context_manifest
status: complete
summary: >
  Active context manifest produced for the large_refactor mission. All 32 phases are
  enumerated with their owner agents and status. Convention files in scope, allowed agents,
  required reports, lookup sources, and runtime packs are fully declared. This manifest
  is the canonical context reference for all phase agents operating in this mission.
  Gate result is pending gate subsystem evaluation.

inputs_consumed:
  - source: .ai/reports/report-registry.yaml
    artifact: report_registry
  - source: conventions/.ai/bundles/phases/mission/active_context_manifest.bundle.yaml
    artifact: phase_context_bundle

decisions:
  - id: DECISION-001
    decision: Enumerate all 32 phases from the large_refactor profile with owner agents and statuses
    rationale: >
      The active_phase_plan must list every required phase with its owner agent so that
      Alpha and downstream agents can resolve ownership and current progress without
      scanning the full convention package. Phases 1-3 are marked complete based on
      mission execution history. Phase 4 (phase_accounting) is the next pending phase.
    evidence:
      - source: conventions/.ai/bundles/phases/mission/active_context_manifest.bundle.yaml
        field: selected_records.phase_contract
      - source: .ai/reports/report-registry.yaml
        field: produced_reports

  - id: DECISION-002
    decision: Declare lookup_sources as validated phase bundles, executor route results, and specific convention slices only
    rationale: >
      The phase bundle policy mandates that agents consume bundles and specific convention
      slices, not full convention packages or full topology outputs. Lookup sources must
      reflect this discipline to prevent context bloat and unauthorized convention scanning.
    evidence:
      - source: conventions/.ai/bundles/phases/mission/active_context_manifest.bundle.yaml
        field: agent_consumption_model

  - id: DECISION-003
    decision: Declare runtime_packs from required_executor_routes and report template conventions
    rationale: >
      The executor routes listed in the phase bundle and the report template convention
      file define the active runtime packs. These are the only route-backed tools agents
      may use to produce artifacts.
    evidence:
      - source: conventions/.ai/bundles/phases/mission/active_context_manifest.bundle.yaml
        field: required_executor_routes
      - source: reports/conventions.report-templates.yaml
        no_evidence_marker: file exists at standard convention path

evidence_refs:
  - ref: .ai/reports/report-registry.yaml
    section: expected_reports
    consumed_by: required_reports_population
  - ref: .ai/reports/report-registry.yaml
    section: produced_reports
    consumed_by: active_phase_plan_status_assignment
  - ref: conventions/.ai/bundles/phases/mission/active_context_manifest.bundle.yaml
    section: selected_records.phase_contract
    consumed_by: phase_scope_validation
  - ref: conventions/.ai/bundles/phases/mission/active_context_manifest.bundle.yaml
    section: agent_consumption_model
    consumed_by: lookup_sources_declaration
  - ref: conventions/.ai/bundles/phases/mission/active_context_manifest.bundle.yaml
    section: required_executor_routes
    consumed_by: runtime_packs_declaration

triggers_emitted: []

gate_result:
  gate_id: gate.active_context_manifest.output
  status: pending
  note: Gate result is produced by the gate subsystem via run_gate_check route — not authored here.

