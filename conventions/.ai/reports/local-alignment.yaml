report_id: local-alignment
phase_id: local_alignment
schema_version: "1.0"
status: complete

summary: >
  Greenfield project. No pre-existing local implementation conventions to conflict with
  global/ecosystem standards. All 12 convention candidates from local-convention-candidates.yaml
  have been assessed against global NestJS ecosystem conventions and technology constraints
  from system-requirements.md. No conflicts detected. All candidates are classified as
  globally compatible. Decisions recorded below form the local convention baseline that
  downstream phases (architecture_decomposition, structure_rendering, implementation) must
  follow.

inputs_consumed:
  - source: .ai/reports/03-codebase-reconnaissance.yaml
    type: codebase_reconnaissance
  - source: .ai/reports/local-convention-candidates.yaml
    type: local_convention_candidates

decisions:
  - decision_id: LA-001
    decision_type: local_convention_baseline
    selected_value: no_conflicts_all_candidates_globally_compatible
    reason_summary: >
      Zero existing implementation files. No legacy conventions to conflict with
      global NestJS ecosystem standards. All 12 candidates are decided below
      and will form the authoritative local convention baseline.
    evidence: .ai/reports/03-codebase-reconnaissance.yaml (CR-006)

alignment_records:
  - candidate_id: CC-001
    category: project_structure
    description: Monorepo vs. polyrepo
    global_convention: >
      NestJS ecosystem supports both. For multiple independently deployable services
      sharing the same domain, a flat monorepo with npm workspaces is the standard
      greenfield choice — avoids cross-repo coordination overhead while keeping services
      independently versioned and deployable.
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      Flat monorepo with npm workspaces. Three service packages:
      packages/video-scan-staging/, packages/vdf-batch-scanner/, packages/similarity-grouping/.
      Shared types in packages/shared-types/ if needed. Root package.json owns workspace
      configuration. Each service package has its own package.json, tsconfig.json, and
      NestJS application bootstrap.
    rationale: >
      Single repo simplifies cross-service type sharing (RabbitMQ message schemas,
      scan state enums, shared DTOs) without publishing packages. Each service remains
      independently buildable and deployable.

  - candidate_id: CC-002
    category: typescript_configuration
    description: TypeScript compiler options
    global_convention: >
      NestJS requires strict: true in tsconfig.json. Target ES2021 or ES2022 is safe on
      Node.js 18. module: commonjs (NestJS CLI default). experimentalDecorators: true and
      emitDecoratorMetadata: true are mandatory for NestJS decorators. strictPropertyInitialization
      may be relaxed to false for NestJS module patterns.
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      Base tsconfig.json at root: strict: true, target: ES2021, module: commonjs,
      experimentalDecorators: true, emitDecoratorMetadata: true,
      strictPropertyInitialization: false. Each service extends the root tsconfig.
    rationale: NestJS decorator requirements mandate experimentalDecorators and emitDecoratorMetadata.

  - candidate_id: CC-003
    category: code_style
    description: Linting and formatting
    global_convention: >
      NestJS CLI scaffolds with @nestjs/eslint-config extending @typescript-eslint/recommended.
      Prettier as formatter with printWidth: 100, singleQuote: true, trailingComma: all.
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      ESLint with @typescript-eslint/recommended + @typescript-eslint/eslint-plugin.
      Prettier with: printWidth: 100, singleQuote: true, trailingComma: 'all', semi: true.
      Root .eslintrc.js and .prettierrc applied to all packages via workspace root config.
    rationale: Standard NestJS project scaffolding defaults.

  - candidate_id: CC-004
    category: testing_framework
    description: Test runner and file co-location
    global_convention: >
      NestJS projects use Jest as the default test runner with ts-jest transformer.
      Unit tests co-located as *.spec.ts files next to the source files they test.
      E2E tests in a separate test/ directory per service (test/*.e2e-spec.ts).
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      Jest with ts-jest. Unit tests co-located as *.spec.ts files. E2E tests in
      <service>/test/*.e2e-spec.ts. Coverage threshold configured per service in jest.config.ts.
    rationale: NestJS default; no reason to deviate on greenfield.

  - candidate_id: CC-005
    category: naming_conventions
    description: File and class naming
    global_convention: >
      NestJS convention: kebab-case file names (video-scan-staging.service.ts).
      Suffix-based naming: .module.ts, .service.ts, .controller.ts, .repository.ts,
      .consumer.ts, .producer.ts, .schema.ts, .dto.ts, .spec.ts.
      Class names: PascalCase matching the file name without extension suffix
      (VideoScanStagingService, ScanStateSchema).
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      Enforce NestJS kebab-case file naming with suffix convention throughout all three
      services. Class names PascalCase. Domain-first prefix for service-specific modules
      (e.g., staging.module.ts, scan-batch.module.ts, grouping.module.ts).
    rationale: NestJS standard; enables consistent tooling and IDE navigation.

  - candidate_id: CC-006
    category: environment_configuration
    description: Environment variable management and validation
    global_convention: >
      @nestjs/config with ConfigService provides environment variable loading.
      class-validator + class-transformer on a config DTO enforces types and presence
      at startup, failing fast on misconfigured environments.
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      @nestjs/config + class-validator for all three services. Each service defines a
      typed config DTO validated at startup. All similarity thresholds, RabbitMQ URLs,
      MongoDB URIs, S3 endpoints, and VDF path configuration pass through config DTO.
      Environment variable names: SCREAMING_SNAKE_CASE.
    rationale: >
      Fulfills NFR requirement for configurable thresholds without code changes.
      Startup validation prevents silent misconfiguration in production.

  - candidate_id: CC-007
    category: rabbitmq_client
    description: RabbitMQ client library and acknowledgment strategy
    global_convention: >
      @nestjs/microservices with RMQ transport is the canonical NestJS approach for
      RabbitMQ consumers/producers. For scenarios requiring fine-grained ack control
      (manual ack, dead-letter, nack on failure), amqplib via amqp-connection-manager
      provides lower-level access. At-least-once delivery with manual ack is the
      required pattern for state-machine-driven pipeline work.
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      amqplib via amqp-connection-manager wrapped in NestJS custom providers. Manual
      acknowledgment for all consumers (VSS, SGS). Exchange topology, queue names,
      and routing keys configurable via environment variables (defaults: conventional
      names defined during architecture). Dead-letter exchange configured per queue.
    rationale: >
      @nestjs/microservices RMQ transport abstracts ack/nack control in ways that
      conflict with idempotency (VSS-I-001, SGS-I-001) and scan-state machine requirements.
      Manual ack with amqplib gives explicit control over message acknowledgment after
      state transitions complete.

  - candidate_id: CC-008
    category: mongodb_client
    description: MongoDB client library
    global_convention: >
      @nestjs/mongoose with Mongoose ODM is the standard NestJS MongoDB integration.
      Provides schema definition, validation, and repository abstraction.
      Native MongoDB driver (@nestjs/mongoose wraps it) supports findOneAndUpdate
      with atomic conditions required for CAS batch claiming.
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      @nestjs/mongoose with Mongoose. Schema-per-document-type pattern (ScanStateSchema,
      ScanBatchClaimSchema, SimilarityEdgeSchema, SimilarityGroupSchema).
      findOneAndUpdate with condition objects for atomic state machine transitions.
      Write concern: majority for state machine writes.
    rationale: >
      Fulfills VBS-C-001/C-002 batch claim atomicity and VBS-F-006 state machine
      requirements. Mongoose schema validation at application layer complements MongoDB
      write concerns.

  - candidate_id: CC-009
    category: s3_client
    description: S3-compatible storage client
    global_convention: >
      @aws-sdk/client-s3 (AWS SDK v3, modular) is the standard for S3-compatible
      storage. Supports configurable endpoint for non-AWS S3 providers (MinIO, Ceph, etc.).
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      @aws-sdk/client-s3 with configurable endpoint (S3_ENDPOINT env var) for
      S3-compatible storage. Credentials via AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
      or IAM role. Used in VSS (download video from staging bucket) and VBS (upload
      normalized scan results).
    rationale: Ecosystem standard; configurable endpoint supports non-AWS S3 providers.

  - candidate_id: CC-010
    category: logging
    description: Structured logging library
    global_convention: >
      NestJS built-in Logger supports structured logging but lacks production-grade
      JSON output. pino with nestjs-pino (@nestjs/pino) provides structured JSON
      logging with async context propagation. Supports correlation_id, video_id,
      scan_id as log context fields per NFR-004.
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      nestjs-pino (@nestjs/pino) for all three services. Log context fields: video_id,
      scan_id, correlation_id always present when available (set from RabbitMQ message
      headers or MongoDB document). Log level controlled via LOG_LEVEL env var.
    rationale: >
      Fulfills NFR-004 structured error logging requirement with video_id, scan_id,
      correlation_id context. pino is significantly faster than winston for high-throughput
      pipeline logging.

  - candidate_id: CC-011
    category: health_checks
    description: Health check endpoint
    global_convention: >
      @nestjs/terminus provides the standard NestJS /health endpoint with pluggable
      health indicators for MongoDB, RabbitMQ, disk, and memory.
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      @nestjs/terminus with /health endpoint on all three services. Indicators:
      MongooseHealthIndicator (MongoDB connectivity), custom RabbitMQ connectivity check.
      Port: configurable (default 3000 per service, distinct ports for local dev).
    rationale: Fulfills NFR-005 health check endpoint requirement.

  - candidate_id: CC-012
    category: node_version
    description: Node.js version pinning
    global_convention: >
      .nvmrc file in project root pinning the exact Node.js version. Package engines
      field enforcing the constraint. package-lock.json or npm-shrinkwrap.json
      committing exact dependency versions.
    local_signal: none (greenfield)
    conflict: false
    alignment_status: decided
    decision: >
      .nvmrc at monorepo root: 18.8.0. Root package.json engines: { node: ">=18.8.0 <19" }.
      npm as package manager (npm workspaces). package-lock.json committed.
    rationale: Node.js 18.8.0 pinned per system-requirements.md section 1.

global_alignment_summary:
  total_candidates: 12
  conflicts_detected: 0
  all_compatible: true
  greenfield_baseline_established: true

local_convention_baseline:
  project_structure: monorepo with npm workspaces, 3 service packages + optional shared-types
  typescript: strict mode, CommonJS, ES2021 target, NestJS decorators enabled
  linting: ESLint + @typescript-eslint/recommended + Prettier
  testing: Jest + ts-jest, co-located *.spec.ts, e2e in service test/
  naming: kebab-case files, PascalCase classes, NestJS suffix convention
  env_config: "@nestjs/config + class-validator DTO, SCREAMING_SNAKE_CASE vars"
  messaging: amqplib + amqp-connection-manager, manual ack, configurable topology
  mongodb: "@nestjs/mongoose + Mongoose, write concern majority for state writes"
  s3: "@aws-sdk/client-s3, configurable endpoint"
  logging: nestjs-pino, structured JSON, video_id/scan_id/correlation_id context
  health: "@nestjs/terminus /health endpoint on all services"
  node_version: "18.8.0, pinned in .nvmrc and package.json engines"

alignment_gaps:
  - gap: UN-002_monorepo_structure
    description: >
      Resolved: npm workspaces flat monorepo with 3 service packages decided here.
      Architecture_decomposition must define exact package boundaries and inter-package
      type sharing strategy.
    status: resolved_in_local_alignment
  - gap: UN-001_vdf_cli_interface
    description: >
      VDF CLI output format remains unresolved. Normalization layer in VBS must isolate
      this — adapter pattern required. To be addressed in architecture_decomposition.
    status: deferred_to_architecture
  - gap: UN-003_rabbitmq_exchange_topology
    description: >
      Exchange/queue names and routing key strategy deferred to architecture_decomposition.
      Naming convention defaults: exchange per message type, queue per consumer service.
    status: deferred_to_architecture

triggers_emitted: []

gate_result:
  gate_id: gate.local_alignment.output
  status: pass
  failures: []

produced_outputs:
  - .ai/reports/local-alignment.yaml
