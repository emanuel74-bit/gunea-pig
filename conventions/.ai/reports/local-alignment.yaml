triggers_emitted: []

gate_result:
  gate_id: gate.local_alignment.output
  status: pending
  note: "Gate result is produced by the gate subsystem via run_gate_check route — not authored here."

compatible_local_conventions:
  - convention_id: CONV-001
    description: >
      Layered folder structure: domain/, application/, infrastructure/, transport/
      (or consumers/) used consistently across all service packages and pipeline-service
      submodules.
    global_alignment_basis: >
      Maps directly to Clean Architecture layer boundaries. Authority matrix LOCAL-AUTH-003
      (file_naming_or_folder_style, local_when_not_conflicting) applies. Does not weaken
      any global dependency direction or role responsibility rule.
    keep_decision: keep_and_formalize
    extension_required: >
      A ports/ or application/ports/ sub-folder must be added during the refactor for
      interface/port declarations. This is an additive extension, not a change to the
      existing structure.

  - convention_id: CONV-002
    description: >
      Kebab-case file naming with semantic role suffix: *.handler.ts, *.repository.ts,
      *.adapter.ts, *.policy.ts, *.consumer.ts, *.service.ts, *.module.ts, etc.
    global_alignment_basis: >
      Authority matrix LOCAL-AUTH-003. 100% adoption. Does not conflict with global
      naming rules. New port/interface files must follow *.port.ts or standard *.ts with
      I-prefixed interface names.
    keep_decision: keep

  - convention_id: CONV-003
    description: >
      Symbol injection tokens for value providers (config objects, path strings) declared
      in injection-tokens.ts files.
    global_alignment_basis: >
      Authority matrix LOCAL-AUTH-003. NestJS-specific pattern, global conventions are
      framework-agnostic and do not prescribe DI token strategy. The pattern strengthens
      decoupling and is the correct vehicle for port injection tokens.
    keep_decision: keep_and_elevate
    elevation: >
      Extend to interface/port tokens. Each DIP port must have a Symbol token declared
      alongside or near the port interface declaration.

  - convention_id: CONV-004
    description: >
      Typed custom error classes extending Error with this.name set, co-located in the
      same file as the code that throws them.
    global_alignment_basis: >
      Authority matrix LOCAL-AUTH-003. Error co-location is a local style convention that
      does not conflict with any global rule. Behavior contract forbids renaming consumer-
      facing error types — this convention supports that constraint.
    keep_decision: keep

  - convention_id: CONV-005
    description: >
      EnvironmentVariables class with @IsString/@IsInt class-validator decorators,
      plainToInstance, validateSync, and typed buildConfig() function per service.
    global_alignment_basis: >
      Authority matrix LOCAL-AUTH-003. Production-grade startup validation. No global
      rule addresses config loading strategy. Pattern does not affect layer boundaries.
    keep_decision: keep

  - convention_id: CONV-006
    description: >
      Per-class NestJS Logger: private readonly logger = new Logger(ClassName.name)
      declared as a field in every class that emits logs.
    global_alignment_basis: >
      Authority matrix LOCAL-AUTH-003. NestJS-specific idiom. Global conventions are
      framework-agnostic. Logger injection via constructor is explicitly rejected as
      unnecessary complexity for this codebase.
    keep_decision: keep

  - convention_id: CONV-007
    description: >
      Mongoose .lean<T>().exec() on all repository read operations — returns plain
      typed objects rather than hydrated Mongoose documents.
    global_alignment_basis: >
      Aligns with global value-object immutability and application-layer isolation
      principles. Prevents framework-coupled objects from crossing layer boundaries.
      Authority matrix LOCAL-AUTH-003.
    keep_decision: keep_and_enforce

  - convention_id: CONV-008
    description: >
      Graceful shutdown via SIGTERM/SIGINT handlers in every main.ts calling app.close().
    global_alignment_basis: >
      Operational correctness requirement. Authority matrix LOCAL-AUTH-003. No global rule
      conflicts with this lifecycle pattern.
    keep_decision: keep

  - convention_id: CONV-009
    description: >
      Ack/nack error classification in RabbitMQ transport consumers: AlreadyDone -> ack,
      PermanentFailure -> nack(false,false), transient/unknown -> nack(false,false).
    global_alignment_basis: >
      Authority matrix LOCAL-AUTH-003. Global conventions do not prescribe consumer ack
      strategies. This is a correct and consistent local transport contract that should
      be formalized across all consumers.
    keep_decision: keep_and_formalize

  - convention_id: CONV-010
    description: >
      Shared package nested barrel exports: each sub-folder has its own index.ts,
      all re-exported from packages/shared/src/index.ts.
    global_alignment_basis: >
      Aligns with global module boundary conventions — prevents deep internal import paths
      and enforces clean public surface. Authority matrix LOCAL-AUTH-003.
    keep_decision: keep

conflicting_local_conventions:
  - convention_id: IMPL-CONFLICT-001
    description: >
      Application-layer handlers inject and depend on concrete infrastructure classes
      directly, with no TypeScript interface or port abstraction between layers. This
      is not a named explicit "convention" but is the de-facto structural pattern
      throughout the entire codebase: StageVideoHandler, ProcessScanHandler, and
      ScanOrchestrator all import and reference concrete repository, adapter, and
      client classes from their constructors.
    conflict_reason: >
      Violates DIP: application layer depends on infrastructure concretions rather than
      abstractions. Violates ISP: repository classes expose wide mixed-concern interfaces
      with no role-scoped narrowing. Authority matrix LOCAL-AUTH-001 (layer_direction,
      winner: global) and LOCAL-AUTH-002 (role_responsibility, winner: global) both
      assign the global convention system as the authoritative rule. This pattern allows
      a forbidden dependency direction (application -> concrete infrastructure) and creates
      mixed role responsibilities in repository classes. Conflict escalation rules
      LOCAL-CONFLICT-001 and LOCAL-CONFLICT-002 apply.
    resolution: >
      The refactor must introduce TypeScript interface declarations (ports) for every
      infrastructure dependency of every application-layer class. Each port interface
      must be placed in a ports/ sub-folder (within the service's application/ layer or
      at the service root). Concrete classes must implement the port interface. Application
      handlers must be updated to inject by Symbol token bound to the interface, not by
      concrete class token. Wide repository interfaces must be split into role-scoped
      ports (e.g., IVideoReadRepository vs IVideoWriteRepository) where ISP violations
      exist. S3Adapter and RabbitMQPublisher must each have a corresponding port interface
      (IStoragePort / IS3Client, IEventPublisherPort / IQueuePublisher).
    triggered_blocks:
      - dependency_validation_required
      - role_collision_possible
      - blocks: structure_rendering
      - blocks: pre_implementation_gate
      - blocks: final_role_assignment

alignment_decisions:
  - convention_id: CONV-001
    decision: keep_and_formalize
    rationale: >
      Fully compatible with global Clean Architecture layer model. Additive extension
      (ports/ sub-folder) required during refactor but does not alter existing structure.

  - convention_id: CONV-002
    decision: keep
    rationale: >
      100% adoption, no global conflict. New port files extend the naming pattern
      naturally (*.port.ts or I-prefixed interface names).

  - convention_id: CONV-003
    decision: adapt
    rationale: >
      Compatible but partially adopted (staging-service lacks injection-tokens.ts).
      Must be universalized and extended to port injection during the refactor.

  - convention_id: CONV-004
    decision: keep
    rationale: >
      Compatible with global rules and required by behavior contract constraint on
      observable error types. No change needed.

  - convention_id: CONV-005
    decision: keep
    rationale: >
      Compatible and production-grade. No change to config loading semantics permitted.

  - convention_id: CONV-006
    decision: keep
    rationale: >
      NestJS-specific idiom with 100% adoption. No global conflict. Logger injection
      via constructor explicitly rejected for this codebase.

  - convention_id: CONV-007
    decision: keep_and_enforce
    rationale: >
      Aligns with global layer isolation principles. Must be enforced on all new
      repository code introduced during the refactor — no hydrated documents
      may cross the infrastructure/application boundary.

  - convention_id: CONV-008
    decision: keep
    rationale: >
      Operational correctness. No global conflict. Must not be touched during refactor.

  - convention_id: CONV-009
    decision: adapt
    rationale: >
      Correct pattern, currently informal. Must be formalized as a required rule for
      all new consumers. Consider extracting a ConsumerAckStrategy utility class or
      base consumer to enforce it structurally.

  - convention_id: CONV-010
    decision: keep
    rationale: >
      Compatible with global module boundary conventions. Any new shared sub-folder
      must follow the barrel export pattern.

  - convention_id: IMPL-CONFLICT-001
    decision: supersede
    rationale: >
      The concrete-injection de-facto pattern is superseded by the global DIP/ISP
      authority. The refactor must introduce port interfaces for all application-layer
      infrastructure dependencies. This is the primary structural work of the mission.
      The conflict blocks structure rendering and pre-implementation gates until resolved.
