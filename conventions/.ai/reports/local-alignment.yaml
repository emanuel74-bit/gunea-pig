report_id: "local-alignment"
phase_id: local_alignment
status: complete
summary: >
  Ten local conventions were evaluated against the global convention system.
  Nine are compatible and will be kept as-is or lightly formalized.
  One introduces a structural gap — the complete absence of interface/port
  abstractions between application-layer handlers and their infrastructure
  dependencies — that directly conflicts with the global DIP/ISP authority.
  The primary conflict (no ports/interfaces) is the central driver of the
  SOLID refactor and must be resolved before structure rendering can proceed.
  All compatible conventions are preserved and two (Symbol injection tokens,
  ack/nack classification) are elevated to formalized status. No local
  convention is permitted to weaken a global authority rule.

inputs_consumed:
  - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
    artifact: codebase_reconnaissance
    fields_used:
      - local_conventions
      - boundary_signals
      - dependency_signals
      - decisions
  - source: conventions/.ai/reports/local-convention-candidates.yaml
    artifact: local_convention_candidates
    fields_used:
      - detected_conventions
      - decisions

decisions:
  - id: DECISION-LA-001
    decision: >
      Accept the layered folder structure (domain/application/infrastructure/transport)
      as a global-compatible local convention. Formalize it as the required layer
      scaffold for all services and pipeline-service submodules. A ports/ (or
      application/ports/) sub-folder must be added during the refactor for interface
      declarations — this extension is additive and does not conflict with existing structure.
    rationale: >
      The folder structure maps directly to Clean Architecture layer boundaries and
      is the assumed scaffold in global DDD/SOLID conventions. All five packages
      follow it consistently. Authority: LOCAL-AUTH-003 (file_naming_or_folder_style)
      is local_when_not_conflicting — this convention does not conflict. Decision rule
      LOCAL-ACCEPT-001 applies: evidenced, not conflicting, improves consistency.
    evidence:
      - ref: packages/staging-service/src/
        value: "domain/, application/, infrastructure/, transport/"
      - ref: packages/pipeline-service/src/
        value: "grouping/domain/, grouping/application/, grouping/infrastructure/, grouping/transport/"

  - id: DECISION-LA-002
    decision: >
      Accept the kebab-case role-suffix file naming convention without change.
      New port/interface files introduced by the refactor must follow *.port.ts
      or use an I-prefixed interface inside a *.ts file — either is compatible.
    rationale: >
      100% adoption across all source files. Authority: LOCAL-AUTH-003
      (file_naming_or_folder_style, local_when_not_conflicting). Decision rule
      LOCAL-ACCEPT-001 applies. The naming convention does not conflict with any
      global rule and improves searchability and role clarity.
    evidence:
      - ref: packages/staging-service/src/
        value: "video-staging.policy.ts, stage-video.handler.ts, video.repository.ts, file-staging.adapter.ts"

  - id: DECISION-LA-003
    decision: >
      Accept the Symbol injection token convention for value providers and elevate it
      to include port/interface injection tokens. Each DIP port introduced during the
      refactor must declare a matching Symbol token in the service's injection-tokens.ts.
      staging-service, which currently has no injection-tokens.ts, must create one.
    rationale: >
      The convention is already used in vdf-scan-service, grouping-service, and
      pipeline-service. It is the correct NestJS pattern for injecting non-class values
      and for decoupling application handlers from concrete class tokens. Authority:
      LOCAL-AUTH-003 (local_when_not_conflicting). This elevates the pattern from
      partial to universal adoption. Decision rule LOCAL-ACCEPT-001 applies.
    evidence:
      - ref: packages/vdf-scan-service/src/injection-tokens.ts
        value: "VDF_SCAN_CONFIG = Symbol('VDF_SCAN_CONFIG'), SCAN_OUTPUT_DIR = Symbol('SCAN_OUTPUT_DIR')"
      - ref: packages/pipeline-service/src/injection-tokens.ts
        value: "PIPELINE_CONFIG = Symbol('PIPELINE_CONFIG'), SCAN_OUTPUT_DIR = Symbol('SCAN_OUTPUT_DIR')"

  - id: DECISION-LA-004
    decision: >
      Accept the typed custom error class co-location convention. Error classes must
      remain in the same file as the code that throws them. No top-level errors/ directory
      shall be introduced.
    rationale: >
      100% adoption. The behavior contract prohibits changing observable error types at
      consumer-facing boundaries, so error class names must be preserved. Co-location
      makes throw sites and error definitions adjacent. Authority: LOCAL-AUTH-003
      (local_when_not_conflicting). Decision rule LOCAL-ACCEPT-001 applies.
    evidence:
      - ref: packages/staging-service/src/application/stage-video.handler.ts
        value: "VideoAlreadyStagedError, StagingPermanentFailureError — co-located in handler file"
      - ref: packages/staging-service/src/infrastructure/file-staging.adapter.ts
        value: "S3ObjectNotFoundError — co-located in adapter file"

  - id: DECISION-LA-005
    decision: >
      Accept the EnvironmentVariables + class-validator + buildConfig() config pattern.
      The refactor must not change config loading semantics or startup validation.
    rationale: >
      Identical pattern across all four service packages. Runtime environment variable
      validation at startup is a production-grade practice. The pattern does not conflict
      with any global convention. Authority: LOCAL-AUTH-003. Decision rule LOCAL-ACCEPT-001.
    evidence:
      - ref: packages/staging-service/src/config.ts
        value: "plainToInstance(EnvironmentVariables, process.env, { enableImplicitConversion: true }); validateSync()"
      - ref: packages/grouping-service/src/config.ts
        value: "identical pattern"

  - id: DECISION-LA-006
    decision: >
      Accept the per-class NestJS Logger instantiation convention.
      All classes that log must declare private readonly logger = new Logger(ClassName.name).
      Logger injection via constructor is not permitted in this codebase.
    rationale: >
      100% adoption. Scopes log output to class name for production log filtering.
      The pattern is NestJS-specific and does not conflict with global conventions
      (global conventions are framework-agnostic). Authority: LOCAL-AUTH-003.
      Decision rule LOCAL-ACCEPT-001 applies.
    evidence:
      - ref: packages/staging-service/src/application/stage-video.handler.ts
        value: "private readonly logger = new Logger(StageVideoHandler.name)"
      - ref: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        value: "private readonly logger = new Logger(ScanOrchestrator.name)"

  - id: DECISION-LA-007
    decision: >
      Accept and enforce the Mongoose .lean<T>().exec() discipline on all read queries.
      No repository method may return a hydrated Mongoose document to the application
      or domain layer. This must be enforced on all new repositories introduced during
      the refactor.
    rationale: >
      100% adoption in all existing repositories. Prevents Mongoose document methods from
      leaking into application/domain code — aligns with global value-object immutability
      and boundary isolation principles. Authority: LOCAL-AUTH-003. Decision rule
      LOCAL-ACCEPT-001 applies with a preserve_and_enforce recommendation.
    evidence:
      - ref: packages/staging-service/src/infrastructure/video.repository.ts
        value: ".lean<VideoDocument>().exec() on findByVideoId"
      - ref: packages/vdf-scan-service/src/infrastructure/batch-claimer.service.ts
        value: ".lean<{ videoId: string }[]>().exec() on candidates query"

  - id: DECISION-LA-008
    decision: >
      Accept the SIGTERM/SIGINT graceful shutdown pattern. All service main.ts files
      must continue to register both handlers. The refactor must not remove or restructure
      them.
    rationale: >
      100% adoption. This is an operational correctness requirement — RabbitMQ connections
      and Mongoose connections require graceful teardown. Not in conflict with any global rule.
      Authority: LOCAL-AUTH-003. Decision rule LOCAL-ACCEPT-001.
    evidence:
      - ref: packages/staging-service/src/main.ts
        value: "process.on('SIGTERM', ...) and process.on('SIGINT', ...) calling app.close()"

  - id: DECISION-LA-009
    decision: >
      Accept and formalize the ack/nack error classification pattern in transport consumers.
      All new RabbitMQ consumers introduced during the refactor must follow: AlreadyDone
      error type -> ack (idempotent skip), PermanentFailure error type -> nack(false, false),
      transient/unknown error -> nack(false, false) (rely on DLX routing for retry).
    rationale: >
      Consistent pattern across all consumer classes. Correctly handles idempotency,
      permanent failures, and transient errors without requeue loops. The global convention
      system does not prescribe consumer ack strategies, so the local pattern governs.
      Authority: LOCAL-AUTH-003. Decision rule LOCAL-ACCEPT-001 with a formalize recommendation.
    evidence:
      - ref: packages/staging-service/src/transport/video-ready.consumer.ts
        value: "VideoAlreadyStagedError -> ack, StagingPermanentFailureError -> nack(false,false), other -> nack(false,false)"
      - ref: packages/grouping-service/src/consumers/scan-completed.consumer.ts
        value: "ScanAlreadyGroupedError -> ack, ScanResultValidationError -> nack(false,false), other -> nack(false,false)"

  - id: DECISION-LA-010
    decision: >
      Accept the shared package nested barrel export pattern. Any new sub-folder added
      to packages/shared/src/ during the refactor (e.g., ports/, interfaces/) must follow
      the same pattern: nested index.ts barrel re-exported from the root index.ts.
    rationale: >
      The pattern keeps import paths clean and prevents deep-path internal imports.
      Aligns with global module boundary conventions. Authority: LOCAL-AUTH-003.
      Decision rule LOCAL-ACCEPT-001 applies.
    evidence:
      - ref: packages/shared/src/index.ts
        value: "export * from './types'; export * from './db'; export * from './queue'; export * from './storage'; export * from './logger'"

  - id: DECISION-LA-CONFLICT-001
    decision: >
      Classify the complete absence of interface/port abstractions at application-layer
      boundaries as a PRIMARY CONFLICT with global SOLID conventions (DIP, ISP).
      The refactor MUST introduce TypeScript interfaces as port declarations between
      application handlers and all infrastructure dependencies.
      This conflict blocks structure rendering and pre-implementation gates until resolved.
    rationale: >
      Application-layer handlers (StageVideoHandler, ProcessScanHandler, ScanOrchestrator)
      directly inject and depend on concrete infrastructure classes with no interface
      between them. This violates DIP (application depends on concretions, not abstractions)
      and ISP (wide repository classes with no role-scoped interfaces). Authority:
      LOCAL-AUTH-001 (layer_direction, winner: global) and LOCAL-AUTH-002
      (role_responsibility, winner: global) both apply. Decision rule LOCAL-REJECT-001
      activates: local convention (concrete-class injection) conflicts with global rule,
      creates mixed responsibility, and allows forbidden dependency direction (application
      -> infrastructure concretion). Conflict escalation rule LOCAL-CONFLICT-001 triggers
      dependency_validation_required and blocks structure_rendering and pre_implementation_gate.
      Conflict escalation rule LOCAL-CONFLICT-002 triggers role_collision_possible and
      blocks final_role_assignment.
    evidence:
      - ref: packages/staging-service/src/application/stage-video.handler.ts
        value: "constructor injects concrete VideoRepository and FileStagingAdapter — no interface"
      - ref: packages/grouping-service/src/application/process-scan.handler.ts
        value: "constructor injects six concrete infrastructure classes — no interfaces"
      - ref: packages/vdf-scan-service/src/application/scan.orchestrator.ts
        value: "constructor injects S3Adapter and RabbitMQPublisher as concrete classes — no IStoragePort or IEventPublisherPort"
      - ref: packages/shared/src/queue/rabbitmq.client.ts
        value: "no IQueuePublisher or IEventPublisher interface exists — application handlers depend on concretion"
      - ref: packages/shared/src/storage/s3.client.ts
        value: "no IS3Client or IStorageAdapter interface exists"

