    artifact: checkpoint_validation_plan
  - source: conventions/.ai/reports/10-implementation-sequence.yaml
    artifact: implementation_sequence
  - source: conventions/.ai/reports/checkpoint-groups.yaml
    artifact: checkpoint_groups

gate_decision: pass
implementation_allowed: true

implementation_constraint: >
  Implementation MUST begin with STEP-000 (write characterization tests).
  No production source file may be modified, created, moved, or deleted before
  all 29 characterization test spec files are written and all 37 test cases pass
  against the pre-refactor codebase (CHK-000). This constraint is a hard execution
  gate per BLOCK-RS-001 / SEQ-006 as recorded in 10-implementation-sequence.yaml
  and checkpoint-validation-plan.yaml.

