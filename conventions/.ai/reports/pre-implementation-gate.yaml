  scope_check:
    scope_is_greenfield: true
    implementation_allowed_currently: false
    reason_for_false: "pre_implementation_gate has not yet set implementation_allowed"
    authorization_granted_by: this_report

gate_findings:
  - finding_id: PIG-001
    type: confirmation
    description: All 27 required planning reports are present and complete
    severity: info

  - finding_id: PIG-002
    type: confirmation
    description: All prior gates passed — no blocked or failed gates in history
    severity: info

  - finding_id: PIG-003
    type: confirmation
    description: Greenfield project confirmed; no existing codebase interference risk
    evidence_ref: .ai/reports/03-codebase-reconnaissance.yaml#CR-001
    severity: info

  - finding_id: PIG-004
    type: confirmation
    description: Implementation sequence defines 5 waves with clear build order; shared-types first
    evidence_ref: .ai/reports/10-implementation-sequence.yaml#SEQ-C001
    severity: info

  - finding_id: PIG-005
    type: confirmation
    description: Checkpoint validation plan defines 5 checkpoints with wave-gated validation
    evidence_ref: .ai/reports/checkpoint-validation-plan.yaml
    severity: info

  - finding_id: PIG-006
    type: note
    description: >
      Implementation agent must follow wave sequence strictly. CG-002 is a hard gate —
      do not implement service code before shared-types tsc passes.
    severity: advisory

  - finding_id: PIG-007
    type: note
    description: >
      52 artifacts across 4 packages. 15 test obligations (TO-001 through TO-015).
      Integration tests require real MongoDB and RabbitMQ per local-alignment CC-004.
    severity: advisory

  - finding_id: PIG-008
    type: note
    description: >
      VDF CLI path is an external assumption (ARCH-ASMP-004). VdfCliAdapter must be
      configurable via VDF_CLI_PATH env var validated in VbsConfig.
    evidence_ref: .ai/reports/architecture-blueprint.yaml#ARCH-ASMP-004
    severity: advisory

implementation_constraints:
  must_follow_wave_order: true
  shared_types_must_compile_before_services: true
  vdf_cli_isolation_required: true
  mongodb_cas_for_state_transitions: true
  s3_before_rabbitmq_invariant: true
  manual_ack_required_for_amqplib: true
  no_nestjs_microservices_transport: true
  integration_tests_require_real_dependencies: true

authorization:
  implementation_allowed: true
  authorized_scope: all 52 artifacts in final-file-tree.yaml
  authorized_packages:
    - packages/shared-types
    - packages/vss-service
    - packages/vbs-service
    - packages/sgs-service
  forbidden_scope:
    - modification of convention system files
    - modification of .ai/reports/ (except implementation-produced test files)
  authorized_by: pre_implementation_gate_agent
  evidence_base: all gate results, all required reports, no blockers

triggers_emitted: []

gate_result:
  gate_id: gate.pre_implementation_gate.output
  status: pass
  decision: allow_transition

produced_outputs:
  - .ai/reports/pre-implementation-gate.yaml
