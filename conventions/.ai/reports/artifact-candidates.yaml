  - candidate_id: AC-001
    proposed_name: VideoReadyConsumer
    intent_ref: entry_intent
    capability_ref: CAP-001
    primary_layer: transport
    candidate_role_pressure: consumer
    reason: >
      Receives NewVideoReadyEvent from RabbitMQ and delegates to StageVideoHandler
      via command mapping. Current implementation is clean but must be reviewed
      to ensure it does not contain any inline business logic.
    inputs:
      - NewVideoReadyEvent (RabbitMQ AMQP message)
    outputs:
      - StageVideoCommand dispatched to StageVideoHandler
    side_effects: []
    existing_artifact_refs:
      - "staging-service/transport/video-ready.consumer.ts"
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#staging-service/transport/video-ready.consumer.ts"

  - candidate_id: AC-002
    proposed_name: StagingMessageValidator
    intent_ref: transformation_intent
    capability_ref: CAP-001
    primary_layer: transport
    candidate_role_pressure: validator
    reason: >
      Pure payload validation and parsing for the staging message. No I/O.
      Currently clean — no refactoring of logic required; file only needs
      to be confirmed as the single canonical validator (no inline duplicates).
    inputs:
      - raw RabbitMQ message payload (unknown shape)
    outputs:
      - validated StagingMessageDto
    side_effects: []
    existing_artifact_refs:
      - "staging-service/validators/staging-message.validator.ts"
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#staging-service/validators/staging-message.validator.ts"

