    proposed_name: ScanSchedulerTrigger
    intent_ref: entry_intent
    capability_ref: CAP-002
    primary_layer: transport
    candidate_role_pressure: scheduler_entry
    reason: >
      @Interval(30000) NestJS scheduler entry point. Single responsibility:
      invoke ScanOrchestrator.run(). Currently embedded in ScanOrchestrator
      itself — must be extracted into a dedicated transport-layer class so
      ScanOrchestrator has no knowledge of the scheduling mechanism.
    inputs:
      - NestJS @Interval(30000) tick
    outputs:
      - ScanOrchestrator.run() invoked
    side_effects: []
    existing_artifact_refs:
      - "vdf-scan-service/application/scan.orchestrator.ts"
    evidence_refs:
      - "03-codebase-reconnaissance.yaml#vdf-scan-service/application/scan.orchestrator.ts"
      - "risk-classification.yaml#SRP_violation_7_responsibilities"

  - candidate_id: AC-010
    proposed_name: ScanOrchestrator
    intent_ref: orchestration_intent
    capability_ref: CAP-002
    primary_layer: application
    candidate_role_pressure: orchestrator
    reason: >
      Coordinates the full VDF scan use-case. Current monolith has 7 mixed
      responsibilities. Must be decomposed to: claim batch via IBatchClaimerPort,
      run VDF via IVdfRunnerPort, normalize via VdfManifestNormalizer, upload
      via IStoragePort, emit via IEventPublisher, cleanup via ScanPurgerService.
      Each step delegates; orchestrator itself has no SDK imports.
    inputs:
      - void (triggered by ScanSchedulerTrigger)
    outputs:
      - void (all effects via ports)
    side_effects:
      - batch claimed
      - VDF CLI invoked
      - result uploaded to S3
      - ScanCompletedEvent published
      - expired artifacts deleted
    existing_artifact_refs:
