report_id: "05-artifact-actions"
phase_id: artifact_action_resolution
status: complete
summary: >
  Binding artifact action decisions for all 48 candidates across CAP-001 (video_staging),
  CAP-002 (vdf_scanning), CAP-003 (video_similarity_grouping), and shared cross-capability
  infrastructure.

  Action distribution (48 total):
    create_new:           12 candidates (all 12 port interfaces — no existing abstraction anywhere)
    modify_existing:      25 candidates (concrete repositories, adapters, consumers, handlers,
                          validators, schema modules, NestJS module wiring)
    split_existing:        2 candidates (ScanOrchestrator AC-010, ProcessScanHandler AC-023)
    extract_from_existing: 1 candidate  (ScanSchedulerTrigger AC-009, from ScanOrchestrator)
    reuse_existing:        5 candidates (VideoStagingPolicy AC-004, BatchClaimPolicy AC-011,
                          ScanCleanupPolicy AC-012, SimilarityThresholdPolicy AC-024,
                          UnionFindDomainService AC-025)

  Action families:
    non_change:           5  (reuse_existing)
    additive_change:     12  (create_new)
    in_place_change:     25  (modify_existing)
    decomposition_change: 3  (split_existing x2, extract_from_existing x1)
    consolidation_change: 0
    lifecycle_change:     0

  No create_new candidates exist outside the 12 confirmed port interfaces.
  No existing artifact was deemed insufficient — all modify_existing verdicts are supported
  by confirmed existing_artifact_present reuse verdicts with canonical pipeline-service targets.
  The split/extract decomposition cluster (AC-009, AC-010, AC-023) is consistent with the
  workflow_pressure (PP-003) detected in pattern-pressure.yaml.
  The 12 create_new port actions are consistent with adapter_boundary_pressure (PP-001)
  and confirm zero existing port abstractions in the codebase.

inputs_consumed:
  - source: conventions/.ai/reports/artifact-reuse-analysis.yaml
    artifact: artifact_reuse_analysis
  - source: conventions/.ai/reports/pattern-pressure.yaml
    artifact: pattern_pressure

decisions:
  - id: DECISION-AA-001
    decision: >
      All 12 port interface candidates receive create_new. No reuse_existing, modify_existing,
      or any other action is applicable because zero port/interface abstractions exist anywhere
      in the codebase.
    rationale: >
      DECISION-RA-001 (artifact-reuse-analysis) establishes: "Zero port/interface abstractions
      exist anywhere in the codebase. All 12 port interface candidates are new artifacts with
      no existing match to reuse, modify, or extract from." Reconnaissance DECISION-RECON-006
      confirms: "No TypeScript interface exists between any application handler and its
      dependencies." boundary_signals state "No formal ports/interfaces directory exists
      anywhere." All 12 candidates have existing_artifacts_found: [] and
      reuse_verdict: no_existing_artifact. Priority order places create_new LAST but specifies
      it is appropriate when "no existing artifact owns the responsibility" — confirmed here.
    evidence:
      - source: conventions/.ai/reports/artifact-reuse-analysis.yaml
        field: decisions[DECISION-RA-001].evidence[0].value
        value: "No formal ports/interfaces directory exists anywhere."
      - source: conventions/.ai/reports/artifact-reuse-analysis.yaml
        field: decisions[DECISION-RA-001].rationale
        value: "Reconnaissance DECISION-RECON-006 confirms: No TypeScript interface exists between any application handler and its dependencies."
      - source: conventions/.ai/reports/pattern-pressure.yaml
        field: detected_pressures[PP-001].positive_signals_matched[2]
        value: "zero port/interface abstractions currently exist — 13 DIP violations confirmed"

  - id: DECISION-AA-002
    decision: >
      ScanOrchestrator (AC-010) and ProcessScanHandler (AC-023) receive split_existing.
      ScanSchedulerTrigger (AC-009) receives extract_from_existing sourced from ScanOrchestrator.
      These are the only two split_existing and one extract_from_existing in the entire
      candidate set.
    rationale: >
      Reuse analysis recommended split_existing for both AC-010 and AC-023 based on their
      mixed_responsibility flags. Collision rule modify_vs_extract applies: "prefer extract/split
      when modify would add second responsibility." For AC-010 (7 responsibilities) and AC-023
      (6 responsibilities), applying modify_existing would force a second+ responsibility onto the
      surviving artifact — split is required. ScanSchedulerTrigger (AC-009) is extract_from_existing
      because it does not exist as a standalone file — only one subresponsibility is pulled out
      (scheduling concern) while the primary orchestration role survives in ScanOrchestrator.
      split_vs_extract collision rule: "split when source has multiple peer responsibilities;
      extract when one subresponsibility is pulled out keeping source's primary role." Both rules
      are satisfied by the selected actions.
    evidence:
      - source: conventions/.ai/reports/artifact-reuse-analysis.yaml
        field: reuse_analysis[AC-010].recommended_action_hint
        value: "split_existing"
      - source: conventions/.ai/reports/artifact-reuse-analysis.yaml
        field: reuse_analysis[AC-023].recommended_action_hint
        value: "split_existing"
      - source: conventions/.ai/reports/artifact-reuse-analysis.yaml
        field: reuse_analysis[AC-009].recommended_action_hint
        value: "extract_from_existing"
      - source: conventions/.ai/reports/pattern-pressure.yaml
        field: detected_pressures[PP-003].evidence[0].observation
        value: "ScanOrchestrator mixed_responsibility_flag=true, extraction_target=true, 7 co-located responsibilities"

  - id: DECISION-AA-003
    decision: >
      All 4 domain policy classes and UnionFindDomainService (AC-004, AC-011, AC-012, AC-024,
      AC-025) receive reuse_existing (mapped from reuse_as_is hint). No code-level change is
      applied to these artifacts. The reuse_existing action is a non_change family action.
    rationale: >
      DECISION-RA-004 and DECISION-RA-010 confirm all 5 are clean artifacts with
      solid_violations: [] and reuse_verdict: existing_artifact_present. The priority order
      places reuse_existing second (after no_code_change). These artifacts are already correct —
      the consuming artifacts (StageVideoHandler, BatchClaimerService, ScanPurgerService,
      ProcessScanHandler) must reference them correctly post-refactor, but the policy/domain
      service files themselves require no modification.
    evidence:
      - source: conventions/.ai/reports/artifact-reuse-analysis.yaml
        field: decisions[DECISION-RA-004].evidence[0].value
        value: "Domain policy classes are the only truly clean, isolated units in the codebase."
      - source: conventions/.ai/reports/artifact-reuse-analysis.yaml
        field: decisions[DECISION-RA-010].evidence[0].value
        value: "relevant_artifacts[union-find.domain-service.ts].solid_violations: []"

  - id: DECISION-AA-004
    decision: >
      All 25 remaining existing artifacts (consumers, handlers, validators, repositories, adapters,
      schema modules, NestJS modules) receive modify_existing. No wrap_existing, replace_existing,
      or rename_existing is applied except where noted for S3StorageAdapter (AC-037).
    rationale: >
      Collision rules evaluated: wrap_vs_modify — "prefer wrap when boundary/external interface
      adaptation is primary concern." For all 5 adapters, the primary concern is implementing a
      port interface on an existing concrete class, not introducing a new boundary layer over an
      unchanged external shape. The existing adapter bodies are the canonical target files;
      modify_existing correctly captures adding an interface implementation and DI token registration
      without creating a wrapper shell. create_vs_reuse collision not triggered because all 25
      have reuse_verdict: existing_artifact_present with canonical pipeline-service targets.
      For S3StorageAdapter (AC-037), rename is implicit in the modify action (S3Adapter -> S3StorageAdapter
      at the canonical path) — this is captured as a modify_existing note, not a separate rename_existing
      action, because the rename happens at the canonical pipeline-service target path where the file
      has already been placed under the new name per the reuse analysis target path.
    evidence:
      - source: conventions/.ai/reports/artifact-reuse-analysis.yaml
        field: decisions[DECISION-RA-002].decision
        value: "Pipeline-service is the canonical modification target for all existing concrete classes."
      - source: conventions/.ai/reports/pattern-pressure.yaml
        field: detected_pressures[PP-001].candidate_pattern_families[0]
        value: "PortsAndAdapters"

