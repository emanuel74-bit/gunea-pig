report_id: "05-artifact-actions"
phase_id: artifact_action_resolution
schema_version: "1.0"
status: complete
authority: binding

summary: >
  Binding artifact action table for all 49 artifact candidates. All actions are
  create_new (greenfield project — no existing artifacts). Name resolution for
  6 use_case orchestrators: NestJS convention favors keeping ".service.ts" suffix
  even when role is use_case, to avoid confusion with framework consumers. Final
  names retain original proposed names (e.g., StagingService, BatchClaimService)
  with use_case role applied internally. Pattern: NoPattern (from pattern-pressure.yaml).

inputs_consumed:
  - source: .ai/reports/artifact-reuse-analysis.yaml
    type: artifact_reuse_analysis
  - source: .ai/reports/pattern-pressure.yaml
    type: pattern_pressure

name_resolution:
  decision_id: ACT-NAME-001
  topic: "Use_case artifacts: file suffix"
  resolution: >
    Retain ".service.ts" suffix for use_case role orchestrators per NestJS community
    convention. NestJS developers expect orchestration classes with ".service.ts" suffix
    even when the role is use_case. Changing to ".use-case.ts" would be a convention
    deviation requiring team alignment; greenfield context allows the pragmatic choice.
    Role assignment remains use_case in the role table; only the file name is pragmatic.
  affected_artifacts: [AC-VSS-003, AC-VBS-003, AC-VBS-006, AC-VBS-010, AC-VBS-016, AC-SGS-003]
  evidence_refs:
    - .ai/reports/local-alignment.yaml#CC-001
    - .ai/reports/04-draft-role-signals.yaml#MR-001

schema_placement_resolution:
  decision_id: ACT-SCHEMA-001
  topic: ScanStateSchema placement
  resolution: >
    ScanStateSchema definition lives in packages/shared-types as a single source of
    truth. Both VSS and VBS import it from shared-types. This avoids mirroring drift
    between services. The schema is pure Mongoose type definition with no service-specific
    logic, making shared-types the correct home.
  affected_artifacts: [AC-VSS-013, AC-VSS-007, AC-VBS-013]
  evidence_refs:
    - .ai/reports/04-draft-role-signals.yaml#ROLE-COLLISION-SCAN-STATE-REPO
    - .ai/reports/architecture-blueprint.yaml#ARCH-ASMP-005

