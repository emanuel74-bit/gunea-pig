report_id: "08-final-role-assignment"
phase_id: final_role_assignment
status: complete
authority: binding
summary: >
  Final binding role assignments for all 51 post-action artifact candidates.
  Role distribution: 12 port, 6 repository, 3 adapter (FileStagingAdapter, VdfRunnerAdapter,
  S3StorageAdapter), 1 client (ScanResultClient), 1 publisher (RabbitMQPublisher),
  4 schema, 4 policy, 2 validator, 2 consumer, 2 handler (StageVideoHandler, ProcessScanHandler),
  1 orchestrator (ScanOrchestrator), 1 scheduler (ScanSchedulerTrigger),
  2 service (BatchClaimerService, ScanPurgerService), 1 normalizer (VdfManifestNormalizer),
  1 domain_service (UnionFindDomainService), 5 module.
  Total: 51 candidates assigned.
  Collisions resolved: 5 (see role-collision-resolution.yaml).

inputs_consumed:
  - source: conventions/.ai/reports/05-artifact-actions.yaml
    artifact: artifact_action_table
  - source: conventions/.ai/reports/post-action-artifact-candidates.yaml
    artifact: post_action_candidates

decisions:
  - id: DECISION-FR-001
    decision: >
      Assign role=client to ScanResultClient (PAC-027), overriding the post-action candidate
      intended_role of adapter.
    rationale: >
      client_vs_adapter collision: ScanResultClient's primary responsibility is retrieving
      external VDF scan result data from S3 (S3 JSON retrieval and NormalizedScanResult
      deserialization). Client responsibility is primary over adapter. The naming (ScanResultClient)
      and the responsibility description ("S3 JSON retrieval and NormalizedScanResult
      deserialization") both confirm client semantics as the dominant concern.
    evidence:
      - source: conventions/.ai/reports/post-action-artifact-candidates.yaml
        field: post_action_candidates[PAC-027].intended_role
        value: "adapter (draft — overridden to client by collision resolution)"
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: artifact_action_table[AC-027].desired_responsibility
        value: "Adapter implementing IScanResultLoader: S3 JSON retrieval and NormalizedScanResult deserialization"

  - id: DECISION-FR-002
    decision: >
      Assign role=publisher to RabbitMQPublisher (PAC-039), overriding the post-action
      candidate intended_role of adapter.
    rationale: >
      publisher_vs_producer collision: RabbitMQPublisher publishes domain-level integration
      messages using amqplib channel.publish() with exchange/routing-key topology. Publisher
      responsibility is primary — it emits named domain events to named exchanges with semantic
      routing. The naming (RabbitMQPublisher) confirms publisher semantics as the dominant concern.
    evidence:
      - source: conventions/.ai/reports/post-action-artifact-candidates.yaml
        field: post_action_candidates[PAC-039].intended_role
        value: "adapter (draft — overridden to publisher by collision resolution)"
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: artifact_action_table[AC-039].desired_responsibility
        value: "Adapter implementing IEventPublisher: amqplib channel.publish() wrapper with topology from QUEUE_EXCHANGES/ROUTING_KEYS constants"

  - id: DECISION-FR-003
    decision: >
      Assign role=orchestrator to ScanOrchestrator (PAC-010) with family application_execution.
    rationale: >
      Post-split ScanOrchestrator retains multi-step scan flow coordination as its sole
      responsibility. Orchestrator is the correct and more specific role over service because
      the primary concern is coordinating a multi-step pipeline (claim batch, dispatch VDF scan,
      load results, upload S3, emit event, cleanup) across multiple port-backed collaborators.
    evidence:
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: artifact_action_table[AC-010].desired_responsibility
        value: "Multi-step scan flow coordinator: claim batch, dispatch VDF scan, load results, upload S3, emit event, cleanup"

  - id: DECISION-FR-004
    decision: >
      Assign role=handler to ProcessScanHandler (PAC-023) with family application_execution.
    rationale: >
      Post-split ProcessScanHandler handles a dispatched scan processing request end-to-end
      (load scan results, filter by threshold, persist edges/groups, update batch, publish event).
      Handler responsibility is primary — it receives a dispatch and executes the application
      use-case flow. The handler role is more specific than use_case because the artifact is
      directly triggered by a consumer delegation, not by an external command boundary.
    evidence:
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: artifact_action_table[AC-023].desired_responsibility
        value: "Application handler: load scan results, filter by threshold, persist edges/groups, update batch, publish event"

  - id: DECISION-FR-005
    decision: >
      Assign role=service to BatchClaimerService (PAC-014) with family application_execution.
    rationale: >
      service_vs_orchestrator collision: BatchClaimerService coordinates atomic MongoDB batch
      claiming — a single-operation service boundary. It does not orchestrate a multi-step
      workflow across multiple collaborators. Service responsibility is primary.
    evidence:
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: artifact_action_table[AC-014].desired_responsibility
        value: "Service implementing IBatchClaimerPort: atomic MongoDB batch claim coordination"

  - id: DECISION-FR-006
    decision: >
      Resolve IVideoSimilarityRepository (PAC-032) ISP split as a single unified interface.
      No IVideoSimilarityReader+IVideoSimilarityWriter split is applied in this phase.
    rationale: >
      The post-action candidate file deferred the ISP split decision to final_role_assignment.
      VideoSimilarityRepository has five mixed-concern methods, but ProcessScanHandler (the
      primary consumer) requires both read and write operations within the same transactional
      flow. Splitting into reader+writer interfaces would require ProcessScanHandler to inject
      two ports for one conceptual collaboration, increasing wiring complexity without a
      meaningful boundary benefit. The single IVideoSimilarityRepository interface is assigned
      role=port. Future ISP refinement can be applied at the structure rendering phase if
      consumer analysis reveals independent read/write consumers.
    evidence:
      - source: conventions/.ai/reports/post-action-artifact-candidates.yaml
        field: post_action_candidates[PAC-032].notes
        value: "ISP split decision (single IVideoSimilarityRepository vs IVideoSimilarityReader+IVideoSimilarityWriter) deferred to final_role_assignment phase."

