report_id: "structure-plan"
phase_id: structure_rendering
status: complete
authority: binding
summary: >
  Structural decisions for PortsAndAdapters refactor of packages/pipeline-service/src/.
  Density mode: role_grouped for all 3 capability subdomains (staging, scanning, grouping)
  and shared-infra. 51 role-assigned artifacts placed into layer-aligned subfolders.
  12 new port interface files require new interfaces/ subfolders in each capability root
  and shared-infra root. No speculative shared code introduced. No files deleted in scope.
  Folder creation is strictly evidence-driven: every new folder hosts at least one artifact
  from the binding role assignment table.

inputs_consumed:
  - source: conventions/.ai/reports/08-final-role-assignment.yaml
    artifact: role_assignment_table
    artifact_count: 51
  - source: conventions/.ai/reports/role-collision-resolution.yaml
    artifact: collisions_resolved
    collision_count: 5
  - source: conventions/.ai/reports/pattern-decision-log.yaml
    artifact: selected_pattern
    value: PortsAndAdapters

# ─────────────────────────────────────────────────────────────────────────
# DENSITY MODE SELECTION
# ─────────────────────────────────────────────────────────────────────────

density_mode_selection:
  rule_applied: role_grouped_threshold
  threshold_criteria:
    artifact_count_threshold: 7
    role_family_count_threshold: 3
  subdomains:
    - subdomain: staging
      artifact_count: 10
      role_families: [consumer, handler, policy, validator, port, repository, adapter, schema, module]
      role_family_count: 9
      exceeds_flat_threshold: true
      density_mode: role_grouped
      evidence: "10 artifacts across 9 role families — exceeds flat threshold (>7, >3 families). role_grouped applied."
    - subdomain: scanning
      artifact_count: 16
      role_families: [scheduler, orchestrator, policy, validator, port, repository, adapter, client, normalizer, schema, service, module]
      role_family_count: 12
      exceeds_flat_threshold: true
      density_mode: role_grouped
      evidence: "16 artifacts across 12 role families — largest subdomain. role_grouped required."
    - subdomain: grouping
      artifact_count: 11
      role_families: [consumer, handler, policy, domain_service, port, repository, validator, schema, module]
      role_family_count: 9
      exceeds_flat_threshold: true
      density_mode: role_grouped
      evidence: "11 artifacts across 9 role families — exceeds flat threshold. role_grouped applied."
    - subdomain: shared_infra
      artifact_count: 6
      role_families: [port, adapter, publisher, repository, module]
      role_family_count: 5
      exceeds_flat_threshold: false
      density_mode: role_grouped
      evidence: "6 artifacts, 5 role families. role_grouped applied despite low count — @Global module requires port/adapter separation for PortsAndAdapters visibility."

# ─────────────────────────────────────────────────────────────────────────
# LAYER PLACEMENT RULES APPLIED
# ─────────────────────────────────────────────────────────────────────────

layer_placement_rules:
  - role: port
    role_family: architectural_boundary
    target_subfolder: interfaces/
    layer: boundary
    rationale: >
      Ports are DIP boundary contracts. interfaces/ is the canonical allowed subfolder
      for architectural boundary artifacts. Placement in interfaces/ separates contracts
      from implementations and is visible to application-layer consumers at a glance.
    artifacts: [PAC-005, PAC-007, PAC-013, PAC-015, PAC-018, PAC-026, PAC-028, PAC-030, PAC-032, PAC-034, PAC-036, PAC-038]

  - role: policy
    role_family: decision
    target_subfolder: domain/
    layer: domain
    rationale: >
      Policies encode pure domain rules — eligibility, expiry, staleness, threshold classification.
      domain/ is the correct layer home for decision-family artifacts. No infrastructure imports allowed.
    artifacts: [PAC-004, PAC-011, PAC-012, PAC-024]

  - role: validator
    role_family: domain_constraint
    target_subfolder: domain/
    layer: domain
    rationale: >
      Validators enforce payload shape and field constraints — domain_constraint family maps to
      domain/ layer. StagingMessageValidator (PAC-002) validates incoming AMQP payload shape;
      ScanResultValidator (PAC-022) validates NormalizedScanResult. Both are domain-level
      constraint artifacts with no infrastructure dependency.
    artifacts: [PAC-002, PAC-022]

  - role: domain_service
    role_family: domain_model
    target_subfolder: domain/
    layer: domain
    rationale: >
      UnionFindDomainService is a stateful domain algorithm (Union-Find graph for group merging).
      domain_model family maps to domain/ layer. No infrastructure imports allowed.
    artifacts: [PAC-025]

  - role: repository
    role_family: persistence_data
    target_subfolder: repositories/
    layer: infrastructure
    rationale: >
      Repositories implement port interfaces via Mongoose. repositories/ is the canonical
      allowed subfolder for persistence_data artifacts. Separation from adapters/ is correct
      because repositories are Mongoose-specific, not external system adapters.
    artifacts: [PAC-006, PAC-019, PAC-029, PAC-031, PAC-033, PAC-035]

  - role: adapter
    role_family: integration_boundary
    target_subfolder: adapters/
    layer: infrastructure
    rationale: >
      Adapters implement port interfaces via external system SDKs (AWS SDK, VDF CLI subprocess).
      adapters/ is the canonical allowed subfolder. S3StorageAdapter and RabbitMQPublisher
      go into shared-infra/adapters/ because they serve all capabilities via the @Global module.
    artifacts: [PAC-008, PAC-016, PAC-037]

  - role: normalizer
    role_family: transformation
    target_subfolder: adapters/
    layer: infrastructure
    rationale: >
      VdfManifestNormalizer performs pure string-to-struct transformation with no infrastructure
      concern — it is co-located in adapters/ alongside VdfRunnerAdapter because it operates on
      VDF CLI output data (integration boundary transformation). transformation family has no
      dedicated canonical subfolder; adapters/ is the correct placement as it operates at the
      infrastructure/integration layer within scanning.
    artifacts: [PAC-017]

  - role: client
    role_family: integration_boundary
    target_subfolder: clients/
    layer: infrastructure
    rationale: >
      ScanResultClient retrieves external VDF scan result data from S3. clients/ is the
      canonical allowed subfolder for integration_boundary retrieval artifacts. Separate from
      adapters/ to signal that the primary concern is data retrieval, not boundary adaptation.
    artifacts: [PAC-027]

  - role: publisher
    role_family: integration_boundary
    target_subfolder: adapters/
    layer: infrastructure
    rationale: >
      RabbitMQPublisher is placed in shared-infra/adapters/ because it implements IEventPublisher
      port and is registered in the @Global SharedInfraModule. No dedicated publishers/ subfolder
      exists in the allowed list — adapters/ is the correct placement for integration_boundary
      publisher artifacts in shared-infra.
    artifacts: [PAC-039]

  - role: schema
    role_family: persistence_data
    target_subfolder: schemas/
    layer: infrastructure
    rationale: >
      Mongoose schema + MongooseModule.forFeature registration units. schemas/ is the canonical
      allowed subfolder for persistence_data schema artifacts. Each schema is scoped to its
      capability subdomain (staging, scanning, grouping) to lock collection names per capability.
    artifacts: [PAC-040, PAC-041, PAC-042, PAC-043]

  - role: orchestrator
    role_family: application_execution
    target_subfolder: services/
    layer: application
    rationale: >
      ScanOrchestrator coordinates the multi-step scan pipeline. services/ is the canonical
      application layer subfolder for application_execution artifacts. No dedicated orchestrators/
      subfolder is in the allowed list — services/ hosts all application execution artifacts
      (orchestrator, scheduler, handler, service roles).
    artifacts: [PAC-010]

  - role: scheduler
    role_family: integration_async
    target_subfolder: services/
    layer: application
    rationale: >
      ScanSchedulerTrigger is extracted from ScanOrchestrator. It is an @Interval-driven
      application entry point. services/ is the correct placement — not consumers/ (consumers/
      is AMQP-driven) and not a dedicated schedulers/ folder (not in allowed list).
    artifacts: [PAC-009]

  - role: handler
    role_family: application_execution
    target_subfolder: services/
    layer: application
    rationale: >
      StageVideoHandler (PAC-003) and ProcessScanHandler (PAC-023) handle dispatched application
      flows. services/ hosts all application execution artifacts. handlers/ is not in the
      allowed subfolder list — services/ is the correct placement.
    artifacts: [PAC-003, PAC-023]

  - role: service
    role_family: application_execution
    target_subfolder: services/
    layer: application
    rationale: >
      BatchClaimerService (PAC-014) and ScanPurgerService (PAC-020) are application execution
      services. services/ is the canonical subfolder.
    artifacts: [PAC-014, PAC-020]

  - role: consumer
    role_family: integration_async
    target_subfolder: consumers/
    layer: infrastructure
    rationale: >
      VideoReadyConsumer (PAC-001) and ScanCompletedConsumer (PAC-021) receive and delegate
      AMQP messages. consumers/ is the canonical allowed subfolder for integration_async
      consumer artifacts. Separated from services/ to clearly delineate AMQP transport
      entry points from application logic.
    artifacts: [PAC-001, PAC-021]

  - role: module
    role_family: structural_framework
    target_subfolder: feature_root
    layer: framework
    rationale: >
      NestJS @Module files are placed at their capability feature root, not in a subfolder.
      staging.module.ts at staging/, scanning.module.ts at scanning/, etc.
      PipelineAppModule stays at src/ root (app.module.ts).
      SharedInfraModule stays at src/ root (shared-infra.module.ts).
    artifacts: [PAC-044, PAC-045, PAC-046, PAC-047, PAC-048]

