report_id: pattern-pressure
phase_id: pattern_pressure_detection
schema_version: "1.0"
status: complete
authority: advisory

summary: >
  Pattern pressure analysis for VDF pipeline — 49 artifact candidates across 3 NestJS
  services. NoPattern selected. All 6 pressure categories evaluated. No concrete,
  evidenced pressure justifies introducing a discrete design pattern. The architecture
  already addresses structural needs through role assignment (adapter, policy, factory,
  repository, use_case), NestJS DI, and the PortsAndAdapters architectural style
  baked into the architecture blueprint. Candidate patterns considered: PortsAndAdapters
  (already architectural style, not a discrete file pattern), State, Outbox, Inbox,
  Strategy, Pipeline — all rejected with evidence.

inputs_consumed:
  - source: .ai/reports/04-draft-role-signals.yaml
    type: draft_role_signals

no_pattern_selected: true
no_pattern_reason: >
  Direct role composition, NestJS DI, and the existing adapter + policy + factory
  role assignments are sufficient for all artifact candidates. No pressure category
  produces concrete, evidenced pressure requiring a discrete pattern to resolve.
  Pattern introduction would add structural overhead without solving a real problem.

selection_required_later: false

pressure_evaluation:

  - pressure_id: PPR-001
    pressure_type: creation_pressure
    evaluation: no_pressure
    signals_found: []
    counter_signals:
      - NestJS DI (via @Module providers) handles all object creation and resolution
      - SimilarityEdgeFactory is a domain factory role, not a design pattern — it is a single straightforward constructor/transformer with no variant branches
      - No call sites duplicate construction logic; NestJS container resolves all injected services
      - No family of related objects requiring consistent variant creation
    decision: no_pattern
    candidate_patterns_considered:
      - FactoryMethod
      - AbstractFactory
      - Builder
      - DependencyInjection
    rejected_patterns:
      - name: FactoryMethod
        reason: No concrete creation variation exists; single VDF adapter, single S3 adapter per service, no runtime-selected implementation branch
      - name: AbstractFactory
        reason: No product families with multiple interchangeable variants
      - name: Builder
        reason: No multi-step ordered construction chains across call sites; all DTOs are assembled in single steps
      - name: DependencyInjection
        reason: NestJS DI already provides this; introducing a separate DI pattern file would be redundant
    evidence_refs:
      - .ai/reports/artifact-candidates.yaml#AC-SGS-006
      - .ai/reports/local-alignment.yaml#CC-001

  - pressure_id: PPR-002
    pressure_type: strategy_variation_pressure
    evaluation: no_pressure
    signals_found: []
    counter_signals:
      - Each port has exactly one implementation (VdfCliAdapter, S3VideoDownloader, S3ScanResultWriter, S3ScanResultLoader, ScanCompletedPublisher)
      - No runtime variant selection required; configuration selects the same single adapter always
      - No multiple algorithms for the same intent; VDF is the only scanner, S3 is the only storage provider
      - Test variants will use NestJS override/mock injection, not a strategy interface
    decision: no_pattern
    candidate_patterns_considered:
      - Strategy
      - Policy
      - Specification
      - State
    rejected_patterns:
      - name: Strategy
        reason: No interchangeable algorithm variants exist; all adapters are singular implementations of their ports
      - name: Policy
        reason: Policy is already a role (ClaimOwnershipPolicy, StagingIdempotencyPolicy, GroupMergePolicy) — these are domain-layer pure decision objects, not a structural design pattern
      - name: Specification
        reason: No composable predicate chains needed; each policy returns a simple boolean or enum from a single check
      - name: State
        reason: Evaluated under state_lifecycle_pressure (PPR-005)
    evidence_refs:
      - .ai/reports/architecture-blueprint.yaml#PORT-VDF-SCANNER
      - .ai/reports/architecture-blueprint.yaml#PORT-STORAGE
      - .ai/reports/dependency-classification.yaml#DEP-011

  - pressure_id: PPR-003
    pressure_type: adapter_boundary_pressure
    evaluation: architectural_style_not_discrete_pattern
    signals_found:
      - External boundaries require isolation (VDF CLI via child_process, S3 via @aws-sdk/client-s3, RabbitMQ via amqplib)
      - Architecture explicitly uses PortsAndAdapters style (PORT-MESSAGING, PORT-STORAGE, PORT-VDF-SCANNER, PORT-VDF-NORMALIZER)
    counter_signals:
      - PortsAndAdapters is already the chosen architectural style in the architecture blueprint — it is implemented through adapter and port interface roles, not through a discrete design pattern file
      - All external boundary isolation is captured in adapter role assignments (VdfCliAdapter, S3VideoDownloader, VdfOutputNormalizerAdapter, etc.)
      - Adding an Adapter pattern file would duplicate what the adapter role already declares
    decision: no_pattern
    candidate_patterns_considered:
      - Adapter
      - AntiCorruptionLayer
      - Facade
      - DataMapper
      - PortsAndAdapters
    rejected_patterns:
      - name: PortsAndAdapters
        reason: Already the architectural style — implemented as adapter and port roles throughout the blueprint. Adding a pattern file would be redundant; the pressure is already resolved by role assignment.
      - name: Adapter
        reason: The adapter role IS the pattern at the file level; no structural wrapping pattern is needed beyond the role itself
      - name: AntiCorruptionLayer
        reason: VDF CLI output is normalized by VdfOutputNormalizerAdapter; SGS consumes NormalizedScanResult. No ACL needed beyond the existing adapter.
      - name: Facade
        reason: No complex subsystem with multiple entry points to hide; each service has a clean single-entry use_case per capability
      - name: DataMapper
        reason: Repositories already encapsulate Mongoose document mapping to domain objects; no discrete DataMapper pattern needed
    evidence_refs:
      - .ai/reports/architecture-blueprint.yaml#PORT-VDF-SCANNER
      - .ai/reports/architecture-blueprint.yaml#PORT-VDF-NORMALIZER
      - .ai/reports/dependency-classification.yaml#DV-001

  - pressure_id: PPR-004
    pressure_type: workflow_pressure
    evaluation: no_pressure
    signals_found:
      - Multiple ordered steps in each use_case (StagingUseCase, BatchClaimUseCase, ScanExecutionUseCase, ResultPublicationUseCase, ScanResultIngestionUseCase)
    counter_signals:
      - All workflows are flat sequential steps within a single use_case — no handler chain variation
      - No conditional branching that selects between alternative handlers
      - No partial failure compensation (VBS publishes after S3 write confirmed; no distributed saga needed — failures are nacked and retried)
      - All steps are local implementation details of one use_case with no extension pressure
      - Steps do not need to be independently replaced or tested as a pipeline
    decision: no_pattern
    candidate_patterns_considered:
      - Pipeline
      - ChainOfResponsibility
      - Command
      - Saga
      - TemplateMethod
    rejected_patterns:
      - name: Pipeline
        reason: No handler variation or replacement pressure; steps are fixed sequential operations within a single use_case boundary
      - name: ChainOfResponsibility
        reason: No handler chain where each handler may accept/reject/pass; processing is always sequential with all steps executed
      - name: Command
        reason: Command is already a role in the taxonomy; no queue-based command dispatch is needed — NestJS scheduler and RabbitMQ consumer act as entry points already
      - name: Saga
        reason: No distributed transaction compensation needed; failure handling is RabbitMQ nack + retry, not saga compensation
      - name: TemplateMethod
        reason: No template with varying sub-steps across services; each service's workflow is independent and complete
    evidence_refs:
      - .ai/reports/artifact-candidates.yaml#AC-VSS-003
      - .ai/reports/artifact-candidates.yaml#AC-VBS-003
      - .ai/reports/artifact-candidates.yaml#AC-VBS-006
      - .ai/reports/artifact-candidates.yaml#AC-VBS-010
      - .ai/reports/artifact-candidates.yaml#AC-SGS-003

  - pressure_id: PPR-005
    pressure_type: state_lifecycle_pressure
    evaluation: no_pressure
    signals_found:
      - 10-state scan state machine (awaiting_staging → staged → claimed → scanning → scan_complete → grouping_complete → pending_cleanup → cleanup_allowed → cleaned / failed)
      - State transitions constrained by MongoDB CAS (findOneAndUpdate with state condition)
    counter_signals:
      - State is a stored enum; behavior variation by state is NOT present — each service owns specific state transitions and does not vary behavior based on which state a video is in
      - Valid transitions are enforced by MongoDB CAS atomic conditions, not by state-specific behavior objects
      - Policy roles (StagingIdempotencyPolicy, ClaimOwnershipPolicy) handle guard logic as pure decision functions — no need for State pattern classes
      - Fewer than two services compete on the same state at the same time (state ownership is partitioned by service)
    decision: no_pattern
    candidate_patterns_considered:
      - State
      - Policy
    rejected_patterns:
      - name: State
        reason: >
          Behavior does not change based on current state within a service — each service
          only transitions TO its owned states, not FROM multiple states. MongoDB CAS
          provides the transition guard. State pattern would add classes without changing
          behavior.
      - name: Policy
        reason: Policy is a role, not a structural design pattern; StagingIdempotencyPolicy and ClaimOwnershipPolicy already exist as policy roles
    evidence_refs:
      - .ai/reports/02-behavior-contract.yaml#shared_requirements.scan_state_machine
      - .ai/reports/architecture-blueprint.yaml#ARCH-ASMP-002

  - pressure_id: PPR-006
    pressure_type: event_pressure
    evaluation: no_pressure
    signals_found:
      - RabbitMQ consumers (NewVideoConsumer, ScanCompletedConsumer) process integration events
      - RabbitMQ publisher (ScanCompletedPublisher) publishes integration events
      - Idempotency required (VSS and SGS must handle duplicate messages)
    counter_signals:
      - amqplib manual ack with idempotency check via MongoDB state read is the stated approach — already resolved at transport layer
      - No durable Outbox needed: VBS S3-before-publish ordering is enforced procedurally in ResultPublicationUseCase; no separate outbox table needed
      - No Inbox pattern needed: idempotency is implemented by reading MongoDB scan state before processing, not by a dedicated inbox table
      - No projection or read model needed: similarity data is written and queried directly via repositories
      - Consumers and publishers are already role-assigned; no additional event pattern structure needed
    decision: no_pattern
    candidate_patterns_considered:
      - Observer
      - DomainEvent
      - Outbox
      - Inbox
      - Projection
      - ReadModel
      - EventSourcing
    rejected_patterns:
      - name: Outbox
        reason: >
          S3-before-publish ordering enforced procedurally in ResultPublicationUseCase
          is sufficient. An Outbox table would require polling infrastructure and
          additional MongoDB collection with no added reliability benefit given
          amqp-connection-manager auto-reconnect.
      - name: Inbox
        reason: >
          MongoDB scan state read before processing provides idempotency without a
          dedicated inbox collection. The local-alignment decision (CC-007) confirmed
          manual ack with state check as the idempotency mechanism.
      - name: DomainEvent
        reason: Integration events (NewVideoReadyForScanEvent, ScanCompletedEvent) are cross-service contracts, not internal domain events. integration_event role is already assigned.
      - name: Observer
        reason: No in-process multi-subscriber event bus; RabbitMQ handles decoupling
      - name: Projection
        reason: No read model or projection needed; similarity data is queried directly
      - name: ReadModel
        reason: No CQRS separation needed; queries are direct repository reads
      - name: EventSourcing
        reason: No event store; state is authoritative in MongoDB documents
    evidence_refs:
      - .ai/reports/local-alignment.yaml#CC-007
      - .ai/reports/dependency-classification.yaml#DV-004
      - .ai/reports/dependency-classification.yaml#DV-005

triggers_emitted: []

gate_result:
  gate_id: gate.pattern_pressure_detection.output
  status: pass
  failures: []

produced_outputs:
  - .ai/reports/pattern-pressure.yaml
