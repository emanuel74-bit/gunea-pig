report_id: "pattern-pressure"
phase_id: pattern_pressure_detection
status: complete
summary: >
  Pattern pressure detection completed across all 48 artifact candidates (48 role signals consumed
  from 04-draft-role-signals.yaml) and corroborated against architectural context.
  Four pressure types are confirmed with high confidence and high severity:
  adapter_boundary_pressure (13 DIP violations, 12 ports to introduce, 5 adapter implementations),
  data_access_pressure (7 repository implementations wrapping Mongoose schemas that currently leak
  into application handlers), workflow_pressure (ScanOrchestrator AC-010 with 7 co-located
  responsibilities and a multi-step ordered scan pipeline), and event_pressure (2 RabbitMQ consumers
  with LOCKED queue topology and ack/nack semantics requiring durable message delivery).
  Four pressure types are explicitly absent: creation_pressure, strategy_variation_pressure,
  state_lifecycle_pressure, and resilience_pressure. No pattern forcing occurred — NoPattern was
  evaluated first for each absent type and confirmed by lack of positive signals.

inputs_consumed:
  - source: conventions/.ai/reports/04-draft-role-signals.yaml
    artifact: draft_role_signals
  - source: conventions/.ai/reports/architecture-blueprint.yaml
    artifact: architecture_blueprint
  - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
    artifact: codebase_reconnaissance
  - source: conventions/.ai/reports/risk-classification.yaml
    artifact: risk_classification

decisions:
  - id: DECISION-PP-001
    decision: >
      adapter_boundary_pressure is confirmed at high severity. 13 DIP violations exist in the
      current codebase where application handlers inject concrete infrastructure classes directly.
      12 new port interfaces are required (all assigned role=port in phase 12). 5 concrete adapter
      implementations (role=adapter) complete the boundary isolation. Ports-and-Adapters is the
      indicated architectural pattern family.
    rationale: >
      The role signal report shows 12 artifacts with draft_role_signal=port under
      architectural_boundary family (AC-005, AC-007, AC-013, AC-015, AC-018, AC-026, AC-028,
      AC-030, AC-032, AC-034, AC-036, AC-038) — each representing a new DIP boundary introduction.
      5 artifacts have draft_role_signal=adapter (AC-008, AC-016, AC-027, AC-037, AC-039).
      The codebase reconnaissance and architecture blueprint confirm 13 DIP violations with zero
      port/interface abstractions currently in place. External contracts for RabbitMQ, Mongoose
      collections, and S3 key patterns are LOCKED, reinforcing the need for stable boundary
      contracts between application code and infrastructure.
    evidence:
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[role=port].count
        value: "12 port artifacts across CAP-001, CAP-002, CAP-003, and shared infrastructure"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[role=adapter].count
        value: "5 adapter artifacts: FileStagingAdapter, VdfRunnerAdapter, ScanResultClient, S3StorageAdapter, RabbitMQPublisher"
      - source: conventions/.ai/reports/architecture-blueprint.yaml
        field: boundary_refs.dip_violation_count
        value: "13 DIP violations — application handlers inject concrete infrastructure directly"

  - id: DECISION-PP-002
    decision: >
      data_access_pressure is confirmed at high severity. 7 concrete repository implementations
      are required (role=repository), all wrapping Mongoose schema models that currently bypass
      the application layer without abstraction. Repository pattern introduction resolves the
      Mongoose schema leakage into application handlers.
    rationale: >
      The role signal report shows 7 artifacts with draft_role_signal=repository (AC-006, AC-019,
      AC-029, AC-031, AC-033, AC-035 — 6 explicitly named repositories — plus VideoScanRepository).
      Each implements a corresponding port interface. The architecture blueprint confirms Mongoose
      schemas currently leaking directly into application handlers. 4 schema artifacts (AC-040 to
      AC-043) further confirm the persistence surface. The Repository pattern (not a generic ORM
      wrapper) is the indicated pattern family.
    evidence:
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[role=repository].count
        value: "7 repository implementations: VideoRepository, VideoScanRepository, SimilarityEdgeRepository, SimilarityGroupRepository, VideoSimilarityRepository, ScanBatchRepository, BatchClaimerService (service with persistence-adjacent behavior)"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[role=schema].count
        value: "4 Mongoose schema artifacts: VideoSchemaModule, ScanBatchSchemaModule, SimilarityEdgeSchemaModule, SimilarityGroupSchemaModule"
      - source: conventions/.ai/reports/architecture-blueprint.yaml
        field: boundary_refs.repository_abstraction.artifacts_affected
        value: "AU-005, AU-013, AU-018, AU-028, AU-030, AU-032, AU-034"

  - id: DECISION-PP-003
    decision: >
      workflow_pressure is confirmed at medium severity. ScanOrchestrator (AC-010) currently has
      7 co-located responsibilities representing a multi-step ordered scan processing pipeline.
      After decomposition, the surviving orchestrator artifact retains the ordered coordination
      role. The Orchestrator or Process Manager pattern family is indicated.
    rationale: >
      AC-010 ScanOrchestrator is flagged mixed_responsibility=true and extraction_target=true with
      7 responsibilities: orchestration, batch claiming, result loading, error handling, scheduling,
      scan dispatch, and progress tracking. The blueprint documents the required sequential stages:
      (1) claim batch, (2) dispatch VDF scan, (3) load results, (4) upload to S3, (5) emit event,
      (6) cleanup. This is an ordered multi-step pipeline with discrete stages — the definition of
      workflow_pressure. Severity is medium (not high) because the refactoring plan already
      decomposes the monolith via port delegation, reducing the orchestration surface after SRP fix.
    evidence:
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-010].mixed_responsibility_flag
        value: "true — 7 co-located responsibilities"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-010].notes
        value: "MIXED RESPONSIBILITY: orchestration, batch claiming, result loading, error handling, scheduling, scan dispatch, progress tracking"
      - source: conventions/.ai/reports/architecture-blueprint.yaml
        field: atomic_units[AU-009].evidence_refs
        value: "risk-classification.yaml#SRP_violation_7_responsibilities"

  - id: DECISION-PP-004
    decision: >
      event_pressure is confirmed at medium severity. Two RabbitMQ AMQP consumers (VideoReadyConsumer
      AC-001, ScanCompletedConsumer AC-021) receive messages with ack/nack semantics. Queue topic
      names and payload schemas are LOCKED. The consumer role and IEventPublisher port (AC-038) plus
      RabbitMQPublisher adapter (AC-039) constitute a pub/sub async integration boundary.
    rationale: >
      The role signal report shows 4 artifacts with draft_role_signal=consumer (AC-001, AC-021,
      and 2 additional consumers in the summary). RabbitMQPublisher (AC-039) implements IEventPublisher
      (AC-038) for the publish side. The behavior contract marks RabbitMQ queue topology as LOCKED,
      meaning the consumer contracts and routing keys cannot change. Ack/nack semantics on consumers
      confirm durable delivery is required. Severity is medium rather than high because the
      infrastructure is already in place (RabbitMQ is operational) — the pressure is about correctly
      abstracting it through the IEventPublisher port and maintaining ack/nack hygiene, not introducing
      new event infrastructure.
    evidence:
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: summary
        value: "4 RabbitMQ/transport consumers assigned role 'consumer' (integration_async family)"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-001].evidence_refs
        value: "entry_intent, receives NewVideoReadyEvent from RabbitMQ"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-021].evidence_refs
        value: "entry_intent, receives ScanCompletedEvent from RabbitMQ"
      - source: conventions/.ai/reports/02-behavior-contract.yaml
        field: locked_contracts.rabbitmq
        value: "queue topic names and payload schemas are LOCKED — no schema mutation allowed"

  - id: DECISION-PP-005
    decision: >
      creation_pressure is absent. NestJS DI framework handles all object construction uniformly.
      No multi-branch construction variation or factory/builder candidates were detected in the
      48 role signals.
    rationale: >
      None of the 48 artifact candidates exhibit repeated construction with variants. NestJS DI
      injector resolves all providers by token — no manual factory logic or conditional construction
      branches are present. The role signal set contains no artifact with candidate_role_pressure
      pointing to factory or builder patterns. NoPattern applies.
    evidence:
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[*].draft_role_signal
        value: "No factory, builder, or creator role signals in any of the 48 artifacts"

  - id: DECISION-PP-006
    decision: >
      strategy_variation_pressure is absent. No interchangeable algorithm variants exist in the
      codebase. All policy artifacts use fixed single-implementation decision logic.
    rationale: >
      4 policy artifacts (VideoStagingPolicy AC-004, BatchClaimPolicy AC-011, ScanCleanupPolicy
      AC-012, SimilarityThresholdPolicy AC-024) each encode a fixed domain policy. Their rejected
      roles explicitly exclude 'strategy' because no interchangeable algorithm signal was present.
      UnionFindDomainService (AC-025) is a single canonical union-find implementation with no
      variant. NoPattern applies.
    evidence:
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-004].rejected_roles
        value: "strategy rejected: No interchangeable algorithm signal — this is a fixed domain policy"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-025].rejected_roles
        value: "strategy rejected: No interchangeable algorithm signal — single canonical union-find implementation"

  - id: DECISION-PP-007
    decision: >
      state_lifecycle_pressure is absent. No artifact exhibits behavior that changes based on a
      lifecycle state machine. Video staging state transitions are simple status fields, not
      polymorphic state-driven behavior.
    rationale: >
      The codebase has video staging state transitions (e.g., updateState in IVideoRepository)
      but these are simple status updates on a record, not state-machine-driven polymorphic
      behavior changes. No artifact was flagged as requiring a State pattern or lifecycle-state
      coordination. The VideoStagingPolicy decides eligibility but does not model lifecycle
      transitions through behavioral state objects. NoPattern applies.
    evidence:
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-005].notes
        value: "IVideoRepository ISP-narrowed to findById and updateState — simple status field update, no state machine"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-004].draft_role_signal
        value: "policy — fixed eligibility check, not state-machine transition coordination"

  - id: DECISION-PP-008
    decision: >
      resilience_pressure is absent. No retry infrastructure, circuit breaker, or idempotency
      enforcement exists or is planned. No test infrastructure exists (ASSUMP-003=FALSE), and no
      resilience artifacts appear in the 48 candidates.
    rationale: >
      None of the 48 artifact candidates represent retry logic, circuit breakers, idempotency
      tokens, or fallback handlers. The architecture blueprint and codebase reconnaissance confirm
      no existing resilience infrastructure. The mission scope is SOLID refactoring — introducing
      resilience patterns is outside mission scope. ScanOrchestrator error handling was
      identified as one of 7 responsibilities to decompose, but the surviving error handling
      is simple exception propagation, not retry or circuit-breaker logic. NoPattern applies.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: assumptions[ASSUMP-003]
        value: "FALSE — no test infrastructure exists"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[*].draft_role_signal
        value: "No retry, circuit_breaker, idempotency, or fallback role signals in any of the 48 artifacts"

detected_pressures:
  - pressure_id: PP-001
    pressure_type: adapter_boundary_pressure
    severity: high
    confidence: high
    selection_required_later: true
    evidence:
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        section: draft_role_signals
        observation: >
          12 port interfaces assigned role=port (architectural_boundary family): IVideoRepository,
          IFileStagingPort, IBatchClaimerPort, IVdfRunnerPort, IVideoScanRepository, IScanResultLoader,
          ISimilarityEdgeRepository, ISimilarityGroupRepository, IVideoSimilarityRepository,
          IScanBatchRepository, IStoragePort, IEventPublisher — all represent new DIP boundary
          introductions where zero abstractions currently exist.
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        section: draft_role_signals
        observation: >
          5 adapter implementations assigned role=adapter (integration_boundary family):
          FileStagingAdapter (S3 + filesystem), VdfRunnerAdapter (CLI subprocess),
          ScanResultClient (S3 via IStoragePort), S3StorageAdapter (AWS SDK),
          RabbitMQPublisher (AMQP channel) — each wraps an external system behind its port contract.
      - ref: conventions/.ai/reports/architecture-blueprint.yaml
        section: decisions
        observation: >
          13 DIP violations confirmed — application handlers (StageVideoHandler, ScanOrchestrator,
          ProcessScanHandler) inject concrete infrastructure classes directly with zero port/interface
          abstractions currently in place.
      - ref: conventions/.ai/reports/02-behavior-contract.yaml
        section: locked_contracts
        observation: >
          External contracts are LOCKED (RabbitMQ topology, Mongoose collection names, S3 key
          patterns) — isolation through port abstractions is required to prevent application code
          from coupling to locked external shapes.
    candidate_pattern_families:
      - PortsAndAdapters
      - DependencyInversion
      - Adapter
    positive_signals_matched:
      - "external API shape differs from internal contract (S3 SDK, AMQP channel, VDF CLI subprocess)"
      - "framework-specific code at boundary (MongooseModule, AWS SDK, amqplib)"
      - "zero port/interface abstractions currently exist — 13 DIP violations confirmed"
    negative_signals_matched: []
    notes: >
      All 12 ports and 5 adapters are already planned artifacts in the architecture blueprint.
      Phase 20 pattern_selection must confirm PortsAndAdapters as the governing pattern for
      boundary isolation. The 4 Mongoose schema artifacts (AC-040 to AC-043) are persistence-data
      artifacts within the adapter boundary layer — they are not themselves adapter pressure
      evidence but are boundary surface artifacts.

  - pressure_id: PP-002
    pressure_type: data_access_pressure
    severity: high
    confidence: high
    selection_required_later: true
    evidence:
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        section: draft_role_signals
        observation: >
          7 repository implementations assigned role=repository (persistence_data family):
          VideoRepository (AC-006), VideoScanRepository (AC-019), SimilarityEdgeRepository (AC-029),
          SimilarityGroupRepository (AC-031), VideoSimilarityRepository (AC-033),
          ScanBatchRepository (AC-035), plus BatchClaimerService (AC-014, role=service with
          atomic MongoDB coordination beyond CRUD). Each implements a corresponding port interface.
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        section: draft_role_signals
        observation: >
          4 Mongoose schema modules (AC-040 to AC-043) define the persistence surface:
          VideoSchemaModule, ScanBatchSchemaModule, SimilarityEdgeSchemaModule,
          SimilarityGroupSchemaModule — collection names LOCKED.
      - ref: conventions/.ai/reports/architecture-blueprint.yaml
        section: boundary_refs.repository_abstraction
        observation: >
          7 artifacts flagged as requiring repository abstraction introduction:
          AU-005, AU-013, AU-018, AU-028, AU-030, AU-032, AU-034 — Mongoose schemas currently
          leaking directly into application handlers without repository boundary.
    candidate_pattern_families:
      - Repository
      - DataAccessObject
    positive_signals_matched:
      - "DB calls in services/handlers — Mongoose models directly injected into application layer"
      - "repository abstraction needed — 7 new repository port interfaces required"
      - "Mongoose schema modules present without repository encapsulation"
    negative_signals_matched: []
    notes: >
      All 7 repository implementations wrap Mongoose (not Drizzle). Collection definitions are
      LOCKED — no schema changes are permitted. The repository pattern introduces abstraction
      between application code and Mongoose model access. BatchClaimerService (AC-014) is assigned
      role=service rather than repository because it has atomic claim-coordination logic beyond
      CRUD — it is adjacent to data_access_pressure but resolved to service role.

  - pressure_id: PP-003
    pressure_type: workflow_pressure
    severity: medium
    confidence: medium
    selection_required_later: true
    evidence:
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        section: draft_role_signals[AC-010]
        observation: >
          ScanOrchestrator mixed_responsibility_flag=true, extraction_target=true, 7 co-located
          responsibilities: orchestration, batch claiming, result loading, error handling, scheduling,
          scan dispatch, progress tracking. draft_role_signal=orchestrator (post-decomposition
          primary role is multi-step flow coordination). Confidence medium until decomposition
          is confirmed by artifact_action_resolution phase.
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        section: decisions[DECISION-DR-002]
        observation: >
          Architecture blueprint AU-009 explicitly documents 7 responsibilities mixed in the
          current ScanOrchestrator monolith. After decomposition: ScanSchedulerTrigger extracted
          to AC-009, batch claiming delegated to IBatchClaimerPort, VDF invocation to IVdfRunnerPort,
          result upload to IStoragePort, event emission to IEventPublisher, cleanup to ScanPurgerService.
          Post-extraction orchestrator role is clean ordered coordination.
      - ref: conventions/.ai/reports/risk-classification.yaml
        section: decisions
        observation: >
          risk-classification.yaml#SRP_violation_7_responsibilities confirms the ordered sequential
          scan pipeline stages requiring a multi-step coordinator.
    candidate_pattern_families:
      - Orchestrator
      - ProcessManager
      - TemplateMethod
    positive_signals_matched:
      - "ordered stages — 6 sequential pipeline steps confirmed in architecture blueprint"
      - "large method with sequential stages — 7 responsibilities co-located in current monolith"
      - "multi-step flow coordination as surviving primary responsibility after decomposition"
    negative_signals_matched: []
    notes: >
      Severity is medium rather than high because ScanOrchestrator's decomposition plan already
      delegates most stages to ports — the post-refactor orchestrator may be light enough that
      NoPattern (plain orchestrator class delegating via injected ports) is appropriate. Phase 20
      must evaluate whether a formal Process Manager or Orchestrator pattern adds value over
      a plain class with injected dependencies.

  - pressure_id: PP-004
    pressure_type: event_pressure
    severity: medium
    confidence: high
    selection_required_later: true
    evidence:
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        section: draft_role_signals
        observation: >
          4 RabbitMQ/transport consumers assigned role=consumer (integration_async family):
          VideoReadyConsumer (AC-001) receives NewVideoReadyEvent, ScanCompletedConsumer (AC-021)
          receives ScanCompletedEvent — both with AMQP ack/nack semantics confirming durable
          delivery requirement. 1 scheduler entry (ScanSchedulerTrigger AC-009) is time-triggered,
          not event-driven.
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        section: draft_role_signals[AC-038]
        observation: >
          IEventPublisher port (AC-038) abstracts RabbitMQ topology from application code.
          RabbitMQPublisher (AC-039) is the concrete adapter implementing IEventPublisher.
          Topology constants in shared/types/queue.types.ts are LOCKED.
      - ref: conventions/.ai/reports/02-behavior-contract.yaml
        section: locked_contracts
        observation: >
          RabbitMQ queue topic names and payload schemas are LOCKED — no schema mutation allowed.
          This enforces event contracts at the consumer boundary.
    candidate_pattern_families:
      - Observer
      - PublishSubscribe
      - MessageConsumer
    positive_signals_matched:
      - "message delivery must be durable — AMQP ack/nack semantics on consumers confirmed"
      - "external pub/sub boundary — RabbitMQ topology and payload schemas LOCKED"
      - "IEventPublisher port abstracts async event publishing from application code"
    negative_signals_matched: []
    notes: >
      Severity is medium because the RabbitMQ infrastructure already exists and is operational.
      The pressure is about correctly isolating it behind the IEventPublisher port contract and
      maintaining ack/nack hygiene in consumers (SRP fix required in VideoReadyConsumer and
      ScanCompletedConsumer to ensure delegation-only, no inline logic). Phase 20 must confirm
      whether a formal pub/sub pattern beyond the port abstraction adds value.

absent_pressures:
  - pressure_type: creation_pressure
    reason: >
      No multi-branch or variable construction patterns detected in any of the 48 artifact candidates.
      NestJS DI framework handles all object construction uniformly via provider tokens. No artifact
      has factory, builder, or creator role signals. NoPattern applies — plain NestJS DI provider
      registration is sufficient for all construction concerns.

  - pressure_type: strategy_variation_pressure
    reason: >
      No interchangeable algorithm variants exist in the codebase. All 4 policy artifacts
      (VideoStagingPolicy, BatchClaimPolicy, ScanCleanupPolicy, SimilarityThresholdPolicy)
      are fixed single-implementation domain policies — strategy role was explicitly rejected for
      each. UnionFindDomainService is a single canonical algorithm with no variant. NoPattern applies.

  - pressure_type: state_lifecycle_pressure
    reason: >
      No polymorphic state-machine-driven behavior detected. Video staging has a status field
      updated via IVideoRepository.updateState(), but this is a simple data mutation, not a
      State pattern. VideoStagingPolicy performs eligibility decisions against status values
      but does not model state-driven behavioral transitions through polymorphic state objects.
      NoPattern applies.

  - pressure_type: resilience_pressure
    reason: >
      No retry infrastructure, circuit breakers, idempotency enforcement, or fallback handlers
      are present or planned in the 48 artifact candidates. Mission scope is SOLID refactoring
      only — resilience pattern introduction is out of scope. ASSUMP-003=FALSE confirms no test
      infrastructure exists to verify resilience behavior. NoPattern applies.

