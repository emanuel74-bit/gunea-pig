report_id: "risk-classification"
phase_id: risk_classification
status: complete
summary: >
  Risk classification for the large_refactor mission (full-codebase SOLID refactor of a
  NestJS TypeScript monorepo, 5 packages). Overall risk level is HIGH. The primary
  escalation driver is confirmed zero test coverage (ASSUMP-003 evaluated FALSE), which
  eliminates any automated behavioral regression safety net across ~60+ source files.
  Secondary drivers are full-codebase scope (5 packages, all layers), pipeline-service
  duplication requiring a consolidation decision with non-trivial blast radius, and zero
  existing port/interface abstractions requiring wholesale injection-pattern replacement.
  Risk is bounded (not critical) because: no external API changes are required, external
  contracts (RabbitMQ, Mongoose collections, S3) are well-defined and locked, no data
  migration is needed, and the behavior contract provides explicit preservation constraints.
  Implementation is BLOCKED until required followups are resolved per high-risk policy.

inputs_consumed:
  - source: conventions/.ai/reports/02-behavior-contract.yaml
    artifact: behavior_contract
    fields_used:
      - preserved_behaviors
      - forbidden_behavior_changes
      - scope
      - assumptions
      - acceptance_criteria
  - source: conventions/.ai/reports/assumptions.yaml
    artifact: assumptions_report
    fields_used:
      - assumptions
      - blocking_assumptions
      - non_blocking_assumptions
  - source: conventions/risk/conventions.risk-taxonomy.yaml
    artifact: risk_taxonomy
    fields_used:
      - risk_level_enum
      - risk_level_definitions
      - risk_context_enum
      - risk_concern_enum
      - risk_signal_type_enum
      - risk_classification_report_schema

decisions:
  - id: DECISION-RC-001
    decision: >
      Assign overall risk level HIGH. Do not escalate to CRITICAL.
    rationale: >
      The confirmed absence of any test suite (ASSUMP-003 FALSE, per phase bundle ground
      truth) combined with full-codebase structural change across 5 packages and ~60+ source
      files meets the HIGH minimum threshold (no tests + full-codebase structural change).
      CRITICAL is not warranted because: (a) no data migration is required — Mongoose
      schemas are preserved as-is, (b) no external API surface change is required, (c) the
      external contracts are fully enumerated and locked in the behavior contract, (d) no
      production-critical runtime dependency is being changed, and (e) no security/
      authorization boundary is affected. The refactor is structurally broad but contractually
      bounded. HIGH is the correct ceiling under the taxonomy definition.
    evidence:
      - source: phase_bundle
        field: reconnaissance_findings
        value: "No tests exist — zero spec/test files anywhere. No safety net for behavior preservation."
      - source: conventions/.ai/reports/assumptions.yaml
        field: assumptions[ASSUMP-003].risk_if_wrong
        value: "If no tests exist, acceptance criterion AC-005 cannot be evaluated at implementation time."
      - source: conventions/risk/conventions.risk-taxonomy.yaml
        field: risk_level_definitions.high.definition
        value: "Change with significant blast radius, compatibility concerns, boundary risks, data risks, or uncertain downstream effects."
      - source: conventions/risk/conventions.risk-taxonomy.yaml
        field: risk_level_definitions.critical.positive_signals
        value: "data loss possible; breaking public contract with unknown consumers; security or authorization boundary affected; irreversible migration without rollback"

  - id: DECISION-RC-002
    decision: >
      Classify risk contexts as: refactor_risk (primary), testing_risk (primary),
      implementation_risk (secondary), integration_risk (secondary), change_risk (secondary).
    rationale: >
      refactor_risk is primary because behavior preservation is uncertain without tests and
      the scope includes large move/split/extract actions across all layers. testing_risk is
      primary because characterization tests are absent. implementation_risk is secondary
      because ~60+ files will be edited and the sequence has potential for unsafe temporary
      states during DIP introduction. integration_risk is secondary because RabbitMQ consumer
      boundaries must remain intact throughout the refactor. change_risk is secondary because
      the delta from current to intended structure is large and not validated by existing tests.
    evidence:
      - source: conventions/risk/conventions.risk-taxonomy.yaml
        field: risk_context_definitions.refactor_risk.signals
        value: "behavior preservation uncertain; characterization tests missing; large move/split/extract actions selected"
      - source: conventions/risk/conventions.risk-taxonomy.yaml
        field: risk_context_definitions.testing_risk.signals
        value: "test gap exists; behavior not directly observable"

  - id: DECISION-RC-003
    decision: >
      Classify active risk concerns as: behavior_preservation, test_coverage,
      boundary_integrity, dependency_direction. Flag public_contract as monitored
      (not active — contracts are locked and preservation is the explicit requirement).
    rationale: >
      behavior_preservation is active because no tests validate current behavior and the
      refactor touches all layers. test_coverage is active because zero tests exist.
      boundary_integrity is active because every application handler currently injects
      concrete infrastructure classes — all boundaries must be restructured. dependency_direction
      is active because DIP introduction requires inverting existing import directions across
      all service packages. public_contract is a monitored concern (not active risk) because
      the behavior contract explicitly locks all external contracts with preservation requirements.
    evidence:
      - source: phase_bundle
        field: reconnaissance_findings
        value: "Zero port/interface abstractions — application handlers directly inject concrete infrastructure classes."
      - source: conventions/.ai/reports/02-behavior-contract.yaml
        field: preserved_behaviors
        value: "PB-001 through PB-005 — RabbitMQ, DB, S3, inter-service flows, error boundaries"

  - id: DECISION-RC-004
    decision: >
      Require characterization test plan as a blocking followup before implementation begins.
    rationale: >
      With zero tests, the SOLID refactor has no automated regression detection. The behavior
      contract defines five preserved behaviors (PB-001 through PB-005) that must hold after
      refactor. Without characterization tests, there is no mechanism to detect behavioral
      regressions during implementation. This followup is required per high-risk policy:
      implementation_policy is blocked_until_required_followups_resolved.
    evidence:
      - source: phase_bundle
        field: reconnaissance_findings
        value: "No tests exist — zero spec/test files anywhere. No safety net for behavior preservation."
      - source: conventions/.ai/reports/assumptions.yaml
        field: decisions[DECISION-ASSUMP-002].rationale
        value: "If no test suite exists, the test_derivation phase must produce characterization tests before implementation begins."

  - id: DECISION-RC-005
    decision: >
      Require pipeline-service consolidation decision as a blocking followup before
      implementation begins.
    rationale: >
      pipeline-service is a near-verbatim copy of all three standalone services. The
      architecture_decomposition phase must produce a canonical consolidation decision
      (which package is the single implementation target) before any implementation edits
      begin. Implementing without this decision would produce conflicting edits across both
      the standalone services and the pipeline-service copies, doubling blast radius and
      creating unresolvable merge conflicts in the implementation sequence.
    evidence:
      - source: phase_bundle
        field: reconnaissance_findings
        value: "pipeline-service is a near-verbatim copy of all three standalone services. Duplication must be resolved — high blast radius."
      - source: conventions/.ai/reports/02-behavior-contract.yaml
        field: decisions[DECISION-BC-005].rationale
        value: "Leaving two sets of implementations violates SRP at the service level and creates drift risk."

evidence_refs:
  - ref: conventions/.ai/reports/02-behavior-contract.yaml
    section: preserved_behaviors
    consumed_by: risk_signal_derivation
  - ref: conventions/.ai/reports/02-behavior-contract.yaml
    section: forbidden_behavior_changes
    consumed_by: public_contract_risk_assessment
  - ref: conventions/.ai/reports/02-behavior-contract.yaml
    section: assumptions
    consumed_by: assumption_risk_escalation
  - ref: conventions/.ai/reports/assumptions.yaml
    section: assumptions[ASSUMP-003]
    consumed_by: test_coverage_risk_escalation
  - ref: conventions/.ai/reports/assumptions.yaml
    section: decisions[DECISION-ASSUMP-002]
    consumed_by: characterization_test_plan_requirement
  - ref: conventions/risk/conventions.risk-taxonomy.yaml
    section: risk_level_definitions
    consumed_by: risk_level_assignment
  - ref: conventions/risk/conventions.risk-taxonomy.yaml
    section: risk_context_definitions
    consumed_by: risk_context_classification
  - ref: conventions/risk/conventions.risk-taxonomy.yaml
    section: risk_concern_definitions
    consumed_by: risk_concern_classification

risk_level: high

risk_context: >
  This is a full-codebase SOLID refactor of a production NestJS TypeScript monorepo
  spanning 5 packages and approximately 60+ source files. The refactor requires: (1)
  introducing port/interface abstractions at all application boundaries — currently zero
  exist, (2) restructuring dependency injection across every handler in every service,
  (3) resolving pipeline-service duplication against three standalone services,
  (4) reorganizing internal file and folder structure, and (5) extracting domain objects
  free of framework imports. There is no automated test coverage anywhere in the codebase.
  External contracts (RabbitMQ message schemas, Mongoose collections, S3 operations) are
  well-defined and must be preserved unchanged. The risk profile is: high blast radius,
  zero regression safety net, confirmed assumption failure (ASSUMP-003), but contractually
  bounded with no data migration and no external API changes. Implementation is blocked
  until characterization tests and consolidation decision are in place.

risk_signals:
  - signal_id: RS-001
    signal_type: escalation_signal
    source_subsystem: testing_risk
    source_ref: conventions/.ai/reports/assumptions.yaml
    risk_context: testing_risk
    risk_concern: test_coverage
    weight: critical
    confidence: high
    severity: critical
    description: >
      Zero test files exist anywhere in the codebase. ASSUMP-003 is confirmed FALSE.
      Acceptance criterion AC-005 (behavior preservation via test pass rate) cannot be
      evaluated. There is no automated regression detection during refactor execution.
    mitigation_required: true
    mitigation: >
      A characterization test plan must be produced by the test_derivation phase before
      any implementation edits begin. The plan must cover all five preserved behaviors
      (PB-001 through PB-005) with concrete, runnable test cases.

  - signal_id: RS-002
    signal_type: escalation_signal
    source_subsystem: refactor_risk
    source_ref: phase_bundle
    risk_context: refactor_risk
    risk_concern: behavior_preservation
    weight: high
    confidence: high
    severity: high
    description: >
      Full-codebase structural change across 5 packages with no existing test baseline.
      Every application handler in every service requires DIP restructuring. Behavior
      preservation is uncertain with no automated verification mechanism in place.
    mitigation_required: true
    mitigation: >
      Characterization tests must establish behavioral baseline before implementation.
      Implementation must be sequenced to avoid unsafe temporary states at RabbitMQ
      consumer boundaries.

  - signal_id: RS-003
    signal_type: escalation_signal
    source_subsystem: implementation_risk
    source_ref: phase_bundle
    risk_context: implementation_risk
    risk_concern: boundary_integrity
    weight: high
    confidence: high
    severity: high
    description: >
      Zero port/interface abstractions exist. All application handlers directly inject
      concrete infrastructure classes. DIP introduction requires restructuring every
      handler in every service — approximately 60+ source files across all layers.
      Blast radius is the full codebase.
    mitigation_required: true
    mitigation: >
      Architecture decomposition phase must produce a canonical port inventory and
      module boundary map before implementation. Implementation sequence must be
      validated for safe ordering.

  - signal_id: RS-004
    signal_type: escalation_signal
    source_subsystem: implementation_risk
    source_ref: phase_bundle
    risk_context: implementation_risk
    risk_concern: dependency_direction
    weight: high
    confidence: high
    severity: high
    description: >
      pipeline-service is a near-verbatim copy of all three standalone services
      (staging, grouping, vdf-scan). Duplication resolution requires a binding
      consolidation decision: which package becomes the canonical implementation.
      Implementing without this decision doubles the edit surface and produces
      conflicting changes across duplicated code.
    mitigation_required: true
    mitigation: >
      Consolidation decision must be produced by architecture_decomposition phase
      before implementation begins. Decision must identify the canonical implementation
      target and the disposition of the non-canonical copies.

  - signal_id: RS-005
    signal_type: evidence_signal
    source_subsystem: integration_risk
    source_ref: conventions/.ai/reports/02-behavior-contract.yaml
    risk_context: integration_risk
    risk_concern: boundary_integrity
    weight: medium
    confidence: high
    severity: medium
    description: >
      System is purely event-driven (RabbitMQ consumers + scheduled intervals, no REST/gRPC).
      All external contracts flow through queue message schemas. These must survive the
      refactor unchanged at the wire level.
    mitigation_required: false
    mitigation: >
      RabbitMQ topic names and payload schemas are locked by the behavior contract
      (PB-001, forbidden_behavior_changes). Preservation is a hard gate criterion.
      Risk is monitored but does not require additional followup beyond contract locking.

  - signal_id: RS-006
    signal_type: deescalation_signal
    source_subsystem: change_risk
    source_ref: conventions/.ai/reports/02-behavior-contract.yaml
    risk_context: change_risk
    risk_concern: public_contract
    weight: medium
    confidence: high
    severity: low
    description: >
      No external API changes are required. All five preserved behaviors (PB-001 through
      PB-005) are explicitly enumerated and locked. The behavior contract provides concrete
      forbidden_behavior_changes. This bounds the risk: the refactor is structurally broad
      but contractually narrow.
    mitigation_required: false
    mitigation: >
      No additional followup required. Contract preservation is enforced by forbidden_behavior_changes
      in the behavior contract and corresponding acceptance criteria (AC-005 through AC-008).

  - signal_id: RS-007
    signal_type: deescalation_signal
    source_subsystem: migration_risk
    source_ref: conventions/.ai/reports/02-behavior-contract.yaml
    risk_context: migration_risk
    risk_concern: data_safety
    weight: low
    confidence: high
    severity: low
    description: >
      No data migration is required. Mongoose schema definitions are preserved as-is.
      The behavior contract explicitly prohibits schema mutation (forbidden_behavior_changes).
      No rollback complexity from data migration.
    mitigation_required: false
    mitigation: >
      No migration followup required. Data safety concern is resolved by contract lock.

required_followups:
  - followup_id: RF-001
    title: Characterization test plan required before implementation
    priority: blocking
    owner_phase: test_derivation
    description: >
      A characterization test plan must be produced covering all five preserved behaviors
      (PB-001: RabbitMQ contracts, PB-002: DB operations, PB-003: S3 operations,
      PB-004: inter-service event ordering, PB-005: error boundary types). The plan must
      include concrete, runnable test cases that establish a behavioral baseline before
      any implementation edits begin. No implementation phase may start until this plan
      is validated.
    blocks: implementation
    evidence_basis: RS-001, RS-002, ASSUMP-003 FALSE
    required_output: conventions/.ai/reports/characterization-test-plan.yaml

  - followup_id: RF-002
    title: Consolidation decision required for pipeline-service vs standalone services
    priority: blocking
    owner_phase: architecture_decomposition
    description: >
      The architecture_decomposition phase must produce a binding decision identifying:
      (a) which package(s) become the canonical implementation target for each business
      capability (video grouping, VDF scanning, video staging), and (b) the disposition
      of the non-canonical copies (deprecation, deletion, re-export). The decision must
      be grounded in the actual duplication analysis from codebase reconnaissance.
      No implementation phase may start until this decision is recorded and validated.
    blocks: implementation
    evidence_basis: RS-003, RS-004, DECISION-BC-005, ASSUMP-001
    required_output: architecture_decomposition phase output

  - followup_id: RF-003
    title: Port/interface inventory required before implementation sequencing
    priority: required
    owner_phase: architecture_decomposition
    description: >
      The architecture_decomposition phase must produce a canonical port inventory
      listing all required interface abstractions (repository ports, queue publisher ports,
      S3 adapter ports, domain service ports) for each service package. This inventory
      is required input for the implementation_sequence phase to produce a safe edit
      ordering that avoids broken intermediate states at consumer boundaries.
    blocks: implementation_sequence
    evidence_basis: RS-003, DECISION-BC-003
    required_output: architecture_decomposition phase output

triggers_emitted: []

gate_result:
  gate_id: gate.risk_classification.output
  status: pending
  note: >
    Gate result is produced by the gate subsystem via run_gate_check route — not authored here.
    Gate enforcement of HIGH risk policy (blocked_until_required_followups_resolved) is a
    gate subsystem responsibility, not a classification agent output.
