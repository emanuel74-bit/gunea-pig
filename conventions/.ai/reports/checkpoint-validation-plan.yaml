report_id: "checkpoint-validation-plan"
phase_id: checkpoint_validation_plan
schema_version: "1.0"
status: complete

summary: >
  Checkpoint validation plan for VDF pipeline implementation. Defines how each
  of the 5 checkpoint groups (CG-001 through CG-005) will be validated, with
  pass/fail criteria, repair conditions, and validation commands. The plan is
  structured so that CG-002 (shared-types) is a hard gate before any service
  infrastructure is written. CG-003 through CG-005 validate services in
  wave-by-wave order. Repair condition for any failed checkpoint is to fix the
  artifacts within that wave's scope only — no cross-wave repairs.

inputs_consumed:
  - source: .ai/reports/10-implementation-sequence.yaml
    type: implementation_sequence
  - source: .ai/reports/checkpoint-groups.yaml
    type: checkpoint_groups

validation_strategy:
  approach: wave_sequential
  rule: >
    Each checkpoint group must pass before the next wave begins. CG-002 is a
    hard gate — do not write any service code until tsc passes on shared-types.
    CG-003, CG-004, and CG-005 must each pass before proceeding to the next wave.
  on_failure: stop_wave_and_repair_within_scope
  repair_scope_boundary: >
    Repair only within the failing wave's scope. Never touch prior-wave artifacts
    to fix a later-wave failure — that indicates a design error in the later artifact.

checkpoint_validation_plans:

  - checkpoint_id: CG-001
    name: Project Scaffolding
    wave: 1
    validation_type: structural
    validation_commands:
      - name: "Verify workspaces"
        command: "node -e \"const p=require('./package.json'); console.log(JSON.stringify(p.workspaces))\""
        expected: contains packages/shared-types, packages/vss-service, packages/vbs-service, packages/sgs-service
      - name: "Verify node version"
        command: "cat .nvmrc"
        expected: "18.8.0"
      - name: "Verify tsconfig.base.json"
        command: "node -e \"const t=require('./tsconfig.base.json'); console.log(t.compilerOptions.strict, t.compilerOptions.experimentalDecorators)\""
        expected: true true
    pass_criteria:
      - package.json has workspaces array with all 4 packages
      - .nvmrc contains exactly "18.8.0"
      - tsconfig.base.json has strict=true and experimentalDecorators=true
      - All 4 service package.json files are present and have correct name fields
    fail_criteria:
      - Any required root file is absent
      - workspaces array does not include all 4 packages
      - .nvmrc does not contain "18.8.0"
    repair_condition: >
      CG-001 failure means scaffolding was skipped or written incorrectly.
      Fix within wave_1 scope only. Typical repair: correct package.json,
      .nvmrc, or tsconfig.base.json contents.
    blocking: true

  - checkpoint_id: CG-002
    name: shared-types Package Complete
    wave: 2
    validation_type: structural_and_type_check
    validation_commands:
      - name: "TypeScript type check on shared-types"
        command: "npx tsc --noEmit --project packages/shared-types/tsconfig.json"
        expected: exit code 0 (no type errors)
      - name: "Verify ScanState has all 10 states"
        command: "grep -c 'awaiting_staging\\|staged\\|claimed\\|scanning\\|scan_complete\\|grouping_complete\\|pending_cleanup\\|cleanup_allowed\\|cleaned\\|failed' packages/shared-types/src/enums/scan-state.enum.ts"
        expected: at least 10 matches
      - name: "Verify barrel export"
        command: "cat packages/shared-types/src/index.ts"
        expected: contains export from enums, interfaces, events, schemas
    pass_criteria:
      - tsc --noEmit exits 0 on shared-types package
      - ScanState enum has all 10 states
      - ScanStateSchema is exported from shared-types with @nestjs/mongoose decorators
      - NormalizedScanResult and SimilarityThresholdConfig interfaces present
      - NewVideoReadyForScanEvent and ScanCompletedEvent classes present
      - index.ts barrel exports all artifacts
    fail_criteria:
      - tsc --noEmit reports type errors
      - ScanState enum is missing any of the 10 states
      - ScanStateSchema is missing Prop decorators
      - Barrel export does not include one or more artifacts
    repair_condition: >
      CG-002 failure is a hard blocker. Do not proceed to wave_3. Fix within
      wave_2 scope. Check: ScanState enum completeness, Prop decorator imports,
      NestJS Schema decorator, barrel export entries.
    blocking: true
    special_note: "Hard gate: no service code may be written until CG-002 passes"

  - checkpoint_id: CG-003
    name: Infrastructure Layer Complete
    wave: 3
    validation_type: unit_test_and_structural
    validation_commands:
      - name: "VssConfig unit test"
        command: "npx jest packages/vss-service/src/config/vss.config.spec.ts --testNamePattern='throws'"
        maps_to: TO-007
        expected: all cases pass
      - name: "VbsConfig and SgsConfig unit tests"
        command: "npx jest packages/vbs-service/src/config/vbs.config.spec.ts packages/sgs-service/src/config/sgs.config.spec.ts"
        maps_to: TO-008
        expected: all cases pass
      - name: "VdfCliAdapter unit tests"
        command: "npx jest packages/vbs-service/src/infrastructure/vdf/vdf-cli.adapter.spec.ts"
        maps_to: TO-001, TO-009
        expected: all cases pass
      - name: "VdfOutputNormalizerAdapter unit test"
        command: "npx jest packages/vbs-service/src/infrastructure/vdf/vdf-output-normalizer.adapter.spec.ts"
        maps_to: TO-014
        expected: all cases pass
      - name: "Check child_process isolation"
        command: "grep -r 'child_process' packages/vbs-service/src --include='*.ts' -l"
        expected: "only vdf-cli.adapter.ts is listed"
    pass_criteria:
      - TO-007 (VssConfig validation) passes
      - TO-008 (VbsConfig + SgsConfig validation) passes
      - TO-001 + TO-009 (VdfCliAdapter) pass
      - TO-014 (VdfOutputNormalizerAdapter) passes
      - child_process only imported in vdf-cli.adapter.ts
      - All infrastructure files present per CG-003 artifact list
    fail_criteria:
      - Any config validation test fails
      - VdfCliAdapter spawns with wrong arguments
      - VdfOutputNormalizerAdapter does not throw on malformed input
      - child_process imported outside vdf-cli.adapter.ts
    repair_condition: >
      CG-003 failure — fix within wave_3 scope. Common causes:
      (1) Config class missing @IsString validator for required field.
      (2) VdfCliAdapter not handling ENOENT spawn error as is_retryable=false.
      (3) VdfOutputNormalizerAdapter not throwing on bad input.
      (4) child_process leaked into application or domain layer.
    blocking: true

  - checkpoint_id: CG-004
    name: Domain and Application Layers Complete
    wave: 4
    validation_type: unit_test
    validation_commands:
      - name: "StagingService idempotency unit tests"
        command: "npx jest packages/vss-service/src/staging/staging.service.spec.ts"
        maps_to: TO-003
        expected: all cases pass
      - name: "ScanResultIngestion idempotency unit test"
        command: "npx jest packages/sgs-service/src/grouping/scan-result-ingestion.service.spec.ts"
        maps_to: TO-004
        expected: all cases pass
      - name: "S3-before-RabbitMQ ordering test"
        command: "npx jest packages/vbs-service/src/result-publication/result-publication.service.spec.ts"
        maps_to: TO-006
        expected: all cases pass
      - name: "Policy and validator unit tests"
        command: "npx jest packages/vss-service/src/staging/staging-idempotency.policy.spec.ts packages/vbs-service/src/batch-claim/claim-ownership.policy.spec.ts packages/sgs-service/src/grouping/group-merge.policy.spec.ts packages/sgs-service/src/grouping/scan-result-schema.validator.spec.ts"
        maps_to: TO-010, TO-011, TO-012, TO-013
        expected: all cases pass
    pass_criteria:
      - TO-003 (StagingService idempotency) passes
      - TO-004 (ScanResultIngestion idempotency) passes
      - TO-006 (S3-before-RabbitMQ) passes
      - TO-010 (StagingIdempotencyPolicy) passes
      - TO-011 (ClaimOwnershipPolicy) passes
      - TO-012 (GroupMergePolicy) passes
      - TO-013 (ScanResultSchemaValidator) passes
      - All 11 domain/application files present
    fail_criteria:
      - Any idempotency test fails (StagingService or ScanResultIngestion skips when it should not, or processes when it should skip)
      - S3-before-RabbitMQ test fails (publisher called when S3 throws)
      - Policy returns wrong value at boundary conditions
      - Validator accepts unsupported schema version
    repair_condition: >
      CG-004 failure — fix within wave_4 scope. Do NOT modify infrastructure
      files to fix application-layer failures (that would indicate a domain
      design error). Common causes:
      (1) StagingService checks wrong state range for idempotency skip.
      (2) ResultPublicationService does not await S3 write before publish call.
      (3) GroupMergePolicy boundary condition off-by-one.
      (4) ScanResultSchemaValidator missing supported version list.
    blocking: true

  - checkpoint_id: CG-005
    name: Transport, Module Wiring, Entry Points Complete
    wave: 5
    validation_type: type_check_and_integration_test
    validation_commands:
      - name: "TypeScript type check — all 3 services"
        command: "npx tsc --noEmit --project packages/vss-service/tsconfig.json && npx tsc --noEmit --project packages/vbs-service/tsconfig.json && npx tsc --noEmit --project packages/sgs-service/tsconfig.json"
        expected: exit code 0 for all three
      - name: "VDF isolation architecture test"
        command: "npx jest packages/vbs-service/src/vdf-isolation.arch-spec.ts"
        maps_to: TO-002
        expected: pass
      - name: "Staging idempotency integration test"
        command: "npx jest packages/vss-service/test/staging-idempotency.integration.spec.ts"
        maps_to: TO-005
        expected: pass (requires real MongoDB)
      - name: "Health endpoint integration tests"
        command: "npx jest packages/vss-service/test/health.integration.spec.ts packages/vbs-service/test/health.integration.spec.ts packages/sgs-service/test/health.integration.spec.ts"
        maps_to: TO-015
        expected: pass (requires real MongoDB)
    pass_criteria:
      - tsc --noEmit exits 0 on all 3 service packages
      - TO-002 (VDF isolation arch test) passes
      - TO-005 (staging idempotency integration) passes
      - TO-015 (health endpoint integration) passes
      - All 18 transport/wiring/entry files present
      - NestJS modules compose without circular dependency errors
    fail_criteria:
      - tsc --noEmit reports type errors in any service
      - VDF isolation arch test finds child_process outside vdf-cli.adapter.ts
      - Integration test for idempotency fails (duplicate message produces duplicate side effect)
      - Health endpoint returns 404 or 500 when dependencies are healthy
    repair_condition: >
      CG-005 failure — fix within wave_5 scope. Common causes:
      (1) Module missing a provider in its providers array → NestJS DI injection error.
      (2) circular dependency between modules → use forwardRef() or restructure.
      (3) Consumer not acking message after success → messages requeue indefinitely.
      (4) Health module not registered in AppModule.
      Do NOT introduce new infrastructure or domain logic during wave_5 repair.
    blocking: true

