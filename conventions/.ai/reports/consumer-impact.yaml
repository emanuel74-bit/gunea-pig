report_id: "consumer-impact"
phase_id: change_impact_analysis
status: complete
summary: >
  12 direct consumers are impacted within pipeline-service. 0 external service consumers are
  impacted (backward_compatible_refactor: no RabbitMQ schema changes, no S3 key pattern changes,
  no Mongoose collection name changes). The highest-impact consumers are the 5 NestJS module
  files (SharedInfraModule, StagingModule, ScanningModule, GroupingModule, AppModule) which drive
  all provider registration wiring. The 7 application/infrastructure class consumers
  (StageVideoHandler, ScanOrchestrator, ProcessScanHandler, FileStagingAdapter, ScanResultClient,
  ScanCompletedConsumer, ScanPurgerService) each require DI token changes at constructor injection
  sites. The @gunea-pig/shared package is impacted by 2 import-source changes
  (S3Adapter and RabbitMQPublisher move to local paths in SharedInfraModule) but its barrel
  exports are not changed — no other consumers of the shared package are affected.

consumers:
  - consumer_id: CON-001
    consumer_package: pipeline-service
    consumer_artifact: SharedInfraModule
    affected_file: packages/pipeline-service/src/shared-infra.module.ts
    affected_imports:
      - "S3Adapter from @gunea-pig/shared → S3StorageAdapter from local shared/infrastructure path"
      - "RabbitMQPublisher from @gunea-pig/shared → RabbitMQPublisher from local shared/infrastructure path"
    affected_providers:
      - "{ provide: S3Adapter, useFactory } → { provide: IStoragePort, useClass: S3StorageAdapter }"
      - "{ provide: RabbitMQPublisher, useFactory } → { provide: IEventPublisher, useFactory: RabbitMQPublisher }"
      - "NEW: { provide: IScanBatchRepository, useClass: ScanBatchRepository } (consolidated)"
    affected_exports:
      - "S3Adapter removed from exports list"
      - "RabbitMQPublisher removed from exports list"
      - "IStoragePort, IEventPublisher, IScanBatchRepository added to exports list"
    migration_required: true
    migration_type: token_replacement_and_addition
    blast_radius: high
    notes: >
      SharedInfraModule is @Global — its export changes propagate to all three submodules
      (StagingModule, ScanningModule, GroupingModule) via NestJS global module resolution.
      The useFactory for RabbitMQPublisher is preserved (async connect() call) — only the
      provide token symbol changes. Verified: current shared-infra.module.ts provides
      S3Adapter at line 18 and RabbitMQPublisher at line 28; exports both at line 36.

  - consumer_id: CON-002
    consumer_package: pipeline-service
    consumer_artifact: StagingModule (PipelineStagingSubmodule)
    affected_file: packages/pipeline-service/src/staging/staging.module.ts
    affected_imports:
      - "VideoDocument/VideoSchema from @gunea-pig/shared → local staging/infrastructure/schemas/video.schema.ts"
      - "S3Adapter from @gunea-pig/shared → removed (inject uses IStoragePort token, no import needed)"
    affected_providers:
      - "{ provide: VideoRepository } → { provide: IVideoRepository, useClass: VideoRepository }"
      - "FileStagingAdapter useFactory inject: [S3Adapter, PIPELINE_CONFIG] → inject: [IStoragePort, PIPELINE_CONFIG]"
      - "StageVideoHandler registration — provider token may remain concrete or change depending on final_role_assignment"
    migration_required: true
    migration_type: token_replacement_and_schema_path_update
    blast_radius: medium
    notes: >
      staging.module.ts currently imports S3Adapter for the FileStagingAdapter factory inject array.
      Post-refactor the inject array uses the IStoragePort symbol directly — no S3Adapter import
      needed in the module file. VideoSchema import path changes from @gunea-pig/shared to local.
      No change to AppModule import of StagingModule.

  - consumer_id: CON-003
    consumer_package: pipeline-service
    consumer_artifact: ScanningModule (PipelineScanningSubmodule)
    affected_file: packages/pipeline-service/src/scanning/scanning.module.ts
    affected_imports:
      - "VideoDocument/VideoSchema from @gunea-pig/shared → local staging/infrastructure/schemas/video.schema.ts"
      - "ScanBatchDocument/ScanBatchSchema from @gunea-pig/shared → local scanning/infrastructure/schemas/scan-batch.schema.ts"
      - "NEW: ScanSchedulerTrigger from local scanning/transport/scan-scheduler.trigger.ts"
    affected_providers:
      - "BatchClaimerService (concrete) → { provide: IBatchClaimerPort, useClass: BatchClaimerService }"
      - "VdfRunnerAdapter (concrete) → { provide: IVdfRunnerPort, useClass: VdfRunnerAdapter }"
      - "VideoScanRepository (concrete) → { provide: IVideoScanRepository, useClass: VideoScanRepository }"
      - "NEW: ScanSchedulerTrigger added to providers array"
    migration_required: true
    migration_type: token_replacement_and_schema_path_update_and_new_provider
    blast_radius: high
    notes: >
      ScanningModule has the most provider additions (3 port token replacements + 1 new provider
      for ScanSchedulerTrigger). Currently 6 providers; will expand to 9+. Schema import paths
      change for both VideoSchema and ScanBatchSchema.

  - consumer_id: CON-004
    consumer_package: pipeline-service
    consumer_artifact: GroupingModule (PipelineGroupingSubmodule)
    affected_file: packages/pipeline-service/src/grouping/grouping.module.ts
    affected_imports:
      - "All 4 schema pairs from @gunea-pig/shared → local capability-scoped paths"
      - "ScanBatchRepository from grouping/infrastructure → REMOVED (no longer locally registered)"
    affected_providers:
      - "ScanResultClient (concrete) → { provide: IScanResultLoader, useClass: ScanResultClient }"
      - "SimilarityEdgeRepository (concrete) → { provide: ISimilarityEdgeRepository, useClass: SimilarityEdgeRepository }"
      - "SimilarityGroupRepository (concrete) → { provide: ISimilarityGroupRepository, useClass: SimilarityGroupRepository }"
      - "VideoSimilarityRepository (concrete) → { provide: IVideoSimilarityRepository, useClass: VideoSimilarityRepository }"
      - "ScanBatchRepository (local) → REMOVED from providers; provided by SharedInfraModule as IScanBatchRepository"
      - "NEW: UnionFindDomainService added to providers array"
    migration_required: true
    migration_type: token_replacement_and_provider_removal_and_schema_path_update
    blast_radius: high
    notes: >
      GroupingModule currently has the most complex wiring change: 4 schema path updates,
      4 concrete-to-token registrations, 1 local provider removal (ScanBatchRepository),
      1 new provider (UnionFindDomainService). IScanBatchRepository is inherited from @Global
      SharedInfraModule — no explicit import needed. IStoragePort is also inherited globally
      for ScanResultClient injection.

  - consumer_id: CON-005
    consumer_package: pipeline-service
    consumer_artifact: PipelineAppModule
    affected_file: packages/pipeline-service/src/app.module.ts
    affected_imports: []
    affected_providers: []
    migration_required: false
    migration_type: none
    blast_radius: low
    notes: >
      AppModule imports SharedInfraModule, StagingModule, ScanningModule, GroupingModule — all
      module names and file paths are unchanged. AppModule itself requires no changes. Verified:
      app.module.ts lines 5-8 import all four modules by name; no direct subdomain provider
      registrations exist at the root module level.

  - consumer_id: CON-006
    consumer_package: pipeline-service
    consumer_artifact: StageVideoHandler
    affected_file: packages/pipeline-service/src/staging/application/stage-video.handler.ts
    affected_imports:
      - "VideoRepository concrete import → IVideoRepository token import"
      - "FileStagingAdapter concrete import → IFileStagingPort token import"
    affected_constructor:
      - "videoRepository: VideoRepository → @Inject(IVideoRepository) videoRepository: IVideoRepository"
      - "fileStagingPort: FileStagingAdapter → @Inject(IFileStagingPort) fileStagingPort: IFileStagingPort"
    migration_required: true
    migration_type: token_replacement_constructor_injection
    blast_radius: medium
    notes: >
      StageVideoHandler also exports VideoAlreadyStagedError and StagingPermanentFailureError inline.
      These must be extracted per LC-004 (PB-005 error boundary behavior lock). VideoReadyConsumer
      imports these error classes — import path changes when they move to a separate errors file.

  - consumer_id: CON-007
    consumer_package: pipeline-service
    consumer_artifact: ScanOrchestrator
    affected_file: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
    affected_imports:
      - "S3Adapter from @gunea-pig/shared → REMOVED (replaced by IStoragePort token symbol)"
      - "RabbitMQPublisher from @gunea-pig/shared → REMOVED (replaced by IEventPublisher token symbol)"
      - "BatchClaimerService import → REMOVED (replaced by IBatchClaimerPort token symbol)"
      - "VdfRunnerAdapter import → REMOVED (replaced by IVdfRunnerPort token symbol)"
      - "VideoScanRepository import → REMOVED (replaced by IVideoScanRepository token symbol)"
    affected_constructor:
      - "batchClaimer: BatchClaimerService → @Inject(IBatchClaimerPort) batchClaimer: IBatchClaimerPort"
      - "vdfRunner: VdfRunnerAdapter → @Inject(IVdfRunnerPort) vdfRunner: IVdfRunnerPort"
      - "videoScanRepo: VideoScanRepository → @Inject(IVideoScanRepository) videoScanRepo: IVideoScanRepository"
      - "s3: S3Adapter → @Inject(IStoragePort) storage: IStoragePort"
      - "publisher: RabbitMQPublisher → @Inject(IEventPublisher) publisher: IEventPublisher"
    affected_call_sites:
      - "normalize(scanId, vdfOutputPath, ...) at line 101 → normalize(scanId, rawContent, ...) after VdfRunnerAdapter SRP fix"
    migration_required: true
    migration_type: token_replacement_constructor_injection_and_signature_update
    blast_radius: medium
    notes: >
      ScanOrchestrator is a split_existing target — its scheduling concern is also extracted
      to ScanSchedulerTrigger. ScanPurgerService injection remains concrete (no port defined).
      VdfManifestNormalizer injection remains concrete (SRP fix only — no port token).
      5 of 7 constructor dependencies become port-token injections.

  - consumer_id: CON-008
    consumer_package: pipeline-service
    consumer_artifact: ProcessScanHandler
    affected_file: packages/pipeline-service/src/grouping/application/process-scan.handler.ts
    affected_imports:
      - "ScanResultClient import → REMOVED (replaced by IScanResultLoader token symbol)"
      - "SimilarityEdgeRepository import → REMOVED (replaced by ISimilarityEdgeRepository token symbol)"
      - "SimilarityGroupRepository import → REMOVED (replaced by ISimilarityGroupRepository token symbol)"
      - "VideoSimilarityRepository import → REMOVED (replaced by IVideoSimilarityRepository token symbol)"
      - "ScanBatchRepository from grouping/infrastructure → REMOVED (replaced by IScanBatchRepository token symbol)"
      - "RabbitMQPublisher from @gunea-pig/shared → REMOVED (replaced by IEventPublisher token symbol)"
      - "UnionFindDomainService import RETAINED (but changed from class-field to constructor injection)"
    affected_constructor:
      - "loader: ScanResultClient → @Inject(IScanResultLoader) loader: IScanResultLoader"
      - "edgeRepo: SimilarityEdgeRepository → @Inject(ISimilarityEdgeRepository) edgeRepo: ISimilarityEdgeRepository"
      - "groupRepo: SimilarityGroupRepository → @Inject(ISimilarityGroupRepository) groupRepo: ISimilarityGroupRepository"
      - "similarityRepo: VideoSimilarityRepository → @Inject(IVideoSimilarityRepository) similarityRepo: IVideoSimilarityRepository"
      - "scanBatchRepo: ScanBatchRepository → @Inject(IScanBatchRepository) scanBatchRepo: IScanBatchRepository"
      - "publisher: RabbitMQPublisher → @Inject(IEventPublisher) publisher: IEventPublisher"
      - "NEW: unionFind: UnionFindDomainService (moved from class field to constructor param)"
    affected_class_fields:
      - "private readonly unionFind = new UnionFindDomainService() → REMOVED (replaced by constructor injection)"
    migration_required: true
    migration_type: token_replacement_constructor_injection_and_di_promotion
    blast_radius: high
    notes: >
      ProcessScanHandler is the most complex consumer migration: 6 concrete deps become port tokens,
      1 class-field instantiation becomes constructor injection, 1 inline error class (ScanAlreadyGroupedError)
      must be extracted. ScanCompletedConsumer injects ProcessScanHandler by class name — class name
      and file path are unchanged so ScanCompletedConsumer import survives without changes.

  - consumer_id: CON-009
    consumer_package: pipeline-service
    consumer_artifact: FileStagingAdapter
    affected_file: packages/pipeline-service/src/staging/infrastructure/file-staging.adapter.ts
    affected_imports:
      - "S3Adapter from @gunea-pig/shared → REMOVED (replaced by IStoragePort token symbol)"
    affected_constructor:
      - "s3: S3Adapter → @Inject(IStoragePort) storage: IStoragePort"
    migration_required: true
    migration_type: token_replacement_constructor_injection
    blast_radius: medium
    notes: >
      FileStagingAdapter also has an inline S3ObjectNotFoundError class that must be extracted
      per LC-004 (PB-005 error boundary lock). StageVideoHandler imports S3ObjectNotFoundError
      from file-staging.adapter — import path will change when the error is extracted.

  - consumer_id: CON-010
    consumer_package: pipeline-service
    consumer_artifact: ScanResultClient
    affected_file: packages/pipeline-service/src/grouping/infrastructure/scan-result.client.ts
    affected_imports:
      - "S3Adapter from @gunea-pig/shared → REMOVED (replaced by IStoragePort token symbol)"
    affected_constructor:
      - "s3: S3Adapter → @Inject(IStoragePort) storage: IStoragePort"
    migration_required: true
    migration_type: token_replacement_constructor_injection
    blast_radius: medium
    notes: >
      ScanResultClient implements IScanResultLoader post-refactor. GroupingModule registers it
      under the IScanResultLoader token. IStoragePort is globally available from SharedInfraModule.

  - consumer_id: CON-011
    consumer_package: pipeline-service
    consumer_artifact: ScanCompletedConsumer
    affected_file: packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
    affected_imports:
      - "ScanResultValidationError import from scan-result.validator RETAINED (catch-block type check)"
    affected_call_sites:
      - "inline validateEvent() method (lines 59-74) must be REMOVED"
      - "NEW: delegate to ScanResultValidator.validateScanResult(rawPayload) instead"
    migration_required: true
    migration_type: inline_method_removal_and_delegation
    blast_radius: low
    notes: >
      ProcessScanHandler injection (constructor line 14) is unchanged — class name and file path
      are stable through the split. No DI token changes at this consumer. The only change is
      removing the duplicate inline validateEvent() and replacing with ScanResultValidator delegation.
      Ack/nack behavior (PB-001) must be characterized before this change is implemented.

  - consumer_id: CON-012
    consumer_package: pipeline-service
    consumer_artifact: ScanPurgerService
    affected_file: packages/pipeline-service/src/scanning/infrastructure/scan-purger.service.ts
    affected_imports:
      - "VdfRunnerAdapter concrete import → REMOVED (replaced by IVdfRunnerPort token symbol)"
      - "VideoScanRepository concrete import → REMOVED (replaced by IVideoScanRepository token symbol)"
    affected_constructor:
      - "vdfRunner: VdfRunnerAdapter → @Inject(IVdfRunnerPort) vdfRunner: IVdfRunnerPort"
      - "videoScanRepo: VideoScanRepository → @Inject(IVideoScanRepository) videoScanRepo: IVideoScanRepository"
    migration_required: true
    migration_type: token_replacement_constructor_injection
    blast_radius: low
    notes: >
      ScanPurgerService has no port interface in the 48-candidate set — ScanOrchestrator retains
      concrete injection of ScanPurgerService. Internal to ScanPurgerService: 2 concrete deps
      become port-token injections. VdfRunnerAdapter call site at line 52 may need update if
      run() return signature changes due to readRawOutput extraction (SEQ-004 dependency).

external_consumer_impact:
  external_contracts_changed: false
  reason: >
    backward_compatible_refactor — all external contracts are preserved per behavior-preservation-requirements.yaml.
    RabbitMQ message schemas (PB-001): NewVideoReadyEvent and ScanCompletedEvent topic names and
    payload field definitions are unchanged. S3 key patterns (PB-003): bucket and key format
    construction logic in FileStagingAdapter and ScanResultClient is unchanged — only the DI
    mechanism for injecting the storage adapter changes. Mongoose collection definitions (PB-002):
    VideoDocument, ScanBatchDocument, SimilarityEdgeDocument, SimilarityGroupDocument @Prop
    definitions and collection name strings are preserved byte-for-byte through the schema move.
    Event ordering (PB-004): VideoReady -> scan -> ScanCompleted consumer chain is structurally
    unchanged — DIP introduction does not reorder events. Error boundary types (PB-005): error
    classes are extracted to separate files but class names, constructor signatures, and
    instanceof hierarchy are preserved.
  affected_external_contracts: []

shared_package_impact:
  package: "@gunea-pig/shared"
  impact_type: no_barrel_change_required
  reason: >
    pipeline-service post-refactor continues to consume @gunea-pig/shared barrel exports for:
    (1) Type-only imports: ScanBatchDocument, ScanBatchStatus, QUEUE_EXCHANGES, ROUTING_KEYS,
    ScanCompletedEvent, NewVideoReadyEvent — all remain valid barrel re-exports.
    (2) @InjectModel decorator type arguments: VideoDocument, ScanBatchDocument,
    SimilarityEdgeDocument, SimilarityGroupDocument — remain valid if shared barrel continues
    to re-export ./db schemas (DECISION-CI-003).
    The concrete class injection imports (S3Adapter, RabbitMQPublisher as DI tokens) are
    removed from pipeline-service but the shared barrel itself is not modified.
  shared_barrel_change_required: false
  shared_barrel_file: packages/shared/src/index.ts
  schema_re_export_must_remain: true
  schema_re_export_reason: >
    6 infrastructure class files use @InjectModel with VideoDocument, ScanBatchDocument,
    SimilarityEdgeDocument, SimilarityGroupDocument. If the shared barrel stops re-exporting
    ./db, all 6 files must update @InjectModel import paths to local schema paths.
    Minimum change: preserve 'export * from ./db' in shared/src/index.ts.

standalone_service_impact:
  packages_affected:
    - staging-service
    - grouping-service
    - vdf-scan-service
  impact_type: none_in_scope
  reason: >
    These sibling packages contain independent duplicate copies of the same classes
    (e.g. grouping-service/src/infrastructure/scan-batch.repository.ts,
    vdf-scan-service/src/application/scan.orchestrator.ts). They are not call sites for
    the pipeline-service refactor — they are standalone duplicates that will be deprecated
    in a future cleanup phase outside this mission scope. The pipeline-service refactor
    does not import from these packages and they do not import from pipeline-service.

evidence_refs:
  - ref: conventions/.ai/reports/call-site-impact.yaml
    section: cross_package_impacts
    consumed_by: consumer_impact_derivation
  - ref: conventions/.ai/reports/call-site-impact.yaml
    section: decisions DECISION-CSI-001 through DECISION-CSI-010
    consumed_by: per_consumer_migration_detail
  - ref: conventions/.ai/reports/behavior-preservation-requirements.yaml
    section: preserved_behaviors PB-001 through PB-005
    consumed_by: external_consumer_impact_determination
  - ref: packages/pipeline-service/src/shared-infra.module.ts
    section: providers and exports
    consumed_by: CON-001 SharedInfraModule migration detail
  - ref: packages/shared/src/index.ts
    section: barrel_exports
    consumed_by: shared_package_impact_determination

triggers_emitted: []

gate_result:
