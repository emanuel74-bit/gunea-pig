report_id: "compatibility-decision"
phase_id: boundary_contract_classification
status: complete

summary: >
  The SOLID refactor mission is a backward_compatible_refactor: all external, durable,
  and cross-service contracts are preserved without change. No migration is required.
  No external surfaces are deprecated. The refactor is purely structural — it introduces
  TypeScript port interfaces at application boundaries, reorganizes module wiring, and
  eliminates code duplication. Every consumer-visible contract (RabbitMQ event schemas,
  MongoDB collection schemas, S3 key pattern, shared package exports) remains identical
  after the refactor. The compatibility strategy selected for all contracts is
  internal_only_change for the structural SOLID work, with a strict additive-only
  constraint applied to the shared package API. No breaking change is introduced or
  planned.

inputs_consumed:
  - source: conventions/.ai/reports/boundary-contract-classification.yaml
    artifact: boundary_contract_classification
    fields_used:
      - boundaries
      - contracts
      - public_surfaces
      - consumer_obligations
      - compatibility_required
  - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
    artifact: codebase_reconnaissance
    fields_used:
      - decisions
      - dependency_signals
      - boundary_signals
      - relevant_artifacts
  - source: conventions/.ai/reports/local-convention-candidates.yaml
    artifact: local_convention_candidates
    fields_used:
      - decisions
      - detected_conventions

decisions:
  - id: DECISION-COMPAT-001
    decision: >
      Select internal_only_change as the compatibility strategy for the application-layer
      port boundary (BND-006 / implicit port contracts). Introducing TypeScript interfaces
      between application handlers and infrastructure dependencies is a pure structural
      refactor. No consumer-visible behavior changes. The DI wiring is updated within
      the same packages; all changes are atomic within this repository.
    rationale: >
      COMPAT-DECISION-001 (change_type: none for external contracts) and the
      synchronized_breaking_change rule (COMPAT-DECISION-005) both confirm that
      structural-only changes to internal module wiring require no external compatibility
      strategy. All consumers of the changed classes are known and within this workspace.
      The behavior contract explicitly states that SOLID restructuring is allowed as long
      as external contracts are preserved.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: DECISION-RECON-006
        value: "DIP violation identified — introducing interfaces is the required fix, not a breaking change"
      - source: conventions/.ai/reports/boundary-contract-classification.yaml
        field: BND-006, stability_class
        value: "internal_mutable — structural reorganization is safe"

  - id: DECISION-COMPAT-002
    decision: >
      Select internal_only_change as the compatibility strategy for the NestJS module
      boundary (BND-005). Reorganizing module imports, exports, and provider registration
      within pipeline-service does not affect any external consumer. The pipeline-service
      module structure is entirely internal to that package.
    rationale: >
      COMPAT-DECISION-001 applies: the module boundary has no external consumers.
      The SharedInfraModule @Global pattern creates hidden coupling that the refactor
      should eliminate, but this is a wiring reorganization not a contract change.
      The resulting runtime behavior (which providers are available, which modules
      are composed) must be preserved.
    evidence:
      - source: conventions/.ai/reports/boundary-contract-classification.yaml
        field: BND-005, visibility
        value: "module_public — no external consumers"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: DECISION-RECON-004
        value: "pipeline-service is the consolidation target; all consumers are within this workspace"

  - id: DECISION-COMPAT-003
    decision: >
      Select backward_compatible_addition as the compatibility strategy for the shared
      package API boundary (CON-009 / BND-004). The refactor may add new port interface
      exports to packages/shared/src/index.ts. Existing exports must not be removed or
      renamed without a separate coordinated change.
    rationale: >
      COMPAT-DECISION-002 applies: change_type is additive (new exports added, none
      removed), consumer_knowledge is all_known, stability_level is internal_stable.
      Adding optional new exports to the shared package index does not break existing
      consumers — they continue importing from the same barrel. The refactor plan calls
      for adding port interfaces (IVideoRepository, IFileStagingPort, IQueuePublisher,
      IS3Client, etc.) to shared without removing the existing concrete class exports.
    evidence:
      - source: packages/shared/src/index.ts
        field: exports
        value: "Current exports are additive baseline; new port interface exports are additions"
      - source: packages/shared/package.json
        field: '"private": true'
        value: "Workspace-only — all consumers are known and atomically updatable"

  - id: DECISION-COMPAT-004
    decision: >
      Confirm change_type: none for all external and durable contracts (CON-001 through
      CON-008). No RabbitMQ event payload fields are changed. No MongoDB collection names
      or field definitions are changed. The S3 key pattern is unchanged. These contracts
      are fully preserved across the refactor.
    rationale: >
      The refactor mission goal is SOLID compliance through structural reorganization —
      specifically DIP (port interfaces), SRP (single-responsibility extraction), and
      ISP (interface segregation). None of these structural changes require modifying
      message schemas, database schemas, or file storage key patterns. COMPAT-DECISION-001
      (change_type: none) applies: no compatibility strategy beyond preservation is needed.
    evidence:
      - source: conventions/.ai/reports/02-behavior-contract.yaml
        field: preserved_behaviors
        value: "All event schemas, MongoDB schemas, S3 patterns explicitly listed as preserved"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: DECISION-RECON-003
        value: "RabbitMQ is the only external interface; no schema change planned"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: DECISION-RECON-011
        value: "MongoDB schemas are stable; no pending migrations"

