migration_required: false

strategy: >
  The compatibility strategy for this SOLID refactor mission is preserve-all-external-contracts
  with additive-only shared-package expansion. Specifically:

  1. All RabbitMQ event schemas (NewVideoReadyEvent, ScanCompletedEvent, ScanPersistedEvent)
     are frozen. No field changes, no schema version changes, no new required fields.
     Strategy: internal_only_change (change_type: none on all event contracts).

  2. All MongoDB collection schemas (videos, scan_batches, similarity_edges,
     similarity_groups) are frozen. No collection name changes, no field removals,
     no required field additions. Strategy: internal_only_change (change_type: none
     on all persistence contracts).

  3. The S3 key pattern for scan result storage is frozen. No change to the key
     derivation logic or the NormalizedScanResult JSON structure.
     Strategy: internal_only_change (change_type: none).

  4. The shared package API is additive-only. New port interface exports may be added
     to packages/shared/src/index.ts. Existing exports are not removed.
     Strategy: backward_compatible_addition (change_type: additive).

  5. The application-layer port boundary (currently implicit) becomes explicit through
     TypeScript interface introduction. This is a pure structural refactor — DI wiring
     changes within each package but no external behavior changes.
     Strategy: internal_only_change.

  6. The NestJS module boundaries within pipeline-service may be reorganized to reduce
     the @Global hidden-coupling pattern. This is entirely internal.
     Strategy: internal_only_change.

deprecation_required: false

