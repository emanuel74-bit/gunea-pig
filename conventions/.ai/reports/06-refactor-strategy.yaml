report_id: "06-refactor-strategy"
phase_id: refactor_strategy_selection
status: complete
summary: >
  Primary strategy: characterization_first (blocks implementation until characterization tests exist).
  Execution strategies: split_then_migrate for ScanOrchestrator (AC-010) and ProcessScanHandler (AC-023)
  splits; extract_then_delegate for ScanSchedulerTrigger (AC-009) extraction;
  incremental_migration for 25 modify_existing DIP boundary introductions.
  Zero tests confirmed (ASSUMP-003 = FALSE) — all implementation blocked until characterization
  test plan is produced and validated by the pre_implementation_gate.

inputs_consumed:
  - source: conventions/.ai/reports/05-artifact-actions.yaml
    artifact: artifact_action_table
  - source: conventions/.ai/reports/post-action-artifact-candidates.yaml
    artifact: post_action_candidates

decisions:
  - id: DECISION-RS-001
    decision: >
      Select characterization_first as the blocking primary strategy.
    rationale: >
      Zero test coverage (ASSUMP-003 confirmed FALSE — no spec or test files exist anywhere in the
      codebase) combined with HIGH risk level triggers SELECT-CHARACTERIZATION-FIRST at priority 2
      in the strategy selection order. behavior_lock_required is therefore true. The convention
      SELECT-CHARACTERIZATION-FIRST rule explicitly blocks implementation until a characterization
      test plan is produced and validated. No implementation phase may begin before that gate passes.
    evidence:
      - source: conventions/.ai/reports/risk-classification.yaml
        field: risk_level
        value: high
      - source: conventions/.ai/reports/assumptions.yaml
        field: assumptions[ASSUMP-003]
        value: "confirmed FALSE — zero test files anywhere in the codebase"

  - id: DECISION-RS-002
    decision: >
      Assign split_then_migrate execution strategy to both split_existing candidates (AC-010, AC-023).
    rationale: >
      ScanOrchestrator (AC-010, 7 co-located responsibilities) and ProcessScanHandler (AC-023,
      6 co-located responsibilities) both require that the source file be decomposed, surviving
      call sites be migrated to the trimmed artifact, and checkpoint validation be applied before
      and after each split step. split_then_migrate is the correct execution strategy for
      split_existing action family artifacts.
    evidence:
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: artifact_action_table[AC-010].selected_action
        value: split_existing
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: artifact_action_table[AC-023].selected_action
        value: split_existing

  - id: DECISION-RS-003
    decision: >
      Assign extract_then_delegate execution strategy to the extract_from_existing candidate (AC-009).
    rationale: >
      ScanSchedulerTrigger (AC-009) is extracted from ScanOrchestrator. The source file retains its
      primary orchestration role while one scheduling subresponsibility is pulled to a new standalone
      file. extract_then_delegate preserves the source artifact's primary role and delegates the
      extracted concern to the new artifact via the surviving call path.
    evidence:
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: artifact_action_table[AC-009].selected_action
        value: extract_from_existing
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: artifact_action_table[AC-009].reason_summary
        value: "extract_from_existing — one subresponsibility (scheduling) is pulled out while primary orchestration role survives"

  - id: DECISION-RS-004
    decision: >
      Assign incremental_migration execution strategy to all 25 modify_existing candidates.
    rationale: >
      The 25 modify_existing artifacts span three capabilities and shared infrastructure. Each
      requires DIP boundary introduction (port interface implementation and DI token registration).
      The cross-module nature of the changes and the absence of any test baseline make incremental
      sequencing with per-artifact checkpoints mandatory. Incremental migration allows each artifact
      to be modified and validated in isolation before the next is touched.
    evidence:
      - source: conventions/.ai/reports/05-artifact-actions.yaml
        field: summary
        value: "modify_existing: 25 candidates (concrete repositories, adapters, consumers, handlers, validators, schema modules, NestJS module wiring)"

selected_strategy: characterization_first
blocks_implementation: true
strategy_reason: >
  The SELECT-CHARACTERIZATION-FIRST rule (priority 2) is triggered when behavior_lock_required is
  true AND test inventory coverage_state is unknown or weak. Both conditions are satisfied here.
  behavior_lock_required is true because LOCK-HIGH-RISK applies (risk_level = high with zero test
  baseline). coverage_state is effectively zero: ASSUMP-003 is confirmed FALSE meaning no spec or
  test files exist anywhere in the codebase. Under these conditions, implementation of any
  decomposition_change or in_place_change action must not proceed until a characterization test
  plan has been produced by the test_derivation phase and the pre_implementation_gate has passed.
  The 12 create_new port interface candidates (pure additive, no existing behavior affected) are
  not blocked by this strategy and may proceed to structure_rendering independently, but their
  consuming artifacts (which require modify_existing or split_existing actions) remain blocked.

execution_strategies:
  - action_type: split_existing
    affected_candidates:
      - AC-010
      - AC-023
    post_action_candidates:
      - PAC-010
      - PAC-023
    execution_strategy: split_then_migrate
    notes: >
      ScanOrchestrator (AC-010, PAC-010) split produces surviving trimmed orchestrator plus
      ScanSchedulerTrigger (PAC-009). ProcessScanHandler (AC-023, PAC-023) split produces
      surviving trimmed handler with DIP-compliant port injections replacing all 6 concrete
      dependencies. Both splits require call-site migration and checkpoint validation before
      and after each step.

  - action_type: extract_from_existing
    affected_candidates:
      - AC-009
    post_action_candidates:
      - PAC-009
    execution_strategy: extract_then_delegate
    notes: >
      ScanSchedulerTrigger (PAC-009) extraction from ScanOrchestrator preserves the
      ScanOrchestrator primary orchestration role. The @Interval(30000) scheduling concern
      is moved to the new standalone trigger file; ScanOrchestrator.run() is invoked by
      delegation from the extracted trigger.

  - action_type: modify_existing
    affected_candidates:
      - AC-001
      - AC-002
      - AC-003
      - AC-006
      - AC-008
      - AC-014
      - AC-016
      - AC-017
      - AC-019
