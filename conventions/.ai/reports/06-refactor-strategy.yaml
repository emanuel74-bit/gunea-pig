      - AC-027
      - AC-029
      - AC-031
      - AC-033
      - AC-035
      - AC-037
      - AC-039
      - AC-040
      - AC-041
      - AC-042
      - AC-043
      - AC-044
      - AC-045
      - AC-046
      - AC-047
      - AC-048
    post_action_candidates:
      - PAC-001 through PAC-003
      - PAC-006
      - PAC-008
      - PAC-014
      - PAC-016
      - PAC-017
      - PAC-019
      - PAC-020
      - PAC-021
      - PAC-022
      - PAC-027
      - PAC-029
      - PAC-031
      - PAC-033
      - PAC-035
      - PAC-037
      - PAC-039
      - PAC-040 through PAC-048
    execution_strategy: incremental_migration
    notes: >
      25 in_place_change artifacts require DIP boundary introduction across three capabilities
      and shared infrastructure. Each artifact is modified and checkpoint-validated in isolation
      before proceeding to the next. Safe sequencing order: shared ports and adapters first,
      then capability repositories and handlers, then NestJS module wiring last.

  - action_type: create_new
    affected_candidates:
      - AC-005
      - AC-007
      - AC-013
      - AC-015
      - AC-018
      - AC-026
      - AC-028
      - AC-030
      - AC-032
      - AC-034
      - AC-036
      - AC-038
    post_action_candidates:
      - PAC-005
      - PAC-007
      - PAC-013
      - PAC-015
      - PAC-018
      - PAC-026
      - PAC-028
      - PAC-030
      - PAC-032
      - PAC-034
      - PAC-036
      - PAC-038
    execution_strategy: structure_rendering
    notes: >
      12 create_new port interface candidates are pure additive. No existing behavior is affected.
      structure_rendering_required trigger applies. These artifacts are not blocked by
      characterization_first for their own creation but their consuming artifacts remain blocked
      until the pre_implementation_gate passes.

  - action_type: reuse_existing
    affected_candidates:
      - AC-004
      - AC-011
      - AC-012
      - AC-024
      - AC-025
    post_action_candidates:
      - PAC-004
      - PAC-011
      - PAC-012
      - PAC-024
      - PAC-025
    execution_strategy: no_action_required
    notes: >
      5 reuse_existing artifacts (domain policies and UnionFindDomainService) are confirmed clean
      with solid_violations: []. No code-level change is applied. These artifacts are not blocked.

rejected_strategies:
  - strategy: no_refactor
    reason: >
      Refactor-like actions are confirmed in the binding action table: split_existing x2 (AC-010,
      AC-023) and extract_from_existing x1 (AC-009). SELECT-NO-REFACTOR requires no refactor need
      — that condition is not met.

  - strategy: split_then_migrate_as_primary
    reason: >
      split_then_migrate is a valid execution strategy for the split_existing candidates but it
      does not address the zero test baseline constraint. SELECT-CHARACTERIZATION-FIRST at priority 2
      supersedes all execution strategy selections as the blocking primary strategy. split_then_migrate
      is retained as an execution strategy within characterization_first, not as the primary strategy.

  - strategy: incremental_migration_as_primary
    reason: >
      Same reasoning as split_then_migrate_as_primary. The zero test baseline makes
      incremental_migration insufficient as the sole primary strategy. It is retained as an
      execution strategy for the 25 modify_existing candidates.

required_behavior_lock:
  lock_required: true
  lock_types:
    - characterization_tests
    - checkpoint_validation_plan
    - contract_tests
    - regression_tests
  lock_surfaces:
    - surface: side_effect_contract
      items:
        - "RabbitMQ consumer ack/nack behavior (PB-001 related — message topics)"
        - "S3 put/get/delete operations (PB-003 related — S3 key patterns)"
      lock_with:
        - integration_tests
        - contract_tests
        - failure_mode_tests
    - surface: public_contract
      items:
        - "RabbitMQ message schemas — topic names and payload field definitions (PB-001)"
        - "S3 key patterns — bucket and key format (PB-003)"
      lock_with:
        - contract_tests
        - compatibility_decision
    - surface: workflow_result
      items:
        - "Scan orchestration pipeline end-to-end result: VideoReady -> scan -> ScanCompleted flow (PB-004)"
      lock_with:
        - integration_tests
        - acceptance_mapping
    - surface: data_semantics
      items:
        - "Mongoose collection names and field definitions (PB-002)"
        - "Document shapes for videos, scan_batches, similarity_edges, similarity_groups collections"
      lock_with:
        - persistence_tests

required_reports:
  - behavior-preservation-requirements
  - characterization-test-plan

required_followups:
  - call_site_impact_analysis
  - change_impact_analysis
  - checkpoint_validation_plan
  - behavior_lock_required
  - test_derivation

blocking_items:
  - id: BLOCK-RS-001
    description: >
      characterization-test-plan must be produced by the test_derivation phase and must exist
      before the pre_implementation_gate passes. No modify_existing, split_existing, or
      extract_from_existing action may be implemented until this gate is cleared.
    blocks: pre_implementation_gate
    required_report: conventions/.ai/reports/characterization-test-plan.yaml

  - id: BLOCK-RS-002
    description: >
      checkpoint-validation-plan must exist before the implementation phase begins. HIGH risk
      level and presence of split_existing actions require checkpoint validation sequencing.
    blocks: implementation
    required_report: conventions/.ai/reports/checkpoint-validation-plan.yaml

triggers_emitted:
  - trigger: refactor_like_action_selected
    reason: >
      split_existing x2 (AC-010, AC-023) and extract_from_existing x1 (AC-009) confirmed.
      These decomposition_change actions require characterization baseline before execution.
  - trigger: structure_rendering_required
    reason: >
      create_new x12 port interface candidates (AC-005, AC-007, AC-013, AC-015, AC-018, AC-026,
      AC-028, AC-030, AC-032, AC-034, AC-036, AC-038) require structure rendering phase.

evidence_refs:
  - ref: conventions/.ai/reports/05-artifact-actions.yaml
    section: artifact_action_table
    consumed_by: strategy_selection
  - ref: conventions/.ai/reports/post-action-artifact-candidates.yaml
    section: post_action_candidates
    consumed_by: execution_strategy_mapping
  - ref: conventions/.ai/reports/risk-classification.yaml
    section: risk_level
    consumed_by: behavior_lock_requirement
  - ref: conventions/.ai/reports/assumptions.yaml
    section: assumptions[ASSUMP-003]
    consumed_by: coverage_state_determination

gate_result:
  gate_id: gate.refactor_strategy_selection.output
  status: pending
  note: Gate result produced by gate subsystem via run_gate_check route. Not authored here.
