report_id: "artifact-reuse-analysis"
phase_id: artifact_reuse_analysis
status: complete
summary: >
  Reuse analysis completed for all 48 artifact candidates across 3 capabilities
  (CAP-001 video_staging, CAP-002 vdf_scanning, CAP-003 video_similarity_grouping)
  plus shared cross-capability infrastructure.

  Verdict distribution:
    no_existing_artifact (create_new hint):  14 candidates — all 12 port interfaces plus
      2 additional artifacts where no matching source file exists in any package.
    modify_existing:                          21 candidates — concrete classes that exist
      in either the standalone services or pipeline-service and need DIP/SRP fixes,
      interface implementation, or DI token registration.
    extract_from_existing:                    7 candidates — logic embedded in larger
      mixed-responsibility classes that must be separated into standalone artifacts.
    split_existing:                           2 candidates — ScanOrchestrator (7 mixed
      responsibilities) and ProcessScanHandler (6 mixed responsibilities) are the two
      flagged mixed_responsibility artifacts; each must be decomposed.
    reuse_as_is:                              4 candidates — clean domain policy classes
      with zero SOLID violations; they exist and need no changes beyond context move.

  Key reuse findings:
  1. All 12 port interfaces (IVideoRepository, IFileStagingPort, IVdfRunnerPort,
     IVideoScanRepository, IBatchClaimerPort, IScanResultLoader, ISimilarityEdgeRepository,
     ISimilarityGroupRepository, IVideoSimilarityRepository, IScanBatchRepository,
     IStoragePort, IEventPublisher) are brand-new artifacts — no interface or port
     abstraction exists anywhere in the codebase (confirmed: DECISION-RECON-006,
     boundary_signals note "No formal ports/interfaces directory exists anywhere").
  2. All 7 concrete repository implementations exist in standalone packages and are
     verbatim-duplicated in pipeline-service. The pipeline-service copies are the
     canonical modification targets; standalone copies will be deprecated.
  3. All 5 adapter implementations (FileStagingAdapter, VdfRunnerAdapter, ScanResultClient,
     S3StorageAdapter, RabbitMQPublisher) exist as concrete classes without port interfaces.
     Each needs modify_existing to implement the corresponding port contract.
  4. All 4 Mongoose schema modules exist as @Schema-decorated classes in the shared package
     (packages/shared/src/db/). They need to be moved to capability-scoped infrastructure
     layers and wrapped as MongooseModule.forFeature registrations — modify_existing.
  5. The 4 domain policy classes (VideoStagingPolicy, BatchClaimPolicy, ScanCleanupPolicy,
     SimilarityThresholdPolicy) are confirmed clean (zero SOLID violations in reconnaissance)
     and exist in standalone packages. The pipeline-service copies are reuse targets
     (reuse_as_is after canonical path alignment, or modify_existing for path move only).
  6. ScanOrchestrator and ProcessScanHandler are the 2 split_existing targets — their
     embedded responsibilities (scheduler trigger, policy logic, validator logic) must be
     extracted before modification.
  7. UnionFindDomainService exists and is clean; only the instantiation call-site
     (new keyword in ProcessScanHandler) needs fixing — the artifact itself is reuse_as_is.
  8. VdfManifestNormalizer exists but mixes file I/O with normalization; the normalizer
     concern is modify_existing (I/O extraction to VdfRunnerAdapter is the SRP fix).
  9. All 5 NestJS module classes exist and need modify_existing to register providers
     under interface tokens and import schema modules.
  10. ScanSchedulerTrigger does NOT exist as a standalone artifact — the @Interval tick is
      embedded in ScanOrchestrator. This is extract_from_existing.

inputs_consumed:
  - source: conventions/.ai/reports/04-draft-role-signals.yaml
    artifact: draft_role_signals
  - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
    artifact: codebase_reconnaissance
  - source: conventions/.ai/reports/local-convention-candidates.yaml
    artifact: local_convention_candidates

decisions:
  - id: DECISION-RA-001
    decision: >
      Zero port/interface abstractions exist anywhere in the codebase. All 12 port
      interface candidates (AC-005, AC-007, AC-013, AC-015, AC-018, AC-026, AC-028,
      AC-030, AC-032, AC-034, AC-036, AC-038) are new artifacts with no existing
      match to reuse, modify, or extract from.
    rationale: >
      Reconnaissance DECISION-RECON-006 confirms: "No TypeScript interface exists between
      any application handler and its dependencies." The boundary_signals section explicitly
      states: "No formal ports/interfaces directory exists anywhere." The artifact-candidates
      report lists existing_artifact_refs: [] for all 12 port candidates. All 13 DIP
      violations documented in the codebase involve direct concrete injection with zero
      interface abstraction in place.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: boundary_signals[4].description
        value: "No formal ports/interfaces directory exists anywhere."
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions[DECISION-RECON-006].evidence[0].value
        value: "VideoRepository, FileStagingAdapter — both concrete classes, no interface"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-005].evidence_refs[2].value
        value: "candidate_role_pressure: port_interface, existing_artifact_refs: [] (new artifact)"

  - id: DECISION-RA-002
    decision: >
      Pipeline-service is the canonical modification target for all existing concrete
      classes. The standalone service packages (staging-service, grouping-service,
      vdf-scan-service) contain the originals, but the pipeline-service submodule
      copies are where all modifications must land — standalone packages will be
      deprecated after consolidation.
    rationale: >
      Reconnaissance DECISION-RECON-004 confirms pipeline-service is a near-verbatim
      duplication of all three standalone services and is "the primary consolidation target
      for the SOLID refactor." The architecture blueprint and mission context confirm
      pipeline-service is the CANONICAL target. Modifying standalone packages would
      create a second implementation target inconsistent with the consolidation goal.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions[DECISION-RECON-004].decision
        value: "Confirm pipeline-service is a near-verbatim code duplication of the three standalone services."
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions[DECISION-RECON-004].rationale
        value: "pipeline-service adds a SharedInfraModule (@Global) and uses unified PipelineConfig"

  - id: DECISION-RA-003
    decision: >
      The 4 Mongoose schema classes in packages/shared/src/db/ are existing artifacts
      that must be modified (moved and wrapped). They are not create_new candidates —
      the @Schema/@Prop definitions already exist and the collection names are LOCKED
      per ASSUMP-003 (DECISION-RECON-002). The modification required is: (1) move
      each schema from shared/src/db/ to its capability-scoped infrastructure/schemas/
      path within pipeline-service; (2) ensure they export MongooseModule.forFeature
      registration. The @Schema class content must be preserved byte-for-byte except
      for the module wrapper.
    rationale: >
      Reconnaissance DECISION-RECON-002 confirms the Mongoose schemas are the ORM
      source of truth. DECISION-RECON-005 classifies their current location in shared/
      as an SRP violation (decorator coupling). The move to capability-scoped paths
      eliminates the SRP violation while preserving exact collection names. Creating
      net-new schema files would risk collection name divergence, which is prohibited.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions[DECISION-RECON-005].evidence[0].value
        value: "@Schema({ collection: 'videos' }) export class VideoDocument"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: relevant_artifacts[packages/shared/src/db/video.schema.ts].solid_violations[0]
        value: "SRP: Mongoose @Schema decorator couples the shared data contract to the NestJS Mongoose infrastructure"

  - id: DECISION-RA-004
    decision: >
      All 4 domain policy classes (VideoStagingPolicy AC-004, BatchClaimPolicy AC-011,
      ScanCleanupPolicy AC-012, SimilarityThresholdPolicy AC-024) are confirmed as
      reuse_as_is with a path_alignment_only caveat: they exist in standalone packages
      as clean artifacts. The pipeline-service copies at the same canonical paths are
      the targets. No code-level change is needed to the policy logic — only context
      (the surrounding module must correctly import them after the DIP refactor).
    rationale: >
      Reconnaissance boundary_signals explicitly states: "Domain policy classes
      (VideoStagingPolicy, SimilarityThreshold, UnionFindDomainService, BatchClaimPolicy,
      ScanCleanupPolicy) are the only truly clean, isolated units in the codebase."
      All 4 have solid_violations: [] in reconnaissance relevant_artifacts. The
      pipeline-service submodule copies are verbatim-identical per DECISION-RECON-004.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: boundary_signals[2].description
        value: "Domain policy classes are the only truly clean, isolated units in the codebase. They have no framework imports and could be tested in isolation."
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: relevant_artifacts[packages/staging-service/src/domain/video-staging.policy.ts].solid_violations
        value: "[]"

  - id: DECISION-RA-005
    decision: >
      ScanSchedulerTrigger (AC-009) does not exist as a standalone file. The @Interval
      tick is embedded inside ScanOrchestrator (packages/vdf-scan-service/src/application/
      scan.orchestrator.ts). This is extract_from_existing with the extraction source
      being ScanOrchestrator, not a separate adapter. The new file must be created at
      pipeline-service/scanning/transport/scan-scheduler.trigger.ts.
    rationale: >
      Draft role signals AC-009 note: "Must be extracted from ScanOrchestrator (currently
      embedded)." Reconnaissance confirms ScanOrchestrator owns the @Interval(30_000)
      tick and "seven distinct responsibilities" (DECISION-RECON-008). The scheduler
      trigger is one of those 7 responsibilities being decomposed out of the split_existing
      ScanOrchestrator.
    evidence:
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-009].notes
        value: "Must be extracted from ScanOrchestrator (currently embedded). Single responsibility: invoke ScanOrchestrator.run()."
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: relevant_artifacts[packages/vdf-scan-service/src/application/scan.orchestrator.ts].solid_violations[0]
        value: "SRP: seven distinct responsibilities in one class"

  - id: DECISION-RA-006
    decision: >
      VdfManifestNormalizer (AC-017) exists in packages/vdf-scan-service/src/infrastructure/
      vdf-manifest.normalizer.ts. It currently mixes file I/O (readRawOutput) with
      normalization logic — an SRP violation. The normalization logic (transform raw
      string to NormalizedScanResult) is an existing artifact to modify_existing; the
      file I/O concern must be extracted to VdfRunnerAdapter (AC-016) during the same
      phase. The normalizer artifact itself is modify_existing (remove file I/O, keep
      pure transformation).
    rationale: >
      Reconnaissance relevant_artifacts entry for vdf-manifest.normalizer.ts lists
      solid_violations: "SRP: file I/O (readRawOutput) mixed with normalization logic."
      Draft role signals AC-017 notes: "SRP fix: file I/O must be extracted to
      VdfRunnerAdapter before this artifact is clean." No normalization equivalent
      exists elsewhere — this artifact is the canonical implementation.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: relevant_artifacts[packages/vdf-scan-service/src/infrastructure/vdf-manifest.normalizer.ts].solid_violations[0]
        value: "SRP: file I/O (readRawOutput) mixed with normalization logic; better separated"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-017].notes
        value: "SRP fix: file I/O must be extracted to VdfRunnerAdapter before this artifact is clean. After fix, zero side effects."

  - id: DECISION-RA-007
    decision: >
      ScanResultValidator (AC-022) has a canonical copy in grouping-service/src/validators/
      scan-result.validator.ts AND is duplicated inline in scan-completed.consumer.ts
      (both grouping-service and pipeline-service). The reuse verdict is modify_existing:
      the grouping-service canonical copy is the source; the pipeline-service submodule
      must have the canonical copy at its canonical path and the inline duplicate in
      ScanCompletedConsumer must be removed. This is a code consolidation action.
    rationale: >
      Reconnaissance DECISION-RECON-013 confirms: "The consumer inlines its own
      validateEvent() method that duplicates the logic in the standalone
      scan-result.validator.ts." Reusable behavior RB-002 confirms duplication.
      The existing validator file is the correct source — it does not need to be
      created, only the inline duplicate removed and canonical path confirmed.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: decisions[DECISION-RECON-013].rationale
        value: "scan-completed.consumer.ts contains a private validateEvent() that duplicates scan-result.validator.ts"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: reusable_behavior[RB-002].description
        value: "NormalizedScanResult validator — validateScanResult() function — implemented identically in grouping-service and pipeline-service"

  - id: DECISION-RA-008
    decision: >
      BatchClaimerService (AC-014) exists in packages/vdf-scan-service/src/infrastructure/
      batch-claimer.service.ts. It currently mixes claim logic with expired-claim recovery
      logic (SRP violation per DECISION-RECON-008 / reconnaissance relevant_artifacts).
      The claim orchestration concern is modify_existing; the recovery concern must be
      extracted separately. The surviving BatchClaimerService after refactor implements
      IBatchClaimerPort and performs only atomic claim coordination.
    rationale: >
      Reconnaissance classifies batch-claimer.service.ts with solid_violations:
      "SRP: claim logic and expired-claim recovery logic combined in one class" and
      "DIP: no IBatchClaimerPort interface." The artifact exists and is modify_existing
      (not split_existing) because only one responsibility survives in the target
      artifact — the recovery concern is extracted to a separate StaleBatchRecoveryService
      (outside the 48 candidate scope, noted in AC-014's notes in draft role signals).
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: relevant_artifacts[packages/vdf-scan-service/src/infrastructure/batch-claimer.service.ts].solid_violations[0]
        value: "SRP: claim logic and expired-claim recovery logic combined in one class"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-014].notes
        value: "Registers under IBatchClaimerPort DI token. Recovery logic must be extracted to dedicated StaleBatchRecoveryService."

  - id: DECISION-RA-009
    decision: >
      StagingMessageValidator (AC-002) exists in packages/staging-service/src/validators/
      staging-message.validator.ts AND is verbatim-duplicated in the pipeline-service
      staging submodule. The pipeline-service copy is the canonical target. The artifact
      is modify_existing because the draft signals note: "Confirm as canonical validator
      — no inline duplicates in VideoReadyConsumer." The validator itself is clean
      (no solid_violations in reconnaissance); the only action needed is confirming
      canonical placement and removing any inline copies in VideoReadyConsumer.
    rationale: >
      Reconnaissance reusable_behavior RB-001 documents the identical event validation
      pattern implemented in multiple places including inline in consumers. The standalone
      validator file already exists as the clean canonical implementation.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: reusable_behavior[RB-001].description
        value: "Identical pattern implemented independently in staging-message.validator.ts, pipeline-service copy, and inline in consumers"
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: relevant_artifacts[packages/staging-service/src/validators/staging-message.validator.ts].solid_violations
        value: "[]"

  - id: DECISION-RA-010
    decision: >
      UnionFindDomainService (AC-025) exists in packages/grouping-service/src/domain/
      union-find.domain-service.ts and is confirmed clean (no SOLID violations, no
      framework imports). It is reuse_as_is — the only action needed is in
      ProcessScanHandler (AC-023): change the 'new UnionFindDomainService()' call-site
      to receive it via NestJS DI injection. The domain service artifact itself requires
      no modification.
    rationale: >
      Reconnaissance relevant_artifacts for union-find.domain-service.ts has
      solid_violations: []. Draft role signals AC-025 notes: "Algorithm is correct.
      Only fix required: ProcessScanHandler must inject via NestJS DI instead of
      using new keyword." The domain service is a pure algorithm with zero framework
      coupling.
    evidence:
      - source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        field: relevant_artifacts[packages/grouping-service/src/domain/union-find.domain-service.ts].solid_violations
        value: "[]"
      - source: conventions/.ai/reports/04-draft-role-signals.yaml
        field: draft_role_signals[AC-025].notes
        value: "Algorithm is correct. Only fix required: ProcessScanHandler must inject via NestJS DI instead of using new keyword."

reuse_analysis:

  # ─────────────────────────────────────────────────
  # CAP-001: Video Staging
  # ─────────────────────────────────────────────────

  - candidate_id: AC-001
    artifact_name: VideoReadyConsumer
    draft_role: consumer
    existing_artifacts_found:
      - path: packages/staging-service/src/transport/video-ready.consumer.ts
        match_quality: exact_duplicate
        notes: "Verbatim copy exists in pipeline-service/src/staging/transport/ — pipeline-service copy is canonical target"
      - path: packages/pipeline-service/src/staging/transport/video-ready.consumer.ts
        match_quality: canonical_target
        notes: "This is the modification target per DECISION-RA-002"
    reuse_verdict: existing_artifact_present
    recommended_action_hint: modify_existing
    reason: >
      VideoReadyConsumer exists as a concrete class in both standalone staging-service and
      pipeline-service. It has no SOLID violations listed in reconnaissance (solid_violations: []).
      However, draft role signals note it must contain delegation only — inline business logic,
      if any exists, must be removed. Additionally, the companion StagingMessageValidator must
      be confirmed as a separate artifact (not inlined). The consumer artifact itself is clean;
      the modification is confirming SRP compliance and injecting StageVideoHandler via port token.
    evidence_refs:
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "relevant_artifacts entry for video-ready.consumer.ts: solid_violations: []"
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "call_sites: consumer delegates to handler via constructor-injected StageVideoHandler.handle(event)"
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        observation: "AC-001 notes: Must be verified to contain no inline business logic. SRP fix: delegation only."
    reuse_blocked_by: null

  - candidate_id: AC-002
    artifact_name: StagingMessageValidator
    draft_role: validator
    existing_artifacts_found:
      - path: packages/staging-service/src/validators/staging-message.validator.ts
        match_quality: exact_clean_canonical
        notes: "Exists as a plain function with no SOLID violations. Pipeline-service copy is verbatim duplicate."
      - path: packages/pipeline-service/src/staging/transport/staging-message.validator.ts
        match_quality: canonical_target
        notes: "Pipeline-service path is the modification target"
    reuse_verdict: existing_artifact_present
    recommended_action_hint: modify_existing
    reason: >
      StagingMessageValidator exists as a clean artifact (solid_violations: [] in reconnaissance).
      The required modification is confirming canonical placement at the pipeline-service path
      and removing any inline validation duplicates in VideoReadyConsumer. The validator logic
      itself requires no change per DECISION-RA-009. Reusable behavior RB-001 documents the
      pattern is already consistent — this validator is the canonical source.
    evidence_refs:
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "relevant_artifacts[staging-message.validator.ts].solid_violations: []"
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "reusable_behavior RB-001: event validation pattern exists in staging-message.validator.ts and as inline duplicates"
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        observation: "AC-002 notes: Confirm as canonical validator — no inline duplicates in VideoReadyConsumer."
    reuse_blocked_by: null

  - candidate_id: AC-003
    artifact_name: StageVideoHandler
    draft_role: handler
    existing_artifacts_found:
      - path: packages/staging-service/src/application/stage-video.handler.ts
        match_quality: exact_duplicate_with_violations
        notes: "Exists with DIP violations (direct VideoRepository + FileStagingAdapter injection) and error class co-location SRP issue"
      - path: packages/pipeline-service/src/staging/application/stage-video.handler.ts
        match_quality: canonical_target
        notes: "Pipeline-service copy confirmed verbatim-identical by DECISION-RECON-004"
    reuse_verdict: existing_artifact_present
    recommended_action_hint: modify_existing
    reason: >
      StageVideoHandler exists in both standalone staging-service and pipeline-service with the
      same DIP violations (direct injection of VideoRepository, FileStagingAdapter). Reconnaissance
      solid_violations: DIP (no interface abstraction), SRP (error classes VideoAlreadyStagedError,
      StagingPermanentFailureError defined inline). Required modifications: inject IVideoRepository,
      IFileStagingPort, IStoragePort via DI tokens; extract error classes to co-located placement
      per LC-004 convention. The core orchestration logic (idempotency check, upsert pending,
      verify S3, stage file, mark staged) is correct and must be preserved.
    evidence_refs:
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "relevant_artifacts[stage-video.handler.ts].solid_violations: DIP depends on concrete VideoRepository and FileStagingAdapter"
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "relevant_artifacts[stage-video.handler.ts].solid_violations: SRP error classes VideoAlreadyStagedError, StagingPermanentFailureError defined in this file"
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        observation: "AC-003 notes: DIP fix required — inject IVideoRepository, IFileStagingPort, IStoragePort via tokens"
    reuse_blocked_by: null

  - candidate_id: AC-004
    artifact_name: VideoStagingPolicy
    draft_role: policy
    existing_artifacts_found:
