    evidence_refs:
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "relevant_artifacts[file-staging.adapter.ts].solid_violations: DIP no IFileStagingPort interface"
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        observation: "AC-007 evidence: port_inventory[PORT-002]: dip_violation_source: no IFileStagingPort currently exists"
    reuse_blocked_by: null

  - candidate_id: AC-008
    artifact_name: FileStagingAdapter
    draft_role: adapter
    existing_artifacts_found:
      - path: packages/staging-service/src/infrastructure/file-staging.adapter.ts
