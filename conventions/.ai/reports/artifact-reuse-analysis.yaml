        match_quality: exact_clean_canonical
        notes: "Pure static policy class. No framework imports. solid_violations: []"
      - path: packages/pipeline-service/src/staging/domain/video-staging.policy.ts
        match_quality: canonical_target
        notes: "Pipeline-service copy is verbatim-identical and is the canonical target path"
    reuse_verdict: existing_artifact_present
    recommended_action_hint: reuse_as_is
    reason: >
      VideoStagingPolicy is a clean, isolated domain policy class with zero SOLID violations
      per reconnaissance. It is a pure static class with no framework imports. The pipeline-service
      copy is the canonical target. No code-level change is needed to the policy logic. The only
      action is ensuring the consuming artifact (StageVideoHandler) correctly references it after
      DIP refactor — the policy itself requires no modification per DECISION-RA-004.
    evidence_refs:
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "relevant_artifacts[video-staging.policy.ts].solid_violations: []"
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "boundary_signals: Domain policy classes are the only truly clean, isolated units in the codebase."
    reuse_blocked_by: null

  - candidate_id: AC-005
    artifact_name: IVideoRepository
    draft_role: port
    existing_artifacts_found: []
    reuse_verdict: no_existing_artifact
    recommended_action_hint: create_new
    reason: >
      No IVideoRepository interface or port exists anywhere in the codebase. All repository
      classes are concrete with no TypeScript interface. Draft signals confirm existing_artifact_refs: [].
      This port must be created new as a TypeScript interface at
      pipeline-service/staging/infrastructure/ports/i-video.repository.ts per DECISION-RA-001.
    evidence_refs:
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "DECISION-RECON-006: No TypeScript interface exists between any application handler and its dependencies"
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "boundary_signals: No formal ports/interfaces directory exists anywhere."
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        observation: "AC-005 evidence: existing_artifact_refs: [] (new artifact)"
    reuse_blocked_by: null

  - candidate_id: AC-006
    artifact_name: VideoRepository
    draft_role: repository
    existing_artifacts_found:
      - path: packages/staging-service/src/infrastructure/video.repository.ts
        match_quality: exact_duplicate_with_violations
        notes: "Exists. DIP violation (no IVideoRepository interface). ISP violation (wide interface with 5 mixed methods)."
      - path: packages/pipeline-service/src/staging/infrastructure/video.repository.ts
        match_quality: canonical_target
        notes: "Pipeline-service copy confirmed verbatim-identical"
    reuse_verdict: existing_artifact_present
    recommended_action_hint: modify_existing
    reason: >
      VideoRepository exists as a Mongoose repository with ISP and DIP violations (no
      IVideoRepository interface; wide interface mixes findByVideoId, upsertPendingStaging,
      markStaged, markStagingFailed, isAlreadyStaged). Required modification: implement
      IVideoRepository interface (ISP-narrowed to the subset consumed by StageVideoHandler)
      and register under the IVideoRepository DI token. The Mongoose @Model injection
      pattern and .lean<T>().exec() discipline must be preserved (LC-006, LC-007).
    evidence_refs:
      - ref: conventions/.ai/reports/03-codebase-reconnaissance.yaml
        observation: "relevant_artifacts[video.repository.ts].solid_violations: ISP wide interface — findByVideoId, upsertPendingStaging, markStaged, markStagingFailed, isAlreadyStaged; DIP no IVideoRepository interface"
      - ref: conventions/.ai/reports/04-draft-role-signals.yaml
        observation: "AC-006 notes: Must implement IVideoRepository interface and register under IVideoRepository DI token"
    reuse_blocked_by: null

  - candidate_id: AC-007
    artifact_name: IFileStagingPort
    draft_role: port
    existing_artifacts_found: []
    reuse_verdict: no_existing_artifact
    recommended_action_hint: create_new
    reason: >
      No IFileStagingPort interface exists anywhere. FileStagingAdapter is a concrete class
      with no interface contract. Draft signals confirm existing_artifact_refs: [] (new artifact).
      The port must be created new at pipeline-service/staging/infrastructure/ports/
