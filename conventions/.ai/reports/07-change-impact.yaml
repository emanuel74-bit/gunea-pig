report_id: "07-change-impact"
phase_id: change_impact_analysis
status: complete
summary: >
  Total impact across the pipeline-service monorepo: 37 modified files, 13 new files (12 port
  interfaces + 1 extracted trigger), 0 deleted files (grouping-local scan-batch.repository.ts is
  consolidated not deleted — its registration moves to SharedInfraModule), and 2 cross-package
  import-path impacts (S3Adapter and RabbitMQPublisher imports move from @gunea-pig/shared to
  local pipeline-service paths; schema imports in 3 module files move from @gunea-pig/shared to
  local capability-scoped paths). 13 DIP violations are inverted via port-token replacement at
  every application-to-infrastructure boundary. SharedInfraModule is the global provider hub for
  the 3 cross-capability ports (IStoragePort, IEventPublisher, IScanBatchRepository). All external
  behavioral contracts (RabbitMQ schemas, S3 key patterns, Mongoose collection names) are
  backward_compatible_refactor — no external contract changes. Implementation is blocked until
  pre_implementation_gate passes (characterization-test-plan + checkpoint-validation-plan required).

inputs_consumed:
  - source: conventions/.ai/reports/call-site-impact.yaml
    artifact: call_site_impact
  - source: conventions/.ai/reports/06-refactor-strategy.yaml
    artifact: refactor_strategy
  - source: conventions/.ai/reports/behavior-preservation-requirements.yaml
    artifact: behavior_preservation_requirements
  - source: conventions/.ai/reports/refactor-required-followups.yaml
    artifact: refactor_required_followups

decisions:
  - id: DECISION-CI-001
    decision: >
      SharedInfraModule (@Global) is the authoritative provider registration point for all three
      cross-capability port tokens: IStoragePort (consumes S3StorageAdapter), IEventPublisher
      (consumes RabbitMQPublisher), and IScanBatchRepository (consumes consolidated
      ScanBatchRepository). All three submodule consumers (StagingModule, ScanningModule,
      GroupingModule) inherit these providers via @Global without explicit imports.
    rationale: >
      SharedInfraModule is already @Global and currently exports PIPELINE_CONFIG, SCAN_OUTPUT_DIR,
      S3Adapter, and RabbitMQPublisher globally. The three cross-capability ports map cleanly to
      the existing global provider pattern. Centralizing IScanBatchRepository here eliminates the
      grouping-local ScanBatchRepository registration and ensures a single canonical provider for
      both GroupingModule and any future consumer.
    evidence:
      - source: packages/pipeline-service/src/shared-infra.module.ts
        observation: "@Global decorator at line 9; exports: [PIPELINE_CONFIG, SCAN_OUTPUT_DIR, S3Adapter, RabbitMQPublisher] at line 36"

  - id: DECISION-CI-002
    decision: >
      Concrete imports of S3Adapter and RabbitMQPublisher from @gunea-pig/shared must be replaced
      by local imports of S3StorageAdapter and RabbitMQPublisher from pipeline-service/src/shared/infrastructure
      in SharedInfraModule. All other pipeline-service files that imported these concrete class tokens
      must use the IStoragePort and IEventPublisher symbols instead. The @gunea-pig/shared barrel
      continues to export both concrete classes for other packages — no shared barrel change required.
    rationale: >
      Five files import S3Adapter from @gunea-pig/shared (PAC-037 blast radius = HIGH). Three files
      import RabbitMQPublisher from @gunea-pig/shared (PAC-039 blast radius = HIGH). Post-refactor
      all injection sites use port token symbols. SharedInfraModule is the only file that needs to
      import the concrete adapter class — all other files use only the port token symbol.
    evidence:
      - source: conventions/.ai/reports/call-site-impact.yaml
        section: candidate PAC-037
        observation: "5 import sites for S3Adapter across pipeline-service"
      - source: conventions/.ai/reports/call-site-impact.yaml
        section: candidate PAC-039
        observation: "3 import sites for RabbitMQPublisher across pipeline-service"

  - id: DECISION-CI-003
    decision: >
      Schema documents (VideoDocument, ScanBatchDocument, SimilarityEdgeDocument,
      SimilarityGroupDocument) will be moved from packages/shared/src/db/ to capability-scoped
      paths within pipeline-service. The @gunea-pig/shared barrel's db/ re-export is preserved
      so that @InjectModel type imports in infrastructure class files remain valid without path
      changes. Only the MongooseModule.forFeature() registration import sites in scanning.module.ts,
      grouping.module.ts, and staging.module.ts must be updated to local paths.
    rationale: >
      Two distinct usage patterns exist for schema documents: (1) MongooseModule.forFeature
      registration in module files — must point to the definitive schema file location;
      (2) @InjectModel decorator type references in infrastructure class files — are type-only
      and remain valid as long as the barrel re-exports them. Preserving the barrel re-export
      is the minimal-disruption path for the @InjectModel consumers (BatchClaimerService,
      VideoScanRepository, ScanPurgerService, SimilarityEdgeRepository, SimilarityGroupRepository,
      VideoSimilarityRepository, ScanBatchRepository grouping copy).
    evidence:
      - source: packages/shared/src/index.ts
        observation: "export * from './db' at line 5 — barrel re-exports all db schemas"
      - source: conventions/.ai/reports/call-site-impact.yaml
        section: candidate PAC-040
        observation: "Three module files use VideoDocument/VideoSchema from @gunea-pig/shared for MongooseModule.forFeature"

  - id: DECISION-CI-004
    decision: >
      The grouping-local copy at packages/pipeline-service/src/grouping/infrastructure/scan-batch.repository.ts
      is rendered obsolete by PAC-035 (consolidated ScanBatchRepository). GroupingModule's local
      provider registration for ScanBatchRepository must be removed. The consolidated
      ScanBatchRepository at packages/pipeline-service/src/shared/infrastructure/scan-batch.repository.ts
      will be registered under IScanBatchRepository in SharedInfraModule. The grouping-local file
      is a deletion candidate only after the consolidated file is in place — sequencing requires the
      consolidated file to be created first.
    rationale: >
      PAC-035 call site analysis (DECISION-CSI-009) confirms: grouping.module.ts line 38 currently
      registers the local copy; ProcessScanHandler (line 40) injects it directly. Both must switch
      to the IScanBatchRepository token pointing to the consolidated shared provider.
    evidence:
      - source: conventions/.ai/reports/call-site-impact.yaml
        section: candidate PAC-035
        observation: "GroupingModule registers grouping-local ScanBatchRepository at line 37-38; must be replaced by IScanBatchRepository provided by SharedInfraModule"

  - id: DECISION-CI-005
    decision: >
      VdfManifestNormalizer.normalize() signature changes from accepting (scanId, outputPath, ...)
      to accepting (scanId, rawContent, ...) due to readRawOutput() extraction to VdfRunnerAdapter.
      This is an internal pipeline-service call site change only — VdfManifestNormalizer has no
      external consumers. ScanOrchestrator is the sole call site and must pass raw content from
      VdfRunnerAdapter.run() return value instead of the outputPath string.
    rationale: >
      DECISION-CSI-008 establishes this SRP fix. The signature change is scoped to a single internal
      call site in scan.orchestrator.ts line 101. No external contract impact (PB-003 S3 key patterns
      concern only the adapter methods, not VdfManifestNormalizer internals).
    evidence:
      - source: conventions/.ai/reports/call-site-impact.yaml
        section: candidate PAC-017
        observation: "ScanOrchestrator calls normalize(scanId, vdfOutputPath, ...) at line 101 — signature must change to pass raw content"

  - id: DECISION-CI-006
    decision: >
      UnionFindDomainService must be promoted from a class-field direct instantiation
      (private readonly unionFind = new UnionFindDomainService()) to a NestJS-injected provider.
      GroupingModule must add UnionFindDomainService to its providers array. This is an
      intra-module wiring change with zero cross-module impact.
    rationale: >
      DECISION-CSI-010 confirms UnionFindDomainService bypasses DI container at ProcessScanHandler
      line 33. No code change to UnionFindDomainService itself (reuse_existing). The impact is
      limited to GroupingModule (add to providers) and ProcessScanHandler (convert class field to
      constructor param). This aligns with the characterization_required scope for ProcessScanHandler.
    evidence:
      - source: conventions/.ai/reports/call-site-impact.yaml
        section: candidate PAC-025
        observation: "ProcessScanHandler line 33 new keyword; GroupingModule has no UnionFindDomainService provider"

