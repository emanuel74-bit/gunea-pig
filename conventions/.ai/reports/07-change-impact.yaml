report_id: "07-change-impact"
phase_id: change_impact_analysis
schema_version: "1.0"
status: complete

summary: >
  Change impact analysis for VDF pipeline greenfield. No existing consumers to break.
  Three forward-looking impact surfaces identified: (1) shared-types changes propagate
  to all 3 services and require coordinated rebuild; (2) VDF CLI output format changes
  break VdfOutputNormalizerAdapter only — all other artifacts shielded; (3) MongoDB
  scan_states schema changes affect all 3 services. Impact severity is contained by
  the adapter/port isolation designed in the architecture blueprint.

inputs_consumed:
  - source: .ai/reports/call-site-impact.yaml
    type: call_site_impact
  - source: .ai/reports/05-artifact-actions.yaml
    type: artifact_action_table

existing_consumers_impacted: []
reason_no_existing_impact: Greenfield project — no existing consumers or implementations

forward_impact_surfaces:

  - impact_id: CI-001
    surface: shared-types package changes
    severity: high
    affected_artifacts:
      - all VSS artifacts that import from shared-types
      - all VBS artifacts that import from shared-types
      - all SGS artifacts that import from shared-types
    specific_artifacts_at_risk:
      - AC-VSS-002 (NewVideoConsumer — imports NewVideoReadyForScanEvent)
      - AC-VBS-012 (ScanCompletedPublisher — imports ScanCompletedEvent)
      - AC-SGS-002 (ScanCompletedConsumer — imports ScanCompletedEvent)
      - AC-VSS-007 / AC-VBS-013 (repositories import ScanStateSchema)
    impact_description: >
      Adding required fields to NewVideoReadyForScanEvent or ScanCompletedEvent breaks
      all consumers and producers. Adding fields to ScanStateSchema requires MongoDB
      migration or backward-compatible optional fields. shared-types changes require
      coordinated rebuild of all three services.
    mitigation:
      - Always add new fields as optional with defaults
      - Include schema_version in all event DTOs (already planned)
      - Use @IsOptional validators on new fields in shared-types
    validation_ref: .ai/reports/dependency-classification.yaml#DV-003

  - impact_id: CI-002
    surface: VDF CLI output format changes
    severity: medium
    affected_artifacts:
      - AC-VBS-008 (VdfOutputNormalizerAdapter — sole parser of VDF output)
    impact_description: >
      If VDF CLI changes its JSON output schema (field names, structure, version),
      VdfOutputNormalizerAdapter must be updated. All downstream artifacts (ScanExecutionService,
      ResultPublicationService, S3ScanResultWriterAdapter, SGS ingestion chain) are
      shielded by the NormalizedScanResult interface and require no changes.
    mitigation:
      - VdfOutputNormalizerAdapter must check VDF output version and fail explicitly on unknown version
      - ARCH-ASMP-004 documents the assumed format; test VDF output format in unit tests
    validation_ref: .ai/reports/architecture-blueprint.yaml#ARCH-ASMP-004

  - impact_id: CI-003
    surface: MongoDB scan_states collection schema changes
    severity: high
    affected_artifacts:
      - AC-SHARED-SCHEMA-001 (ScanStateSchema — shared definition)
      - AC-VSS-007 (ScanStateRepository VSS)
      - AC-VBS-013 (ScanStateRepository VBS)
      - AC-SGS-010 (GroupingCompletionWriterAdapter)
      - AC-SGS-003 (ScanResultIngestionService — reads scan state for idempotency)
    impact_description: >
      scan_states collection schema is used by all 3 services. Adding required fields
      (without defaults) breaks existing documents and causes CAS queries to mismatch.
      Removing indexed fields breaks queries.
    mitigation:
      - Only add optional fields with default values
      - Keep existing index keys stable; add indexes non-blocking
      - ScanStateSchema is the single source of truth in shared-types
    validation_ref: .ai/reports/architecture-blueprint.yaml#ARCH-ASMP-005

  - impact_id: CI-004
    surface: RabbitMQ exchange topology changes
    severity: medium
    affected_artifacts:
      - AC-VSS-002 (NewVideoConsumer — binds vdf.pipeline.ingest)
      - AC-VBS-012 (ScanCompletedPublisher — publishes to vdf.pipeline.scan)
      - AC-SGS-002 (ScanCompletedConsumer — binds vdf.pipeline.scan)
      - AC-VSS-012 / AC-VBS-INFRA-001 / AC-SGS-INFRA-001 (RabbitMqModule — declares topology)
    impact_description: >
      Changing exchange names, routing keys, or DLX topology requires coordinated
      update of all three RabbitMqModules and their consumers/publishers.
    mitigation:
      - Exchange names must be config-driven via env vars; do not hardcode in consumers/publishers
      - Topology is declared in RabbitMqModule; changes in one place propagate to consumer/publisher via config
    validation_ref: .ai/reports/architecture-blueprint.yaml#ARCH-ASMP-003

  - impact_id: CI-005
    surface: S3 key schema changes
    severity: low
    affected_artifacts:
      - AC-VBS-011 (S3ScanResultWriterAdapter — writes using key schema)
      - AC-SGS-005 (S3ScanResultLoaderAdapter — reads using key from ScanCompletedEvent)
    impact_description: >
      If S3 key schema changes, VBS must update S3ScanResultWriterAdapter and the
      ScanCompletedEvent result_location field. SGS uses result_location from the event
      directly — no hardcoded path in SGS.
    mitigation:
      - S3 key construction is in S3ScanResultWriterAdapter only; SGS reads from event field
      - result_location is passed in ScanCompletedEvent, not reconstructed by SGS
    validation_ref: .ai/reports/architecture-blueprint.yaml#ARCH-ASMP-006

triggers_emitted: []

gate_result:
  gate_id: gate.change_impact_analysis.output
  status: pass
  failures: []

produced_outputs:
  - .ai/reports/07-change-impact.yaml
  - .ai/reports/consumer-impact.yaml
