sequence_implications:
  - constraint_id: SEQ-001
    description: "Port interfaces (create_new x12) must be created BEFORE any modify_existing or split_existing of their implementing/consuming artifacts"
    before: "create_new: IVideoRepository, IFileStagingPort, IBatchClaimerPort, IVdfRunnerPort, IVideoScanRepository, IScanResultLoader, ISimilarityEdgeRepository, ISimilarityGroupRepository, IVideoSimilarityRepository, IScanBatchRepository, IStoragePort, IEventPublisher"
    after: "modify_existing: VideoRepository, FileStagingAdapter, StageVideoHandler, BatchClaimerService, VdfRunnerAdapter, VideoScanRepository, ScanResultClient, SimilarityEdgeRepository, SimilarityGroupRepository, VideoSimilarityRepository, ScanBatchRepository, S3StorageAdapter, RabbitMQPublisher; split_existing: ScanOrchestrator, ProcessScanHandler"
    rationale: "TypeScript compile-time references require interface definitions to exist before implementing class declarations"

  - constraint_id: SEQ-002
    description: "SharedInfraModule must register port-to-adapter bindings BEFORE submodule consumers are modified to use those port tokens"
    before: "modify SharedInfraModule (PAC-047): add IStoragePort, IEventPublisher, IScanBatchRepository provider bindings"
    after: "modify StagingModule (PAC-044), ScanningModule (PAC-045), GroupingModule (PAC-046) to reference port tokens"
    rationale: "@Global provider must exist before NestJS bootstrap resolves submodule injections at runtime"

  - constraint_id: SEQ-003
    description: "Consolidated ScanBatchRepository must be created and registered in SharedInfraModule BEFORE grouping-local ScanBatchRepository registration is removed from GroupingModule"
    before: "create consolidated ScanBatchRepository at shared/infrastructure (PAC-035) + register IScanBatchRepository in SharedInfraModule"
    after: "remove local ScanBatchRepository from GroupingModule providers; ProcessScanHandler switches to IScanBatchRepository token"
    rationale: "NestJS will throw at bootstrap if IScanBatchRepository token is consumed before it is provided"

  - constraint_id: SEQ-004
    description: "VdfRunnerAdapter SRP fix (readRawOutput extraction) must complete BEFORE ScanOrchestrator normalize() call site is updated"
    before: "modify VdfRunnerAdapter (PAC-016) to absorb readRawOutput and return raw content from run()"
    after: "modify ScanOrchestrator scan.orchestrator.ts line 101 to pass rawContent instead of vdfOutputPath to normalize()"
    rationale: "If ScanOrchestrator is changed first, it will reference a rawContent property that does not exist on the VdfRunnerAdapter run() return type"

  - constraint_id: SEQ-005
    description: "Schema files must be moved and their local paths confirmed BEFORE module files update their MongooseModule.forFeature imports"
    before: "move VideoDocument to staging/infrastructure/schemas, ScanBatchDocument to scanning/infrastructure/schemas, SimilarityEdge/SimilarityGroupDocument to grouping/infrastructure/schemas"
    after: "update scanning.module.ts, staging.module.ts, grouping.module.ts MongooseModule.forFeature import paths"
    rationale: "TypeScript module resolver will fail if import paths reference non-existent files"

  - constraint_id: SEQ-006
    description: "characterization-test-plan must exist and pre_implementation_gate must pass BEFORE any split_existing, extract_from_existing, or modify_existing action is executed"
    before: "test_derivation phase produces characterization-test-plan.yaml; checkpoint_validation_plan phase produces checkpoint-validation-plan.yaml; pre_implementation_gate passes"
    after: "ALL implementation of modify_existing x25, split_existing x2, extract_from_existing x1"
    rationale: "LOCK-001 (LOCK-HIGH-RISK) and LOCK-002 (LOCK-EXTRACT-SPLIT-REPLACE) are active; characterization_first primary strategy blocks implementation gate"

  - constraint_id: SEQ-007
    description: "final_role_assignment phase must resolve the IVideoSimilarityRepository ISP split decision (OPEN-FU-001) BEFORE structure_rendering of IVideoSimilarityRepository"
    before: "final_role_assignment confirms: single IVideoSimilarityRepository vs IVideoSimilarityReader + IVideoSimilarityWriter split"
    after: "structure_rendering of IVideoSimilarityRepository (PAC-032); modify VideoSimilarityRepository (PAC-033)"
    rationale: "Interface file count and DI token count depend on ISP split decision; cannot render structure without knowing the interface shape"

