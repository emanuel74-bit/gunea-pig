    new_export: "IStoragePort (interface symbol token, useClass: S3StorageAdapter)"
    affected_consumers:
      - staging.module.ts FileStagingAdapter factory
      - scan.orchestrator.ts constructor
      - file-staging.adapter.ts constructor
      - scan-result.client.ts constructor
    breaking_for_external: false
    notes: "backward_compatible_refactor — injection token changes but injected implementation behavior is identical; PB-003 S3 key patterns preserved"

  - artifact: SharedInfraModule exported tokens
    change_type: token_replacement
    old_export: "RabbitMQPublisher (concrete class token from @gunea-pig/shared)"
    new_export: "IEventPublisher (interface symbol token, useClass: RabbitMQPublisher)"
    affected_consumers:
      - scan.orchestrator.ts constructor
      - process-scan.handler.ts constructor
    breaking_for_external: false
    notes: "backward_compatible_refactor — RabbitMQ message schemas (PB-001) are unchanged; only the DI token symbol changes"

  - artifact: SharedInfraModule exported tokens
    change_type: token_addition
    old_export: "(not exported)"
    new_export: "IScanBatchRepository (interface symbol token, useClass: consolidated ScanBatchRepository)"
    affected_consumers:
