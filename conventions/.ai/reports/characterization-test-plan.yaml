characterization_test_plan:
  report_id: "characterization-test-plan"
  phase_id: test_derivation
  status: complete
  blocking_item_id: BLOCK-RS-001
  summary: >
    Characterization test plan covering all 5 preserved behaviors (PB-001..PB-005).
    37 concrete test cases across contract, integration, and unit types.
    All topic names, collection names, payload fields, S3 key patterns, and error class
    names are sourced directly from the pipeline-service and shared package source files
    at the time of this phase. This report satisfies BLOCK-RS-001 and enables
    pre_implementation_gate to proceed. Test files are to be authored during the
    implementation phase (phase 26) BEFORE any production code is changed.

  zero_tests_baseline:
    confirmed: true
    assumption_id: ASSUMP-003
    note: >
      No characterization tests exist yet. This plan describes what must be written.
      The test cases below must ALL pass against the pre-refactor codebase before
      any production code modification begins. They then serve as the regression
      baseline for post-refactor validation.

  preserved_behavior_coverage:

    - preserved_behavior_id: PB-001
      description: >
        RabbitMQ message schemas — all topic name strings in @EventPattern decorators,
        all exchange names and routing keys used in publisher.publish() calls,
        and all payload interface field definitions.
      source_files_inspected:
        - packages/pipeline-service/src/staging/transport/video-ready.consumer.ts
        - packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
        - packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
        - packages/pipeline-service/src/grouping/application/process-scan.handler.ts
        - packages/shared/src/types/queue.types.ts
        - packages/shared/src/queue/rabbitmq.client.ts

      test_cases:

        - test_case_id: TC-CHAR-001
          test_type: contract
          priority: critical
          purpose: >
            Assert VideoReadyConsumer subscribes to the exact topic string 'video.ready-for-scan'
            and does not change after DIP refactor of constructor injection.
          target_artifact: VideoReadyConsumer
          target_file: packages/pipeline-service/src/staging/transport/video-ready.consumer.ts
          source_evidence:
            file: packages/pipeline-service/src/staging/transport/video-ready.consumer.ts
            line: 19
            verbatim: "@EventPattern('video.ready-for-scan')"
          setup: >
            Read @EventPattern metadata from VideoReadyConsumer using Reflect.getMetadata or
            inspect the decorator argument via NestJS testing utilities.
          assertions:
            - "VideoReadyConsumer handle() method is decorated with @EventPattern"
            - "The @EventPattern value equals the exact string 'video.ready-for-scan'"
            - "The string does not change to 'video.ready_for_scan' or any variant after refactor"
          test_file_path: packages/pipeline-service/test/characterization/video-ready-consumer.contract.spec.ts
          command: "npx jest --testPathPattern=video-ready-consumer.contract"

        - test_case_id: TC-CHAR-002
          test_type: contract
          priority: critical
          purpose: >
            Assert VideoReadyConsumer payload validation requires the exact NewVideoReadyEvent
            field set: {eventId, schemaVersion='1.0', videoId, s3ObjectKey, s3Bucket, timestamp, correlationId}.
          target_artifact: VideoReadyConsumer + StagingMessageValidator
          target_files:
            - packages/pipeline-service/src/staging/transport/video-ready.consumer.ts
            - packages/pipeline-service/src/staging/transport/staging-message.validator.ts
          source_evidence:
            file: packages/shared/src/types/queue.types.ts
            lines: [7, 15]
            verbatim: "NewVideoReadyEvent { eventId, schemaVersion: '1.0', videoId, s3ObjectKey, s3Bucket, timestamp, correlationId }"
          setup: >
            Call validateStagingMessage() directly with valid and invalid payloads.
          assertions:
            - "validateStagingMessage({ schemaVersion: '1.0', eventId: 'e1', videoId: 'v1', s3ObjectKey: 'k', s3Bucket: 'b', timestamp: new Date().toISOString(), correlationId: 'c1' }) returns without throwing"
            - "validateStagingMessage with schemaVersion !== '1.0' throws StagingMessageValidationError"
            - "validateStagingMessage with missing videoId throws StagingMessageValidationError"
            - "validateStagingMessage with missing s3ObjectKey throws StagingMessageValidationError"
            - "validateStagingMessage with missing s3Bucket throws StagingMessageValidationError"
            - "validateStagingMessage with non-ISO timestamp throws StagingMessageValidationError"
          test_file_path: packages/pipeline-service/test/characterization/staging-message-schema.contract.spec.ts
          command: "npx jest --testPathPattern=staging-message-schema.contract"

        - test_case_id: TC-CHAR-003
          test_type: contract
          priority: critical
          purpose: >
            Assert ScanCompletedConsumer subscribes to the exact topic string 'scan.completed'
            and does not change after DIP refactor.
          target_artifact: ScanCompletedConsumer
          target_file: packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
          source_evidence:
            file: packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
            line: 16
            verbatim: "@EventPattern('scan.completed')"
          setup: >
            Read @EventPattern metadata from ScanCompletedConsumer.
          assertions:
            - "ScanCompletedConsumer handle() method is decorated with @EventPattern"
            - "The @EventPattern value equals the exact string 'scan.completed'"
          test_file_path: packages/pipeline-service/test/characterization/scan-completed-consumer.contract.spec.ts
          command: "npx jest --testPathPattern=scan-completed-consumer.contract"

        - test_case_id: TC-CHAR-004
          test_type: contract
          priority: critical
          purpose: >
            Assert ScanCompletedConsumer payload validation requires the exact ScanCompletedEvent
            field set: {eventId, scanId, resultS3Key, resultS3Bucket, timestamp, correlationId, videoIds (non-empty array)}.
          target_artifact: ScanCompletedConsumer (inline validateEvent)
          target_file: packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
          source_evidence:
            file: packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
            lines: [59, 74]
            verbatim: "required = ['eventId', 'scanId', 'resultS3Key', 'resultS3Bucket', 'timestamp', 'correlationId']; videoIds must be non-empty array"
          setup: >
            Invoke validateEvent() via NestJS test module or direct instantiation with mock ProcessScanHandler.
          assertions:
            - "Valid ScanCompletedEvent payload passes validation without error"
            - "Missing eventId field causes validation to throw with message containing 'eventId'"
            - "Missing scanId field causes validation to throw"
            - "Missing resultS3Key causes validation to throw"
            - "Missing resultS3Bucket causes validation to throw"
            - "videoIds as empty array causes validation to throw with 'must be a non-empty array'"
            - "videoIds as non-array causes validation to throw"
          test_file_path: packages/pipeline-service/test/characterization/scan-completed-schema.contract.spec.ts
          command: "npx jest --testPathPattern=scan-completed-schema.contract"

        - test_case_id: TC-CHAR-005
          test_type: contract
          priority: critical
          purpose: >
            Assert RabbitMQPublisher.publish() is called with exchange='scan.events' and
            routingKey='scan.completed' when ScanOrchestrator completes a scan cycle.
            This preserves the exact wire-level routing that ScanCompletedConsumer subscribes to.
          target_artifact: ScanOrchestrator
          target_file: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
          source_evidence:
            file: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
            lines: [148, 149]
            verbatim: "exchange: QUEUE_EXCHANGES.SCAN_EVENTS, routingKey: ROUTING_KEYS.SCAN_COMPLETED"
            resolved_values: "exchange='scan.events', routingKey='scan.completed'"
          setup: >
            Create ScanOrchestrator with mocked IBatchClaimerPort, IVdfRunnerPort, IVideoScanRepository,
            IStoragePort, and IEventPublisher. Mock VDF run to return valid output. Assert publish call.
          assertions:
            - "publisher.publish() called exactly once per successful scan cycle"
            - "publish() called with exchange === 'scan.events'"
            - "publish() called with routingKey === 'scan.completed'"
            - "publish() payload contains fields: {eventId, schemaVersion: '1.0', scanId, resultS3Key, resultS3Bucket, videoIds, scannerVersion, scannerProfile, timestamp, correlationId}"
          test_file_path: packages/pipeline-service/test/characterization/scan-orchestrator-publish.contract.spec.ts
          command: "npx jest --testPathPattern=scan-orchestrator-publish.contract"

        - test_case_id: TC-CHAR-006
          test_type: contract
          priority: critical
          purpose: >
            Assert ProcessScanHandler.handle() calls publisher.publish() with exchange='scan.events'
            and routingKey='scan.persisted' (ScanPersistedEvent) after successful grouping.
          target_artifact: ProcessScanHandler
          target_file: packages/pipeline-service/src/grouping/application/process-scan.handler.ts
          source_evidence:
            file: packages/pipeline-service/src/grouping/application/process-scan.handler.ts
            lines: [73, 74]
            verbatim: "exchange: QUEUE_EXCHANGES.SCAN_EVENTS, routingKey: ROUTING_KEYS.SCAN_PERSISTED"
            resolved_values: "exchange='scan.events', routingKey='scan.persisted'"
          setup: >
            Create ProcessScanHandler with mocked port interfaces. Mock IScanBatchRepository
            to return not-already-grouped. Mock IScanResultLoader to return valid NormalizedScanResult.
          assertions:
            - "publisher.publish() called with exchange === 'scan.events'"
            - "publisher.publish() called with routingKey === 'scan.persisted'"
            - "publish payload contains fields: {eventId, schemaVersion: '1.0', scanId, timestamp, correlationId}"
          test_file_path: packages/pipeline-service/test/characterization/process-scan-publish.contract.spec.ts
          command: "npx jest --testPathPattern=process-scan-publish.contract"

    - preserved_behavior_id: PB-002
      description: >
        Mongoose collection definitions — all four @Schema({ collection: '...' }) decorator
        values and all required @Prop field names on each document class. These must be
        preserved byte-for-byte when schema files move from packages/shared/src/db/ to
        capability-scoped paths within pipeline-service.
      source_files_inspected:
        - packages/shared/src/db/video.schema.ts
        - packages/shared/src/db/scan-batch.schema.ts
        - packages/shared/src/db/similarity-edge.schema.ts
        - packages/shared/src/db/similarity-group.schema.ts

      test_cases:

        - test_case_id: TC-CHAR-007
          test_type: contract
          priority: critical
          purpose: >
            Assert VideoDocument @Schema collection name equals 'videos' and all required
            @Prop fields are present after schema file move to staging/infrastructure/schemas/.
          target_artifact: VideoDocument (post-move path)
          target_file: packages/pipeline-service/src/staging/infrastructure/schemas/video.schema.ts
          source_evidence:
            file: packages/shared/src/db/video.schema.ts
            line: 11
            verbatim: "@Schema({ collection: 'videos', timestamps: true })"
            required_props: [videoId, s3Key, s3Bucket, scanState, stagingAttempts]
          setup: >
            Import VideoSchema from the post-move path. Use SchemaFactory output or
            inspect the schema options directly.
          assertions:
            - "VideoDocument @Schema collection option equals 'videos'"
            - "VideoDocument @Schema timestamps option is true"
            - "VideoDocument has @Prop videoId (string, required, unique, index)"
            - "VideoDocument has @Prop s3Key (string, required)"
            - "VideoDocument has @Prop s3Bucket (string, required)"
            - "VideoDocument has @Prop scanState (enum ScanState, required)"
            - "VideoDocument has @Prop stagingAttempts (default: 0)"
          test_file_path: packages/pipeline-service/test/characterization/video.schema.contract.spec.ts
          command: "npx jest --testPathPattern=video.schema.contract"

        - test_case_id: TC-CHAR-008
          test_type: contract
          priority: critical
          purpose: >
            Assert ScanBatchDocument @Schema collection name equals 'scan_batches' and all
            required @Prop fields are present after schema file move to scanning/infrastructure/schemas/.
          target_artifact: ScanBatchDocument (post-move path)
          target_file: packages/pipeline-service/src/scanning/infrastructure/schemas/scan-batch.schema.ts
          source_evidence:
            file: packages/shared/src/db/scan-batch.schema.ts
            line: 12
            verbatim: "@Schema({ collection: 'scan_batches', timestamps: true })"
            required_props: [scanId, status, videoIds, ownerId, claimedAt, expiresAt, retryCount]
          assertions:
            - "ScanBatchDocument @Schema collection option equals 'scan_batches'"
            - "ScanBatchDocument has @Prop scanId (string, required, unique, index)"
            - "ScanBatchDocument has @Prop status (enum ScanBatchStatus, required)"
            - "ScanBatchDocument has @Prop videoIds (string[], required)"
            - "ScanBatchDocument has @Prop ownerId (string, required)"
            - "ScanBatchDocument has @Prop claimedAt (Date, required)"
            - "ScanBatchDocument has @Prop expiresAt (Date, required, index)"
            - "ScanBatchDocument has @Prop retryCount (default: 0)"
          test_file_path: packages/pipeline-service/test/characterization/scan-batch.schema.contract.spec.ts
          command: "npx jest --testPathPattern=scan-batch.schema.contract"

        - test_case_id: TC-CHAR-009
          test_type: contract
          priority: critical
          purpose: >
            Assert SimilarityEdgeDocument @Schema collection name equals 'similarity_edges' and
            all required @Prop fields are present after schema file move to grouping/infrastructure/schemas/.
          target_artifact: SimilarityEdgeDocument (post-move path)
          target_file: packages/pipeline-service/src/grouping/infrastructure/schemas/similarity-edge.schema.ts
          source_evidence:
            file: packages/shared/src/db/similarity-edge.schema.ts
            line: 10
            verbatim: "@Schema({ collection: 'similarity_edges', timestamps: true })"
            required_props: [videoIdA, videoIdB, score, scanId]
          assertions:
            - "SimilarityEdgeDocument @Schema collection option equals 'similarity_edges'"
            - "SimilarityEdgeDocument has @Prop videoIdA (string, required, index)"
            - "SimilarityEdgeDocument has @Prop videoIdB (string, required, index)"
            - "SimilarityEdgeDocument has @Prop score (number, required)"
            - "SimilarityEdgeDocument has @Prop scanId (string, required, index)"
            - "SimilarityEdgeSchema unique compound index: {videoIdA, videoIdB, scanId}"
          test_file_path: packages/pipeline-service/test/characterization/similarity-edge.schema.contract.spec.ts
          command: "npx jest --testPathPattern=similarity-edge.schema.contract"

        - test_case_id: TC-CHAR-010
          test_type: contract
          priority: critical
          purpose: >
            Assert SimilarityGroupDocument @Schema collection name equals 'similarity_groups'
            and all required @Prop fields are present after schema file move.
          target_artifact: SimilarityGroupDocument (post-move path)
          target_file: packages/pipeline-service/src/grouping/infrastructure/schemas/similarity-group.schema.ts
          source_evidence:
            file: packages/shared/src/db/similarity-group.schema.ts
            line: 12
            verbatim: "@Schema({ collection: 'similarity_groups', timestamps: true })"
            required_props: [groupId, videoIds, representativeVideoId]
          assertions:
            - "SimilarityGroupDocument @Schema collection option equals 'similarity_groups'"
            - "SimilarityGroupDocument has @Prop groupId (string, required, unique, index, default: randomUUID)"
            - "SimilarityGroupDocument has @Prop videoIds (string[], required)"
            - "SimilarityGroupDocument has @Prop representativeVideoId (string, required)"
            - "SimilarityGroupSchema index: {videoIds: 1}"
          test_file_path: packages/pipeline-service/test/characterization/similarity-group.schema.contract.spec.ts
          command: "npx jest --testPathPattern=similarity-group.schema.contract"

        - test_case_id: TC-CHAR-011
          test_type: integration
          priority: critical
          purpose: >
            Assert MongooseModule.forFeature() registration with the moved schema files resolves
            to the correct MongoDB collection names at NestJS module bootstrap.
          target_artifact: StagingModule, ScanningModule, GroupingModule
          setup: >
            Use @nestjs/testing createTestingModule with MongoMemoryServer (mongodb-memory-server).
            Register each module with MongooseModule.forFeature() using the post-move schema paths.
            Inject the model and query the collection name.
          assertions:
            - "VideoModel (from StagingModule) has modelName or collectionName === 'videos'"
            - "ScanBatchModel (from ScanningModule) has collectionName === 'scan_batches'"
            - "SimilarityEdgeModel (from GroupingModule) has collectionName === 'similarity_edges'"
            - "SimilarityGroupModel (from GroupingModule) has collectionName === 'similarity_groups'"
          test_file_path: packages/pipeline-service/test/characterization/schema-module-wiring.integration.spec.ts
          command: "npx jest --testPathPattern=schema-module-wiring.integration"

    - preserved_behavior_id: PB-003
      description: >
        S3 key patterns — the scan result key template 'scans/${scanId}/result.json' constructed
        in ScanOrchestrator must be preserved after DIP refactor. File staging and scan result
        loading pass through caller-supplied S3 keys without modification — this pass-through
        behavior must also be preserved.
      source_files_inspected:
        - packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
        - packages/pipeline-service/src/staging/infrastructure/file-staging.adapter.ts
        - packages/pipeline-service/src/grouping/infrastructure/scan-result.client.ts

      test_cases:

        - test_case_id: TC-CHAR-012
          test_type: contract
          priority: critical
          purpose: >
            Assert ScanOrchestrator constructs the S3 key for scan results using the exact
            template 'scans/${scanId}/result.json' and this template does not change after
            DIP refactor (IStoragePort replaces S3Adapter).
          target_artifact: ScanOrchestrator
          target_file: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
          source_evidence:
            file: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
            line: 109
            verbatim: "const resultS3Key = `scans/${scanId}/result.json`"
          setup: >
            Create ScanOrchestrator with mocked port interfaces. Capture the argument passed
            to IStoragePort.putJson() during a successful scan cycle.
          assertions:
            - "IStoragePort.putJson() is called with key matching regex /^scans\\/[a-z0-9-]+\\/result\\.json$/"
            - "For scanId='test-scan-123', the key equals exactly 'scans/test-scan-123/result.json'"
            - "The key template does not include any timestamp, random suffix, or other modification"
            - "The bucket used is config.s3.bucketScanResults (not hardcoded)"
          test_file_path: packages/pipeline-service/test/characterization/scan-orchestrator-s3-key.contract.spec.ts
          command: "npx jest --testPathPattern=scan-orchestrator-s3-key.contract"

        - test_case_id: TC-CHAR-013
          test_type: contract
          priority: important
          purpose: >
            Assert FileStagingAdapter passes the S3 key through to IStoragePort.downloadToFile()
            without modification. The key originates from NewVideoReadyEvent.s3ObjectKey and
            must not be transformed.
          target_artifact: FileStagingAdapter
          target_file: packages/pipeline-service/src/staging/infrastructure/file-staging.adapter.ts
          source_evidence:
            file: packages/pipeline-service/src/staging/infrastructure/file-staging.adapter.ts
            lines: [31, 37]
            verbatim: "stageFromS3(videoId, bucket, key) -> s3.downloadToFile({ bucket, key }, destinationPath)"
          setup: >
            Create FileStagingAdapter with mocked IStoragePort. Call stageFromS3() with a
            known bucket and key. Assert downloadToFile receives the exact same key.
          assertions:
            - "IStoragePort.downloadToFile() called with the exact bucket and key passed to stageFromS3()"
            - "No path prefix, suffix, or transformation is applied to the key"
            - "The local destination path is path.join(scanPath, videoId + ext) — key is not used for local path"
          test_file_path: packages/pipeline-service/test/characterization/file-staging-adapter-s3-key.contract.spec.ts
          command: "npx jest --testPathPattern=file-staging-adapter-s3-key.contract"

        - test_case_id: TC-CHAR-014
          test_type: contract
          priority: important
          purpose: >
            Assert ScanResultClient passes the S3 key through to IStoragePort.getJson()
            without modification. The key originates from ScanCompletedEvent.resultS3Key.
          target_artifact: ScanResultClient
          target_file: packages/pipeline-service/src/grouping/infrastructure/scan-result.client.ts
          source_evidence:
            file: packages/pipeline-service/src/grouping/infrastructure/scan-result.client.ts
            line: 13
            verbatim: "s3.getJson({ bucket: resultS3Bucket, key: resultS3Key })"
          setup: >
            Create ScanResultClient with mocked IStoragePort. Call load() with known bucket
            and key. Assert getJson receives the exact same inputs.
          assertions:
            - "IStoragePort.getJson() called with the exact bucket and key passed to load()"
            - "No key transformation applied"
          test_file_path: packages/pipeline-service/test/characterization/scan-result-client-s3-key.contract.spec.ts
          command: "npx jest --testPathPattern=scan-result-client-s3-key.contract"

    - preserved_behavior_id: PB-004
      description: >
        Inter-service event ordering — VideoReady -> video staged -> ScanBatch claimed ->
        VDF run -> ScanCompleted published -> grouping applied -> ScanPersisted published.
        This ordering must be preserved after ScanOrchestrator split and DIP introduction.
      source_files_inspected:
        - packages/pipeline-service/src/staging/transport/video-ready.consumer.ts
        - packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
        - packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
        - packages/pipeline-service/src/grouping/application/process-scan.handler.ts

      test_cases:

        - test_case_id: TC-CHAR-015
          test_type: integration
          priority: critical
          purpose: >
            Assert VideoReadyConsumer -> StageVideoHandler chain: receiving a valid
            NewVideoReadyEvent causes StageVideoHandler.handle() to be called, which calls
            IVideoRepository and IFileStagingPort in the correct order.
          target_artifact: VideoReadyConsumer + StageVideoHandler
          setup: >
            NestJS test module with mocked IVideoRepository and IFileStagingPort.
            Publish a valid NewVideoReadyEvent via the consumer handle() method.
          assertions:
            - "StageVideoHandler.handle() is called with the deserialized event"
            - "IVideoRepository.isAlreadyStaged() called first"
            - "IVideoRepository.upsertPendingStaging() called before IFileStagingPort.stageFromS3()"
            - "IFileStagingPort.verifyS3ObjectExists() called before stageFromS3()"
            - "IVideoRepository.markStaged() called after successful staging"
          test_file_path: packages/pipeline-service/test/characterization/staging-pipeline.integration.spec.ts
          command: "npx jest --testPathPattern=staging-pipeline.integration"

        - test_case_id: TC-CHAR-016
          test_type: integration
          priority: critical
          purpose: >
            Assert ScanOrchestrator.runScanCycle() executes the correct sequence:
            claimNextBatch -> transitionStatus(SCANNING) -> buildVideoIdMap -> VDF run ->
            putJson to S3 -> transitionStatus(SCAN_EXPORTED) -> markScanCompleted ->
            transitionStatus(PENDING_GROUPING) -> publish ScanCompletedEvent.
          target_artifact: ScanOrchestrator
          setup: >
            Create ScanOrchestrator with mocked IBatchClaimerPort (returns a batch),
            IVdfRunnerPort (returns outputPath), IVideoScanRepository, IStoragePort,
            IEventPublisher. Track call order.
          assertions:
            - "claimNextBatch() called first"
            - "transitionBatchStatus(scanId, CLAIMED, SCANNING) called before VDF run"
            - "IVdfRunnerPort.run() called after batch status = SCANNING"
            - "IStoragePort.putJson() called after VDF completes"
            - "IEventPublisher.publish() called AFTER S3 upload with ScanCompletedEvent payload"
            - "IEventPublisher.publish() exchange='scan.events', routingKey='scan.completed'"
            - "No publish() call if claimNextBatch() returns null (no batch)"
          test_file_path: packages/pipeline-service/test/characterization/scan-orchestrator.integration.spec.ts
          command: "npx jest --testPathPattern=scan-orchestrator.integration"

        - test_case_id: TC-CHAR-017
          test_type: integration
          priority: critical
          purpose: >
            Assert ProcessScanHandler.handle() executes the correct sequence:
            isAlreadyGrouped check -> load scan result -> filter matches -> persist edges ->
            apply group merge -> markGroupingCompleted -> publish ScanPersistedEvent.
          target_artifact: ProcessScanHandler
          setup: >
            Create ProcessScanHandler with mocked IScanBatchRepository, IScanResultLoader,
            ISimilarityEdgeRepository, ISimilarityGroupRepository, IVideoSimilarityRepository,
            IEventPublisher. Provide a ScanCompletedEvent with a valid resultS3Key/Bucket.
          assertions:
            - "IScanBatchRepository.isAlreadyGrouped() called first"
            - "IScanResultLoader.load() called after grouped check"
            - "ISimilarityEdgeRepository.persistEdges() called before IEventPublisher.publish()"
            - "IScanBatchRepository.markGroupingCompleted() called before IEventPublisher.publish()"
            - "IEventPublisher.publish() called last with ScanPersistedEvent on exchange='scan.events', routingKey='scan.persisted'"
          test_file_path: packages/pipeline-service/test/characterization/process-scan-handler.integration.spec.ts
          command: "npx jest --testPathPattern=process-scan-handler.integration"

        - test_case_id: TC-CHAR-018
          test_type: integration
          priority: critical
          purpose: >
            Assert ScanCompletedConsumer correctly delegates to ProcessScanHandler.handle()
            and ack/nack behavior is correct for the success path.
          target_artifact: ScanCompletedConsumer
          setup: >
            NestJS test module with mocked ProcessScanHandler. Call ScanCompletedConsumer.handle()
            with a valid ScanCompletedEvent payload and mocked RmqContext.
          assertions:
            - "ProcessScanHandler.handle() called with deserialized ScanCompletedEvent"
            - "channel.ack() called on success"
            - "channel.nack(msg, false, false) called when ProcessScanHandler throws non-idempotent error"
            - "channel.ack() called when ScanAlreadyGroupedError is thrown (idempotent)"
          test_file_path: packages/pipeline-service/test/characterization/scan-completed-consumer.integration.spec.ts
          command: "npx jest --testPathPattern=scan-completed-consumer.integration"

    - preserved_behavior_id: PB-005
      description: >
        Error boundary types — all exception classes thrown at consumer-facing boundaries
        and their observable effects (ack vs nack, error name strings, instanceof checks).
        These must be preserved after inline error classes are extracted to separate files
        per LC-004.
      source_files_inspected:
        - packages/pipeline-service/src/staging/transport/video-ready.consumer.ts
        - packages/pipeline-service/src/staging/transport/staging-message.validator.ts
        - packages/pipeline-service/src/staging/application/stage-video.handler.ts
        - packages/pipeline-service/src/staging/infrastructure/file-staging.adapter.ts
        - packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
        - packages/pipeline-service/src/grouping/application/process-scan.handler.ts
        - packages/pipeline-service/src/grouping/infrastructure/scan-result.validator.ts
        - packages/pipeline-service/src/scanning/infrastructure/vdf-runner.adapter.ts

