  additional_characterization_tests:
    description: >
      Tests covering DI module wiring and the ScanOrchestrator/ScanSchedulerTrigger split
      that are not directly tied to a single preserved behavior but are required before
      implementation proceeds.

    test_cases:

      - test_case_id: TC-CHAR-029
        test_type: integration
        priority: critical
        purpose: >
          Assert SharedInfraModule @Global providers resolve correctly: IStoragePort ->
          S3StorageAdapter, IEventPublisher -> RabbitMQPublisher, IScanBatchRepository ->
          ScanBatchRepository (consolidated).
        target_artifact: SharedInfraModule
        setup: >
          NestJS createTestingModule including SharedInfraModule with mock configuration.
          Request IStoragePort, IEventPublisher, IScanBatchRepository injection tokens.
        assertions:
          - "IStoragePort token resolves to S3StorageAdapter instance"
          - "IEventPublisher token resolves to RabbitMQPublisher instance"
          - "IScanBatchRepository token resolves to ScanBatchRepository (consolidated) instance"
          - "All three are exported globally and visible to StagingModule, ScanningModule, GroupingModule"
        test_file_path: packages/pipeline-service/test/characterization/shared-infra-module.integration.spec.ts
        command: "npx jest --testPathPattern=shared-infra-module.integration"

      - test_case_id: TC-CHAR-030
        test_type: integration
        priority: critical
        purpose: >
          Assert ScanSchedulerTrigger is correctly registered in ScanningModule and delegates
          to ScanOrchestrator.runScanCycle() when triggered.
        target_artifact: ScanSchedulerTrigger
        setup: >
          NestJS test module with ScanningModule. Mock ScanOrchestrator. Manually call
          ScanSchedulerTrigger.triggerScanCycle() or equivalent @Interval method.
        assertions:
          - "ScanSchedulerTrigger is registered as a NestJS provider in ScanningModule"
          - "ScanSchedulerTrigger method is decorated with @Interval"
          - "When triggered, ScanOrchestrator.runScanCycle() is called"
          - "ScanOrchestrator no longer carries @Interval decorator after split"
        test_file_path: packages/pipeline-service/test/characterization/scan-scheduler-trigger.integration.spec.ts
        command: "npx jest --testPathPattern=scan-scheduler-trigger.integration"

      - test_case_id: TC-CHAR-031
        test_type: integration
        priority: important
        purpose: >
          Assert ScanOrchestrator handles the 'no batch' case correctly — when
          IBatchClaimerPort.claimNextBatch() returns null, no VDF run occurs and
          no ScanCompleted event is published.
        target_artifact: ScanOrchestrator
        assertions:
          - "claimNextBatch() returns null -> IVdfRunnerPort.run() never called"
          - "claimNextBatch() returns null -> IEventPublisher.publish() never called"
          - "isRunning guard: concurrent runScanCycle() calls return early without double-processing"
        test_file_path: packages/pipeline-service/test/characterization/scan-orchestrator.integration.spec.ts
        command: "npx jest --testPathPattern=scan-orchestrator.integration"

      - test_case_id: TC-CHAR-032
        test_type: integration
        priority: important
        purpose: >
          Assert ScanOrchestrator handles VDF failure: when IVdfRunnerPort.run() throws,
          batch status is set to FAILED and no ScanCompleted event is published.
        target_artifact: ScanOrchestrator
        assertions:
          - "IVdfRunnerPort.run() throws -> transitionBatchStatus(scanId, SCANNING, FAILED) called"
          - "IVdfRunnerPort.run() throws -> IEventPublisher.publish() never called"
          - "IVdfRunnerPort.run() throws -> IVideoScanRepository.markScanFailed() called"
        test_file_path: packages/pipeline-service/test/characterization/scan-orchestrator.integration.spec.ts
        command: "npx jest --testPathPattern=scan-orchestrator.integration"

      - test_case_id: TC-CHAR-033
        test_type: integration
        priority: important
        purpose: >
          Assert ProcessScanHandler handles already-grouped case: when IScanBatchRepository
          .isAlreadyGrouped() returns true, ScanAlreadyGroupedError is thrown immediately
          without loading the scan result from S3.
        target_artifact: ProcessScanHandler
        assertions:
          - "isAlreadyGrouped() returns true -> ScanAlreadyGroupedError thrown"
          - "isAlreadyGrouped() returns true -> IScanResultLoader.load() never called"
          - "isAlreadyGrouped() returns true -> ISimilarityEdgeRepository.persistEdges() never called"
          - "isAlreadyGrouped() returns true -> IEventPublisher.publish() never called"
        test_file_path: packages/pipeline-service/test/characterization/process-scan-handler.integration.spec.ts
        command: "npx jest --testPathPattern=process-scan-handler.integration"

      - test_case_id: TC-CHAR-034
        test_type: unit
        priority: critical
        purpose: >
          Assert ScanResultValidator (validateScanResult function) preserves all required
          field validation rules: scanId, videoIds (non-empty array), matches (array),
          match fields (videoIdA, videoIdB, score in [0,1]).
        target_artifact: ScanResultValidator
        source_evidence:
          file: packages/pipeline-service/src/grouping/infrastructure/scan-result.validator.ts
          lines: [12, 35, 51, 61]
          verbatim: "throws ScanResultValidationError for: non-object, missing scanId, empty videoIds, non-array matches, invalid match fields"
        assertions:
          - "validateScanResult with valid NormalizedScanResult returns without throwing"
          - "validateScanResult with null throws ScanResultValidationError"
          - "validateScanResult with empty videoIds throws ScanResultValidationError"
          - "validateScanResult with non-array matches throws ScanResultValidationError"
          - "validateScanResult with match.score outside [0,1] throws ScanResultValidationError"
          - "validateScanResult with missing match.videoIdA throws ScanResultValidationError"
        test_file_path: packages/pipeline-service/test/characterization/scan-result-validator.unit.spec.ts
        command: "npx jest --testPathPattern=scan-result-validator.unit"

      - test_case_id: TC-CHAR-035
        test_type: unit
        priority: critical
        purpose: >
          Assert UnionFindDomainService.buildConnectedComponents() produces correct connected
          components from a list of similarity matches. This is the core grouping algorithm
          that must be preserved.
        target_artifact: UnionFindDomainService
        assertions:
          - "Two isolated videos with no match -> two components of size 1"
          - "A-B match + B-C match -> one component {A, B, C}"
          - "A-B match + C-D match -> two components {A,B} and {C,D}"
          - "All videos in videoIds are represented in components (no video dropped)"
          - "Video with no edges appears in its own singleton component"
        test_file_path: packages/pipeline-service/test/characterization/union-find.unit.spec.ts
        command: "npx jest --testPathPattern=union-find.unit"

      - test_case_id: TC-CHAR-036
        test_type: unit
        priority: important
        purpose: >
          Assert SimilarityThresholdPolicy filterStorable() and filterMergeEligible() apply
          the correct threshold semantics from the config. These filter methods drive what
          edges and groups are persisted.
        target_artifact: SimilarityThresholdPolicy
        assertions:
          - "filterStorable() returns matches with score >= storeEdgeScore"
          - "filterMergeEligible() returns matches with score >= autoMergeGroupScore"
          - "Matches below threshold are excluded from returned array"
          - "Both methods are pure functions — no side effects"
        test_file_path: packages/pipeline-service/test/characterization/similarity-threshold-policy.unit.spec.ts
        command: "npx jest --testPathPattern=similarity-threshold-policy.unit"

      - test_case_id: TC-CHAR-037
        test_type: unit
        priority: important
        purpose: >
          Assert VdfManifestNormalizer.normalize() produces valid NormalizedScanResult
          from raw VDF output (post-signature-change: takes rawContent string/object
          instead of vdfOutputPath). This verifies the SRP fix does not break normalization.
        target_artifact: VdfManifestNormalizer
        assertions:
          - "normalize(scanId, rawContent, videoIdMap, scannerVersion, scannerProfile) returns NormalizedScanResult"
          - "Result contains scanId, videoIds (from videoIdMap), matches (from rawContent)"
          - "Invalid rawContent throws a structured error"
          - "videoIdMap is applied correctly to translate file paths to videoIds in matches"
        test_file_path: packages/pipeline-service/test/characterization/vdf-manifest-normalizer.unit.spec.ts
        command: "npx jest --testPathPattern=vdf-manifest-normalizer.unit"

