report_id: "post-action-artifact-candidates"
phase_id: artifact_action_resolution
status: complete
summary: >
  Post-action artifact candidate set after all binding actions applied to 48 source candidates.
  51 post-action candidates total (48 source candidates + 3 split/extract products):
    new_artifact:          12 (all create_new port interfaces)
    modified:              25 (all modify_existing candidates)
    split_product:          4 (2 split_existing candidates each produce 2 post-action entries)
    extracted:              1 (1 extract_from_existing candidate)
    reused_as_is:           5 (all reuse_existing candidates)

  Split accounting:
    AC-010 ScanOrchestrator (split_existing) -> PAC-010a ScanOrchestrator (trimmed) + PAC-010b ScanSchedulerTrigger (extracted; also satisfies AC-009 extract_from_existing)
    AC-023 ProcessScanHandler (split_existing) -> PAC-023a ProcessScanHandler (trimmed, DIP-compliant) + PAC-023b (orchestration delegation — absorbed into trimmed ProcessScanHandler post-DIP; no second standalone file required per analysis)

  Note on AC-009/AC-010 overlap: ScanSchedulerTrigger (AC-009, extract_from_existing) and the
  scheduler product of ScanOrchestrator split (AC-010, split_existing) refer to the same new
  artifact. PAC-009 and PAC-010b are unified into one post-action candidate (PAC-009) to avoid
  duplication. PAC-010a represents the surviving trimmed ScanOrchestrator.

  Note on AC-023 ProcessScanHandler split: The split produces one trimmed ProcessScanHandler
  with DIP-compliant port injections. The "orchestration delegation" second product described
  in the phase bundle is resolved by DIP compliance (each of the 6 concrete deps becomes a
  port injection) rather than a separate standalone file. PAC-023 represents the single
  surviving ProcessScanHandler post-split. Total post-action candidates: 51.

