report_id: assumptions
phase_id: behavior_contract
schema_version: "1.0"
status: complete

summary: >
  Assumptions recorded for the VDF-Based Video Similarity Pipeline
  implementation. Distinguishes blocking assumptions (mission cannot proceed
  without confirmation) from non-blocking assumptions (reasonable defaults
  that can be adjusted during architecture).

inputs_consumed:
  - source: docs/system-requirements.md
    type: mission_request

decisions:
  - decision_id: ASMP-001
    decision_type: assumption_classification
    selected_value: no_blocking_assumptions_identified
    reason_summary: >
      All assumptions are non-blocking. The system requirements are explicit
      about technology constraints and service boundaries. VDF output format
      and infrastructure details are unresolved ambiguities but can be
      resolved during architecture without blocking the behavior contract.
    evidence: docs/system-requirements.md section 1 (technology constraints)

evidence_refs:
  - docs/system-requirements.md
  - .ai/reports/02-behavior-contract.yaml

triggers_emitted: []

gate_result:
  gate_id: gate.behavior_contract.output
  status: pass
  failures: []

assumptions:
  - id: A-001
    statement: >
      VDF (Video Duplicate Finder) is available as an installed CLI tool
      accessible from the VBS container/host filesystem. VDF can be invoked
      programmatically via child_process.
    category: external_tooling
    blocking: false
    risk: >
      If VDF requires a different invocation mechanism (daemon, REST API),
      the VBS VDF integration wrapper must adapt.

  - id: A-002
    statement: >
      RabbitMQ, MongoDB, and S3-compatible storage are pre-provisioned and
      accessible from all three services. Connection configuration is
      provided via environment variables.
    category: infrastructure
    blocking: false
    risk: Low. Standard setup for NestJS microservices.

  - id: A-003
    statement: >
      Video files referenced in new-video-ready-for-scan messages exist in
      S3 at the specified location at the time the message is processed.
      The system-requirements document guarantees this as a precondition.
    category: precondition
    blocking: false
    risk: >
      If S3 objects are missing, VSS reports a structured failure (VSS-E-002)
      and does not stage the video.

  - id: A-004
    statement: >
      The VDF scan path is a shared mounted filesystem volume accessible by
      the VBS service. VDF can read from and write to this path.
    category: infrastructure
    blocking: false
    risk: >
      Volume mounting configuration must be specified in deployment manifests
      outside the scope of this implementation.

  - id: A-005
    statement: >
      VDF produces a deterministic, parseable output file (JSON or CSV) for
      each scan run that contains pairwise similarity scores between videos.
    category: external_tooling
    blocking: false
    risk: >
      If VDF output format is not parseable or not deterministic, the
      normalization layer in VBS requires redesign. Treat VDF output format
      as an isolation point.

  - id: A-006
    statement: >
      MongoDB supports the write concern and atomic operations required for
      scan state machine transitions and batch claim CAS operations
      (findOneAndUpdate with conditions).
    category: infrastructure
    blocking: false
    risk: Low. Standard MongoDB 4.x+ capabilities.

  - id: A-007
    statement: >
      The similarity threshold configuration values are provided as
      environment variables or a configuration file loaded at service startup.
      No runtime threshold updates are required.
    category: configuration
    blocking: false
    risk: Low. Static configuration is simpler and covered by NFR-006.

  - id: A-008
    statement: >
      Node.js 18.8.0 and NestJS are compatible with the selected MongoDB,
      RabbitMQ, and S3 client libraries.
    category: technology_stack
    blocking: false
    risk: Low. Well-established ecosystem.

blocking_assumptions: []

non_blocking_assumptions:
  - A-001
  - A-002
  - A-003
  - A-004
  - A-005
  - A-006
  - A-007
  - A-008

produced_outputs:
  - .ai/reports/assumptions.yaml
