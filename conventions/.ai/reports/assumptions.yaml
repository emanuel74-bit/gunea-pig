report_id: "assumptions"
phase_id: behavior_contract
status: complete
summary: >
  Assumptions recorded for the large_refactor mission behavior contract phase.
  Six assumptions are identified — none are blocking. Safe defaults are declared
  for each. These assumptions underpin the scope, acceptance criteria, and
  preserved-behavior decisions in report 02-behavior-contract.yaml. Downstream
  phases (codebase_reconnaissance, risk_classification, architecture_decomposition)
  must validate or invalidate each assumption and escalate via trigger if an
  assumption is found to be false and has a material impact on scope.

inputs_consumed:
  - source: conventions/.ai/reports/01-active-context-manifest.yaml
    artifact: active_context_manifest
    fields_used:
      - active_phase_plan
      - allowed_agents
  - source: conventions/.ai/bundles/phases/mission/behavior_contract.bundle.yaml
    artifact: phase_context_bundle
    fields_used:
      - phase_contract
      - allowed_write_scope

decisions:
  - id: DECISION-ASSUMP-001
    decision: >
      Treat all six assumptions as non-blocking. Assign safe defaults that allow
      downstream phases to proceed without clarification from the user.
    rationale: >
      The refactor mission is well-scoped. The SOLID principles provide objective
      criteria. The external contracts (queue, DB, S3) are identifiable from the
      codebase structure without user confirmation. No assumption, if wrong, would
      invalidate the entire mission — each has a bounded impact that a downstream
      phase can address through a targeted trigger.
    evidence:
      - source: activation_prompt
        field: codebase_summary
        value: "TypeScript/NestJS monorepo with these packages: shared, staging-service, grouping-service, vdf-scan-service, pipeline-service"

  - id: DECISION-ASSUMP-002
    decision: >
      Flag ASSUMP-003 (test suite coverage) as the highest-risk non-blocking assumption.
      If no test suite exists, the test_derivation phase must produce characterization
      tests before implementation begins.
    rationale: >
      A SOLID refactor that preserves behavior without a test suite has no automated
      safety net. The risk_if_wrong is highest for this assumption. However, the
      mission profile includes test_derivation and characterization-test-plan phases
      that can compensate if tests are absent.
    evidence:
      - source: conventions/.ai/reports/01-active-context-manifest.yaml
        field: required_reports
        value: "characterization-test-plan at .ai/reports/characterization-test-plan.yaml"

evidence_refs:
  - ref: conventions/.ai/reports/01-active-context-manifest.yaml
    section: required_reports
    consumed_by: characterization_test_plan_risk_assessment
  - ref: conventions/.ai/bundles/phases/mission/behavior_contract.bundle.yaml
    section: phase_contract.must_do
    consumed_by: assumption_recording_discipline
  - ref: user_request
    section: verbatim_text
    consumed_by: scope_assumption_derivation

assumptions:
  - id: ASSUMP-001
    statement: >
      pipeline-service is the intended consolidation target. The individual standalone
      services (staging-service, grouping-service, vdf-scan-service) are candidates for
      deprecation after consolidation, not the pipeline-service submodules.
    blocking: false
    safe_default: >
      Treat pipeline-service as the consolidation target. Flag standalone services as
      deprecation candidates in the architecture_decomposition phase. Do not deprecate
      or delete any package during the behavior_contract phase.
    risk_if_wrong: >
      If the intent is the inverse — keep standalone services and delete pipeline-service —
      the consolidation acceptance criterion (AC-008) would need to be rewritten.
      Impact is bounded to architecture_decomposition and structure_rendering phases.
    validated_by_phase: architecture_decomposition
    escalation_trigger: phase_revision_required

  - id: ASSUMP-002
    statement: >
      No external consumers (outside this monorepo) depend on internal class names,
      function names, module names, or file paths. Only the queue message schemas,
      DB schemas, and S3 key patterns are externally observable.
    blocking: false
    safe_default: >
      Freely rename internal classes, functions, modules, and files. Protect only
      the external contracts declared in the preserved_behaviors list of the behavior
      contract report.
    risk_if_wrong: >
      If an external system imports a specific TypeScript class or function by name
      (e.g., through a shared package published to npm), renaming it would be a breaking
      change. Impact would require an ISP/DIP boundary to be drawn at the published package
      surface and a deprecation export alias to be added.
    validated_by_phase: codebase_reconnaissance
    escalation_trigger: phase_revision_required

  - id: ASSUMP-003
    statement: >
      An existing test suite is present and captures the observable behavior of each
      service at its consumer boundary. Test pass/fail count before the refactor provides
      a valid behavioral baseline.
    blocking: false
    safe_default: >
      Proceed assuming some test coverage exists. If codebase_reconnaissance finds zero
      tests or inadequate coverage, the test_derivation phase must produce characterization
      tests before implementation begins. The characterization-test-plan report already
      exists as a required output in the mission profile.
    risk_if_wrong: >
      If no tests exist, acceptance criterion AC-005 cannot be evaluated at implementation
      time. The refactor would proceed without automated behavioral regression detection.
      This is the highest-risk assumption. Mitigation: characterization test plan is a
      required deliverable of test_derivation (sequence 22).
    validated_by_phase: codebase_reconnaissance
    escalation_trigger: phase_revision_required

  - id: ASSUMP-004
    statement: >
      RabbitMQ message schemas (topic names and payload field definitions) are the primary
      external integration contract between services and between this system and any
      downstream consumers. No REST or gRPC API constitutes a second external contract
      of equal or higher priority.
    blocking: false
    safe_default: >
      Treat queue contracts as the primary immutable boundary. If a REST or gRPC surface
      is discovered during codebase_reconnaissance, add it to the preserved_behaviors
      list via a trigger.
    risk_if_wrong: >
      If a REST API or gRPC surface exists and is consumed by external clients, changes
      to route paths, response shapes, or error codes would be breaking changes that the
      current behavior contract does not protect. Impact would require an additional
      preserved_behaviors entry and corresponding acceptance criterion.
    validated_by_phase: codebase_reconnaissance
    escalation_trigger: phase_revision_required

  - id: ASSUMP-005
    statement: >
      The exports of packages/shared define the internal package contract between the
      service packages. Changes to shared exports (type names, function signatures,
      schema references) constitute an internal breaking change that must be coordinated
      across all consuming packages within the same refactor transaction.
    blocking: false
    safe_default: >
      Treat shared package exports as a soft internal contract. Refactor them in concert
      with all consuming services. No shared export change may be applied in isolation —
      all consumers must be updated in the same implementation sequence.
    risk_if_wrong: >
      If shared exports are changed without updating all consumers, TypeScript compilation
      will fail across the monorepo. Impact is compile-time only (no runtime data loss),
      but would block the implementation phase if not addressed atomically.
    validated_by_phase: dependency_classification
    escalation_trigger: phase_revision_required

  - id: ASSUMP-006
    statement: >
      No active database migrations are in progress at the time the refactor begins.
      The Drizzle ORM schema files represent the current production schema, not a
      transitional state.
    blocking: false
    safe_default: >
      Read Drizzle schema files as-is and treat them as the stable baseline. If
      codebase_reconnaissance discovers pending migration files or schema drift,
      escalate via trigger before the architecture_decomposition phase proceeds.
    risk_if_wrong: >
      If a migration is in-flight, the Drizzle schema files may not match the
      production database, causing the refactor to build on a schema snapshot that
      is already being superseded. Impact could produce invalid repository implementations.
    validated_by_phase: codebase_reconnaissance
    escalation_trigger: phase_revision_required

blocking_assumptions: []

non_blocking_assumptions:
  - ASSUMP-001
  - ASSUMP-002
  - ASSUMP-003
  - ASSUMP-004
  - ASSUMP-005
  - ASSUMP-006

triggers_emitted: []

gate_result:
  gate_id: gate.behavior_contract.output
  status: pending
  note: Gate result is produced by the gate subsystem via run_gate_check route — not authored here.
