key_implementation_decisions:

  - decision_id: IMPL-001
    description: "VdfCliAdapter uses child_process.spawn (not exec) for streaming stdout"
    rationale: Avoids buffering large VDF output in memory; process handles per-batch scan
    evidence_ref: .ai/reports/call-site-impact.yaml#CS-VBS-006

  - decision_id: IMPL-002
    description: "ResultPublicationService enforces S3-before-RabbitMQ via sequential await"
    rationale: If S3 throw propagates, publisher.publish is never reached — invariant enforced by code flow
    evidence_ref: .ai/reports/checkpoint-validation-plan.yaml#CG-004
    test_obligation: TO-006

  - decision_id: IMPL-003
    description: "ScanStateRepository uses findOneAndUpdate with state-as-CAS guard on all transitions"
    rationale: Prevents race conditions when multiple VBS instances try to claim/transition the same video
    evidence_ref: .ai/reports/02-behavior-contract.yaml#VBS-F-002

  - decision_id: IMPL-004
    description: "ScanResultIngestionService idempotency guard uses SimilarityEdge existence (not ScanState)"
    rationale: Edge upsert is idempotent; checking edges avoids relying on scan state cross-service
    test_obligation: TO-004

  - decision_id: IMPL-005
    description: "VdfOutputNormalizerAdapter accepts both pairs/results and video1/file1 field names"
    rationale: VDF CLI output format is an external assumption (ARCH-ASMP-004) — defensive parsing
    evidence_ref: .ai/reports/architecture-blueprint.yaml#ARCH-ASMP-004
    test_obligation: TO-014

  - decision_id: IMPL-006
    description: "amqp-connection-manager channel setup runs during onModuleInit"
    rationale: Defers AMQP channel binding until NestJS lifecycle is ready; connection retries handled by amqp-connection-manager
    note: NOT using @nestjs/microservices transport per local alignment

  - decision_id: IMPL-007
    description: "uuid package added to VBS for scan_id and batch_claim_id generation"
    rationale: Deterministic unique IDs required for idempotency keys; not in original dep list but necessary

