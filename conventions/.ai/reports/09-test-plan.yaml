report_id: "09-test-plan"
phase_id: test_derivation
status: complete
summary: >
  Complete test obligation table for the PortsAndAdapters SOLID refactor of pipeline-service.
  Zero existing tests confirmed (ASSUMP-003 = FALSE). Risk level: HIGH.
  Primary obligations: characterization (blocks pre_implementation_gate AND implementation_sequence),
  unit (blocks pre_implementation_gate), integration (blocks pre_implementation_gate),
  contract (consumers + publishers + adapters — covers PB-001, PB-002, PB-003).
  6 obligations derived from RISK-HIGH-TESTS, REFACTOR-CHARACTERIZATION-TESTS,
  ACTION-SPLIT-EXTRACT-TESTS, and role-to-test-obligation-matrix across 51 artifacts in
  37 modified files + 13 new files.

inputs_consumed:
  - source: conventions/.ai/reports/02-behavior-contract.yaml
    artifact: behavior_contract
    fields_used: [preserved_behaviors, acceptance_criteria, forbidden_behavior_changes]
  - source: conventions/.ai/reports/assumptions.yaml
    artifact: assumptions
    fields_used: [ASSUMP-003]
  - source: conventions/.ai/reports/07-change-impact.yaml
    artifact: change_impact
    fields_used: [total_impact, dependency_direction_inversions, test_impact, sequence_implications]
  - source: conventions/.ai/reports/consumer-impact.yaml
    artifact: consumer_impact
    fields_used: [consumers, external_consumer_impact, shared_package_impact]

zero_tests_confirmation:
  assumption_id: ASSUMP-003
  statement: "An existing test suite is present and captures observable behavior"
  validated_value: false
  source: conventions/.ai/reports/03-codebase-reconnaissance.yaml
  effect: >
    AC-005 cannot be evaluated at implementation time without a baseline.
    All test obligations below are new tests to be written.
    characterization-test-plan.yaml is a required deliverable that lifts BLOCK-RS-001.

risk_signal:
  risk_level: high
  triggers: [RISK-HIGH-TESTS, REFACTOR-CHARACTERIZATION-TESTS, ACTION-SPLIT-EXTRACT-TESTS]
  source: conventions/.ai/reports/risk-classification.yaml

test_obligations:
  - obligation_id: OBL-001
    test_type: characterization
    scope: workflow
    status: required
    priority: critical
    reason: >
      REFACTOR-CHARACTERIZATION-TESTS — zero existing tests, behavior preservation required
      for split x2 (ScanOrchestrator, ProcessScanHandler) + extract x1 (ScanSchedulerTrigger)
      + modify x25 before any implementation begins. Satisfies BLOCK-RS-001.
    blocking: true
    blocks_before: [pre_implementation_gate, implementation_sequence]
    acceptance_criteria_refs: [AC-005, AC-006, AC-007, AC-008]
    preserved_behaviors_covered: [PB-001, PB-002, PB-003, PB-004, PB-005]
    covered_artifacts:
      - VideoReadyConsumer
      - ScanCompletedConsumer
      - RabbitMQPublisher (publish to scan.events exchange)
      - VideoDocument (collection: videos)
      - ScanBatchDocument (collection: scan_batches)
      - SimilarityEdgeDocument (collection: similarity_edges)
      - SimilarityGroupDocument (collection: similarity_groups)
      - FileStagingAdapter (S3 key pattern)
      - ScanOrchestrator (pipeline ordering)
      - ProcessScanHandler (pipeline ordering)
      - StageVideoHandler (error boundary)
      - ScanCompletedConsumer (error boundary)
    evidence_refs:
      - ref: conventions/.ai/reports/assumptions.yaml
        section: "assumptions[ASSUMP-003]"
        detail: "validated_value = false: zero tests confirmed"
      - ref: conventions/.ai/reports/07-change-impact.yaml
        section: "sequence_implications[SEQ-006]"
        detail: "characterization_first gate blocks all split_existing, extract_from_existing, modify_existing"
      - ref: conventions/.ai/reports/06-refactor-strategy.yaml
        section: "blocking_items[BLOCK-RS-001]"
        detail: "BLOCK-RS-001 is active; lifted only by characterization-test-plan"

  - obligation_id: OBL-002
    test_type: unit
    scope: role
    status: required
    priority: blocking
    reason: >
      RISK-HIGH-TESTS — risk level HIGH triggers mandatory unit test coverage for
      all pure-logic roles before pre_implementation_gate.
    blocking: true
    blocks_before: [pre_implementation_gate]
    acceptance_criteria_refs: [AC-005]
    covered_roles:
      - role: policy
        count: 4
        artifacts: [SimilarityThresholdPolicy, RetentionPolicy (x2 scanning), ThresholdConfigPolicy]
        test_focus: "pure domain logic — no infrastructure mocks needed"
      - role: validator
        count: 2
        artifacts: [StagingMessageValidator, ScanResultValidator]
        test_focus: "input validation logic — all valid/invalid input permutations"
      - role: domain_service
        count: 1
        artifacts: [UnionFindDomainService]
        test_focus: "connected-component algorithm correctness"
      - role: normalizer
        count: 1
        artifacts: [VdfManifestNormalizer]
        test_focus: "VDF output parsing and normalization (post-signature-change to rawContent)"
      - role: handler
        count: 2
        artifacts: [StageVideoHandler, ProcessScanHandler]
        test_focus: "application logic with port mocks — error path coverage (PB-005)"
      - role: service
        count: 2
        artifacts: [BatchClaimerService, ScanPurgerService]
        test_focus: "service logic with repository port mocks"
    evidence_refs:
      - ref: conventions/.ai/reports/risk-classification.yaml
        section: risk_level
        detail: "risk_level = high"

  - obligation_id: OBL-003
    test_type: integration
    scope: boundary
    status: required
    priority: blocking
    reason: >
      RISK-HIGH-TESTS + all 13 DIP boundaries introduced — integration tests required for
      all repository implementations (PB-002), all DI module wiring (SharedInfraModule,
      StagingModule, ScanningModule, GroupingModule), consumer wiring, and orchestrator flow (PB-004).
    blocking: true
    blocks_before: [pre_implementation_gate]
    acceptance_criteria_refs: [AC-005, AC-006]
    covered_roles:
      - role: repository
        count: 6
        artifacts:
          - VideoRepository (collection: videos)
          - ScanBatchRepository (consolidated, collection: scan_batches)
          - VideoScanRepository (collection: videos — scan state fields)
          - SimilarityEdgeRepository (collection: similarity_edges)
          - SimilarityGroupRepository (collection: similarity_groups)
          - VideoSimilarityRepository (collection: videos — similarity fields)
        test_focus: "MongoDB integration — collection names, @Prop field names, CRUD semantics (PB-002)"
        preserved_behaviors: [PB-002]
      - role: consumer
        count: 2
        artifacts: [VideoReadyConsumer, ScanCompletedConsumer]
        test_focus: "ack/nack wiring, error propagation, handler delegation (PB-001, PB-004)"
        preserved_behaviors: [PB-001, PB-004]
      - role: orchestrator
        count: 1
        artifacts: [ScanOrchestrator]
        test_focus: "full scan pipeline: batch claim -> VDF run -> S3 upload -> ScanCompleted publish (PB-004)"
        preserved_behaviors: [PB-004]
      - role: module
        count: 5
        artifacts: [SharedInfraModule, StagingModule, ScanningModule, GroupingModule, AppModule]
        test_focus: "NestJS DI wiring — all port-to-adapter bindings resolve at bootstrap"
      - role: adapter
        count: 3
        artifacts: [FileStagingAdapter, VdfRunnerAdapter, S3StorageAdapter]
        test_focus: "integration with injected port — correct delegation, S3 key patterns (PB-003)"
        preserved_behaviors: [PB-003]
      - role: scheduler
        count: 1
        artifacts: [ScanSchedulerTrigger]
        test_focus: "schedule interval fires and delegates to ScanOrchestrator"
    evidence_refs:
      - ref: conventions/.ai/reports/07-change-impact.yaml
        section: dependency_direction_inversions
        detail: "13 DIP inversions across FileStagingAdapter, StageVideoHandler, ScanOrchestrator (x5), ScanPurgerService (x2), ProcessScanHandler (x3)"
      - ref: conventions/.ai/reports/07-change-impact.yaml
        section: test_impact[di_wiring_validation]
        detail: "NestJS module integration test required after SharedInfraModule changes"

  - obligation_id: OBL-004
    test_type: contract
    scope: contract
    status: required
    priority: blocking
    reason: >
      PB-001 RabbitMQ schemas LOCKED — contract tests required for all message consumers
      and publishers. VideoReadyConsumer @EventPattern = 'video.ready-for-scan' (confirmed).
      ScanCompletedConsumer @EventPattern = 'scan.completed' (confirmed).
      RabbitMQPublisher publishes to exchange 'scan.events' with routing keys
      'scan.completed' and 'scan.persisted' (confirmed from source).
    blocking: true
    blocks_before: [pre_implementation_gate]
    preserved_behaviors: [PB-001]
    covered_artifacts:
      - VideoReadyConsumer
      - ScanCompletedConsumer
      - RabbitMQPublisher
    source_evidence:
      - file: packages/pipeline-service/src/staging/transport/video-ready.consumer.ts
        line: 19
        value: "@EventPattern('video.ready-for-scan')"
      - file: packages/pipeline-service/src/grouping/transport/scan-completed.consumer.ts
        line: 16
        value: "@EventPattern('scan.completed')"
      - file: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
        lines: [148, 149]
        value: "exchange: QUEUE_EXCHANGES.SCAN_EVENTS ('scan.events'), routingKey: ROUTING_KEYS.SCAN_COMPLETED ('scan.completed')"
      - file: packages/pipeline-service/src/grouping/application/process-scan.handler.ts
        lines: [73, 74]
        value: "exchange: QUEUE_EXCHANGES.SCAN_EVENTS ('scan.events'), routingKey: ROUTING_KEYS.SCAN_PERSISTED ('scan.persisted')"
      - file: packages/shared/src/types/queue.types.ts
        lines: [7, 18, 38]
        value: "NewVideoReadyEvent fields: {eventId, schemaVersion, videoId, s3ObjectKey, s3Bucket, timestamp, correlationId}; ScanCompletedEvent fields: {eventId, schemaVersion, scanId, resultS3Key, resultS3Bucket, videoIds, scannerVersion, scannerProfile, timestamp, correlationId}; ScanPersistedEvent fields: {eventId, schemaVersion, scanId, timestamp, correlationId}"
    evidence_refs:
      - ref: conventions/.ai/reports/02-behavior-contract.yaml
        section: preserved_behaviors[PB-001]

  - obligation_id: OBL-005
    test_type: contract
    scope: contract
    status: required
    priority: blocking
    reason: >
      PB-002 Mongoose collection names LOCKED — integration/contract tests required for
      all 4 Mongoose schemas. All collection names confirmed from source:
      videos, scan_batches, similarity_edges, similarity_groups.
    blocking: true
    blocks_before: [pre_implementation_gate]
    preserved_behaviors: [PB-002]
    covered_artifacts:
      - VideoDocument
      - ScanBatchDocument
      - SimilarityEdgeDocument
      - SimilarityGroupDocument
    source_evidence:
      - file: packages/shared/src/db/video.schema.ts
        line: 11
        value: "@Schema({ collection: 'videos', timestamps: true })"
      - file: packages/shared/src/db/scan-batch.schema.ts
        line: 12
        value: "@Schema({ collection: 'scan_batches', timestamps: true })"
      - file: packages/shared/src/db/similarity-edge.schema.ts
        line: 10
        value: "@Schema({ collection: 'similarity_edges', timestamps: true })"
      - file: packages/shared/src/db/similarity-group.schema.ts
        line: 12
        value: "@Schema({ collection: 'similarity_groups', timestamps: true })"
    evidence_refs:
      - ref: conventions/.ai/reports/02-behavior-contract.yaml
        section: preserved_behaviors[PB-002]

  - obligation_id: OBL-006
    test_type: contract
    scope: contract
    status: required
    priority: blocking
    reason: >
      PB-003 S3 key patterns LOCKED — contract tests required for S3StorageAdapter and
      FileStagingAdapter. S3 key pattern confirmed from source: scan results use key
      template 'scans/${scanId}/result.json' (scan.orchestrator.ts line 109). S3 object
      retrieval uses caller-supplied resultS3Key (no local key construction in ScanResultClient).
      File staging uses caller-supplied s3ObjectKey (no key construction in FileStagingAdapter).
    blocking: true
    blocks_before: [pre_implementation_gate]
    preserved_behaviors: [PB-003]
    covered_artifacts:
      - S3StorageAdapter
      - FileStagingAdapter
      - ScanOrchestrator (key construction site)
      - ScanResultClient (key consumer)
    source_evidence:
      - file: packages/pipeline-service/src/scanning/application/scan.orchestrator.ts
        line: 109
        value: "const resultS3Key = `scans/${scanId}/result.json`"
        note: "This is the ONLY S3 key construction point for scan results — must be preserved after DIP refactor"
      - file: packages/pipeline-service/src/staging/infrastructure/file-staging.adapter.ts
        lines: [31, 32]
        value: "stageFromS3(videoId, bucket, key) — key passed through from caller; file staged to path.join(scanPath, `${videoId}${ext}`)"
        note: "S3 key is NOT constructed in FileStagingAdapter — it is passed through from the NewVideoReadyEvent payload (s3ObjectKey field)"
      - file: packages/pipeline-service/src/grouping/infrastructure/scan-result.client.ts
        lines: [11, 13]
        value: "load(resultS3Bucket, resultS3Key) — key passed through from ScanCompletedEvent payload"
    evidence_refs:
      - ref: conventions/.ai/reports/02-behavior-contract.yaml
        section: preserved_behaviors[PB-003]

