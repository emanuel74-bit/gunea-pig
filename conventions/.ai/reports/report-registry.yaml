report_id: report-registry
phase_id: mission_initialization
status: complete
summary: >
  Initialized the mission report registry for profile "large_refactor". All required
  reports for this mission profile are registered. Only the mission-profile report has
  been produced so far. All remaining required reports are listed as missing and remain
  at lifecycle_state expected. Gate result is pending gate subsystem evaluation.

inputs_consumed:
  - source: .ai/reports/00-mission-profile.yaml
    artifact: mission_profile_report
  - source: reports/conventions.report-registry.yaml
    artifact: report_artifact_registry

decisions:
  - id: DECISION-001
    decision: Register all required reports for the large_refactor profile
    rationale: >
      The mission profile selected is large_refactor. The active_phase_plan_seed from
      the mission-profile report defines 20 required_reports. The report artifact registry
      in conventions/reports/conventions.report-registry.yaml maps each required report
      ID to its path, phase_id, and lifecycle_state. All 20 required reports are
      registered in expected_reports. Only .ai/reports/00-mission-profile.yaml exists
      on disk; all others are missing.
    evidence:
      - source: .ai/reports/00-mission-profile.yaml
        field: active_phase_plan_seed.required_reports
      - source: reports/conventions.report-registry.yaml
        section: sections.report_artifact_registry

  - id: DECISION-002
    decision: Mark produced_reports as containing only 00-mission-profile
    rationale: >
      The only report file written to .ai/reports/ at this point in mission execution
      is 00-mission-profile.yaml, produced by the mission_profile_selection phase.
      No other required reports exist on disk.
    evidence:
      - no_evidence_marker: filesystem state at mission_initialization phase entry

evidence_refs:
  - ref: .ai/reports/00-mission-profile.yaml
    section: active_phase_plan_seed.required_reports
    consumed_by: registry_population
  - ref: reports/conventions.report-registry.yaml
    section: sections.report_artifact_registry
    consumed_by: expected_reports_population
  - ref: conventions/.ai/bundles/phases/mission/mission_initialization.bundle.yaml
    section: selected_records.phase_contract
    consumed_by: phase_scope_validation

triggers_emitted: []

gate_result:
  gate_id: gate.mission_initialization.output
  status: pending
  note: Gate result is produced by the gate subsystem via run_gate_check route — not authored here.

