version: '1.0'
file:
  name: conventions.phase-bundle-policy.yaml
  path: multi-agent/conventions.phase-bundle-policy.yaml
  role: phase_bundle_generation_contract
  executability: generator_contract
purpose: Define the minimal, deterministic phase execution bundle that every phase agent must consume before doing work.
ownership:
  owns:
  - phase_bundle_schema
  - bundle_content_rules
  - runtime_pack_policy
  - bundle_generation_algorithm
  - bundle_validation_rules
  - phase_bundle_executor_integration
  - phase_bundle_context_minimization_rules
  - phase_bundle_consumption_gate
  - phase_bundle_agent_consumption_boundary
  - topology_to_bundle_usage_model
  - hardened_phase_bundle_validation_rules
  does_not_own:
  - phase_contracts
  - agent_prompts
  - agent_permissions
  - report_templates
  - mission_state
  - subsystem_source_files
activation:
  mode: conditional
  activates_when:
  - phase_agent_invocation_requested
  skips_when: []
inputs:
  required:
  - mission_state
  - phase_contract
  - owner_agent
  - agent_contract
  - agent_prompt
  - agent_permissions
  - report_registry
  optional: []
outputs:
  produces:
  - phase_input_bundle
  - runtime_pack_manifest
  - phase_bundle_manifest
  - phase_bundle_validation_requirement
  - validated_phase_context_bundle
dependencies:
  required_files:
  - phases/conventions.phase-contracts.yaml
  - agents/conventions.agent-contracts.yaml
  - agents/conventions.agent-prompts.yaml
  - agents/conventions.agent-permissions.yaml
  - reports/conventions.report-registry.yaml
  - reports/conventions.report-templates.yaml
  - missions/conventions.mission-state.yaml
  - executors/conventions.executor-routes.yaml
  - executors/conventions.executor-contract.yaml
  optional_files: []
sections:
  phase_bundle_schema:
    required_fields:
    - mission_id
    - phase_id
    - owner_agent
    - phase_contract_ref
    - agent_contract_ref
    - agent_prompt_ref
    - permission_profile_ref
    - required_input_reports
    - optional_input_reports
    - required_output_reports
    - report_template_refs
    - allowed_convention_files
    - runtime_pack
    - must_do
    - must_not_do
    - allowed_write_scope
    - forbidden_write_scope
    - entry_gate_ref
    - output_gate_ref
    - handoff_requirements
    - trigger_emission_rules
    - revision_request_rules
    - completion_contract
    optional_fields:
    - risk_context
    - active_triggers
    - relevant_adapters
    - previous_failures
    - rerun_context
  bundle_content_rules:
  - id: BUNDLE-CONTENT-001
    rule: Bundle must include only conventions referenced by the active phase contract, owner agent contract, required output
      schemas, and active risk/trigger/revision context.
    fail_condition: phase_bundle_contains_unrelated_full_system_context
  - id: BUNDLE-CONTENT-002
    rule: Bundle must include required report templates for every required output report.
    fail_condition: phase_bundle_missing_report_template
  - id: BUNDLE-CONTENT-003
    rule: Bundle must include explicit write scopes and forbidden write scopes.
    fail_condition: phase_bundle_missing_write_scope
  - id: BUNDLE-CONTENT-004
    rule: Bundle must mark invalidated or pending-revalidation inputs as forbidden to consume.
    fail_condition: phase_bundle_allows_invalidated_input
  runtime_pack_policy:
    include:
    - active_phase_contract
    - owner_agent_prompt
    - owner_agent_permissions
    - required_input_report_refs
    - required_output_templates
    - relevant_subsystem_rules
    - gate_refs
    - handoff_requirements
    - trigger_emission_constraints
    - revision_constraints
    exclude:
    - unrelated_subsystem_files
    - completed_prior_reports_not_declared_as_inputs
    - obsolete_outputs
    - full_convention_package_when_not_required
    fail_when:
    - runtime_pack_missing_required_rule
    - runtime_pack_contains_conflicting_authority
    - runtime_pack_uses_invalidated_input
  bundle_generation_algorithm:
  - step_id: LOAD_PHASE_CONTRACT
    action: read
    input: phase_contract_registry[phase_id]
    fail_when:
    - phase_contract_missing
  - step_id: RESOLVE_AGENT_CONTEXT
    action: read
    input:
    - agent_contract
    - agent_prompt
    - agent_permissions
    fail_when:
    - agent_contract_missing
    - agent_prompt_missing
    - permission_profile_missing
  - step_id: COLLECT_REPORT_CONTEXT
    action: read
    input:
    - required_input_reports
    - required_output_templates
    fail_when:
    - required_input_missing
    - template_missing
  - step_id: COLLECT_RELEVANT_RULES
    action: lookup
    input: allowed_convention_files
    fail_when:
    - allowed_convention_file_missing
  - step_id: APPLY_CONTEXT_MINIMIZATION
    action: filter
    output: runtime_pack
    fail_when:
    - unrelated_full_system_context_included
  - step_id: WRITE_PHASE_BUNDLE
    action: write
    output: .ai/bundles/phases/{mission_id}/{phase_id}.bundle.yaml
    fail_when:
    - phase_bundle_write_failed
  - step_id: VALIDATE_PHASE_BUNDLE
    action: execute_route
    input: validate_phase_bundle
    fail_when:
    - phase_bundle_validation_failed
  completion_contract:
    agent_must_write_all_required_outputs: true
    chat_response_is_summary_only: true
    missing_required_output_status: phase_failure
    agent_must_return_written_file_paths: true
  executor_route_integration:
    local_requirement_field: required_executor_routes
    before_phase_start:
    - generate_phase_bundle
    - validate_phase_bundle
    declared_order_required: true
    direct_script_reference_forbidden: true
    unknown_route_behavior: fail_closed
    agent_consumption_rule: phase_agent_must_not_start_work_until_generate_phase_bundle_and_validate_phase_bundle_succeed
  phase_bundle_identity:
    artifact_id: phase_context_bundle
    canonical_path: .ai/bundles/phases/{mission_id}/{phase_id}.bundle.yaml
    manifest_path: .ai/bundles/phases/{mission_id}/{phase_id}.manifest.yaml
    producer_route: generate_phase_bundle
    validator_route: validate_phase_bundle
    scope: single_phase_agent_invocation
    lifecycle: generated_before_phase_start_consumed_during_phase_archived_after_handoff
    write_mode: replace_for_same_mission_phase_rerun
  context_minimization_policy:
    include_only:
    - active_phase_contract
    - owner_agent_contract_prompt_and_permissions
    - declared_required_input_artifacts
    - declared_required_output_templates
    - required_executor_routes_for_active_phase
    - referenced_gate_handoff_trigger_revision_rules
    - directly_relevant_convention_files
    exclude_always:
    - unrelated_subsystem_files
    - full_convention_package
    - completed_prior_outputs_not_declared_as_inputs
    - obsolete_or_invalidated_artifacts
    - alternative_agent_prompts_not_assigned_to_phase
    fail_when:
    - bundle_contains_unrelated_full_system_context
    - bundle_missing_required_executor_route
    - bundle_allows_invalidated_input
    - bundle_missing_required_output_template
  required_executor_routes:
    before_phase_start:
    - generate_phase_bundle
    - validate_phase_bundle
  agent_consumption_boundary:
    rule: Phase agents consume validated phase bundles, not full convention packages or full topology outputs.
    must:
    - agent_reads_phase_context_bundle_before_work
    - agent_uses_required_executor_routes_declared_in_bundle
    - agent_treats_topology_outputs_as_script_facing_compiled_metadata
    - agent_requests_missing_context_through_route_or_bundle_regeneration_not_manual_system_scan
    must_not:
    - agent_scans_full_convention_system_to_discover_applicable_rules
    - agent_loads_full_authority_topology_for_normal_phase_execution
    - agent_loads_full_runtime_artifact_topology_for_normal_phase_execution
    - agent_selects_scripts_directly
    fail_conditions:
    - phase_agent_started_without_valid_bundle
    - phase_agent_consumed_full_topology_instead_of_bundle
    - phase_agent_discovered_scripts_without_executor_route
  topology_to_bundle_usage_model:
    topologies_are: script_facing_compiled_truth
    phase_bundles_are: agent_facing_execution_context
    flow:
    - convention_yaml_declarations
    - topology_compilation_routes_when_system_metadata_changes
    - phase_bundle_generation_route_before_phase_start
    - phase_bundle_validation_route_before_agent_consumption
    - agent_executes_using_validated_bundle
    bundle_generator_may_consume:
    - authority_topology
    - runtime_artifact_topology
    - reference_topology
    - phase_contract_registry
    - agent_phase_ownership_records
    - executor_route_map
    agent_bundle_must_contain_only:
    - selected_phase_contract_record
    - selected_phase_ownership_record
    - required_executor_route_ids
    - minimal_route_contract_slices
    - required_inputs_outputs
    - allowed_and_forbidden_write_scopes
    - gate_handoff_trigger_revision_refs
    - directly_relevant_convention_refs
  hardened_bundle_validation_rules:
  - id: PHASE-BUNDLE-HARDEN-001
    rule: Bundle must include selected phase contract and phase ownership records only, not whole source registries.
    fail_condition: bundle_contains_full_source_registry
  - id: PHASE-BUNDLE-HARDEN-002
    rule: Bundle must include route IDs and minimal route contract slices for required executor routes.
    fail_condition: bundle_missing_route_contract_slice
  - id: PHASE-BUNDLE-HARDEN-003
    rule: Bundle must explicitly forbid agents from scanning full conventions or loading full topologies during normal phase
      work.
    fail_condition: bundle_missing_agent_consumption_boundary
  - id: PHASE-BUNDLE-HARDEN-004
    rule: Required outputs must be inside allowed write scope.
    fail_condition: bundle_output_outside_write_scope
  - id: PHASE-BUNDLE-HARDEN-005
    rule: Phase bundle manifest must be generated beside the bundle.
    fail_condition: bundle_manifest_missing
validation:
  required_checks:
  - id: BUNDLE-CHECK-001
    check: phase_bundle_schema_valid
    applies_when:
      phase_agent_invocation_requested: true
  - id: BUNDLE-CHECK-002
    check: phase_bundle_generated_through_executor_route
    applies_when:
      phase_agent_invocation_requested: true
  - id: BUNDLE-CHECK-003
    check: phase_bundle_validated_before_agent_consumption
    applies_when:
      phase_agent_invocation_requested: true
  fail_conditions:
  - id: BUNDLE-001
    condition: phase_bundle_contains_unrelated_full_system_context
    message: Phase bundle must be minimized to the active phase needs.
    severity: error
  - id: BUNDLE-002
    condition: phase_bundle_bypassed_executor_route
    message: Phase bundle generation must use declared executor routes, not direct script selection.
    severity: error
  - id: BUNDLE-003
    condition: agent_consumed_unvalidated_phase_bundle
    message: Phase agent cannot consume a phase bundle before validate_phase_bundle succeeds.
    severity: error
