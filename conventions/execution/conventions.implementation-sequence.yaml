version: '1.0'
file:
  name: conventions.implementation-sequence.yaml
  path: execution/conventions.implementation-sequence.yaml
  role: implementation_sequence_planning_contract
  executability: decision_engine
purpose: Convert validated plans, actions, roles, structure, tests, risk, and impact data into a deterministic ordered implementation
  sequence.
ownership:
  owns:
  - implementation_sequence_inputs
  - implementation_step_schema
  - implementation_ordering_rules
  - action_ordering_rules
  - risk_aware_ordering
  - sequence_generation_algorithm
  - implementation_sequence_output_schema
  does_not_own:
  - artifact_action_selection
  - test_obligation_selection
  - gate_validation
  - feedback_repair_logic
  - code_modification
activation:
  mode: conditional
  activates_when:
  - implementation_sequence_phase_active
  skips_when: []
inputs:
  required:
  - behavior-contract
  - artifact-actions
  - final-role-assignment
  - structure-plan
  - test-plan
  - change-impact
  - risk-classification
  optional:
  - compatibility-decision
  - dependency-validation
  - boundary-contract-classification
  - behavior-preservation-requirements
  - technology-adapter-manifest
outputs:
  produces:
  - 10-implementation-sequence
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - actions/conventions.action-resolution.yaml
  - actions/conventions.action-followups.yaml
  - architecture/conventions.structure.yaml
  - testing/conventions.test-derivation.yaml
  - risk/conventions.risk-escalation.yaml
  - reports/conventions.report-registry.yaml
  optional_files:
  - contracts/conventions.compatibility.yaml
  - boundaries/conventions.boundary-validation.yaml
  - dependencies/conventions.dependency-validation.yaml
  - refactoring/conventions.behavior-preservation.yaml
sections:
  implementation_step_schema:
    required_fields:
    - step_id
    - title
    - step_type
    - target_artifacts
    - depends_on
    - allowed_edit_scope
    - required_inputs
    - produces
    - validation_after_step
    - risk_level
    - rollback_or_reversal_note
    optional_fields:
    - expected_temporary_failures
    - adapter_constraints
    - notes
  step_type_enum:
    allowed:
    - prepare_contracts
    - create_or_update_types
    - create_or_update_domain
    - create_or_update_policy
    - create_or_update_mapper
    - create_or_update_repository
    - create_or_update_adapter
    - create_or_update_application_logic
    - create_or_update_transport
    - update_wiring_exports
    - update_tests
    - remove_or_deprecate_artifact
    - run_validation
    - finalize_reports
  ordering_rules:
  - id: SEQ-ORDER-001
    applies_when:
    - contract_or_public_type_changed
    must_order_before:
    - consumer_updates
    - implementation_logic
    - tests_using_contract
    fail_condition: contract_changed_after_consumers_updated
  - id: SEQ-ORDER-002
    applies_when:
    - domain_or_policy_needed
    must_order_before:
    - application_logic
    - transport_entrypoint
    - integration_adapter
    fail_condition: application_created_before_domain_foundation
  - id: SEQ-ORDER-003
    applies_when:
    - mapper_or_boundary_adapter_needed
    must_order_before:
    - cross_boundary_calling_code
    fail_condition: boundary_crossing_implemented_without_adapter_or_mapper
  - id: SEQ-ORDER-004
    applies_when:
    - persistence_shape_changed
    must_order_before:
    - repository_behavior
    - application_reads_or_writes
    fail_condition: repository_updated_before_persistence_shape_plan
  - id: SEQ-ORDER-005
    applies_when:
    - artifact_action_is_delete_or_deprecate
    must_order_after:
    - call_site_impact_analysis
    - consumer_update_steps
    - replacement_or_migration_steps
    fail_condition: artifact_removed_before_consumers_updated
  - id: SEQ-ORDER-006
    applies_when:
    - tests_required
    must_order:
    - test_updates_after_behavior_contract_and_before_final_validation
    fail_condition: tests_not_scheduled_in_sequence
  action_ordering_rules:
    create_new:
    - define_contract_or_type
    - implement_core_logic
    - wire_dependencies
    - add_tests
    modify_existing:
    - lock_current_behavior_if_needed
    - apply_smallest_safe_change
    - update affected tests
    - validate consumers
    split:
    - create_new_targets
    - move behavior incrementally
    - update imports/call_sites
    - validate old and new behavior
    - remove obsolete residue
    extract:
    - create_extracted_artifact
    - replace duplicated logic with calls
    - validate call sites
    - remove duplicate logic
    move:
    - create destination path
    - update imports
    - validate dependency direction
    - remove old path after consumers updated
    rename:
    - rename artifact
    - update imports and exports
    - validate public compatibility if exported
    delete:
    - prove unused or replaced
    - update consumers
    - remove artifact
    - validate no references remain
    deprecate:
    - add replacement path
    - mark old path deprecated
    - preserve compatibility
    - schedule migration followup
  risk_aware_ordering:
  - risk_level: critical
    required_behavior:
    - checkpoint_after_every_mutating_step
    - no_combined_high_risk_steps
    - predefine_rollback_or_blocking_resolution
  - risk_level: high
    required_behavior:
    - checkpoint_after_each_artifact_group
    - run_relevant_validation_after_group
  - risk_level: medium
    required_behavior:
    - checkpoint_after_related_step_group
  - risk_level: low
    required_behavior:
    - checkpoint_before_final_validation
  sequence_generation_algorithm:
  - step_id: LOAD_VALIDATED_INPUTS
    action: read
    inputs:
    - artifact-actions
    - final-role-assignment
    - structure-plan
    - test-plan
    - risk-classification
    - change-impact
    fail_when:
    - required_input_missing
    - required_input_invalidated
  - step_id: GROUP_ACTIONS_BY_DEPENDENCY
    action: derive
    decision_rules:
    - ordering_rules
    - action_ordering_rules
    output:
    - ordered_action_groups
  - step_id: APPLY_RISK_ORDERING
    action: tighten
    decision_rules:
    - risk_aware_ordering
    output:
    - checkpoint_required_steps
  - step_id: INSERT_VALIDATION_STEPS
    action: append
    inputs:
    - test-plan
    - checkpoint policy
    output:
    - validation_after_step
  - step_id: ASSERT_SCOPE
    action: validate
    fail_when:
    - step_targets_forbidden_scope
    - step_missing_allowed_edit_scope
  - step_id: WRITE_SEQUENCE_REPORT
    action: write
    output: 10-implementation-sequence
  implementation_sequence_output_schema:
    required_fields:
    - report_id
    - phase_id
    - ordered_steps
    - step_dependencies
    - affected_files
    - validation_after_steps
    - expected_temporary_failures
    - risk_controls
    - blocked_items
validation:
  required_checks:
  - id: SEQ-CHECK-001
    check: all_steps_have_dependencies_and_scope
    applies_when:
      implementation_sequence_created: true
  fail_conditions:
  - condition: implementation_sequence_missing
    message: Implementation sequence is required before implementation.
    severity: error
    owner: execution/conventions.implementation-sequence.yaml
  - condition: step_targets_forbidden_scope
    message: Implementation step targets forbidden scope.
    severity: error
    owner: execution/conventions.implementation-sequence.yaml
  - condition: high_risk_step_without_checkpoint
    message: High-risk implementation step requires checkpoint validation.
    severity: error
    owner: execution/conventions.implementation-sequence.yaml
  - condition: delete_or_move_without_call_site_update_step
    message: Move/delete actions require call-site update and validation steps.
    severity: error
    owner: execution/conventions.implementation-sequence.yaml
