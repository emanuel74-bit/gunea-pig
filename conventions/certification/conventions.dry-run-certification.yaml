version: '1.0'
file:
  name: conventions.dry-run-certification.yaml
  path: certification/conventions.dry-run-certification.yaml
  role: dry_run_certification_contract
  executability: policy
purpose: Define adapter-neutral dry-run mission certification scenarios and evidence
  requirements for end-to-end runtime validation without mutating production source
  behavior.
ownership:
  owns:
  - dry_run_certification_contract
  - certification_scenario_model
  - certification_evidence_requirements
  does_not_own:
  - runtime_route_implementation
  - production_source_mutation
  - language_or_framework_specific_quality_rules
activation:
  mode: on_demand
  activates_when:
  - milestone_certification_required
  - end_to_end_dry_run_validation_required
  skips_when:
  - local_unit_validation_only
sections:
  certification_model:
    rollout_mode: observe
    mutation_allowed: false
    scenario_execution: route_backed_simulation_or_artifact_presence_validation
    full_completion_requirement: all_required_scenarios_have_evidence_and_no_blocking_validation_failures
  scenario_fixture_model:
    fixture_purpose: deterministic_non_mutating_scenario_input
    fixture_registration: explicit_path_in_scenario_fixtures
    fixture_validation: route_validates_fixture_shape_and_scenario_alignment
    fixture_execution_mode: artifact_presence_validation
    fixture_scope: one_scenario_per_fixture
    fixture_must_not_mutate_production_source: true
    fixture_evidence_materialization: explicit_route_argument_only
    fixture_evidence_outputs_are_limited_to_ai_runtime_artifacts: true
  scenario_fixtures:
  - fixture_id: small_feature_minimal_validation_only
    scenario_id: small_feature
    fixture_path: certification/fixtures/small-feature.validation-only.fixture.yaml
    execution_mode: artifact_presence_validation
    mutation_allowed: false
    language_neutral: true
    framework_neutral: true
  - fixture_id: bugfix_minimal_validation_only
    scenario_id: bugfix
    fixture_path: certification/fixtures/bugfix.validation-only.fixture.yaml
    execution_mode: artifact_presence_validation
    mutation_allowed: false
    language_neutral: true
    framework_neutral: true
  - fixture_id: refactor_minimal_source_quality_only
    scenario_id: refactor
    fixture_path: certification/fixtures/refactor.validation-only.fixture.yaml
    execution_mode: artifact_presence_validation
    mutation_allowed: false
    language_neutral: true
    framework_neutral: true
  - fixture_id: gate_block_minimal_validation_only
    scenario_id: gate_block
    fixture_path: certification/fixtures/gate-block.validation-only.fixture.yaml
    execution_mode: artifact_presence_validation
    mutation_allowed: false
    language_neutral: true
    framework_neutral: true
  - fixture_id: revision_loop_minimal_validation_only
    scenario_id: revision_loop
    fixture_path: certification/fixtures/revision-loop.validation-only.fixture.yaml
    execution_mode: artifact_presence_validation
    mutation_allowed: false
    language_neutral: true
    framework_neutral: true
  - fixture_id: resume_after_shutdown_minimal_recovery_only
    scenario_id: resume_after_shutdown
    fixture_path: certification/fixtures/resume-after-shutdown.validation-only.fixture.yaml
    execution_mode: artifact_presence_validation
    mutation_allowed: false
    language_neutral: true
    framework_neutral: true
  - fixture_id: illegal_transition_rejection_minimal_controller_block_only
    scenario_id: illegal_transition_rejection
    fixture_path: certification/fixtures/illegal-transition-rejection.validation-only.fixture.yaml
    execution_mode: artifact_presence_validation
    mutation_allowed: false
    language_neutral: true
    framework_neutral: true
  - fixture_id: final_report_minimal_evidence_backed_only
    scenario_id: final_report
    fixture_path: certification/fixtures/final-report.validation-only.fixture.yaml
    execution_mode: artifact_presence_validation
    mutation_allowed: false
    language_neutral: true
    framework_neutral: true
  required_scenarios:
  - scenario_id: small_feature
    required_evidence:
    - mission_state
    - phase_bundle
    - validation_result
    - evidence_manifest
  - scenario_id: bugfix
    required_evidence:
    - mission_state
    - validation_result
    - evidence_manifest
  - scenario_id: refactor
    required_evidence:
    - source_artifact_manifest
    - architecture_quality_analysis
    - safe_structure_analysis
  - scenario_id: gate_block
    required_evidence:
    - gate_result
    - validation_result
  - scenario_id: revision_loop
    required_evidence:
    - revision_task
    - revision_loop_analysis
  - scenario_id: resume_after_shutdown
    required_evidence:
    - mission_state
    - mission_checkpoint
    - mission_journal
  - scenario_id: final_report
    required_evidence:
    - evidence_manifest
    - final_mission_report
  - scenario_id: illegal_transition_rejection
    required_evidence:
    - transition_legality_result
    - mission_controller_block
  certification_boundaries:
    language_neutral: true
    framework_neutral: true
    adapter_outputs_are_optional_evidence: true
    scenario_policy_must_not_reference_project_specific_test_failures: true
  aggregate_certification_model:
    purpose: prove_all_declared_required_scenarios_certify_together_from_clean_runtime_artifacts
    activation_argument: --require-all-declared-scenarios
    required_runtime_state: clean_ai_runtime_artifacts_before_evidence_materialization
    required_scenario_selection: every_declared_required_scenario
    required_result: all_declared_scenarios_certified
    enforcement_mode: controlled_enforce_after_required_evidence_routes_run
  validation:
    required_checks:
    - scenario_ids_unique
    - required_scenarios_present
    - certification_artifacts_written
    - blocking_failures_reported
    - aggregate_all_declared_scenarios_certified_when_required
    - phase20_completion_marker_requires_aggregate_certification_when_requested
    fail_conditions:
    - unknown_requested_scenario
    - missing_required_scenario_evidence
    - malformed_certification_artifact
    - aggregate_required_scenario_missing_or_incomplete
    - completion_marker_requested_without_complete_aggregate_certification

  phase20_operator_completion_sequence:
    purpose: document_exact_clean_aggregate_completion_sequence_for_claude_code_or_operator_use
    route_invocation_boundary: use_executor_route_id_run_dry_run_certification_not_direct_script_authoring
    required_starting_state: remove_existing_ai_runtime_artifacts_before_certification_run
    sequence_is_documentation_only: true
    completion_marker_command_requires:
    - all_declared_scenarios_selected
    - all_required_evidence_routes_completed
    - final_report_generated_from_typed_claims
    - aggregate_certification_controlled_enforce
    commands:
    - step_id: CLEAN_AI_RUNTIME_ARTIFACTS
      command: rm -rf .ai
      purpose: ensure certification starts from a clean runtime artifact state
    - step_id: MATERIALIZE_DRY_RUN_FIXTURE_EVIDENCE
      command: npm --prefix conventions/scripts run executor -- --route run_dry_run_certification --materialize-fixture-evidence true
      purpose: create only non-mutating dry-run runtime artifacts for declared fixtures
    - step_id: COLLECT_SOURCE_ARTIFACTS
      command: npm --prefix conventions/scripts run executor -- --route collect_source_artifacts
      purpose: produce source artifact manifest evidence for refactor certification
    - step_id: COMPILE_ADAPTER_TOPOLOGY
      command: npm --prefix conventions/scripts run executor -- --route compile_adapter_topology
      purpose: produce adapter topology evidence consumed by architecture quality analysis
    - step_id: ANALYZE_SAFE_STRUCTURE_CHANGE
      command: npm --prefix conventions/scripts run executor -- --route analyze_safe_structure_change --change-kind deletion --candidate-file conventions/scripts/validate-executor-routes.ts --behavior-evidence verified --consumer-update-plan updated --route-migration-evidence replacement-route --ownership-transfer-evidence ownership-transferred
      purpose: produce safe structure evidence required by the refactor scenario
    - step_id: ANALYZE_ARCHITECTURE_QUALITY
      command: npm --prefix conventions/scripts run executor -- --route analyze_architecture_quality --enforcement-mode observe
      purpose: produce adapter-neutral architecture quality evidence required by the refactor scenario
    - step_id: COLLECT_INITIAL_EVIDENCE_MANIFEST
      command: npm --prefix conventions/scripts run executor -- --route collect_evidence
      purpose: collect evidence required before final report generation
    - step_id: GENERATE_FINAL_MISSION_REPORT
      command: npm --prefix conventions/scripts run executor -- --route generate_final_mission_report
      purpose: produce script-owned final mission report evidence
    - step_id: REFRESH_EVIDENCE_MANIFEST_AFTER_REPORT
      command: npm --prefix conventions/scripts run executor -- --route collect_evidence
      purpose: include final mission report in evidence manifest
    - step_id: CERTIFY_ALL_DECLARED_SCENARIOS_AND_WRITE_COMPLETION_MARKER
      command: npm --prefix conventions/scripts run executor -- --route run_dry_run_certification --require-all-declared-scenarios true --write-completion-marker true --enforcement-mode controlled_enforce
      purpose: certify every declared scenario and write the Phase 20 completion marker
    expected_completion_artifacts:
    - .ai/certification/dry-run-certification.yaml
    - .ai/certification/phase20-dry-run-completion.yaml
    - .ai/reports/dry-run-certification-report.yaml
    - .ai/reports/evidence-manifest.yaml
    - .ai/reports/final-mission-report.yaml
  phase20_completion_checkpoint_model:
    purpose: record_phase20_completion_only_after_all_declared_dry_run_scenarios_are_fixture_backed_evidence_backed_and_aggregate_certified
    activation_argument: --write-completion-marker
    required_companion_arguments:
    - --require-all-declared-scenarios true
    - --enforcement-mode controlled_enforce
    produced_artifact: .ai/certification/phase20-dry-run-completion.yaml
    artifact_identity: phase20_dry_run_certification_completion
    completion_requirements:
    - all_declared_scenarios_selected
    - all_declared_scenarios_fixture_backed
    - all_declared_scenarios_certified
    - no_blocking_validation_failures
    does_not_replace:
    - evidence_manifest
    - final_mission_report
    - dry_run_certification_result
    mutation_allowed: false
