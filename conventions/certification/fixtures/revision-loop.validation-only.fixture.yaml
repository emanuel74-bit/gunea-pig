version: '1.0'
file:
  name: revision-loop.validation-only.fixture.yaml
  path: certification/fixtures/revision-loop.validation-only.fixture.yaml
  role: dry_run_scenario_fixture
  executability: fixture
purpose: Provide a concrete adapter-neutral dry-run certification fixture for the
  revision_loop scenario using non-mutating artifact presence validation only.
ownership:
  owns:
  - revision_loop_dry_run_fixture
  - revision_control_certification_input
  does_not_own:
  - production_source_mutation
  - real_revision_task_production
  - scenario_enforcement_decision
  - language_or_framework_specific_test_rules
sections:
  fixture_identity:
    fixture_id: revision_loop_minimal_validation_only
    scenario_id: revision_loop
    mission_profile: revision_loop
    execution_mode: artifact_presence_validation
  fixture_boundaries:
    mutation_allowed: false
    source_mutation_allowed: false
    language_neutral: true
    framework_neutral: true
    adapter_outputs_required: false
    real_revision_task_provenance_claimed: false
  expected_certification_behavior:
    rollout_mode: observe
    enforcement_mode: observe
    incomplete_evidence_is_warning: true
    blocking_decision_expected: false
    repeated_fingerprint_observed: true
    retry_budget_enforced: false
  required_evidence:
  - evidence_type: revision_task
    accepted_paths:
    - .ai/revisions/*.revision-task.yaml
  - evidence_type: revision_loop_analysis
    accepted_paths:
    - .ai/revisions/revision-loop-analysis.yaml

  fixture_evidence_artifacts:
    materialization_mode: explicit_route_argument_only
    materialization_argument: --materialize-fixture-evidence
    generated_by: run-dry-run-certification
    mutation_allowed: false
    artifacts:
    - evidence_type: revision_task
      path: .ai/revisions/dry-run-revision-loop.revision-task.yaml
      artifact: dry_run_revision_loop_fixture_revision_task
    - evidence_type: revision_loop_analysis
      path: .ai/revisions/revision-loop-analysis.yaml
      artifact: dry_run_revision_loop_fixture_analysis
  validation_contract:
    route_id: run_dry_run_certification
    required_result_artifact: .ai/certification/dry-run-certification.yaml
    required_report_artifact: .ai/reports/dry-run-certification-report.yaml
    fixture_status_when_shape_valid: fixture_valid
