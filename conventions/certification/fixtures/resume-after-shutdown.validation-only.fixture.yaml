version: '1.0'
file:
  name: resume-after-shutdown.validation-only.fixture.yaml
  path: certification/fixtures/resume-after-shutdown.validation-only.fixture.yaml
  role: dry_run_scenario_fixture
  executability: fixture
purpose: Provide a concrete adapter-neutral dry-run certification fixture for the
  resume_after_shutdown scenario using non-mutating recovery artifact presence
  validation only.
ownership:
  owns:
  - resume_after_shutdown_dry_run_fixture
  - recovery_certification_input
  does_not_own:
  - production_source_mutation
  - real_resume_execution_decision
  - scenario_enforcement_decision
  - language_or_framework_specific_test_rules
sections:
  fixture_identity:
    fixture_id: resume_after_shutdown_minimal_recovery_only
    scenario_id: resume_after_shutdown
    mission_profile: resume_after_shutdown
    execution_mode: artifact_presence_validation
  fixture_boundaries:
    mutation_allowed: false
    source_mutation_allowed: false
    language_neutral: true
    framework_neutral: true
    adapter_outputs_required: false
    real_resume_provenance_claimed: false
  expected_certification_behavior:
    rollout_mode: observe
    enforcement_mode: observe
    incomplete_evidence_is_warning: true
    blocking_decision_expected: false
    recovery_artifact_shape_expected: checkpoint_and_append_only_journal
  required_evidence:
  - evidence_type: mission_state
    accepted_paths:
    - .ai/missions/**/mission-state.yaml
  - evidence_type: mission_checkpoint
    accepted_paths:
    - .ai/missions/**/mission-checkpoint.yaml
  - evidence_type: mission_journal
    accepted_paths:
    - .ai/missions/**/mission-journal.ndjson

  fixture_evidence_artifacts:
    materialization_mode: explicit_route_argument_only
    materialization_argument: --materialize-fixture-evidence
    generated_by: run-dry-run-certification
    mutation_allowed: false
    artifacts:
    - evidence_type: mission_state
      path: .ai/missions/dry-run-resume_after_shutdown/mission-state.yaml
      artifact: mission_state
    - evidence_type: mission_checkpoint
      path: .ai/missions/dry-run-resume_after_shutdown/mission-checkpoint.yaml
      artifact: mission_checkpoint
    - evidence_type: mission_journal
      path: .ai/missions/dry-run-resume_after_shutdown/mission-journal.ndjson
      artifact: mission_journal
  validation_contract:
    route_id: run_dry_run_certification
    required_result_artifact: .ai/certification/dry-run-certification.yaml
    required_report_artifact: .ai/reports/dry-run-certification-report.yaml
    fixture_status_when_shape_valid: fixture_valid
