version: '1.0'
file:
  name: conventions.revision-loop-control.yaml
  path: revisions/conventions.revision-loop-control.yaml
  role: revision_loop_control_contract
  executability: warn_then_enforce_policy
purpose: Define controlled revision loop enforcement, failure fingerprinting, retry-budget visibility, and no-progress blocking for selected safe repeated-failure cases.
ownership:
  owns:
  - revision_failure_fingerprint_model
  - revision_loop_enforcement_policy
  - revision_retry_budget_control
  - revision_loop_analysis_schema
  does_not_own:
  - revision_task_authority
  - transition_legality_enforcement
  - score_threshold_enforcement
  - source_artifact_collection
activation:
  mode: conditional
  activates_when:
  - revision_task_created
  - validation_failure_repeats
  - revision_rerun_requested
  skips_when: []
inputs:
  required:
  - revision_task
  - failure_result
  optional:
  - mission_id
  - explicit_failure_fingerprint
outputs:
  produces:
  - revision_loop_analysis
  - revision_loop_analysis_report
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - revisions/conventions.revision-validation.yaml
  - executors/conventions.executor-routes.yaml
  - validation/conventions.validation-result-contract.yaml
  optional_files:
  - missions/conventions.mission-journal.yaml
sections:
  revision_failure_fingerprint_model:
    fingerprint_basis:
    - failure_result.script_id
    - failure_result.status
    - failure_result.errors.code
    - failure_result.warnings.code
    - validation_result.validation_id
    - validation_result.blocking
    stability_rule: Same logical failure evidence must produce the same fingerprint across retry attempts.
    privacy_rule: Fingerprints must summarize failure shape, not store large source content.
  revision_loop_enforcement_policy:
    rollout_modes:
    - observe
    - warn
    - enforce
    default_runtime_mode: enforce
    enforcement: retry_budget
    absolute_rules:
    - id: REVISION-LOOP-ENF-001
      rule: analyze_revision_loop must block selected safe cases where the same active failure fingerprint reaches or exceeds the configured retry budget in enforce mode.
      fail_condition: revision_retry_budget_exceeded_without_blocking
      severity: error
    - id: REVISION-LOOP-ENF-002
      rule: analyze_revision_loop must keep missing fingerprint discovery as a non-blocking warning so first-pass revision setup is not blocked.
      fail_condition: missing_fingerprint_blocked_revision_setup
      severity: error
    - id: REVISION-LOOP-ENF-003
      rule: Revision tasks may include failure_fingerprint and retry_control metadata, but create_revision_task remains the only authoritative revision task producer.
      fail_condition: revision_loop_metadata_authored_by_agent
      severity: error
  retry_budget_control:
    default_observe_retry_budget: 3
    repeated_fingerprint_warning: REVISION_FAILURE_FINGERPRINT_REPEATED
    retry_budget_warning: REVISION_RETRY_BUDGET_OBSERVED
    retry_budget_blocking_error: REVISION_RETRY_BUDGET_EXCEEDED
    no_progress_signal: no_progress_suspected
    enforcement_transition: selected_safe_cases_enforced
  revision_loop_analysis_schema:
    required_fields:
    - artifact
    - generated_by
    - rollout_mode
    - enforcement
    - active_failure_fingerprint
    - observe_retry_budget
    - active_fingerprint_count
    - repeated_fingerprints
    - no_progress_suspected
    - blocking_decision
    - revision_task_count
    - revision_tasks
  required_executor_routes:
    on_validation_failure:
    - analyze_revision_loop
validation:
  required_checks:
  - id: CONVENTIONS-REVISION-LOOP-YAML-CHECK-001
    check: required_sections_present
    applies_when:
      revision_loop_control_contract: true
  fail_conditions:
  - id: REVISION-LOOP-CONTROL-001
    condition: revision_retry_budget_exceeded_without_blocking
    message: Enforce-mode revision loop control must block repeated active failure fingerprints that reach the retry budget.
    severity: error
  - id: REVISION-LOOP-CONTROL-002
    condition: missing_fingerprint_blocked_revision_setup
    message: Missing failure fingerprints remain warnings so first-pass revision setup can continue.
    severity: error
