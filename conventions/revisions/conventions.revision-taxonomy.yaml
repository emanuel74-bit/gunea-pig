    - revision_id
    - requested_by_phase
    - target_phase
    - reason
    - required_action
    - invalidated_outputs
  revision_reason_definitions:
    required_input_missing:
      definition: required input missing revision_reason vocabulary value.
      meaning: Represents the required input missing case within the revision_reason taxonomy.
      detection_signals:
      - required input missing signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches required input missing
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - revision_reason decisions using required_input_missing must include reason and evidence
