version: '1.0'
file:
  name: conventions.revision-taxonomy.yaml
  path: revisions/conventions.revision-taxonomy.yaml
  role: revision_vocabulary_contract
  executability: vocabulary
purpose: Define revision reasons, actions, statuses, and request schema.
ownership:
  owns:
  - revision_reason_enum
  - revision_action_enum
  - revision_status_enum
  - revision_request_schema
  does_not_own:
  - rerun_policy
  - mission_state_storage
activation:
  mode: reference_only
  activates_when:
  - revision_values_are_referenced
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - revision_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
