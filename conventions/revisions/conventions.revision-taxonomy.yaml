    allowed:
    - required_input_missing
    - required_input_incomplete
    - required_input_contradicted
    - required_output_schema_invalid
    - phase_scope_violation_detected
    - dependency_edge_violation_detected
    - trigger_requires_prior_phase_update
    - implementation_revealed_design_gap
    - validation_revealed_behavior_gap
    - report_artifact_invalid
  revision_action_enum:
    allowed:
    - rerun_target_phase
    - amend_target_report
    - invalidate_target_output
    - replace_target_output
    - rerun_from_target_phase_forward
    - block_mission
  revision_status_enum:
