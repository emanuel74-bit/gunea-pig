      allowed_code_edit_scope:
      - affected_scope
      - related_tests_scope
      skip_policy:
        allowed_skips: *id001
        skip_requires:
        - skip_reason
        - evidence
        - downstream_risk_review
      escalation_triggers:
      - high_risk_detected
      - phase_revision_required
      - implementation_failure_detected
      phase_overrides: {}
      definition: small feature mission_profile vocabulary value.
      meaning: Represents the small feature case within the mission_profile taxonomy.
      detection_signals:
      - small feature signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches small feature
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - mission_profile decisions using small_feature must include reason and evidence
