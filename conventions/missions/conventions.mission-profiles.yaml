  profile_override_policy:
    absolute_rules:
    - id: MISSION-PROFILE-OVERRIDE-ABS-001
      rule: Mission profile overrides may tighten phase requirements but must not weaken phase contracts.
      fail_condition: mission_profile_override_weakens_phase_contract
    - id: MISSION-PROFILE-OVERRIDE-ABS-002
      rule: Profiles may select, require, forbid, or conditionally activate global phases but must not create new phases.
      fail_condition: mission_profile_declares_unknown_phase
  profile_required_report_policy:
    absolute_rules:
    - id: MISSION-PROFILE-REPORT-ABS-001
      rule: Every profile required report must exist in the report registry.
      fail_condition: mission_profile_references_unknown_report
validation:
  required_checks:
