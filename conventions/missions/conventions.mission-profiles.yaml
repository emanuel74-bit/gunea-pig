    - light
    - standard
    - strict
    - strict_on_regression
    - strict_on_no_behavior_change
    - strict_on_compatibility
    - strict_on_boundary_and_failure_modes
    - strict_on_data_safety
    - strict_on_convention_integrity
  mission_profile_selection_rules:
    match_decision_rules:
    - id: MISSION-SELECT-USER-EXPLICIT
      priority: 1
      match:
        user_selected_profile_present: true
      decision:
        selected_profile: user_selected_profile
    - id: MISSION-SELECT-DEFAULT
      priority: 99
      match:
        request_type: unknown
      decision:
        selected_profile: medium_feature
