version: '1.0'
file:
  name: conventions.mission-profiles.yaml
  path: missions/conventions.mission-profiles.yaml
  role: mission_profile_selection_and_configuration_contract
  executability: decision_engine
purpose: Define mission profile vocabulary and configuration over existing global phases.
ownership:
  owns:
  - mission_profile_enum
  - mission_profile_schema
  - mission_profile_selection_rules
  - mission_profiles
  does_not_own:
  - phase_vocabulary
  - phase_contract_definitions
activation:
  mode: conditional
  activates_when:
  - mission_profile_selection_required
  skips_when: []
inputs:
  required:
  - mission_request
  - phase_taxonomy
  optional: []
outputs:
  produces:
  - mission_profile
  - mission_phase_plan
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - phases/conventions.phase-taxonomy.yaml
  - reports/conventions.report-artifacts.yaml
  optional_files: []
sections:
  mission_profile_enum:
    allowed:
    - small_feature
    - medium_feature
    - bugfix
    - large_refactor
    - cleanup_only
    - api_contract_change
    - integration_change
    - persistence_change
    - test_only
    - convention_system_edit
  gate_strictness_enum:
    allowed:
    - light
    - standard
    - strict
    - strict_on_regression
    - strict_on_no_behavior_change
    - strict_on_compatibility
    - strict_on_boundary_and_failure_modes
    - strict_on_data_safety
    - strict_on_convention_integrity
  mission_profile_selection_rules:
    match_decision_rules:
    - id: MISSION-SELECT-USER-EXPLICIT
      priority: 1
      match:
        user_selected_profile_present: true
      decision:
        selected_profile: user_selected_profile
    - id: MISSION-SELECT-DEFAULT
      priority: 99
      match:
        request_type: unknown
      decision:
        selected_profile: medium_feature
  mission_profiles:
    small_feature:
      mission_profile_id: small_feature
      purpose: Small Feature mission profile.
      required_phases:
      - mission_profile_selection
      - mission_initialization
      - active_context_manifest
      - behavior_contract
      - codebase_reconnaissance
      - risk_classification
      - architecture_decomposition
      - draft_role_pass
      - pattern_pressure_detection
      - artifact_reuse_analysis
      - artifact_action_resolution
      - final_role_assignment
      - pattern_selection
      - structure_rendering
      - test_derivation
      - implementation_sequence
      - checkpoint_validation_plan
      - pre_implementation_gate
      - implementation
      - post_implementation_validation
      - report_artifact_validation
      - final_validation
      conditional_phases: &id001
      - local_alignment
      - boundary_contract_classification
      - dependency_classification
      - refactor_strategy_selection
      - call_site_impact_analysis
      - change_impact_analysis
      - failure_classification
      - feedback_repair
      - trigger_review
      - phase_accounting
      forbidden_phases: []
      required_reports:
      - active-context-manifest
      - architecture-blueprint
      - artifact-actions
      - artifact-candidates
      - artifact-reuse-analysis
      - assumptions
      - behavior-contract
      - changed-file-manifest
      - characterization-test-plan
      - checkpoint-groups
      - checkpoint-results
      - checkpoint-validation-plan
      - codebase-reconnaissance
      - draft-role-signals
