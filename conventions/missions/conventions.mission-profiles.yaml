version: '1.0'
file:
  name: conventions.mission-profiles.yaml
  path: missions/conventions.mission-profiles.yaml
  role: mission_profile_registry
  executability: registry
purpose: Define canonical mission profiles that configure global phases, reports, strictness, edit scope, skips, and escalation
  triggers without redefining phase contracts.
ownership:
  owns:
  - mission_profile_registry
  - mission_profile_records
  - profile_required_reports
  - profile_edit_scopes
  - profile_phase_overrides
  does_not_own:
  - mission_profile_selection
  - phase_taxonomy
  - phase_contracts
  - report_artifact_schema
  - agent_permissions
  - gate_logic
activation:
  mode: reference_only
  activates_when:
  - mission_profiles_loaded
  skips_when: []
inputs:
  required:
  - mission_profile_taxonomy
  - phase_taxonomy
  - report_registry
  optional: []
outputs:
  produces:
  - mission_profile_registry
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - missions/conventions.mission-profile-taxonomy.yaml
  - phases/conventions.phase-taxonomy.yaml
  - reports/conventions.report-registry.yaml
  optional_files:
  - gates/conventions.gate-taxonomy.yaml
  - triggers/conventions.trigger-taxonomy.yaml
