    check: every_profile_references_known_phases
    applies_when:
      mission_profiles_loaded: true
  fail_conditions:
  - id: MISSION-PROFILES-001
    condition: profile_references_unknown_phase
    message: Mission profile references a phase not defined in the phase taxonomy.
    severity: error
