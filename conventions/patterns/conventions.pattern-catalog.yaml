version: '1.0'
file:
  name: conventions.pattern-catalog.yaml
  path: patterns/conventions.pattern-catalog.yaml
  role: pattern_catalog_contract
  executability: vocabulary
purpose: Define active design pattern vocabulary, pattern categories, semantic activation
  criteria, required evidence, and rejection conditions.
ownership:
  owns:
  - pattern_enum
  - pattern_categories
  - pattern_status_enum
  - pattern_definition_schema
  - pattern_definitions
  does_not_own:
  - pattern_selection_process
  - role_pattern_compatibility_decisions
  - structure_rendering
  - selection process
  - compatibility decisions
  - structure rendering
  - disallowed_patterns
  - deferred_patterns
  - restricted_patterns
  - conditional_patterns
  - anti_overengineering_rules
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - pattern_catalog_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  pattern_enum:
    allowed:
    - NoPattern
    - Strategy
    - FactoryMethod
    - AbstractFactory
    - Builder
    - Adapter
    - Facade
    - Proxy
    - Decorator
    - Command
    - ChainOfResponsibility
    - Observer
    - Mediator
    - TemplateMethod
    - State
    - Specification
    - Policy
    - Repository
    - UnitOfWork
    - CQRS
    - Outbox
    - Saga
    - Pipeline
    - DomainEvent
    - AntiCorruptionLayer
    - Result
    - ContractVersioning
    - ServiceLocator
    - Singleton
    - Prototype
    - Bridge
    - Composite
    - Flyweight
    - Iterator
    - Memento
    - Visitor
    - DependencyInjection
    - PortsAndAdapters
    - DataMapper
    - Projection
    - ReadModel
    - EventSourcing
    - Inbox
    - IdempotencyKey
    - RetryWithBackoff
    - CircuitBreaker
  pattern_status_enum:
    allowed:
    - active
    - conditional
    - restricted
    - deferred
    - disallowed
  pattern_category_enum:
    allowed:
    - anti_pattern
    - classic_gof.behavioral
    - classic_gof.creational
    - classic_gof.structural
    - enterprise.architectural
    - enterprise.contract
    - enterprise.domain
    - enterprise.error_handling
    - enterprise.integration
    - enterprise.persistence
    - enterprise.read_model
    - enterprise.resilience
    - enterprise.structural
    - enterprise.workflow
    - none
  pattern_categories:
    classic_gof.creational:
      definition: Focused on object creation mechanisms that increase flexibility
        and reuse.
      triggers:
      - object creation is complex
      - object type decided at runtime
      - avoid direct constructor usage
      - control instance lifecycle
      - reduce coupling to concrete classes
    classic_gof.structural:
      definition: Focused on composing classes and objects into larger structures.
      triggers:
      - combine multiple components
      - wrap or adapt existing code
      - simplify complex subsystem
      - optimize memory usage
      - control access to object
    classic_gof.behavioral:
      definition: Focused on communication and responsibility between objects.
      triggers:
      - multiple objects interact
      - behavior changes at runtime
      - decouple sender and receiver
      - define workflows or chains
      - encapsulate algorithms
    enterprise.domain:
      definition: Domain-level patterns that isolate business rules, facts, or predicates
        without leaking infrastructure concerns.
      triggers:
      - business decision logic repeats
      - domain fact needs decoupled reactions
      - predicate composition required
    enterprise.persistence:
      definition: Persistence patterns that isolate storage, transaction, or historical
        state concerns from application/domain logic.
      triggers:
      - storage API leaks into application code
      - transaction boundary spans multiple writes
      - event history is source of truth
    enterprise.integration:
      definition: Integration patterns that protect system boundaries, external communication,
        message reliability, and idempotency.
      triggers:
      - external model mismatch
      - async message reliability required
      - duplicate message/request risk exists
    enterprise.workflow:
      definition: Workflow patterns that make multi-step processing, orchestration,
        or compensation explicit.
      triggers:
      - ordered processing stages
      - long-running process
      - compensating steps required
    enterprise.architectural:
      definition: Architecture-scale patterns that affect module boundaries, read/write
        model separation, or dependency direction.
      triggers:
      - read/write model divergence
      - external dependencies must be inverted
      - boundary isolation required
    enterprise.read_model:
      definition: Read-side patterns for projections and query-optimized views.
      triggers:
      - derived read view
      - query shape differs from write model
      - projection updates required
    enterprise.error_handling:
      definition: Patterns for explicit recoverable outcomes and typed errors.
      triggers:
      - expected failures are part of normal flow
      - callers need typed success/failure outcome
    enterprise.contract:
      definition: Patterns for public contract compatibility and version evolution.
      triggers:
      - multiple consumer versions
      - breaking public contract risk
      - migration window required
    enterprise.structural:
      definition: Implementation-structure patterns that preserve dependency visibility
        and construction boundaries.
      triggers:
      - hidden concrete construction
      - dependency substitution required
      - framework provider wiring
    enterprise.resilience:
      definition: Resilience patterns for transient failure, dependency health, retry,
        and fallback behavior.
      triggers:
      - external dependency instability
      - transient failure retry needed
      - failure cascade risk
    none:
      definition: Explicit no-pattern decision.
      triggers:
      - no confirmed pattern pressure
    anti_pattern:
      definition: Known pattern-like structure that is forbidden by default because
        it harms boundaries or testability.
      triggers:
      - hidden dependency lookup
      - global mutable access
      - unbounded coupling
  pattern_definition_schema:
    required_fields:
    - definition
    - category
    - status
    - problem_it_solves
    - use_when
    - signals
    - avoid_when
    - reject_when
    - introduced_roles
    - compatible_roles
    - simpler_alternatives
    - required_evidence
    - validation_checks
    - fail_conditions
  pattern_definitions:
    NoPattern:
      category: none
      status: active
      definition: Explicit decision that no design pattern should be introduced because
        direct role decomposition is simpler, sufficient, and less coupled.
      problem_it_solves: Prevents accidental abstraction when pattern pressure is
        absent or speculative.
      use_when:
      - single stable implementation path exists
      - role decomposition satisfies the behavior
      - there is no meaningful variation axis
      - pattern would introduce extra files without reducing complexity
      signals:
      - single behavior path
      - no incompatible external interface
      - no family of related objects
      - no repeated workflow/handler chain
      - no runtime strategy variation
      avoid_when:
      - pattern pressure is confirmed by evidence
      - multiple variation axes exist
      - boundary adaptation is required
      - workflow orchestration is repeated enough to justify a named pattern
      introduced_roles: []
      compatible_roles: []
      simpler_alternatives: []
      positive_signals:
      - single behavior path
      - no incompatible external interface
      - no family of related objects
      - no repeated workflow/handler chain
      - no runtime strategy variation
      - single stable implementation path exists
      - role decomposition satisfies the behavior
      - there is no meaningful variation axis
      - pattern would introduce extra files without reducing complexity
      negative_signals:
      - pattern pressure is confirmed by evidence
      - multiple variation axes exist
      - boundary adaptation is required
      - workflow orchestration is repeated enough to justify a named pattern
      reject_when:
      - no activation signal is present
      - simpler alternative is enough
      - adds more complexity than it removes
      required_evidence:
      - pattern_pressure_report
      - rejected_simpler_alternative
      - role_pattern_compatibility_check
      validation_checks:
      - activation signal present
      - introduced roles compatible
      - layer/dependency rules preserved
      fail_conditions:
      - selected_without_evidence
      - selected_when_simpler_design_sufficient
      must:
      - preserve role boundaries
      - reduce complexity compared with no-pattern design
      - be justified by evidence
      forbidden:
      - using pattern by default
      - using pattern to compensate for unclear roles
      - creating extra abstraction without pressure
    Strategy:
      definition: Strategy is a behavioral design pattern used only when its concrete
        problem shape is present and simpler role decomposition is insufficient.
      category: classic_gof.behavioral
      status: active
      problem_it_solves: Behavior, workflow, or communication varies enough that responsibilities
        should be decoupled explicitly.
      use_when:
      - multiple interchangeable algorithms
      signals:
      - if/else selecting behavior
      positive_signals:
      - if/else selecting behavior
      - multiple interchangeable algorithms
      avoid_when:
      - pattern is being introduced only for style
      - a direct role-based design is simpler and sufficient
      reject_when:
      - no activation signal is present
      - variation is speculative
      - introduced abstraction would not remove duplication or coupling
      - role boundaries are unclear
      introduced_roles: &id001
      - strategy
      - selector
      - interface
      - registry
      compatible_roles: *id001
      simpler_alternatives:
      - NoPattern
      - role_decomposition
      required_evidence:
      - pattern_pressure_report
      - final_role_assignment
      - rejected_simpler_alternative
      validation_checks:
      - activation signal present
      - NoPattern considered
      - introduced roles compatible with role taxonomy
      - layer and dependency rules preserved
