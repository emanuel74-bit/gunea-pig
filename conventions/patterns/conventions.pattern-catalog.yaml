version: '1.0'
file:
  name: conventions.pattern-catalog.yaml
  path: patterns/conventions.pattern-catalog.yaml
  role: pattern_catalog_contract
  executability: vocabulary
purpose: Define pattern vocabulary including classic, enterprise, conditional, and disallowed patterns.
ownership:
  owns:
  - pattern_enum
  - pattern_definitions
  - pattern_categories
  does_not_own:
  - pattern_selection_process
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - pattern_catalog_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  pattern_enum:
    allowed:
    - NoPattern
    - Strategy
    - FactoryMethod
    - AbstractFactory
    - Builder
    - Adapter
    - Facade
    - Proxy
    - Decorator
    - Command
    - ChainOfResponsibility
    - Observer
    - Mediator
    - TemplateMethod
    - State
    - Specification
    - Policy
    - Repository
    - UnitOfWork
    - CQRS
    - Outbox
    - Saga
    - Pipeline
    - DomainEvent
    - AntiCorruptionLayer
    - Result
    - ContractVersioning
    - ServiceLocator
    - Singleton
    - Prototype
    - Bridge
    - Composite
    - Flyweight
    - Iterator
    - Memento
    - Visitor
    - DependencyInjection
    - PortsAndAdapters
    - DataMapper
    - Projection
    - ReadModel
    - EventSourcing
    - Inbox
    - IdempotencyKey
    - RetryWithBackoff
    - CircuitBreaker
  pattern_definitions:
    NoPattern:
      definition: Explicit no-pattern decision used when pattern pressure is absent or a direct role-based design is simpler
        and sufficient.
      activation_signals:
      - NoPattern pressure detected
      reject_when:
      - no pattern pressure
      - simpler direct design is sufficient
      category: none
      use_when:
      - no pattern pressure exists
      - direct composition with roles is simpler
      - pattern would add accidental complexity
      signals:
      - single stable behavior path
      - no interchangeable algorithms
      - no incompatible external interface
      - no object family creation pressure
      avoid_when:
      - pattern pressure is confirmed
      - multiple variation axes exist
      - boundary adaptation is required
      must:
      - preserve role boundaries
      - reduce complexity compared to no-pattern design
      - be justified by evidence
      forbidden:
      - using pattern by default
      - using pattern to compensate for unclear roles
      - creating extra abstraction without pressure
      required_evidence:
      - pattern pressure report
      - rejected simpler alternative
      - role-pattern compatibility check
      validation_rules:
      - must be selected through pattern_selection phase
      - must have no_pattern alternative considered
      - must not conflict with final role assignment
      meaning: Represents the NoPattern case within the pattern taxonomy.
      detection_signals:
      - NoPattern evidence is present in request, code, reports, or previous phase output
      choose_when:
      - evidence best matches NoPattern
      - no more specific value applies
