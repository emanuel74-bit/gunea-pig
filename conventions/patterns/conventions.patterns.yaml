version: '1.0'
file:
  name: conventions.patterns.yaml
  path: patterns/conventions.patterns.yaml
  role: pattern_system_entrypoint
  executability: advisory_entrypoint
purpose: Entrypoint and local execution contract for the pattern subsystem.
ownership:
  owns:
  - pattern_system_metadata
  - pattern_file_index
  - pattern_system_execution_order
  - pattern_system_contract
  does_not_own:
  - pattern_definitions
  - pattern_selection_details
  - role_taxonomy
  - final_structure
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - patterns_result
dependencies:
  required_files: []
  optional_files: []
sections:
  pattern_system_metadata:
    mode: strict
    default_decision: NoPattern
    selection_authority: pattern_selection_phase
    principles:
    - Pattern follows problem, not preference.
    - NoPattern is the default until pattern pressure is proven.
    - Pattern choice must preserve role and dependency boundaries.
    - Classic and enterprise patterns are allowed only through explicit activation signals.
  pattern_file_index:
    catalog: patterns/conventions.pattern-catalog.yaml
    selection: patterns/conventions.pattern-selection.yaml
    restrictions: patterns/conventions.pattern-restrictions.yaml
    compatibility: patterns/conventions.role-pattern-compatibility.yaml
  pattern_system_execution_order:
  - load_pattern_catalog
  - detect_pattern_pressure
  - consider_no_pattern
  - select_candidate_patterns
  - apply_pattern_restrictions
  - validate_role_pattern_compatibility
  - emit_pattern_decision_log
  pattern_system_contract:
    must_output: pattern_decision_log
    must_not:
    - select pattern before pressure detection
    - use pattern to repair unclear roles
    - introduce pattern roles not allowed by compatibility matrix
    default_behavior: select NoPattern when no explicit pattern pressure exists
validation:
  required_checks:
  - pattern_catalog_loaded
  - pattern_selection_policy_loaded
  - pattern_restrictions_loaded
  - role_pattern_compatibility_loaded
  fail_conditions:
  - pattern_selected_without_catalog
  - pattern_selected_without_pressure_detection
  - pattern_selected_without_role_compatibility
