version: '1.0'
file:
  name: conventions.pattern-restrictions.yaml
  path: patterns/conventions.pattern-restrictions.yaml
  role: pattern_restriction_contract
  executability: policy
purpose: Define disallowed, restricted, conditional, deferred, and anti-overengineering rules for pattern use.
ownership:
  owns:
  - restricted_patterns
  - conditional_patterns
  - disallowed_patterns
  - deferred_patterns
  - pattern_anti_overengineering_rules
  - pattern_restriction_rules
  does_not_own:
  - pattern_catalog
  - pattern_selection_process
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - pattern_restriction_result
dependencies:
  required_files:
  - patterns/conventions.pattern-catalog.yaml
  optional_files: []
sections:
  restricted_patterns:
    Singleton:
      reason: Hidden global dependency and testability risk.
      allowed_when:
      - framework/provider lifecycle requires a single shared instance and dependency is injected explicitly
      must_not:
      - use for convenience access
      - store mutable business state
    Bridge:
      reason: Often adds two abstraction hierarchies before variation is proven.
      allowed_when:
      - two independent variation axes already exist and class explosion is visible
    Flyweight:
      reason: Memory optimization pattern with complexity cost.
      allowed_when:
      - large number of similar objects and measured memory pressure exist
    TemplateMethod:
      reason: Inheritance-based variation can hide responsibilities.
      allowed_when:
      - framework requires template hooks or stable algorithm skeleton already exists
    Visitor:
      reason: Adds double-dispatch complexity.
      allowed_when:
      - object structure is stable and operations change frequently
    EventSourcing:
      reason: High operational and modeling complexity.
      allowed_when:
      - event history is the source of truth and replay/projection requirements are explicit
    Saga:
      reason: Distributed workflow complexity.
      allowed_when:
      - cross-service long-running transaction with compensation is required
    RetryWithBackoff:
      reason: Can hide failures or duplicate side effects.
      allowed_when:
      - operation is idempotent or safely retryable and retry policy is bounded
    CircuitBreaker:
      reason: Operational resilience complexity.
      allowed_when:
      - external dependency failure cascade risk is proven and fallback/recovery policy exists
  conditional_patterns:
    CQRS: Allowed only when read/write model divergence is real, not speculative.
    Outbox: Allowed only when durable state change and async publication consistency must be preserved.
    Inbox: Allowed only when duplicate inbound messages can produce duplicate side effects.
    AntiCorruptionLayer: Allowed only when external/legacy model would corrupt internal model or terminology.
  disallowed_patterns:
    ServiceLocator: Disallowed by default because it hides dependencies; use dependency injection or explicit ports/adapters
      instead.
  deferred_patterns:
    Result: Requires explicit project-wide error-handling convention before adoption.
    ContractVersioning: Requires compatibility decision and consumer migration plan.
  pattern_anti_overengineering_rules:
  - Prefer role decomposition before pattern introduction.
  - Prefer mapper before Adapter when only data shape changes.
  - Prefer dependency injection/provider before Singleton.
  - Prefer simple constructor before FactoryMethod/Builder.
  - Prefer direct method call before Command when no queue/log/undo/deferred execution exists.
  - Prefer no pattern when variation is speculative.
  - Restricted patterns require explicit evidence and rejection of simpler alternatives.
  pattern_restriction_rules:
  - rule_id: PATTERN-RESTRICT-001
    applies_when: selected_pattern.status == restricted
    must_have:
    - explicit_justification
    - simpler_alternatives_rejected
    - operational_or_structural_need
    fail_condition: restricted_pattern_selected_without_justification
  - rule_id: PATTERN-RESTRICT-002
    applies_when: selected_pattern.status == disallowed
    must_have:
    - allowed_exception_recorded
    fail_condition: disallowed_pattern_selected
  - rule_id: PATTERN-RESTRICT-003
    applies_when: selected_pattern.status == conditional
    must_have:
    - condition_specific_evidence
    fail_condition: conditional_pattern_selected_without_condition
validation:
  required_checks:
  - restricted_patterns_have_reasons
  - conditional_patterns_have_conditions
  - disallowed_patterns_have_replacement_guidance
  - anti_overengineering_rules_applied
  fail_conditions:
  - restricted_pattern_selected_without_justification
  - disallowed_pattern_selected
  - conditional_pattern_selected_without_condition
  - pattern_selected_when_no_pattern_sufficient
