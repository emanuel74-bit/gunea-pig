  pattern_role_disambiguation:
    Adapter_vs_DataMapper: Use DataMapper when only data shape changes; use Adapter when interface/protocol behavior differs.
    Strategy_vs_Policy: Use Strategy for interchangeable algorithms; use Policy for named business decision rule.
    Facade_vs_Service: Use service for application orchestration; use Facade only to simplify a complex subsystem boundary
      without owning business rules.
    Pipeline_vs_ChainOfResponsibility: Use Pipeline for ordered transformation stages; use ChainOfResponsibility when handlers
      may choose to handle/pass a request.
    DomainEvent_vs_Observer: Use DomainEvent for domain facts; Observer is broader publish/subscribe behavior and must not
      replace domain vocabulary.
  compatibility_validation_rules:
  - rule_id: ROLE-PATTERN-001
    rule: Every introduced role must exist in role taxonomy or be explicitly mapped to a known role.
    fail_condition: pattern_introduces_unknown_role
  - rule_id: ROLE-PATTERN-002
    rule: Pattern must not introduce roles that violate dependency direction or layer ownership.
    fail_condition: pattern_introduces_forbidden_dependency
  - rule_id: ROLE-PATTERN-003
    rule: Pattern selection must record a simpler alternative and why it was rejected.
    fail_condition: pattern_missing_simpler_alternative_review
validation:
  required_checks:
  - introduced_roles_exist
  - introduced_roles_compatible
  - simpler_alternatives_considered
  - role_pattern_rejection_matrix_applied
  fail_conditions:
  - pattern_introduces_unknown_role
  - pattern_introduces_forbidden_dependency
  - pattern_selected_without_role_compatibility
  - pattern_missing_simpler_alternative_review
