  role_pattern_rejection_matrix:
    service:
    - pattern turns service into god facade
    - service begins owning persistence details
    - service becomes strategy registry without explicit variation
    repository:
    - pattern introduces business policy into repository
    - repository becomes integration workflow coordinator
    strategy:
    - only one implementation exists
    - strategy selection is speculative
    - strategy owns persistence or transport
    factory:
    - simple constructor is enough
    - factory hides dependency lookup
    - factory performs business workflow
    adapter:
    - adapter contains domain rules
    - adapter directly controls application workflow
    orchestrator:
    - orchestrator owns core business invariants
    - orchestrator is used as facade for unrelated responsibilities
    handler:
    - handler performs unrelated validation/mapping/persistence without delegated roles
  pattern_simpler_alternative_matrix:
    NoPattern: []
    Strategy:
    - NoPattern
    - role_decomposition
    FactoryMethod:
