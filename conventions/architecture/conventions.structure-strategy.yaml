version: '1.0'
file:
  name: conventions.structure-strategy.yaml
  path: architecture/conventions.structure-strategy.yaml
  role: structure_strategy_contract
  executability: decision_engine
purpose: 'Define minimum-sufficient folder strategy: feature/module first, execution-flow second, flatten when small.'
ownership:
  owns:
  - structure_density_modes
  - folder_creation_policy
  - execution_flow_first_strategy
  does_not_own:
  - final_file_tree_rendering
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - structure_strategy_result
dependencies:
  required_files: []
  optional_files: []
sections:
  strategy:
    default: minimum_sufficient
    priority:
    - feature_or_module_first
    - execution_flow_second
    - flat_when_small
    - role_family_grouping_when_large
    avoid:
    - folder_bloat
    - theoretical_nesting
  folder_creation_thresholds:
    create_flow_folder_when:
    - multiple artifacts in same flow
    - flow has distinct behavior
    keep_flat_when:
    - few artifacts
    - readability improves
  canonical_structure_strategy_source:
  - classify_feature_modules
  - validate_feature_based_structure
  - classify_folder_by_depth
  - validate_layer_assignment
  - validate_internal_module_structure
  - validate_dependency_graph
  - validate_data_flow
  - validate_execution_constraints
  - validate_cross_module_rules
  - validate_file_rules
  - validate_naming
  - validate_shared_code
  - validate_scalability
  - detect_anti_patterns
  - validate_heuristics
  canonical_structure_hierarchy_and_layers:
    feature_structure:
      rule: Each module represents a distinct business capability
      constraints:
      - Modules MUST be independently understandable
      - Modules MUST be independently testable
      - No implicit cross-module coupling
      detection:
        positive:
        - top-level folders represent domains
        negative:
        - top-level folders named by technical type
      violation:
      - structure organized by technical type
    module_structure:
      required_folders:
      - controllers
      - services
      - domain
      - repositories
      optional_folders:
      - dto
      - mappers
      - types
      - policies
      - validators
      - events
      - interfaces
      constraints:
      - each folder MUST have a single responsibility
      - no cross-folder leakage
      - files MUST belong to exactly one layer
    architecture_layers:
      layers:
      - transport
      - application
      - domain
      - infrastructure
      mapping:
        controllers: transport
        services: application
        domain: domain
        repositories: infrastructure
      dependency_direction:
        rule: dependencies MUST be unidirectional and inward
        constraints:
        - no reverse dependencies
        - no circular dependencies
        allowed:
          transport:
          - application
          application:
          - domain
          - interfaces
          domain: []
          infrastructure:
          - domain
          - interfaces
    file_rules:
      single_responsibility:
        rule: each file MUST represent exactly one intent
      single_export:
        rule: one primary export per file
      naming:
        must:
        - reflect exact behavior
        forbidden:
        - utils
        - helpers
        - common
      size:
        max_lines: 200
  semantic_depth_restoration:
    restored_from: conventions.structure.yaml
    restoration_scope:
    - evaluation_order
    - feature_structure
    - module_structure
    - architecture_layers
    - file_rules
    restoration_policy: canonical_source_preserved_under_standard_file_contract
    do_not_replace_with_summary: true
  canonical_restored_source:
    feature_structure:
      rule: Each module represents a distinct business capability
      constraints:
      - Modules MUST be independently understandable
      - Modules MUST be independently testable
      - No implicit cross-module coupling
      detection:
        positive:
        - top-level folders represent domains
        negative:
        - top-level folders named by technical type
      violation:
      - structure organized by technical type
    module_structure:
      required_folders:
      - controllers
      - services
      - domain
      - repositories
      optional_folders:
      - dto
      - mappers
      - types
      - policies
      - validators
      - events
      - interfaces
      constraints:
      - each folder MUST have a single responsibility
      - no cross-folder leakage
      - files MUST belong to exactly one layer
    architecture_layers:
      layers:
      - transport
      - application
      - domain
      - infrastructure
      mapping:
        controllers: transport
        services: application
        domain: domain
        repositories: infrastructure
      dependency_direction:
        rule: dependencies MUST be unidirectional and inward
        constraints:
        - no reverse dependencies
        - no circular dependencies
        allowed:
          transport:
          - application
          application:
          - domain
          - interfaces
          domain: []
          infrastructure:
          - domain
          - interfaces
    file_rules:
      single_responsibility:
        rule: each file MUST represent exactly one intent
      single_export:
        rule: one primary export per file
      naming:
        must:
        - reflect exact behavior
        forbidden:
        - utils
        - helpers
        - common
      size:
        max_lines: 200
  canonical_source_full:
    architecture_rules:
      version: '3.1'
      mode: agent_driven_design_system
      role: senior_software_architect
      purpose: 'Deterministically transform a feature prompt into a clean, scalable, production-grade architecture using strict
        layering, intent decomposition, and enforceable design constraints.

        '
      philosophy:
      - Decomposition precedes structure
      - Intent defines artifact
      - No ambiguity allowed
      - Consistency over convenience
      - Design must be derivable, not guessed
      execution_policy:
        ambiguity: fail_closed
        missing_information: ask_or_abort
        default_behavior: forbidden
      contract:
        input:
          type: feature_prompt
        output:
          type: architecture_blueprint
          must_include:
          - capabilities
          - atomic_units
          - intents
          - artifacts
          - layers
          - dependencies
          - file_structure
          - validation_report
      pipeline:
        steps:
        - extract_capabilities
        - decompose_to_atomic_units
        - classify_intents
        - map_to_artifacts
        - assign_layers
        - infer_dependencies
        - generate_file_structure
        - validate_system
      structure:
        module_definition:
          rule: Each module represents a distinct business capability
          constraints:
          - Modules MUST be independently understandable
          - Modules MUST be independently testable
          - No implicit cross-module coupling
        organization:
          strategy: feature_first
          fallback: layer_within_feature
        layer_boundaries:
          enforced: true
          rule: Strict separation between layers
      data_flow:
        direction:
          canonical:
          - ENTRY
          - APPLICATION
          - DECISION
          - DOMAIN
          - INFRASTRUCTURE
        rules:
        - Flow MUST be unidirectional
        - No reverse dependencies
        - No circular dependencies
        - APPLICATION orchestrates but does not persist
        - INFRASTRUCTURE handles all IO
        - Raw persistence models MUST NOT cross boundaries
        - Mapping layer MUST isolate transformations
      logic_decomposition:
        core_rules:
        - Each unit MUST have exactly one intent
        - If multiple reasons to change → MUST split
        - No god classes
        - No fat services
        cohesion:
          rule: Single responsibility is mandatory
          enforcement:
          - multi_intent_unit → invalid
          - multi_reason_to_change → split_required
      coupling:
        principles:
        - Depend on abstractions only
        - All external dependencies via DI
        - No global state
        forbidden:
        - domain_importing_infrastructure
        - service_importing_db_models
        - cross_module_internal_access
        required:
        - interfaces_at_boundaries
        - inversion_of_control
      service_model:
        constraints:
        - Services MUST be stateless
        - Services MUST be small and composable
        - Services MUST implement ONE intent only
        forbidden:
        - transport_logic_in_service
        - direct_repository_models
        - infrastructure_logic
        split_conditions:
        - multiple responsibilities
        - growing orchestration complexity
      service_usage:
        rules:
        - Same service MUST have ONE canonical interface
        - All usages MUST match same input/output structure
        - No alternative invocation patterns
        forbidden:
        - duplicate_service_logic
        - bypassing_service_layer
        - multiple_entrypoints_same_action
        resolution:
        - standardize_interface
        - refactor_all_call_sites
        - introduce_adapter_only_if_external
      patterns:
        allowed:
          repository:
            purpose: persistence abstraction
          factory:
            purpose: controlled object creation
          strategy:
            purpose: replace conditional logic
          adapter:
            purpose: external isolation
        usage_rules:
        - Pattern MUST reduce complexity
        - Pattern MUST improve clarity
        - No speculative patterns
        forbidden:
        - pattern_without_reason
        - over_engineering
      domain:
        rules:
        - Must contain core business rules
        - Must be pure
        - Must not depend on frameworks
      consistency:
        rules:
        - Similar problems MUST use same patterns
        - Naming MUST follow conventions
        - No parallel implementations of same logic
      scalability:
        rules:
        - Design for change
        - Prefer extensibility over shortcuts
        - Avoid tight coupling
      file_structure:
        strategy:
        - feature_first
        - layer_within_feature
        template:
          feature:
            entry:
            - '*.controller.ts'
            application:
            - '*use-case.ts'
            - '*service.ts'
            decision:
            - '*policy.ts'
            domain:
            - '*.entity.ts'
            infrastructure:
            - '*.repository.ts'
            support:
            - '*.mapper.ts'
            - '*.validator.ts'
      validation:
        fail_conditions:
        - multi_intent_unit
        - layer_violation
        - circular_dependency
        - service_interface_inconsistency
        - business_logic_in_wrong_layer
        - duplicate_logic_paths
        must_verify:
        - all_services_consistent
        - all_dependencies_valid
        - all_layers_respected
        - all_units_single_responsibility
      forbidden:
        ABSOLUTE:
        - circular_dependencies
        - layer_skipping
        - global_state
        - business_logic_in_infrastructure
        - infrastructure_in_domain
        - direct_db_access_from_services
        - mixed_responsibilities
        - god_classes
        - conditional_heavy_logic_without_strategy
        - duplicated_service_logic
        - inconsistent_service_usage
      agent_execution:
        behavior:
        - MUST follow pipeline strictly
        - MUST NOT skip steps
        - MUST NOT guess missing structure
        - MUST derive everything from intent
        output_format:
          sections:
          - capabilities
          - atomic_units
          - intents
          - artifacts
          - layers
          - dependencies
          - file_structure
          - validation
        output_constraints:
        - production_grade_only
        - no_pseudo_code
        - no_explanations
validation:
  fail_conditions:
  - id: ARCHITECTURE-CONVENTIONS-STRUCTURE-STRATEGY-YAML-FC-001
    condition: folder_created_without_threshold
    message: Folder created without threshold.
    severity: error
    owner: architecture/conventions.structure-strategy.yaml
  - id: ARCHITECTURE-CONVENTIONS-STRUCTURE-STRATEGY-YAML-FC-002
    condition: structure_bloat_detected
    message: Structure bloat detected.
    severity: error
    owner: architecture/conventions.structure-strategy.yaml
  required_checks: []
