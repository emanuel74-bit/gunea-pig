version: '1.0'
file:
  name: conventions.refactoring.yaml
  path: refactoring/conventions.refactoring.yaml
  role: refactoring_subsystem_entrypoint
  executability: advisory_entrypoint
purpose: Provide the bounded entrypoint, file index, execution order, and integration contract for safe behavior-preserving refactoring without owning global orchestration,
  artifact actions, gates, or implementation.
ownership:
  owns:
  - refactoring_file_index
  - refactoring_local_execution_order
  - refactoring_subsystem_contract
  - refactoring_integration_contract
  does_not_own:
  - refactor_strategy_definitions
  - refactor_strategy_selection
  - behavior_preservation_rules
  - safety_blockers
  - validation_checks
  - artifact_action_selection
  - implementation_sequence
  - phase_scheduling
activation:
  mode: entrypoint
  activates_when:
  - request_is_refactor_or_refactor_like
  - artifact_action_set_contains_refactor_action
  - refactor_strategy_selection_phase_active
  skips_when:
  - request_is_new_feature_only_without_existing_artifact_change
inputs:
  required:
  - behavior_contract
  optional:
  - artifact_action_table
  - risk_classification
  - change_impact_report
  - contract_classification
  - boundary_classification
  - dependency_classification
outputs:
  produces:
  - refactoring_subsystem_result
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - refactoring/conventions.refactor-taxonomy.yaml
  - refactoring/conventions.refactor-classification.yaml
  - refactoring/conventions.behavior-preservation.yaml
  - refactoring/conventions.refactor-strategy.yaml
  - refactoring/conventions.refactor-safety.yaml
  - refactoring/conventions.refactor-validation.yaml
  optional_files:
  - actions/conventions.action-resolution.yaml
  - planning/conventions.behavior-contract.yaml
  - planning/conventions.change-impact.yaml
  - risk/conventions.risk-classification.yaml
  - testing/conventions.test-derivation.yaml
sections:
  refactoring_file_index:
    taxonomy: refactoring/conventions.refactor-taxonomy.yaml
    classification: refactoring/conventions.refactor-classification.yaml
    behavior_preservation: refactoring/conventions.behavior-preservation.yaml
    strategy: refactoring/conventions.refactor-strategy.yaml
    safety: refactoring/conventions.refactor-safety.yaml
    validation: refactoring/conventions.refactor-validation.yaml
  refactoring_local_execution_order:
  - load_refactor_taxonomy
  - classify_refactor_need_scope_and_intent
  - derive_behavior_preservation_requirements
  - select_refactor_strategy
  - validate_refactor_safety
  - validate_refactor_outputs
  refactoring_subsystem_contract:
    absolute_rules:
    - id: REFACTOR-SYSTEM-ABS-001
      rule: Refactoring must preserve behavior unless behavior change is explicitly accepted by the behavior contract.
      fail_condition: refactor_changes_behavior_without_explicit_acceptance
    - id: REFACTOR-SYSTEM-ABS-002
      rule: Refactor strategy coordinates artifact actions but must not replace artifact action resolution.
      fail_condition: refactor_strategy_replaces_artifact_action_resolution
    - id: REFACTOR-SYSTEM-ABS-003
      rule: Refactoring must use global action, role, risk, contract, boundary, dependency, testing, gate, trigger, report, and revision vocabularies instead of redefining
        them.
      fail_condition: refactor_redefines_global_vocabulary
    - id: REFACTOR-SYSTEM-ABS-004
      rule: Implementation must be blocked when behavior preservation, compatibility, dependency, boundary, or safety prerequisites are unresolved.
      fail_condition: implementation_allowed_with_unresolved_refactor_prerequisite
  refactoring_integration_contract:
    consumes_from:
    - planning
    - actions
    - roles
    - risk
    - contracts
    - boundaries
    - dependencies
    - testing
    - reports
    emits_to:
    - triggers
    - reports
    - gates
    - revisions
    - execution
    - testing
    must_not_override:
    - mission_profiles
    - phase_order
    - gate_pass_fail
    - trigger_resolution
    - report_lifecycle
    - implementation_scope
validation:
  required_checks:
  - id: REFACTOR-SYSTEM-CHECK-001
    check: all_refactoring_files_follow_file_contract
    applies_when:
      refactoring_subsystem_loaded: true
  - id: REFACTOR-SYSTEM-CHECK-002
    check: refactoring_subsystem_does_not_redefine_external_authority
    applies_when:
      refactoring_subsystem_loaded: true
  fail_conditions:
  - id: REFACTOR-SYSTEM-001
    condition: refactor_redefines_global_vocabulary
    message: Refactoring subsystem must reference external vocabularies instead of redefining them.
    severity: error
  - id: REFACTOR-SYSTEM-002
    condition: implementation_allowed_with_unresolved_refactor_prerequisite
    message: Implementation must remain blocked until refactor prerequisites are resolved.
    severity: error
