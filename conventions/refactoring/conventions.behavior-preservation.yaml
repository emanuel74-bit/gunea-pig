version: '1.0'
file:
  name: conventions.behavior-preservation.yaml
  path: refactoring/conventions.behavior-preservation.yaml
  role: refactor_behavior_preservation_contract
  executability: validator
purpose: Define strict behavior preservation, behavior lock, characterization, regression, and allowed-change requirements for refactor-like changes.
ownership:
  owns:
  - behavior_preservation_policy
  - observable_behavior_surfaces
  - behavior_lock_requirement_decision_rules
  - allowed_behavior_change_rules
  - characterization_sufficiency_rules
  - behavior_preservation_output_schema
  does_not_own:
  - behavior_contract_extraction
  - refactor_strategy_selection
  - artifact_action_selection
  - test_taxonomy
  - implementation_sequence
activation:
  mode: conditional
  activates_when:
  - request_is_refactor_or_refactor_like
  - behavior_preservation_required
  - artifact_action_may_affect_existing_behavior
  skips_when:
  - no_existing_behavior_can_be_affected
inputs:
  required:
  - behavior_contract
  - refactor_classification
  optional:
  - artifact_action_table
  - risk_classification
  - contract_classification
  - test_inventory
  - codebase_reconnaissance_report
outputs:
  produces:
  - behavior_preservation_requirements
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - planning/conventions.behavior-contract.yaml
  - refactoring/conventions.refactor-classification.yaml
  - testing/conventions.characterization-testing.yaml
  - testing/conventions.regression-testing.yaml
  optional_files:
  - contracts/conventions.compatibility.yaml
  - risk/conventions.risk-classification.yaml
sections:
  behavior_preservation_policy:
    absolute_rules:
    - id: BEHAVIOR-PRESERVE-ABS-001
      rule: Externally observable behavior must be preserved unless behavior_contract explicitly accepts behavior change.
      fail_condition: refactor_changes_behavior_without_explicit_acceptance
    - id: BEHAVIOR-PRESERVE-ABS-002
      rule: Behavior locks are required before implementation when behavior preservation cannot be proven from existing evidence.
      fail_condition: implementation_without_required_behavior_lock
    - id: BEHAVIOR-PRESERVE-ABS-003
      rule: Characterization tests must protect behavior, not accidental implementation details.
      fail_condition: characterization_locks_accidental_detail
  observable_behavior_surfaces:
    public_contract:
      definition: API/event/export/DTO/CLI/message behavior visible to consumers.
      lock_with:
      - contract_tests
      - compatibility_decision
      - consumer_impact
    workflow_result:
      definition: End-to-end or use-case result visible through normal behavior.
      lock_with:
      - integration_tests
      - e2e_tests
      - acceptance_mapping
    domain_rule:
      definition: Business rule or invariant that must remain true.
      lock_with:
      - unit_tests
      - domain_characterization
    data_semantics:
      definition: Persistence shape, mapping, migration, ordering, or idempotency behavior.
      lock_with:
      - persistence_tests
      - migration_tests
      - rollback_plan
    side_effect_contract:
      definition: External calls, events, queue messages, retries, or idempotency behavior.
      lock_with:
      - integration_tests
      - contract_tests
      - failure_mode_tests
  behavior_lock_requirement_decision_rules:
    match_decision_rules:
    - id: LOCK-PUBLIC-CONTRACT
      priority: 1
      match:
        contract_classification.stability_level:
          any_of:
          - module_public
          - external_public
          - durable_versioned
      decision:
        behavior_lock_required: true
        lock_type:
        - contract_tests
        - compatibility_decision
        blocks_before:
        - pre_implementation_gate
        required_reports:
        - compatibility-decision
        - test-plan
    - id: LOCK-HIGH-RISK
      priority: 2
      match:
        risk_classification.risk_level:
          any_of:
          - high
          - critical
      decision:
        behavior_lock_required: true
        lock_type:
        - characterization_tests
        - checkpoint_validation_plan
        blocks_before:
        - pre_implementation_gate
        required_reports:
        - behavior-preservation-requirements
        - characterization-test-plan
    - id: LOCK-EXTRACT-SPLIT-REPLACE
      priority: 3
      match:
        artifact_action_table.selected_action:
          any_of:
          - extract_from_existing
          - split_existing
          - replace_existing
          - merge_existing
          - inline_existing
      decision:
        behavior_lock_required: true
        lock_type:
        - regression_tests_or_characterization
        blocks_before:
        - implementation
        required_reports:
        - behavior-preservation-requirements
    - id: LOCK-MOVE-RENAME-PRIVATE
      priority: 10
      match:
        artifact_action_table.selected_action:
          any_of:
          - move_existing
          - rename_existing
        contract_classification.stability_level:
          none_of:
          - module_public
          - external_public
          - durable_versioned
      decision:
        behavior_lock_required: false
        lock_type:
        - reference_validation
        required_reports:
        - dependency-validation
  allowed_behavior_change_rules:
  - id: ALLOWED-BEHAVIOR-CHANGE-EXPLICIT
    applies_when:
    - behavior_contract.allowed_behavior_changes not empty
    pass_when:
    - change appears in allowed_behavior_changes
    - acceptance criteria updated
    - test plan covers changed behavior
    fail_when:
    - change is inferred but not explicit
    fail_condition: implicit_behavior_change_detected
  - id: NO-BEHAVIOR-CHANGE-LOCK
    applies_when:
    - behavior_contract.no_behavior_change_statement is true
    pass_when:
    - all changed behavior surfaces have preservation evidence
    fail_when:
    - test/validation evidence cannot prove preservation
    fail_condition: no_behavior_change_not_proven
  characterization_sufficiency_rules:
  - id: CHAR-SUFFICIENT-CONTRACT
    choose_when:
    - existing tests assert public behavior and are reliable
    - tests cover changed call paths
    reject_when:
    - tests assert private implementation details only
    - tests are brittle snapshots without behavior assertion
  - id: CHAR-REQUIRED-WEAK-TESTS
    choose_when:
    - coverage state is weak or unknown
    - behavior is high risk or public
    reject_when:
    - behavior change explicitly accepted and new tests cover new behavior
  behavior_preservation_output_schema:
    required_fields:
    - preserved_behaviors
    - allowed_behavior_changes
    - behavior_locks
    - characterization_required
    - regression_required
    - blocking_items
    - evidence_refs
    - triggers_emitted
validation:
  required_checks:
  - id: BEHAVIOR-PRESERVE-CHECK-001
    check: behavior_lock_required_when_preservation_unproven
    applies_when:
      behavior_preservation_required: true
  - id: BEHAVIOR-PRESERVE-CHECK-002
    check: allowed_behavior_changes_explicit
    applies_when:
      behavior_change_detected: true
  fail_conditions:
  - id: BEHAVIOR-PRESERVE-001
    condition: implementation_without_required_behavior_lock
    message: Implementation cannot start before required behavior lock exists.
    severity: error
  - id: BEHAVIOR-PRESERVE-002
    condition: implicit_behavior_change_detected
    message: Behavior change must be explicit and covered by acceptance criteria/tests.
    severity: error
