version: '1.0'
file:
  name: conventions.refactor-taxonomy.yaml
  path: refactoring/conventions.refactor-taxonomy.yaml
  role: refactor_strategy_taxonomy_contract
  executability: vocabulary
purpose: Define refactor strategy, intent, scope, and local risk vocabulary without selecting strategies or validating active refactor decisions.
ownership:
  owns:
  - refactor_strategy_enum
  - refactor_intent_category_enum
  - refactor_scope_enum
  - refactor_strategy_definitions
  - refactor_local_risk_signals
  does_not_own:
  - refactor_strategy_selection
  - behavior_preservation_requirements
  - artifact_action_selection
  - risk_level_resolution
  - implementation_sequence
activation:
  mode: reference_only
  activates_when:
  - refactor_strategy_values_are_referenced
  - request_is_refactor_or_refactor_like
  skips_when: []
inputs:
  required: []
  optional:
  - behavior_contract
  - artifact_action_table
  - risk_classification
outputs:
  produces:
  - refactor_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - actions/conventions.action-taxonomy.yaml
  - risk/conventions.risk-taxonomy.yaml
  optional_files:
  - contracts/conventions.contract-taxonomy.yaml
  - dependencies/conventions.dependency-taxonomy.yaml
  - boundaries/conventions.boundary-taxonomy.yaml
sections:
  refactor_strategy_enum:
    allowed:
    - no_refactor
    - characterization_first
    - move_or_rename_only
    - extract_then_delegate
    - split_then_migrate
    - inline_and_remove
    - merge_duplicates
    - wrap_with_adapter
    - replace_with_facade
    - branch_by_abstraction
    - strangler_refactor
    - parallel_implementation
    - compatibility_adapter
    - incremental_migration
  refactor_intent_category_enum:
    allowed:
    - improve_role_clarity
    - protect_boundary
    - reduce_duplication
    - reduce_coupling
    - preserve_behavior_while_restructuring
    - enable_incremental_change
    - avoid_unnecessary_change
    - improve_discoverability
    - reduce_overengineering
    - large_scale_migration
    - safe_replacement
    - preserve_contract_compatibility
    - safe_sequence
  refactor_intent_definitions:
    improve_role_clarity:
      definition: Make artifact responsibilities and file roles match the role taxonomy.
      positive_signals:
      - role collision
      - mixed responsibility
      - misleading suffix
      reject_when:
      - role already clear
    protect_boundary:
      definition: Prevent transport, persistence, external, or framework details from leaking across boundaries.
      positive_signals:
      - boundary leak detected
      - external model leakage
      reject_when:
      - boundary already protected
    reduce_duplication:
      definition: Remove semantic duplication while preserving domain meaning.
      positive_signals:
      - same behavior implemented in multiple artifacts
      reject_when:
      - similar code represents distinct concepts
    reduce_coupling:
      definition: Reduce harmful direct dependencies and consumer knowledge.
      positive_signals:
      - many consumers know internals
      - illegal dependency direction
      reject_when:
      - dependency is intentional and allowed
    preserve_behavior_while_restructuring:
      definition: Restructure code without changing externally observable behavior.
      positive_signals:
      - refactor requested
      - cleanup without behavior change
      reject_when:
      - explicit behavior change is requested
    enable_incremental_change:
      definition: Create a safe temporary structure that permits staged migration.
      positive_signals:
      - large refactor
      - migration/cutover required
      reject_when:
      - atomic change is safe
    avoid_unnecessary_change:
      definition: Avoid refactoring when it adds risk without benefit.
      positive_signals:
      - no structural problem evidence
      reject_when:
      - rule violation requires change
    improve_discoverability:
      definition: Move or rename without changing behavior so artifacts are easier to find.
      positive_signals:
      - wrong location/name
      reject_when:
      - responsibility itself must change
    reduce_overengineering:
      definition: Remove unnecessary abstraction while preserving boundaries.
      positive_signals:
      - trivial passthrough
      - single consumer
      reject_when:
      - abstraction protects boundary
    large_scale_migration:
      definition: Replace large subsystem through staged/sliced migration.
      positive_signals:
      - legacy subsystem
      - multi-module replacement
      reject_when:
      - contained change
    safe_replacement:
      definition: Replace implementation with comparison/cutover safeguards.
      positive_signals:
      - old/new equivalence can be tested
      reject_when:
      - side effects cannot be isolated
    preserve_contract_compatibility:
      definition: Preserve public/shared consumer contracts during refactor.
      positive_signals:
      - public contract changed
      reject_when:
      - private contract all consumers updated
    safe_sequence:
      definition: Plan refactor as dependency-safe checkpoints.
      positive_signals:
      - multiple dependent steps
      reject_when:
      - no valid intermediate state
  refactor_strategy_definition_schema:
    required_fields:
    - definition
    - intent_category
    - typical_actions
    - positive_signals
    - negative_signals
    - choose_when
    - reject_when
    - required_evidence
    - required_followups
    - blocking_conditions
  refactor_strategy_definitions:
    no_refactor:
      definition: Select no refactor when the requested outcome can be achieved without restructuring existing code or when refactoring would add risk without measurable
        benefit.
      intent_category: avoid_unnecessary_change
      typical_actions:
      - no_code_change
      - reuse_existing
      positive_signals:
      - requested change is behavior-only and existing structure is acceptable
      - no mixed responsibility or dependency violation is detected
      - refactor would expand scope beyond mission profile
      negative_signals:
      - existing artifact violates role or boundary rules
      - duplication or illegal dependency must be corrected
      - behavior preservation requires structural isolation
      choose_when:
      - no refactor-like action is selected
      - risk of restructure is greater than benefit
      - current artifacts already satisfy role, boundary, and dependency constraints
      reject_when:
      - artifact_action_table contains split_existing, extract_from_existing, replace_existing, merge_existing, inline_existing, or move_existing with structural
        intent
      - boundary leak or dependency violation requires structural correction
      required_evidence:
      - artifact action table
      - risk classification
      - role/boundary/dependency evidence
      required_followups:
      - record no_refactor rationale
      blocking_conditions:
      - selected despite refactor-like action without rejected-action evidence
    characterization_first:
      definition: Lock current externally observable behavior with characterization evidence before changing structure.
      intent_category: preserve_behavior_while_restructuring
      typical_actions:
      - modify_existing
      - extract_from_existing
      - split_existing
      positive_signals:
      - test coverage is weak or unknown
      - behavior is important but not fully specified
      - refactor touches public, shared, or high-risk behavior
      negative_signals:
      - behavior is already fully covered by reliable tests
      - change is private move/rename with no logic movement
      choose_when:
      - behavior preservation is required and current tests cannot prove preservation
      - risk level is medium/high/critical and existing behavior may be affected
      reject_when:
      - behavior change is explicitly requested and preservation is not intended
      - existing tests and contracts already provide sufficient behavior lock
      required_evidence:
      - behavior contract
      - test inventory or test gap record
      - risk classification
      required_followups:
      - characterization-test-plan
      - behavior-preservation-requirements
      blocking_conditions:
      - implementation starts before behavior lock is created
    move_or_rename_only:
      definition: Move or rename artifacts without changing responsibilities, behavior, public contracts, or dependency direction.
      intent_category: improve_discoverability
      typical_actions:
      - move_existing
      - rename_existing
      positive_signals:
      - only file path or name is wrong
      - call sites can be updated mechanically
      - no logic movement is required
      negative_signals:
      - public export path changes without compatibility plan
      - move changes module boundary or ownership
      - rename hides a role mismatch
      choose_when:
      - selected action is move_existing or rename_existing
      - behavior_contract.requested_behavior_change is false
      - contract and dependency impact are low or fully accounted for
      reject_when:
      - move crosses module/public boundary without compatibility decision
      - rename implies role responsibility change requiring role reassignment
      required_evidence:
      - artifact action table
      - call-site impact
      - dependency classification
      required_followups:
      - import_reference_validation
      - changed_file_manifest
      blocking_conditions:
      - public export changed without compatibility decision
    extract_then_delegate:
      definition: Extract a responsibility from an existing artifact and delegate to the extracted artifact while preserving caller behavior.
      intent_category: improve_role_clarity
      typical_actions:
      - extract_from_existing
      - modify_existing
      positive_signals:
      - artifact has mixed responsibilities
      - extracted logic has stable responsibility and name
      - caller can remain as orchestration/delegation boundary
      negative_signals:
      - extracted logic has no independent responsibility
      - delegation would create circular dependency
      - caller behavior would become ambiguous
      choose_when:
      - mixed responsibility is detected and one responsibility can be isolated
      - source artifact remains valid by delegating
      - new artifact has clear role and boundary
      reject_when:
      - extraction would create an anemic passthrough with no stable abstraction
      - source artifact becomes an unnecessary wrapper unless wrapper is intentional
      required_evidence:
      - draft/final role assignment
      - artifact action table
      - boundary/dependency checks
      required_followups:
      - behavior_preservation_review
      - role_validation
      - dependency_validation
      - regression_test_review
      blocking_conditions:
      - extraction lacks role assignment or dependency direction validation
    split_then_migrate:
      definition: Split an overloaded artifact into multiple artifacts and migrate responsibilities/call sites incrementally or atomically according to impact.
      intent_category: reduce_responsibility_mixing
      typical_actions:
      - split_existing
      - modify_existing
      positive_signals:
      - one file/class owns multiple stable responsibilities
      - multiple consumers depend on different subsets
      - separation improves boundaries or testability
      negative_signals:
      - responsibilities are tightly cohesive
      - split only mirrors technical layers without business meaning
      choose_when:
      - mixed responsibility cannot be safely handled by extraction alone
      - post-split artifacts have distinct roles and contracts
      - call-site migration can be sequenced
      reject_when:
      - split would create circular dependencies or unclear ownership
      - split increases coupling or hides behavior flow
      required_evidence:
      - role collision report
      - call-site impact
      - change impact
      - structure plan
      required_followups:
      - checkpoint_validation_plan
      - call_site_analysis
      - structure_rendering
      - regression_test_review
      blocking_conditions:
      - implementation sequence missing migration checkpoints
    inline_and_remove:
      definition: Inline an unnecessary abstraction into the only valid consumer and remove the redundant artifact.
      intent_category: reduce_overengineering
      typical_actions:
      - inline_existing
      - delete_existing
      positive_signals:
      - artifact is a trivial pass-through
      - artifact has one consumer
      - inlining improves readability without broadening responsibility
      negative_signals:
      - artifact is public/shared
      - artifact protects a boundary
      - artifact has future independent ownership
      choose_when:
      - abstraction adds no boundary, policy, variant, or reuse value
      - consumer remains single-responsibility after inlining
      reject_when:
      - artifact is public, shared, or boundary-protecting
      - inlining would move infrastructure/transport details into domain/application logic
      required_evidence:
      - consumer count
      - boundary classification
      - role assignment
      required_followups:
      - delete_reference_validation
      - test_derivation
      blocking_conditions:
      - public/shared artifact inlined without compatibility decision
    merge_duplicates:
      definition: Merge semantically equivalent duplicated artifacts into one canonical artifact while preserving consumers.
      intent_category: reduce_duplication
      typical_actions:
      - merge_existing
      - replace_existing
      - deprecate_existing
      positive_signals:
      - duplicate artifacts implement the same semantic responsibility
      - differences are accidental or can be parameterized safely
      - one canonical owner can be defined
      negative_signals:
      - similar code represents different domain concepts
      - merge would create generic unclear abstraction
      choose_when:
      - duplication is semantic not coincidental
      - merged artifact has clear owner and stable API
      - consumer migration path is known
      reject_when:
      - merged abstraction would be vague or overly generic
      - duplicate behavior diverges intentionally
      required_evidence:
      - reusable behavior evidence
      - consumer impact
      - contract compatibility
      required_followups:
      - consumer-impact
      - compatibility-decision
      - regression_test_review
      blocking_conditions:
      - semantic equivalence not proven
    wrap_with_adapter:
      definition: Introduce an adapter around an incompatible interface or external/system boundary without changing domain/application semantics.
      intent_category: protect_boundary
      typical_actions:
      - wrap_existing
      - create_new
      - modify_existing
      positive_signals:
      - external or legacy interface does not match internal contract
      - boundary crossing requires translation
      - anti-corruption layer is needed
      negative_signals:
      - direct dependency is already clean and stable
      - adapter would only rename methods without protecting boundary
      choose_when:
      - compatibility or boundary mismatch exists
      - adapter can isolate external model/protocol/framework details
      reject_when:
      - adapter duplicates existing mapper/client wrapper
      - adapter would leak external model into domain/application
      required_evidence:
      - boundary classification
      - contract classification
      - dependency classification
      required_followups:
      - boundary_validation
      - contract_test_review
      - dependency_validation
      blocking_conditions:
      - adapter boundary role missing
    replace_with_facade:
      definition: Replace direct usage of complex or unstable internals with a facade that exposes a smaller stable API.
      intent_category: reduce_coupling
      typical_actions:
      - replace_existing
      - create_new
      - modify_existing
      positive_signals:
      - many consumers know internal details
      - public surface is too broad
      - call sites need a stable simplified API
      negative_signals:
      - facade would hide important domain concepts
      - existing API is already minimal and stable
      choose_when:
      - consumer coupling is high and can be reduced behind a stable facade
      - facade has a clear boundary and owner
      reject_when:
      - facade becomes god service or service locator
      - facade hides unrelated responsibilities
      required_evidence:
      - consumer impact
      - boundary classification
      - role assignment
      required_followups:
      - compatibility-decision
      - consumer-impact
      - structure_rendering
      blocking_conditions:
      - facade lacks narrow API definition
    branch_by_abstraction:
      definition: Introduce an abstraction seam so old and new implementations can coexist while consumers migrate safely.
      intent_category: enable_incremental_change
      typical_actions:
      - create_new
      - wrap_existing
      - replace_existing
      positive_signals:
      - large change cannot be done atomically
      - consumer migration must be gradual
      - old and new behavior must coexist temporarily
      negative_signals:
      - change is small and can be atomic
      - abstraction would become permanent speculative indirection
      choose_when:
      - risk/consumer impact requires staged migration
      - compatibility must be preserved during transition
      reject_when:
      - no migration period is needed
      - abstraction ownership and removal plan are absent
      required_evidence:
      - consumer-impact
      - risk classification
      - implementation sequence
      required_followups:
      - migration_plan
      - checkpoint_validation_plan
      - cleanup_followup
      blocking_conditions:
      - no removal or convergence plan
    strangler_refactor:
      definition: Gradually replace a legacy subsystem by routing slices of behavior to a new subsystem while preserving operation.
      intent_category: large_scale_migration
      typical_actions:
      - create_new
      - wrap_existing
      - replace_existing
      - deprecate_existing
      positive_signals:
      - legacy subsystem is too large to replace atomically
      - routing or facade can select old/new paths
      - migration slices are independently valid
      negative_signals:
      - change is local or contained
      - no safe routing/rollback path exists
      choose_when:
      - multi-module legacy replacement requires staged cutover
      - consumer compatibility and rollback are required
      reject_when:
      - no clear strangler boundary or slice plan exists
      - state/data migration cannot be controlled
      required_evidence:
      - large_refactor profile
      - consumer impact
      - risk escalation
      - rollback plan
      required_followups:
      - strict_gate_profile
      - checkpoint_validation_plan
      - migration_required
      blocking_conditions:
      - rollback or slice ownership missing
    parallel_implementation:
      definition: Build a new implementation beside the old one and compare/switch after validation.
      intent_category: safe_replacement
      typical_actions:
      - create_new
      - replace_existing
      positive_signals:
      - new implementation can be validated against old behavior
      - cutover risk requires comparison
      - feature flag or routing exists
      negative_signals:
      - old and new cannot run safely together
      - comparison oracle is unavailable
      choose_when:
      - behavior equivalence can be measured
      - temporary duplication is acceptable and bounded
      reject_when:
      - parallel execution creates side effects/data inconsistency
      - no cleanup/removal plan exists
      required_evidence:
      - behavior preservation requirements
      - risk classification
      - implementation sequence
      required_followups:
      - characterization-test-plan
      - cutover_plan
      - cleanup_followup
      blocking_conditions:
      - side effects cannot be isolated
    compatibility_adapter:
      definition: Add compatibility layer to keep old contract consumers working while internal structure or contract evolves.
      intent_category: preserve_contract_compatibility
      typical_actions:
      - wrap_existing
      - create_new
      - modify_existing
      positive_signals:
      - public contract changes or moves
      - consumers need transition period
      - backward compatibility is required
      negative_signals:
      - all consumers are known and can be updated atomically
      - no public/shared contract exists
      choose_when:
      - compatibility_decision requires backward compatibility
      - breaking change risk exists and adapter can preserve old surface
      reject_when:
      - adapter would preserve invalid/deprecated behavior without deprecation plan
      - contract is private and all consumers update together
      required_evidence:
      - compatibility-decision
      - consumer-impact
      - contract classification
      required_followups:
      - contract_tests
      - deprecation_plan
      - consumer_update_plan
      blocking_conditions:
      - compatibility obligations unknown
    incremental_migration:
      definition: Execute refactor in dependency-safe checkpoints, migrating consumers and validating after each step.
      intent_category: safe_sequence
      typical_actions:
      - modify_existing
      - move_existing
      - replace_existing
      - split_existing
      positive_signals:
      - multiple consumers or dependency edges must change
      - temporary compatibility is needed
      - validation checkpoints reduce risk
      negative_signals:
      - change is atomic and low-risk
      - intermediate states cannot be valid
      choose_when:
      - sequencing can produce valid intermediate states
      - risk requires checkpoint validation
      reject_when:
      - intermediate state would break build/runtime
      - migration cannot be scoped into safe checkpoints
      required_evidence:
      - change impact
      - dependency graph
      - checkpoint validation plan
      required_followups:
      - checkpoint_validation_plan
      - dependency_validation
      - post_implementation_validation
      blocking_conditions:
      - checkpoint plan missing
  refactor_scope_enum:
    allowed:
    - single_artifact
    - single_flow
    - single_module
    - cross_module
    - shared_kernel
    - external_contract
    - data_or_migration_surface
    - unknown
  refactor_scope_definitions:
    single_artifact:
      definition: Only one artifact changes and no public or shared consumer is affected.
      risk_floor: low
    single_flow:
      definition: Multiple artifacts in one use-case flow change together.
      risk_floor: medium
    single_module:
      definition: Several artifacts inside one module change without crossing module public boundary.
      risk_floor: medium
    cross_module:
      definition: Refactor crosses module boundaries or requires consumer migration.
      risk_floor: high
    shared_kernel:
      definition: Refactor affects shared/library code consumed by multiple modules.
      risk_floor: high
    external_contract:
      definition: Refactor affects public API/event/DTO/export or external consumer contract.
      risk_floor: critical_when_breaking_possible
    data_or_migration_surface:
      definition: Refactor affects persistence/data migration/backfill/projection behavior.
      risk_floor: critical_when_data_loss_possible
    unknown:
      definition: Scope cannot be proven from current evidence.
      risk_floor: high
      default_policy: fail_closed
  refactor_local_risk_signals:
    behavior_drift_possible:
      definition: Structural change can accidentally alter externally observable behavior.
      emits_risk_context: refactor_risk
    call_site_migration_required:
      definition: Consumers must be updated to preserve behavior or compile/runtime correctness.
      emits_trigger: call_site_update_required
    public_contract_affected:
      definition: Public/shared contract is changed, moved, wrapped, deprecated, or replaced.
      emits_trigger: compatibility_decision_required
    boundary_leak_may_change:
      definition: Refactor changes boundary crossings or may introduce/remove a boundary leak.
      emits_trigger: boundary_validation_required
    dependency_direction_may_change:
      definition: Imports or runtime dependency direction may change.
      emits_trigger: dependency_validation_required
    data_semantics_may_change:
      definition: Persistence shape, mapping, or migration behavior may change.
      emits_risk_context: migration_risk
    test_oracle_missing:
      definition: No reliable test/evidence exists to prove behavior preservation.
      emits_trigger: validation_required
validation:
  required_checks:
  - id: REFACTOR-TAXONOMY-CHECK-001
    check: every_strategy_has_required_semantic_fields
    applies_when:
      refactor_strategy_values_are_referenced: true
  - id: REFACTOR-TAXONOMY-CHECK-002
    check: strategy_typical_actions_exist_in_action_taxonomy
    applies_when:
      action_taxonomy_loaded: true
  fail_conditions:
  - id: REFACTOR-TAXONOMY-001
    condition: unknown_refactor_strategy
    message: Refactor strategy must be defined in refactor taxonomy.
    severity: error
  - id: REFACTOR-TAXONOMY-002
    condition: refactor_strategy_missing_required_semantics
    message: Refactor strategy definition must include signals, choose/reject rules, evidence, followups, and blockers.
    severity: error
