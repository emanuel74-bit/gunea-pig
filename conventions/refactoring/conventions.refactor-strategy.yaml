version: '1.0'
file:
  name: conventions.refactor-strategy.yaml
  path: refactoring/conventions.refactor-strategy.yaml
  role: refactor_strategy_resolution_engine
  executability: decision_engine
purpose: Select the safest refactor strategy using classified refactor need, artifact actions, behavior preservation, and subsystem evidence without selecting artifact
  actions or implementation order.
ownership:
  owns:
  - strategy_selection_policy
  - strategy_selection_decision_rules
  - strategy_priority_order
  - strategy_tie_breakers
  - strategy_decision_output_schema
  does_not_own:
  - refactor_strategy_definitions
  - artifact_action_selection
  - risk_level_resolution
  - change_impact_analysis
  - compatibility_strategy_selection
  - dependency_classification
  - implementation_sequence
activation:
  mode: conditional
  activates_when:
  - refactor_classification.refactor_needed
  - artifact_action_set_contains_refactor_action
  - design_revision_requires_structural_change
  skips_when:
  - refactor_classification.refactor_needed is false
inputs:
  required:
  - behavior_contract
  - refactor_taxonomy
  - refactor_classification
  - artifact_action_table
  - risk_classification
  optional:
  - behavior_preservation_requirements
  - boundary_classification
  - contract_classification
  - compatibility_decision
  - dependency_classification
  - change_impact_report
  - test_inventory
outputs:
  produces:
  - refactor_strategy_decision
  - refactor_required_followups
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - refactoring/conventions.refactor-taxonomy.yaml
  - refactoring/conventions.refactor-classification.yaml
  - refactoring/conventions.behavior-preservation.yaml
  - actions/conventions.action-resolution.yaml
  - risk/conventions.risk-classification.yaml
  optional_files:
  - contracts/conventions.compatibility.yaml
  - boundaries/conventions.boundary-validation.yaml
  - dependencies/conventions.dependency-validation.yaml
  - testing/conventions.testing-matrix.yaml
sections:
  strategy_selection_policy:
    absolute_rules:
    - id: REFACTOR-STRATEGY-ABS-001
      rule: Strategy selection must be based on refactor classification, artifact actions, behavior preservation, risk, contracts, boundaries, dependencies, and testing
        evidence.
      fail_condition: strategy_selected_without_required_evidence
    - id: REFACTOR-STRATEGY-ABS-002
      rule: A restricted/high-risk strategy must include checkpoint and validation followups.
      fail_condition: high_risk_strategy_without_checkpoints
    - id: REFACTOR-STRATEGY-ABS-003
      rule: Strategy must not introduce broader scope than mission profile allows.
      fail_condition: strategy_exceeds_mission_scope
  strategy_priority_order:
  - no_refactor
  - move_or_rename_only
  - characterization_first
  - extract_then_delegate
  - split_then_migrate
  - inline_and_remove
  - merge_duplicates
  - wrap_with_adapter
  - replace_with_facade
  - compatibility_adapter
  - branch_by_abstraction
  - parallel_implementation
  - incremental_migration
  - strangler_refactor
  strategy_selection_decision_rules:
    match_decision_rules:
    - id: SELECT-NO-REFACTOR
      priority: 1
      match:
        refactor_classification.refactor_needed: false
      decision:
        selected_strategy: no_refactor
        blocks_implementation: false
        required_followups:
        - record_no_refactor_reason
    - id: SELECT-CHARACTERIZATION-FIRST
      priority: 2
      match:
        behavior_preservation_requirements.behavior_lock_required: true
        test_inventory.coverage_state:
          any_of:
          - weak
          - unknown
      decision:
        selected_strategy: characterization_first
        blocks_implementation: true
        required_reports:
        - characterization-test-plan
        - behavior-preservation-requirements
    - id: SELECT-MOVE-RENAME
      priority: 3
      match:
        artifact_action_table.selected_action:
          any_of:
          - move_existing
          - rename_existing
        refactor_scope:
          any_of:
          - single_artifact
          - single_module
        public_contract_changed: false
      decision:
        selected_strategy: move_or_rename_only
        blocks_implementation: false
        required_followups:
        - dependency_validation
        - call_site_update_required_if_references_exist
    - id: SELECT-EXTRACT
      priority: 4
      match:
        artifact_action_table.selected_action: extract_from_existing
        source_artifact_remains_valid_after_delegation: true
      decision:
        selected_strategy: extract_then_delegate
        blocks_implementation: false
        required_followups:
        - role_validation
        - dependency_validation
        - regression_test_review
    - id: SELECT-SPLIT
      priority: 5
      match:
        artifact_action_table.selected_action: split_existing
      decision:
        selected_strategy: split_then_migrate
        blocks_implementation: false
        required_followups:
        - call_site_impact_analysis
        - change_impact_analysis
        - checkpoint_validation_plan
    - id: SELECT-INLINE
      priority: 6
      match:
        artifact_action_table.selected_action: inline_existing
        consumer_count: 1
        artifact_is_public_or_boundary_protecting: false
      decision:
        selected_strategy: inline_and_remove
        blocks_implementation: false
        required_followups:
        - delete_reference_validation
        - targeted_validation
    - id: SELECT-MERGE-DUPLICATES
      priority: 7
      match:
        artifact_action_table.selected_action: merge_existing
        semantic_equivalence_proven: true
      decision:
        selected_strategy: merge_duplicates
        blocks_implementation: false
        required_followups:
        - consumer-impact
        - compatibility-decision-if-public
        - regression_test_review
    - id: SELECT-WRAP-ADAPTER
      priority: 8
      match:
        boundary_or_contract_mismatch_detected: true
        adapter_can_isolate_mismatch: true
      decision:
        selected_strategy: wrap_with_adapter
        blocks_implementation: false
        required_followups:
        - boundary_validation
        - contract_test_review
    - id: SELECT-COMPATIBILITY-ADAPTER
      priority: 9
      match:
        compatibility_decision.compatibility_state:
          any_of:
          - backward_compatibility_required
          - breaking_change_possible
      decision:
        selected_strategy: compatibility_adapter
        blocks_implementation: false
        required_followups:
        - compatibility-decision
        - consumer-impact
        - contract_tests
    - id: SELECT-INCREMENTAL-MIGRATION
      priority: 10
      match:
        refactor_scope:
          any_of:
          - cross_module
          - shared_kernel
          - external_contract
        valid_intermediate_states_possible: true
      decision:
        selected_strategy: incremental_migration
        blocks_implementation: false
        required_followups:
        - checkpoint_validation_plan
        - dependency_validation
    - id: SELECT-BRANCH-BY-ABSTRACTION
      priority: 11
      match:
        large_change_requires_coexistence: true
        abstraction_seam_can_be_owned: true
      decision:
        selected_strategy: branch_by_abstraction
        blocks_implementation: false
        required_followups:
        - migration_plan
        - cleanup_followup
        - compatibility_review
    - id: SELECT-PARALLEL-IMPLEMENTATION
      priority: 12
      match:
        old_and_new_can_run_safely_together: true
        comparison_oracle_available: true
      decision:
        selected_strategy: parallel_implementation
        blocks_implementation: false
        required_followups:
        - characterization-test-plan
        - cutover_plan
    - id: SELECT-STRANGLER
      priority: 13
      match:
        legacy_subsystem_replacement: true
        slice_boundary_defined: true
      decision:
        selected_strategy: strangler_refactor
        blocks_implementation: false
        required_followups:
        - strict_gate_profile
        - rollback_plan
        - checkpoint_validation_plan
    - id: SELECT-BLOCK-UNKNOWN
      priority: 99
      match:
        refactor_scope: unknown
      decision:
        selected_strategy: characterization_first
        blocks_implementation: true
        required_followups:
        - additional_reconnaissance
        - risk_reclassification_required
  strategy_tie_breakers:
  - prefer the strategy with the smallest valid scope that satisfies behavior preservation
  - prefer strategy preserving public contracts without compatibility debt
  - prefer incremental_migration over strangler_refactor when valid intermediate states are local and bounded
  - prefer characterization_first before any strategy when preservation evidence is insufficient
  - reject any strategy requiring unavailable evidence unless mission is blocked or revised
  strategy_decision_output_schema:
    required_fields:
    - selected_strategy
    - strategy_reason
    - rejected_strategies
    - required_behavior_lock
    - required_followups
    - required_reports
    - triggers_emitted
    - blocking_items
    - evidence_refs
validation:
  required_checks:
  - id: REFACTOR-STRATEGY-CHECK-001
    check: strategy_has_required_evidence
    applies_when:
      refactor_needed: true
  - id: REFACTOR-STRATEGY-CHECK-002
    check: rejected_strategies_recorded
    applies_when:
      multiple_strategy_candidates: true
  fail_conditions:
  - id: REFACTOR-STRATEGY-001
    condition: strategy_selected_without_required_evidence
    message: Refactor strategy must cite required evidence.
    severity: error
  - id: REFACTOR-STRATEGY-002
    condition: strategy_exceeds_mission_scope
    message: Selected refactor strategy exceeds mission scope.
    severity: error
