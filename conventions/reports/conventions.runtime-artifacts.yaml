  runtime_artifact_enforcement_model:
    route_backed_generation: runtime artifacts must be produced by declared executor
      routes or explicitly marked as runtime-context generated
    required_validation_sequence:
    - compile_runtime_artifact_topology
    - validate_runtime_artifacts
    path_authority: runtime artifact paths are normalized and validated by runtime
      artifact topology scripts
    script_selection: agents never call artifact scripts directly; they use executor
      routes
  runtime_artifact_allowed_values:
    scope:
    - mission_runtime
    - phase_runtime
    - package_runtime
    - execution_runtime
    - context_dependent
    lifecycle:
    - generated_runtime_output
    - generated_validation_output
    - generated_report_output
    - generated_bundle_output
    - runtime_state
    - context_dependent
    write_mode:
    - single_writer
    - append
    - aggregate
    - single_writer_unless_append_or_aggregate_declared
    - context_dependent
validation:
  required_checks:
  - id: RUNTIME-ARTIFACT-CHECK-001
    check: runtime_artifact_paths_normalized
  - id: RUNTIME-ARTIFACT-CHECK-002
    check: runtime_artifact_identity_conflicts_detected
  - runtime_artifact_topology_compiled_before_validation
  - runtime_artifact_paths_normalized
  - runtime_artifact_same_path_different_id_blocked
  - runtime_artifact_same_id_different_path_blocked
  - runtime_artifact_required_identity_fields_present
  - runtime_artifact_routes_resolved_through_executor_map
  fail_conditions:
  - id: RUNTIME-ARTIFACT-001
    condition: same_path_declared_for_different_artifacts
    message: Runtime artifact path has conflicting identities.
    severity: error
  - id: RUNTIME-ARTIFACT-002
    condition: runtime_artifact_path_contains_trailing_punctuation
    message: Runtime artifact path must be normalized before validation.
    severity: error
  - runtime_artifact_path_conflict
  - runtime_artifact_identity_conflict
  - runtime_artifact_missing_required_identity_field
  - runtime_artifact_validation_route_missing
