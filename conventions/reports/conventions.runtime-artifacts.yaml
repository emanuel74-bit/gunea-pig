version: '1.0'
file:
  name: conventions.runtime-artifacts.yaml
  path: reports/conventions.runtime-artifacts.yaml
  role: runtime_artifact_identity_registry
  executability: registry
purpose: Define canonical identity, path normalization, ownership, lifecycle, and
  conflict rules for runtime artifacts such as .ai reports, manifests, validation
  summaries, and phase outputs.
ownership:
  owns:
  - runtime_artifact_identity_model
  - runtime_artifact_path_normalization
  - runtime_artifact_registry
  - runtime_artifact_conflict_rules
  does_not_own:
  - local_report_template_content
  - phase_execution_logic
  - mission_state_mutation
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional:
  - runtime_artifact_references
outputs:
  produces:
  - runtime_artifact_registry
  - runtime_artifact_identity_validation_rules
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - core/conventions.output-schema.yaml
  optional_files:
  - reports/conventions.report-registry.yaml
sections:
  runtime_artifact_identity_model:
    required_fields:
    - artifact_id
    - path
    - artifact_type
    - schema
    - producer
    - consumers
    - scope
    - lifecycle
    - write_mode
    - required
  runtime_artifact_path_normalization:
    rules:
    - strip_trailing_semicolon
    - strip_trailing_comma
    - strip_quotes
    - normalize_slashes
    - preserve_glob_semantics
    - distinguish_runtime_artifacts_from_convention_files
  runtime_artifact_conflict_rules:
  - id: ARTIFACT-SAME-PATH-SAME-ID
    condition: same_path_and_same_artifact_id
    result: valid_shared_reference
  - id: ARTIFACT-SAME-PATH-DIFFERENT-ID
    condition: same_path_and_different_artifact_id
    result: invalid_conflict
  - id: ARTIFACT-DIFFERENT-PATH-SAME-ID
    condition: different_path_and_same_artifact_id
    result: valid_only_if_alias_or_migration_declared
  - id: ARTIFACT-MULTIPLE-PRODUCERS
    condition: same_artifact_id_has_multiple_producers
    result: invalid_unless_write_mode_is_append_or_aggregate
  runtime_artifact_registry:
  - artifact_id: ai_bundles_glob
    path: .ai/bundles/**
    artifact_type: glob
    schema: declared_by_producing_subsystem_or_runtime_artifact_registry_extension
    producer: executor_route_allowed_write_path
    producer_routes: []
    consumers:
    - multi-agent/conventions.phase-bundle-policy.yaml
    scope: mission_runtime
    lifecycle: generated_runtime_output
    write_mode: single_writer_unless_append_or_aggregate_declared
    required: context_dependent
  - artifact_id: ai_validation_glob
    path: .ai/validation/**
    artifact_type: glob
    schema: declared_by_producing_subsystem_or_runtime_artifact_registry_extension
    producer: executor_route_allowed_write_path
    producer_routes: []
    consumers:
    - executors/conventions.executor-routes.yaml
    scope: mission_runtime
    lifecycle: generated_runtime_output
    write_mode: single_writer_unless_append_or_aggregate_declared
    required: context_dependent
  - artifact_id: ai_topologies_glob
    path: .ai/topologies/**
    artifact_type: glob
    schema: declared_by_producing_subsystem_or_runtime_artifact_registry_extension
    producer: executor_route_allowed_write_path
    producer_routes: []
    consumers:
    - executors/conventions.executor-routes.yaml
    scope: mission_runtime
    lifecycle: generated_runtime_output
    write_mode: single_writer_unless_append_or_aggregate_declared
    required: context_dependent
  - artifact_id: ai_gates_glob
    path: .ai/gates/**
    artifact_type: glob
    schema: declared_by_producing_subsystem_or_runtime_artifact_registry_extension
    producer: executor_route_allowed_write_path
    producer_routes: []
    consumers:
    - gates/conventions.gates.yaml
    scope: mission_runtime
    lifecycle: generated_runtime_output
    write_mode: single_writer_unless_append_or_aggregate_declared
    required: context_dependent
  - artifact_id: ai_handoffs_glob
    path: .ai/handoffs/**
    artifact_type: glob
    schema: declared_by_producing_subsystem_or_runtime_artifact_registry_extension
    producer: executor_route_allowed_write_path
    producer_routes: []
    consumers:
    - handoffs/conventions.handoffs.yaml
    scope: mission_runtime
    lifecycle: generated_runtime_output
    write_mode: single_writer_unless_append_or_aggregate_declared
    required: context_dependent
  - artifact_id: ai_revisions_glob
    path: .ai/revisions/**
