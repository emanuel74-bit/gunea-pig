    path: .ai/missions/{mission_id}/mission-journal.ndjson
    artifact_type: runtime_artifact
    schema: mission_journal_ndjson
    producer: mission_controller_executor_routes
    producer_routes:
    - initialize_mission
    - advance_mission
    consumers:
    - missions/conventions.mission-journal.yaml
    - missions/conventions.mission-state.yaml
    scope: mission_runtime
    lifecycle: runtime_state
    write_mode: append
    required: after_mission_initialization
  - artifact_id: ai_mission_checkpoint_yaml
