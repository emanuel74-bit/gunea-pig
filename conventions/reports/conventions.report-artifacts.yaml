version: '1.0'
file:
  name: conventions.report-artifacts.yaml
  path: reports/conventions.report-artifacts.yaml
  role: persistent_report_artifact_contract
  executability: schema
purpose: Define persistent report artifacts, compact report schema, evidence references, registry, and validation rules.
ownership:
  owns:
  - report_artifact_registry
  - compact_report_schema
  - evidence_reference_schema
  - report_registry_schema
  - report_validation_rules
  does_not_own:
  - logical_output_schema_definitions
  - phase_gate_logic
activation:
  mode: conditional
  activates_when:
  - persistent_reports_required
  skips_when: []
inputs:
  required:
  - mission_profile
  - phase_taxonomy
  optional: []
outputs:
  produces:
  - report_registry
  - report_artifact_validation_report
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - core/conventions.output-schema.yaml
  - phases/conventions.phase-taxonomy.yaml
  optional_files: []
sections:
  report_format_enum:
    allowed:
    - yaml
    - markdown
    - json
  report_lifecycle_state_enum:
    allowed:
    - expected
    - produced
    - validated
    - missing
    - invalid
    - invalidated
    - replaced
  compact_report_schema:
    required_fields:
    - report_id
    - phase_id
    - status
    - summary
    - inputs_consumed
    - decisions
    - evidence_refs
    - triggers_emitted
    - gate_result
  evidence_reference_schema:
    required_fields:
    - evidence_ref_id
    - source_file
    - source_record_id
    - supports
  report_artifact_schema:
    required_fields:
    - report_id
    - phase_id
    - path
    - format
    - owner_agent
    - required_fields
    - consumed_by_phases
    - lifecycle_state
  report_artifact_registry:
  - report_id: mission-profile
    phase_id: mission_profile_selection
    path: .ai/reports/00-mission-profile.yaml
    format: yaml
    owner_agent: alpha_controller
    required_fields:
    - report_id
    - phase_id
    - status
    - summary
    - inputs_consumed
    - decisions
    - evidence_refs
    - triggers_emitted
    - gate_result
    consumed_by_phases:
    - mission_initialization
    - active_context_manifest
    lifecycle_state: expected
    schema_reference: mission_profile_schema
    evidence_required: false
    compact_required: true
    full_evidence_allowed: false
  - report_id: report-registry
