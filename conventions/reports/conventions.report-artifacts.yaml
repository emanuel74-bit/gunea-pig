version: '1.0'
file:
  name: conventions.report-artifacts.yaml
  path: reports/conventions.report-artifacts.yaml
  role: report_artifact_compatibility_entrypoint
  executability: advisory_entrypoint
purpose: Provide backward-compatible access to the report artifact contract while
  delegating taxonomy, schemas, registry, lifecycle, templates, consumption, and validation
  to the dedicated report subsystem files.
ownership:
  owns:
  - report_artifacts_file_map
  - report_artifact_access_contract
  does_not_own:
  - report_taxonomy
  - report_schema_definitions
  - report_registry_authority
  - report_validation_algorithm
activation:
  mode: entrypoint
  activates_when:
  - legacy_report_artifacts_reference_used
  - persistent_reports_required
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - report_artifact_contract_refs
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - reports/conventions.report-taxonomy.yaml
  - reports/conventions.report-schemas.yaml
  - reports/conventions.report-registry.yaml
  - reports/conventions.report-validation.yaml
  optional_files:
  - reports/conventions.report-lifecycle.yaml
  - reports/conventions.report-consumption-policy.yaml
  - reports/conventions.report-templates.yaml
sections:
  report_artifacts_file_map:
    taxonomy: reports/conventions.report-taxonomy.yaml
    schemas: reports/conventions.report-schemas.yaml
    registry: reports/conventions.report-registry.yaml
    lifecycle: reports/conventions.report-lifecycle.yaml
    consumption_policy: reports/conventions.report-consumption-policy.yaml
    templates: reports/conventions.report-templates.yaml
    validation: reports/conventions.report-validation.yaml
  report_artifact_access_contract:
    absolute_rules:
    - id: REPORT-ARTIFACTS-ACCESS-001
      rule: References to report artifact registry must resolve to reports/conventions.report-registry.yaml.
      fail_condition: report_artifact_registry_reference_unresolved
    - id: REPORT-ARTIFACTS-ACCESS-002
      rule: This compatibility entrypoint must not duplicate or override registry
        records.
      fail_condition: report_artifacts_entrypoint_redefines_registry
validation:
  required_checks:
  - id: REPORT-ARTIFACTS-CHECK-001
    check: report_artifact_refs_resolve_to_dedicated_files
    applies_when:
      legacy_report_artifacts_reference_used: true
  fail_conditions:
  - id: REPORT-ARTIFACTS-001
    condition: report_artifacts_entrypoint_redefines_registry
    message: Compatibility entrypoint must not redefine registry authority.
    severity: error
