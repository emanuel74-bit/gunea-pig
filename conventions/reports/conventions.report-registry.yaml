version: '1.0'
file:
  name: conventions.report-registry.yaml
  path: reports/conventions.report-registry.yaml
  role: report_artifact_registry_contract
  executability: registry
purpose: Define the canonical report artifact registry for every durable phase output
  report and its owner, schema, lifecycle, template, and consumption metadata.
ownership:
  owns:
  - report_artifact_registry
  - registry_generation_policy
  - registry_integrity_rules
  does_not_own:
  - report_schema_definitions
  - report_validation_algorithm
  - phase_dependency_edges
activation:
  mode: conditional
  activates_when:
  - phase_contracts_loaded
  - report_registry_required
  skips_when: []
inputs:
  required:
  - phase_contract_registry
  optional: []
outputs:
  produces:
  - report_artifact_registry
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - reports/conventions.report-taxonomy.yaml
  - reports/conventions.report-schemas.yaml
  - phases/conventions.phase-contracts.yaml
  optional_files:
  - missions/conventions.mission-profiles.yaml
sections:
  registry_generation_policy:
    absolute_rules:
    - id: REPORT-REGISTRY-ABS-001
      rule: Every .ai/reports output declared by a phase contract must appear exactly
        once in report_artifact_registry.
      fail_condition: phase_report_output_missing_or_duplicated_in_registry
    - id: REPORT-REGISTRY-ABS-002
      rule: The report owner_agent must match the owner_agent of the producing phase
        contract.
      fail_condition: report_owner_agent_mismatch
    - id: REPORT-REGISTRY-ABS-003
      rule: Report paths are immutable within a mission unless a revision creates
        an explicit replacement.
      fail_condition: report_path_changed_without_revision
  report_artifact_registry:
  - report_id: 00-mission-profile
    phase_id: mission_profile_selection
    path: .ai/reports/00-mission-profile.yaml
    format: yaml
    owner_agent: alpha_controller
    category: mission_control
    required_fields:
    - report_id
    - phase_id
    - status
    - summary
    - inputs_consumed
    - decisions
    - evidence_refs
    - triggers_emitted
    - gate_result
    - selected_profile
    - selection_rule
    - rejected_profiles
    - reason_summary
    - profile_gate_strictness
    - active_phase_plan_seed
    optional_fields:
    - blocked_items
    - unresolved_items
    - produced_outputs
    - invalidated_outputs
    - replacement_for
    - schema_version
    - notes
    consumed_by_phases:
    - mission_initialization
    lifecycle_state: expected
    schema_reference: 00_mission_profile_report_schema
    template_reference: .ai/templates/reports/00-mission-profile.template.yaml
    evidence_required: false
    compact_required: true
    full_evidence_allowed: false
    console_output_satisfies_report: false
    invalidates_when:
    - source_phase_rerun
    - schema_invalid
    - phase_output_gate_failed
    - revision_invalidates_output
    may_be_replaced_by_revision: false
