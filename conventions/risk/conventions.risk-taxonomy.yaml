    - behavior_contract_exists
    - final_validation
    medium:
    - codebase_reconnaissance_if_context_available
    - artifact_action_validation
    - dependency_validation
    - final_validation
    high:
    - change_impact_analysis
    - compatibility_review_if_contract_boundary
    - test_plan
    - checkpoint_grouped_implementation_sequence
    - final_validation
    critical:
    - blocking_uncertainties_resolved
    - rollback_or_recovery_plan
    - integration_or_contract_test_review
    - final_validation
  semantic_depth_restoration:
    enriched_generic_risk_concern_definitions: true
  risk_level_definitions:
    low:
      definition: 'Low risk: localized, reversible change with no public contract, persistence, security, or cross-module
        impact.'
      meaning: Represents the low case within the risk level taxonomy.
      detection_signals:
      - low signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches low
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - risk level decisions using low must include reason and evidence
      escalation: standard gates are sufficient unless later triggers raise risk
      required_checks:
      - basic behavior validation
      - changed file scope check
    medium:
      definition: 'Medium risk: limited shared impact or moderate uncertainty requiring impact review and standard test coverage.'
      meaning: Represents the medium case within the risk level taxonomy.
      detection_signals:
      - medium signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches medium
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - risk level decisions using medium must include reason and evidence
      escalation: requires explicit impact and test derivation before implementation
      required_checks:
      - risk evidence
      - impact review
      - test plan
    high:
      definition: 'High risk: public contract, dependency, integration, persistence, migration, security, or broad refactor
        impact is possible.'
      meaning: Represents the high case within the risk level taxonomy.
      detection_signals:
      - high signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches high
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - risk level decisions using high must include reason and evidence
      escalation: tighten gates to strict and require followup classification/validation
      required_checks:
      - compatibility/dependency/boundary review when relevant
      - pre-implementation gate strict pass
    critical:
      definition: 'Critical risk: change may cause data loss, security exposure, breaking external behavior, production outage,
        or irreversible migration.'
      meaning: Represents the critical case within the risk level taxonomy.
      detection_signals:
      - critical signals are present in the request, codebase evidence, or prior phase reports
      choose_when:
      - the active evidence best matches critical
      - no more specific vocabulary value applies
      reject_when:
      - evidence is absent or contradictory
      - a more specific or more severe value applies
      required_evidence:
      - source report reference or explicit no_evidence_available marker
      validation_rules:
      - risk level decisions using critical must include reason and evidence
      escalation: block implementation until explicit approval, rollback/mitigation, and full validation plan exist
      required_checks:
      - approval
      - rollback or mitigation plan
      - strict validation
      - final unresolved item review
