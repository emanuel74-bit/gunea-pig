version: '1.0'
file:
  name: conventions.risk-taxonomy.yaml
  path: risk/conventions.risk-taxonomy.yaml
  role: risk_taxonomy_contract
  executability: vocabulary
purpose: Define risk levels, contexts, concerns, signals, escalation rules, and required checks by risk level.
ownership:
  owns:
  - risk_level_enum
  - risk_context_enum
  - risk_concern_taxonomy
  - risk_signal_definitions
  - risk_escalation_rules
  - required_checks_by_risk_level
  does_not_own:
  - risk_classification_process
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - risk_taxonomy_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  risk_level_enum:
    allowed:
    - low
    - medium
    - high
    - critical
  risk_context_enum:
    allowed:
    - design_risk
    - implementation_risk
    - change_risk
    - refactor_risk
    - integration_risk
    - migration_risk
    - runtime_risk
    - operational_risk
    - testing_risk
  risk_concerns:
    behavior:
      definition: Risk that externally observable behavior changes, regresses, or diverges from the behavior contract.
      detection_signals:
      - behavior_signal_detected
      - behavior_surface_changed
      requires_review_when:
      - behavior_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    public_contract:
      definition: Risk that a public/API/module/event contract changes in a way consumers can observe or break.
      detection_signals:
      - public_contract_signal_detected
      - public_contract_surface_changed
      requires_review_when:
      - public_contract_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    security:
      definition: Risk affecting confidentiality, integrity, availability, trust boundaries, or secure defaults.
      detection_signals:
      - security_signal_detected
      - security_surface_changed
      requires_review_when:
      - security_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    authentication:
      definition: Risk affecting identity verification, session validity, credentials, or auth flow correctness.
      detection_signals:
      - authentication_signal_detected
      - authentication_surface_changed
      requires_review_when:
      - authentication_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    authorization:
      definition: Risk affecting permissions, access checks, role scope, tenant access, or policy enforcement.
      detection_signals:
      - authorization_signal_detected
      - authorization_surface_changed
      requires_review_when:
      - authorization_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    tenant_boundary:
      definition: Risk that data, permissions, or behavior leaks across tenant/account/workspace boundaries.
      detection_signals:
      - tenant_boundary_signal_detected
      - tenant_boundary_surface_changed
      requires_review_when:
      - tenant_boundary_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    persistence:
      definition: Risk affecting stored data shape, read/write consistency, repository behavior, or durability.
      detection_signals:
      - persistence_signal_detected
      - persistence_surface_changed
      requires_review_when:
      - persistence_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    migration:
      definition: Risk from schema/data migrations, backfills, rollback behavior, or version compatibility.
      detection_signals:
      - migration_signal_detected
      - migration_surface_changed
      requires_review_when:
      - migration_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    data_loss:
      definition: Risk that existing or future persisted data may be lost, corrupted, made unreachable, or incorrectly transformed.
      detection_signals:
      - data_loss_signal_detected
      - data_loss_surface_changed
      requires_review_when:
      - data_loss_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    external_integration:
      definition: Risk from third-party APIs, queues, webhooks, SDKs, providers, network behavior, or external contracts.
      detection_signals:
      - external_integration_signal_detected
      - external_integration_surface_changed
      requires_review_when:
      - external_integration_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    payment:
      definition: Risk affecting money movement, billing, pricing, invoices, refunds, payment provider callbacks, or financial
        correctness.
      detection_signals:
      - payment_signal_detected
      - payment_surface_changed
      requires_review_when:
      - payment_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    async_processing:
      definition: Risk from asynchronous execution where ordering, visibility, retries, delays, concurrency, or eventual consistency
        affects behavior.
      detection_signals:
      - async_processing_signal_detected
      - async_processing_surface_changed
      requires_review_when:
      - async_processing_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    idempotency:
      definition: Risk that repeated requests/messages/jobs produce duplicate side effects or fail to safely handle retries.
      detection_signals:
      - idempotency_signal_detected
      - idempotency_surface_changed
      requires_review_when:
      - idempotency_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    retry:
      definition: Risk that retry behavior causes duplicate work, stuck loops, backoff failures, timeout amplification, or
        inconsistent state.
      detection_signals:
      - retry_signal_detected
      - retry_surface_changed
      requires_review_when:
      - retry_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    performance:
      definition: Risk that latency, throughput, memory, CPU, or query cost regresses.
      detection_signals:
      - performance_signal_detected
      - performance_surface_changed
      requires_review_when:
      - performance_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    observability:
      definition: Risk that failures cannot be detected, traced, logged, or diagnosed in operation.
      detection_signals:
      - observability_signal_detected
      - observability_surface_changed
      requires_review_when:
      - observability_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    runtime_wiring:
      definition: Risk from DI/provider registration, module imports, lifecycle ordering, or runtime configuration.
      detection_signals:
      - runtime_wiring_signal_detected
      - runtime_wiring_surface_changed
      requires_review_when:
      - runtime_wiring_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
    testing_gap:
      definition: Risk that required behavior, regression surface, failure mode, or contract compatibility lacks executable
        validation.
      detection_signals:
      - testing_gap_signal_detected
      - testing_gap_surface_changed
      requires_review_when:
      - testing_gap_surface_changed
      - risk_level_high_or_unknown
      must_not_be_used_for:
      - local_renaming_without_global_taxonomy_match
  risk_levels:
    low:
      definition: low severity risk.
      required_checks:
      - id: RISK-CONVENTIONS-RISK-TAXONOMY-YAML-RC-001
        check: final_validation
    medium:
      definition: medium severity risk.
      required_checks:
      - id: RISK-CONVENTIONS-RISK-TAXONOMY-YAML-RC-001
        check: final_validation
    high:
      definition: high severity risk.
      required_checks:
      - id: RISK-CONVENTIONS-RISK-TAXONOMY-YAML-RC-001
        check: final_validation
    critical:
      definition: critical severity risk.
      required_checks:
      - id: RISK-CONVENTIONS-RISK-TAXONOMY-YAML-RC-001
        check: final_validation
  context_sensitive_risk_rules:
    design_risk:
      emphasize:
      - required_checks_for_design_risk
    implementation_risk:
      emphasize:
      - required_checks_for_implementation_risk
    change_risk:
      emphasize:
      - required_checks_for_change_risk
    refactor_risk:
      emphasize:
      - required_checks_for_refactor_risk
    integration_risk:
      emphasize:
      - required_checks_for_integration_risk
    migration_risk:
      emphasize:
      - required_checks_for_migration_risk
    runtime_risk:
      emphasize:
      - required_checks_for_runtime_risk
    operational_risk:
      emphasize:
      - required_checks_for_operational_risk
    testing_risk:
      emphasize:
      - required_checks_for_testing_risk
  required_checks_by_risk_level:
    low:
    - behavior_contract_exists
    - final_validation
    medium:
    - codebase_reconnaissance_if_context_available
    - artifact_action_validation
    - dependency_validation
    - final_validation
    high:
    - change_impact_analysis
    - compatibility_review_if_contract_boundary
    - test_plan
    - checkpoint_grouped_implementation_sequence
    - final_validation
    critical:
    - blocking_uncertainties_resolved
    - rollback_or_recovery_plan
    - integration_or_contract_test_review
    - final_validation
  semantic_depth_restoration:
    enriched_generic_risk_concern_definitions: true
validation:
  fail_conditions:
  - id: RISK-CONVENTIONS-RISK-TAXONOMY-YAML-FC-001
    condition: risk_level_set_without_risk_context
    message: Risk level set without risk context.
    severity: error
    owner: risk/conventions.risk-taxonomy.yaml
  - id: RISK-CONVENTIONS-RISK-TAXONOMY-YAML-FC-002
    condition: critical_signal_not_escalated_to_critical
    message: Critical signal not escalated to critical.
    severity: error
    owner: risk/conventions.risk-taxonomy.yaml
  required_checks: []
