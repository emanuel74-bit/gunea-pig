version: '1.0'
file:
  name: conventions.risk-taxonomy.yaml
  path: risk/conventions.risk-taxonomy.yaml
  role: risk_vocabulary_contract
  executability: vocabulary
purpose: Define risk levels, contexts, concerns, signal types, and record schemas used by all risk decisions.
ownership:
  owns:
  - risk_level_enum
  - risk_level_definitions
  - risk_context_enum
  - risk_context_definitions
  - risk_concern_enum
  - risk_concern_definitions
  - risk_signal_type_enum
  - risk_signal_type_definitions
  - risk_record_schema
  - risk_signal_schema
  - risk_classification_report_schema
  does_not_own:
  - risk signal normalization
  - risk classification algorithm
  - risk escalation policy
  - risk validation algorithm
activation:
  mode: conditional
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - risk_taxonomy
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  optional_files: []
sections:
  risk_level_enum:
    allowed:
    - low
    - medium
    - high
    - critical
  risk_level_definitions:
    low:
      definition: Localized, reversible, well-understood change with limited blast radius and clear validation path.
      positive_signals:
      - single artifact or contained module change
      - no public contract change
      - no persistence or external system effect
      - tests already cover affected behavior
      - rollback is trivial
      negative_signals:
      - public surface may change
      - data migration may be needed
      - unknown consumers exist
      - multiple subsystems affected
      default_gate_strictness: standard
      implementation_policy: allowed_after_required_phase_outputs_validate
      blocks_implementation: false
    medium:
      definition: Change with bounded but non-trivial impact requiring explicit impact review, targeted tests, and gate validation.
      positive_signals:
      - multiple files or shared artifact touched
      - some call-site updates likely
      - behavior surface is affected but consumers are known
      - new dependency or boundary crossing introduced with controlled scope
      negative_signals:
      - unknown consumers
      - irreversible data change
      - security-sensitive behavior
      - distributed transaction or external system failure mode
      default_gate_strictness: strict
      implementation_policy: allowed_after_impact_and_test_plans_validate
      blocks_implementation: false
    high:
      definition: Change with significant blast radius, compatibility concerns, boundary risks, data risks, or uncertain downstream
        effects.
      positive_signals:
      - public contract change possible
      - persistence model or migration involved
      - cross-module dependency direction changes
      - unknown dynamic references
      - integration failure modes or retry/idempotency concerns
      - large refactor or behavior-preservation uncertainty
      negative_signals:
      - all consumers known and compatibility is additive
      - no runtime behavior change and characterization exists
      default_gate_strictness: strict
      implementation_policy: blocked_until_required_followups_resolved
      blocks_implementation: true
    critical:
      definition: Change that can cause data loss, security exposure, production outage, irreversible migration damage, or
        widespread compatibility breakage.
      positive_signals:
      - data loss possible
      - breaking public contract with unknown consumers
      - security or authorization boundary affected
      - irreversible migration without rollback
      - distributed workflow compensation required
      - production-critical runtime dependency changed
      negative_signals:
      - risk eliminated by validated migration/rollback plan and explicit approval
      default_gate_strictness: strict_on_data_safety
      implementation_policy: blocked_until_approval_and_required_safety_reports_pass
      blocks_implementation: true
  risk_context_enum:
    allowed:
    - design_risk
    - implementation_risk
    - change_risk
    - refactor_risk
    - integration_risk
    - migration_risk
    - runtime_risk
    - operational_risk
    - testing_risk
  risk_context_definitions:
    design_risk:
      definition: Risk caused by unclear, unstable, or over-coupled design choices before implementation.
      signals:
      - unclear abstraction boundary
      - pattern selected without pressure
      - mixed responsibility artifact
      - speculative shared code
      primary_consumers:
      - architecture_decomposition
      - structure_rendering
      - final_validation
    implementation_risk:
      definition: Risk caused by the concrete code-change plan, edit scope, or ability to apply changes safely.
      signals:
      - many files changed
      - sequence has unsafe temporary states
      - implementation requires forbidden scope
      - manual migration steps needed
      primary_consumers:
      - implementation_sequence
      - pre_implementation_gate
      - implementation
    change_risk:
      definition: Risk caused by the difference between current and intended behavior or structure.
      signals:
      - behavior change unclear
      - large delta from current implementation
      - existing tests do not describe old behavior
      primary_consumers:
      - change_impact_analysis
      - test_derivation
    refactor_risk:
      definition: Risk that a behavior-preserving refactor will accidentally alter behavior or compatibility.
      signals:
      - behavior preservation uncertain
      - characterization tests missing
      - large move/split/extract actions selected
      primary_consumers:
      - refactor_strategy_selection
      - test_derivation
      - final_validation
    integration_risk:
      definition: Risk caused by external systems, queues, clients, webhooks, APIs, events, or cross-service contracts.
      signals:
      - external provider semantics involved
      - retry/idempotency needed
      - message contract changed
      - network or eventual-consistency behavior affected
      primary_consumers:
      - boundary_contract_classification
      - dependency_classification
      - test_derivation
    migration_risk:
      definition: Risk caused by data migration, schema evolution, backfill, compatibility windows, or rollback constraints.
      signals:
      - migration required
      - backfill required
      - rollback plan missing
      - dual-read/write period needed
      primary_consumers:
      - change_impact_analysis
      - implementation_sequence
      - pre_implementation_gate
    runtime_risk:
      definition: Risk caused by runtime behavior, performance, concurrency, lifecycle, resource use, or operational failure
        mode.
      signals:
      - concurrency behavior changed
      - performance-sensitive path touched
      - resource cleanup uncertain
      - runtime dependency changed
      primary_consumers:
      - implementation_sequence
      - post_implementation_validation
    operational_risk:
      definition: Risk caused by deployment, rollout, observability, configuration, or production operations.
      signals:
      - feature flag needed
      - config value changed
      - observability missing
      - manual rollout step required
      primary_consumers:
      - pre_implementation_gate
      - final_validation
    testing_risk:
      definition: Risk caused by insufficient validation, missing coverage, untestable behavior, or unreliable test signals.
      signals:
      - test gap exists
      - no validation command known
      - flaky test surface
      - behavior not directly observable
      primary_consumers:
      - test_derivation
      - post_implementation_validation
      - final_validation
  risk_concern_enum:
    allowed:
    - public_contract
    - boundary_integrity
    - dependency_direction
    - data_safety
    - behavior_preservation
    - test_coverage
    - operational_rollout
    - security_privacy
    - performance_capacity
    - concurrency_consistency
  risk_concern_definitions:
    public_contract:
      definition: User or consumer-visible API, event, DTO, module export, CLI, or message contract may change.
      requires_explicit_status: true
    boundary_integrity:
      definition: Layer, module, transport, domain, persistence, or external integration boundary may leak or be crossed incorrectly.
      requires_explicit_status: true
    dependency_direction:
      definition: Dependency direction, import path, or runtime coupling may violate architecture rules.
      requires_explicit_status: true
    data_safety:
      definition: Persistence shape, migration, backfill, deletion, or rollback may affect stored data.
      requires_explicit_status: true
    behavior_preservation:
      definition: Existing behavior must be preserved but is not fully locked by tests or evidence.
      requires_explicit_status: true
    test_coverage:
      definition: Required validation is missing, incomplete, unreliable, or disconnected from acceptance criteria.
      requires_explicit_status: true
    operational_rollout:
      definition: Deployment, configuration, rollout, observability, or runtime safety requirements are unclear.
      requires_explicit_status: true
    security_privacy:
      definition: Authorization, secrets, personal data, trust boundaries, or sensitive operations may be affected.
      requires_explicit_status: true
    performance_capacity:
      definition: Latency, throughput, resource use, memory, batching, or scaling behavior may be affected.
      requires_explicit_status: true
    concurrency_consistency:
      definition: Ordering, idempotency, transactionality, eventual consistency, locking, or race conditions may be affected.
      requires_explicit_status: true
  risk_signal_type_enum:
    allowed:
    - evidence_signal
    - absence_signal
    - conflict_signal
    - escalation_signal
    - deescalation_signal
  risk_signal_type_definitions:
    evidence_signal:
      definition: Fact observed in request, report, code, dependency graph, or validation output.
      confidence_default: medium
    absence_signal:
      definition: Missing expected evidence that increases uncertainty or requires followup.
      confidence_default: medium
    conflict_signal:
      definition: Two or more reports, rules, or observations contradict each other.
      confidence_default: high
    escalation_signal:
      definition: Signal that directly raises risk level or requires additional gate strictness.
      confidence_default: high
    deescalation_signal:
      definition: Signal that lowers risk only when supported by concrete validation, tests, or bounded scope.
      confidence_default: medium
  risk_record_schema:
    required_fields:
    - risk_id
    - risk_level
    - risk_contexts
    - risk_concerns
    - signals
    - confidence
    - required_followups
    - blocking_status
    optional_fields:
    - source_reports
    - escalation_reason
    - deescalation_reason
    - accepted_by
    - expires_when
  risk_signal_schema:
    required_fields:
    - signal_id
    - signal_type
    - source_subsystem
    - source_ref
    - risk_context
    - risk_concern
    - weight
    - confidence
    - reason
    optional_fields:
    - supports_level
    - contradicts_level
    - evidence_refs
  risk_classification_report_schema:
    required_fields:
    - report_id
    - phase_id
    - risk_level
    - risk_contexts
    - risk_concerns
    - normalized_signals
    - classification_decisions
    - required_followups
    - gate_strictness_hint
    - blocking_status
    optional_fields:
    - deescalation_decisions
    - accepted_risks
    - unresolved_risks
validation:
  required_checks: []
  fail_conditions: []
