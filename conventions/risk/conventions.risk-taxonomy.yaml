version: '1.0'
file:
  name: conventions.risk-taxonomy.yaml
  path: risk/conventions.risk-taxonomy.yaml
  role: risk_taxonomy_contract
  executability: vocabulary
purpose: Define risk levels, contexts, concerns, signals, escalation rules, and required checks by risk level.
ownership:
  owns:
  - risk_level_enum
  - risk_context_enum
  - risk_concern_taxonomy
  - risk_signal_definitions
  - risk_escalation_rules
  - required_checks_by_risk_level
  does_not_own:
  - risk_classification_process
activation:
  mode: always
  activates_when: []
  skips_when: []
inputs:
  required: []
  optional: []
outputs:
  produces:
  - risk_taxonomy_registry
dependencies:
  required_files: []
  optional_files: []
sections:
  risk_level_enum:
    allowed:
    - low
    - medium
    - high
    - critical
  risk_context_enum:
    allowed:
    - design_risk
    - implementation_risk
    - change_risk
    - refactor_risk
    - integration_risk
    - migration_risk
    - runtime_risk
    - operational_risk
    - testing_risk
