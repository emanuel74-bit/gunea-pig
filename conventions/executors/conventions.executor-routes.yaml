version: '1.0'
file:
  name: conventions.executor-routes.yaml
  path: executors/conventions.executor-routes.yaml
  role: central_executor_route_map
  executability: router
purpose: Define the central route map that agents use to resolve declared executor
  route IDs into script-backed runtime actions.
ownership:
  owns:
  - central_executor_route_map
  - executor_route_lookup_rules
  - executor_route_namespace
  - executor_route_grouping_by_type
  does_not_own:
  - actual_script_implementation_code
  - subsystem_local_business_rules
  - phase_or_mission_authority
  - manual_script_selection_by_agents
activation:
  mode: on_demand
  activates_when:
  - script_execution_required
  - executor_route_resolution_required
  skips_when:
  - advisory_lookup_without_runtime_action
inputs:
  required: []
  optional:
  - declared_executor_routes
  - active_lifecycle_hook
  - changed_file_set
  - mission_context
  - phase_context
outputs:
  produces:
  - central_executor_route_map
  - executor_route_resolution_result
dependencies:
  required_files:
  - core/conventions.file-contract.yaml
  - executors/conventions.executor-contract.yaml
  optional_files: []
sections:
  route_resolution_rules:
    lookup_key: route_id
    namespace: global_route_namespace_with_optional_subsystem_prefix
    unknown_route_behavior: fail_closed
    script_path_authority: central_executor_route_map
    local_script_path_override: forbidden
    route_execution_order: declared_order_from_local_required_executor_routes
  executor_routes:
    validation:
      validate_executor_routes:
        description: Validate central executor routes and local route references.
        script: scripts/validate-executor-routes.ts
        required_inputs:
        - executor_routes
        - local_required_executor_routes
        produced_outputs:
        - executor_route_validation_result
        allowed_write_paths:
        - .ai/validation/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        failure_behavior: block
        consumers:
        - agents
        - multi-agent
        - execution
        executor_type: validation
      validate_route_invocation:
        description: Validate a normalized executor route invocation request before
          a route script runs; observe missing declared inputs while fail-closing
          unknown route IDs and direct script references.
        script: scripts/validate-route-invocation.ts
        required_inputs:
        - route_id
        - central_executor_route_map
        produced_outputs:
        - route_invocation_validation_result
        allowed_write_paths:
        - .ai/validation/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - before_phase_start
        - after_phase_output
        - before_mission_complete
        failure_behavior: block
        consumers:
        - executors
        - claude-code
        - missions
        - multi-agent
        executor_type: validation
      validate_route_output:
        description: Validate a route script result against the universal route output
          contract in observe/normalization mode.
        script: scripts/validate-route-output.ts
        required_inputs:
        - route_id
        - route_output
        - central_executor_route_map
        produced_outputs:
        - route_output_validation_result
        allowed_write_paths:
        - .ai/validation/**
        required_artifacts: []
        lifecycle_hooks:
        - after_phase_output
        - before_mission_complete
        failure_behavior: block
        consumers:
        - executors
        - claude-code
        - missions
        - multi-agent
        executor_type: validation
      validate_authority_topology:
        description: Validate compiled authority topology against distributed ownership
          declarations and single-owner rules.
        script: scripts/validate-authority-topology.ts
        required_inputs:
        - authority_topology
        - ownership_declarations
        produced_outputs:
        - authority_topology_validation_result
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts:
        - authority_topology
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        failure_behavior: block
        consumers:
        - core
        - executors
        - reports
        executor_type: validation
      validate_phase_output:
        description: Validate produced phase output against phase contracts and required
          evidence.
        script: scripts/validate-phase-output.ts
        required_inputs:
        - phase_output
        - phase_contract
        produced_outputs:
        - phase_validation_result
        allowed_write_paths:
        - .ai/validation/**
        required_artifacts:
        - phase_output
        lifecycle_hooks:
        - after_phase_output
        failure_behavior: block
        consumers:
        - phases
        - multi-agent
        - reports
        executor_type: validation
      validate_phase_bundle:
        description: Validate generated phase context bundle before an agent consumes
          it.
        script: scripts/validate-phase-bundle.ts
        required_inputs:
        - phase_context_bundle
        - phase_bundle_schema
        - active_phase_plan
        produced_outputs:
        - phase_bundle_validation_result
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts:
        - phase_context_bundle
        lifecycle_hooks:
        - before_phase_start
        failure_behavior: block
        consumers:
        - agents
        - multi-agent
        - phases
        - reports
        executor_type: validation
      validate_changed_files:
        description: Validate changed files and affected convention dependencies.
        script: scripts/validate-changed-files.ts
        required_inputs:
        - changed_file_set
        - reference_topology
        produced_outputs:
        - changed_file_validation_result
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts:
        - changed_file_manifest
        lifecycle_hooks:
        - after_file_change
        failure_behavior: block
        consumers:
        - execution
        - testing
        - reports
        executor_type: validation
      validate_references:
        description: Validate file, subsystem, contract, route, and runtime artifact
          references.
        script: scripts/validate-references.ts
        required_inputs:
        - parsed_convention_files
        produced_outputs:
        - reference_validation_result
        - reference_topology
        allowed_write_paths:
        - .ai/validation/**
        - .ai/topologies/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        failure_behavior: block
        consumers:
        - core
        - execution
        - reports
        executor_type: validation
      validate_runtime_artifacts:
        description: Validate runtime artifact topology, declarations, normalized
          paths, required identity fields, producer-route coverage, consumer lists,
          lifecycle, scope, and write modes.
        script: scripts/validate-runtime-artifacts.ts
        required_inputs:
        - runtime_artifact_topology
        - runtime_artifact_declarations
        - runtime_artifact_references
        - central_executor_route_map
        produced_outputs:
        - runtime_artifact_validation_result
        - runtime_artifact_enforcement_report
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts:
        - runtime_artifact_topology
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        failure_behavior: block
        consumers:
        - reports
        - gates
        - handoffs
        - revisions
        - multi-agent
        executor_type: validation
      validate_script_execution:
        description: Verify executor route scripts with fixture-based valid and invalid
          input cases, output shape checks, exit-code checks, and allowed-write-path
          checks.
        script: scripts/verify-scripts.ts
        required_inputs:
        - central_executor_route_map
        - script_implementations
        - script_test_fixtures
        produced_outputs:
        - script_verification_result
        - script_verification_report
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        failure_behavior: block
        consumers:
        - executors
        - testing
        - reports
        executor_type: validation
      validate_semantic_completeness:
        description: Validate semantic completeness of convention declarations, phase
          bundles, and phase outputs so work cannot pass with placeholders, vague
          executable content, missing required evidence, or shallow completion claims.
        script: scripts/validate-semantic-completeness.ts
        required_inputs:
        - semantic_completeness_contract
        - parsed_convention_files
        produced_outputs:
        - semantic_completeness_validation_result
        - semantic_completeness_report
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - after_phase_output
        - before_mission_complete
        failure_behavior: block
        consumers:
        - core
        - phases
        - multi-agent
        - reports
        - missions
        executor_type: validation
      validate_gate_result:
        description: Validate a script-produced gate result before Alpha or a downstream
          phase consumes it; reject manually authored gate decisions.
        script: scripts/validate-gate-result.ts
        required_inputs:
        - gate_result
        - gate_contract
        - validation_results
        produced_outputs:
        - gate_result_validation_result
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts:
        - gate_result
        lifecycle_hooks:
        - on_gate_check
        failure_behavior: block
        consumers:
        - gates
        - multi-agent
        - missions
        - phases
        executor_type: validation
      validate_handoff:
        description: Validate a script-produced handoff packet before the target agent
          or phase consumes it; reject manually authored handoff packets.
        script: scripts/validate-handoff.ts
        required_inputs:
        - agent_handoff_packet
        - target_agent_requirements
        - source_phase_output
        produced_outputs:
        - handoff_validation_result
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts:
        - agent_handoff_packet
        lifecycle_hooks:
        - before_handoff
        - after_handoff
        failure_behavior: block
        consumers:
        - handoffs
        - agents
        - multi-agent
        - phases
        executor_type: validation
      validate_revision_task:
        description: Validate a script-produced revision task before revision work
          starts or mission state records it as actionable; reject manually authored
          revision decisions.
        script: scripts/validate-revision-task.ts
        required_inputs:
        - revision_task
        - failure_result
        - remediation_mapping
        produced_outputs:
        - revision_task_validation_result
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts:
        - revision_task
        lifecycle_hooks:
        - on_validation_failure
        failure_behavior: block
        consumers:
        - revisions
        - risk
        - multi-agent
        - reports
        executor_type: validation
      validate_report_evidence:
        description: Validate that generated reports are backed by script-produced
          evidence records instead of agent-written claims.
        script: scripts/validate-report-evidence.ts
        required_inputs:
        - evidence_index
        - report_outputs
        - runtime_artifact_topology
        produced_outputs:
        - report_evidence_validation_result
        - report_evidence_validation_report
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts:
        - evidence_index
        lifecycle_hooks:
        - after_phase_output
        - before_mission_complete
        failure_behavior: block
        consumers:
        - reports
        - multi-agent
        - missions
        executor_type: validation
      validate_claude_execution_plan:
        description: Validate the generated Claude Code execution plan before Claude
          Code runs a mission or phase.
        script: scripts/validate-claude-execution-plan.ts
        required_inputs:
        - claude_execution_plan
        - central_executor_route_map
        - claude_stop_conditions
        produced_outputs:
        - claude_execution_plan_validation_result
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts:
        - claude_execution_plan
        lifecycle_hooks:
        - before_mission_start
        - before_phase_start
        failure_behavior: block
        consumers:
        - claude-code
        - multi-agent
        - reports
        executor_type: validation
      validate_claude_native_integration:
        description: Validate Claude Code native integration files, skills, subagents,
          hooks, and route-backed command usage.
        script: scripts/validate-claude-native-integration.ts
        required_inputs:
        - claude_project_files
        - central_executor_route_map
        - claude_native_integration_contract
        produced_outputs:
        - claude_native_integration_validation_result
        allowed_write_paths:
        - .ai/validation/**
        - .ai/reports/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        failure_behavior: block
        consumers:
        - claude-code
        - executors
        - reports
        executor_type: validation
      validate_validation_result:
        description: Validate and normalize validator output against the universal
          validation result contract while preserving existing validator pass/fail
          policy during rollout.
        script: scripts/validate-validation-result.ts
        required_inputs:
        - validation_result
        - validation_result_contract
        produced_outputs:
        - validation_result_contract_check
        - normalized_validation_result
        allowed_write_paths:
        - .ai/validation/**
        required_artifacts: []
        lifecycle_hooks:
        - after_phase_output
        - on_gate_check
        - on_validation_failure
        - before_mission_complete
        failure_behavior: block
        consumers:
        - core
        - executors
        - gates
        - reports
        - missions
        - multi-agent
        executor_type: validation
      validate_transition_legality:
        description: Validate requested mission phase transition against the transition
          legality graph in observe/warn mode.
        script: scripts/validate-transition-legality.ts
        required_inputs:
        - mission_id
        - mission_state
        - requested_next_phase
        - transition_legality_graph
        produced_outputs:
        - transition_legality_evaluation
        - transition_legality_warning
        allowed_write_paths:
        - .ai/validation/**
        required_artifacts:
        - mission_state
        - mission_journal
        - mission_checkpoint
        lifecycle_hooks:
        - before_phase_start
        - after_phase_output
        - before_mission_complete
        failure_behavior: warn
        consumers:
        - missions
        - multi-agent
        - claude-code
        - executors
        executor_type: validation
    compiler:
      compile_authority_topology:
        description: Compile distributed ownership declarations into an authority
          topology and conflict report.
        script: scripts/compile-authority-topology.ts
        required_inputs:
        - parsed_convention_files
        - ownership_declarations
        produced_outputs:
        - authority_topology
        - authority_conflict_report
        allowed_write_paths:
        - .ai/topologies/**
        - .ai/reports/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        failure_behavior: block
        consumers:
        - core
        - executors
        - execution
        executor_type: compiler
      compile_runtime_artifact_topology:
        description: Compile runtime artifact declarations and .ai usages into an
          artifact topology with path normalization, declaration coverage, producer-route
          inference, and conflict reporting.
        script: scripts/compile-runtime-artifact-topology.ts
        required_inputs:
        - runtime_artifact_declarations
        - runtime_artifact_references
        produced_outputs:
        - runtime_artifact_topology
        - artifact_conflict_report
        - runtime_artifact_reference_map
        allowed_write_paths:
        - .ai/topologies/**
        - .ai/reports/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        failure_behavior: block
        consumers:
        - reports
        - gates
        - handoffs
        - revisions
        executor_type: compiler
      collect_source_artifacts:
        description: Collect universal source artifact records, source file hashes,
          and lightweight dependency edges as source-truth evidence for later adapters
          and quality gates.
        script: scripts/collect-source-artifacts.ts
        required_inputs:
        - project_source_tree
        - source_artifact_model
        produced_outputs:
        - source_artifact_manifest
        - source_collection_report
        allowed_write_paths:
        - .ai/source-artifacts/**
        - .ai/reports/**
        - .ai/validation/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        - before_mission_complete
        failure_behavior: block
        consumers:
        - reports
        - validation
        - missions
        - execution
        - architecture
        executor_type: compiler
      analyze_typescript_source:
        description: Consume the universal source artifact manifest and emit TypeScript
          language-adapter evidence without enforcing framework or architecture quality
          policy.
        script: scripts/analyze-typescript-source.ts
        required_inputs:
        - source_artifact_manifest
        - language_adapter_contract
        - typescript_adapter_contract
        produced_outputs:
        - typescript_source_analysis
        - typescript_adapter_report
        allowed_write_paths:
        - .ai/source-artifacts/**
        - .ai/reports/**
        - .ai/validation/**
        required_artifacts:
        - source_artifact_manifest
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        - before_mission_complete
        failure_behavior: block
        consumers:
        - source
        - validation
        - reports
        - architecture
        executor_type: compiler
      analyze_nestjs_source:
        description: Consume TypeScript language-adapter evidence and emit NestJS
          framework-adapter evidence without enforcing framework or architecture quality
          policy.
        script: scripts/analyze-nestjs-source.ts
        required_inputs:
        - typescript_source_analysis
        - framework_adapter_contract
        - nestjs_adapter_contract
        produced_outputs:
        - nestjs_source_analysis
        - nestjs_adapter_report
        allowed_write_paths:
        - .ai/source-artifacts/**
        - .ai/reports/**
        - .ai/validation/**
        required_artifacts:
        - typescript_source_analysis
        lifecycle_hooks:
        - before_mission_start
        - after_file_change
        - before_mission_complete
        failure_behavior: block
        consumers:
        - adapters
        - source
        - validation
        - reports
        - architecture
        executor_type: compiler
      resolve_mission_mode_policy:
        description: Resolve mission-mode policy in observe mode from mission profile,
          mission state, and adapter evidence without enforcing score thresholds.
        script: scripts/resolve-mission-mode-policy.ts
        required_inputs:
        - mission_profile
        - mission_mode_policy_contract
        produced_outputs:
        - resolved_mission_mode_policy
        - mission_mode_policy_report
        allowed_write_paths:
        - .ai/policy/**
        - .ai/reports/**
        - .ai/validation/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        - before_phase_start
        - after_file_change
        - before_mission_complete
        failure_behavior: warn
        consumers:
        - policy
        - missions
        - validation
        - reports
        - gates
        - executors
        executor_type: compiler
    generator:
      generate_phase_bundle:
        description: Generate minimal phase context bundle from active mission, phase
          contract, owner agent, executor routes, and relevant convention slices.
        script: scripts/generate-phase-bundle.ts
        required_inputs:
        - mission_context
        - active_phase
        - active_phase_plan
        - phase_contract
        - owner_agent_contract
        - central_executor_route_map
        - loading_group_map
        - required_output_templates
        produced_outputs:
        - phase_context_bundle
        - phase_bundle_manifest
        allowed_write_paths:
        - .ai/bundles/**
        required_artifacts:
        - active_phase_plan
        - phase_contract
        lifecycle_hooks:
        - before_phase_start
        failure_behavior: block
        consumers:
        - agents
        - multi-agent
        - phases
        - executors
        executor_type: generator
      generate_claude_execution_plan:
        description: Generate the Claude Code mission execution plan from the harness
          contract and central executor routes.
        script: scripts/generate-claude-execution-plan.ts
        required_inputs:
        - claude_code_harness_contract
        - central_executor_route_map
        - mission_context
        produced_outputs:
        - claude_execution_plan
        allowed_write_paths:
        - .ai/claude/**
        - .ai/reports/**
        - .ai/validation/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        failure_behavior: block
        consumers:
        - claude-code
        - multi-agent
        - reports
        executor_type: generator
    gate:
      run_gate_check:
        description: Run declared gate checks and write the only authoritative machine-readable
          gate result; agents and Alpha may not manually decide gate pass/fail.
        script: scripts/run-gate-check.ts
        required_inputs:
        - gate_id
        - gate_inputs
        - validation_results
        produced_outputs:
        - gate_result
        allowed_write_paths:
        - .ai/gates/**
        - .ai/reports/**
        required_artifacts:
        - validation_result
        lifecycle_hooks:
        - on_gate_check
        failure_behavior: block
        consumers:
        - gates
        - multi-agent
        - missions
        executor_type: gate
    handoff:
      prepare_agent_handoff:
        description: Generate the only authoritative handoff packet from a source
          phase output and target agent requirements; agents may not manually author
          handoff packets.
        script: scripts/prepare-agent-handoff.ts
        required_inputs:
        - source_phase_output
        - target_agent_requirements
        produced_outputs:
        - agent_handoff_packet
        allowed_write_paths:
        - .ai/handoffs/**
        required_artifacts:
        - source_phase_output
        lifecycle_hooks:
        - before_handoff
        failure_behavior: block
        consumers:
        - handoffs
        - agents
        - multi-agent
        executor_type: handoff
    revision:
      create_revision_task:
        description: Generate the only authoritative revision task/decision from a
