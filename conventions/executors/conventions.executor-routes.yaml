        script: scripts/create-revision-task.ts
        required_inputs:
        - failure_result
        - remediation_mapping
        produced_outputs:
        - revision_task
        allowed_write_paths:
        - .ai/revisions/**
        - .ai/reports/**
        required_artifacts:
        - failure_result
        lifecycle_hooks:
        - on_validation_failure
        failure_behavior: revise
        consumers:
        - revisions
        - risk
        - multi-agent
        executor_type: revision
    report:
      collect_phase_report:
        description: Collect phase evidence, validation results, gate outcomes, and
          unresolved issues into a phase report.
        script: scripts/collect-phase-report.ts
        required_inputs:
        - phase_output
        - validation_results
        - gate_results
        produced_outputs:
        - phase_report
        allowed_write_paths:
        - .ai/reports/**
        required_artifacts:
        - phase_output
        lifecycle_hooks:
        - after_phase_output
        failure_behavior: warn
        consumers:
        - reports
        - phases
        - multi-agent
        executor_type: report
      collect_evidence:
        description: Collect script-produced validation, changed-file, gate, handoff,
          revision, bundle, topology, and phase-report evidence into a canonical evidence
          index.
        script: scripts/collect-evidence.ts
        required_inputs:
        - validation_results
        - changed_file_results
        - gate_results
        - handoff_packets
        - revision_tasks
        - phase_reports
        - runtime_artifact_topology
        produced_outputs:
        - evidence_index
        - evidence_collection_report
        allowed_write_paths:
        - .ai/reports/**
        required_artifacts: []
        lifecycle_hooks:
        - after_phase_output
        - before_mission_complete
        failure_behavior: block
        consumers:
        - reports
        - multi-agent
        - missions
        - gates
        - handoffs
        - revisions
        executor_type: report
      generate_final_mission_report:
        description: Generate the final mission report from collected executor/script
          evidence, validation results, transition artifacts, and unresolved issue
          records.
        script: scripts/generate-final-mission-report.ts
        required_inputs:
        - evidence_index
        - phase_reports
        - validation_results
        - gate_results
        - handoff_packets
        - revision_tasks
        - unresolved_issues
        produced_outputs:
        - final_mission_report
        - mission_evidence_summary
        allowed_write_paths:
        - .ai/reports/**
        required_artifacts:
        - evidence_index
        lifecycle_hooks:
        - before_mission_complete
        failure_behavior: block
        consumers:
        - reports
        - missions
        - multi-agent
        - agents
        executor_type: report
    mission_controller:
      initialize_mission:
        description: Initialize authoritative mission runtime state in observe mode
          before Claude begins phase execution.
        script: scripts/initialize-mission.ts
        required_inputs:
        - mission_id
        - mission_context
        produced_outputs:
        - mission_state
        - mission_controller_event
        allowed_write_paths:
        - .ai/missions/**
        - .ai/validation/**
        required_artifacts: []
        lifecycle_hooks:
        - before_mission_start
        failure_behavior: block
        consumers:
        - missions
        - multi-agent
        - claude-code
        - reports
        executor_type: mission_controller
      inspect_mission_state:
