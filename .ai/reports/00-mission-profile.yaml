report_id: 00-mission-profile
phase_id: mission_profile_selection
schema_version: "1.0"
status: complete

summary: >
  Mission profile selected for greenfield implementation of the VDF-Based Video
  Similarity Pipeline — three NestJS microservices (Video Scan Staging Service,
  VDF Batch Scanner Service, Similarity Grouping Service) communicating via
  RabbitMQ, persisting to MongoDB, using S3-compatible storage, and integrating
  with the VDF/Video Duplicate Finder engine. Selected profile: medium_feature.

inputs_consumed:
  - source: docs/system-requirements.md
    type: mission_request
    notes: >
      10-section requirements document covering technology constraints, three
      service definitions with functional/idempotency/failure/boundary
      requirements, RabbitMQ message schemas, durable result handoff, batch
      claiming, safe cleanup, similarity threshold policy, scan state machine,
      and non-functional requirements.

decisions:
  - decision_id: PROFILE-SEL-001
    decision_type: mission_profile_selection
    selected_value: medium_feature
    reason_summary: >
      The mission builds three new NestJS microservices from scratch, each
      touching multiple new modules and artifacts (controllers, services,
      repositories, message consumers/producers, DTOs, schemas). This matches
      medium_feature purpose: "Add or modify a feature touching existing modules
      or multiple artifacts." No existing codebase is modified; all three
      services are greenfield. The profile includes all required design and
      implementation phases. The 'strict' gate strictness is appropriate for a
      new production system with complex cross-service contracts.
    evidence: docs/system-requirements.md — sections 3.1–3.3 (three bounded
      services), section 4 (RabbitMQ message contracts), section 6 (durable
      batch claiming), section 9 (scan state machine).

evidence_refs:
  - docs/system-requirements.md

triggers_emitted: []

gate_result:
  gate_id: gate.mission_profile_selection.output
  status: pass
  failures: []

selected_profile: medium_feature

selection_rule: >
  Greenfield multi-service implementation with multiple new modules/artifacts,
  requiring full design-through-implementation phase coverage. medium_feature
  is the canonical profile for adding features that touch multiple artifacts
  and requires complete architecture, role, structure, test, and implementation
  phase coverage.

rejected_profiles:
  - profile_id: small_feature
    reason: >
      Small_feature omits boundary_contract_classification,
      dependency_classification, call_site_impact_analysis, and
      change_impact_analysis as required phases. These are necessary for a
      three-service system with explicit boundary constraints.
  - profile_id: integration_change
    reason: >
      Purpose is "Change external integrations" implying modification of
      existing code. This is a greenfield build, not a change.
  - profile_id: persistence_change
    reason: >
      Purpose is narrowly scoped to persistence behavior changes. System
      scope is broader: three full services.
  - profile_id: large_refactor
    reason: >
      Refactoring profile designed for behavior-preserving restructuring of
      existing code. Not applicable to greenfield.
  - profile_id: bugfix
    reason: Not a bug fix.
  - profile_id: cleanup_only
    reason: Not a cleanup task.
  - profile_id: api_contract_change
    reason: >
      No existing API contract is being changed; all contracts are new.
  - profile_id: test_only
    reason: Implementation of production code is required.
  - profile_id: convention_system_edit
    reason: Convention system is not being modified.

reason_summary: >
  medium_feature selected because the mission adds a complete new system (three
  NestJS services) spanning multiple artifacts, requiring full architecture
  design, role assignment, structure rendering, and implementation phases.
  No existing production codebase is modified. Gate strictness 'strict' is
  appropriate.

profile_gate_strictness: strict

active_phase_plan_seed:
  profile: medium_feature
  required_phases:
    - mission_profile_selection
    - mission_initialization
    - active_context_manifest
    - phase_accounting
    - local_alignment
    - boundary_contract_classification
    - dependency_classification
    - call_site_impact_analysis
    - change_impact_analysis
    - behavior_contract
    - codebase_reconnaissance
    - architecture_decomposition
    - draft_role_pass
    - pattern_pressure_detection
    - artifact_reuse_analysis
    - artifact_action_resolution
    - final_role_assignment
    - pattern_selection
    - structure_rendering
    - test_derivation
    - implementation_sequence
    - checkpoint_validation_plan
    - pre_implementation_gate
    - implementation
    - post_implementation_validation
    - trigger_review
    - report_artifact_validation
    - final_validation
  conditional_phases:
    - refactor_strategy_selection
    - failure_classification
    - feedback_repair
  forbidden_phases: []
  gate_strictness: strict

produced_outputs:
  - .ai/reports/00-mission-profile.yaml
